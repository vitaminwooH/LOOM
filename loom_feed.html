    transition: box-shadow 0.34s ease, border-color 0.3s ease;
  }
  .designer-card:hover .designer-face { box-shadow: var(--shadow-hover); border-color: var(--border-strong); }
  .designer-card.is-active .designer-face { border-color: var(--ink); }
  .designer-face-back { transform: rotateY(180deg); }

  /* A real photo when there is one, a studio-tinted initials panel when there
     isn't — identical box either way, so a studio filling in photos over time
     never reflows the roster.

     Absolutely filling the card, not a flex row above the label: centred in the
     *photo box* put the initials well above the card's real centre, because the
     box stopped where the name/role bar began. Filling the card also lets a
     real photo bleed behind that bar instead of being cut off square at it. */
  .designer-photo {
    position: absolute;
    inset: 0;
    border-radius: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(46px, 6vw, 104px);
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1;
    color: var(--studio-color, var(--ink));
    background: var(--studio-tint, rgba(20, 20, 20, 0.05));
    background-size: cover;
    background-position: center;
  }
  .designer-photo.has-photo { color: transparent; }

  .designer-card-text {
    position: relative; /* above the photo, which now fills the card */
    margin-top: auto;
    background: var(--surface);
    padding: clamp(16px, 2.2vh, 26px) clamp(18px, 1.7vw, 28px) clamp(18px, 2.4vh, 28px);
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }
  /* Two lines rather than an ellipsis. Truncating a person's name at 25px on a
     card that is mostly empty space is the one place clipping is least
     defensible — "A Person With A Remarkably Long N…" is not their name. The
     clamp still stops a pathological entry from pushing the role off the card. */
  .designer-name {
    font-size: clamp(17px, 1.5vw, 25px);
    font-weight: 650;
    line-height: 1.2;
    color: var(--ink);
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .designer-role {
    font-size: clamp(12.5px, 1vw, 16px);
    color: var(--ink-dim);
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* What they are in the middle of, on the front, under the role. Marked with
     the studio's colour so it reads as current rather than as a second title. */
  .designer-now {
    margin-top: 2px;
    padding-left: 9px;
    border-left: 2px solid var(--studio-color, var(--ink-faint));
    font-size: clamp(11px, 0.85vw, 13px);
    line-height: 1.35;
    color: var(--ink-faint);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ---------- the back face ----------
     Everything here has to fit without scrolling. A card that grows a scrollbar
     the moment you hover it is a card that flinches, and the bar itself lands
     on top of the link text — the one thing you turned the card over to read.
     Five links is the ceiling (DESIGNER_LINK_KINDS), so the metrics below are
     sized against exactly that. */
  .designer-face-back {
    justify-content: flex-start;
    gap: clamp(9px, 1.4vh, 15px);
    padding: clamp(16px, 2.2vh, 28px) clamp(15px, 1.5vw, 24px);
    overflow: hidden;
  }
  .designer-back-head { flex-shrink: 0; min-width: 0; }
  .designer-back-head .designer-name { white-space: normal; font-size: clamp(15px, 1.3vw, 21px); }
  .designer-back-head .designer-role { margin-top: 3px; white-space: normal; font-size: clamp(11.5px, 0.9vw, 14px); }

  /* Working on / Can help with / Recently shared — the three reasons to write
     to somebody, above the addresses you would write to. */
  .designer-fact { flex-shrink: 0; min-width: 0; }
  .designer-fact-label {
    font-size: clamp(8.5px, 0.62vw, 9.5px);
    letter-spacing: 0.13em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-faint);
    margin-bottom: 3px;
  }
  .designer-fact-value {
    font-size: clamp(11px, 0.85vw, 13px);
    line-height: 1.4;
    color: var(--ink);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* The contact block is now the tail of the card, so it gets a rule above it
     rather than a heading competing with the three that matter. */
  .designer-contact-label {
    flex-shrink: 0;
    margin-top: auto;
    padding-top: clamp(8px, 1.2vh, 12px);
    border-top: 1px solid var(--border);
  }

  .designer-links {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-height: 0;
    overflow: hidden; /* no scrollbar, in either axis, ever */
    margin: 0 -6px;
    padding: 0 6px;
  }
  .designer-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: clamp(4px, 0.7vh, 7px) 8px;
    margin: 0 -8px;
    border-radius: 9px;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: clamp(10.5px, 0.82vw, 12.5px);
    line-height: 1.3;
    flex-shrink: 0;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .designer-link:hover { background: rgba(20, 20, 20, 0.05); color: var(--ink); }
  .designer-link-icon { flex-shrink: 0; display: flex; color: var(--studio-color, var(--ink-dim)); }
  .designer-link-icon svg { width: clamp(12px, 1vw, 15px); height: clamp(12px, 1vw, 15px); }
  .designer-link-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* the only thing on this screen that navigates — deliberately a button you
     have to aim at, not the whole card (see buildDesignerCard) */
  .designer-see-work {
    flex-shrink: 0;
    margin-top: auto;
    padding: clamp(7px, 1.1vh, 11px) 14px;
    border-radius: 999px;
    border: 1.5px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: clamp(11px, 0.9vw, 12.5px);
    font-weight: 650;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .designer-see-work:hover { background: var(--ink); color: #fff; transform: translateY(-1px); }
  .designer-see-work:active { transform: translateY(0) scale(0.97); }

  /* the pencil only exists on your own studio, and only once edit mode is on —
     browsing another studio's people should look like reading, not like a form
     you happen to lack permission for */
  .designer-edit-btn {
    position: absolute;
    z-index: 2; /* above .designer-card-inner, which is a 3D context */
    top: 14px;
    right: 14px;
    width: clamp(34px, 2.8vw, 46px);
    height: clamp(34px, 2.8vw, 46px);
    border-radius: 50%;
    border: none;
    background: rgba(20, 20, 20, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.24s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), background 0.24s ease;
  }
  .designer-edit-btn svg { width: 44%; height: 44%; }
  .designer-card:hover .designer-edit-btn,
  .designer-edit-btn:focus-visible { opacity: 1; transform: scale(1); }
  .designer-edit-btn:hover { background: var(--ink); }

  /* the add tile matches a card's footprint exactly so turning edit mode on
     doesn't resize the row */
  .designer-add-card {
    height: 100%;
    aspect-ratio: 1 / 1.4;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 30px;
    border-radius: 26px;
    border: 1.5px dashed var(--border-strong);
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: clamp(13px, 1.1vw, 17px);
    font-weight: 650;
    color: var(--ink-dim);
    cursor: pointer;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease, transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .designer-add-card svg { width: clamp(32px, 3vw, 48px); height: clamp(32px, 3vw, 48px); }
  .designer-add-card:hover { border-color: var(--ink); color: var(--ink); background: rgba(20, 20, 20, 0.02); transform: translateY(-6px); }
  .designer-add-card:active { transform: translateY(-2px) scale(0.99); }

  .designer-roster-empty {
    font-size: 15px;
    color: var(--ink-faint);
    text-align: center;
    align-self: center;
  }

  /* ---------- the studio caption ----------
     Below the roster, not above it: you look at the people first, then read
     whose they are. It reads as a caption too — the studio's mark, its name in
     the serif at display size, and the "yours" note as a small-caps aside.
     Nothing is boxed. */
  .studio-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 2.4vw, 34px);
    padding: clamp(10px, 1.6vh, 20px) max(6vw, 28px) clamp(14px, 2.2vh, 28px);
  }
  .studio-pager-current {
    display: flex;
    align-items: baseline;
    gap: clamp(10px, 1vw, 16px);
    min-width: 0;
  }
  /* the studio's logo where a colour dot used to be — a real mark reads as
     identity in a way a coloured circle never quite does. buildStudioMark()
     falls back to that circle when there is no file for a studio. */
  .studio-pager-mark {
    align-self: center;
    flex-shrink: 0;
    width: clamp(24px, 2vw, 32px);
    height: clamp(24px, 2vw, 32px);
    border-radius: 50%;
    background-color: var(--studio-tint, rgba(20, 20, 20, 0.06));
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.45s ease;
  }
  .studio-mark-dot {
    width: 42%;
    height: 42%;
    border-radius: 50%;
    background: var(--studio-color, var(--ink-dim));
  }
  .studio-pager-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(26px, 2.4vw, 40px);
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--ink);
    white-space: nowrap;
  }
  /* the quiet "this one's yours" marker — the same signal the edit toggle
     depends on, said in words so it isn't only implied by a button appearing */
  .studio-pager-you {
    font-size: clamp(9.5px, 0.72vw, 11px);
    font-weight: 650;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--studio-color, var(--ink-dim));
    white-space: nowrap;
  }
  .studio-pager-you:empty { display: none; }

  .roster-edit-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 20px 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: clamp(11.5px, 0.9vw, 13px);
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .roster-edit-toggle svg { width: 14px; height: 14px; }
  .roster-edit-toggle:hover { border-color: var(--border-strong); color: var(--ink); background: rgba(20, 20, 20, 0.035); }
  .roster-edit-toggle:active { transform: scale(0.96); }
  .roster-edit-toggle.is-on { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* ---------- add / edit dialog ----------
     Two columns at this size: the photo is the biggest decision on this form,
     so it gets its own half rather than a thumbnail wedged above the fields. */
  .designer-editor { position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .designer-editor-scrim { position: absolute; inset: 0; background: rgba(20, 20, 20, 0.38); }
  .designer-editor-card {
    position: relative;
    width: min(900px, 100%);
    max-height: calc(var(--floor-h) - 48px);
    overflow-y: auto;
    padding: clamp(26px, 3.2vw, 44px);
    border-radius: 28px;
    background: var(--surface);
    box-shadow: var(--shadow-hover);
    display: flex;
    flex-direction: column;
    gap: clamp(20px, 2.4vh, 30px);
  }
  .designer-editor-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(26px, 2.6vw, 38px);
    line-height: 1.1;
    color: var(--ink);
    margin: 0;
  }

  .editor-body {
    display: flex;
    gap: clamp(24px, 3vw, 42px);
    align-items: stretch;
  }
  .editor-photo-col {
    flex: 0 0 auto;
    width: clamp(180px, 18vw, 260px);
    display: flex;
    flex-direction: column;
  }
  .editor-photo-zone {
    position: relative; /* anchors the drag hint */
    width: 100%;
    aspect-ratio: 1 / 1.32;
    border-radius: 20px;
    border: 1.5px dashed var(--border-strong);
    background: var(--studio-tint, rgba(20, 20, 20, 0.04));
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(38px, 4vw, 58px);
    font-weight: 600;
    line-height: 1;
    color: var(--studio-color, var(--ink-faint));
    cursor: pointer;
    transition: border-color 0.25s ease, background-color 0.25s ease;
  }
  .editor-photo-zone.is-dragover { border-color: var(--ink); background-color: rgba(20, 20, 20, 0.06); }
  .editor-photo-zone.has-photo { border-style: solid; border-color: var(--border); color: transparent; }

  /* the fields sit level with the middle of the photo rather than tracking its
     top edge, so the two columns read as one form and not as two stacks */
  .editor-form-col {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(16px, 2vh, 26px);
  }

  .editor-photo-label { font-size: 13px; font-weight: 650; color: var(--ink); margin-bottom: 9px; }
  .editor-photo-hint { margin: 11px 0 13px; font-size: 12.5px; line-height: 1.55; color: var(--ink-faint); }
  .editor-photo-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: auto; }
  .editor-photo-actions .btn-ghost-sm { padding: 9px 16px; font-size: 12.5px; }

  .editor-field-label { font-size: 13px; font-weight: 650; color: var(--ink); margin-bottom: 8px; }
  .editor-field input {
    width: 100%;
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid var(--border-strong);
    background: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 15.5px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.22s ease;
  }
  .editor-field input:focus { border-color: var(--ink); }
  .editor-field input::placeholder { color: var(--ink-faint); }

  .editor-links { display: flex; flex-direction: column; }
  .editor-links-grid { display: flex; flex-direction: column; gap: 8px; }
  .editor-link-row { display: flex; align-items: center; gap: 10px; }
  .editor-link-row-icon { flex-shrink: 0; display: flex; color: var(--ink-faint); }
  .editor-link-row-icon svg { width: 16px; height: 16px; }
  .editor-link-row input {
    flex: 1 1 auto;
    min-width: 0;
    padding: 10px 13px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.22s ease;
  }
  .editor-link-row input:focus { border-color: var(--ink); }
  .editor-link-row input::placeholder { color: var(--ink-faint); }

  .editor-actions { display: flex; align-items: center; gap: 12px; }
  .editor-actions-spacer { flex: 1 1 auto; }
  .editor-delete-link { padding: 0; font-size: 13px; }
  .editor-actions .btn-ghost-sm { padding: 12px 24px; font-size: 14px; }
  .editor-save { padding: 13px 32px; font-size: 14.5px; }
  .editor-save:disabled { opacity: 0.4; cursor: not-allowed; }
  .editor-delete-confirm {
    padding: 18px 20px;
    border-radius: 18px;
    background: rgba(20, 20, 20, 0.04);
  }
  .editor-delete-confirm p { margin: 0 0 13px; font-size: 13.5px; line-height: 1.55; color: var(--ink-dim); }

  /* ---------- focal-point drag ----------
     A roster tile is a tall 1:1.32 crop of whatever was uploaded, which puts a
     face off-centre far more often than not. Rather than a crop dialog, the
     photo is dragged inside the frame it will actually appear in. */
  .is-focal-draggable { cursor: grab; touch-action: none; }
  .is-focal-draggable.is-dragging-focal { cursor: grabbing; }
  .focal-hint {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.96);
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(15, 15, 12, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: rgba(255, 255, 255, 0.95);
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .focal-hint svg { width: 13px; height: 13px; }
  .is-focal-draggable:hover .focal-hint { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  /* out of the way while you are actually doing the thing it described */
  .is-focal-draggable.is-dragging-focal .focal-hint { opacity: 0; }

  /* ---------- the "you're looking at one person's knowledge" chip ----------
     Appears on the Browse and Questions floors once someone is picked in
     Designers, and is the only way that filter is ever visible — an invisible
     filter is how a page ends up quietly lying about how much it's showing. */
  .author-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px 5px 5px;
    border-radius: 999px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .author-chip:hover { transform: translateY(-1px); }
  .author-chip:active { transform: translateY(0) scale(0.97); }
  .author-chip-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    background: var(--studio-color, rgba(255, 255, 255, 0.2));
  }
  .author-chip-clear { font-size: 11px; opacity: 0.65; }
  /* No avatar, so the label carries the left padding the avatar used to. */
  .keyword-filter-chip { padding-left: 13px; }
  .keyword-filter-label { font-size: 12px; font-weight: 500; }

  /* ======================================================================
     Share mode — the gallery area (not a separate page) swaps into a
     writing surface, then a small in-place "weave" moment, then back.
     ====================================================================== */
  .feed-main, .share-viewport, .designers-viewport {
    transition: opacity 0.3s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .mode-fade-out { opacity: 0; transform: scale(0.98); pointer-events: none; }

  .share-viewport {
    position: relative;
    height: var(--floor-h);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  .share-viewport .step {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    opacity: 1;
    transform: translateY(0) scale(1);
    transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .share-viewport .step.is-out { opacity: 0; transform: translateY(-9px) scale(0.993); pointer-events: none; }
  .share-viewport .step.is-pre-in { opacity: 0; transform: translateY(9px) scale(0.993); }
  /* reverse direction (weave -> compose, via "Share another"): mirrors
     is-out/is-pre-in so going back reads as an undo, not a repeat */
  .share-viewport .step.is-out-reverse { opacity: 0; transform: translateY(9px) scale(0.993); pointer-events: none; }
  .share-viewport .step.is-pre-in-reverse { opacity: 0; transform: translateY(-9px) scale(0.993); }

  /* ---------- STEP 1 — compose ----------
     One screen, no scrolling. This used to be a single column in a scroller,
     which meant that by the time you were writing the last field, the title
     and the type you had picked were both off the top of the window — and
     there was nowhere to show you what you were actually making.

     Everything is sized off the viewport instead. The head and the footer take
     what they need, .compose-body takes the rest, and the textareas inside it
     share whatever that leaves. min-height on the textareas is the floor: they
     never get so short that a sentence is cut off, even if that means the
     window has to be a reasonable size. */
  .step-compose { display: flex; flex-direction: column; height: 100%; min-height: 0; }

  /* 64px of top padding, not 34: the hamburger and the back arrow are fixed at
     y=24 and this heading is the first thing under them. */
  .compose-head { flex-shrink: 0; padding: 64px max(4vw, 26px) 0; }
  .compose-head h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(28px, 3vw, 38px);
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .compose-head p { margin: 0; max-width: 620px; font-size: 13.5px; line-height: 1.6; color: var(--ink-dim); }
  /* a short window spends its height on the fields, not on the preamble */
  @media (max-height: 840px) {
    .compose-head { padding-top: 56px; }
    .compose-head p { display: none; }
  }

  /* 78/22, not 67/33, and a narrower right column: with the preview gone the
     right-hand side is two file pickers, which need a column not a panel. The
     rest goes to the writing, and the generous top padding is the breathing
     room the deleted heading used to occupy — space, rather than a label
     restating what the form obviously is. */
  .compose-body {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 78fr) minmax(248px, 22fr);
    gap: clamp(28px, 3.4vw, 56px);
    padding: clamp(30px, 4.4vh, 58px) max(5vw, 30px) 0;
  }

  .compose-left { min-height: 0; display: flex; flex-direction: column; gap: 16px; }
  .compose-right { min-height: 0; display: flex; flex-direction: column; gap: 16px; }

  /* the per-type fields share the leftover height between them */
  /* The invariant here is: the page never scrolls, and a textarea is never
     shorter than 104px. Those two can conflict — four fields at their floor
     need more height than a 768px window has left after the heading, title,
     type picker and footer — so the field stack, and only the field stack,
     scrolls when it has to. The preview, the type picker and the submit button
     never move, which is the part that actually mattered: you always see what
     you are making and how to finish it.

     At a comfortable window size there is nothing to scroll and this is inert. */
  .compose-fields {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  /* flex: 0 0 auto, and this is the fix for the overlap.

     It was `1 1 auto` with `min-height: 0`, which is the standard incantation
     for a scrollable flex child — and this is not one. With four fields open,
     each wanting a label plus a 132px box, the column asked for more height than
     the pane had; `min-height: 0` let every field shrink below its own contents;
     and a .field has no overflow of its own, so the label and box inside simply
     painted outside it, over the field above. That is what put "WHAT WE'D DO
     DIFFERENTLY" across somebody's third line of text.

     Refusing to shrink pushes the excess onto .compose-fields, which already
     has overflow-y: auto and is the thing that should be scrolling. The
     collapsed state (.has-hidden-extras) and Update mode already said 0 0 auto
     for the same reason; this only ever went wrong once the extra fields were
     open, which is exactly when there is the most to read. */
  .compose-fields .field { flex: 0 0 auto; min-height: 0; }
  .compose-fields textarea {
    flex: 1 1 auto;
    min-height: clamp(104px, 12vh, 132px);
    resize: none;
  }

  .field-type .type-picker, .field-asked-to .asked-to-picker { margin-top: 2px; }

  /* ---------- who a question is addressed to ----------
     Everything here is asked of somebody, and "everyone" is a real answer
     rather than the absence of one — so it is a choice with a default, not a
     checkbox you can leave alone. */
  .asked-to-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .asked-to-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--ink-dim);
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .asked-to-pill:hover { border-color: var(--border-strong); color: var(--ink); }
  .asked-to-pill.is-active { background: var(--ink); border-color: var(--ink); color: #ffffff; }
  .asked-to-pill .card-dot { width: 7px; height: 7px; box-shadow: none; }

  /* ---------- the preview column ---------- */
  /* ---------- the image thumbnail ----------
     All that is left of the live preview: the picture, at a size worth looking
     at, with the framing drag on it. Sized 16:9 because that is the shape floor
     1's banner gives it, and the crop the drag is choosing is mostly about
     which part survives the tall poster card. */
  .image-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: rgba(20, 20, 20, 0.04);
    cursor: pointer;
  }
  .image-thumb-media { position: absolute; inset: 0; }
  .image-thumb-media.has-image-draggable { cursor: grab; }
  .image-thumb-media.is-dragging { cursor: grabbing; }
  /* Says what the drag is for, and gets out of the way while it is happening. */
  .image-thumb-hint {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 7px;
    text-align: center;
    font-size: 10.5px;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.22s ease;
  }
  .image-thumb:hover .image-thumb-hint { opacity: 1; }
  .image-thumb-media.is-dragging ~ .image-thumb-hint { opacity: 0; }
  .file-slot.is-dropping { outline: 2px dashed var(--ink); outline-offset: 3px; border-radius: 12px; }

  /* Reads as a field that exists but is not open yet: the same dashed edge the
     two pickers above it use, at rest, with no hover state and no cursor. The
     "coming soon" note next to the label is what carries the explanation — the
     placeholder is long, and a long placeholder in a disabled box is read once
     and then ignored. */
  /* The wrapper is the target; the input inside it is scenery. pointer-events
     off on the input as well as disabled, so the wrapper gets the click even
     where a browser would have let the input swallow it. */
  .canvas-field { position: relative; cursor: pointer; }
  .canvas-field .canvas-input { pointer-events: none; }
  .canvas-field:hover .canvas-input { border-color: var(--ink-faint); }
  .canvas-field:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 12px; }

  .canvas-input {
    width: 100%;
    /* room on the right for the badge, which is inside the box */
    padding: 11px 90px 11px 14px;
    border: 1px dashed var(--border-strong);
    border-radius: 12px;
    background: transparent;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--ink-dim);
    cursor: pointer;
  }

  /* Small, upper case, and on the field it describes. Not the studio accent and
     not a warning colour: it is a note about timing, not a state to be fixed. */
  .canvas-badge {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(20, 20, 20, 0.07);
    font-family: 'Inter', sans-serif;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--ink-faint);
    pointer-events: none;
  }
  .canvas-input::placeholder { color: var(--ink-faint); }
  .canvas-hint {
    margin: 7px 0 0;
    font-size: 11.5px;
    line-height: 1.45;
    color: var(--ink-faint);
  }
  .canvas-input:disabled { opacity: 1; } /* Safari greys disabled text to unreadable */

  /* Stacked, not side by side: the column is half the width it was, and two
     dashed buttons squeezed next to each other read as one broken control. */
  .compose-attach-row {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(18px, 2.4vh, 28px);
    padding-bottom: 4px;
  }
  .compose-attach-col { min-width: 0; }
  .file-slot { display: flex; flex-direction: column; gap: 7px; }
  .file-slot-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 12px;
    border: 1.5px dashed var(--border-strong);
    border-radius: 12px;
    background: rgba(20, 20, 20, 0.015);
    font-family: inherit;
    font-size: 12px;
    color: var(--ink-faint);
    cursor: pointer;
    text-align: left;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }
  .file-slot-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .file-slot-btn:hover { border-color: var(--ink-dim); color: var(--ink-dim); background: rgba(20, 20, 20, 0.03); }
  .file-slot.is-dragover .file-slot-btn { border-color: var(--ink); background: rgba(20, 20, 20, 0.045); color: var(--ink-dim); }
  .file-slot-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #ffffff;
  }
  .file-slot-name {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-slot-remove {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .file-slot-remove svg { width: 13px; height: 13px; }
  .file-slot-remove:hover { background: rgba(20, 20, 20, 0.07); color: var(--ink); }

  /* the attachment list lives inside its slot now, so it has its own cap
     rather than pushing the footer off the screen */
  #attachmentZone .attachment-list { max-height: 108px; overflow-y: auto; margin-top: 0; }

  /* A four-field type needs about 530px for its boxes, and a 768px-tall window
     has about 440 to give once the heading, title, type picker and footer have
     taken theirs. Something has to give, and it is not the 104px floor — a
     textarea you cannot read two lines in is worse than a short scroll.

     So the field stack scrolls, and only the field stack. The preview, the type
     picker and the submit button stay where they are, which is the part that
     actually mattered about not scrolling: you never lose sight of what you are
     making or how to finish it. */
  /* a short window spends what it has on the fields */
  @media (max-height: 900px) {
    .compose-head h1 { font-size: clamp(24px, 2.4vw, 30px); }
    .compose-body { padding-top: 16px; }
  }

  /* Under this the two panes are too narrow to be two panes: the preview goes
     under the writing and the whole composer becomes one scroller again —
     which is the one case where scrolling beats clipping. */
  @media (max-width: 1080px) {
    .compose-body {
      grid-template-columns: minmax(0, 1fr);
      overflow-y: auto;
      padding-bottom: 20px;
    }
    .compose-fields .field { flex: 0 0 auto; }
  }

  .field { display: flex; flex-direction: column; }
  .field-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .field-label .optional { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink-faint); opacity: 0.75; }

  .field-title input {
    width: 100%;
    border: none;
    border-bottom: 1.5px solid var(--border-strong);
    background: transparent;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 30px;
    padding: 4px 2px 14px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.3s ease;
  }
  .field-title input:focus { border-color: var(--ink); }
  .field-title input::placeholder { color: var(--ink-faint); font-weight: 500; }

  .type-picker { display: flex; gap: 10px; flex-wrap: wrap; }
  .type-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-dim);
    cursor: pointer;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .type-pill svg { width: 15px; height: 15px; }
  .type-pill:hover { border-color: var(--border-strong); color: var(--ink); transform: translateY(-1px); }
  .type-pill:active { transform: translateY(0) scale(0.97); }
  .type-pill.is-active { border-color: var(--ink); color: var(--ink); background: rgba(20, 20, 20, 0.05); }

  .share-viewport textarea {
    width: 100%;
    /* min-height and resize belong to .compose-fields textarea, which is where
       the per-field sizing is decided. They were here too, at equal
       specificity and later in the file, so they quietly won. */
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--ink);
    background: #ffffff;
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .share-viewport textarea:focus { border-color: var(--border-strong); box-shadow: 0 4px 16px -8px rgba(20, 20, 20, 0.12); }
  .share-viewport textarea::placeholder { color: var(--ink-faint); }

  /* ---------- attachments (item 8) — a second, separate dropzone: file
     name/icon/size in a plain list instead of a visual preview, since these
     are meant to be opened (a PDF, a doc), not looked at inline. ---------- */
  .attachment-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  /* not a link, so it should not look like one */
  .attachment-link.is-unavailable { cursor: default; opacity: 0.6; }
  .attachment-link.is-unavailable:hover { border-color: var(--border); background: transparent; }
  .attachment-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
  }
  .attachment-item-icon {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(20, 20, 20, 0.06);
    color: var(--ink-dim);
  }
  .attachment-item-icon svg { width: 15px; height: 15px; }
  .attachment-item-info { flex: 1; min-width: 0; }
  .attachment-item-name {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .attachment-item-size { font-size: 11px; color: var(--ink-faint); }
  .attachment-item-remove {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    border-radius: 7px;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .attachment-item-remove:hover { color: var(--ink-dim); background: rgba(20, 20, 20, 0.06); }
  .attachment-item-remove svg { width: 13px; height: 13px; }

  /* ---------- Attachments as shown in a card's own detail view ---------- */
  .attachments-list-wrap { display: flex; flex-direction: column; gap: 8px; }
  .attachment-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .attachment-link:hover { border-color: var(--border-strong); background: rgba(20, 20, 20, 0.02); }
  .qd-attachments:not(:empty) { margin-top: 10px; }

  /* the extra right padding is the language switcher's lane: it is fixed in
     that corner on every screen, and the submit button was landing on it */
  /* the "what exists now" block on the completion screen */
  .weave-state {
    margin: 22px auto 26px;
    padding: 18px 22px;
    max-width: 420px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: rgba(20, 20, 20, 0.02);
    text-align: left;
  }
  .weave-state-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .weave-state-row + .weave-state-row { margin-top: 8px; }
  .weave-state-mark {
    flex-shrink: 0;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--border-strong);
  }
  .weave-state-note {
    margin: 14px 0 0;
    padding-top: 13px;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--ink-faint);
  }

  .compose-footer { flex-shrink: 0; padding: 14px max(6vw, 92px) 18px 14px; padding-left: max(4vw, 26px); border-top: 1px solid var(--border); background: var(--surface); }
  .compose-footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .compose-hint { font-size: 12.5px; color: var(--ink-faint); }

  /* ---------- shared buttons (compose + weave) ---------- */
  .btn-weave {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    border-radius: 999px;
    border: none;
    background: var(--ink);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 650;
    letter-spacing: 0.01em;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: 0 14px 30px -14px rgba(20, 20, 20, 0.4);
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease, opacity 0.3s ease;
  }
  .btn-weave:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -14px rgba(20, 20, 20, 0.45); }
  .btn-weave:active { transform: translateY(0) scale(0.97); }
  .btn-weave:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-weave svg { width: 14px; height: 14px; }

  .btn-ghost {
    padding: 12px 20px;
    border-radius: 999px;
    border: 1.5px solid var(--border-strong);
    background: transparent;
    color: var(--ink-dim);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .btn-ghost:hover { border-color: var(--ink); color: var(--ink); background: rgba(20, 20, 20, 0.03); transform: translateY(-1px); }
  .btn-ghost:active { transform: translateY(0) scale(0.97); }

  /* ---------- STEP 2/3 — the weave ---------- */
  .step-weave { padding: 0; }
  .weave-canvas-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 42%, rgba(55, 138, 221, 0.05), transparent 60%),
      radial-gradient(ellipse 55% 45% at 78% 30%, rgba(216, 90, 48, 0.04), transparent 60%),
      radial-gradient(ellipse 55% 45% at 30% 78%, rgba(29, 158, 117, 0.04), transparent 60%);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .weave-canvas-wrap.is-pulsing { transform: scale(1.015); }
  #weaveCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .weave-caption {
    position: absolute;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 16px;
    color: var(--ink-dim);
    opacity: 0;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .weave-caption.is-visible { opacity: 1; }
  .weave-confirm {
    flex-shrink: 0;
    text-align: center;
    padding: 24px max(6vw, 28px) 36px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .weave-confirm.is-visible { opacity: 1; transform: translateY(0); }
  .weave-confirm-inner { max-width: 560px; margin: 0 auto; }
  .weave-confirm h2 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 23px; letter-spacing: -0.005em; margin: 0 0 8px; color: var(--ink); }
  .weave-confirm p { margin: 0 0 20px; font-size: 13px; color: var(--ink-faint); }
  .weave-actions { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="menu-overlay" id="menuOverlay">
  <button type="button" class="menu-close" id="menuCloseBtn" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  </button>
  <nav class="menu-list" id="menuList"></nav>
</div>

<div class="toast" id="toast"></div>

<!-- ---------- the fixed chrome ----------
     Everything here is pinned to the screen rather than to a floor, and all of
     it lives outside .app: .app takes a transform during the page-to-page
     hand-off, and a transformed ancestor turns position:fixed into
     position:absolute.

     There is no top bar. Every function one used to carry has a permanent home
     in a corner instead: navigation top-left, Share and the way out
     bottom-left, language bottom-right, this floor's own tools bottom-centre.
     A bar that appears on two of three floors to say "Loom" was costing the
     other floor 98px and telling nobody anything. -->

<!-- Top-right: the other half of the loop. Opposite the hamburger, above
     everything, on every screen — see renderNotificationIndicator. -->
<div class="notify-corner" id="notifyCorner">
  <div class="notify-toast" id="notifyToast" role="status">
    <span class="notify-toast-dot" id="notifyToastDot"></span>
    <span class="notify-toast-text" id="notifyToastText"></span>
  </div>
  <button type="button" class="icon-ghost notify-btn" id="notifyBtn" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 9a6 6 0 1 0-12 0c0 5-2 6.5-2 6.5h16S18 14 18 9"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/>
    </svg>
    <span class="notify-count" id="notifyCount"></span>
    <span class="notify-dots" id="notifyDots"></span>
  </button>
</div>

<aside class="for-you-panel" id="forYouPanel" aria-labelledby="forYouTitle">
  <div class="for-you-head">
    <h2 id="forYouTitle"></h2>
    <button type="button" class="for-you-mark-all" id="forYouMarkAll"></button>
    <button type="button" class="for-you-close" id="forYouCloseBtn" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="for-you-list" id="forYouList"></div>
</aside>

<!-- ---------- "We applied this too" ----------
     Pressing it used to append your studio's name to a list, which is how a
     company ended up looking like a node in someone's lineage. Applying
     something is an event between two pieces of work: the one you read and the
     one you made because of it. So it asks for that second piece — an existing
     Project/Experiment/Update of yours, or a one-line Update written on the
     spot — then what kind of connection it is, then optionally what changed.
     Only on save does a line appear between the two. Escape, the backdrop and
     Cancel all leave without writing anything. -->
<div class="apply-flow" id="applyFlow" role="dialog" aria-modal="true" aria-labelledby="applyFlowTitle">
  <div class="apply-flow-backdrop" id="applyFlowBackdrop"></div>
  <div class="apply-flow-sheet">
    <div class="apply-flow-head">
      <div class="apply-flow-head-text">
        <h2 id="applyFlowTitle"></h2>
        <p class="apply-flow-source" id="applyFlowSource"></p>
      </div>
      <button type="button" class="for-you-close" id="applyFlowClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="apply-flow-progress" id="applyFlowProgress"></div>

    <div class="apply-flow-body">
      <section class="apply-step" data-step="1">
        <h3 class="apply-step-q" id="applyQ1"></h3>
        <p class="apply-step-hint" id="applyQ1Hint"></p>
        <div class="apply-target-list" id="applyTargetList"></div>
        <button type="button" class="apply-new-update" id="applyNewUpdateBtn">
          <span class="apply-new-update-plus">+</span>
          <span id="applyNewUpdateLabel"></span>
        </button>
        <div class="apply-new-update-box" id="applyNewUpdateBox" style="display:none;">
          <textarea id="applyNewUpdateInput" rows="2" maxlength="180"></textarea>
        </div>
      </section>

      <section class="apply-step" data-step="2">
        <h3 class="apply-step-q" id="applyQ2"></h3>
        <div class="apply-relation-list" id="applyRelationList"></div>
      </section>

      <section class="apply-step" data-step="3">
        <h3 class="apply-step-q" id="applyQ3"></h3>
        <p class="apply-step-hint" id="applyQ3Hint"></p>
        <input type="text" id="applyNoteInput" maxlength="140" autocomplete="off">
        <div class="apply-summary" id="applySummary"></div>
      </section>
    </div>

    <div class="apply-flow-foot">
      <button type="button" class="btn-ghost-sm" id="applyFlowCancel"></button>
      <div class="apply-flow-foot-right">
        <button type="button" class="btn-ghost-sm" id="applyFlowBack"></button>
        <button type="button" class="apply-flow-next" id="applyFlowNext"></button>
      </div>
    </div>
  </div>
</div>

<button type="button" class="icon-ghost hamburger-btn" id="menuToggleBtn" aria-label="Menu" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>

<!-- Stacked, pencil on top: writing is the action, and the way out of the app
     is the thing you should have to reach past it for. -->
<div class="corner-dock" id="cornerDock">
  <button type="button" class="icon-ghost corner-btn" id="cornerShareBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20h4L18.5 9.5a2 2 0 0 0-2.8-2.8L5 17.2z"/><path d="M13.5 6.5l4 4"/>
    </svg>
    <span class="corner-btn-label" id="cornerShareLabel"></span>
  </button>
  <a class="icon-ghost corner-btn" id="backToLobbyBtn" href="loom_lobby.html">

<div class="lang-switcher" id="langSwitcher">

  <div class="lang-menu" id="langMenu"></div>
</div>

<!-- ---------- the bottom-centre stack ----------
     This floor's own tools, and the wordmark under them. One column so they can
     never collide with each other or with the corner marks. -->
<div class="bottom-center" id="bottomCenter">
  <div class="floor-dock" id="floorDock">
    <div class="floor-dock-group" id="dockBrowse">
      <!-- only present while a person is picked in Designers -->
      <!-- Same shape as the author chip: a filter you cannot see is how a floor
           ends up quietly lying about how much it is showing. -->
      <button type="button" class="author-chip keyword-filter-chip" id="keywordChipBrowse" style="display:none;">
        <span class="keyword-filter-label"></span>
        <span class="author-chip-clear">✕</span>
      </button>
      <button type="button" class="author-chip" id="authorChipBrowse" style="display:none;">
        <span class="author-chip-avatar" id="authorChipBrowseAvatar"></span>
        <span class="author-chip-label" id="authorChipBrowseLabel"></span>
        <span class="author-chip-clear">✕</span>
      </button>
      <div class="search-wrap">
        <input id="searchInput" type="text" autocomplete="off" />
      </div>
      <div class="filter-divider"></div>
      <div class="studio-filter" id="studioFilter"></div>
      <div class="type-filter-dropdown" id="typeFilterDropdown">
        <button type="button" class="type-filter-btn" id="typeFilterBtn">
          <span class="type-filter-btn-icon" id="typeFilterBtnIcon"></span>
          <span id="typeFilterBtnLabel"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="type-filter-menu" id="typeFilterMenu"></div>
      </div>
    </div>

    <!-- One line, not two. "Nothing is waiting on you right now" used to sit
         next to "2 questions waiting on an answer", which are both true and
         read as a contradiction. Whichever of the two is the more useful thing
         to say goes in the single slot — see renderQuestionsDockLine. -->
    <div class="floor-dock-group" id="dockQuestions">
      <!-- Same shape as the author chip: a filter you cannot see is how a floor
           ends up quietly lying about how much it is showing. -->
      <button type="button" class="author-chip keyword-filter-chip" id="keywordChipQuestions" style="display:none;">
        <span class="keyword-filter-label"></span>
        <span class="author-chip-clear">✕</span>
      </button>
      <button type="button" class="author-chip" id="authorChipQuestions" style="display:none;">
        <span class="author-chip-avatar" id="authorChipQuestionsAvatar"></span>
        <span class="author-chip-label" id="authorChipQuestionsLabel"></span>
        <span class="author-chip-clear">✕</span>
      </button>
      <div class="questions-count" id="questionsCount"></div>
    </div>
  </div>

  <!-- signature, not navigation -->
  <div class="brand-footer" id="brandFooter">Loom</div>
  <!-- Floor 4's own footer: the wordmark with the line that says what the weave
       above it is. Separate from #brandFooter because that one belongs to the
       two tool floors and carries no copy. -->
  <div class="threads-footer" id="threadsFooter">
    <p class="threads-footer-line" id="threadsFooterLine"></p>
    <div class="threads-footer-mark">Loom</div>
  </div>
</div>

<div class="app is-transitioning" id="app">
  <main class="feed-main" id="feedMain">
   <!-- The three floors stacked in one transform-driven stage — see the
        .feed-stage CSS and goToFloor() for why this isn't a scroll container. -->
   <div class="feed-stage" id="feedStage">
    <!-- ---------- Discover: one full-width banner, newest-first, autoplaying
         through the same top-N slice — "other studios just shared this" is
         the first thing feed shows, and it fills the whole top of the page ---------- -->
    <!-- No heading, no explainer, no chrome: the banner IS the floor. -->
    <section class="discover-section">
      <div class="discover-hero" id="discoverHero">
        <div class="hero-slides" id="heroSlides"></div>
        <button type="button" class="icon-ghost hero-arrow hero-arrow-prev" id="heroPrevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button type="button" class="icon-ghost hero-arrow hero-arrow-next" id="heroNextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <div class="hero-dots" id="heroDots"></div>
      </div>

      <!-- Thin, and under the banner rather than over it: this is the sound of
           the place being lived in, not a second headline competing with the
           first. -->
      <div class="now-strip" id="nowStrip">
        <div class="now-strip-scroll" id="nowStripRow"></div>
        <p class="now-strip-empty" id="nowStripEmpty"></p>
        <div class="your-turn">
          <span class="your-turn-line" id="yourTurnLine"></span>
          <button type="button" class="your-turn-cta" id="yourTurnCta"></button>
        </div>
      </div>
    </section>

    <!-- ---------- Browse (tier 2): finished, testable knowledge only —
         Project/Experiment. Questions live one tier down instead, so this
         row never mixes "done" work with "still open" work. ---------- -->
    <!-- No heading either: the hamburger menu already names every floor, and
         repeating it here cost the cards a strip of screen. Search and the
         filters live in #floorDock. -->
    <section class="browse-section">
      <div class="browse-track-wrap" id="browseTrackWrap">
        <div class="browse-track" id="browseGrid"></div>
      </div>
      <p class="browse-empty" id="browseEmpty" style="display:none;"></p>
    </section>

    <!-- ---------- Questions (tier 3): what studios are actively stuck on
         right now, pulled out into its own tier on purpose — nothing here
         is finished, so it reads differently on sight, not just by label. ---------- -->
    <section class="questions-section">
      <!-- the only floor whose content can genuinely run long: it scrolls
           inside itself rather than making the floor taller than a viewport -->
      <div class="floor-scroll questions-scroll" id="questionsScroll">
        <!-- Written to the studio reading it: whether any of this is theirs to
             answer, before they read a single card. See renderQuestionsPersonal. -->
        <p class="questions-personal" id="questionsPersonal"></p>
        <div class="questions-grid" id="questionsGrid"></div>
        <p class="questions-empty" id="questionsEmpty" style="display:none;"></p>
      </div>
    </section>
    <!-- ---------- Threads (floor 4): the closing line ----------
         The last floor rather than a surface off the menu. The three floors
         above are a narrowing: everything happening now, then the work that
         held up, then the questions still open. This is what all of it adds up
         to — so it reads as the end of a sentence, and you arrive at it by
         carrying on downward rather than by leaving to look at it.

         Deliberately toolless: no search, no filters, no sort, no pan and no
         zoom. It asks nothing of you and answers "what is going on between us"
         in a glance. When there are eighty keywords instead of twenty this will
         need panning, and that is the moment to add it. -->
    <section class="threads-section" id="threadsSection">
      <!-- Only the title up here. The line that explains the weave is at the
           foot with the wordmark (see .threads-footer) — saying it in both
           places, which is what happened first, just reads as a stutter. -->
      <div class="threads-head">
        <h1 id="threadsHeading"></h1>
      </div>

      <div class="threads-stage" id="threadsStage">
        <!-- viewBox is set from the measured stage in layoutThreads, so the map
             fills whatever window it is given without any transform of its own. -->
        <svg class="threads-svg" id="threadsSvg" aria-hidden="true">
          <!-- one bloom gradient per studio, one gradient per thread; rebuilt with
               the map, since both depend on what is actually on it -->
          <defs id="threadsDefs"></defs>
          <!-- painted back to front: threads, then the words with their blooms -->
          <g id="threadsLinkLayer"></g>
          <g id="threadsNodeLayer"></g>
        </svg>
        <!-- Follows the pointer rather than sitting on the dot: a label anchored
             to a 5px mark that is itself drifting is a label that shivers. -->
        <div class="threads-tip" id="threadsTip"></div>
        <div class="threads-empty" id="threadsEmpty" style="display:none;">
          <p class="threads-empty-line" id="threadsEmptyTitle"></p>
          <p class="threads-empty-sub" id="threadsEmptyBody"></p>
        </div>
      </div>

      <!-- The story of one keyword, oldest first. A panel rather than a new
           screen: the map stays visible behind it, so it reads as "this part of
           that" instead of a place you navigated to. -->
      <aside class="threads-story" id="threadsStory" aria-live="polite">
        <div class="threads-story-head">
          <div>
            <div class="threads-story-word" id="threadsStoryWord"></div>
            <div class="threads-story-meta" id="threadsStoryMeta"></div>
          </div>
          <button type="button" class="threads-story-close" id="threadsStoryClose" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <p class="threads-story-lead" id="threadsStoryLead"></p>
        <div class="threads-story-list" id="threadsStoryList"></div>
      </aside>
    </section>
   </div>
  </main>

  <!-- ---------- Designers: who is actually weaving this, grouped by studio.
       A sibling surface of the feed rather than a fourth floor — it isn't
       knowledge, it's the people behind it, and it shouldn't sit in the same
       vertical sequence as the three knowledge tiers. ---------- -->
  <section class="designers-viewport" id="designersViewport" style="display:none;">
    <button type="button" class="icon-ghost back-btn" id="designersCloseBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    </button>

    <div class="designers-head">
      <div class="designers-intro">
        <h1 id="designersHeading"></h1>
        <p id="designersIntro"></p>
      </div>
    </div>

    <div class="designers-stage-wrap">
      <!-- One studio on screen at a time; the arrows are the only way across,
           so it never reads as two rosters side by side to be compared. They
           live inside the stage rather than the whole surface so "vertically
           centred" means centred on the card row, not on a viewport whose top
           half is taken up by the heading. -->
      <button type="button" class="studio-nav studio-nav-prev" id="studioPrevBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button type="button" class="studio-nav studio-nav-next" id="studioNextBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>

      <div class="designers-stage" id="designersStage"></div>
    </div>

    <!-- The studio caption sits under the faces it names, not above them: you
         look at the people first, then read whose they are. -->
    <div class="studio-bar">
      <div class="studio-pager-current">
        <span class="studio-pager-mark" id="studioPagerMark"></span>
        <span class="studio-pager-name" id="studioPagerName"></span>
        <span class="studio-pager-you" id="studioPagerYou"></span>
      </div>
      <!-- only rendered visible on your own studio (see canEditRoster) -->
      <button type="button" class="roster-edit-toggle" id="rosterEditToggle" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20h4l10.5-10.5a2 2 0 0 0-2.8-2.8L5 17.2z"/><path d="M13.5 6.5l4 4"/>
        </svg>
        <span id="rosterEditLabel"></span>
      </button>
    </div>

    <!-- ---------- add / edit one person ---------- -->
    <div class="designer-editor" id="designerEditor" style="display:none;">
      <div class="designer-editor-scrim" id="designerEditorScrim"></div>
      <div class="designer-editor-card" role="dialog" aria-modal="true">
        <h3 id="designerEditorTitle"></h3>

        <!-- two columns: the photo is the biggest decision on this form, so it
             gets its own half instead of a thumbnail wedged above the fields -->
        <div class="editor-body">
          <div class="editor-photo-col">
            <div class="editor-photo-label" id="editorPhotoLabel"></div>
            <!-- doubles as the crop control once a photo is in — see
                 refreshEditorPhoto, which adds .is-focal-draggable -->
            <div class="editor-photo-zone" id="editorPhotoZone" role="button" tabindex="0">
              <span class="editor-photo-fallback" id="editorPhotoFallback"></span>
              <span class="focal-hint" id="editorPhotoDragHint" style="display:none;"></span>
            </div>
            <p class="editor-photo-hint" id="editorPhotoHint"></p>
            <div class="editor-photo-actions">
              <button type="button" class="btn-ghost-sm" id="editorPhotoPickBtn"></button>
              <button type="button" class="btn-ghost-sm" id="editorPhotoRemoveBtn" style="display:none;"></button>
            </div>
          </div>

          <div class="editor-form-col">
            <div class="editor-field">
              <div class="editor-field-label" id="editorNameLabel"></div>
              <input type="text" id="editorNameInput" autocomplete="off" />
            </div>
            <div class="editor-field">
              <div class="editor-field-label" id="editorRoleLabel"></div>
              <input type="text" id="editorRoleInput" autocomplete="off" />
            </div>

            <!-- The two lines the card back leads with. Optional, like the
                 links: a roster with these blank is still a roster, it just
                 answers one fewer question. -->
            <div class="editor-field">
              <div class="editor-field-label" id="editorWorkingOnLabel"></div>
              <input type="text" id="editorWorkingOnInput" autocomplete="off" maxlength="80" />
            </div>
            <div class="editor-field">
              <div class="editor-field-label" id="editorCanHelpLabel"></div>
              <input type="text" id="editorCanHelpInput" autocomplete="off" maxlength="80" />
            </div>

            <!-- Populated from DESIGNER_LINK_KINDS so adding a kind needs no
                 markup change. Every one is optional; blanks are simply never
                 rendered on the card back. -->
            <div class="editor-links">
              <div class="editor-field-label" id="editorLinksLabel"></div>
              <div class="editor-links-grid" id="editorLinksGrid"></div>
            </div>
          </div>
        </div>
        <input type="file" id="editorPhotoInput" accept="image/*" style="display:none;" />

        <div class="editor-actions">
          <button type="button" class="delete-link editor-delete-link" id="editorDeleteBtn" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-.8 12.1a1 1 0 0 1-1 .9H8.8a1 1 0 0 1-1-.9L7 7"/>
            </svg>
            <span id="editorDeleteLabel"></span>
          </button>
          <span class="editor-actions-spacer"></span>
          <button type="button" class="btn-ghost-sm" id="editorCancelBtn"></button>
          <button type="button" class="btn-weave editor-save" id="editorSaveBtn"><span id="editorSaveLabel"></span></button>
        </div>

        <div class="editor-delete-confirm" id="editorDeleteConfirm" style="display:none;">
          <p id="editorDeleteConfirmText"></p>
          <div class="delete-confirm-actions">
            <button type="button" class="btn-ghost-sm" id="editorDeleteCancelBtn"></button>
            <button type="button" class="btn-delete-confirm" id="editorDeleteConfirmBtn"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="share-viewport" id="shareViewport" style="display:none;">
    <button type="button" class="icon-ghost back-btn" id="shareCloseBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    </button>

    <!-- No heading. "Share what you learned" over a form whose first field is a
         title was telling you what you already knew you were doing, and it cost
         the writing area the top fifth of the screen. The pencil you pressed to
         get here is the only announcement this needs. -->
    <div class="step step-compose" id="stepCompose">
      <div class="compose-body">

        <!-- LEFT — what you write. The fields under the type picker are built
             by renderComposeFields() from the type you chose, so an experiment
             is asked about its method and a project about its constraints. -->
        <div class="compose-left">
          <div class="field field-title" id="titleField">
            <input id="titleInput" type="text" autocomplete="off" />
          </div>

          <!-- Under the title, above the type: still part of naming the
               thing, rather than part of explaining it. Every type gets this
               field, including Update — a one-line note is exactly the kind of
               thing that otherwise never gets found again. -->
          <div class="field field-keywords" id="keywordsField">
            <div class="field-label" id="keywordsLabel"></div>
            <div class="keyword-input-wrap" id="keywordInputWrap">
              <div class="keyword-chips" id="keywordChips"></div>
              <input id="keywordInput" type="text" autocomplete="off" role="combobox"
                     aria-autocomplete="list" aria-expanded="false" aria-controls="keywordSuggestions" />
              <!-- Absolutely positioned over the form, so opening it never
                   reflows the fields underneath and the box it covers is still
                   the box you were typing in. -->
              <div class="keyword-suggestions" id="keywordSuggestions" role="listbox"></div>
            </div>
            <p class="keyword-hint" id="keywordHint"></p>
            <!-- Filled by renderKeywordOffers() when what you have written
                 already contains a keyword somebody else is using. Empty and
                 invisible until then. -->
            <div class="keyword-suggest" id="keywordSuggest" style="display:none;">
              <span class="keyword-suggest-label" id="keywordSuggestLabel"></span>
              <div class="keyword-suggest-chips" id="keywordSuggestChips"></div>
            </div>
          </div>

          <div class="field field-type">
            <div class="field-label" id="typeQuestionLabel"></div>
            <div class="type-picker" id="typePicker"></div>
          </div>

          <!-- Questions only: everything here is addressed to somebody, and
               "everyone" is a real answer rather than the absence of one. -->
          <div class="field field-asked-to" id="askedToField" style="display:none;">
            <div class="field-label" id="askedToLabel"></div>
            <div class="asked-to-picker" id="askedToPicker"></div>
          </div>

          <div class="compose-fields" id="composeFields"></div>

          <!-- Updates only: somewhere to look, if there is somewhere to look. -->
          <div class="field field-link" id="linkField" style="display:none;">
            <div class="field-label" id="linkFieldLabel"></div>
            <input id="linkInput" type="url" autocomplete="off" />
          </div>
        </div>

        <!-- RIGHT — only the two things you attach. The live preview used to sit
             above these and took two thirds of the column and most of the
             attention: a card that showed you a worse version of what you were
             already reading in the form beside it, while the form itself was
             squeezed into a third of the screen. Writing is the job here.

             The image's own framing control moved onto the thumbnail below,
             which is where the picture now is. -->
        <div class="compose-right">
          <div class="compose-attach-row">
            <div class="field compose-attach-col">
              <div class="field-label"><span id="imageFieldLabel"></span> <span class="optional" id="imageOptionalLabel"></span></div>
              <!-- The thumbnail is here now that there is no preview above it.
                   Drag inside it to choose which part of the picture the card
                   crops to — the same gesture, on the same pixels, just no
                   longer borrowed from a card mock-up. -->
              <div class="file-slot" id="imageSlot">
                <div class="image-thumb" id="imageThumb" style="display:none;" role="button" tabindex="0">
                  <div class="card-media image-thumb-media" id="previewMedia"></div>
                  <div class="image-thumb-hint" id="previewDragHint"></div>
                </div>
                <button type="button" class="file-slot-btn" id="uploadZone">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
                  </svg>
                  <span id="uploadHintLabel"></span>
                </button>
                <div class="file-slot-item" id="imageChosen" style="display:none;">
                  <span class="file-slot-name" id="imageFileName"></span>
                  <button type="button" class="file-slot-remove" id="uploadRemoveBtn" aria-label="Remove">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                  </button>
                </div>
              </div>
              <input type="file" id="imageFileInput" accept="image/*" style="display:none;" />
            </div>

            <div class="field compose-attach-col compose-attach-col-attachments">
              <div class="field-label"><span id="attachmentsFieldLabel"></span> <span class="optional" id="attachmentsOptionalLabel"></span></div>
              <div class="file-slot" id="attachmentZone">
                <button type="button" class="file-slot-btn" id="attachmentPickBtn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 3h6l4 4v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M15 3v4h4"/>
                  </svg>
                  <span id="attachmentHintLabel"></span>
                </button>
                <div class="attachment-list" id="attachmentList"></div>
              </div>
              <input type="file" id="attachmentFileInput" multiple style="display:none;" />
            </div>

            <!-- Not wired up, and says so. This is the shape of the thing that
                 makes writing a card nearly free: most of what belongs on one has
                 already been written in a Slack Canvas by the time anybody thinks
                 to share it, and retyping it is the actual reason a studio does
                 not. Disabled rather than accepting text and dropping it —
                 a field that takes what you paste and then loses it is worse than
                 one that admits it is not ready.

                 TODO(server) 서버 단계 1순위 — Slack Canvas API + AI 요약으로 자동 글 생성.
                 First thing to build server-side: read the Canvas through Slack's
                 API and have a model draft the card from it — title, the body
                 fields for the chosen type, and the keywords. Needs an OAuth token
                 per studio and a model call, so it belongs next to the write path,
                 not in the browser. The composer stays exactly as it is; this
                 fills it in rather than replacing it, because the person sharing
                 still has to agree with what it says. -->
            <div class="field compose-attach-col compose-attach-col-canvas">
              <div class="field-label"><span id="canvasFieldLabel"></span></div>
              <!-- The wrapper exists to catch the click. A disabled input is
                   inert — it fires no pointer events at all — so without
                   something over it, pressing the one control on this screen that
                   does not work would produce no response whatsoever, which reads
                   as broken rather than as unfinished. The badge sits inside the
                   field's own edge rather than up by the label: "coming soon" is a
                   fact about this box, and next to the label it was a fact about
                   the words "Slack Canvas". -->
              <div class="canvas-field" id="canvasField" role="button" tabindex="0">
                <input type="url" class="canvas-input" id="canvasLinkInput" disabled aria-disabled="true" tabindex="-1" />
                <span class="canvas-badge" id="canvasSoonLabel"></span>
              </div>
              <!-- The sentence lives here rather than in the placeholder. The

               implying something already happened. -->

<div class="expanded-card" id="expandedCard">
  <button type="button" class="icon-ghost back-btn" id="expandedClose" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  </button>
  <div class="expanded-media" id="expandedMedia"></div>
  <!-- Two panes, the same shape the Question detail below uses (conversation
       left, brief right) so both detail screens read as one design: what the
       author wrote on the left, what came back from it on the right. Stacked
       vertically they were one long column in which "How we solved it" and
       somebody else's reaction looked like the same kind of thing. -->
  <div class="expanded-panes" id="expandedPanes">

    <!-- LEFT — the finished knowledge, as its author left it -->
    <div class="expanded-pane expanded-pane-body" id="expandedBodyScroll">
      <div class="expanded-pane-inner">
        <div class="expanded-meta reveal-on-open">
          <span class="card-dot" id="expandedDot"></span>
          <span id="expandedStudioName"></span>
          <span class="sep">·</span>
          <span id="expandedAuthor"></span>
          <span class="sep">·</span>
          <span id="expandedTime"></span>

          <span id="expandedStatusBadge"></span>
          <span id="expandedLangBadge" class="lang-pending-badge" style="display:none;"></span>
        </div>
        <h2 class="expanded-title reveal-on-open" id="expandedTitle"></h2>

             order, is a property of the card's type (see FIELD_SETS), and a
             field the author left empty renders no heading at all rather than
             an empty one. -->
        <div class="reveal-on-open" id="expandedBodySections"></div>

        <!-- The lightest layer: for when even "same problem here" is more
             than you mean. Separate from the three reactions on the right. -->
        <a class="detail-link reveal-on-open" id="detailLink" target="_blank" rel="noopener noreferrer" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
          <span id="detailLinkLabel"></span>
        </a>

        <div class="body-emoji reveal-on-open" id="bodyEmojiRow"></div>

        <div class="expanded-section reveal-on-open" id="attachmentsSection" style="display:none;">
          <div class="label" id="labelAttachments"></div>
          <div class="attachments-list-wrap" id="expandedAttachmentsWrap"></div>
        </div>

        <!-- Only shown for cards created via Share mode in this session (see
             populateExpanded).

             matching the card's author/studio, server-side, rather than on a
             flag the client could flip. -->
        <div class="expanded-delete-row reveal-on-open" id="expandedDeleteRow" style="display:none;">
          <button type="button" class="edit-link" id="editCardBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 20h4L18 10a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="M14.5 6.5 17.5 9.5"/>

            <span id="editCardLabel"></span>
          </button>
          <button type="button" class="delete-link" id="deleteCardBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-.8 12.1a1 1 0 0 1-1 .9H8.8a1 1 0 0 1-1-.9L7 7"/>
            </svg>
            <span id="deleteCardLabel"></span>
          </button>
          <div class="delete-confirm" id="deleteConfirmBox" style="display:none;">
            <p id="deleteConfirmText"></p>
