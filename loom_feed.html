     the same two numbers do both, since the tracks are capped, not fluid */
  .questions-grid.is-sparse {
    max-width: min(820px, 86vw);
    grid-template-columns: repeat(auto-fit, minmax(300px, 390px));
    /* margin-block: auto, not justify-content: center — auto margins collapse
       to zero the moment the content is taller than the scroller, so three
       questions sit in the middle of the floor and thirty still scroll from
       the top instead of having their first row clipped above the scrollport.
       Only the bottom half of that pair lives here now — the top auto margin
       moved onto .questions-personal, which sits above the grid and has to be
       inside the centred block rather than pinned above it. */
    margin-block: 0 auto;
  }

  /* the marker that explains why a card is at the front of floor 3 */
  .asked-to-badge {
    display: inline-block;
    margin-top: 12px;
    padding: 4px 11px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
  }
  /* addressed to you specifically: the one thing on this floor waiting on you */
  .asked-to-badge.is-mine {
    border-color: var(--ink);
    background: var(--ink);
    color: #ffffff;
  }
  /* The softer reason to open one: a question three people are already in is a
     different invitation from one nobody has touched. */
  .question-card-activity {
    margin-top: 10px;
    font-size: 11.5px;
    color: var(--ink-faint);
  }

  .question-card {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    /* Tall enough to hold the floor, not so tall the card goes hollow.

       At 28vh three questions came to ~340px of content on a ~750px floor,
       leaving ~400px of empty page: a narrow band adrift in white, next to
       floor 2 whose posters fill the screen. But simply raising this to 46vh
       just moved the emptiness inside the card — the meta and title at the
       top, "Answer this" pinned at the foot, and a dead 180px between them,
       because justify-content: space-between does exactly what it says.

       So the box grew only moderately and the *content* grew with it (see
       .question-card-title, which is now the size the subject of a floor
       deserves). The card fills because there is more to read in it, which is
       the only honest way to fill anything. */
    min-height: clamp(280px, 34vh, 400px);
    padding: 30px 28px 24px;
    border-radius: 20px;
    border: 1.5px dashed var(--border-strong);
    background:
      repeating-linear-gradient(135deg, rgba(20, 20, 20, 0.035) 0px, rgba(20, 20, 20, 0.035) 1px, transparent 1px, transparent 13px),
      #fbf9f3;
    cursor: pointer;
    transition: transform 0.46s var(--reveal-ease), box-shadow 0.3s ease, opacity 0.42s var(--reveal-ease);
  }
  .question-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-resting); }
  .question-card.is-pre-reveal { opacity: 0; transform: translateY(30px) scale(0.985); }
  .question-card.is-hidden { opacity: 0; pointer-events: none; transform: scale(0.92); }

  .question-card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .question-card-studio { font-size: 12.5px; color: var(--ink-dim); font-weight: 600; }
  .question-card-time { margin-left: auto; font-size: 11px; color: var(--ink-faint); white-space: nowrap; }

  .question-card-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    /* The question is the whole card, and on a floor that holds nothing else it
       was set at 21px — smaller than the banner headline on floor 1 by a factor
       of four, for text that is doing the same job. Scaling with the viewport
       lets three questions fill their boxes by having more to read rather than
       by being padded out. */
    font-size: clamp(21px, 1.65vw, 29px);
    line-height: 1.36;
    color: var(--ink);
    margin: 0 0 16px;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .question-card-footer { display: flex; align-items: center; justify-content: flex-end; }
  .question-answer-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 650;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .question-answer-btn:hover { background: var(--ink); color: #fff; transform: translateY(-1px); }
  .question-answer-btn svg { width: 12px; height: 12px; }

  /* image fills the entire slide/card, text overlaid at the bottom */
  .card-media {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 32%;
    background-color: #ffffff;
  }
  .card-media-icon svg { width: 56px; height: 56px; }

  /* no real image yet: a richer placeholder than a flat wash — studio-colored
     light blooms (--card-bloom, set per card in JS) plus a fixed fine-grain
     noise texture, so an "empty" card still reads as a designed visual */
  .card-media:not(.has-image) {
    background-image: var(--card-noise), var(--card-bloom);
    background-size: 180px 180px, cover, cover, cover, cover;
    background-repeat: repeat, no-repeat, no-repeat, no-repeat, no-repeat;
    /* --card-bloom carries exactly 4 gradient layers (see mediaGradient) —
       one blend mode per actual layer so the count always lines up: the
       grain multiplies for visible-but-subtle texture, the light blooms
       composite normally so their color reads clearly */
    background-blend-mode: multiply, normal, normal, normal, normal;
  }
  /* a real image (--card-img, set per card in JS): fill the card, drop the
     big centered icon in favor of a small corner badge so the photo leads */
  .card-media.has-image {
    background-image: var(--card-img);
    background-size: cover;
    background-position: center;
  }
  /* The studio's colour over a cover, so a card with a picture still belongs
     to somebody at a glance. Multiply, and only in the upper half: the scrim
     already owns the bottom, and doubling up there would grey the picture
     out rather than colour it. --card-image-veil is the dial.

     Poster cards only, deliberately. The hero measures its own photograph to
     decide whether the chrome over it should be light or dark
     (measureImageTone), and that measurement reads the file, not the
     rendered result — a veil there would quietly make the page darker than
     the thing that chose the chrome for it. */
  .poster-card .card-media.has-image::before {
    content: '';
    position: absolute;
    inset: 0 0 38% 0;
    background: linear-gradient(
      to bottom,
      color-mix(in srgb, var(--studio-ink, #378ADD) 100%, transparent) 0%,
      transparent 100%);
    opacity: var(--card-image-veil);
    mix-blend-mode: multiply;
    pointer-events: none;
  }
  /* a document cover is a page of type — a colour wash over it would just
     dirty the paper */
  .poster-card .card-media.has-image.is-doc::before { display: none; }
  /* ---------- a document, not a photograph ----------
     A cover extracted from a deck is a 16:9 page of type, and `cover` on a
     poster card two-thirds as wide as it is tall scales it up by ~1.7 and crops
     two thirds of the width away. The result was the slide's own 64px title
     rendered at 49px, sliced mid-word, directly above the card's real title —
     two headlines fighting, which reads as a bug rather than as a picture.

     So a document is fitted rather than filled: the whole page, letterboxed
     against a colour taken from the page's own edge (imageBg), which is what a
     thumbnail of a document is supposed to look like. Photographs keep `cover`,
     because a photograph has no edges worth preserving. */
  .card-media.has-image.is-doc {
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
  }
  /* On a poster the page sits high, clear of the title block over the scrim at
     the foot; on the wide banner and in a detail it can simply centre.
     92% wide rather than `contain` into the whole card: a document cover is
     the most informative thing on the card and it was being fitted into a
     box two thirds of which is scrim. Wider, higher, and the type below it
     starts where the page ends. */
  /* A document cover on a poster gets the studio's stage, the same idea the
     hero uses: the page is an object standing on the studio's colour rather
     than a white rectangle letterboxed against more white. This is what
     makes the Browse row read blue, orange, blue while it scrolls — most of
     these cards ARE documents, so tinting only the coverless ones would have
     coloured almost nothing.

     Two layers on one element: the page, then the ground. The inline
     background-color applyCardMedia sets for the letterbox stays where it
     is and is simply covered by the opaque ground. */
  .poster-card .card-media.has-image.is-doc {
    background-image:
      var(--card-img),
      radial-gradient(118% 120% at 72% 10%,
        color-mix(in srgb, var(--studio-ink, #378ADD) var(--doc-stage-tint), var(--doc-stage-base)) 0%,
        color-mix(in srgb, var(--studio-ink, #378ADD) var(--doc-stage-edge), var(--doc-stage-base)) 60%,
        var(--doc-stage-base) 100%);
    background-size: 92% auto, cover;
    background-position: center 26%, center;
    background-repeat: no-repeat, no-repeat;
  }
  /* ---------- a document on the HERO ----------
     A page `contain`ed against flat white across a full viewport reads as a
     rendering mistake — mostly letterbox, with the scrim text lost on it. On
     the hero a document gets a stage instead: a deep navy ground tinted with
     the card's own studio colour (the lobby's nebula tone — --studio-ink is
     set by applyCardMedia), and the page itself as an object in the upper
     right, kept at its own ratio and lifted off the ground by a shadow. The
     title owns the lower left, so the two never meet. Photographs (cover)
     are untouched, and the poster/detail document treatment above stays
     exactly as it was. */
  /* Shared with the detail banner (.expanded-media below) — one stage,
     defined once, wherever a document cover has to carry a wide surface. */
  .hero-slide .card-media.has-image.is-doc,
  .expanded-media.has-image.is-doc {
    overflow: hidden;
    background-size: cover; /* the ground below, not the page — see ::after */
    background-blend-mode: normal;
    background-image:
      radial-gradient(115% 125% at 72% 16%,
        color-mix(in srgb, var(--studio-ink, #378ADD) 44%, #0a0f26) 0%,
        color-mix(in srgb, var(--studio-ink, #378ADD) 15%, #0a0f26) 48%,
        #070b1e 100%);
  }
  .hero-slide .card-media.has-image.is-doc::after {
    content: '';
    position: absolute;
    top: clamp(28px, 9vh, 84px);
    bottom: clamp(120px, 30vh, 300px); /* stays clear of the title block */
    left: 52%;
    right: clamp(28px, 6vw, 96px);
    background-image: var(--card-img);
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center top;
    filter: drop-shadow(0 26px 56px rgba(4, 8, 24, 0.55));
  }
  .card-media.has-image .card-media-icon { display: none; }
  .card-media:not(.has-image) .card-media-badge { display: none; }
  /* No image: the type mark stops being the subject of the card.

     Centred and large it was indistinguishable from what a browser leaves
     behind when an image fails — same shape, same place, same size — so a
     gallery of cards that simply have no photograph yet read as a gallery of
     broken ones. Bled off the top corner at low opacity it is texture: it
     still tints the card by type, and the type is already spelled out in
     words in .card-type, so nothing is lost by making it quiet.

     Scaled with a transform rather than a new size, because each surface
     (hero, poster, expanded, preview) sets its own svg width and this has to
     keep their proportions rather than flatten them to one number. */
  .card-media:not(.has-image) .card-media-icon {
    position: absolute;
    /* Down from the very top edge on purpose: at top:0 the mark sat behind the
       notification bell on floor 1, muddying the one corner that has to stay
       legible. 13% clears the bell at every window height the feed is used at. */
    top: 13%;
    right: 0;
    opacity: 0.15;
    transform: translate(24%, 0) scale(2.3);
    transform-origin: 100% 0;
  }

  .card-media-badge {
    position: absolute;
    top: 18px;
    left: 18px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(15, 15, 12, 0.42);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 6px 16px -8px rgba(0, 0, 0, 0.4);
  }
  .card-media-badge svg { width: 16px; height: 16px; color: #fff; }

  .card-scrim {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--card-scrim-height);
    background: linear-gradient(to top,
      rgba(8, 8, 8, var(--card-scrim-ink)), rgba(8, 8, 8, 0) 100%);
    pointer-events: none;
  }
  /* A poster's title is the largest type on the floor and it sits on a card
     that is now almost paper — so its scrim reaches higher and lands darker
     than the shared one. Photographs get the same treatment; a stronger
     scrim under a photo costs nothing but a little of its foot. */
  .poster-card .card-scrim {
    height: var(--poster-scrim-height);
    background: linear-gradient(to top,
      rgba(8, 8, 8, var(--poster-scrim-ink)),
      rgba(8, 8, 8, calc(var(--poster-scrim-ink) * 0.45)) 42%,
      rgba(8, 8, 8, 0) 100%);
  }

  .card-content {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 26px 22px 28px;
    transition: opacity var(--reveal-dur) var(--reveal-ease), transform var(--reveal-dur) var(--reveal-ease);
  }
  .card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .card-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.85);
  }
  .card-studio {
    font-size: 13px;
    letter-spacing: 0.03em;
    color: rgba(255, 255, 255, 0.92);
    font-weight: 500;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
  }
  .card-type {
    margin-left: auto;
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 4px 11px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #ffffff;
    white-space: nowrap;
  }
  .card-title {
    font-size: 21px;
    line-height: 1.34;
    font-weight: 650;
    letter-spacing: -0.01em;
    color: #ffffff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }


  /* ---------- knowledge detail ----------
     A whole screen, not a modal. It used to be a FLIP-animated card that grew
     out of the poster you clicked and floated over a blurred feed; a floating
     panel is a footnote, and a piece of knowledge is not a footnote. It takes
     the screen the same way Share does, with the same crossfade+lift (see
     .mode-fade-out and enterShareMode) so the two feel like one gesture. */
  .expanded-card {
    display: none;
    position: fixed;
    inset: 0;
    flex-direction: column;
    background: var(--bg);
    z-index: 100;
    overflow: hidden;
    opacity: 0;
    transform: translateY(12px) scale(0.992);
    /* deliberately the same numbers .mode-fade-out uses */
    transition: opacity 0.3s ease, transform 0.44s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .expanded-card.is-open { opacity: 1; transform: translateY(0) scale(1); }

  /* A teaser strip at 22vh. It was a third of the screen spent on a picture
     before a single word of what was learned — and the picture is already the
     thing you clicked. */
  .expanded-media {
    position: relative;
    flex-shrink: 0;
    height: clamp(130px, 22vh, 260px);
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #ffffff;
    background-image: var(--card-noise), var(--card-bloom);
    background-size: 180px 180px, cover, cover, cover, cover;
    background-repeat: repeat, no-repeat, no-repeat, no-repeat, no-repeat;
    background-blend-mode: multiply, normal, normal, normal, normal;
  }
  .expanded-media .card-media-icon svg { width: 52px; height: 52px; }
  /* over to the right: the banner starts at the very top of the window, and
     top-left is the hamburger's corner on every screen in this app */
  .expanded-media .card-media-badge { left: auto; right: 24px; top: 20px; }
  .expanded-media.has-image {
    background-image: var(--card-img);
    background-size: cover;
    background-position: center;
    background-blend-mode: normal;
  }
  .expanded-media.has-image .card-media-icon { display: none; }
  .expanded-media:not(.has-image) .card-media-badge { display: none; }
  /* Document cover on the detail banner: the studio-tinted stage only (the
     shared rule up with the hero's — .hero-slide … .is-doc). No page object
     here, deliberately: the detail's ATTACHMENTS section already offers the
     same PDF one scroll below, and the banner repeating it was clutter. On
     the hero the page stays — there it is the information. */

  /* ---------- the two panes ----------
     Written on the left, received on the right — the same split the Question
     detail uses for conversation/brief. Each pane scrolls on its own: a long
     body shouldn't drag the lineage list off the bottom of the window. */
  .expanded-panes {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 62fr) minmax(320px, 38fr);
    transition: opacity 0.22s ease;
  }
  .expanded-pane {
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .expanded-pane-inner { max-width: 720px; margin: 0 auto; }
  .expanded-pane-body { padding: clamp(26px, 3.6vh, 42px) clamp(28px, 3.4vw, 56px) 60px; }

  .expanded-pane-response {
    background: rgba(20, 20, 20, 0.022);
    border-left: 1px solid var(--border);
    padding: clamp(26px, 3.6vh, 42px) clamp(22px, 2.2vw, 34px) 60px;
  }
  .expanded-pane-response .expanded-pane-inner { max-width: 520px; }

  /* ======================================================================
     Now — the Update strip
     ----------------------------------------------------------------------
     Pinned to the bottom of the banner, over the darkest part of the scrim,
     and deliberately small. It is the sound of the place being lived in, not a
     second headline: the moment this competes with the title above it, floor 1
     stops being one clean thing.
     ====================================================================== */
  .now-strip {
    position: absolute;
    left: 0;
    right: 0;
    /* The strip's lane. The banner's own caption reserves exactly this much
       room below itself (see .hero-slide .card-content), so the title and the
       strip can never land on each other whatever the window height. */
    bottom: var(--now-lane-bottom);
    z-index: 4;
    padding: 0 max(5vw, 40px);
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none; /* the banner behind stays clickable between items */
  }
  .now-strip > * { pointer-events: auto; }

  .now-strip-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .now-strip-scroll::-webkit-scrollbar { display: none; }

  .now-item {
    flex: 0 0 auto;
    max-width: min(38vw, 420px);
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-family: inherit;
    font-size: 11.5px;
    color: rgba(255, 255, 255, 0.9);
    cursor: pointer;
    transition: background 0.24s ease, border-color 0.24s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .now-item:hover { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.36); transform: translateY(-1px); }
  .now-item .card-dot { width: 6px; height: 6px; flex-shrink: 0; box-shadow: none; }
  .now-item-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .now-item-time { flex-shrink: 0; font-size: 10.5px; color: rgba(255, 255, 255, 0.55); }
  .now-strip-empty { margin: 0; font-size: 12px; color: rgba(255, 255, 255, 0.55); }

  /* Whose turn. A sentence and a link, not a banner — the ask has to be small
     enough that ignoring it costs nothing.

     This used to end in a solid white pill, on the theory that being the only
     filled thing in the row was how the eye would find it. It was: it was also
     the loudest object on the floor, brighter than the cover and heavier than
     the 79px headline, and it sat eight pixels from the pencil in the corner
     that opens exactly the same screen. Two calls to action for one action, one
     of them shouting. It is a text link now — still the last thing in the
     sentence, still the only underlined thing on the cover, and no longer
     competing with the headline it is printed under. */
  .your-turn { display: flex; align-items: baseline; gap: 13px; flex-wrap: wrap; }
  .your-turn-line { font-size: 12px; color: rgba(255, 255, 255, 0.86); }
  .your-turn-cta {
    padding: 0;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: rgba(255, 255, 255, 0.96);
    /* The underline is the affordance, so it is there before the hover, not
       revealed by it. Hover only closes the gap. */
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    text-decoration-color: rgba(255, 255, 255, 0.45);
    cursor: pointer;
    transition: text-decoration-color 0.2s ease, color 0.2s ease;
  }
  .your-turn-cta:hover { text-decoration-color: currentColor; }

  /* On a Question cover the banner is paper, so the strip has to go dark-on-
     light with it — see the tone system in updateChrome. */
  .hero-slide.is-open-question ~ .now-strip .now-item,
  .discover-section.on-light .now-item {
    border-color: var(--border);
    background: rgba(255, 255, 255, 0.8);
    color: var(--ink);
  }
  .discover-section.on-light .now-item-time { color: var(--ink-faint); }
  .discover-section.on-light .now-strip-empty { color: var(--ink-dim); }
  /* Firmer than --ink-dim: the pills next to it float on a translucent plate and
     this line sits straight on the photograph, which at the bottom of a pale
     cover is mid-grey — the one place ink-dim stops being readable. */
  .discover-section.on-light .your-turn-line { color: rgba(28, 28, 30, 0.76); }
  /* On a light cover it is ink rather than paper — nothing to invert now that
     there is no fill, just the two colours the text uses. */
  .discover-section.on-light .your-turn-cta {
    color: var(--ink);
    text-decoration-color: rgba(28, 28, 30, 0.45);
  }

  /* ---------- what came of a card ----------
     One line, in the quiet colour, under the title. No number in bold and no
     icon: the moment this looks like a stat it becomes a thing to be top of. */
  /* On a cover this is white-on-photo, and on a light cover it is ink again —
     the one thing left under the hero title, so it is also the one thing that
     has to follow the tone system. The hint that used to sit beside it never
     did, and stayed white over pale covers. */
  .hero-slide .exchange-trace {
    font-size: clamp(12px, 1vw, 14px);
    margin-top: clamp(14px, 2vh, 22px);
    color: rgba(255, 255, 255, 0.82);
  }
  /* 0.76, the same ink as the strip's own quiet line: 0.66 measured 4.2:1 on a
     Question cover, which is paper white top to bottom and so the one place the
     quiet colours have nothing to hide behind. */
  .discover-section.on-light .hero-slide .exchange-trace { color: rgba(28, 28, 30, 0.76); }
  .hero-slide .exchange-trace-arrow { opacity: 0.8; }

  .exchange-trace {
    display: block;
    margin-top: 9px;
    padding: 0;
    border: none;
    background: transparent;
    font-family: inherit;
    text-align: left;
    font-size: 11.5px;
    line-height: 1.45;
    color: rgba(255, 255, 255, 0.72);
  }
  /* When the trace names one specific piece of work it is a way to get there,
     so it looks like one: an arrow, and it underlines under the pointer. */
  .exchange-trace.is-linked { cursor: pointer; transition: color 0.2s ease; }
  .exchange-trace-arrow { margin-left: 5px; opacity: 0.7; }
  /* Sized in em so it tracks the hint's font-size, which differs on every
     surface (10.5px on a poster, up to 14px on the hero). translateY nudges it
     off the true baseline onto the text's optical centre. */
  .lineage-hint-arrow {
    flex-shrink: 0;
    width: 1em;
    height: 1em;
    opacity: 0.75;
    transform: translateY(0.12em);
  }
  .exchange-trace.is-linked:hover { color: #ffffff; text-decoration: underline; text-underline-offset: 3px; }
  .question-card .exchange-trace,
  .poster-card.is-open-question .exchange-trace { color: var(--ink-faint); }
  .question-card .exchange-trace.is-linked:hover,
  .poster-card.is-open-question .exchange-trace.is-linked:hover { color: var(--ink); }

  /* floor 3's dock line — the one place a count belongs, because it is a
     count of things waiting on YOU rather than a count of your output. There
     is exactly one of these now; two lines saying different true things about
     the same list read as the app disagreeing with itself. */
  .questions-count.is-wanted { color: var(--ink); font-weight: 600; }

  /* The sentence at the top of floor 3, addressed to whoever is reading. */
  /* Sits with the cards rather than in the corner: the auto margin above it and
     the one below the grid make the pair one centred block, so a floor with
     three questions on it is a sentence and three cards, not a caption stranded
     at the top edge under the hamburger. */
  .questions-personal {
    margin: auto auto 34px;
    /* A measure, so a long sentence breaks into two balanced lines instead of
       running the width of the floor. 30ch, not 20: at 20 the longest of these
       sentences took three lines, and three lines of headline plus three cards
       overflowed a 720px-tall window. */
    max-width: 30ch;
    text-align: center;
    font-family: 'Newsreader', serif;
    /* This is the floor's headline — the one line that says why the cards below
       are worth your afternoon — and it was set at 25px, a caption's size. The
       floor holds three short cards and could not fill a tall window with them
       without padding them hollow; the honest way to use that space is to let
       the sentence be the size of its job, the way floor 1 lets its banner
       headline be. */
    font-size: clamp(24px, 2.2vw, 38px);
    font-weight: 400;
    line-height: 1.24;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-wrap: balance;
  }
  /* A short window has no spare height to give a headline. Scaling it by width
     alone meant a wide-but-short display (a 1440x800 laptop, a half-height
     browser) spent 120px of a 640px floor on one sentence. */
  @media (max-height: 840px) {
    .questions-personal { font-size: clamp(22px, 1.9vw, 30px); margin-bottom: 22px; }
  }
  .questions-personal:empty { display: none; }

  /* ---------- Share, in Update mode ----------
     Fewer things on screen, and the one box is bigger. The form should look
     like less work than the others, because it is. */
  /* A box the size of what it is asking for. The other types let their fields
     share the leftover height, which for a single one-line field meant a 540px
     void under one sentence — a form that looks like it wants an essay, which
     is the exact thing this type exists to avoid. */
  .step-compose.is-update .compose-fields { flex: 0 0 auto; }
  .step-compose.is-update .compose-fields .field { flex: 0 0 auto; }
  .step-compose.is-update .compose-fields textarea {
    flex: 0 0 auto;
    min-height: 92px;
    max-height: 130px;
  }
  .step-compose.is-update .compose-left { gap: 20px; }
  /* The whole form is a short cluster at the top and then it stops. The link
     was pushed to the bottom of the column, which left a void in the middle
     and made the last field look like something you had missed. */
  .step-compose.is-update .compose-left { justify-content: flex-start; }
  /* One line, a picture and somewhere to look. Attachments are a filing
     cabinet, and nobody attaches a PDF to a sentence — leaving the column
     there made the lightest type in the app look like the same form as the
     others with two boxes greyed out. */
  .step-compose.is-update .compose-attach-row { grid-template-columns: 1fr; }
  /* An Update is a line and maybe a link; a PDF attached to it is a different
     kind of post. */
  .step-compose.is-update .compose-attach-col-attachments { display: none; }

  /* ---------- "Add more context" ----------
     A Project asks four questions. Four empty boxes is a form you put off until
     you have time to do it properly, and most of what a studio learns never
     survives that wait. So the first box is the form and the rest are behind
     one line of text — still there, no longer in the way. */
  /* ---------- keywords, in the composer ----------
     The wrap is the input: chips and the caret share one bordered box, so it
     reads as one field you are filling rather than a list plus a text box. */
  .keyword-input-wrap {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .keyword-input-wrap:focus-within {
    border-color: var(--border-strong);
    box-shadow: 0 4px 16px -8px rgba(20, 20, 20, 0.12);
  }
  .keyword-input-wrap.is-full #keywordInput { display: none; }
  .keyword-chips { display: contents; }
  #keywordInput {
    flex: 1 1 120px;
    min-width: 120px;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 4px 2px;
    color: var(--ink);
  }
  #keywordInput::placeholder { color: var(--ink-faint); }

  /* A chip in the composer is editable — it carries its own remove button.
     The read-only chips on cards and details are .keyword-tag below. */
  .keyword-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 6px 4px 10px;
    border-radius: 999px;
    background: rgba(20, 20, 20, 0.055);
    color: var(--ink-dim);
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
  }
  .keyword-chip-remove {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: inherit;
    cursor: pointer;
    opacity: 0.5;
    padding: 0;
    transition: opacity 0.18s ease, background 0.18s ease;
  }
  .keyword-chip-remove:hover { opacity: 1; background: rgba(20, 20, 20, 0.09); }
  .keyword-chip-remove svg { width: 9px; height: 9px; }

  .keyword-suggestions {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    z-index: 30;
    max-height: 216px;
    overflow-y: auto;
    padding: 6px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
    box-shadow: 0 18px 44px -22px rgba(20, 20, 20, 0.3);
    display: none;
  }
  .keyword-suggestions.is-open { display: block; }
  .keyword-suggestion-head {
    padding: 5px 9px 6px;
    font-size: 10.5px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
  }
  .keyword-suggestion {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    padding: 8px 9px;
    border: none;
    border-radius: 8px;
    background: transparent;
    text-align: left;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
  }
  /* is-active, not :hover alone — the arrow keys move this and the pointer
     must not be the only way to see where you are */
  .keyword-suggestion:hover,
  .keyword-suggestion.is-active { background: rgba(20, 20, 20, 0.055); }
  .keyword-suggestion-count { font-size: 11px; color: var(--ink-faint); flex-shrink: 0; }
  .keyword-suggestion.is-new { color: var(--ink-dim); }
  .keyword-suggestion.is-new .keyword-suggestion-count { font-style: italic; }

  /* ---------- keywords, on a card and in a detail ----------
     Neutral on purpose. Every other mark on a card is studio-coloured because
     it says whose the work is; a keyword says the opposite — that the work is
     not only this studio's — so colouring it by studio would argue against the
     one thing it is for. */
  .keyword-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .keyword-tag {
    display: inline-flex;
    align-items: center;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid rgba(20, 20, 20, 0.1);
    background: rgba(20, 20, 20, 0.04);
    color: var(--ink-dim);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  /* On a poster/hero the tags sit on the dark scrim, not on paper. */
  .card-content .keyword-tag {
    border-color: rgba(255, 255, 255, 0.28);
    background: rgba(255, 255, 255, 0.14);
    color: rgba(255, 255, 255, 0.9);
  }
  .card-content .keyword-tags { margin-top: 9px; }
  .poster-card .keyword-tag { font-size: 10.5px; padding: 2px 8px; }
  .hero-slide .keyword-tag { font-size: clamp(11px, 0.85vw, 13px); padding: 4px 12px; }
  /* In a detail the tags are buttons: each one is a way into everything else
     under that word. */
  button.keyword-tag { cursor: pointer; transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease; }
  button.keyword-tag:hover { background: rgba(20, 20, 20, 0.09); border-color: rgba(20, 20, 20, 0.2); color: var(--ink); }
  .question-card .keyword-tags { margin-top: 12px; }
  /* ---------- tuning keywords in place ----------
     The chip row becomes the editor: same place, same words, now movable.
     A machine proposed these; this is the person disagreeing. */
  .keyword-tune {
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px dashed rgba(20, 20, 20, 0.22);
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .keyword-tune:hover { color: var(--ink-dim); border-color: rgba(20, 20, 20, 0.4); }

  .keyword-editor { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .keyword-editor-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .keyword-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 6px 3px 10px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: rgba(20, 20, 20, 0.04);
    font-family: 'Inter', sans-serif;
    font-size: 11.5px;
    color: var(--ink);
  }
  .keyword-chip-x {
    border: none;
    background: none;
    padding: 0 2px;
    font-size: 14px;
    line-height: 1;
    color: var(--ink-faint);
    cursor: pointer;
  }
  .keyword-chip-x:hover { color: var(--ink); }
  .keyword-editor-none {
    font-family: 'Inter', sans-serif;
    font-size: 11.5px;
    color: var(--ink-faint);
  }
  /* the vocabulary already in use, offered before the empty input: the point
     of Threads is that both studios reach for the same word */
  .keyword-offers { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .keyword-offers-label {
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-right: 2px;
  }
  .keyword-offer {
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: var(--ink-dim);
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .keyword-offer:hover { background: rgba(20, 20, 20, 0.05); border-color: var(--border-strong); }

  .keyword-editor-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .keyword-editor-input {
    flex: 1 1 180px;
    min-width: 140px;
    padding: 7px 12px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    color: var(--ink);
    outline: none;
  }
  .keyword-editor-input:focus { border-color: var(--ink-dim); }
  .keyword-editor-save,
  .keyword-editor-cancel {
    padding: 7px 14px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    cursor: pointer;
  }
  .keyword-editor-save {
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
  }
  .keyword-editor-save:disabled { opacity: 0.55; cursor: default; }
  .keyword-editor-cancel {
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--ink-dim);
  }
  .keyword-editor-cancel:hover { color: var(--ink); }

  /* ---------- same thread ---------- */
  .expanded-section-thread .keyword-tags { margin-bottom: 12px; }
  .same-thread-list { display: flex; flex-direction: column; gap: 2px; }
  .same-thread-item {
    display: flex;
    align-items: baseline;
    gap: 9px;
    width: 100%;
    padding: 8px 10px;
    margin: 0 -10px;
    border: none;
    border-radius: 10px;
    background: transparent;
    text-align: left;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .same-thread-item:hover { background: rgba(20, 20, 20, 0.045); }
  /* The dot is the only studio colour in the block — whose it is, at a glance,
     without the row itself being tinted. */
  .same-thread-dot {
    flex-shrink: 0;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    transform: translateY(-1px);
  }
  .same-thread-text { flex: 1 1 auto; min-width: 0; }
  /* display: block on both — they are <span>s in a <span>, so without it the
     title and the meta line flow into each other as inline text and the
     margin-top below does nothing. The rows read as one run-on line. */
  .same-thread-title {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--ink);
  }
  .same-thread-meta {
    display: block;
    margin-top: 2px;
    font-size: 11px;
    color: var(--ink-faint);
  }
  /* Which shared word put this row here — the block can be answering more than
     one keyword at once, so the row has to say which. */
  .same-thread-word { font-weight: 500; }

  /* ---------- suggested keywords ----------
     A quiet row under the hint. Chips rather than a dropdown, because this is an
     offer and not a menu: nothing has to be dismissed, and ignoring it costs
     nothing. */
  .keyword-suggest {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 9px;
  }
  .keyword-suggest-label { font-size: 11.5px; color: var(--ink-faint); }
  .keyword-suggest-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .keyword-suggest-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border: 1px dashed var(--border-strong);
    border-radius: 999px;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-dim);
    cursor: pointer;
    transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease;
  }
  /* dashed until taken, solid once it is a real chip — the border says "offered"
     rather than "applied" */
  .keyword-suggest-chip:hover {
    border-style: solid;
    border-color: var(--ink);
    color: var(--ink);
    background: rgba(20, 20, 20, 0.04);
  }
  .keyword-suggest-chip::before { content: '+'; opacity: 0.5; font-weight: 600; }

  .keyword-hint {
    margin: 7px 0 0;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--ink-faint);
  }

  .compose-more {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 2px;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-dim);
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .compose-more:hover { color: var(--ink); }
  .compose-more svg { width: 13px; height: 13px; transition: transform 0.25s ease; }
  .compose-more.is-open svg { transform: rotate(180deg); }
  .compose-extra-fields { display: none; flex-direction: column; gap: 16px; min-height: 0; }
  .compose-extra-fields.is-open { display: flex; flex: 1 1 auto; }
  /* With the extras folded away, the one visible box would inherit the whole
     leftover column — a 600px void under one sentence, which is the same "this
     form wants an essay" signal the split was meant to remove. Same fix the
     Update type already uses: a box the size of what it is asking for. */
  .compose-fields.has-hidden-extras { flex: 0 0 auto; justify-content: flex-start; }
  .compose-fields.has-hidden-extras > .field { flex: 0 0 auto; }
  .compose-fields.has-hidden-extras > .field textarea { flex: 0 0 auto; min-height: 132px; max-height: 190px; }

  .field-link input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.25s ease;
  }
  .field-link input:focus { border-color: var(--border-strong); }
  .field-link input::placeholder { color: var(--ink-faint); }

  /* a link on an Update's detail */
  .detail-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 18px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--ink-dim);
    text-decoration: none;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .detail-link:hover { border-color: var(--border-strong); color: var(--ink); }
  .detail-link svg { width: 14px; height: 14px; }

  /* ---------- since your last visit ---------- */
  .for-you-section-label {
    padding: 10px 14px 6px;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-faint);
  }
  /* There is no "nothing new since your last visit" line any more: the heading
     is only drawn when it has rows under it, so it cannot contradict them. */

  /* ======================================================================
     For you — the indicator, its arrival preview, and the panel
     ====================================================================== */
  .notify-corner {
    position: fixed;
    top: 22px;
    right: 24px;
    z-index: 320;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-direction: row-reverse; /* button on the right, toast unrolling leftward */
  }

  .notify-btn {
    position: relative;
    width: 30px;
    height: 30px;
    flex-shrink: 0;
  }
  .notify-btn svg { width: 21px; height: 21px; }

  /* The count sits on the mark rather than beside it, so the whole thing stays
     one small object in the corner. */
  .notify-count {
    position: absolute;
    top: -3px;
    right: -5px;
    min-width: 15px;
    height: 15px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--ink);
    color: #ffffff;
    font-size: 9.5px;
    font-weight: 700;
    line-height: 15px;
    text-align: center;
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 0.28s ease, transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .notify-btn.has-unread .notify-count { opacity: 1; transform: scale(1); }
  .notify-btn.on-dark .notify-count { background: #ffffff; color: var(--ink); }

  /* which studios it came from, before you open anything */
  .notify-dots {
    position: absolute;
    left: 50%;
    bottom: -7px;
    transform: translateX(-50%);
    display: flex;
    gap: 3px;
  }
  .notify-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    box-shadow: 0 0 0 1.5px var(--bg);
  }
  .notify-btn.on-dark .notify-dot { box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.45); }

  /* A breath, not a blink: 3.2s, and it only touches opacity on a halo ring —
     something flashing in the corner of a reading screen is a tax, and this has
     to be able to sit there unread for an hour without being annoying. */
  .notify-btn.has-unread::after {
    content: '';
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    opacity: 0;
    animation: notify-breathe 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes notify-breathe {
    0%, 100% { opacity: 0; transform: scale(0.86); }
    50% { opacity: 0.28; transform: scale(1); }
  }
  /* one brighter beat when something actually lands */
  .notify-btn.is-arriving { animation: notify-land 0.9s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes notify-land {
    0% { transform: scale(1); }
    28% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .notify-btn.has-unread::after { animation: none; opacity: 0.24; }
    .notify-btn.is-arriving { animation: none; }
  }

  /* The preview unrolls out of the indicator and folds back into it, so what
     you saw arrive is visibly what the count is now about. */
  .notify-toast {
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: 0;
    padding: 0;
    border-radius: 999px;
    border: 1px solid transparent;
    background: var(--surface);
    box-shadow: 0 14px 34px -20px rgba(20, 20, 20, 0.4);
    white-space: nowrap;
    overflow: hidden;
    opacity: 0;
    cursor: pointer;
    transition: max-width 0.52s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease, padding 0.4s ease;
  }
  .notify-toast.is-open {
    /* wide enough for the whole sentence in all four languages — a preview
       that ends in "..." makes you open the panel to find out what it said,
       which is exactly the trip it exists to save */
    max-width: min(56vw, 620px);
    padding: 9px 16px 9px 13px;
    border-color: var(--border);
    opacity: 1;
  }
  .notify-toast-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .notify-toast-text {
    font-size: 12.5px;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- the panel ---------- */
  .for-you-panel {
    position: fixed;
    top: 62px;
    right: 24px;
    z-index: 330;
    width: min(400px, calc(100vw - 48px));
    max-height: min(560px, calc(100vh - 110px));
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface);
    box-shadow: 0 34px 80px -34px rgba(20, 20, 20, 0.42);
    opacity: 0;
    transform: translateY(-8px) scale(0.985);
    transform-origin: top right;
    pointer-events: none;
    transition: opacity 0.24s ease, transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .for-you-panel.is-open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

  .for-you-head {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 16px 12px 20px;
    border-bottom: 1px solid var(--border);
  }
  .for-you-head h2 {
    flex: 1;
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-size: 21px;
    font-weight: 600;
    color: var(--ink);
  }
  .for-you-mark-all {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 11.5px;
    color: var(--ink-faint);
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .for-you-mark-all:hover { color: var(--ink); }
  .for-you-close {
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .for-you-close svg { width: 14px; height: 14px; }
  .for-you-close:hover { background: rgba(20, 20, 20, 0.06); color: var(--ink); }

  .for-you-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px; }

  .for-you-item {
    position: relative;
    display: flex;
    gap: 11px;
    width: 100%;
    padding: 12px 12px 12px 14px;
    border: none;
    border-radius: 13px;
    background: transparent;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .for-you-item:hover { background: rgba(20, 20, 20, 0.035); }
  /* unread: a short bar in the sending studio's colour, not a badge — the
     information is "this one is new and it came from there", and a coloured
     edge says both without adding a word */
  .for-you-mark {
    position: absolute;
    left: 4px;
    top: 15px;
    width: 3px;
    height: 20px;
    border-radius: 999px;
    background: var(--item-studio);
    opacity: 0;
    transition: opacity 0.24s ease;
  }
  .for-you-item.is-unread .for-you-mark { opacity: 1; }
  .for-you-item.is-unread .for-you-text { color: var(--ink); font-weight: 550; }

  .for-you-body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  /* One sentence per row, with the time inside it. The studio is already named
     mid-sentence, so the dot is the only other marker the row needs. */
  .for-you-text { font-size: 13px; line-height: 1.5; color: var(--ink-dim); }
  .for-you-dot {
    flex: 0 0 auto;
    width: 7px;
    height: 7px;
    margin-top: 5px;
    border-radius: 50%;
    background: var(--item-studio);
  }
  .for-you-time { color: var(--ink-faint); white-space: nowrap; }

  .for-you-empty { padding: 34px 22px 40px; text-align: center; }
  .for-you-empty-line { margin: 0 0 8px; font-size: 14px; color: var(--ink-dim); }
  .for-you-empty-sub { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-faint); }

  /* what has come back, on your own card's detail */
  .card-status .card-status-row {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12.5px;
    color: var(--ink-dim);
  }
  .card-status .card-status-row + .card-status-row { margin-top: 6px; }
  .card-status-mark {
    flex-shrink: 0;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border-strong);
  }
  /* and on the card face: dots only, no number — a number here would be a
     ranking of cards against each other */
  .card-came-back { display: inline-flex; gap: 4px; margin-top: 9px; }
  .card-came-back .card-dot { width: 7px; height: 7px; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.7); }

  /* ---------- the lineage strip ----------
     Work → work. Each box is a card someone wrote; the studio and the author
     are metadata inside it, next to a colour dot, never a box of their own.

     Stacked, not laid out sideways. This pane is ~430px wide and four nodes in
     a row is four nodes you have to scroll to read — a chain you can only see
     two links of is not a chain. Top to bottom it all fits, and the arrow
     between two nodes has room for the word that says how they are related,
     which is the part a bare "→" leaves out. */
  .lineage-strip {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    margin-bottom: 16px;
  }

  .lineage-node {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 10px 12px 11px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }
  .lineage-node:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: var(--shadow-resting); }
  /* the one you are reading: outlined in its own studio's colour, so the strip
     reads as a sentence with a subject rather than a row of equal boxes */
  .lineage-node.is-self {
    cursor: default;
    border-color: var(--node-studio);
    box-shadow: inset 0 0 0 1px var(--node-studio);
  }
  .lineage-node.is-self:hover { transform: none; box-shadow: inset 0 0 0 1px var(--node-studio); }

  .lineage-node-here {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--node-studio);
  }
  .lineage-node-type {
    align-self: flex-start;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(20, 20, 20, 0.055);
    font-size: 9px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-dim);
  }
  .lineage-node-title {
    font-size: 12.5px;
    line-height: 1.4;
    font-weight: 550;
    color: var(--ink);
  }
  .lineage-node-meta {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    color: var(--ink-faint);
  }
  .lineage-node-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .lineage-node-note {
    font-size: 10.5px;
    line-height: 1.45;
    color: var(--ink-faint);
    font-style: italic;
  }

  /* The arrow carries the relation, because "→" alone says two things are
     connected and nothing about how. */
  .lineage-arrow {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 0 6px 15px;
    color: var(--ink-faint);
  }
  .lineage-arrow-label {
    font-size: 9px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .lineage-arrow-glyph { display: flex; opacity: 0.5; }
  .lineage-arrow-glyph svg { width: 14px; height: 14px; transform: rotate(90deg); }

  /* ======================================================================
     Reactions, replies, emoji
     ====================================================================== */
  .reaction-pills { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
  .reaction-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px 7px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #ffffff;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink-dim);
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }
  .reaction-pill svg { width: 14px; height: 14px; flex-shrink: 0; }
  .reaction-pill:hover { border-color: var(--border-strong); color: var(--ink); transform: translateY(-1px); }
  .reaction-pill.is-mine { border-color: var(--ink); background: var(--ink); color: #ffffff; }

  .reaction-empty { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-faint); }

  .reaction-item {
    padding: 13px 0 14px;
    border-top: 1px solid var(--border);
  }
  .reaction-item:first-child { border-top: none; padding-top: 2px; }

  .reaction-item-head {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    font-size: 11.5px;
    color: var(--ink-faint);
  }
  .reaction-item-head .card-dot { width: 7px; height: 7px; box-shadow: none; }
  .reaction-author { font-weight: 650; color: var(--ink); font-size: 12.5px; }
  .reaction-studio { color: var(--ink-faint); }
  /* the kind, said in words rather than implied by an icon alone */
  .reaction-kind {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(20, 20, 20, 0.05);
    color: var(--ink-dim);
    font-size: 10.5px;
  }
  .reaction-kind svg { width: 11px; height: 11px; }
  .reaction-time { margin-left: auto; }

  .reaction-note {
    margin: 8px 0 0;
    font-size: 13px;
    line-height: 1.6;
    color: rgba(28, 28, 30, 0.8);
    white-space: pre-wrap;
  }

  /* the optional line, hidden until you ask for it */
  .reaction-note-editor { display: none; gap: 7px; margin-top: 9px; }
  .reaction-item.is-noting .reaction-note-editor { display: flex; }
  .reaction-item.is-noting .reaction-note-toggle { display: none; }
  .reaction-note-editor input {
    flex: 1;
    min-width: 0;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #ffffff;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--ink);
    outline: none;
  }
  .reaction-note-editor input:focus { border-color: var(--border-strong); }
  .reaction-note-save, .reply-send {
    flex-shrink: 0;
    padding: 7px 13px;
    border: none;
    border-radius: 10px;
    background: var(--ink);
    color: #ffffff;
    font-family: inherit;
    font-size: 11.5px;
    cursor: pointer;
  }
  .reaction-note-toggle {
    margin-top: 8px;
    padding: 0;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 11.5px;
    color: var(--ink-faint);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .reaction-note-toggle:hover { color: var(--ink); }

  /* ---------- replies: one level, and visibly one level ---------- */
  .reply-list { margin: 4px 0 0 13px; padding-left: 12px; border-left: 1.5px solid var(--border); }
  .reply-item { padding: 9px 0 2px; }
  .reply-head {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--ink-faint);
  }
  .reply-head .card-dot { width: 6px; height: 6px; box-shadow: none; }
  .reply-author { font-weight: 650; color: var(--ink); font-size: 11.5px; }
  .reply-time { margin-left: auto; }
  .reply-text { margin: 5px 0 0; font-size: 12.5px; line-height: 1.55; color: rgba(28, 28, 30, 0.78); white-space: pre-wrap; }

  .reply-form { display: flex; gap: 7px; margin: 9px 0 0 25px; }
  .reply-form input {
    flex: 1;
    min-width: 0;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #ffffff;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--ink);
    outline: none;
  }
  .reply-form input:focus { border-color: var(--border-strong); }
  .reply-form input::placeholder { color: var(--ink-faint); }

  /* ---------- emoji: the lightest layer, and it stays light ----------
     The count is in the body size and the body colour. Bold, coloured or large
     would turn a row of small agreements into a scoreboard, which is the thing
     this app does not do. */
  .emoji-row { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .emoji-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px 2px 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #ffffff;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease;
  }
  .emoji-chip:hover { border-color: var(--border-strong); }
  .emoji-chip.is-mine { border-color: var(--ink-dim); background: rgba(20, 20, 20, 0.045); }
  .emoji-glyph { font-size: 12px; line-height: 1.4; }
  .emoji-count { font-size: 10.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  .emoji-add { position: relative; }
  .emoji-add-btn {
    width: 21px;
    height: 21px;
    border: 1px dashed var(--border-strong);
    border-radius: 50%;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .emoji-add-btn svg { width: 11px; height: 11px; }
  /* stays out of the way until you go looking for it */
  .reaction-item:hover .emoji-add-btn,
  .reply-item:hover .emoji-add-btn,
  .body-emoji:hover .emoji-add-btn,
  .emoji-add.is-open .emoji-add-btn { opacity: 1; }
  .emoji-add-btn:hover { color: var(--ink); border-color: var(--ink-dim); }

  .emoji-picker {
    position: absolute;
    bottom: calc(100% + 7px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    z-index: 40;
    display: flex;
    gap: 2px;
    padding: 5px 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    box-shadow: 0 12px 30px -16px rgba(20, 20, 20, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .emoji-add.is-open .emoji-picker { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .emoji-option {
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 50%;
    background: transparent;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.16s ease, transform 0.16s ease;
  }
  .emoji-option:hover { background: rgba(20, 20, 20, 0.06); transform: scale(1.12); }

  /* the body's own row, under the knowledge rather than beside it */
  .body-emoji { margin: 26px 0 4px; }


  /* Below this both columns would be too narrow to read, so the response side
     goes under the body and the whole thing becomes one scroller again. */
  @media (max-width: 1080px) {
    .expanded-panes { grid-template-columns: minmax(0, 1fr); overflow-y: auto; }
    .expanded-pane { overflow: visible; }
    .expanded-pane-response {
      border-left: none;
      border-top: 1px solid var(--border);
      padding-top: clamp(22px, 3vh, 32px);
    }
    .expanded-pane-inner, .expanded-pane-response .expanded-pane-inner { max-width: 720px; }
  }

  /* Quieter than the original timestamp beside it: that a card was corrected
     is worth knowing, but it is not the headline. */
  .edited-stamp {
    font-size: 11.5px;
    font-style: italic;
    color: var(--ink-faint);
  }
  .edited-stamp::before { content: '· '; font-style: normal; }

  .expanded-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-bottom: 14px;
  }
  .expanded-meta .card-dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: none; }
  .expanded-meta .sep { opacity: 0.5; }

  .expanded-title {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 3vw, 44px);
    line-height: 1.18;
    letter-spacing: -0.02em;
    margin: 0 0 30px;
    color: var(--ink);
  }

  .expanded-section { margin-bottom: 19px; }
  .expanded-section .label {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--studio-color, #9aa3b8);
    margin-bottom: 7px;
  }
  /* Paragraph breaks the author typed are part of what they wrote. Everything
     here is set with textContent, so pre-wrap is the whole fix: newlines render
     and runs of spaces still collapse the way prose should. */
  .expanded-section p {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.65;
    color: rgba(28, 28, 30, 0.78);
    white-space: pre-wrap;
  }

  .expanded-footer {
    margin-top: 22px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  .applied-summary { font-size: 12.5px; color: var(--ink-dim); }

  /* One line under each label saying what kind of thing the block holds. The
     two blocks in this pane look alike and are not: one is talk, one is
     lineage, and the rule above the second one is the seam. */
  .section-caption {
    margin: -6px 0 13px;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--ink-faint);
  }
  .expanded-section-lineage {
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
  }

  /* ---------- lineage — what this card derived from, what derived from it,
     related ideas, and which studios applied it. A plain list, on purpose:
     a small radial graph was tried here and didn't earn its keep next to
     the bigger Discover cards elsewhere on this page — the lineage "moment"
     now lives there instead (see .card-lineage-hint), light and textual.
     This modal list is the one place it's spelled out in full. ---------- */
  .lineage-list-wrap { display: flex; flex-direction: column; gap: 9px; }
  .lineage-empty { margin: 0; font-size: 13px; line-height: 1.55; color: var(--ink-faint); font-style: italic; }
  .lineage-row { display: flex; align-items: baseline; gap: 9px; font-size: 13.5px; flex-wrap: wrap; }
  .lineage-row-studio { font-size: 11.5px; color: var(--ink-faint); }
  .lineage-row-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; align-self: center; }
  .lineage-row-relation {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .lineage-row-name { color: var(--ink); font-weight: 550; }

  .apply-btn {
    padding: 13px 24px;
    border-radius: 999px;
    border: 1.5px solid var(--studio-color, var(--ink));
    background: transparent;
    color: var(--studio-color, var(--ink));
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.3s ease, color 0.3s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease;
  }
  .apply-btn:hover { background: var(--studio-color, var(--ink)); color: #fff; transform: translateY(-1px); box-shadow: 0 10px 24px -14px rgba(20, 20, 20, 0.45); }
  .apply-btn:active { transform: scale(0.96); }
  .apply-btn.is-applied { background: var(--studio-color, var(--ink)); color: #fff; }

  /* ---------- the "we applied this too" flow ----------
     Three short questions, one at a time. A single form with all three on it
     would be a form; asked one at a time it stays a decision you can back out
     of, which is what Cancel and the backdrop are for. ---------- */
  .apply-flow {
    position: fixed;
    inset: 0;
    z-index: 520;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .apply-flow.is-open { display: flex; }
  .apply-flow-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(20, 20, 20, 0.42);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  .apply-flow-sheet {
    position: relative;
    display: flex;
    flex-direction: column;
    width: min(520px, 100%);
    max-height: min(640px, calc(100vh - 48px));
    border-radius: 20px;
    background: #ffffff;
    box-shadow: 0 40px 90px -30px rgba(20, 20, 20, 0.5);
    overflow: hidden;
  }
  .apply-flow-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 20px 18px 14px 22px;
  }
  .apply-flow-head-text { flex: 1 1 auto; min-width: 0; }
  .apply-flow-head h2 {
    margin: 0;
    font-family: 'Newsreader', serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--ink);
  }
  .apply-flow-source {
    margin: 5px 0 0;
    font-size: 12px;
    line-height: 1.45;
    color: var(--ink-faint);
  }
  .apply-flow-progress {
    padding: 0 22px 14px;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .apply-flow-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 0 22px 4px;
  }
  .apply-step { display: none; }
  .apply-step.is-active { display: block; }
  .apply-step-q {
    margin: 0 0 6px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
  }
  .apply-step-hint { margin: 0 0 14px; font-size: 12px; line-height: 1.5; color: var(--ink-faint); }

  .apply-target-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 10px; }
  .apply-option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease;
  }
  .apply-option:hover { border-color: var(--border-strong); }
  .apply-option.is-picked {
    border-color: var(--ink);
    background: rgba(20, 20, 20, 0.035);
  }
  .apply-option-dot { width: 7px; height: 7px; margin-top: 6px; border-radius: 50%; flex-shrink: 0; }
  .apply-option-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .apply-option-title { font-size: 13px; line-height: 1.4; font-weight: 550; color: var(--ink); }
  .apply-option-meta {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
  }
  .apply-empty { margin: 0 0 12px; font-size: 12.5px; color: var(--ink-faint); font-style: italic; }

  .apply-new-update {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 11px 13px;
    border: 1px dashed var(--border-strong);
    border-radius: 12px;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    font-weight: 550;
    color: var(--ink-dim);
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s ease, color 0.18s ease;
  }
  .apply-new-update:hover { border-color: var(--ink); color: var(--ink); }
  .apply-new-update.is-picked { border-style: solid; border-color: var(--ink); color: var(--ink); }
  .apply-new-update-plus { font-size: 15px; line-height: 1; }
  .apply-new-update-box { margin-top: 9px; }
  .apply-new-update-box textarea,
  #applyNoteInput {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
    resize: none;
  }
  .apply-new-update-box textarea:focus,
  #applyNoteInput:focus { outline: none; border-color: var(--ink); }

  .apply-relation-list { display: flex; flex-direction: column; gap: 7px; }

  .apply-summary {
    margin-top: 14px;
    padding: 12px 13px;
    border-radius: 12px;
    background: rgba(20, 20, 20, 0.035);
    font-size: 12px;
    line-height: 1.55;
    color: var(--ink-dim);
  }
  .apply-summary strong { font-weight: 600; color: var(--ink); }

  .apply-flow-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 22px 20px;
    border-top: 1px solid var(--border);
  }
  .apply-flow-foot-right { display: flex; align-items: center; gap: 8px; }
  .apply-flow-next {
    padding: 11px 20px;
    border-radius: 999px;
    border: none;
    background: var(--ink);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .apply-flow-next:hover:not(:disabled) { transform: translateY(-1px); }
  .apply-flow-next:disabled { opacity: 0.32; cursor: not-allowed; }

  .reveal-on-open {
    opacity: 0;
    transform: translateY(10px);
  }

  /* ---------- delete (own cards only) — tucked in a bottom corner,
     deliberately quiet (no red) so it never reads as the loudest thing on
     the card; a confirm step sits between the link and anything real ---------- */
  .expanded-delete-row {
    margin-top: 18px;
    padding-top: 4px;
    display: flex;
    justify-content: flex-end;
  }
  .delete-link {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 4px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: color 0.25s ease;
  }
  .delete-link:hover { color: var(--ink-dim); }
  .delete-link svg { width: 13px; height: 13px; }

  .delete-confirm { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  /* Edit borrows Delete's shape and sits beside it, but stays the neutral of
     the two: fixing what you wrote is ordinary, taking it back isn't. */
  .edit-link {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 13px 7px 11px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--ink-dim);
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .edit-link svg { width: 15px; height: 15px; }
  .edit-link:hover { color: var(--ink); border-color: var(--border-strong); background: rgba(20, 20, 20, 0.03); }
  .delete-confirm p { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--ink-dim); max-width: 320px; text-align: right; }
  .delete-confirm-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .btn-ghost-sm {
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--ink-dim);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }
  .btn-ghost-sm:hover { border-color: var(--ink); color: var(--ink); }
  .btn-ghost-sm:active { transform: scale(0.96); }

  .btn-delete-confirm {
    padding: 7px 14px;
    border-radius: 999px;
    border: none;
    background: var(--ink-dim);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .btn-delete-confirm:hover { background: var(--ink); transform: translateY(-1px); }
  .btn-delete-confirm:active { transform: translateY(0) scale(0.96); }

  /* ======================================================================
     Question detail — a two-pane layout that takes over the expanded-card
     shell (same FLIP open/close animation, same modal frame) instead of the
     normal problem/tried/result body: a live-feeling Conversation on the
     left, a "Conversation Brief" summary panel on the right. Uses a
     container query (not a viewport media query) so it responds to the
     modal's own width, not the browser window's. ---------- */
  .question-detail {
    display: none;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    container-type: inline-size;
    container-name: question-detail;
  }
  /* 66px, not 30: a question has no banner above it, so this header is the
     first thing under the fixed top-left hamburger and back arrow. */
  .question-detail-header { flex-shrink: 0; padding: 66px 40px 18px; border-bottom: 1px solid var(--border); }

  /* ---------- what follows a resolved question ---------- */
  /* A column, not one wrapping row: the lineage panel below is much taller than
     a button, and asking flex-wrap to keep the two apart is a bet that depends
     on how wide the panel happens to be. */
  .resolved-next {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .resolved-next-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; }
  .resolved-next-label {
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .resolved-next-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .resolved-next-btn {
    padding: 8px 15px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background: #ffffff;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-dim);
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }
  .resolved-next-btn:hover { border-color: var(--ink); color: var(--ink); transform: translateY(-1px); }
  .resolved-next-lineage { align-self: stretch; max-width: 560px; }
  .question-detail-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-bottom: 12px;
  }
  .question-detail-meta .card-dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: none; }
  .question-detail-meta .sep { opacity: 0.5; }
  .question-detail-title {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 23px;
    line-height: 1.36;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--ink);
  }

  .qd-delete-btn {
    margin-left: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    border-radius: 8px;
    transition: color 0.25s ease, background 0.25s ease;
  }
  .qd-delete-btn:hover { color: var(--ink-dim); background: rgba(20, 20, 20, 0.05); }
  .qd-delete-btn svg { width: 14px; height: 14px; }

  .question-tabs { display: none; flex-shrink: 0; border-bottom: 1px solid var(--border); }
  .question-tab {
    flex: 1;
    padding: 13px;
    border: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 650;
    color: var(--ink-faint);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.25s ease, border-color 0.25s ease;
  }
  .question-tab.is-active { color: var(--ink); border-bottom-color: var(--ink); }

  .question-panes { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 340px; }
  .question-pane { min-height: 0; display: flex; flex-direction: column; }
  .question-pane-conversation { border-right: 1px solid var(--border); }

  .conversation-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  /* ---------- one turn in the conversation ----------
     This pane is wide, and a column of near-identical grey boxes running its
     full width has no rhythm: you cannot tell at a glance where one person
     stops and the next starts, or how many people are even in it. Three cheap
     fixes, no new colours — an initials disc in the speaker's studio colour, a
     line length short of the pane, and the meta row hung off the disc so the
     eye has a left edge to run down. */
  .conversation-message { display: flex; gap: 10px; max-width: 66%; }
  .conversation-message.is-me { align-self: flex-end; flex-direction: row-reverse; }
