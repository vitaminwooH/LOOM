}

// Every piece of share-mode copy, refreshed on init and on every language
// switch — the same mechanism refreshAllText() already uses for the rest
// of the page, so this text never has a reason to fall out of sync.
function refreshShareText() {
  const s = t().share;
  const setText = (id, value) => { const el = document.getElementById(id); if (el) el.textContent = value; };

  const titleInput = document.getElementById('titleInput');
  if (titleInput) titleInput.placeholder = s.titlePlaceholder;
  setText('typeQuestionLabel', s.typeQuestion);
  document.querySelectorAll('#typePicker .type-pill').forEach((btn) => {
    const label = btn.querySelector('.type-pill-label');
    if (label) label.textContent = t().types[btn.dataset.type];
  });
  // The body fields are built per type and carry their own labels and
  // placeholders (see renderComposeFields), so a language switch re-renders
  // them rather than writing into ids that only exist for one type. Whatever
  // is already typed is carried across — switching language mid-sentence must
  // not empty the form.
  stashCurrentDraft();
  renderComposeFields(composeDrafts[selectedType]);
  setText('askedToLabel', t().askedTo.label);
  renderAskedToPicker();
  updateComposeChrome();

  setText('previewDragHint', t().previewDragHint);
  refreshImageThumb();

  setText('linkFieldLabel', t().linkLabel);
  const linkInput = document.getElementById('linkInput');
  if (linkInput) linkInput.placeholder = t().linkPlaceholder;
  setText('imageFieldLabel', s.imageLabel);
  setText('imageOptionalLabel', s.imageOptional);
  setText('uploadHintLabel', s.uploadHint);
  // aria-label only — this button's content is an inline SVG, and writing
  // textContent into it (even the empty string) deletes the mark.
  const removeBtn = document.getElementById('uploadRemoveBtn');
  if (removeBtn) removeBtn.setAttribute('aria-label', s.imageRemove);
  setText('keywordsLabel', s.keywordsLabel);
  // Re-renders rather than just relabelling: the chips' own remove buttons
  // carry a translated aria-label and title too.
  renderComposeKeywords();
  setText('attachmentsFieldLabel', s.attachmentsLabel);
  setText('attachmentsOptionalLabel', s.imageOptional);
  setText('attachmentHintLabel', s.attachmentsHint);
  setText('canvasFieldLabel', s.canvasLabel);
  setText('canvasSoonLabel', s.canvasSoon);
  const canvasInput = document.getElementById('canvasLinkInput');
  if (canvasInput) canvasInput.placeholder = s.canvasPlaceholder;
  setText('canvasHintLabel', s.canvasHint);
  // Hover says it without a click; the click says it again for touch, where
  // there is no hover to say it with.
  const canvasField = document.getElementById('canvasField');
  if (canvasField) {
    canvasField.title = s.canvasComingSoon;
    canvasField.setAttribute('aria-label', s.canvasLabel + ' — ' + s.canvasComingSoon);
  }
  setText('submitBtnLabel', s.submitButton);
  // Heading, intro, button and hint are all per-type, and refreshComposeCopy
  // owns all four. Writing the generic hint here after updateComposeChrome has
  // already set the type's own put the two-minute promise back over a one-line
  // box on every language switch and every fresh open.
  refreshComposeCopy();
  setText('weaveCaption', s.weaveCaption);
  setText('weaveDoneTitle', s.weaveDoneTitle);
  setText('weaveCount', s.weaveDoneCount);
  setText('seeFullWeaveBtn', s.seeFullWeave);
  applyEditModeLabels(); // no-op unless an edit is in progress
  setText('shareAnotherBtn', s.shareAnother);
  setText('doneBtnLabel', s.done);
  const closeBtn = document.getElementById('shareCloseBtn');
  if (closeBtn) closeBtn.setAttribute('aria-label', s.closeAria);
}

/* ---- Designers surface <-> the feed ----
   Same crossfade+scale swap share mode uses (.mode-fade-out), for the same
   reason: these are alternate surfaces occupying the gallery's real estate,
   not separate pages, so the topbar and the language switcher never blink. */
function activeSurfaceEl() {
  if (isDesignersMode) return document.getElementById('designersViewport');
  return document.getElementById('feedMain');
}

/* Whichever full-screen surface is holding the screen, torn down without its
   own exit animation — for the case where something else is about to fade in
   over the top of it and playing two transitions would just be slower.

   This exists because every "go somewhere else" path had grown its own list of
   surfaces to check, and Threads was simply missing from two of them: the menu's
   Designers branch called enterDesignersMode, whose guard refuses to run while
   Threads is up, so pressing Designers from the map did nothing at all. One
   function that knows the set is the only way that stays fixed. */
function teardownActiveSurface() {
  // Threads is not in here any more: it is a floor, so it is underneath a
  // surface rather than competing with one.
  if (isDesignersMode) {
    isDesignersMode = false;
    return document.getElementById('designersViewport');
  }
  return null;
}

function enterDesignersMode() {
  if (isDesignersMode || isShareMode || isCardExpanded) return;

  /* Threads may be what is on screen. It used to be in the guard above, which
     meant pressing Designers from the map silently did nothing; taking the map
     down here instead makes the roster reachable from wherever you are. The
     feed is put back first because the swap below fades `gallery` out, and it
     has to be the thing actually showing.

     Before the flag is set: teardownActiveSurface reads the mode flags to decide
     what is showing, so setting ours first would make it tear down this very
     surface and clear the flag we had just set. */
  const leaving = teardownActiveSurface();
  if (leaving) {
    leaving.style.display = 'none';
    document.getElementById('feedMain').style.display = 'block';
  }

  isDesignersMode = true;
  pauseAutoScroll();

  const gallery = document.getElementById('feedMain');
  const designers = document.getElementById('designersViewport');

  // Always reopen on your own studio with edit mode off — the roster is a
  // "who's here" screen first; you opt into editing it each time.
  rosterStudioIndex = 0;
  rosterEditMode = false;
  closeDesignerEditor();
  renderDesigners();

  updateChrome(); // floor 2's search box does not belong on the roster

  gallery.classList.add('mode-fade-out');
  setTimeout(() => {
    gallery.style.display = 'none';
    gallery.classList.remove('mode-fade-out');
    designers.style.display = 'flex';
    sizeAllRosters(false); // renderDesigners ran while hidden, so it measured zero
    designers.classList.add('mode-fade-out'); // reuse as this element's own "not yet visible" state
    void designers.offsetWidth;               // force reflow so the fade-in actually transitions
    designers.classList.remove('mode-fade-out');
  }, CONFIG.MODE_SWAP_MS);
}

// `onShown` runs once the feed is back on screen — that's when a floor change
// is worth animating (see focusDesigner), not while it's still faded out.
function exitDesignersMode(onShown) {
  if (!isDesignersMode) return;
  isDesignersMode = false;
  updateChrome(); // and back it comes with the floor it belongs to

  const gallery = document.getElementById('feedMain');
  const designers = document.getElementById('designersViewport');

  designers.classList.add('mode-fade-out');
  setTimeout(() => {
    designers.style.display = 'none';
    designers.classList.remove('mode-fade-out');

    gallery.style.display = 'block';
    gallery.classList.add('mode-fade-out');
    void gallery.offsetWidth;
    gallery.classList.remove('mode-fade-out');
    if (onShown) onShown();
  }, CONFIG.MODE_SWAP_MS);

  scheduleResumeAutoScroll();
}

// Swaps the gallery <-> the share surface with a short crossfade+scale (see
// .mode-fade-out), always starting share mode from a clean compose step no
// matter how the previous visit ended.
function enterShareMode() {
  if (isShareMode || isCardExpanded) return;
  isShareMode = true;
  pauseAutoScroll();

  // Share can be reached straight from the Designers roster, so fade out
  // whichever surface is actually showing — and make sure the feed, not the
  // roster, is what's underneath when share mode closes again.
  const leaving = activeSurfaceEl();
  // Designers or Threads: either can be the thing on screen when the pencil is
  // pressed, and both leave the same way.
  if (teardownActiveSurface()) {
    document.getElementById('feedMain').style.display = 'block';
  }

  // The back-to-lobby pill is fixed in the corner independent of the gallery/
  // share-viewport swap below — hide it explicitly so a stray click while
  // composing can't discard the moment by leaving the app entirely.
  document.getElementById('cornerDock').classList.add('is-hidden-in-share');
  updateChrome();

  const gallery = leaving;
  const share = document.getElementById('shareViewport');
  const compose = document.getElementById('stepCompose');
  const weave = document.getElementById('stepWeave');

  resetComposeForm();
  resetWeaveVisual();
  weave.style.display = 'none';
  TRANSITION_CLASSES.forEach((c) => { compose.classList.remove(c); weave.classList.remove(c); });
  compose.style.display = 'flex';

  gallery.classList.add('mode-fade-out');
  setTimeout(() => {
    gallery.style.display = 'none';
    gallery.classList.remove('mode-fade-out');
    share.style.display = 'flex';
    // resetComposeForm() above already tried this, but #shareViewport was
    // still display:none at that point — a scrollTop write on an element
    // with no layout box (display:none, self or ancestor) is a silent
    // no-op, so it has to happen again now that it's actually visible.
    const composeScroll = document.querySelector('#stepCompose .compose-scroll');
    if (composeScroll) composeScroll.scrollTop = 0;
    share.classList.add('mode-fade-out'); // reuse as this element's own "not yet visible" state
    void share.offsetWidth; // force reflow before clearing it, so the fade-in actually transitions
    share.classList.remove('mode-fade-out');
  }, CONFIG.MODE_SWAP_MS);
}

function exitShareMode() {
  if (!isShareMode) return;
  isShareMode = false;
  // Also the abandon path: leaving without saving drops the edit, so the next
  // visit to Share is a blank compose form rather than somebody's old card.
  editingCardId = null;

  document.getElementById('cornerDock').classList.remove('is-hidden-in-share');
  updateChrome();

  const gallery = document.getElementById('feedMain');
  const share = document.getElementById('shareViewport');

  share.classList.add('mode-fade-out');
  setTimeout(() => {
    share.style.display = 'none';
    share.classList.remove('mode-fade-out');

    flushPendingSharedCards();

    gallery.style.display = 'block';
    gallery.classList.add('mode-fade-out');
    void gallery.offsetWidth;
    gallery.classList.remove('mode-fade-out');
    // resurface the top floor, where the hero (and a newly shared card's
    // slide within it — renderDiscover() inside flushPendingSharedCards already
    // reset heroIndex to 0) lives
    goToFloor(0, { instant: true });
  }, CONFIG.MODE_SWAP_MS);

  scheduleResumeAutoScroll();
}

function initShareMode() {
  refreshShareText();
  // The only way into Share: the fixed bottom-left pencil. From a detail screen
  // it has to close that first; enterShareMode refuses while one is open.
  document.getElementById('cornerShareBtn').addEventListener('click', () => {
    if (isCardExpanded) { closeCard(); setTimeout(enterShareMode, CONFIG.MODE_SWAP_MS + 40); }
    else enterShareMode();
  });
  document.getElementById('shareCloseBtn').addEventListener('click', exitShareMode);
  document.getElementById('doneBtn').addEventListener('click', exitShareMode);
}

/* ======================================================================
   10. Page-to-page transitions — a shared veil + soft recede, used when
   actually leaving this document (loom_lobby.html); share mode above stays
   entirely in-page and never touches this.
   ====================================================================== */
function initPageTransitions() {
  const veil = document.getElementById('pageVeil');
  const appEl = document.getElementById('app');

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      veil.classList.add('is-hidden');
      appEl.classList.remove('is-transitioning');
    });
  });

  document.querySelectorAll('a[href$=".html"]').forEach((a) => {
    if (a.target === '_blank') return;
    a.addEventListener('click', (e) => {
      if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
      const href = a.getAttribute('href');
      if (!href) return;
      e.preventDefault();
      veil.classList.remove('is-hidden');
      appEl.classList.add('is-transitioning');
      setTimeout(() => { window.location.href = href; }, 420);
    });
  });
}
