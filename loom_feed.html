/* The chosen language outlives the tab. Without this every reload dropped a
   German or Korean reader back into English, which is the one thing a
   four-language prototype must not do while being demonstrated.

   Read before first paint (it decides what every render below emits) and
   written by setLanguage. An earlier build stored this under `loom_lang`, so
   that value is adopted once and the old key retired. */
const LANGUAGE_STORAGE_KEY = 'loom_language';
const LEGACY_LANGUAGE_STORAGE_KEY = 'loom_lang';

function readStoredLanguage() {
  /* The address wins over the preference: a link that says ko is somebody
     handing this page to somebody else in Korean, which is a more specific
     statement than what this browser last chose for itself. Read here rather
     than corrected later, so the first render is already right. */
  const fromUrl = new URLSearchParams((location.hash || '').replace(/^#/, '')).get('lang');
  if (fromUrl && TRANSLATIONS[fromUrl]) return fromUrl;

  let stored = null;
  try {
    stored = localStorage.getItem(LANGUAGE_STORAGE_KEY);
    if (!stored) {
      const legacy = localStorage.getItem(LEGACY_LANGUAGE_STORAGE_KEY);
      if (legacy && TRANSLATIONS[legacy]) {
        stored = legacy;
        localStorage.setItem(LANGUAGE_STORAGE_KEY, legacy);
        localStorage.removeItem(LEGACY_LANGUAGE_STORAGE_KEY);
      }
    }
  } catch (err) { /* storage blocked — fall through to the default */ }
  // Validated, not trusted: a hand-edited or retired code must not leave t()
  // reading properties off undefined.
  return stored && TRANSLATIONS[stored] ? stored : 'en';
}

/* ======================================================================
   Where you are, in the address bar
   ----------------------------------------------------------------------
   The feed is one page with four floors and two surfaces over it, so
   without this a refresh threw the reader back to the lobby and a card
   could not be sent to anyone. The state lives in the hash — GitHub Pages
   serves static files and cannot rewrite paths — as plain pairs:

     #f=2                 floor (0 cover, 1 knowledge, 2 questions, 3 threads)
     #s=designers         a surface holding the screen
     #card=cv-2026…       an open card detail — this is the shareable link
     #lang=ko&studio=whow the reading language, and whose feed it is

   Two rules keep the history sane:
     - moving between floors and switching language REPLACE the entry.
       Scrolling is not navigation, and nobody wants twenty back presses
       to leave a page.
     - opening a card or the roster PUSHES one, so Back closes it. That is
       the only "back" anyone means here.
   Guests and signed-in readers behave identically; the studio in the URL
   is only honoured for someone whose studio is not already decided by a
   profile.
   ====================================================================== */
const URL_FLOOR_MAX = 3;
let applyingUrlState = false;   // guard: applying state must not re-write it
let pendingUrlCard = null;      // a card id from the URL, waiting for the cards
let pendingUrlThread = null;    // likewise a thread keyword

function readUrlState() {
  const raw = (location.hash || '').replace(/^#/, '');
  const params = new URLSearchParams(raw);
  const floor = parseInt(params.get('f'), 10);
  return {
    floor: isFinite(floor) ? Math.max(0, Math.min(URL_FLOOR_MAX, floor)) : null,
    surface: params.get('s'),
    card: params.get('card'),
    thread: params.get('thread'),
    lang: TRANSLATIONS[params.get('lang')] ? params.get('lang') : null,
    studio: isStudioEnabled(params.get('studio')) ? params.get('studio') : null,
  };
}

// The address for the state the app is in right now.
function currentUrlState() {
  const params = new URLSearchParams();
  if (isCardExpanded && currentOpenIndex !== null && ALL_CARDS[currentOpenIndex]) {
    params.set('card', ALL_CARDS[currentOpenIndex].id);
  } else if (isThreadViewMode && threadViewKey) {
    params.set('thread', threadViewKey);
  } else if (isDesignersMode) {
    params.set('s', 'designers');
  } else if (isShareMode) {
    params.set('s', 'share');
  } else {
    params.set('f', String(currentFloor));
  }
  params.set('lang', currentLang);
  params.set('studio', MY_STUDIO_KEY);
  return '#' + params.toString();
}

/* Writes the address. `replace` for anything that is not a navigation —
   see the two rules above. Never fires while URL state is being applied. */
function syncUrlState(options) {
  if (applyingUrlState) return;
  const next = currentUrlState();
  if (next === location.hash) return;
  try {
    if (options && options.push) history.pushState(null, '', next);
    else history.replaceState(null, '', next);
  } catch (err) { /* a file:// page has no history to write — harmless */ }
}

/* Puts the app into the state an address describes. Used on load and on
   Back/Forward, so the two can never drift apart. */
function applyUrlState(state, opts) {
  const boot = !!(opts && opts.boot);

  /* A link naming a different studio, followed while the page is already
     open: MY_STUDIO_KEY is read once at startup and every surface asks it
     who we are, so the honest way to change it is to start again. Skipped
     for a signed-in reader — their profile decides, not a link — and it
     cannot loop, because after the reload the two agree. */
  if (!boot && state.studio && state.studio !== MY_STUDIO_KEY && !authProfile) {
    try {
      localStorage.setItem(CURRENT_STUDIO_STORAGE_KEY, state.studio);
      location.reload();
      return;
    } catch (err) { /* storage blocked — carry on with the studio we have */ }
  }

  applyingUrlState = true;
  try {
    if (state.lang && state.lang !== currentLang) {
      if (boot) currentLang = state.lang; // before the first render: no fade
      else setLanguage(state.lang);
    }
    // a card wins over a floor: it is the thing the link was for
    if (state.card) {
      if (isDesignersMode) exitDesignersMode();
      const known = ALL_CARDS.some((c) => c.id === state.card);
      if (known) {
        if (!isCardExpanded || (ALL_CARDS[currentOpenIndex] || {}).id !== state.card) {
          openCardById(state.card);
        }
      } else {
        // the cards may not have arrived yet — try again when they do
        pendingUrlCard = state.card;
      }
      return;
    }
    if (isCardExpanded) closeCard();
    if (state.thread) {
      // the cards may not have arrived yet; the weave is where this is
      // normally reached from, so a cold link simply waits for them
      if (ALL_CARDS.length) {
        if (!isThreadViewMode || threadViewKey !== state.thread) openThreadView(state.thread);
      } else {
        pendingUrlThread = state.thread;
      }
      return;
    }
    if (isThreadViewMode) closeThreadView();
    if (state.surface === 'designers') {
      if (!isDesignersMode) enterDesignersMode();
      return;
    }
    if (isDesignersMode) exitDesignersMode();
    if (state.floor !== null && state.floor !== currentFloor) {
      goToFloor(state.floor, { instant: boot });
    }
  } finally {
    // the guard lifts after the surfaces have finished their own callbacks
    setTimeout(() => { applyingUrlState = false; }, 0);
  }
}

// A card named in the URL that did not exist yet at boot (the list arrives
// asynchronously). Called once the remote cards land.
function applyPendingUrlCard() {
  /* The boot stamp ran while these were still pending, so the address says
     #f=0 right now — once the surface is actually open, write the truth
     back (replace, not push: the reader never left). */
  if (pendingUrlThread) {
    const word = pendingUrlThread;
    pendingUrlThread = null;
    applyingUrlState = true;
    openThreadView(word);
    setTimeout(() => { applyingUrlState = false; syncUrlState({ replace: true }); }, 0);
  }
  if (!pendingUrlCard) return;
  const id = pendingUrlCard;
  pendingUrlCard = null;
  if (ALL_CARDS.some((c) => c.id === id)) {
    applyingUrlState = true;
    openCardById(id);
    setTimeout(() => { applyingUrlState = false; syncUrlState({ replace: true }); }, 0);
  }
}

function initUrlState() {
  window.addEventListener('popstate', () => applyUrlState(readUrlState()));
  // the hash can also be edited by hand or arrive from an external link
  window.addEventListener('hashchange', () => {
    if (applyingUrlState) return;
    if (location.hash !== currentUrlState()) applyUrlState(readUrlState());
  });
  const state = readUrlState();
  // "nothing in the address" has to mean NOTHING — this list must name every
  // kind of state a link can carry, or that kind silently dies on a cold load
  if (state.floor === null && !state.surface && !state.card && !state.thread) {
    syncUrlState({ replace: true }); // first visit: stamp where we are
    return;
  }
  applyUrlState(state, { boot: true });
  syncUrlState({ replace: true });
}

let currentLang = readStoredLanguage();
function t() { return TRANSLATIONS[currentLang].ui; }
/* ct(index) is gone with the seed cards: a card's text is on the card now,
   one resolved language block from the DB (or, for something typed in this
   browser, whatever the author wrote). See cardText. */

// Relative-time phrasing differs enough across languages (word order,
// pluralization rules) that each gets its own small formatter instead of
// forcing everything through one interpolation pattern.
const TIME_UNIT_FORMS = {
  en: { minute: ['minute', 'minutes'], hour: ['hour', 'hours'], day: ['day', 'days'], week: ['week', 'weeks'], month: ['month', 'months'] },
  de: { minute: ['Minute', 'Minuten'], hour: ['Stunde', 'Stunden'], day: ['Tag', 'Tagen'], week: ['Woche', 'Wochen'], month: ['Monat', 'Monaten'] },
};
// minute/hour joined the list when edits started carrying a timestamp — a
// card's age is measured in days, but a correction made while you are looking
// at it is not.
const TIME_UNIT_WORDS_KO = { minute: '분', hour: '시간', day: '일', week: '주', month: '개월' };
const TIME_UNIT_WORDS_TR = { minute: 'dakika', hour: 'saat', day: 'gün', week: 'hafta', month: 'ay' };

function formatRelativeTime(lang, value, unit) {
  if (lang === 'ko') return `${value}${TIME_UNIT_WORDS_KO[unit]} 전`;
  if (lang === 'tr') return `${value} ${TIME_UNIT_WORDS_TR[unit]} önce`;
  if (lang === 'de') {
    const forms = TIME_UNIT_FORMS.de[unit];
    return `vor ${value} ${value === 1 ? forms[0] : forms[1]}`;
  }
  const forms = TIME_UNIT_FORMS.en[unit];
  return `${value} ${value === 1 ? forms[0] : forms[1]} ago`;
}

/* ======================================================================
   2. Data — change this array to change the cards. Studio/type/area/author
      /time/appliedBy never change with language; translatable copy lives
      in TRANSLATIONS[lang].cards at the same index.
   ====================================================================== */
// `enabled: false` keeps a studio's config, sample cards, and weave cluster
// in the code (so turning it back on later is a one-line flip) while
// removing every trace of it from the screen — same pattern as the
// `enabled` flag on loom_lobby.html's STUDIOS array. Paxie's collaboration
// isn't confirmed yet, so it stays off here too.
const STUDIOS = {
  // `logo` is probed before it is used (see buildStudioMark) — a studio with no
  // file on disk falls back to its colour dot rather than a broken tile.
  doubleu: { name: 'DoubleU', color: '#378ADD', enabled: true, logo: 'assets/doubleu-logo.png' },
  whow: { name: 'Whow', color: '#D85A30', enabled: true, logo: 'assets/whow-logo.png' },
  paxie: { name: 'Paxie', color: '#1D9E75', enabled: false },
};

// The studios that actually exist in this build, in declaration order.
// Paxie is in STUDIOS but disabled, and three places were each writing their
// own filter over Object.keys to leave it out.
function enabledStudioKeys() {
  return Object.keys(STUDIOS).filter(isStudioEnabled);
}

function isStudioEnabled(key) {
  return !!(STUDIOS[key] && STUDIOS[key].enabled);
}

// Applied-by lists are authored alongside disabled studios too (e.g. a
// DoubleU card that Paxie also applied) — filter those mentions out at
// display time rather than hand-editing every appliedBy array.
function visibleAppliedBy(data) {
  return data.appliedBy.filter(isStudioEnabled);
}

/* Which studio "you" are, for this session: whichever button you pressed in
   loom_lobby.html, which writes it here on the way out. Drives the author on
   anything you share, and in Designers both the studio shown first and which
   roster you're allowed to edit.

   TODO(auth): in a real service this comes from the signed-in account, and
   the edit permission is enforced server-side. localStorage is user-writable,
   so it can stand in for "who am I" in a prototype but could never be the
   basis for an authorisation decision. */
/* ======================================================================
   Section 2a — persistence
   ----------------------------------------------------------------------
   TODO(backend): localStorage is the wrong home for any of this and is only
   standing in while this is a prototype. It is per-browser (so "the studio's
   roster" is really "the roster on this one machine"), per-origin (~5MB total,
   shared with everything else this page stores), synchronous, and trivially
   editable by the reader — none of which a knowledge base for several studios
   can live with. A real Loom keeps cards, rosters and attachments in a server
   database, with the author's identity checked server-side rather than read
   out of `loom_current_studio`, and uploads in object storage rather than
   base64 in a string. Every function below is written so that swapping in
   `await api.put(...)` touches this section and nothing else.

   What it does in the meantime: never leave storage half-written. setItem is
   atomic per key, but "the write threw" and "the write worked" are not the
   only two outcomes — Safari's private mode throws on any write at all, and a
   quota failure part-way through a multi-key update would leave two keys
   disagreeing. So every write snapshots the previous value, writes, reads
   back what actually landed, and restores the snapshot if it doesn't match.
   ====================================================================== */

// Roughly how much of the origin budget is in use. UTF-16 in memory, so two
// bytes per code unit is the honest estimate; the browsers that report a real
// number don't agree with each other anyway. Diagnostics only — nothing
// branches on it.
function storageUsageBytes() {
  let units = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      units += k.length + (localStorage.getItem(k) || '').length;
    }
  } catch (err) { return -1; }
  return units * 2;
}

const STORAGE_BUDGET_BYTES = 5 * 1024 * 1024; // what browsers converge on

function logStorageUsage(label) {
  const used = storageUsageBytes();
  if (used < 0) { console.warn('[Loom storage] usage unavailable (storage is blocked)'); return; }
  const pct = (used / STORAGE_BUDGET_BYTES) * 100;
  const detail = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      detail.push(k + ' ' + Math.round(((localStorage.getItem(k) || '').length * 2) / 1024) + 'KB');
    }
  } catch (err) { /* enumerating is best-effort */ }
  const line = '[Loom storage] ' + (label || 'usage') + ': '
    + Math.round(used / 1024) + 'KB of ~' + Math.round(STORAGE_BUDGET_BYTES / 1024) + 'KB'
    + ' (' + pct.toFixed(1) + '%) — ' + (detail.join(', ') || 'empty');
  if (pct > 80) console.warn(line + '  ← running out of room');
  else console.log(line);
}

/* The one write. Returns { ok, quota, err }:
     ok    — the value is in storage and reads back byte-identical
     quota — it failed specifically because there is no room, which is the one
             failure the caller can do something about (drop an image, trim
             older entries) rather than just report */
function safeSetItem(key, value) {
  let previous = null;
  try {
    previous = localStorage.getItem(key);
  } catch (err) {
    // Reading threw, so storage is unavailable outright (blocked cookies,
    // private mode). Nothing to roll back to and nothing will land.
    console.error('[Loom storage] storage is unavailable:', err);
    return { ok: false, quota: false, err: err };
  }

  const restore = () => {
    try {
      if (previous === null) localStorage.removeItem(key);
      else localStorage.setItem(key, previous);
    } catch (err) {
      console.error('[Loom storage] rollback of "' + key + '" failed:', err);
    }
  };

  try {
    localStorage.setItem(key, value);
  } catch (err) {
    restore();
    // Chrome/Safari/Firefox all name it differently; code 22 is the DOMException
    // constant, and Firefox's own name is the third case.
    const quota = err && (err.name === 'QuotaExceededError'
      || err.name === 'NS_ERROR_DOM_QUOTA_REACHED'
      || err.code === 22);
    if (quota) console.warn('[Loom storage] no room for "' + key + '" (' + Math.round(value.length * 2 / 1024) + 'KB)');
    else console.error('[Loom storage] write to "' + key + '" failed:', err);
    logStorageUsage('after a failed write');
    return { ok: false, quota: !!quota, err: err };
  }

  // A write can "succeed" and still not be there — some browsers accept the
  // call and drop the value once the budget is gone.
  let landed = null;
  try { landed = localStorage.getItem(key); } catch (err) { /* fall through */ }
  if (landed !== value) {
    console.error('[Loom storage] "' + key + '" did not read back as written — rolling back');
    restore();
    return { ok: false, quota: true, err: null };
  }

  return { ok: true, quota: false, err: null };
}

const CURRENT_STUDIO_STORAGE_KEY = 'loom_current_studio';

function readCurrentStudioKey() {
  /* A link carries the studio it was sent from, which is what makes a card
     link work for someone who has never been here. It cannot grant anything:
     a signed-in reader's studio comes from their profile and overrides this
     (see initAuthSession), and the server never trusts either one. */
  const fromUrl = new URLSearchParams((location.hash || '').replace(/^#/, '')).get('studio');
  if (fromUrl && isStudioEnabled(fromUrl)) return fromUrl;

  let stored = null;
  try {
    stored = localStorage.getItem(CURRENT_STUDIO_STORAGE_KEY);
  } catch (err) { /* storage blocked — fall through to the default */ }
  // Validated, not trusted: a stale or hand-edited value for a studio that's
  // been switched off (see STUDIOS.enabled) must not leave the page pointing
  // at a studio it won't render.
  if (stored && isStudioEnabled(stored)) return stored;
  return Object.keys(STUDIOS).find(isStudioEnabled) || 'doubleu';
}

const MY_STUDIO_KEY = readCurrentStudioKey();

// Share mode's small in-page "weave" network reuses STUDIOS above, plus a
// cluster center per studio for laying out its nodes.
const WEAVE_CLUSTER_CENTERS = {
  doubleu: { x: 0.24, y: 0.32 },
  whow: { x: 0.76, y: 0.30 },
  paxie: { x: 0.50, y: 0.80 },
};
const WEAVE_STUDIOS = Object.keys(STUDIOS)
  .filter(isStudioEnabled)
  .map((key) => ({
    key,
    color: STUDIOS[key].color,
    center: WEAVE_CLUSTER_CENTERS[key],
  }));

/* Five places to go, in the order somebody actually wants them: write
   something, read everything, see what's unanswered, see who's here.

   This used to be the type filter (All / Projects / Experiments) wearing a
   menu's clothes, which answered a question nobody opens a menu to ask — and
   it meant two of the six items didn't navigate anywhere, they just re-filtered
   the floor you were already on. Filtering by type belongs to floor 2, where
   the posters are, and it still lives in that floor's own dock.

   Tools has no destination yet and says so in place rather than looking
   identical to the four that work. */
/* Four floors, and the order is an argument: everything happening now, then the
   work that held up, then the questions still open, then what all of it adds up
   to. Threads is last because it is the closing line, and you get there by
   carrying on downward rather than by leaving the feed to look at it. */
const FLOOR_COUNT = 4;
// Named because the menu's sub-items go to floor 2 without being floor 2's own
// entry in MENU_ITEMS, so the number would otherwise be written twice.
const FLOOR_BROWSE = 1;
const FLOOR_THREADS = 3;

const MENU_ITEMS = [
  // "New knowledge" is the newest knowledge — the cover on floor 1 — not the
  // form for writing some. Writing is the pencil in the bottom-left corner,
  // which is on every screen; a menu item that opened a composer under a name
  // that reads as a destination sent people somewhere they had not asked to go.
  { key: 'newest', tier: 0 },
  /* Knowledge is the whole floor; its two sub-items are the same floor with the
     type filter already set. They are declared here rather than as items of
     their own because they are not destinations — see renderMenuOverlay. */
  { key: 'browse', tier: FLOOR_BROWSE, subItems: [
    { key: 'projects', filter: 'project' },
    { key: 'experiments', filter: 'experiment' },
  ] },
  { key: 'question', tier: 2 },
  { key: 'threads', tier: FLOOR_THREADS },
  { key: 'designers', designers: true },
  { key: 'tools', comingSoon: true },
];

/* ======================================================================
   2a. Designers — the people behind the cards, one studio at a time.

   The point is "who is making this", nothing more. There is no score, no
   ranking, no sorting by output and no leaderboard here, and there must
   never be one: head office does not evaluate or rank the studios, and a
   people page that quietly orders everyone by contribution count is exactly
   the same thing wearing a friendlier hat. A card carries a photo, a name
   and a job title — nothing that can be compared against the next card.

   Each studio owns its own list and edits it itself (see canEditRoster).
   `name` doubles as the join key back into a card's `author` field, which is
   what the click-through filter uses.

   Two shapes of role live side by side, the same way card copy does:
   `roleKey` on the seeded entries looks up a translated label, while `role`
   on anything a studio typed is free text kept exactly as written (there's
   no machine translation in this prototype). renderDesigners prefers `role`.
   ====================================================================== */
/* `links` is how to reach a person, and every one of the five kinds is
   optional — a card back renders only what someone actually filled in, so a
   roster where nobody has a Behance never shows an empty Behance row.
   `photoPos` is the focal point of their portrait as {x, y} percentages; see
   makeFocalDraggable for why a face is so rarely in the middle of a 1:1.4 crop. */
/* `workingOn` and `canHelp` are free text and always in the language they were
   typed in — same rule as `role` (see the note above). They come before the
   contact details everywhere they appear: a job title and an email address tell
   you who somebody is, and neither tells you whether it is worth writing to
   them this week, which is the only question anyone opens a roster with. */
/* ======================================================================
   Naming things in assets/
   ----------------------------------------------------------------------
   Lower case, hyphen separated, no spaces. minwoo-heo.jpg, never
   "Minwoo Heo.png".

   Local development is served off a case-insensitive filesystem (NTFS/APFS) and
   GitHub Pages is not, so `assets/Minwoo Heo.png` resolves locally and 404s in
   production — the failure mode that costs the most, because the machine you
   test on is the one that cannot show it to you. Spaces then have to be
   percent-encoded in every reference, and one written raw works in some
   browsers and not others.

   Photographs are JPEG, not PNG: these are camera images with no transparency,
   and the same picture is roughly a tenth of the size. Long edge 1500px is
   enough for the roster card on a 2x display, which is 667x934 css at its
   largest.
   ====================================================================== */
/* ======================================================================
   The four real people come first, then the seeded ones
   ----------------------------------------------------------------------
   These four are in code, with their pictures committed to assets/, because a
   roster that only exists in localStorage is a roster only the person who typed
   it can see. Everything added through the in-app editor is written to
   loom_designers_v1 on one machine and one browser profile — so the faces that
   had been curated locally were, correctly and invisibly, absent from the
   deployed site for everybody else. Anything that should be there for a visitor
   on their first load has to be here instead.

   Only what is verifiable is filled in. Names are the ones on the files;
   Minwoo Heo and Bengt Ott are placed by their own cards (x1/x3 are DoubleU's,
   x2 is Whow's). Roles, what they are working on, what they can help with and
   their contact details are left empty on purpose: those are facts about real
   colleagues, and a plausible guess about a real person is just a wrong answer
   that looks right. They render as absent rather than as blanks — see
   buildDesignerCard, where every one of those fields is guarded — and the back
   of the card still fills itself in from the network, because
   mostRecentCardBy(name) finds the work they have actually shared.

   ASSUMPTION, worth correcting if wrong: Sua Song is placed with DoubleU and
   Felix Heitmann with Whow. Neither authors a card, so unlike the other two
   there is nothing in the data that says which studio they belong to.

   Three to a studio: the two real people, then the one seeded card that shows
   what a filled-in one looks like.

   Editing any of them in the app still works exactly as before, and still wins:
   loadDesigners() returns the stored list whole when there is one. Which also
   means a browser that has edited the roster before will not see this list until
   loom_designers_v1 is cleared.
   ====================================================================== */
/* The seeded roster that used to sit here is GONE too — same reasoning as
   the seed cards. persons is the roster (see data.js loadRoster); an empty
   list until it arrives is the truth, and inventing designers to fill the
   gap is what this whole cleanup is removing. */

/* The five kinds, in the order they appear on a card back and in the editor.
   Adding a sixth needs an entry here and a placeholder string per language —
   no markup and no save-path change (see renderEditorLinkRows/readEditorLinks). */
const DESIGNER_LINK_KINDS = [
  { key: 'email', icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>` },
  { key: 'website', icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg>` },
  { key: 'behance', icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h5a3 3 0 0 1 0 6H4zM4 12h5.5a3 3 0 0 1 0 6H4z"/><path d="M14.5 15.5h6a3 3 0 1 0-6-1.2v1.2a3 3 0 0 0 5.2 2"/></svg>` },
  { key: 'vimeo', icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg>` },
  { key: 'instagram', icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.4"/><circle cx="16.8" cy="7.2" r="1" fill="currentColor" stroke="none"/></svg>` },
];

function designerLinkHref(kind, value) {
  if (kind === 'email') return 'mailto:' + value;
  return /^https?:\/\//i.test(value) ? value : 'https://' + value;
}

// The address for an email, otherwise the bare host+path — so a pasted
// "https://behance.net/x" doesn't shout its protocol on the card.
function designerLinkText(kind, value) {
  if (kind === 'email') return value;
  return value.replace(/^https?:\/\//i, '').replace(/\/$/, '');
}

function designerLinkEntries(person) {
  const links = (person && person.links) || {};
  return DESIGNER_LINK_KINDS
    .map((k) => ({ kind: k.key, icon: k.icon, value: (links[k.key] || '').trim() }))
    .filter((entry) => entry.value);
}

const DESIGNERS_STORAGE_KEY = 'loom_designers_v1';

// Once a studio has edited anything, the stored list is the whole truth for
// every studio — not a patch on top of the seed. Otherwise deleting a seeded
// designer would resurrect them on the next load.
function loadDesigners() {
  try {
    const parsed = JSON.parse(localStorage.getItem(DESIGNERS_STORAGE_KEY));
    if (Array.isArray(parsed)) return parsed;
  } catch (err) {
    console.error('[Loom feed] could not read the designer roster from localStorage:', err);
  }
  return []; // the roster comes from persons; empty until it arrives
}

let designerRoster = loadDesigners();

/* The shared roster lives in the persons table (see data.js loadRoster).
   Fetched at boot now rather than on the first Designers open: with no
   seeded roster left to stand in, opening that floor before the fetch landed
   would show "nobody here yet" about a roster that exists. A few KB once.

   THE DB IS THE TRUTH: a fetched roster always takes the screen. The local
   list (loom_designers_v1) is only this machine's holding pen for edits that
   never reached the DB — declined code, offline — and the next successful
   DB save clears it outright, so two quietly diverging rosters cannot
   happen. Editor saves go through submit_roster_edit / roster-photo behind
   the same shared write code the cards use. */
let remoteRosterRequested = false;

function initRemoteRoster() {
  if (remoteRosterRequested || !window.LoomData || !LoomData.isConfigured()) return;
  remoteRosterRequested = true;
  LoomData.loadRoster().then((people) => {
    if (!people || !people.length) return; // unreachable/empty — keep what we have
    designerRoster = people;
    renderDesigners();
  });
}

function clearLocalRosterStore() {
  try { localStorage.removeItem(DESIGNERS_STORAGE_KEY); } catch (err) { /* fine */ }
}

/* The editor's save, after the in-memory roster has been updated and the
   screen re-rendered. Success = the DB row (possibly with a freshly minted
   canonical id) replaces the local entry and the local store is cleared;
   any failure = persistDesigners(), which is exactly the behaviour this
   feature replaced — no visible difference. */
function attemptRemoteRosterSave(person) {
  const fallback = () => persistDesigners();
  if (!window.LoomData || !LoomData.isConfigured()) return fallback();

  // a data: photo is a local upload the RPC cannot carry — it rides after
  const photoDataUrl = person.photo && person.photo.indexOf('data:') === 0 ? person.photo : null;

  writeCredential().then(({ authed, code }) => {
  if (!authed && !code) return fallback();

  LoomData.submitRosterEdit(person, code).then((res) => {
    if (!res.ok) {
      if (res.invalidCode && !authed) forgetWriteCode();
      console.warn('[Loom roster] edit kept on this device only:', res.message || res.reason);
      return fallback();
    }
    const saved = res.person;
    const idx = designerRoster.findIndex((d) => d === person || d.id === person.id);
    if (idx >= 0) {
      // keep the local photo (and crop) on screen until the upload lands
      designerRoster[idx] = Object.assign({}, saved,
        photoDataUrl ? { photo: person.photo, photoPos: person.photoPos } : {});
    }
    clearLocalRosterStore();
    renderDesigners();

    if (photoDataUrl) {
      LoomData.uploadRosterPhoto(saved.id, photoDataUrl, code).then((pr) => {
        if (!pr.ok) {
          if (pr.invalidCode && !authed) forgetWriteCode();
          console.warn('[Loom roster] photo kept on this device only:', pr.message || pr.reason);
          persistDesigners(); // the dataURL survives locally until a retry
          return;
        }
        const p = designerRoster.find((d) => d.id === saved.id);
        if (p) { p.photo = pr.photo_path; renderDesigners(); }
      });
    }
  });
  });
}

/* ---- reorder by drag (edit mode, mouse) ------------------------------------
   Three motions, three rules:
     - the card in hand follows the pointer RAW — transform set every move,
       transitions off, because the hand comes first;
     - everyone else slides: when the row reorders, siblings FLIP from their
       old slot to the new one (transform only, ROSTER_DRAG_ANIM_MS);
     - letting go settles: the held card glides from wherever the hand left
       it into its slot with the same easing, scale and shadow releasing with
       it. A failed save glides everything back the same way.
   prefers-reduced-motion skips all of it — instant placement, as before.
   Below the 6px slop it is a click like any other. Touch is out of scope. */
const ROSTER_DRAG_ANIM_MS = 220;
const ROSTER_DRAG_EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
const ROSTER_DRAG_SCALE = 1.05;

// one source of truth: the CSS side (the ::after shadow fade) reads these
document.documentElement.style.setProperty('--roster-drag-ms', ROSTER_DRAG_ANIM_MS + 'ms');
document.documentElement.style.setProperty('--roster-drag-ease', ROSTER_DRAG_EASE);

function rosterMotionOff() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

// current translate of an element, read off its computed matrix — the FLIP
// below has to know where a mid-flight card VISUALLY is, not where its slot is
function currentTranslate(el) {
  const tr = getComputedStyle(el).transform;
  if (!tr || tr === 'none') return { x: 0, y: 0 };
  const m = new DOMMatrixReadOnly(tr);
  return { x: m.e, y: m.f };
}

/* FLIP the given cards across `mutate()` (a DOM reorder): capture visual
   rects, mutate, then transform each moved card back to where it was and
   release it toward its new slot. Safe to re-trigger mid-flight. */
function flipRosterCards(cards, mutate) {
  if (rosterMotionOff()) { mutate(); return; }
  const first = new Map(cards.map((c) => [c, c.getBoundingClientRect()]));
  mutate();
  cards.forEach((c) => {
    const f = first.get(c);
    const l = c.getBoundingClientRect();
    const t = currentTranslate(c);
    const dx = (f.left - l.left) + t.x;
    const dy = (f.top - l.top) + t.y;
    if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;
    c.style.transition = 'none';
    c.style.transform = `translate(${dx}px, ${dy}px)`;
    void c.offsetWidth; // commit the start frame
    c.style.transition = `transform ${ROSTER_DRAG_ANIM_MS}ms ${ROSTER_DRAG_EASE}`;
    c.style.transform = '';
    clearTimeout(c._rosterFlipTimer);
    c._rosterFlipTimer = setTimeout(() => {
      c.style.transition = '';
      c.style.transform = '';
    }, ROSTER_DRAG_ANIM_MS + 60);
  });
}

let designerDrag = null;

function initDesignerDrag(card, person) {
  card.addEventListener('mousedown', (e) => {
    if (!rosterEditMode || !canEditRoster(person.studio)) return;
    if (e.button !== 0) return;
    if (e.target.closest('button, a, input, textarea')) return;
    e.preventDefault(); // no text/image selection ghost while dragging
    const rect = card.getBoundingClientRect();
    designerDrag = {
      person,
      card,
      roster: card.parentElement,
      startX: e.clientX,
      startY: e.clientY,
      grabX: e.clientX - rect.left, // where inside the card the hand holds it
      grabY: e.clientY - rect.top,
      active: false,
      lastAnchor: undefined,
      prevOrder: designersOf(person.studio).map((d) => d.id),
    };
    window.addEventListener('mousemove', onDesignerDragMove);
    window.addEventListener('mouseup', onDesignerDragEnd);
  });
}

// the held card's transform: from its CURRENT slot to under the pointer
function followPointer(s, e) {
  const t = currentTranslate(s.card);
  const r = s.card.getBoundingClientRect();
  const slotLeft = r.left - t.x; // rect includes our transform; peel it off
  const slotTop = r.top - t.y;
  const tx = (e.clientX - s.grabX) - slotLeft;
  const ty = (e.clientY - s.grabY) - slotTop;
  s.card.style.transition = 'none'; // rule one: the hand comes first
  s.card.style.transform = `translate(${tx}px, ${ty}px) scale(${ROSTER_DRAG_SCALE})`;
}

function onDesignerDragMove(e) {
  const s = designerDrag;
  if (!s) return;
  if (!s.active) {
    if (Math.hypot(e.clientX - s.startX, e.clientY - s.startY) < 6) return;
    s.active = true;
    s.card.classList.add('is-dragging');
    document.body.classList.add('is-roster-dragging');
  }

  // the first sibling whose midpoint the pointer has not passed is where the
  // card slots in; past them all, it goes to the end (before the + card)
  const siblings = [...s.roster.querySelectorAll('.designer-card')].filter((c) => c !== s.card);
  let target = null;
  for (const c of siblings) {
    const r = c.getBoundingClientRect();
    if (e.clientX < r.left + r.width / 2) { target = c; break; }
  }
  const anchor = target || s.roster.querySelector('.designer-add-card') || null;
  if (anchor !== s.lastAnchor) {
    s.lastAnchor = anchor;
    // reorder inside a FLIP so the row SLIDES apart instead of jumping;
    // the held card is excluded — its transform belongs to the pointer
    flipRosterCards(siblings, () => {
      if (anchor) s.roster.insertBefore(s.card, anchor);
      else s.roster.appendChild(s.card);
    });
  }
  followPointer(s, e);
}

function onDesignerDragEnd() {
  window.removeEventListener('mousemove', onDesignerDragMove);
  window.removeEventListener('mouseup', onDesignerDragEnd);
  const s = designerDrag;
  designerDrag = null;
  if (!s || !s.active) return; // never lifted — an ordinary click

  // settle: glide from wherever the hand let go into the slot, scale and
  // shadow releasing on the same clock (the shadow is the ::after fade,
  // opacity is in the inline transition below)
  s.card.classList.remove('is-dragging');
  document.body.classList.remove('is-roster-dragging');
  if (rosterMotionOff()) {
    s.card.style.transition = '';
    s.card.style.transform = '';
  } else {
    s.card.classList.add('is-settling'); // keeps the z-index through the glide
    s.card.style.transition = `transform ${ROSTER_DRAG_ANIM_MS}ms ${ROSTER_DRAG_EASE}, opacity ${ROSTER_DRAG_ANIM_MS}ms ${ROSTER_DRAG_EASE}`;
    s.card.style.transform = '';
    setTimeout(() => {
      s.card.classList.remove('is-settling');
      s.card.style.transition = '';
    }, ROSTER_DRAG_ANIM_MS + 60);
  }

  const newOrder = [...s.roster.querySelectorAll('.designer-card')].map((c) => c.dataset.designerId);
  if (newOrder.join('|') === s.prevOrder.join('|')) return;
  applyRosterOrder(s.person.studio, newOrder);
  attemptRemoteRosterOrder(s.person.studio, newOrder, s.prevOrder);
}

/* Puts a studio's row back into `ids` order ON SCREEN, sliding (same FLIP)
   rather than teleporting — the failure path uses this. Falls back to a full
   re-render when the roster isn't in the DOM any more. */
function animateRosterOrderOnScreen(studioKey, ids) {
  const roster = document.querySelector(`.designers-panel[data-studio="${studioKey}"] .designer-roster`);
  if (!roster) { renderDesigners(); return; }
  const cards = [...roster.querySelectorAll('.designer-card')];
  const byId = new Map(cards.map((c) => [c.dataset.designerId, c]));
  const anchor = roster.querySelector('.designer-add-card') || null;
  flipRosterCards(cards, () => {
    ids.forEach((id) => {
      const c = byId.get(id);
      if (c) roster.insertBefore(c, anchor);
    });
  });
}

// reorders one studio's people inside designerRoster; other studios untouched
// (display filters per studio, so their relative position is irrelevant)
function applyRosterOrder(studioKey, ids) {
  const others = designerRoster.filter((d) => d.studio !== studioKey);
  const mine = ids.map((id) => designerRoster.find((d) => d.id === id)).filter(Boolean);
  designerRoster = others.concat(mine);
}

/* Declined code = the order stays, locally (same silent fallback as every
   other roster edit). A REJECTED or failed save reverts to where things
   were — a shared order the DB refused should not keep pretending. */
function attemptRemoteRosterOrder(studioKey, ids, prevOrder) {
  const fallback = () => persistDesigners();
  if (!window.LoomData || !LoomData.isConfigured()) return fallback();
  // someone in the row only exists locally (unsaved 'designer-…' id): the DB
  // cannot hold this order yet
  if (ids.some((id) => !id || id.indexOf('designer-') === 0)) return fallback();
  writeCredential().then(({ authed, code }) => {
    if (!authed && !code) return fallback();
    LoomData.submitRosterOrder(studioKey, ids, code).then((res) => {
      if (res.ok) { clearLocalRosterStore(); return; }
      if (res.invalidCode && !authed) forgetWriteCode();
      console.warn('[Loom roster] order not saved — reverting:', res.message || res.reason);
      applyRosterOrder(studioKey, prevOrder);
      // back the way it came — sliding, not teleporting
      animateRosterOrderOnScreen(studioKey, prevOrder);
    });
  });
}

function attemptRemoteRosterRemove(person) {
  const fallback = () => persistDesigners();
  if (!window.LoomData || !LoomData.isConfigured()) return fallback();
  // an entry the DB never had (local-only 'designer-…' id): removing it
  // locally is the whole job
  if (!person.id || person.id.indexOf('designer-') === 0) return fallback();
  writeCredential().then(({ authed, code }) => {
    if (!authed && !code) return fallback();
    LoomData.removeRosterPerson(person.id, code).then((res) => {
      if (!res.ok) {
        if (res.invalidCode && !authed) forgetWriteCode();
        console.warn('[Loom roster] removal kept on this device only:', res.message || res.reason);
        return fallback();
      }
      clearLocalRosterStore();
    });
  });
}

/* Photos are downscaled hard on the way in (DESIGNER_PHOTO_MAX_DIM), so a full
   roster is a few hundred KB and this normally writes first time.

   When it does not, the roster gives ground the same way saveSharedCard does
   rather than losing the edit outright: photos are the expensive part and the
   names, roles and links are the part that matters, so the pictures go and the
   people stay. Losing somebody's job title because somebody else uploaded a
   large photograph is not a trade worth making silently. */
function persistDesigners() {
  if (safeSetItem(DESIGNERS_STORAGE_KEY, JSON.stringify(designerRoster)).ok) {
    logStorageUsage('designer roster saved');
    return true;
  }

  const stripped = designerRoster.map((d) => Object.assign({}, d, { photo: null, photoPos: null }));
  if (safeSetItem(DESIGNERS_STORAGE_KEY, JSON.stringify(stripped)).ok) {
    // in-memory too, or the screen would show photos that are already gone
    designerRoster.forEach((d) => { d.photo = null; d.photoPos = null; });
    logStorageUsage('designer roster saved without photos');
    showToast(t().designers.savedWithoutPhotos);
    renderDesigners();
    return true;
  }

  // safeSetItem has already put the previous roster back, so storage still
  // matches what was there before this edit rather than holding half of it.
  console.error('[Loom feed] could not persist the designer roster at all');
  logStorageUsage('roster save failed');
  showToast(t().designers.saveFailed);
  return false;
}

// A studio's roster is that studio's own to edit. The check is here rather
// than sprinkled through the UI so there's one place to point a real
// permission at later.
// TODO(auth): server-side authorisation on the signed-in account. A
// client-side comparison decides what to *show*, never what's allowed.
function canEditRoster(studioKey) {
  if (isGuestSession()) return false; // no Edit control renders for a guest
  return studioKey === MY_STUDIO_KEY;
}

const ICONS = {
  update: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.7 8.7 0 0 1-3.8-.9L3 20.6l1.6-4.9A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/></svg>`,
  project: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">

    <path d="M15 3v4h4"/><path d="M9 12h6M9 15.5h6M9 8.5h3"/></svg>`,
  experiment: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 2v6.2L4.6 18a2 2 0 0 0 1.8 2.9h11.2a2 2 0 0 0 1.8-2.9L14 8.2V2"/>
    <path d="M8.5 2h7"/><path d="M7.5 14.5h9"/></svg>`,
  question: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="12" r="3.4"/><circle cx="17" cy="12" r="3.4"/><path d="M10 12h4"/></svg>`,
};

// Generic filter/funnel glyph — shown on the type-filter button whenever no
// specific type is picked (its own icon takes over once one is selected).
const FILTER_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 5h16M7 12h10M10.5 19h3"/></svg>`;

/* "This came out of something else", drawn rather than typed. It was U+21B3
   (↳), which Inter has no glyph for — every browser fell back to some other
   font for that one character and rendered a thin, off-baseline mark that read
   as a broken character rather than an arrow. The → used elsewhere is in Inter
   and is fine; this one never was. */
const LINEAGE_ARROW_ICON = '<svg class="lineage-hint-arrow" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 1.5v5.5h6"/><path d="M6.8 4.7L9.2 7l-2.4 2.3"/></svg>';

// `image`: a path under assets/, or null for the studio-tinted gradient. The
// path is probed before it is used (see applyCardMedia), so a file that is not
// there yet keeps the gradient rather than showing a broken box — but it also
// costs a 404 in the console on every render, so a path is only worth carrying
// once the file exists. Convention: assets/card-<slug>.jpg, slug matching the
// card's subject.
//
// `id`: stable string every other card's `relatedTo`/`derivedFrom` can point
// at. `relatedTo`: ids of sibling ideas (resolved bidirectionally at render
// time — declaring it on one side of a pair is enough, see connectedIds()).
// `derivedFrom`: the one id this was explicitly built on top of, if any.
// In a real service neither field would be hand-authored like this — they'd
// be *created* the moment a studio hits "We applied this too" on another
// card, or explicitly links a new post to the one that inspired it. Here
// they're seeded so the network has some shape to show off from day one.
/* ======================================================================
   Per-type body fields
   ----------------------------------------------------------------------
   Which questions each kind of card is asked, and in what order. Keyed by
   name rather than position, so adding a field to one type can't shift
   another type's content into the wrong heading.

   The seed cards predate this and carry the old three slots. Rather than
   relabel prose that was not written for the new headings — "92% of new
   players never opened the payment screen" is not an answer to "what we made"
   — LEGACY_FIELD_MAP points each type's fields at whichever old slot actually
   says that thing, and leaves the rest empty. An empty field renders no
   section at all, so a seed project shows three headings and a newly written
   one shows four. See bodyValue().
   ====================================================================== */
const FIELD_SETS = {
  // One line, and it doubles as the card's title — an Update has no headline
  // separate from its content, because a sentence that needs a headline is not
  // an Update. See isUpdate() for everywhere that changes.
  update: ['note', 'next', 'openQuestion'],
  project: ['made', 'constraints', 'solved', 'borrow', 'next', 'openQuestion'],
  experiment: ['goal', 'method', 'happened', 'learned', 'next', 'openQuestion'],
  question: ['blocked', 'triedSoFar', 'next', 'openQuestion'],
};

/* The lightest type there is. Everything else in this app asks for a title and
   three or four paragraphs, which is a form you put off until you have
   "properly written it up" — and most of what a studio learns never survives
   that wait. This one asks for a sentence and lets you leave.

   It is deliberately the last type. A fifth would make choosing one a decision
   in itself, which is the same tax in a different place. */
function isUpdate(data) {
  return !!data && data.type === 'update';
}

const LEGACY_FIELD_MAP = {
  update: {},
  project: { constraints: 'problem', solved: 'tried', borrow: 'result' },
  experiment: { goal: 'problem', method: 'tried', happened: 'result' },
  question: { blocked: 'problem', triedSoFar: 'tried' },
};

/* ======================================================================
   Keywords — the loose layer
   ----------------------------------------------------------------------
   A keyword is a word two people happened to use for the same concern. That is
   the whole mechanism, and its looseness is the point: relatedTo/derivedFrom
   require somebody to declare a link, and most work that belongs together
   never gets that far. Sharing a word costs nothing and still puts two studios
   on the same page.

   There is deliberately no master list to maintain. Every keyword that exists
   is one somebody typed onto a card (see allKeywords), so the vocabulary is
   whatever the studios actually use rather than whatever a taxonomy predicted
   they would need.

   Case: compared folded, displayed as first written. "Slack pipeline" and
   "slack pipeline" are one keyword, and the spelling the reader sees is the
   one the first person to use it chose — not the last, which would mean a
   keyword quietly changing shape under everyone who had already used it.
   ====================================================================== */
const MAX_KEYWORDS_PER_CARD = 3;

// The comparison key. Also collapses runs of whitespace, so "Slack  pipeline"
// typed with a stray space is not a second keyword.
function keywordKey(word) {
  return String(word == null ? '' : word).trim().replace(/\s+/g, ' ').toLowerCase();
}

// What a keyword looks like on screen: trimmed, inner whitespace collapsed,
// and otherwise exactly as it was typed.
function keywordLabel(word) {
  return String(word == null ? '' : word).trim().replace(/\s+/g, ' ');
}

function keywordsOf(card) {
  if (!card || !Array.isArray(card.keywords)) return [];
  const seen = {};
  const out = [];
  card.keywords.forEach((raw) => {
    const key = keywordKey(raw);
    if (!key || seen[key]) return;
    seen[key] = true;
    out.push(keywordLabel(raw));
  });
  return out.slice(0, MAX_KEYWORDS_PER_CARD);
}

/* Every keyword in use, with the spelling of whichever card used it first.
   Oldest card first, so "first" means first in time rather than first in
   whatever order the surfaces happen to render.

   Built on demand rather than cached: a card can be shared, edited or deleted
   at any moment, and a stale vocabulary is worse than a recomputed one — this
   is twenty-odd cards, not twenty thousand. */
function allKeywords() {
  const byKey = {};
  // daysAgoOf is smaller for newer cards, so descending is oldest first.
  const order = ALL_CARDS.slice().sort((a, b) => daysAgoOf(b) - daysAgoOf(a));
  order.forEach((card) => {
    keywordsOf(card).forEach((label) => {
      const key = keywordKey(label);
      if (!byKey[key]) byKey[key] = { key: key, label: label, count: 0 };
      byKey[key].count += 1;
    });
  });
  return Object.keys(byKey)
    .map((k) => byKey[k])
    .sort((a, b) => b.count - a.count || a.label.localeCompare(b.label));
}

// The agreed spelling for a keyword typed any which way, so a card saved with
// "slack pipeline" still displays as "Slack pipeline".
function canonicalKeyword(word) {
  const key = keywordKey(word);
  if (!key) return '';
  const found = allKeywords().find((k) => k.key === key);
  return found ? found.label : keywordLabel(word);
}

function cardHasKeyword(card, word) {
  const key = keywordKey(word);
  if (!key) return false;
  return keywordsOf(card).some((k) => keywordKey(k) === key);
}

/* Other pieces of writing that share a keyword with this one, newest first.
   Not "related": nobody said these belong together, they just used the same
   word — which is a weaker claim, and an honest one. */
function sameThreadCards(card, limit) {
  if (!card) return [];
  const keys = keywordsOf(card).map(keywordKey);
  if (!keys.length) return [];
  return ALL_CARDS
    .filter((c) => c.id !== card.id && keywordsOf(c).some((k) => keys.indexOf(keywordKey(k)) > -1))
    .sort((a, b) => daysAgoOf(a) - daysAgoOf(b))
    .slice(0, limit || 4);
}

function cardsWithKeyword(word) {
  const key = keywordKey(word);
  if (!key) return [];
  return ALL_CARDS.filter((c) => keywordsOf(c).some((k) => keywordKey(k) === key));
}

/* Read-only chips for a card surface. Plain spans — a poster card is already
   one big click target and a button inside it would fight that. The detail
   builds interactive ones of its own (see renderDetailKeywords). */
function keywordTagsHTML(card) {
  const words = keywordsOf(card);
  if (!words.length) return '';
  return '<div class="keyword-tags">'
    + words.map((w) => `<span class="keyword-tag">${escapeHtml(w)}</span>`).join('')
    + '</div>';
}

function fieldsFor(type) {
  return FIELD_SETS[type] || FIELD_SETS.project;
}

// The text of one field on one card, whichever era the card comes from.
function bodyValue(text, type, key) {
  if (!text) return '';
  if (typeof text[key] === 'string' && text[key].length) return text[key];
  const legacy = (LEGACY_FIELD_MAP[type] || {})[key];
  return (legacy && text[legacy]) || '';
}

function fieldStrings(type, key) {
  const set = t().fields[type] || t().fields.project;
  return set[key] || { label: key, placeholder: '' };
}

/* The hardcoded seed cards that used to sit here are GONE.

   Seventeen invented cards by invented colleagues, in four languages, kept
   as insurance for a demo with no network. They outlived their purpose the
   moment the canvas became the source of record: the DB is where the cards
   live, the login knows who is reading, and the last thing this file should
   carry is a shadow cast of people who do not exist. An unreachable
   database now says so (see initRemoteCards) instead of quietly showing
   fiction that looks like the real thing.
   ====================================================================== */

/* ======================================================================
   2b. Cards shared through share mode (see section 9) — persisted to
   localStorage so they survive a reload, read once here at load and
   stitched onto the front of the gallery. Their title/problem/tried/result
   stay exactly as the author typed them (there's no translation for
   user-generated text in this prototype), so they carry their own `text`
   object instead of looking one up from TRANSLATIONS.
   ====================================================================== */
const SHARED_CARDS_STORAGE_KEY = 'loom_shared_cards_v1';

function loadSharedCards() {
  try {
    const raw = localStorage.getItem(SHARED_CARDS_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (err) {
    console.error('[Loom feed] could not read shared cards from localStorage:', err);
    return [];
  }
}

// `let`, not `const`: sharing a new card while already on this page (see
// share mode below) prepends to this in memory too, so the gallery can show
// it immediately without a reload — localStorage is what makes it survive
// a reload, not what the live UI reads from moment to moment.
let sharedCards = loadSharedCards();

// The list every render/filter function actually works from: newest shared
// knowledge first, then the seed CARDS. `staticIndex` lets static entries
// still look their copy up in TRANSLATIONS[lang] as the language changes;
// shared entries carry their own fixed `text` instead.
/* ======================================================================
   Edits to seed cards
   ----------------------------------------------------------------------
   CARDS is a constant and its copy lives in TRANSLATIONS, four times over.
   Rather than move all of that into storage, an edit to a seed card is stored
   as an overlay keyed by the card's id and merged in at build time. The seed
   stays exactly what a browser with empty storage sees, and "reset it" is
   still one line in the console.

   Only your own studio's cards. Not a security boundary — anything in this
   file is editable by anyone who opens devtools — but the same rule the
   Designers roster uses, so the app is at least consistent about whose things
   are whose.

   TODO(backend): a real service checks the signed-in account against the
   card's studio server-side, and there is no such thing as a "seed" card —
   they are all just rows.
   ====================================================================== */
const SEED_EDITS_STORAGE_KEY = 'loom_seed_edits_v1';

function loadSeedEdits() {
  try {
    const parsed = JSON.parse(localStorage.getItem(SEED_EDITS_STORAGE_KEY));
    if (parsed && typeof parsed === 'object') return parsed;
  } catch (err) {
    console.error('[Loom feed] could not read seed edits:', err);
  }
  return {};
}

/* Declared here, immediately above buildAllCards, and not further down with the
   rest of the edit code: ALL_CARDS is built during script evaluation and
   buildAllCards reaches straight into this map. A `let` declared below that
   point is still in its temporal dead zone when it is read, which is a
   ReferenceError rather than an undefined. */
let seedEdits = loadSeedEdits();
function seedEditsMap() { return seedEdits; }

/* Whether the reader is allowed to edit a card at all.

   Shared cards: yes, they wrote them this session.
   Seed cards: only their own studio's — "남의 것엔 안 보임" reads as other
   studios', and a studio's own back catalogue is theirs to correct. */
/* ---- session mode -----------------------------------------------------------
   'guest'  — chose "enter as a guest" in the lobby: every write ENTRY POINT
              is absent from the DOM (not disabled: absent), on top of the
              server refusing writes anyway.
   'member' — signed in (or pre-auth legacy flow); write UI renders and the
              gates (shared code today, auth in stage 3) decide server-side.
   missing  — a bookmark from before modes existed: treated as member so the
              existing demo behaviour is unchanged. */
function isGuestSession() {
  try { return localStorage.getItem('loom_session_mode') === 'guest'; } catch (err) { return false; }
}

/* Signed-in truth wins over the lobby pick: a deep link / stale bookmark can
   carry the wrong studio in localStorage, and every studio-owned surface
   reads MY_STUDIO_KEY synchronously at boot — so the rare mismatch is fixed
   by correcting storage and rebooting the page, not by chasing every
   consumer at runtime. */
/* Who is signed in, as ONE promise the whole page shares.
   A boolean set when a fetch happened to finish was a race: the first save
   after a page load asked before the answer existed, decided "not signed in"
   and prompted for the code — and only the second save was quiet. Every
   write path now waits on this, so the question is asked once and answered
   before any gate is chosen. Resolves to the profile, or null for a guest,
   a signed-out visitor, or no auth layer at all. */
let authProfilePromise = null;
let authProfile = null;    // synchronous mirror, for gating what renders
let authPersonName = null; // filled once we know; drives myDisplayName()

function authReady() {
  if (authProfilePromise) return authProfilePromise;
  if (isGuestSession() || !window.LoomData || !LoomData.isConfigured() || !LoomData.auth) {
    authProfilePromise = Promise.resolve(null);
    return authProfilePromise;
  }
  authProfilePromise = LoomData.auth.loadProfile().then((profile) => {
    if (profile && profile.studio) authProfile = profile;
    if (profile && profile.personName) authPersonName = profile.personName;
    if (authProfile) {
      // anything already on screen was drawn as if nobody were signed in
      if (typeof askRefreshState === 'function') { askClearGuest(); askRefreshState(); }
      if (typeof renderDesigners === 'function') renderDesigners();
      if (isCardExpanded && currentOpenIndex !== null && ALL_CARDS[currentOpenIndex]) {
        populateExpanded(ALL_CARDS[currentOpenIndex], currentOpenIndex);
      }
    }
    return authProfile;
  }).catch(() => null);
  return authProfilePromise;
}

function initAuthSession() {
  authReady().then((profile) => {
    if (!profile) return; // signed out / guest — legacy behaviour
    if (profile.studio === MY_STUDIO_KEY || !isStudioEnabled(profile.studio)) return;
    try {
      localStorage.setItem('loom_current_studio', profile.studio);
      localStorage.setItem('loom_session_mode', 'member');
      location.reload();
    } catch (err) { /* storage blocked — stay as booted */ }
  });
}

/* The credential for one write: a signed-in member needs none (data.js sends
   their JWT), everyone else is asked for the shared code exactly as before.
   Resolves to { authed, code } — code null when authed, '' when declined. */
function writeCredential() {
  return authReady().then((profile) => {
    if (profile) return { authed: true, code: null };
    return { authed: false, code: getWriteCode() };
  });
}

/* Who may change what, and why the two answers differ.

   A BODY belongs to wherever it was written: a canvas card's words live in
   Slack, where the other studio reads and edits them, so Loom does not offer
   to overwrite them (the server refuses too — see db/0015). A card written in
   Loom is Loom's to correct, by its own studio.

   KEYWORDS belong to everybody. Nobody writes them in the Canvas — there is
   no such field, on purpose — so a keyword is a machine's proposal that
   people refine, and a wrong one spoils the other studio's Threads as much
   as its own. Any signed-in member may tune any card's keywords; the DB
   records who did (keywords_edited_by).

   Not signed in but holding the shared code (the parallel period): the old
   rule applies, own studio only, because there is no identity to record. */
function isCanvasCard(data) {
  return !!data && (data.origin === 'canvas' || String(data.id || '').indexOf('cv-') === 0);
}

/* The name slot in a detail header: "Studio · Name · time". `author` is the
   knowledge's owner (shared_by); a canvas card whose owner is unrecorded has
   none, and then the slot AND its trailing separator go, so the line reads
   "Whow · 2 days ago" rather than "Whow · · 2 days ago". */
function setAuthorSlot(el, name) {
  const text = (name || '').trim();
  el.textContent = text;
  el.style.display = text ? '' : 'none';
  const sep = el.nextElementSibling;
  if (sep && sep.classList.contains('sep')) sep.style.display = text ? '' : 'none';
}

function canEditCardBody(data) {
  if (!data) return false;
  if (isGuestSession()) return false; // guests read; the UI never offers more
  if (isCanvasCard(data)) return false;
  if (data.isShared) return true;
  return data.studio === MY_STUDIO_KEY;
}

function canEditKeywords(data) {
  if (!data) return false;
  if (isGuestSession()) return false;
  if (authProfile) return true;                 // signed in: any card, either studio
  return data.studio === MY_STUDIO_KEY;         // code path: own studio, as before
}

// kept as the old name for the delete/edit row, which is about the body
function canEditCard(data) {
  return canEditCardBody(data);
}

// A seed card's edit is a patch, not a replacement: only the keys the author
// actually changed are stored, so a seed card that later gains a field in the
// source picks it up instead of being frozen at whatever was saved.
function applySeedEdit(card) {
  const patch = seedEditsMap()[card.id];
  if (!patch) return card;
  return Object.assign({}, card, patch, {
    text: Object.assign({}, card.text, patch.text || {}),
  });
}

/* Drops a local patch once the DB has the same correction — otherwise the
   overlay keeps shadowing what everybody else can now see. */
function clearSeedEdit(id) {
  const map = seedEditsMap();
  if (!(id in map)) return;
  delete map[id];
  safeSetItem(SEED_EDITS_STORAGE_KEY, JSON.stringify(map));
}

function saveSeedEdit(id, patch) {
  const map = seedEditsMap();
  const previous = map[id];
  map[id] = patch;
  if (safeSetItem(SEED_EDITS_STORAGE_KEY, JSON.stringify(map)).ok) {
    logStorageUsage('seed edit saved');
    return true;
  }
  // safeSetItem restored storage; put memory back in step with it.
  if (previous === undefined) delete map[id];
  else map[id] = previous;
  return false;
}

/* Cards from Supabase (see data.js). null until LoomData delivers, and null
   forever only when the DB is UNREACHABLE — the hardcoded CARDS below are
   offline-demo insurance, knowingly stale now that the Slack canvas is the
   source of record (the demo seeds were deleted from the DB at the canvas
   cutover). An empty list from the DB is truth, not a reason to fall back.
   Remote cards arrive already carrying their resolved-language `text`, so
   they take the same path through buildAllCards as an edited seed card. */
let remoteCards = null;

/* Whether the last attempt to reach the DB failed. With no seed left to fall
   back on, this is the difference between the two empty screens: "we could
   not ask" (retry) and "there is nothing here yet". */
let remoteLoadFailed = false;

function initRemoteCards() {
  if (!window.LoomData || !LoomData.isConfigured()) return;
  LoomData.loadCards(currentLang).then((cards) => {
    // null = unknown (offline/failed). An empty array is the DB's own answer.
    remoteLoadFailed = !cards;
    if (!cards) { renderFeedEmpty(); return; }
    remoteCards = cards;
    rebuildAllSurfaces();
    renderNowStrip();
    applyPendingUrlCard();
    // the other three languages, quietly, once this one is on screen
    if (LoomData.prefetchLanguages) LoomData.prefetchLanguages(currentLang);
  });
}

/* The honest empty state, in place of the fiction that used to fill it. */
function renderFeedEmpty() {
  const box = document.getElementById('feedEmpty');
  if (!box) return;
  const nothing = !ALL_CARDS.length;
  box.hidden = !nothing;
  if (!nothing) return;
  const strings = t().feedEmpty;
  document.getElementById('feedEmptyLine').textContent =
    remoteLoadFailed ? strings.unreachable : strings.empty;
  const retry = document.getElementById('feedEmptyRetry');
  retry.hidden = !remoteLoadFailed;
  retry.textContent = strings.retry;
}

function initFeedEmptyRetry() {
  const retry = document.getElementById('feedEmptyRetry');
  if (!retry) return;
  retry.addEventListener('click', () => {
    retry.disabled = true;
    retry.textContent = t().feedEmpty.retrying;
    Promise.all([
      window.LoomData ? LoomData.loadCards(currentLang) : Promise.resolve(null),
      window.LoomData ? LoomData.loadRoster() : Promise.resolve(null),
    ]).then(([cards, people]) => {
      retry.disabled = false;
      remoteLoadFailed = !cards;
      if (people && people.length) designerRoster = people;
      if (cards) {
        remoteCards = cards;
        rebuildAllSurfaces();
        renderNowStrip();
        renderDesigners();
      }
      renderFeedEmpty();
    });
  });
}

/* ---- the write path ------------------------------------------------------
   Saving to the shared Loom is gated by a shared write code (checked
   server-side — see db/0004_write_rpc.sql; the value is never in this repo).
   Asked once per session via a plain prompt — deliberately the lightest
   possible input until real sign-in exists — and remembered in
   sessionStorage. Declining (cancel or empty) is also remembered: the card
   stays in localStorage exactly as before, with no visible difference. */
const WRITE_CODE_STORAGE_KEY = 'loom_write_code_v1';
let writeCodeSession; // undefined = not asked yet, '' = declined, else the code

function getWriteCode() {
  if (writeCodeSession === undefined) {
    try {
      const stored = sessionStorage.getItem(WRITE_CODE_STORAGE_KEY);
      if (stored !== null) writeCodeSession = stored;
    } catch (err) { /* storage blocked — ask again */ }
  }
  if (writeCodeSession === undefined) {
    const typed = window.prompt(t().writeCodePrompt);
    writeCodeSession = typed === null ? '' : typed.trim();
    try { sessionStorage.setItem(WRITE_CODE_STORAGE_KEY, writeCodeSession); } catch (err) { /* per-tab memory only */ }
  }
  return writeCodeSession;
}

// A mistyped code must not lock the whole session into silent fallback —
// forget it so the next share asks again.
function forgetWriteCode() {
  writeCodeSession = undefined;
  try { sessionStorage.removeItem(WRITE_CODE_STORAGE_KEY); } catch (err) { /* fine */ }
}

/* Fired alongside the local save on submit — the localStorage copy is the
   safety net, so this never blocks and never surfaces an error UI. Cards
   with an image or attachments stay local-only for now (no base64 into the
   DB; Supabase Storage is a later decision). */
function attemptRemoteSubmit(entry) {
  if (!window.LoomData || !LoomData.isConfigured()) return;
  if (entry.image || (entry.attachments && entry.attachments.length)) return;
  writeCredential().then(({ authed, code }) => {
    if (!authed && !code) return; // declined — same behaviour as before this existed
    LoomData.submitCard(entry, code).then((res) => {
      if (!res.ok) {
        if (res.invalidCode && !authed) forgetWriteCode();
        console.warn('[Loom write] card kept on this device only:', res.message || res.reason);
        return;
      }
      adoptRemoteCard(entry.id);
    });
  });
}

/* The submission is in the DB: the localStorage copy stops being the source
   of truth. Works whichever side of the weave flush the response lands on —
   the id is filtered from both the stored list and the pending queue, and
   the remote list (which data.js already updated) takes over. */
function adoptRemoteCard(id) {
  LoomData.loadCards(currentLang).then((cards) => {
    if (!cards) return; // remote list unavailable — keep the local copy
    sharedCards = sharedCards.filter((c) => c.id !== id);
    writeSharedCards(sharedCards);
    pendingSharedEntries = pendingSharedEntries.filter((c) => c.id !== id);
    remoteCards = cards;
    rebuildAllSurfaces();
    renderNowStrip();
  });
}

function buildAllCards() {
  /* Two sources, and neither is invented: what this browser has typed and
     not yet handed over, then what the DB holds. applySeedEdit still folds
     in local corrections to a card's copy — that path is a local overlay
     because editing an existing card has no server route yet. */
  return [
    ...sharedCards.map((c) => ({ ...c, isShared: true })),
    ...(remoteCards || []).map((c) => applySeedEdit({ ...c, isShared: false })),
  ].filter((c) => isStudioEnabled(c.studio));
}
let ALL_CARDS = buildAllCards();

// A shared card's `text` is always exactly what its author typed, in
// whatever language they typed it in — there's no machine translation here.
// A real service would call a translation API right here (keyed off
// `entry.sourceLang` vs. the viewer's `currentLang`) and cache the result
// per target language; until then, renderLangPendingBadge() is what tells
// the reader they're looking at the original text, not a translation.
/* Both kinds of card carry their own `text` now (buildAllCards folds the
   translated seed copy in), so this is a straight read — but a seed card that
   has NOT been edited must still follow the language switcher, and its stored
   text was captured in whatever language was active when ALL_CARDS was built.
   Falling back to ct() for those keeps the switcher working. */
/* Every card carries its own text now: a remote card's was resolved to the
   active language when the list was fetched (the language switcher re-fetches
   and rebuilds — see setLanguage), and anything typed in this browser is in
   the language it was typed in. One straight read, no index lookup. */
function cardText(entry) {
  return (entry && entry.text) || {};
}

/* "Original (<language>) · Auto-translation pending", shown whenever a card's
   original language differs from the one being read in.

   TODO(translation): there is no machine translation here and this label is
   the honest version of that. A real implementation sends the card's fields to
   a translation API on save (not on read — translating on every language
   switch would mean paying for the same sentence repeatedly and getting
   slightly different wording each time), stores the result per language
   alongside `sourceLang`, and shows this badge only while that request is
   still outstanding. Until then the reader gets the author's own words, which
   is better than a silent gap.

   Seed cards are pre-translated in TRANSLATIONS, so this only applies to what
   somebody actually wrote — including an edited seed card, whose new text
   exists only in the language it was typed in. */
function langPendingText(data) {
  const authored = data.isShared || !!seedEditsMap()[data.id];
  if (!authored || !data.sourceLang || data.sourceLang === currentLang) return '';
  const lang = LANGUAGES.find((l) => l.code === data.sourceLang);
  return t().originalPending(lang ? lang.label : data.sourceLang);
}
function langPendingBadgeHTML(data) {
  const txt = langPendingText(data);
  return txt ? `<span class="lang-pending-badge">${txt}</span>` : '';
}
function renderLangPendingBadge(el, data) {
  if (!el) return;
  const txt = langPendingText(data);
  el.textContent = txt;
  el.style.display = txt ? '' : 'none';
}

/* ======================================================================
   2c. Cross-card connections — relatedTo/derivedFrom drive both the hover
   highlight in the gallery and the mini lineage graph in the expanded
   modal (see populateExpanded). Resolved against ALL_CARDS (not CARDS) so
   shared cards can participate too, and resolved bidirectionally so a
   relatedTo/derivedFrom pair only ever needs to be declared on one side.
   ====================================================================== */
function findCardIndexById(id) {
  return ALL_CARDS.findIndex((c) => c.id === id);
}

// Every card this one is connected to, regardless of relation type — this
// is what the gallery hover effect lights up. Returns ALL_CARDS indices.
function connectedIndices(data) {
  const ids = new Set();
  (data.relatedTo || []).forEach((id) => ids.add(id));
  if (data.derivedFrom) ids.add(data.derivedFrom);
  ALL_CARDS.forEach((c) => {
    if (c.id === data.id) return;
    if (c.derivedFrom === data.id) ids.add(c.id);
    if ((c.relatedTo || []).includes(data.id)) ids.add(c.id);
  });
  ids.delete(data.id);
  const indices = [];
  ids.forEach((id) => {
    const idx = findCardIndexById(id);
    if (idx !== -1) indices.push(idx);
  });
  return indices;
}

/* The full spell-it-out list under the strip: every card this one links to and
   why (derivedFrom / derivedInto / related), including the branches the linear
   strip has no room for.

   Cards only. `appliedBy` used to add studio-shaped nodes here, which made a
   company look like a step in the lineage; it is a fact about who picked
   something up, and it belongs to the "how it has travelled" line and the
   exchange traces, not to a chain of works. */
function buildLineageNodes(data) {
  const nodes = [];
  const seen = new Set([data.id]);

  const addCardNode = (id, relation) => {
    if (seen.has(id)) return;
    const idx = findCardIndexById(id);
    if (idx === -1) return;
    seen.add(id);
    const c = ALL_CARDS[idx];
    nodes.push({
      kind: 'card',
      id,
      index: idx,
      title: cardText(c).title,
      studioName: STUDIOS[c.studio] ? STUDIOS[c.studio].name : '',
      color: STUDIOS[c.studio] ? STUDIOS[c.studio].color : 'var(--ink)',
      relation,
    });
  };

  if (data.derivedFrom) addCardNode(data.derivedFrom, 'derivedFrom');
  ALL_CARDS.forEach((c) => { if (c.derivedFrom === data.id) addCardNode(c.id, 'derivedInto'); });
  (data.relatedTo || []).forEach((id) => addCardNode(id, 'related'));
  ALL_CARDS.forEach((c) => { if ((c.relatedTo || []).includes(data.id)) addCardNode(c.id, 'related'); });

  return nodes;
}

/* ======================================================================
   2d. Discover ranking — "newest first" across studios, so freshly shared
   knowledge (always justNow) floats to the very front and the rest sorts by
   how long ago it was posted. Same underlying ALL_CARDS as Browse below;
   Discover is a curated top slice of it, not a separate pool.
   ====================================================================== */
const DISCOVER_COUNT = 6;
const TIME_UNIT_DAYS = { day: 1, week: 7, month: 30 };

function daysAgoOf(data) {
  return data.justNow ? -1 : data.timeValue * (TIME_UNIT_DAYS[data.timeUnit] || 1);
}

// The banner is finished knowledge only; what is in flight is the strip below
// it (see renderNowStrip).
function computeDiscoverIndices() {
  return ALL_CARDS
    .map((c, i) => i)
    .filter((i) => !isUpdate(ALL_CARDS[i]))
    .sort((a, b) => daysAgoOf(ALL_CARDS[a]) - daysAgoOf(ALL_CARDS[b]))
    .slice(0, DISCOVER_COUNT);
}

// The one light textual trace of lineage a Discover card carries — just
// "derived from {studio}" when there's a clear ancestor, nothing forced
// otherwise. The full breakdown (related ideas, who applied it, etc.) is
// what the modal's lineage list is for.
function lineageHintFor(data) {
  if (!data.derivedFrom) return '';
  const idx = findCardIndexById(data.derivedFrom);
  if (idx === -1) return '';
  // The work it came out of, not the company that wrote that work — same rule
  // the lineage strip follows. "Came from DoubleU" is an attribution; "came
  // from this particular piece" is a lineage.
  const origin = ALL_CARDS[idx];
  const title = truncateForSummary(cardText(origin).title || '', 44);
  if (!title) return '';
  return `${t().lineage.derivedFrom} “${title}”`;
}

function isOpenQuestion(data) {
  return data.type === 'question';
}

/* ---------- ONE judgement of whether a question has been answered ----------
   Every place that says anything about a question's state reads it from
   here: the Home bands, the Open questions floor (its badges, its count, its
   sort), the card detail, the brief. They used to disagree — Home judged by
   the record (a follow-up card from the other studio IS an answer) while the
   floor judged by the status field, and the same Oktoberfest question was
