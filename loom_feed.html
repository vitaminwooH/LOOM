   answered on one floor and "Nobody has answered yet" on the next.

     'resolved'  a person closed it (status field — the one human verdict)
     'answered'  the other studio has replied: a card derived from it, a word
                 in its conversation, or a newer card in the same thread
                 (cardHasAnswer, defined with the Home bands)
     'open'      nothing has come back yet

   status = 'discussion' from the DB is treated as not-yet-answered: it says
   people are talking, not that the asker got what they asked for. */
function questionState(card) {
  if (!card) return 'open';
  if (card.status === 'resolved') return 'resolved';
  return cardHasAnswer(card) ? 'answered' : 'open';
}

// Open / Answered / Resolved — only Questions carry this at all.
function statusBadgeHTML(data) {
  if (!isOpenQuestion(data)) return '';
  const state = questionState(data);
  return `<span class="status-badge status-${state}">${t().status[state]}</span>`;
}

// Replies typed into this session's Conversation pane (see initQuestionDetail) —
// kept separate from the seed data entirely, keyed by card id, so appending
// one never has to fight with how static cards zip structure against
// per-language text (see getConversationMessages just below).
const sessionExtraMessages = {};

// The thread behind a Question — structural data (who/when) lives on the
// card itself (language-independent, like everywhere else in this file);
// only the message text is looked up per-language. Shared (user-authored)
// cards carry their own embedded text instead, same as their other fields.
// Static Questions with no curated thread (see CARDS) get a synthesized
// single opening post from the card's own author/problem fields, so every
// Question always has *something* to show in its Conversation pane.
function getConversationMessages(data) {
  let base;
  if (data.isShared) {
    base = data.conversation || [];
  } else {
    const text = cardText(data);
    base = (data.conversation && text.conversation)
      ? data.conversation.map((msg, i) => ({ ...msg, text: text.conversation[i] }))
      : [{ author: data.author, studio: data.studio, timeValue: data.timeValue, timeUnit: data.timeUnit, justNow: data.justNow, text: text.problem }];
  }
  return base.concat(sessionExtraMessages[data.id] || []);
}

// null means "not enough discussion yet" — the brief panel shows a plain
// placeholder instead of forcing a summary out of a single opening post.
function getConversationBrief(data) {
  if (data.isShared) return null;
  return cardText(data).brief || null;
}

/* ======================================================================
   3. Utilities
   ====================================================================== */
function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// Used by the share-mode weave canvas, which paints with raw "r, g, b"
// strings/arrays instead of CSS colors.
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return `${parseInt(h.substring(0, 2), 16)}, ${parseInt(h.substring(2, 4), 16)}, ${parseInt(h.substring(4, 6), 16)}`;
}
function hexToRgbArray(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4), 16), parseInt(h.substring(4, 6), 16)];
}

// Placeholder art for cards with no image — layered studio-colored light
// blooms (a bright one near the top, a soft warm one low-right, plus a faint
// wash) rather than one flat gradient. Paired in CSS with a fixed grain
// texture (--card-noise) via background-blend-mode, so an empty card still
// reads as a designed visual instead of a placeholder.
// Returns exactly 4 comma-separated gradient layers — no trailing solid
// color. Used two ways: as `--card-bloom` inside a `background-image` list
// (which only accepts <image> values, so a plain color there would make the
// whole declaration invalid), and inline via the full `background` shorthand
// for the card's flip-back face, where callers append their own ", #fff".
/* The studio's colour, deepened toward ink before it is used. A logo blue at
   50% over white is a pastel; the same blue pulled 16% toward #1c1c1e is the
   colour the lobby's nebula is made of, and white type sits on it without a
   fight. --card-tint-ink is how far that pull goes. */
function studioInk(color, amount) {
  const mix = amount === undefined ? cssNumber('--card-tint-ink', 0.16) : amount;
  const rgb = hexToRgbArray(color);
  const ink = [28, 28, 30];
  return rgb.map((c, i) => Math.round(c + (ink[i] - c) * mix));
}

function rgbaFrom(rgb, alpha) {
  return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha})`;
}

// one place to read a tuning number out of :root, with a fallback
function cssNumber(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const n = parseFloat(raw);
  return isFinite(n) ? n : fallback;
}

/* A card with no cover: the studio's colour IS the picture. Two deep blooms
   from opposite corners over a wash of the same colour, so a row of cards
   reads blue, orange, blue as you scroll — which is the point of the floor.
   The white bloom that used to sit in the middle is gone; it was what made
   these look washed out. */
function mediaGradient(color) {
  const deep = studioInk(color);
  const strong = cssNumber('--card-tint-strong', 0.52);
  const mid = cssNumber('--card-tint-mid', 0.30);
  const wash = cssNumber('--card-tint-wash', 0.34);
  return `radial-gradient(circle at 20% 12%, ${rgbaFrom(deep, strong)}, transparent 58%), ` +
         `radial-gradient(circle at 88% 34%, ${rgbaFrom(deep, mid)}, transparent 62%), ` +
         `radial-gradient(circle at 60% 104%, ${rgbaFrom(deep, mid * 0.7)}, transparent 55%), ` +
         `linear-gradient(168deg, ${rgbaFrom(deep, wash)}, ${rgbaFrom(deep, wash * 0.28)} 90%)`;
}

// Applies either a real image (fills the card, small corner badge for the
// type icon) or the gradient/noise fallback (big centered icon) to a
// `.card-media`/`.expanded-media` element. Images are verified to actually
// load before switching — a broken/missing path silently keeps the fallback
// visual instead of showing a blank box, so dropping files into assets/
// later "just works" without any code change.
/* `opts` carries the document treatment: { fit: 'contain', bg: '#1e2760' } from
   a card's imageFit/imageBg. Passed as one object rather than two more
   positional arguments, since every caller has the card in hand anyway. */
function applyCardMedia(mediaEl, imagePath, color, focal, opts) {
  // Set before the probe resolves: background-position is harmless on the
  // gradient fallback, and setting it here means it is already right on the
  // frame the image first paints.
  mediaEl.style.backgroundPosition = focal ? focalPointCss(focal) : '';
  mediaEl.style.setProperty('--card-bloom', mediaGradient(color));
  // The studio's colour as a custom property, for CSS that stages the media
  // in studio tones (the hero's document treatment tints its ground with it).
  mediaEl.style.setProperty('--studio-ink', color);
  mediaEl.classList.remove('has-image');
  mediaEl.classList.remove('is-doc');
  mediaEl.style.removeProperty('background-color');
  mediaEl.style.removeProperty('--card-img');
  if (!imagePath) return;
  const doc = opts && opts.fit === 'contain';
  const probe = new Image();
  probe.onload = () => {
    mediaEl.style.setProperty('--card-img', `url("${imagePath}")`);
    // The CSSOM refuses absurdly long custom-property values outright, and it
    // does it silently — setProperty neither throws nor warns, the property
    // just isn't there afterwards. An un-resized phone photo as a data: URL
    // used to hit that limit, and because `has-image` also switches the
    // gradient fallback off, the card rendered as a blank white box. Uploads
    // are downscaled now (see resizeImageToDataUrl), but read the value back
    // before committing regardless: no image is a fallback, no visual is a bug.
    if (!mediaEl.style.getPropertyValue('--card-img')) {
      mediaEl.style.removeProperty('--card-img');
      return;
    }
    if (doc) {
      mediaEl.classList.add('is-doc');
      // The letterbox is the page's own edge colour, so the fit reads as a
      // mounted page rather than as an image that failed to fill its box.
      if (opts.bg) mediaEl.style.backgroundColor = opts.bg;
      // `contain` puts the page where background-position says, and the CSS
      // above wants that decision, not a focal point meant for a crop.
      mediaEl.style.removeProperty('background-position');
    }
    mediaEl.classList.add('has-image');
  };
  probe.onerror = () => { /* file not there yet — keep the fallback gradient */ };
  probe.src = imagePath;
}

function safeInit(label, fn) {
  try {
    fn();
  } catch (err) {
    console.error('[Loom feed] "' + label + '" failed to initialize:', err);
  }
}

/* ======================================================================
   4. Center overlay menu (Projects/Experiments/Questions/Tools) + topbar
      studio chips + language switcher
   ====================================================================== */
// Both of these are Browse-only (see applyBrowseFilters) — Discover always
// shows its newest-first top slice regardless of filter/search state.
let selectedStudio = 'all';
let selectedTypeFilter = 'all'; // distinct from share mode's `selectedType` (the compose form's chosen type)
let searchQuery = '';
// Set by picking someone in Designers; matches a card's `author` field. Like
// the two above it's Browse + Questions only — Discover stays "what's newest
// across everyone", which is the one thing it's for.
let selectedAuthor = null;
/* Set by clicking a keyword in a detail. Browse + Questions only, like the two
   above — Discover stays "what is newest across everyone", which is the one
   thing it is for. */
let selectedKeyword = null;
let isDesignersMode = false;

// Stagger timing for the menu items — open reads as a deliberate, weighty
// reveal (top to bottom, generous per-item delay); close is the same motion
// undone quickly and in reverse (bottom to top), like a stack unwinding.
/* Doors and sub-items alike. Both animate the same two properties from the same
   resting state, so one query in document order staggers the column top to
   bottom without caring which kind of row each one is. */
const MENU_STAGGER_SELECTOR = '.menu-item, .menu-subitem, .menu-signout';

const MENU_OPEN_STAGGER_MS = 50;
const MENU_OPEN_DUR_MS = 440;
const MENU_OPEN_EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';
// 18ms x 5 items = the last one starts 72ms in and finishes at ~292ms, which
// keeps the whole reverse inside the 200-300ms it is specced at. At 26 it ran
// to ~350ms — still fast, but the tail was doing nothing for the last 50.
const MENU_CLOSE_STAGGER_MS = 18;
const MENU_CLOSE_DUR_MS = 220;
const MENU_CLOSE_EASE = 'cubic-bezier(0.5, 0, 0.85, 0.35)';

/* Every menu row lands on a floor the same way, and the surfaces are the reason
   it takes more than goToFloor: Share, Designers and an open card each hold the
   screen in front of the feed, and moving a feed nobody can see is how you end
   up on the wrong floor when the surface finally closes. `before` runs with the
   floor still hidden, which is where a filter change belongs — applied by the
   time the floor is looked at, rather than visibly rearranging itself after. */
function menuGoToFloor(tier, before) {
  const go = () => { if (before) before(); goToFloor(tier); };
  if (isShareMode) { exitShareMode(); setTimeout(go, CONFIG.MODE_SWAP_MS + 60); return; }
  if (isDesignersMode) { exitDesignersMode(go); return; }
  if (isCardExpanded) { closeCard(); setTimeout(go, CONFIG.MODE_SWAP_MS + 60); return; }
  go();
}

/* The type filter, set from anywhere. The dropdown on floor 2 used to own this
   inline; the menu's sub-items set the same state before the floor is even
   shown, so both now go through here and neither can forget one of the four
   things that have to happen. */
function setBrowseTypeFilter(key) {
  selectedTypeFilter = key;
  document.querySelectorAll('.type-filter-menu-item')
    .forEach((el) => el.classList.toggle('is-active', el.dataset.value === key));
  updateTypeFilterButtonUI();
  applyBrowseFilters();
}

/* Which of the two ways into Knowledge is the one currently in force. Only ever
   marks a sub-item when floor 2 is actually the floor being held: the filter
   survives leaving the floor, but "Projects" lit up while you are looking at
   Threads would be describing somewhere you are not. */
function refreshMenuSubItems() {
  const onBrowse = !isShareMode && !isDesignersMode && currentFloor === FLOOR_BROWSE;
  document.querySelectorAll('.menu-subitem').forEach((el) => {
    el.classList.toggle('is-active', onBrowse && el.dataset.filter === selectedTypeFilter);
  });
}

function renderMenuOverlay() {
  const list = document.getElementById('menuList');

  MENU_ITEMS.forEach((item) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'menu-item';
    btn.dataset.kind = item.comingSoon ? 'pending' : 'nav';
    btn.dataset.value = item.key;

    const label = document.createElement('span');
    label.className = 'menu-item-label';
    btn.appendChild(label);
    if (item.comingSoon) {
      const aside = document.createElement('span');
      aside.className = 'menu-item-aside';
      btn.appendChild(aside);
    }
    // What is actually behind the word, shown on hover — see refreshMenuLabels.
    const desc = document.createElement('span');
    desc.className = 'menu-item-desc';
    btn.appendChild(desc);

    btn.addEventListener('click', () => {
      closeMenuOverlay();
      if (item.comingSoon) { showToast(t().toolsComingSoon); return; }
      // Designers is a surface, and only one surface can hold the screen — the
      // menu's close animation has to finish before the next one starts.
      /* enterDesignersMode now takes Threads down itself, so this needs no
         special case for it — which is the point of having one teardown. */
      if (item.designers) { setTimeout(enterDesignersMode, MENU_CLOSE_DUR_MS); return; }

      // Knowledge means all of it: arriving through the door itself shouldn't
      // land you on a floor still filtered down by a choice made minutes ago —
      // and now also not by its own sub-item from the last visit.
      menuGoToFloor(item.tier, item.key === 'browse' ? () => setBrowseTypeFilter('all') : null);
    });

    list.appendChild(btn);

    /* The sub-items go in as siblings of the door they belong to, not children
       of it: a button inside a button is not a thing, and the stagger walks the
       column in document order, so being the next rows down is what makes them
       arrive on the beat after Knowledge. */
    if (item.subItems) {
      const row = document.createElement('div');
      row.className = 'menu-subrow';
      item.subItems.forEach((sub) => {
        const subBtn = document.createElement('button');
        subBtn.type = 'button';
        subBtn.className = 'menu-subitem';
        subBtn.dataset.value = sub.key;
        subBtn.dataset.filter = sub.filter;
        subBtn.addEventListener('click', () => {
          closeMenuOverlay();
          menuGoToFloor(item.tier, () => setBrowseTypeFilter(sub.filter));
        });
        row.appendChild(subBtn);
      });
      list.appendChild(row);
    }
  });

  /* Sign out: an action, not a floor, so it is not a MENU_ITEMS entry — a
     quiet row after the doors. Hidden until openMenuOverlay confirms there
     is a session to end. Signing out hands the browser to guest mode and
     returns it to the lobby. */
  const signOut = document.createElement('button');
  signOut.type = 'button';
  signOut.className = 'menu-signout';
  signOut.id = 'menuSignOut';
  signOut.style.display = 'none';
  signOut.addEventListener('click', () => {
    closeMenuOverlay();
    const leave = () => {
      try { localStorage.setItem('loom_session_mode', 'guest'); } catch (err) { /* fine */ }
      window.location.href = 'loom_lobby.html';
    };
    if (window.LoomData && LoomData.auth) LoomData.auth.signOut().then(leave, leave);
    else leave();
  });
  list.appendChild(signOut);

  refreshMenuLabels();

  document.getElementById('menuToggleBtn').addEventListener('click', openMenuOverlay);
  document.getElementById('menuCloseBtn').addEventListener('click', closeMenuOverlay);
  // Only a direct hit on the backdrop itself closes it — clicks that bubble
  // up from a menu item or the close button have already handled themselves.
  document.getElementById('menuOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'menuOverlay') closeMenuOverlay();
  });
}

function refreshMenuLabels() {
  document.querySelectorAll('.menu-item').forEach((btn) => {
    // textContent on the label span, not the button — the button also holds the
    // "Coming soon" aside, which writing to the button would wipe out.
    btn.querySelector('.menu-item-label').textContent = t().menu[btn.dataset.value];
    const aside = btn.querySelector('.menu-item-aside');
    if (aside) aside.textContent = t().menuToolsAside;
    const desc = btn.querySelector('.menu-item-desc');
    if (desc) desc.textContent = (t().menuDesc || {})[btn.dataset.value] || '';
  });
  // Same table as the doors — these are menu words, not filter words, so they
  // are plural ("Projects") where the dropdown's are singular ("Project").
  document.querySelectorAll('.menu-subitem').forEach((btn) => {
    btn.textContent = t().menu[btn.dataset.value] || '';
  });
  const signOut = document.getElementById('menuSignOut');
  if (signOut) signOut.textContent = t().menu.signOut || 'Sign out';
  refreshMenuSubItems();
}

// A brief, dismiss-itself pill for actions with no real destination yet
// (see MENU_ITEMS' `tools` entry) — reuses the same "quiet, non-blocking
// feedback" role a real toast/snackbar plays, just scoped to this one case.
let toastTimer = null;
function showToast(message) {
  const toast = document.getElementById('toast');
  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.classList.add('is-visible');
  toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2200);
}

function isMenuOverlayOpen() {
  return document.getElementById('menuOverlay').classList.contains('is-open');
}

function openMenuOverlay() {
  const overlay = document.getElementById('menuOverlay');
  if (overlay.classList.contains('is-open')) return;
  pauseAutoScroll();
  // Sign out exists only for someone signed in — checked at open, because
  // sessions come and go without the menu being rebuilt.
  const signOut = document.getElementById('menuSignOut');
  if (signOut && window.LoomData && LoomData.isConfigured() && LoomData.auth) {
    LoomData.auth.getSession().then((session) => {
      signOut.style.display = session ? '' : 'none';
    });
  }
  /* Read the mark here rather than writing it whenever the filter changes.
     setBrowseTypeFilter runs *before* goToFloor — deliberately, so the floor is
     already filtered the first time it is seen — which means currentFloor is
     still the old floor at that moment and "am I on floor 2" answers no. And
     leaving floor 2 afterwards has nothing to do with the filter, so no filter
     event would ever clear a mark left behind on another floor. Both problems go
     away by asking the question at the only moment the answer is visible. */
  refreshMenuSubItems();
  const items = Array.from(overlay.querySelectorAll(MENU_STAGGER_SELECTOR));
  items.forEach((el, i) => {
    el.style.transitionDelay = (i * MENU_OPEN_STAGGER_MS) + 'ms';
    el.style.transitionDuration = MENU_OPEN_DUR_MS + 'ms';
    el.style.transitionTimingFunction = MENU_OPEN_EASE;
  });
  overlay.classList.add('is-open');
  document.getElementById('menuToggleBtn').setAttribute('aria-expanded', 'true');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      items.forEach((el) => el.classList.add('is-visible'));
    });
  });
}

function closeMenuOverlay() {
  const overlay = document.getElementById('menuOverlay');
  if (!overlay.classList.contains('is-open')) return;
  const items = Array.from(overlay.querySelectorAll(MENU_STAGGER_SELECTOR));
  const n = items.length;
  items.forEach((el, i) => {
    el.style.transitionDelay = ((n - 1 - i) * MENU_CLOSE_STAGGER_MS) + 'ms';
    el.style.transitionDuration = MENU_CLOSE_DUR_MS + 'ms';
    el.style.transitionTimingFunction = MENU_CLOSE_EASE;
    el.classList.remove('is-visible');
  });
  overlay.classList.remove('is-open');
  document.getElementById('menuToggleBtn').setAttribute('aria-expanded', 'false');
  scheduleResumeAutoScroll();
}

function renderStudioChips() {
  const wrap = document.getElementById('studioFilter');
  // Idempotent, because it is no longer called only once at startup:
  // openKeywordFilter re-renders the dock when it resets the other filters, and
  // appending on a second call put two full sets of studio chips side by side.
  wrap.innerHTML = '';
  const items = [
    { key: 'all', name: t().filterAll, color: null },
    ...Object.entries(STUDIOS).filter(([, s]) => s.enabled).map(([key, s]) => ({ key, name: s.name, color: s.color })),
  ];
  items.forEach((item) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'studio-chip' + (item.key === 'all' ? ' is-active' : '');
    btn.dataset.kind = 'studio';
    btn.dataset.value = item.key;
    if (item.color) {
      btn.style.setProperty('--chip-color', item.color);
      btn.style.setProperty('--chip-color-bg', hexToRgba(item.color, 0.12));
    }
    const dot = item.color ? `<span class="chip-dot" style="background:${item.color}"></span>` : '';
    btn.innerHTML = `${dot}<span class="chip-label">${item.name}</span>`;
    btn.addEventListener('click', () => {
      selectedStudio = item.key;
      document.querySelectorAll('[data-kind="studio"]').forEach((b) => b.classList.toggle('is-active', b.dataset.value === selectedStudio));
      applyBrowseFilters();
    });
    wrap.appendChild(btn);
  });
}

// One dropdown button instead of a row of chips — studio is the filter
// people reach for constantly (so it stays a visible chip group), type is
// reached for occasionally, so it folds away and only surfaces as a filled
// pill once something other than "All" is actually picked (see
// updateTypeFilterButtonUI/.has-active-filter). Mirrors the language
// switcher's open/close/outside-click/Escape pattern (see renderLanguageSwitcher).
function renderTypeFilterDropdown() {
  const dropdown = document.getElementById('typeFilterDropdown');
  const btn = document.getElementById('typeFilterBtn');
  const menu = document.getElementById('typeFilterMenu');

  // Browse (tier 2) only ever holds finished knowledge — project/experiment —
  // Questions live in their own tier now, so there's no "Question" entry here.
  const items = [
    { key: 'all', label: t().filterAll, icon: null },
    { key: 'project', label: t().types.project, icon: ICONS.project },
    { key: 'experiment', label: t().types.experiment, icon: ICONS.experiment },
  ];

  items.forEach((item) => {
    const menuItem = document.createElement('button');
    menuItem.type = 'button';
    menuItem.className = 'type-filter-menu-item' + (item.key === selectedTypeFilter ? ' is-active' : '');
    menuItem.dataset.kind = 'type';
    menuItem.dataset.value = item.key;
    menuItem.innerHTML = `<span class="type-filter-menu-icon">${item.icon || FILTER_ICON}</span><span class="type-filter-menu-label">${item.label}</span>`;
    menuItem.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdown.classList.remove('is-open');
      // setBrowseTypeFilter does the other four things, and keeps the menu's own
      // two sub-items in step with a choice made down here.
      setBrowseTypeFilter(item.key);
    });
    menu.appendChild(menuItem);
  });

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdown.classList.toggle('is-open');
  });
  document.addEventListener('click', () => dropdown.classList.remove('is-open'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') dropdown.classList.remove('is-open'); });

  updateTypeFilterButtonUI();
}

function updateTypeFilterButtonUI() {
  const dropdown = document.getElementById('typeFilterDropdown');
  const isAll = selectedTypeFilter === 'all';
  document.getElementById('typeFilterBtnIcon').innerHTML = isAll ? FILTER_ICON : ICONS[selectedTypeFilter];
  document.getElementById('typeFilterBtnLabel').textContent = isAll ? t().typeFilterLabel : t().types[selectedTypeFilter];
  dropdown.classList.toggle('has-active-filter', !isAll);
}

function renderLanguageSwitcher() {
  const switcher = document.getElementById('langSwitcher');
  const btn = document.getElementById('langBtn');
  const menu = document.getElementById('langMenu');

  LANGUAGES.forEach((lang) => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'lang-menu-item' + (lang.code === currentLang ? ' is-active' : '');
    item.dataset.lang = lang.code;
    item.textContent = lang.label;
    item.addEventListener('click', () => {
      switcher.classList.remove('is-open');
      setLanguage(lang.code);
    });
    menu.appendChild(item);
  });

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    switcher.classList.toggle('is-open');
  });
  document.addEventListener('click', () => switcher.classList.remove('is-open'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') switcher.classList.remove('is-open'); });

  // The corner mark has to agree with `currentLang` from the first frame. It
  // used to be left at the "EN" in the markup, which was right only because
  // the page always started in English — now that the language is restored
  // from storage, a German session would render entirely in German under a
  // button still claiming EN.
  updateLanguageButtonUI();
}

function updateLanguageButtonUI() {
  const lang = LANGUAGES.find((l) => l.code === currentLang);
  // .short, not .label — this is a 34px corner mark, not a menu row.
  document.getElementById('langBtnLabel').textContent = lang.short;
  document.querySelectorAll('.lang-menu-item').forEach((el) => {
    el.classList.toggle('is-active', el.dataset.lang === currentLang);
  });
}

// Language switch: fade the text-bearing regions out, swap every string in
// place, then fade back in. Layout/positions never move, so this stays cheap
// and smooth regardless of how much text length changes between languages.
function setLanguage(lang) {
  if (lang === currentLang || !TRANSLATIONS[lang]) return;

  const fadeEls = [
    document.getElementById('heroSlides'),
    document.getElementById('homeScroll'),   // whichever of the two floor 1 is
    document.getElementById('browseGrid'),
    document.getElementById('menuList'),
    document.getElementById('searchInput'),
  ];
  if (isCardExpanded) fadeEls.push(document.querySelector('.expanded-body-scroll'));
  if (isShareMode) fadeEls.push(document.getElementById('shareViewport'));
  if (isDesignersMode) fadeEls.push(document.getElementById('designersViewport'));
  if (currentFloor === FLOOR_THREADS) fadeEls.push(document.getElementById('threadsSection'));

  fadeEls.forEach((el) => { if (el) el.style.opacity = '0'; });

  setTimeout(() => {
    currentLang = lang;
    // Not via safeSetItem's read-back check: a language that fails to persist
    // is a preference lost on reload, not corrupt state, and it must never
    // stop the switch itself from happening.
    try { localStorage.setItem(LANGUAGE_STORAGE_KEY, lang); } catch (err) { /* preference only */ }

    /* Remote cards carry text in one resolved language (see cardText), so a
       switch needs their list in the new one. Nearly always it is already
       here — the other languages are prefetched after first paint — and then
       it is swapped in BEFORE the text refresh below, so the whole screen
       changes language in a single repaint instead of twice. */
    const cached = (remoteCards && window.LoomData && LoomData.cachedCards)
      ? LoomData.cachedCards(lang) : null;
    if (cached) remoteCards = cached;

    refreshAllText();
    if (cached) { rebuildAllSurfaces(); renderNowStrip(); }
    fadeEls.forEach((el) => { if (el) el.style.opacity = '1'; });
    syncUrlState({ replace: true });

    // Not cached (a slow prefetch, or a feed too large to prefetch): fetch it
    // now, and let the cards catch up a beat after the chrome.
    if (!cached && remoteCards && window.LoomData) {
      LoomData.loadCards(lang).then((cards) => {
        if (!cards || lang !== currentLang) return; // stale response — a newer switch won
        remoteCards = cards;
        rebuildAllSurfaces();
        renderNowStrip();
        if (isCardExpanded && currentOpenIndex !== null) {
          populateExpanded(ALL_CARDS[currentOpenIndex], currentOpenIndex);
        }
      });
    } else if (cached && isCardExpanded && currentOpenIndex !== null) {
      populateExpanded(ALL_CARDS[currentOpenIndex], currentOpenIndex);
    }
  }, CONFIG.LANG_FADE_MS);
}

function refreshAllText() {
  const strings = t();

  document.getElementById('searchInput').placeholder = strings.searchPlaceholder;

  refreshMenuLabels();

  document.querySelectorAll('.studio-chip[data-value="all"] .chip-label').forEach((el) => { el.textContent = strings.filterAll; });
  document.querySelectorAll('.type-filter-menu-item').forEach((btn) => {
    const label = btn.querySelector('.type-filter-menu-label');
    if (label) label.textContent = btn.dataset.value === 'all' ? strings.filterAll : strings.types[btn.dataset.value];
  });
  updateTypeFilterButtonUI();

  // (no per-floor headings any more — the menu names every floor, and floor 1
  //  carries nothing but its image and its title)
  document.getElementById('browseEmpty').textContent = strings.browseEmptyText;
  document.getElementById('questionsEmpty').textContent = strings.questionsEmptyText;

  refreshCornerDockText();

  updateLanguageButtonUI();
  // The bell carries its count in an aria-label (it has no visible text), and
  // that label is written by renderNotificationIndicator — which nothing here
  // was calling, so a screen reader kept hearing "For you — 5 new" in English
  // no matter which language the page had been switched to.
  renderNotificationIndicator();
  renderDiscover();
  renderBrowse();
  renderQuestions();
  renderDesigners();
  refreshThreadsText();
  refreshDesignerEditorText();
  renderAuthorFilterChip();
  renderKeywordFilterChip();
  refreshShareText();

  const closeBtn = document.getElementById('expandedClose');
  closeBtn.setAttribute('aria-label', strings.closeAria);
  /* Guest mode removes the write controls from the DOM outright, so every
     lookup down here has to allow for their absence — before this, a guest
     switching language threw on the first missing button and the rest of the
     screen kept the old language. */
  const applyBtn = document.getElementById('applyBtn');
  if (applyBtn) {
    applyBtn.textContent = applyBtn.classList.contains('is-applied') ? strings.applyButtonDone : strings.applyButton;
  }
  const setText = (id, value) => {
    const el = document.getElementById(id);
    if (el) el.textContent = value; // absent in guest mode
  };
  setText('deleteCardLabel', strings.deleteLink);
  setText('editCardLabel', strings.editLink);
  setText('deleteConfirmText', strings.deleteConfirmText);
  setText('deleteCancelBtn', strings.deleteCancel);
  setText('deleteConfirmBtn', strings.deleteConfirmButton);

  if (isCardExpanded && currentOpenIndex !== null) {
    populateExpanded(ALL_CARDS[currentOpenIndex], currentOpenIndex);
  }
}

/* ======================================================================
   5. Card rendering — two distinct surfaces sharing the same ALL_CARDS data.

   Discover: one full-width hero banner, autoplaying through a curated top
   slice (computeDiscoverIndices) — always "what's newest", full stop, with
   no filters and no scrolling of its own (see initHeroControls below).

   Browse: every card, small and dense, filtered/searched independently.
   ====================================================================== */
/* ---------- the cover's title ----------
   Each word is wrapped in a .hero-word mask around a plain span (the thing that
   moves), so the letters emerge from behind an edge rather than fading in
   place. The CSS holds the closed state and .is-active on the slide releases
   it, so a slide coming back round replays for free. 70ms sits in the middle
   of the 60-80ms the motion is specced at. textContent on the inner span,
   never innerHTML — a card title is user copy. */
const HERO_WORD_STAGGER_MS = 70;

function renderHeroTitle(el, title) {
  el.innerHTML = '';
  String(title).split(/\s+/).filter(Boolean).forEach((word, i) => {
    const mask = document.createElement('span');
    mask.className = 'hero-word';
    const inner = document.createElement('span');
    inner.textContent = word;
    inner.style.transitionDelay = (i * HERO_WORD_STAGGER_MS) + 'ms';
    mask.appendChild(inner);
    el.appendChild(mask);
    el.appendChild(document.createTextNode(' '));
  });
}

/* The title is meant to take roughly a third of the screen — which is a height
   target, and a font-size can't hit a height target on its own: the same 116px
   runs to two lines for one card and five for the next. So the CSS clamp is
   only the ceiling, and this steps it down until the block actually fits. Cheap
   enough to run per slide (five of them, once per render and once per resize)
   and it beats guessing a size that suits every title. */
const HERO_TITLE_MAX_H = 0.38;  // share of the banner the title may occupy
const HERO_TITLE_MIN_PX = 30;

function fitHeroTitle(titleEl) {
  const hero = document.getElementById('discoverHero');
  if (!hero || !hero.clientHeight || !titleEl) return;
  const maxH = hero.clientHeight * HERO_TITLE_MAX_H;

  titleEl.style.fontSize = ''; // back to the CSS ceiling, so a resize can grow it again
  let size = parseFloat(getComputedStyle(titleEl).fontSize);
  let guard = 0;
  while (titleEl.scrollHeight > maxH && size > HERO_TITLE_MIN_PX && guard++ < 30) {
    size *= 0.93;
    titleEl.style.fontSize = size + 'px';
  }
}

function fitAllHeroTitles() {
  document.querySelectorAll('#heroSlides .card-title').forEach(fitHeroTitle);
}

/* Re-arms the cover: strips .is-active, forces the closed frame to paint, then
   puts it back — which restarts both the word stagger and the Ken Burns push.
   Called when you land back on floor 1, so returning to the cover is an arrival
   rather than a resume.

   .is-replaying kills the transitions for exactly one frame. Without it,
   dropping .is-active starts a *delayed* transition back to closed, the words
   have not moved yet when .is-active returns, and there is nothing to replay. */
function replayHeroIntro() {
  const slide = document.querySelector('#heroSlides .hero-slide.is-active');
  if (!slide) return;
  slide.classList.add('is-replaying');
  slide.classList.remove('is-active');
  void slide.offsetWidth;
  slide.classList.remove('is-replaying');
  void slide.offsetWidth;
  slide.classList.add('is-active');
}

let heroIndices = [];
let heroIndex = 0;
let heroTimer = null;

/* ======================================================================
   HOME — floor 1 as a place to ask from
   ----------------------------------------------------------------------
   The bottleneck this exists to remove: asking a question meant filling in
   the Slack Canvas form, so nobody asked one. Here it is a line and Enter.

   Deliberately NOT a target picker. Offering Everyone / DoubleU / Whow
   invites the thought "am I allowed to ask them this?", and that hesitation
   is the barrier, not a routing problem. Every question is open; asked_to
   stays null, which the read path already treats as everyone.

   HOME_ASK is the switch back. false restores the banner exactly as it was
   — the slides, the five-second autoplay, the arrows, the dots and the
   Update strip are all still in this file and still wired. Nothing was
   deleted to build this.
   ====================================================================== */
const HOME_ASK = true;

// how many threads become bands; the ranking is homeTopics. Four, so the three
// exchanges in the record stay on the page when a new question opens a band.
const HOME_TOPIC_COUNT = 4;
// a word one card carries is a label; a conversation needs at least two
const HOME_TOPIC_MIN_CARDS = 2;

/* ---------- every number the page's type and spacing is made of ----------
   One table, applied as CSS variables by applyHomeMetrics(). Tune here.

   The order of the sizes IS the hierarchy, and it was upside down at first:
   the lede was the largest thing on screen and the field's placeholder was
   smaller and paler than it, so the field read as a caption to an
   announcement. The lede is a sentence you read once; the field is where
   the work happens. So the field is now the biggest type on the floor and
   the lede sits under it — a heading, not a headline.

   Sizes are px and interpolate with the viewport between min and max. */
const HOME_METRICS = {
  /* ---------- the top anchor ----------
     With the lede gone there was nothing up here for the eye to land on. Of
     the two ways to give the top weight — a bigger wordmark or a heavier
     rule — the rule won: it puts the weight on the thing you are meant to
     use, and at full width it reads as a masthead rule rather than a form
     underline. The wordmark stays a signature. */
  fieldMin: 20, fieldMax: 24,
  fieldPadTop: 8,
  fieldPadBottom: 14,
  ruleWeight: 1.5,     // px, at rest
  ruleRest: 0.50,      // ink alpha at rest — this IS the anchor
  ruleHover: 0.70,
  ruleFocus: 2,        // px — the one moment of colour on the floor
  placeholderInk: 0.50,

  /* ---------- the bands ----------
     Geometry, in one place. The timeline is maxDots*step + labelW wide so
     the oldest visible label still fits; the newest dot of every band sits
     on the same "now" line, one step in from the right edge, and the hollow
     "waiting" circle takes that last step.

     maxDots is the lever on the left-hand gap. With four visible dots a
     two-card thread left 41% of its band empty; with three it leaves 26%,
     and no thread in the record has more than three cards yet. Past three
     the band shows "+N" on the left instead. */
  contentWidth: 1160,  // nameCol + the timeline (homeTimelineWidth)
  nameCol: 254,        // the thread-name column — "Format Adaptation" on one line at nameSize
  nameSize: 29,        // px, serif
  labelW: 210,         // a card's label, centred under its dot
  labelMaxChars: 34,   // two lines; truncated at a word boundary, never inside one
  step: 232,           // dot to dot
  maxDots: 3,
  dot: 14,             // big enough to read as a target; hover scales it
  lineWeight: 1.5,
  bandGap: 72,

  /* ---------- the vertical rhythm ---------- */
  gapMarkField: 24,
  gapFieldBands: 84,
};

// the pixel width one band's timeline needs — see HOME_METRICS
function homeTimelineWidth() {
  return HOME_METRICS.maxDots * HOME_METRICS.step + HOME_METRICS.labelW;
}

function applyHomeMetrics() {
  const inner = document.querySelector('.home-inner');
  if (!inner) return;
  const M = HOME_METRICS;
  const px = (name, value) => inner.style.setProperty(name, value + 'px');
  px('--home-field-min', M.fieldMin);
  px('--home-field-max', M.fieldMax);
  px('--home-field-pad-top', M.fieldPadTop);
  px('--home-field-pad-bottom', M.fieldPadBottom);
  px('--home-rule-weight', M.ruleWeight);
  px('--home-rule-focus', M.ruleFocus);
  px('--home-content-width', M.contentWidth);
  px('--home-name-col', M.nameCol);
  px('--home-name-size', M.nameSize);
  px('--home-label-w', M.labelW);
  px('--home-dot', M.dot);
  px('--home-line-weight', M.lineWeight);
  px('--home-band-gap', M.bandGap);
  px('--home-timeline-w', homeTimelineWidth());
  px('--home-gap-mark-field', M.gapMarkField);
  px('--home-gap-field-bands', M.gapFieldBands);
  inner.style.setProperty('--home-rule-rest', 'rgba(28, 28, 30, ' + M.ruleRest + ')');
  inner.style.setProperty('--home-rule-hover', 'rgba(28, 28, 30, ' + M.ruleHover + ')');
  inner.style.setProperty('--home-placeholder-ink', String(M.placeholderInk));
}

/* Shortens a card title for the label under its dot. Cuts at the last word
   boundary inside the budget — "사례와 그 이..." was a title broken in the
   middle of a word, which reads as a rendering fault rather than a summary.
   Falls back to a hard cut only when there is no space in the first half. */
function clipWords(text, max) {
  const s = String(text || '').trim();
  if (s.length <= max) return s;
  const cut = s.lastIndexOf(' ', max);
  let head = cut > max * 0.45 ? s.slice(0, cut) : s.slice(0, max);
  /* a cut that lands after "a", "on", "및" leaves the label hanging on a
     word that says nothing — drop trailing tokens of two letters or fewer,
     then any dangling dash */
  head = head.replace(/(\s+\S{1,2})+$/, '').replace(/[\s—–-]+$/, '');
  return head + '…';
}

// the studio whose turn it is: the one the asker is not
function awaitedStudio(card) {
  return enabledStudioKeys().find((key) => key !== card.studio) || null;
}

function homeRelativeTime(card) {
  return card.justNow ? t().justNow : formatRelativeTime(currentLang, card.timeValue, card.timeUnit);
}

/* Which studio has put most into a topic. Only decides the colour of the
   hover underline — the accent belongs to the conversation, not to the app. */
function homeTopicAccent(topic) {
  const tally = {};
  topic.cards.forEach((card) => { tally[card.studio] = (tally[card.studio] || 0) + 1; });
  const best = topic.studios.slice().sort((a, b) => (tally[b] || 0) - (tally[a] || 0))[0];
  return (STUDIOS[best] && STUDIOS[best].color) || 'var(--ink)';
}

/* ---------- "awaiting an answer" ----------
   The first version of this counted every question card whose status was not
   'resolved', and it was wrong on the two exchanges that actually exist.

   Oktoberfest: DoubleU asked which hooks work with German players (Aug 31,
   status still 'open'), and Bengt answered with a Whow card three days later
   that is linked to it as Continued from. Nobody had gone back to flip a
   status field, so the floor told Whow their answer had not arrived. On a
   screen the other studio reads, that is the expensive kind of wrong.

   Format Adaptation: the DoubleU card of Sep 4 ends with "Any thoughts from
   Felix on the current structure?" and nothing has come back. It is not a
   question-type card at all, so the old rule could not see it — the one
   genuinely open ask on the floor was the one it missed.

   So: what asks is a field, not a type; and what answers is a card from the
   OTHER studio, not a status. */
function cardAsksSomething(card) {
  if (isOpenQuestion(card) && card.status !== 'resolved') return true;
  // any type of card can end with an open question, and often does
  return !!String(cardText(card).openQuestion || '').trim();
}

/* Answered if any one of these is true — each catches a real case:
     1. a card from the other studio explicitly derives from this one
        (Continued from / Applied from / Built on — the direction is what
        matters, not which relation it is)
     2. somebody from the other studio spoke in its own conversation
     3. the other studio has posted in this topic since it was asked

   (3) is the loose one, and it is here on purpose. An answer written INTO
   the prose of the field — the Aug 14 card ends "Felix does work with a
   Windows setup" — is invisible to any rule short of reading it, and the
   failure this whole function exists to avoid is telling the other studio
   they never replied. Where the evidence is ambiguous this errs toward
   saying nothing rather than toward an accusation. */
function cardHasAnswer(card, topicCards) {
  const from = card.studio;
  if (ALL_CARDS.some((c) => c.derivedFrom === card.id && c.studio !== from)) return true;
  const conversation = card.conversation || [];
  if (conversation.some((m) => m && m.studio && m.studio !== from)) return true;
  /* Without a band to hand it, "the same thread" is every card sharing a
     keyword with this one — what a band is made of, so the floor and the
     detail judge exactly as Home does. */
  const thread = topicCards || cardsSharingKeywords(card);
  return thread.some((c) => c.studio !== from && daysAgoOf(c) < daysAgoOf(card));
}

function cardsSharingKeywords(card) {
  const mine = new Set(keywordsOf(card).map(keywordKey).filter(Boolean));
  if (!mine.size) return [];
  return ALL_CARDS.filter((c) => c !== card && keywordsOf(c).some((w) => mine.has(keywordKey(w))));
}

// the single question every surface asks: is this card still waiting?
function askIsOpen(card) {
  return cardAsksSomething(card) && !cardHasAnswer(card);
}

/* What is actually going back and forth, by keyword.
   Ranked CROSS-STUDIO FIRST, then by most recent activity: "in circulation"
   claims an exchange, and a keyword only one studio has written under is a
   subject rather than a conversation. Three DoubleU cards therefore rank
   below two that cross — which is the honest reading of the word. */
function homeTopics(limit) {
  const byWord = new Map();
  ALL_CARDS.forEach((card) => {
    if (!isStudioEnabled(card.studio)) return;
    keywordsOf(card).forEach((word) => {
      const key = keywordKey(word);
      if (!key) return;
      if (!byWord.has(key)) byWord.set(key, { label: word, cards: [] });
      byWord.get(key).cards.push(card);
    });
  });

  const topics = [];
  byWord.forEach((entry) => {
    /* Two cards make a conversation. One card does not — unless it is an
       unanswered ask: a question standing alone is exactly the thing this
       floor exists to surface, and it is how a just-posted question becomes
       visible the moment its keyword lands. */
    if (entry.cards.length < HOME_TOPIC_MIN_CARDS && !entry.cards.some(askIsOpen)) return;
    const newest = entry.cards.reduce((a, c) => (daysAgoOf(c) < daysAgoOf(a) ? c : a), entry.cards[0]);
    topics.push({
      label: entry.label,
      cards: entry.cards,
      studios: [...new Set(entry.cards.map((c) => c.studio))],
      // an unanswered ask is more worth saying than a date — see askIsOpen
      waiting: entry.cards.filter(askIsOpen).length,
      newest: newest,
    });
  });

  /* Ranking, as approved: cross-studio first ("in circulation" claims an
     exchange), then a thread with something WAITING before one with nothing,
     then most recent activity. Waiting ranks inside the cross-studio rule
     rather than above it — put first, a single-studio thread with a stray
     open question outranked real exchanges. A fresh one-card question is
     single-studio too and lands after the exchanges; HOME_TOPIC_COUNT is
     four so that slot exists. */
  topics.sort((a, b) => {
    const cross = (b.studios.length > 1) - (a.studios.length > 1);
    if (cross) return cross;
    const waiting = (b.waiting > 0) - (a.waiting > 0);
    if (waiting) return waiting;
    return daysAgoOf(a.newest) - daysAgoOf(b.newest);
  });

  /* A question standing alone — one card, still waiting — is pinned onto the
     page whatever its rank. The record already has four cross-studio threads,
     which is every slot; under the rule alone a question posted a minute ago
     would rank below all of them and never be seen by the person who asked
     it. It takes the last slot rather than the first so the approved order
     above stays exactly what it is. */
  const pinned = topics.filter((tp) => tp.cards.length === 1 && tp.waiting > 0);
  const ranked = topics.filter((tp) => pinned.indexOf(tp) < 0).slice(0, Math.max(0, limit - pinned.length));
  return ranked.concat(pinned.slice(0, limit));
}

// the id of a just-posted card, so its dot can arrive once and only once
let homeArrivingId = null;

/* A card's dot and the label under it. Two buttons that do the same thing —
   the dot is the target you aim for, the label is the one you read — both
   carrying BOTH attributes openCard needs (index and card-id; see openCardById
   on why an element with only the id hands it NaN). */
function homeNodeEls(card, x, color) {
  const node = document.createElement('button');
  node.type = 'button';
  node.className = 'home-node';
  node.style.left = x + 'px';
  node.style.setProperty('--node-color', color);
  node.dataset.cardId = card.id;
  node.dataset.index = String(ALL_CARDS.indexOf(card));
  node.setAttribute('aria-label', cardText(card).title || '');
  if (homeArrivingId && card.id === homeArrivingId) node.classList.add('is-arriving');

  const label = document.createElement('button');
  label.type = 'button';
  label.className = 'home-node-label';
  label.style.left = x + 'px';
  label.dataset.cardId = card.id;
  label.dataset.index = node.dataset.index;
  const title = document.createElement('div');
  title.className = 'home-node-title';
  title.textContent = clipWords(cardText(card).title, HOME_METRICS.labelMaxChars);
  const meta = document.createElement('div');
  meta.className = 'home-node-meta';
  meta.textContent = STUDIOS[card.studio].name + ' · ' + homeRelativeTime(card);
  label.appendChild(title);
  label.appendChild(meta);

  const open = () => openCard(node);
  node.addEventListener('click', open);
  label.addEventListener('click', open);
  return [node, label];
}

function homeSegEl(fromX, toX, pending) {
  const seg = document.createElement('div');
  seg.className = 'home-seg' + (pending ? ' is-pending' : '');
  seg.style.left = fromX + 'px';
  seg.style.width = (toX - fromX) + 'px';
  return seg;
}

/* One band per active thread. Geometry is HOME_METRICS; the ranking is
   homeTopics (cross-studio first, then recency); what counts as an
   unanswered ask is cardAsksSomething / cardHasAnswer. */
function renderHomeBands() {
  const wrap = document.getElementById('homeBands');
  if (!wrap) return;
  wrap.querySelectorAll('.home-band').forEach((el) => el.remove());

  const topics = homeTopics(HOME_TOPIC_COUNT);
  wrap.hidden = !topics.length;   // nothing in circulation → no diagram, not an empty one
  if (!topics.length) { homeArrivingId = null; return; }

  const M = HOME_METRICS;
  const strings = t().home;
  const T = homeTimelineWidth();
  const R = T - M.labelW / 2;          // rightmost node: its label still fits
  const NOW = R - M.step;              // every band's newest card stands here

  const nowMark = document.getElementById('homeNow');
  if (nowMark) {
    nowMark.textContent = strings.nowLabel;
    nowMark.style.left = (M.nameCol + NOW) + 'px';
  }

  topics.forEach((topic) => {
    const band = document.createElement('div');
    band.className = 'home-band';
    band.style.setProperty('--band-accent', homeTopicAccent(topic));

    // ---- the name column ----
    const nameCol = document.createElement('div');
    nameCol.className = 'home-band-name';
    const title = document.createElement('button');
    title.type = 'button';
    title.className = 'home-band-title';
    title.textContent = topic.label;
    /* A thread IS a place — the panel that already exists for it, opened from
       where the name sits (see openThreadView's transform-origin argument). */
    title.addEventListener('click', () => {
      const rect = title.getBoundingClientRect();
      openThreadView(topic.label, { x: rect.left + 24, y: rect.top + rect.height / 2 });
    });
    const sub = document.createElement('div');
    sub.className = 'home-band-sub';
    sub.textContent = topic.studios.map((key) => STUDIOS[key].name).join(' + ')
      + ' · ' + t().threadView.pieceCount(topic.cards.length);
    nameCol.appendChild(title);
    nameCol.appendChild(sub);
    band.appendChild(nameCol);

    // ---- the timeline ----
    const line = document.createElement('div');
    line.className = 'home-band-line';

    const cards = topic.cards.slice().sort((a, b) => daysAgoOf(b) - daysAgoOf(a)); // oldest → newest
    const shown = cards.slice(-M.maxDots);
    const hidden = cards.length - shown.length;
    const x = (i) => NOW - (shown.length - 1 - i) * M.step;

    /* Lines only where the record says so: a card that derives from an
       earlier card in this band is joined to it, whatever the relation kind.
       Two cards that merely share the keyword stand apart. */
    shown.forEach((card, i) => {
      if (!card.derivedFrom) return;
      const j = shown.findIndex((c) => c.id === card.derivedFrom);
      if (j >= 0 && j < i) line.appendChild(homeSegEl(x(j), x(i), false));
    });

    /* The newest unanswered ask in the band, if any, becomes a hollow circle
       one step past "now", joined by a dotted line: what is still to come. */
    const open = cards.filter(askIsOpen);
    const wait = open.length ? open[open.length - 1] : null;
    if (wait) line.appendChild(homeSegEl(NOW, R, true));

    shown.forEach((card, i) => {
      homeNodeEls(card, x(i), STUDIOS[card.studio].color).forEach((el) => line.appendChild(el));
    });

    if (hidden > 0) {
      const plus = document.createElement('span');
      plus.className = 'home-plus';
      plus.style.left = (x(0) - M.dot) + 'px';
      plus.textContent = '+' + hidden;
      line.appendChild(plus);
    }

    if (wait) {
      const whoKey = awaitedStudio(wait);
      const who = whoKey ? STUDIOS[whoKey] : null;
      const color = who ? who.color : 'var(--ink)';
      const node = document.createElement('button');
      node.type = 'button';
      node.className = 'home-node is-wait';
      node.style.left = R + 'px';
      node.style.setProperty('--node-color', color);
      node.dataset.cardId = wait.id;
      node.dataset.index = String(ALL_CARDS.indexOf(wait));
      const label = document.createElement('button');
      label.type = 'button';
      label.className = 'home-node-label is-wait';
      label.style.left = R + 'px';
      label.dataset.cardId = wait.id;
      label.dataset.index = node.dataset.index;
      // the open question itself, shortened — not a name the data cannot supply
      const q = document.createElement('div');
      q.className = 'home-node-title';
      q.textContent = clipWords(cardText(wait).openQuestion || cardText(wait).title, M.labelMaxChars);
      const meta = document.createElement('div');
      meta.className = 'home-node-meta';
      if (who) {
        const whoEl = document.createElement('span');
        whoEl.className = 'home-node-who';
        whoEl.textContent = who.name;
        meta.appendChild(whoEl);
        meta.appendChild(document.createTextNode(' · '));
      }
      meta.appendChild(document.createTextNode(strings.awaiting));
      label.appendChild(q);
      label.appendChild(meta);
      const openWait = () => openCard(node);
      node.addEventListener('click', openWait);
      label.addEventListener('click', openWait);
      line.appendChild(node);
      line.appendChild(label);
    }

    band.appendChild(line);
    wrap.appendChild(band);
  });

  homeArrivingId = null;   // one arrival per post, never on a later redraw
}

function renderHome() {
  if (!document.getElementById('homeBands')) return;
  refreshHomeText();
  renderHomeBands();

  /* Two different nothings, and only one of them is an error.
     Unreachable keeps the hero's own notice (moved into the column by
     initHome — the retry button is already wired to a real reload).
     Genuinely empty is not a failure and does not get an error's voice: it
     gets the one line worth acting on. */
  renderFeedEmpty();
  const box = document.getElementById('feedEmpty');
  const first = document.getElementById('homeFirst');
  const trulyEmpty = !ALL_CARDS.length && !remoteLoadFailed;
  if (box && trulyEmpty) box.hidden = true;
  if (first) first.hidden = !trulyEmpty;
}

/* ---- the field ----------------------------------------------------------- */

// A message occupying the status slot, or null for the resting hint.
let askMessage = null;

function askCanPost() {
  return !!authProfile;
}

function refreshHomeText() {
  const strings = t().home;
  const setText = (id, value) => {
    const el = document.getElementById(id);
    if (el) el.textContent = value;
  };

  applyHomeMetrics();

  // my studio's colour, for the field's caret and its focus rule
  const inner = document.querySelector('.home-inner');
  const mine = STUDIOS[MY_STUDIO_KEY];
  if (inner && mine) inner.style.setProperty('--studio-mine', mine.color);

  setText('homeFirst', strings.first);
  setText('askSignin', strings.signIn);

  const field = document.getElementById('askField');
  if (field) field.placeholder = strings.placeholder;
  const desc = document.getElementById('askDescField');
  if (desc) desc.placeholder = strings.descriptionPlaceholder;

  askRefreshState();
}

function askRefreshState() {
  const form = document.getElementById('askForm');
  if (!form) return;
  const field = document.getElementById('askField');
  const status = document.getElementById('askStatus');
  const signin = document.getElementById('askSignin');
  const more = document.getElementById('askMore');
  const strings = t().home;
  const typed = !!field.value.trim();
  const descOpen = !document.getElementById('askDesc').hidden;

  form.classList.toggle('is-typing', typed);
  form.classList.toggle('is-desc-open', descOpen);
  more.textContent = descOpen ? strings.hideDescription : strings.addDescription;

  /* Read-only rather than disabled: a disabled field greys out and reads as
     broken, while a guest's field has to look exactly like a member's — what
     is possible here must be visible before it is available. */
  field.readOnly = !askCanPost();

  const guestBlocked = form.classList.contains('is-guest-blocked');
  if (askMessage) {
    status.textContent = askMessage.text;
    status.classList.toggle('is-error', askMessage.kind === 'error');
  } else {
    status.textContent = typed ? '' : strings.hint;
    status.classList.remove('is-error');
  }
  if (guestBlocked) status.textContent = strings.guest;
  signin.hidden = !guestBlocked;
}

function askSetMessage(text, kind) {
  askMessage = text ? { text: text, kind: kind || 'info' } : null;
  askRefreshState();
}

function askShowGuest() {
  const form = document.getElementById('askForm');
  askMessage = null;
  form.classList.add('is-guest-blocked');
  askRefreshState();
}

function askClearGuest() {
  const form = document.getElementById('askForm');
  if (form) form.classList.remove('is-guest-blocked');
}

function askToggleDescription() {
  const desc = document.getElementById('askDesc');
  desc.hidden = !desc.hidden;
  askRefreshState();
  if (!desc.hidden) document.getElementById('askDescField').focus();
}

/* One line becomes a question card: title only, or title plus the optional
   description in `blocked` — the question type's own body field, which the
   card detail and the Thread panel already render as "Asked".

   No localStorage fallback on purpose. The share form keeps one, and it is
   what made a failed write look like a successful one; here a failure says
   so and leaves the text in the field, which is the only copy that matters. */
async function askSubmit() {
  const form = document.getElementById('askForm');
  const field = document.getElementById('askField');
  const descBox = document.getElementById('askDesc');
  const descField = document.getElementById('askDescField');
  const title = field.value.trim();
  if (!title || form.classList.contains('is-busy')) return;
  if (!askCanPost()) { askShowGuest(); return; }

  const text = { title: title };
  const body = descBox.hidden ? '' : descField.value.trim();
  if (body) text.blocked = body;

  form.classList.add('is-busy');
  askSetMessage(null);
  const res = await LoomData.submitCard({
    id: 'ask-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8),
    studio: MY_STUDIO_KEY,
    type: 'question',
    sourceLang: currentLang,
    /* No keywords at post time: choosing them is the friction this screen
       exists to remove. They arrive a moment later from the keyword-card
       function (Gemini, existing vocabulary first — see the tail of this
       function), and the daily sync sweeps anything that call missed. */
    keywords: [],
    askedTo: null,      // every question is open — see the header
    link: null,
    text: text,
  }, null);
  form.classList.remove('is-busy');

  if (!res.ok) { askSetMessage(t().home.failed, 'error'); return; }

  field.value = '';
  descField.value = '';
  descBox.hidden = true;
  // data.js has already folded the new card into every language's cache
  rebuildAllSurfaces();
  askSetMessage(t().home.postedTagging, 'info');

  /* Then the keywords, in the background: the card is saved and on the Open
     questions floor already, so nothing here can lose it. When they land the
     card joins a band and its dot arrives — the one motion on this floor the
     reader did not cause with a keypress. If the person has started typing
     the next line meanwhile, the field's status is theirs, not this one's. */
  LoomData.requestCardKeywords(res.id).then((tagged) => {
    const settled = tagged.ok && tagged.keywords.length;
    if (settled) {
      homeArrivingId = res.id;
      rebuildAllSurfaces();
    }
    if (field.value.trim()) return;
    const inBand = settled && !!document.querySelector('#homeBands .home-node[data-card-id="' + res.id + '"]');
    askSetMessage(inBand ? t().home.postedInBand : t().home.posted, 'info');
  });
}

function initHome() {
  const section = document.querySelector('.discover-section');
  if (section) section.classList.toggle('is-home', HOME_ASK);
  if (!HOME_ASK) return;

  /* The offline notice moves into the reading column once, before anything
     renders. Reusing the hero's element keeps its retry button — already
     wired to a real reload in initFeedEmptyRetry — instead of growing a
     second one that would have to be kept in step. */
  const box = document.getElementById('feedEmpty');
  const inner = document.querySelector('.home-inner');
  if (box && inner) inner.appendChild(box);

  const form = document.getElementById('askForm');
  const field = document.getElementById('askField');
  const descField = document.getElementById('askDescField');

  form.addEventListener('submit', (e) => { e.preventDefault(); askSubmit(); });
  document.getElementById('askMore').addEventListener('click', askToggleDescription);

  document.getElementById('askSignin').addEventListener('click', () => {
    /* Signing in lives in the lobby. Drop the guest flag on the way out or
       the lobby hands them straight back as a guest. */
    try { localStorage.removeItem('loom_session_mode'); } catch (err) { /* fine */ }
    window.location.href = 'loom_lobby.html';
  });

  field.addEventListener('focus', () => {
    form.classList.add('is-focused');
    /* The answer to "are you signed in?" may still be in flight at boot, and
       telling a member to sign in because their profile had not landed yet is
       worse than a moment's wait. So ask the shared promise, then decide. */
    authReady().then(() => {
      if (askCanPost()) { askClearGuest(); askRefreshState(); }
      else askShowGuest();
    });
  });
  field.addEventListener('blur', () => form.classList.remove('is-focused'));
  field.addEventListener('input', () => {
    if (askMessage) askMessage = null;   // a new line replaces the last verdict
    askRefreshState();
  });
  field.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey) return;
    e.preventDefault();
    askSubmit();
  });
  // Enter in the description submits too; Shift+Enter is a new line there
  descField.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey) return;
    e.preventDefault();
    askSubmit();
  });

  askRefreshState();
}

function renderDiscover() {
  const section = document.querySelector('.discover-section');
  if (section) section.classList.toggle('is-home', HOME_ASK);
  // HOME_ASK false falls through to the banner below, untouched
  if (HOME_ASK) { renderHome(); return; }

  heroIndices = computeDiscoverIndices();
  heroIndex = 0;

  const slidesWrap = document.getElementById('heroSlides');
  slidesWrap.innerHTML = '';
  renderFeedEmpty();

  heroIndices.forEach((index, i) => {
    const data = ALL_CARDS[index];
    const studio = STUDIOS[data.studio];
    const text = cardText(data);
    const timeText = data.justNow ? t().justNow : formatRelativeTime(currentLang, data.timeValue, data.timeUnit);
    const hint = lineageHintFor(data);
    const openQ = isOpenQuestion(data);

    // .is-active is deliberately NOT set here — an element inserted already in
    // its finished state has nothing to transition from, so the first cover
    // would simply appear. It is added on the next frame instead (below).
    const slide = document.createElement('div');
    slide.className = 'hero-slide' + (openQ ? ' is-open-question' : '');
    slide.dataset.index = String(index);
    slide.dataset.studio = data.studio;
    slide.dataset.cardId = data.id;
    slide.innerHTML = `
      <div class="card-media">
        <span class="card-media-icon" style="color:${studio.color}">${ICONS[data.type]}</span>
        <span class="card-media-badge">${ICONS[data.type]}</span>
      </div>
      <div class="card-scrim"></div>
      <div class="card-content">
        <div class="card-meta">
          <span class="card-dot" style="background:${studio.color}"></span>
          <span class="card-studio">${studio.name}</span>
          <!-- in the caption line, not the top-right corner: that corner is
               reserved for the For-you badge, and "DoubleU · 3 days ago" is one
               thought rather than two things at opposite ends of the screen -->
          <span class="card-discover-badges">
            ${data.justNow ? `<span class="card-new-badge">${t().newBadge}</span>` : ''}
            <span class="card-time-badge">${timeText}</span>
          </span>
          ${statusBadgeHTML(data)}
          <span class="card-type">${t().types[data.type]}</span>
        </div>
        <div class="card-title"></div>
        <!-- Only the trace, and only when there is one.
             The keyword chips and the two lineage hint lines that used to be
             here are still on the poster card and in the detail, and that is
             where they belong: a card is read among a dozen others, so it has
             to say what it is about. A cover is not being compared to anything.
             It had a 79px title and then three rows of 12px labels underneath
             repeating in small type what the title had just said in large, and
             the hint line was a quotation cut mid-word — "Came from 'Self-serve
             social asset generator on n8n —...'" — which is not a fact anybody
             can use. The Lineage strip and the detail view both tell that story
             properly. This line stays because it is the one thing the title
             genuinely cannot carry: that the work came from the other studio. -->
        ${exchangeTraceHTML(data)}
      </div>
    `;
    renderHeroTitle(slide.querySelector('.card-title'), text.title);
    applyHeroTone(slide, data);
    slide.addEventListener('click', () => openCard(slide));
    slidesWrap.appendChild(slide);
    applyCardMedia(slide.querySelector('.card-media'), data.image, studio.color, data.imageFocal, { fit: data.imageFit, bg: data.imageBg });
  });

  renderNowStrip();
  renderHeroDots();
  // two frames: one for the closed state to paint, one to release it
  requestAnimationFrame(() => {
    fitAllHeroTitles();
    requestAnimationFrame(() => {
      const first = slidesWrap.querySelector('.hero-slide');
      if (first) first.classList.add('is-active');
      // which slide is active decides the chrome's tone, so say so on the change
      updateChrome();
    });
  });
  startHeroAutoplay();
}

function renderHeroDots() {
  const dotsWrap = document.getElementById('heroDots');
  dotsWrap.innerHTML = '';
  heroIndices.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'hero-dot' + (i === 0 ? ' is-active' : '');
    dot.setAttribute('aria-label', String(i + 1));
    dot.addEventListener('click', (e) => {
      e.stopPropagation();
      goToHeroSlide(i);
    });
    dotsWrap.appendChild(dot);
  });
}

// Jumps straight to a slide (dot click, arrow click, or the next tick of the
// autoplay timer) — no scrolling involved, just swap which slide carries
// .is-active so the CSS opacity transition crossfades between the two.
function goToHeroSlide(i) {
  if (!heroIndices.length) return;
  const n = heroIndices.length;
  heroIndex = ((i % n) + n) % n;
  document.querySelectorAll('#heroSlides .hero-slide').forEach((el, idx) => {
    el.classList.toggle('is-active', idx === heroIndex);
  });
  document.querySelectorAll('#heroDots .hero-dot').forEach((el, idx) => {
    el.classList.toggle('is-active', idx === heroIndex);
  });
  // Each cover has its own brightness, so the marks in the corners are
  // re-coloured for the one that just arrived.
  updateChrome();
}

function startHeroAutoplay() {
  stopHeroAutoplay();
  if (heroIndices.length <= 1) return;
  heroTimer = setInterval(() => goToHeroSlide(heroIndex + 1), CONFIG.HERO_ROTATE_MS);
}

function stopHeroAutoplay() {
  if (heroTimer) { clearInterval(heroTimer); heroTimer = null; }
}

// Arrows navigate on click; autoplay pauses while the pointer is anywhere
// over the hero (matches CONFIG.RESUME_DELAY_MS via pauseAutoScroll/
// scheduleResumeAutoScroll, the same pair openCard/exitShareMode already use).
function initHeroControls() {
  const hero = document.getElementById('discoverHero');
  hero.addEventListener('mouseenter', pauseAutoScroll);
  hero.addEventListener('mouseleave', scheduleResumeAutoScroll);
  document.getElementById('heroPrevBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    goToHeroSlide(heroIndex - 1);
  });
  document.getElementById('heroNextBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    goToHeroSlide(heroIndex + 1);
  });
}

// One poster card's DOM — reuses the exact card-media/card-scrim/card-content
// pieces the Discover hero is built from (see renderDiscover), just at the
// smaller base size those classes were originally sized for; the hero-slide
// overrides are what scale them up, not the other way around.
function buildPosterCard(data, index) {
  const studio = STUDIOS[data.studio];
  const text = cardText(data);
  const timeText = data.justNow ? t().justNow : formatRelativeTime(currentLang, data.timeValue, data.timeUnit);
  const hint = lineageHintFor(data);

  const card = document.createElement('div');
  card.className = 'poster-card is-pre-reveal';
  card.dataset.index = String(index);
  card.dataset.studio = data.studio;
  card.dataset.cardId = data.id;
  card.innerHTML = `
    <div class="card-media">
      <span class="card-media-icon" style="color:${studio.color}">${ICONS[data.type]}</span>
      <span class="card-media-badge">${ICONS[data.type]}</span>
    </div>
    <div class="card-discover-badges">
      ${data.justNow ? `<span class="card-new-badge">${t().newBadge}</span>` : ''}
      <span class="card-time-badge">${timeText}</span>
    </div>
    <div class="card-scrim"></div>
    <div class="card-content">
      <div class="card-meta">
        <span class="card-dot" style="background:${studio.color}"></span>
        <span class="card-studio">${studio.name}</span>
        <span class="card-type">${t().types[data.type]}</span>
      </div>
      <div class="card-title">${text.title}</div>
      ${keywordTagsHTML(data)}
      ${exchangeTraceHTML(data)}
      ${ownCardStatusHTML(data)}
      ${hint ? `<div class="card-lineage-hint">${LINEAGE_ARROW_ICON}${hint}</div>` : ''}
      ${langPendingText(data) ? `<div class="card-lineage-hint">${langPendingText(data)}</div>` : ''}
    </div>
  `;
  card.addEventListener('click', () => openCard(card));
  applyCardMedia(card.querySelector('.card-media'), data.image, studio.color, data.imageFocal, { fit: data.imageFit, bg: data.imageBg });
  return card;
}

// Browse (tier 2) is finished knowledge only — Questions have their own
// tier now (see renderQuestions) and never appear here.
/* Floor 2 is the finished work. Updates are on floor 1 by design — a
   one-line "still fighting the first screen" rendered as a 720px poster next
   to a written-up experiment would flatter neither, and would quietly make
   people stop posting them. */
function browseIndices() {
  return ALL_CARDS.map((_, i) => i)
    .filter((i) => !isOpenQuestion(ALL_CARDS[i]) && !isUpdate(ALL_CARDS[i]));
}

// The track holds the card set twice back-to-back — two identical halves —
// so the auto-scroll/drag loop in initBrowseScroll can wrap the translateX
// by exactly one half-width at any moment with zero visible seam, giving a
// genuinely infinite flow instead of a hard reset or a bounce at the ends.
function renderBrowse() {
  const grid = document.getElementById('browseGrid');
  grid.innerHTML = '';

  const indices = browseIndices();
  const frag = document.createDocumentFragment();
  for (let copy = 0; copy < 2; copy++) {
    indices.forEach((index) => frag.appendChild(buildPosterCard(ALL_CARDS[index], index)));
  }
  grid.appendChild(frag);

  applyBrowseFilters();

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.querySelectorAll('#browseGrid .poster-card.is-pre-reveal').forEach((el, i) => {
        setTimeout(() => el.classList.remove('is-pre-reveal'), Math.min(i % indices.length, 14) * 35);
      });
    });
  });
}

/* ======================================================================
   6. Search + studio/type filters — Browse only (see .poster-card);
      Discover is intentionally untouched by any of this.
   ====================================================================== */
function applyBrowseFilters() {
  const q = searchQuery.trim().toLowerCase();
  let visibleCount = 0;
  document.querySelectorAll('#browseGrid .poster-card').forEach((el) => {
    const index = Number(el.dataset.index);
    const data = ALL_CARDS[index];
    const text = cardText(data);
    const matchesStudio = selectedStudio === 'all' || data.studio === selectedStudio;
    const matchesType = selectedTypeFilter === 'all' || data.type === selectedTypeFilter;
    /* Every text field this card actually has, plus its keywords. It used to
       read text.problem directly, which is undefined on anything written in the
       new field sets — searching with a shared card on screen threw on
       undefined.toLowerCase() and silently stopped filtering. */
    const haystack = [text.title, text.summary]
      .concat(fieldsFor(data.type).map((key) => bodyValue(text, data.type, key)))
      .concat(keywordsOf(data))
      .filter(Boolean)
      .join(' ')
      .toLowerCase();
    const matchesSearch = !q || haystack.includes(q);
    const matchesAuthor = !selectedAuthor || data.author === selectedAuthor;
    const matchesKeyword = !selectedKeyword || cardHasKeyword(data, selectedKeyword);
    const visible = matchesStudio && matchesType && matchesSearch && matchesAuthor && matchesKeyword;
    el.classList.toggle('is-hidden', !visible);
    if (visible) visibleCount++;
  });
  document.getElementById('browseEmpty').style.display = visibleCount > 0 ? 'none' : 'block';
  // recompute now (most filter changes need no transition to settle) and
  // again once any is-hidden width/margin transition has finished, so the
  // loop's wrap point stays true to the row's actual current width throughout.
  recomputeBrowseHalfWidth();
  setTimeout(recomputeBrowseHalfWidth, 400);
}

/* ======================================================================
   5b. Questions (tier 3) — every question-type card, newest first, laid
   out in a plain wrapping grid rather than the Browse poster track: these
   are meant to be read and answered, not skimmed like a gallery.
   ====================================================================== */
/* Newest first, except that anything addressed to your studio jumps the queue.
   A question aimed at you specifically is the one thing on this floor that is
   waiting on *you*; leaving it in date order means it scrolls away behind
   general questions nobody in particular has to answer.

   Resolved questions sink below the rest regardless — they are here as a record
   of what was settled, not as something still needing attention. */
function askedToMe(data) {
  return data.askedTo && data.askedTo !== 'all' && data.askedTo === MY_STUDIO_KEY;
}

/* Open questions first (yours before everyone's), then answered ones — the
   other studio has replied but nobody has marked it settled — and resolved
   last, as the record of what was closed. */
function questionSortRank(data) {
  const state = questionState(data);
  if (state === 'resolved') return 3;
  if (state === 'answered') return 2;
  return askedToMe(data) ? 0 : 1;
}

function questionIndices() {
  return ALL_CARDS
    .map((_, i) => i)
    .filter((i) => isOpenQuestion(ALL_CARDS[i]))
    .filter((i) => !selectedAuthor || ALL_CARDS[i].author === selectedAuthor)
    .filter((i) => !selectedKeyword || cardHasKeyword(ALL_CARDS[i], selectedKeyword))
    .sort((a, b) => {
      const rank = questionSortRank(ALL_CARDS[a]) - questionSortRank(ALL_CARDS[b]);
      if (rank !== 0) return rank;
      return daysAgoOf(ALL_CARDS[a]) - daysAgoOf(ALL_CARDS[b]);
    });
}

/* Who a question was addressed to, when that is anyone in particular. Silent
   for questions asked of everyone — "asked to everyone" on every card is a
   label that says nothing. */
function askedToBadgeHTML(data) {
  if (!data.askedTo || data.askedTo === 'all') return '';
  const mine = askedToMe(data);
  // "Needs DoubleU's perspective" rather than "Asked to your studio": the
  // first is a job, the second is a filing category.
  const label = mine
    ? t().needsYou.badge(STUDIOS[MY_STUDIO_KEY].name)
    : t().askedTo.addressed(STUDIOS[data.askedTo].name);
  return `<div class="asked-to-badge${mine ? ' is-mine' : ''}">${label}</div>`;
}

function buildQuestionCard(data, index) {
  const studio = STUDIOS[data.studio];
  const text = cardText(data);
  const timeText = data.justNow ? t().justNow : formatRelativeTime(currentLang, data.timeValue, data.timeUnit);
  const activityHint = questionActivityHint(data);

  const card = document.createElement('div');
  card.className = 'question-card is-pre-reveal';
  card.dataset.index = String(index);
  card.dataset.studio = data.studio;
  card.dataset.cardId = data.id;
  card.innerHTML = `
    <div>
      <div class="question-card-meta">
        <span class="card-dot" style="background:${studio.color}"></span>
        <span class="question-card-studio">${studio.name}</span>
        ${statusBadgeHTML(data)}
        <span class="question-card-time">${timeText}</span>
      </div>
      <div class="question-card-title">${text.title}</div>
      ${keywordTagsHTML(data)}
      ${exchangeTraceHTML(data)}
      ${askedToBadgeHTML(data)}
      ${activityHint ? `<div class="question-card-activity">${escapeHtml(activityHint)}</div>` : ''}
      ${langPendingBadgeHTML(data)}
    </div>
