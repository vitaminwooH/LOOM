    if (openKey) openThreadStory(openKey);
  }
}

/* ======================================================================
   9. Share mode — the gallery area (not a separate page) swaps into a
   compose form, then a small in-place "weave" moment, then back to the
   card flow. Ported from what used to be the standalone loom_share.html;
   living in this same document is what fixes the old language reset (the
   language switcher's state was simply never shared across pages) and
   keeps the "browsing -> contributing" moment from ever leaving the feed.
   ====================================================================== */
let isShareMode = false;
let selectedType = 'project';
// Questions only. 'all' is a real answer — "I don't know who knows this" — not
// the absence of one, which is why it is a pill like the others rather than a
// blank default.
let selectedAskedTo = 'all';

function renderTypePicker() {
  const wrap = document.getElementById('typePicker');
  // Update first: it is the one most people should be reaching for, and the
  // order of a row of pills is a recommendation whether you mean it or not.
  ['update', 'project', 'experiment', 'question'].forEach((key) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'type-pill' + (key === selectedType ? ' is-active' : '');
    btn.dataset.type = key;
    btn.innerHTML = `${ICONS[key]}<span class="type-pill-label">${t().types[key]}</span>`;
    btn.addEventListener('click', () => setComposeType(key));
    wrap.appendChild(btn);
  });
  renderAskedToPicker();
  renderComposeFields();
}

/* One draft per type, held for as long as the composer is open.

   Carrying values across by field name was not enough: the types barely share
   any names, so writing three paragraphs as a Project and then trying Update
   to see what it looked like threw all three away — and switching back gave you
   an empty form, because there was nothing left to switch back to.

   So each type keeps its own answers, and coming back to one restores it.
   The title is deliberately NOT in here: it is the same sentence whatever you
   decide the thing is, and retyping it after changing your mind is the same
   annoyance in miniature. (An Update has no title field at all — see
   updateComposeChrome — so it simply ignores the shared one.) */
const composeDrafts = {};

function stashCurrentDraft() {
  composeDrafts[selectedType] = readComposeFields();
}

function setComposeType(key) {
  if (key === selectedType) return;
  stashCurrentDraft();
  selectedType = key;
  document.querySelectorAll('#typePicker .type-pill').forEach((b) =>
    b.classList.toggle('is-active', b.dataset.type === selectedType));
  renderComposeFields(composeDrafts[key]);
  updateComposeChrome();
  updateSubmitGate();
  refreshImageThumb();
}

function renderAskedToPicker() {
  const wrap = document.getElementById('askedToPicker');
  wrap.innerHTML = '';
  const s = t().askedTo;
  const options = [{ key: 'all', label: s.everyone, color: null }].concat(
    enabledStudioKeys().map((k) => ({
      key: k,
      label: [s.studioPrefix, STUDIOS[k].name].filter(Boolean).join(' '),
      color: STUDIOS[k].color,
    })));

  options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'asked-to-pill' + (opt.key === selectedAskedTo ? ' is-active' : '');
    btn.dataset.value = opt.key;
    if (opt.color) {
      const dot = document.createElement('span');
      dot.className = 'card-dot';
      dot.style.background = opt.color;
      btn.appendChild(dot);
    }
    btn.appendChild(document.createTextNode(opt.label));
    btn.addEventListener('click', () => {
      selectedAskedTo = opt.key;
      wrap.querySelectorAll('.asked-to-pill').forEach((b) =>
        b.classList.toggle('is-active', b.dataset.value === selectedAskedTo));
    });
    wrap.appendChild(btn);
  });
}

/* ======================================================================
   Keywords, in the composer
   ----------------------------------------------------------------------
   Free text with suggestions, not a fixed vocabulary. Typing filters what
   already exists (substring, case-folded) and offers to create what does not,
   so the cheap path is reuse and the possible path is invention — which is the
   right way round for a vocabulary that has to grow without a librarian.

   Reuse is nudged rather than enforced: picking an existing keyword adopts its
   spelling, so "slack pipeline" typed into the box becomes "Slack pipeline" on
   the card and the two never split into a pair of near-identical threads.
   ====================================================================== */
let composeKeywords = [];       // display labels, in the order they were added
let keywordSuggestionIndex = -1; // which suggestion the arrow keys are on

function composeKeywordsFull() {
  return composeKeywords.length >= MAX_KEYWORDS_PER_CARD;
}

function hasComposeKeyword(word) {
  const key = keywordKey(word);
  return composeKeywords.some((k) => keywordKey(k) === key);
}

/* Adopts the existing spelling when there is one — see canonicalKeyword. The
   word the reader typed only wins if nobody has used it before. */
function addComposeKeyword(word) {
  const label = canonicalKeyword(word);
  if (!label || hasComposeKeyword(label) || composeKeywordsFull()) return false;
  composeKeywords.push(label);
  renderComposeKeywords();
  refreshImageThumb();
  return true;
}

function removeComposeKeyword(word) {
  const key = keywordKey(word);
  composeKeywords = composeKeywords.filter((k) => keywordKey(k) !== key);
  renderComposeKeywords();
  refreshImageThumb();
}

const KEYWORD_REMOVE_ICON = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>';

function renderComposeKeywords() {
  const chips = document.getElementById('keywordChips');
  const wrap = document.getElementById('keywordInputWrap');
  const input = document.getElementById('keywordInput');
  const hint = document.getElementById('keywordHint');
  if (!chips) return;

  chips.innerHTML = '';
  composeKeywords.forEach((label) => {
    const chip = document.createElement('span');
    chip.className = 'keyword-chip';
    const text = document.createElement('span');
    text.textContent = label;
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'keyword-chip-remove';
    remove.setAttribute('aria-label', t().share.keywordsRemove + ': ' + label);
    remove.title = t().share.keywordsRemove;
    remove.innerHTML = KEYWORD_REMOVE_ICON;
    remove.addEventListener('click', () => removeComposeKeyword(label));
    chip.appendChild(text);
    chip.appendChild(remove);
    chips.appendChild(chip);
  });

  const full = composeKeywordsFull();
  wrap.classList.toggle('is-full', full);
  // taking or dropping a chip changes what is worth offering
  renderKeywordOffers();
  // The placeholder is the field's whole instruction, so it only belongs there
  // while the field is empty — next to two chips it reads as a third one.
  input.placeholder = composeKeywords.length ? '' : t().share.keywordsPlaceholder;
  hint.textContent = full ? t().share.keywordsFull : t().share.keywordsHint;
  if (full) closeKeywordSuggestions();
}

/* ---- keywords the writing already contains ----
   Everything typed into this form, plus the names of anything attached, matched
   against the keywords other cards are already using. Case-folded, substring —
   so "our Slack pipeline finally works" offers "Slack pipeline", and a file
   called whow-n8n-architecture.pdf offers nothing unless somebody has coined a
   keyword that appears in it.

   Only existing keywords are offered, never invented ones. The point is to make
   the cheap thing — reusing a word a colleague already chose — the thing that
   happens by default, because that is what puts two studios in one thread. A
   suggestion engine that invented new keywords would do the opposite.

   TODO(server): replace with AI keyword extraction. A model reading the body and
   the attached document can propose keywords that are not literally present in
   the text — which is most of the useful ones — and can say why. That needs the
   document contents and a model call, so it belongs on the server next to the
   write path, not in a substring match in the browser. Everything below is the
   honest version of that until it exists: it only claims to spot words that are
   demonstrably there. */
function composeTextForSuggestions() {
  const parts = [];
  const title = document.getElementById('titleInput');
  if (title) parts.push(title.value || '');
  document.querySelectorAll('#composeFields textarea').forEach((t) => parts.push(t.value || ''));
  // Attachment names are usually the most keyword-dense text in the whole form.
  // Punctuation out, so "slack-pipeline_v2.pdf" reads as words.
  attachedFiles.forEach((f) => parts.push(String(f.name || '').replace(/[._\-/\\]+/g, ' ')));
  return parts.join('  ').toLowerCase();
}

function suggestedKeywords() {
  const hay = composeTextForSuggestions();
  if (hay.trim().length < 3) return [];
  const taken = composeKeywords.map(keywordKey);
  return allKeywords()
    .filter((k) => taken.indexOf(k.key) < 0)
    .filter((k) => hay.indexOf(k.key) > -1)
    .slice(0, 4)
    .map((k) => k.label);
}

function renderKeywordOffers() {
  const row = document.getElementById('keywordSuggest');
  const chips = document.getElementById('keywordSuggestChips');
  if (!row || !chips) return;

  // At the cap there is nothing to offer, whatever the text says.
  const words = composeKeywordsFull() ? [] : suggestedKeywords();
  if (!words.length) { row.style.display = 'none'; chips.innerHTML = ''; return; }

  document.getElementById('keywordSuggestLabel').textContent = t().share.keywordsSuggest;
  chips.innerHTML = '';
  words.forEach((label) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'keyword-suggest-chip';
    btn.textContent = label;
    btn.addEventListener('click', () => {
      addComposeKeyword(label);
      renderKeywordOffers(); // it is a chip now, so it stops being an offer
    });
    chips.appendChild(btn);
  });
  row.style.display = '';
}

function closeKeywordSuggestions() {
  const box = document.getElementById('keywordSuggestions');
  if (!box) return;
  box.classList.remove('is-open');
  box.innerHTML = '';
  keywordSuggestionIndex = -1;
  const input = document.getElementById('keywordInput');
  if (input) input.setAttribute('aria-expanded', 'false');
}

/* What the box offers for what has been typed: existing keywords whose label
   contains the query, then — unless the query already is one of them — the
   option to create it. An empty query still lists the vocabulary, because
   "what do we already call this?" is the question the field is really asking. */
function keywordSuggestionsFor(query) {
  const q = keywordKey(query);
  const taken = composeKeywords.map(keywordKey);
  const existing = allKeywords()
    .filter((k) => taken.indexOf(k.key) < 0)
    .filter((k) => !q || k.key.indexOf(q) > -1)
    .slice(0, 8)
    .map((k) => ({ kind: 'existing', label: k.label, count: k.count }));
  const exact = q && allKeywords().some((k) => k.key === q);
  const out = existing.slice();
  if (q && !exact && taken.indexOf(q) < 0) {
    out.push({ kind: 'new', label: keywordLabel(query) });
  }
  return out;
}

function renderKeywordSuggestions() {
  const box = document.getElementById('keywordSuggestions');
  const input = document.getElementById('keywordInput');
  if (!box || !input) return;
  if (composeKeywordsFull()) { closeKeywordSuggestions(); return; }

  const items = keywordSuggestionsFor(input.value);
  box.innerHTML = '';
  if (!items.length) { closeKeywordSuggestions(); return; }

  const existingCount = items.filter((i) => i.kind === 'existing').length;
  if (existingCount) {
    const head = document.createElement('div');
    head.className = 'keyword-suggestion-head';
    head.textContent = t().share.keywordsExisting;
    box.appendChild(head);
  }

  items.forEach((item, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'keyword-suggestion' + (item.kind === 'new' ? ' is-new' : '')
      + (i === keywordSuggestionIndex ? ' is-active' : '');
    btn.setAttribute('role', 'option');
    btn.dataset.keyword = item.label;
    const label = document.createElement('span');
    label.textContent = item.kind === 'new' ? t().share.keywordsCreate(item.label) : item.label;
    btn.appendChild(label);
    if (item.kind === 'existing') {
      const count = document.createElement('span');
      count.className = 'keyword-suggestion-count';
      count.textContent = item.count;
      btn.appendChild(count);
    }
    // mousedown, not click: the input's blur would close the box before a
    // click ever landed on it.
    btn.addEventListener('mousedown', (e) => {
      e.preventDefault();
      commitKeywordFromInput(item.label);
    });
    box.appendChild(btn);
  });

  box.classList.add('is-open');
  input.setAttribute('aria-expanded', 'true');
}

function commitKeywordFromInput(word) {
  const input = document.getElementById('keywordInput');
  const value = word !== undefined ? word : input.value;
  if (!keywordKey(value)) return;
  addComposeKeyword(value);
  input.value = '';
  keywordSuggestionIndex = -1;
  if (composeKeywordsFull()) { closeKeywordSuggestions(); input.blur(); }
  else { renderKeywordSuggestions(); input.focus(); }
}

function initKeywordInput() {
  const input = document.getElementById('keywordInput');
  const wrap = document.getElementById('keywordInputWrap');
  if (!input) return;

  input.addEventListener('input', () => { keywordSuggestionIndex = -1; renderKeywordSuggestions(); });
  input.addEventListener('focus', renderKeywordSuggestions);
  // A tick, so a mousedown on a suggestion is handled before the box goes.
  input.addEventListener('blur', () => setTimeout(closeKeywordSuggestions, 120));

  input.addEventListener('keydown', (e) => {
    const box = document.getElementById('keywordSuggestions');
    const options = Array.from(box.querySelectorAll('.keyword-suggestion'));

    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!options.length) return;
      e.preventDefault();
      const step = e.key === 'ArrowDown' ? 1 : -1;
      keywordSuggestionIndex = (keywordSuggestionIndex + step + options.length) % options.length;
      renderKeywordSuggestions();
      return;
    }
    // Enter takes the highlighted suggestion when there is one, and otherwise
    // whatever has been typed. Comma is the other way people end a tag.
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      const picked = keywordSuggestionIndex > -1 && options[keywordSuggestionIndex];
      commitKeywordFromInput(picked ? picked.dataset.keyword : undefined);
      return;
    }
    if (e.key === 'Escape') { closeKeywordSuggestions(); return; }
    // Backspace on an empty box takes the last chip — the same gesture every
    // tag field has, and the reason the chips live inside the input's border.
    if (e.key === 'Backspace' && !input.value && composeKeywords.length) {
      removeComposeKeyword(composeKeywords[composeKeywords.length - 1]);
    }
  });

  // Clicking the padding of the box is clicking the field.
  wrap.addEventListener('mousedown', (e) => {
    if (e.target === wrap || e.target.id === 'keywordChips') {
      e.preventDefault();
      if (!composeKeywordsFull()) input.focus();
    }
  });
}

/* ---- how much the form asks for up front ----
   Every type's full question set is in FIELD_SETS, and every one of those
   questions is worth answering. What was wrong was showing all of them at once:
   a Project opened as four empty boxes, which reads as an evening's work, and
   the write-up that needs an evening is the one that never gets written.

   So each type names the box it genuinely cannot do without, and the rest sit
   behind "Add more context" — one click, same fields, nothing removed. */
const PRIMARY_FIELDS = {
  update: ['note'],
  project: ['made'],
  experiment: ['goal', 'happened'],
  question: ['blocked'],
};

function primaryFieldsFor(type) {
  const all = fieldsFor(type);
  const primary = (PRIMARY_FIELDS[type] || []).filter((k) => all.indexOf(k) >= 0);
  return primary.length ? primary : all.slice(0, 1);
}

function extraFieldsFor(type) {
  const primary = primaryFieldsFor(type);
  return fieldsFor(type).filter((k) => primary.indexOf(k) < 0);
}

// Sticky per compose session, not per type: someone who opened the extra
// fields once is someone who writes them, and re-collapsing on every type
// switch would hide what they had already typed.
let composeExtraOpen = false;

const CHEVRON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

/* The body fields, as the chosen type asks them. `carried` is an optional
   {key: value} map from a previous type, so a field both types share keeps
   what was in it. */
function renderComposeFields(carried) {
  const wrap = document.getElementById('composeFields');
  wrap.innerHTML = '';
  wrap.classList.remove('has-hidden-extras');

  const buildField = (key) => {
    const strings = fieldStrings(selectedType, key);

    const field = document.createElement('div');
    field.className = 'field';

    const label = document.createElement('div');
    label.className = 'field-label';
    label.textContent = strings.label;

    const area = document.createElement('textarea');
    area.id = 'field_' + key;
    area.dataset.fieldKey = key;
    area.placeholder = strings.placeholder;
    if (carried && carried[key]) area.value = carried[key];

    field.appendChild(label);
    field.appendChild(area);
    return field;
  };

  primaryFieldsFor(selectedType).forEach((key) => wrap.appendChild(buildField(key)));

  const extras = extraFieldsFor(selectedType);
  if (!extras.length) return;

  // Carrying text into a hidden box would lose it in front of the person who
  // typed it, so anything already written forces the section open.
  if (carried && extras.some((k) => (carried[k] || '').trim())) composeExtraOpen = true;

  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'compose-more' + (composeExtraOpen ? ' is-open' : '');
  toggle.innerHTML = `<span class="compose-more-label"></span>${CHEVRON_ICON}`;

  const box = document.createElement('div');
  box.className = 'compose-extra-fields' + (composeExtraOpen ? ' is-open' : '');
  extras.forEach((key) => box.appendChild(buildField(key)));

  const paint = () => {
    toggle.querySelector('.compose-more-label').textContent =
      composeExtraOpen ? t().share.lessContext : t().share.moreContext(extras.length);
    toggle.classList.toggle('is-open', composeExtraOpen);
    box.classList.toggle('is-open', composeExtraOpen);
    // Tells the CSS whether the visible boxes should share the column's height
    // or stay the size of the question they are asking.
    wrap.classList.toggle('has-hidden-extras', !composeExtraOpen);
  };
  paint();

  toggle.addEventListener('click', () => {
    composeExtraOpen = !composeExtraOpen;
    paint();
    if (composeExtraOpen) {
      const first = box.querySelector('textarea');
      if (first) first.focus();
    }
  });

  wrap.appendChild(toggle);
  wrap.appendChild(box);
}

// Everything currently typed, keyed by field name.
function readComposeFields() {
  const out = {};
  document.querySelectorAll('#composeFields textarea').forEach((el) => {
    out[el.dataset.fieldKey] = el.value;
  });
  return out;
}

// Which parts of the form the chosen type actually uses.
/* Which parts of the form the chosen type actually uses. An Update hides the
   title (its one line is its title) and shows a link box instead — the two
   things people actually want to attach to "here is what we are doing" are a
   picture of it and somewhere to look. */
function updateComposeChrome() {
  const update = selectedType === 'update';
  document.getElementById('askedToField').style.display = selectedType === 'question' ? '' : 'none';
  document.getElementById('titleField').style.display = update ? 'none' : '';
  document.getElementById('linkField').style.display = update ? '' : 'none';
  document.getElementById('stepCompose').classList.toggle('is-update', update);
  refreshComposeCopy();
}

/* The heading and the intro change with the type, because "Share what you
   learned" over a one-line box is asking for the wrong thing — and the whole
   point of this type is that the copy has to give people permission to post
   something unfinished. */
function refreshComposeCopy() {
  if (editingCardId) return; // an edit keeps its own wording (applyEditModeLabels)
  const s = t().share;
  // t().updateMode, not t().share.updateMode — this copy is about the type, not
  // about the Share screen, and it sits with the rest of the Update strings.
  const copy = selectedType === 'update' ? t().updateMode : s;
  const setText = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  setText('submitBtnLabel', copy.submitButton);
  // How much work this actually is, per type. One promise across a one-line box
  // and a four-paragraph write-up was wrong about at least one of them.
  const byType = s.submitHintByType || {};
  setText('composeHintLabel', byType[selectedType] || copy.submitHint);
}

// The composed card's image, if any — a data: URL (not a blob: object URL)
// specifically so it survives JSON.stringify into localStorage and still
// resolves after a page reload; blob URLs are only valid for the document
// that created them. No real upload happens anywhere — this is the whole
// pipeline for a prototype with no backend.
let selectedImageUrl = null;
let selectedImageName = '';
/* Where the image sits inside its frame, as an object-position pair, set by
   dragging the preview. Stored on the card so the poster, the cover banner and
   the detail all crop it the same way the author chose — a face centred in the
   preview that slides out of frame on the banner is worse than no control at
   all. */
let selectedImageFocal = { x: 50, y: 50 };

// No thumbnail: the picture is the whole background of the preview card just
// above this, so all this slot has to say is which file is loaded.
/* The one place that reflects "there is an image now" into the form: the file
   name row, the add button, and the thumbnail. */
function setUploadPreview(url, fileName) {
  const chosen = document.getElementById('imageChosen');
  const nameEl = document.getElementById('imageFileName');
  const zone = document.getElementById('uploadZone');
  if (chosen) chosen.style.display = url ? 'flex' : 'none';
  if (nameEl) nameEl.textContent = fileName || selectedImageName || '';
  // the "add one" button steps aside once there is something to replace
  if (zone) zone.style.display = url ? 'none' : '';
  refreshImageThumb();
}

/* Downscale before anything else touches the file. Two hard limits make this
   mandatory rather than an optimisation, and a straight FileReader data: URL
   of a real photo blows through both:
     - localStorage tops out around 5MB per origin, so an unresized upload
       either fails to persist or evicts everything else that was there;
     - the CSSOM silently drops custom-property values past a certain length,
       which is what left cards rendering as blank white boxes (the card art
       is a `--card-img` background, see applyCardMedia).
   1400px on the long edge is well past what a poster card or the hero banner
   can actually show, and JPEG at 0.82 puts a typical photo around 200-350KB. */
/* 1400px / 0.82 put a typical photo at 200-350KB. Three or four of those and a
   ~5MB origin budget is gone, which is what makes cards quietly disappear on
   reload. 1000px is still more than the banner can resolve at any realistic
   window size, and 0.7 roughly halves the byte count for a difference you have
   to go looking for on a photograph. Base64 inflates whatever comes out by a
   further ~33%, so the number that matters is the encoded string length, not
   the pixel count. */
const IMAGE_MAX_DIM = 1000;
const IMAGE_JPEG_QUALITY = 0.7;
const IMAGE_SECOND_PASS_BYTES = 600000; // still heavy after pass one -> re-encode harder
const IMAGE_SECOND_PASS_QUALITY = 0.6;

// maxDim/quality are per-caller: a card's hero art and a roster thumbnail
// have very different budgets (see DESIGNER_PHOTO_MAX_DIM).
function resizeImageToDataUrl(file, maxDim, quality) {
  const limit = maxDim || IMAGE_MAX_DIM;
  const q = quality || IMAGE_JPEG_QUALITY;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('could not read the file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('could not decode the image'));
      img.onload = () => {
        const longest = Math.max(img.naturalWidth, img.naturalHeight) || 1;
        const scale = Math.min(1, limit / longest);
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        // JPEG has no alpha channel — flatten onto white first, or a
        // transparent PNG comes back with a black background.
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);

        let out = canvas.toDataURL('image/jpeg', q);
        if (out.length > IMAGE_SECOND_PASS_BYTES) {
          out = canvas.toDataURL('image/jpeg', IMAGE_SECOND_PASS_QUALITY);
        }
        resolve(out);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function handleImageFile(file) {
  if (!file || !file.type || !file.type.startsWith('image/')) return;
  resizeImageToDataUrl(file).then((dataUrl) => {
    selectedImageUrl = dataUrl;
    selectedImageName = file.name || '';
    selectedImageFocal = { x: 50, y: 50 }; // a new picture starts centred
    setUploadPreview(selectedImageUrl, selectedImageName);
    refreshImageThumb();
  }).catch((err) => {
    // A failed read/decode (corrupt file, unsupported format) shouldn't leave
    // the zone stuck looking however it happened to look mid-attempt.
    console.error('[Loom feed] could not process the image:', err);
    selectedImageUrl = null;
    setUploadPreview(null);
    showToast(t().share.imageFailed);
  });
}

/* The image slot is two states of one small control: a pick button, or the
   name of the file you picked with an ✕ next to it. There is no thumbnail and
   no Replace — removing puts the pick button straight back, which is the same
   two clicks Replace was, with one less thing on screen. Drops land anywhere on
   the slot, in either state. */
function initUploadStub() {
  const slot = document.getElementById('imageSlot');
  const pickBtn = document.getElementById('uploadZone');
  const fileInput = document.getElementById('imageFileInput');

  pickBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    handleImageFile(fileInput.files && fileInput.files[0]);
    fileInput.value = ''; // so choosing the same file again still fires 'change'
  });

  slot.addEventListener('dragover', (e) => {
    e.preventDefault(); // required for 'drop' to fire at all
    slot.classList.add('is-dragover');
  });
  slot.addEventListener('dragleave', () => slot.classList.remove('is-dragover'));
  slot.addEventListener('drop', (e) => {
    e.preventDefault();
    slot.classList.remove('is-dragover');
    handleImageFile(e.dataTransfer.files && e.dataTransfer.files[0]);
  });

  document.getElementById('uploadRemoveBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    selectedImageUrl = null;
    selectedImageName = '';
    selectedImageFocal = { x: 50, y: 50 };
    setUploadPreview(null);
    refreshImageThumb();
  });
}

/* ======================================================================
   9b. Attachments (item 8) — separate from the image, mainly for PDFs. No
   real server upload in this prototype: each file is read as a data: URL
   (same reasoning as selectedImageUrl above) so "open in browser" and
   surviving a reload both just work with zero backend.
   ====================================================================== */
let attachedFiles = []; // [{ name, size, dataUrl }]

function formatFileSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

const ATTACHMENT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l4 4v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M15 3v4h4"/></svg>`;
const ATTACHMENT_REMOVE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;

function renderAttachmentList() {
  // a file name is text too - see composeTextForSuggestions
  renderKeywordOffers();
  const wrap = document.getElementById('attachmentList');
  wrap.innerHTML = '';
  attachedFiles.forEach((file, index) => {
    const row = document.createElement('div');
    row.className = 'attachment-item';
    row.innerHTML = `
      <span class="attachment-item-icon">${ATTACHMENT_ICON}</span>
      <span class="attachment-item-info">
        <div class="attachment-item-name">${file.name}</div>
        <div class="attachment-item-size">${formatFileSize(file.size)}</div>
      </span>
      <button type="button" class="attachment-item-remove" aria-label="Remove">${ATTACHMENT_REMOVE_ICON}</button>
    `;
    row.querySelector('.attachment-item-remove').addEventListener('click', () => {
      attachedFiles.splice(index, 1);
      renderAttachmentList();
    });
    wrap.appendChild(row);
  });
}

function handleAttachmentFiles(fileList) {
  Array.from(fileList || []).forEach((file) => {
    const reader = new FileReader();
    reader.onload = () => {
      attachedFiles.push({ name: file.name, size: file.size, dataUrl: reader.result });
      renderAttachmentList();
    };
    reader.readAsDataURL(file);
  });
}

function initAttachmentUpload() {
  const zone = document.getElementById('attachmentZone');
  const fileInput = document.getElementById('attachmentFileInput');

  // the button, not the whole slot — the slot also holds the file list, and
  // clicking a listed file's remove button should not reopen the picker
  document.getElementById('attachmentPickBtn').addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    handleAttachmentFiles(fileInput.files);
    fileInput.value = '';
  });

  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('is-dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('is-dragover'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('is-dragover');
    handleAttachmentFiles(e.dataTransfer.files);
  });
}

// A card's own attachments, shown in its detail view (normal or Question) as
// plain openable links — "open in browser" via the data: URL, no server
// involved, same reasoning as everywhere else images/files are handled here.
function renderAttachmentsInto(wrapEl, data) {
  wrapEl.innerHTML = '';
  (data.attachments || []).forEach((file) => {
    /* Two kinds of attachment, and the difference is where the bytes are.

       An upload carries `dataUrl` — the whole file, base64, in localStorage.
       A seed card carries `path` — a file committed under assets/. Both open in
       a new tab and neither needs the other's machinery.

       A `path` that is not there yet gets a row that is not a link: the name and
       a quiet note instead of an anchor to a 404. The alternative — rendering
       the link anyway — means the one attachment somebody actually clicks in a
       demo is the one that breaks. */
    const href = file.dataUrl || file.path;
    const a = document.createElement(href ? 'a' : 'div');
    a.className = 'attachment-link' + (href ? '' : ' is-unavailable');
    if (href) {
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener';
      // Only an upload is a download; a path should just open.
      if (file.dataUrl) a.download = file.name;
    }
    /* A path is checked before it is offered, the same way a card's image is
       (see applyCardMedia). The row starts as a link and steps down to plain
       text if the file is not committed yet — offering a link to a 404 means
       the one attachment somebody clicks in a demo is the one that breaks, and
       these paths are deliberately wired up before the PDFs land. */
    if (file.path && !file.dataUrl) {
      fetch(file.path, { method: 'HEAD' })
        .then((res) => { if (!res.ok) throw new Error(String(res.status)); })
        .catch(() => {
          a.classList.add('is-unavailable');
          a.removeAttribute('href');
          const sizeEl = a.querySelector('.attachment-item-size');
          if (sizeEl && !sizeEl.textContent.trim()) sizeEl.textContent = t().share.attachmentPending;
        });
    }
    const size = typeof file.size === 'number' ? formatFileSize(file.size)
      : (file.note || '');
    a.innerHTML = `
      <span class="attachment-item-icon">${ATTACHMENT_ICON}</span>
      <span class="attachment-item-info">
        <div class="attachment-item-name">${escapeHtml(file.name || '')}</div>
        <div class="attachment-item-size">${escapeHtml(size)}</div>
      </span>
    `;
    wrapEl.appendChild(a);
  });
}

/* A title is the whole gate: it is the one thing every card needs and the one
   thing no field set can be missing. Bound on the container rather than the
   input itself, because the body fields are torn down and rebuilt whenever the
   type or the language changes and a listener on a replaced element goes with
   it. */
/* ======================================================================
   The image, and how it is framed
   ----------------------------------------------------------------------
   What used to be here was a live preview: a working replica of a poster card
   in the right-hand third of the composer, showing the title, the type, the
   studio and whichever field the caret was in.

   It is gone, and the form has the width back. The preview answered "how will
   this read on a card" with a smaller, worse copy of the text you were already
   looking at two inches to the left, and it charged two thirds of a column and
   most of the visual weight for the answer. Writing is the job on this screen.

   What survived is the part it was genuinely needed for: a picture has to be
   framed, because a 16:9 photograph in a tall card is mostly crop. That control
   moved onto the thumbnail in the Image slot, so the gesture now happens on the
   picture itself rather than on a mock-up of a card containing it.
   ====================================================================== */

/* Paints the chosen image into the thumbnail and shows or hides it. Named for
   what it does now — there is no preview left to refresh. */
function refreshImageThumb() {
  const thumb = document.getElementById('imageThumb');
  const media = document.getElementById('previewMedia');
  if (!thumb || !media) return;

  thumb.style.display = selectedImageUrl ? '' : 'none';
  if (!selectedImageUrl) {
    media.classList.remove('has-image', 'has-image-draggable');
    media.style.removeProperty('--card-img');
    return;
  }
  applyCardMedia(media, selectedImageUrl, STUDIOS[MY_STUDIO_KEY].color, selectedImageFocal);
  media.classList.add('has-image-draggable');
  const hint = document.getElementById('previewDragHint');
  if (hint) hint.textContent = t().share.imageDragHint;
}

function initPreviewImageDrag() {
  const media = document.getElementById('previewMedia');
  const slot = document.getElementById('imageThumb');
  if (!media || !slot) return;

  let dragging = false;
  let moved = false;
  let startX = 0, startY = 0, startPos = null;

  media.addEventListener('pointerdown', (e) => {
    if (!selectedImageUrl) return; // nothing to reposition; the click opens the picker
    dragging = true;
    moved = false;
    startX = e.clientX;
    startY = e.clientY;
    startPos = Object.assign({}, selectedImageFocal);
    media.setPointerCapture(e.pointerId);
    media.classList.add('is-dragging');
  });

  media.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const r = media.getBoundingClientRect();
    // 1:1 against the frame: dragging halfway across the box moves the crop
    // halfway across its travel, which is the only mapping that feels like
    // moving the picture rather than nudging a slider.
    const dx = ((e.clientX - startX) / Math.max(1, r.width)) * 100;
    const dy = ((e.clientY - startY) / Math.max(1, r.height)) * 100;
    if (Math.abs(e.clientX - startX) > 3 || Math.abs(e.clientY - startY) > 3) moved = true;
    selectedImageFocal = {
      x: Math.max(0, Math.min(100, startPos.x - dx)),
      y: Math.max(0, Math.min(100, startPos.y - dy)),
    };
    media.style.backgroundPosition = focalPointCss(selectedImageFocal);
  });

  const end = (e) => {
    if (!dragging) return;
    dragging = false;
    media.classList.remove('is-dragging');
    if (e.pointerId !== undefined && media.hasPointerCapture(e.pointerId)) {
      media.releasePointerCapture(e.pointerId);
    }
    // A reposition drag ends with a click on the same surface, and that surface
    // also opens the file picker. Without this, every nudge popped the picker.
    if (moved) {
      slot.dataset.justRepositioned = '1';
      setTimeout(() => { delete slot.dataset.justRepositioned; }, 0);
    }
  };
  media.addEventListener('pointerup', end);
  media.addEventListener('pointercancel', end);
}

/* The preview frame is the other way in for an image, and the obvious one: it
   is the thing on screen that looks like where a picture goes. The button under
   it stays — some people go looking for a button — and both call the same
   handleImageFile, so whichever you use the result is identical. */
function initPreviewImageInput() {
  // The thumbnail replaces the picture; the whole slot stays the drop target, so
  // a file can be dropped before there is any thumbnail to drop it on.
  const slot = document.getElementById('imageThumb');
  const dropZone = document.getElementById('imageSlot');
  const fileInput = document.getElementById('imageFileInput');
  if (!slot || !dropZone || !fileInput) return;

  const open = () => {
    if (slot.dataset.justRepositioned) return;
    fileInput.click();
  };
  slot.addEventListener('click', open);
  slot.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });

  // dragenter/dragleave fire for children too, so count depth rather than
  // toggling on every crossing — otherwise the outline flickers off the moment
  // the pointer passes over the label inside the frame.
  let depth = 0;
  dropZone.addEventListener('dragenter', (e) => { e.preventDefault(); depth += 1; dropZone.classList.add('is-dropping'); });
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
  dropZone.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) dropZone.classList.remove('is-dropping'); });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    depth = 0;
    dropZone.classList.remove('is-dropping');
    handleImageFile(e.dataTransfer.files && e.dataTransfer.files[0]);
  });
}

function initSubmitGate() {
  const step = document.getElementById('stepCompose');
  step.addEventListener('input', updateSubmitGate);
  /* Delegated, so it covers the title, every body field, and any field the type
     switch builds later — none of which exist yet when this runs. */
  step.addEventListener('input', renderKeywordOffers);
  const title = document.getElementById('titleInput');
  // the title is always shown, so focusing it leaves the body panel on
  // whatever field was last edited rather than blanking it
}

/* An Update has no title, so the gate is its one line instead. Same rule
   either way: there has to be something to read. */
function updateSubmitGate() {
  const value = selectedType === 'update'
    ? (document.getElementById('field_note') || {}).value
    : (document.getElementById('titleInput') || {}).value;
  document.getElementById('submitBtn').disabled = !value || value.trim().length === 0;
}

// An Update's one line is its title, its summary and its body at once.
function composeTitle(body) {
  if (selectedType === 'update') return truncateForSummary((body.note || '').trim(), 120);
  return document.getElementById('titleInput').value.trim();
}

/* ---- STEP 1 <-> STEP 2/3, in place, no reload ---- */
const TRANSITION_CLASSES = ['is-out', 'is-pre-in', 'is-out-reverse', 'is-pre-in-reverse'];
let transitionToken = 0;

// A crossfade, not a hard swap, in either direction: `fromEl` stays stacked
// on top while it fades and lifts away, and `toEl` begins rising in
// underneath partway through that same motion. `reverse` mirrors the lift
// direction so going back reads as an undo of going forward, not a repeat.
function transitionStep(fromEl, toEl, { reverse = false, onOverlap } = {}) {
  const myToken = ++transitionToken;
  const outClass = reverse ? 'is-out-reverse' : 'is-out';
  const preInClass = reverse ? 'is-pre-in-reverse' : 'is-pre-in';

  TRANSITION_CLASSES.forEach((c) => { fromEl.classList.remove(c); toEl.classList.remove(c); });

  fromEl.style.zIndex = '2';
  toEl.style.zIndex = '1';
  toEl.style.display = 'flex';
  toEl.classList.add(preInClass);
  void toEl.offsetWidth; // force reflow before the next class change transitions

  fromEl.classList.add(outClass);

  setTimeout(() => {
    if (transitionToken !== myToken) return; // superseded by a newer transition — do nothing
    toEl.classList.remove(preInClass);
    if (onOverlap) onOverlap();
  }, CONFIG.STEP_TRANSITION_OVERLAP_MS);

  setTimeout(() => {
    if (transitionToken !== myToken) return; // superseded by a newer transition — do nothing
    fromEl.style.display = 'none';
    fromEl.classList.remove(outClass);
    fromEl.style.zIndex = '';
    toEl.style.zIndex = '';
  }, CONFIG.STEP_TRANSITION_MS);
}

function goToWeaveStep() {
  const compose = document.getElementById('stepCompose');
  const weave = document.getElementById('stepWeave');
  resetWeaveVisual();
  transitionStep(compose, weave, { onOverlap: startWeaveSequence });
}

function resetWeaveVisual() {
  weaveStartTime = null;
  document.getElementById('weaveCaption').classList.remove('is-visible');
  document.getElementById('weaveConfirm').classList.remove('is-visible');
}

function goToComposeStep() {
  const compose = document.getElementById('stepCompose');
  const weave = document.getElementById('stepWeave');
  resetComposeForm();
  transitionStep(weave, compose, { reverse: true });
}

function resetComposeForm() {
  const titleInput = document.getElementById('titleInput');
  const submitBtn = document.getElementById('submitBtn');


  titleInput.value = '';
  document.getElementById('linkInput').value = '';
  // A new compose is a blank sheet for every type, not just the one showing.
  Object.keys(composeDrafts).forEach((k) => { delete composeDrafts[k]; });
  composeExtraOpen = false; // a blank sheet asks for one box, whatever the last one did
  selectedType = 'project';
  selectedAskedTo = 'all';
  document.querySelectorAll('#typePicker .type-pill').forEach((btn) => {
    btn.classList.toggle('is-active', btn.dataset.type === selectedType);
  });
  renderAskedToPicker();
  renderComposeFields();
  updateComposeChrome();

  updateSubmitGate();

  selectedImageUrl = null;
  selectedImageName = '';
  selectedImageFocal = { x: 50, y: 50 };
  setUploadPreview(null);

  attachedFiles = [];
  renderAttachmentList();
  composeKeywords = [];
  document.getElementById('keywordInput').value = '';
  closeKeywordSuggestions();
  renderComposeKeywords();
  refreshImageThumb();

  // Compose is a persistent, hidden-not-recreated element (see enterShareMode/
  // goToComposeStep, both of which call this) — without resetting scrollTop
  // here, reopening after having scrolled down mid-form would resume wherever
  // it was left instead of starting clean from the top.
  const composeScroll = document.querySelector('#stepCompose .compose-scroll');
  if (composeScroll) composeScroll.scrollTop = 0;

  // Including the wording. An abandoned edit clears editingCardId on the way
  // out (see exitShareMode) but left its heading and button label written into
  // the form, so the next visit was a blank compose still calling itself
  // "Edit what you shared". refreshShareText re-applies the edit labels itself
  // when an edit *is* in progress, so this is safe either way.
  refreshShareText();
}

/* ---- editing something already shared ----
   The compose form, not a second form. A separate edit dialog would be another
   place for the same six fields to drift out of step, and this one already
   knows how to present a Question differently from a project.

   Only what the author typed can change here. id, appliedBy, relatedTo and the
   conversation belong to everyone who touched the card afterwards — fixing a
   typo in a title must not quietly reset who has applied it. */
let editingCardId = null;

function prefillComposeFrom(card) {
  const text = card.text || {};
  const title = text.title || '';
  document.getElementById('titleInput').value = title;

  selectedType = card.type || 'project';
  selectedAskedTo = card.askedTo || 'all';
  document.querySelectorAll('#typePicker .type-pill').forEach((btn) => {
    btn.classList.toggle('is-active', btn.dataset.type === selectedType);
  });
  renderAskedToPicker();

  // bodyValue, not text[key] — a seed card being edited still carries the old
  // three slots, and the form has to load what is actually in it.
  const values = {};
  fieldsFor(selectedType).forEach((key) => { values[key] = bodyValue(text, selectedType, key); });
  Object.keys(composeDrafts).forEach((k) => { delete composeDrafts[k]; });
  composeDrafts[selectedType] = values;
  renderComposeFields(values);
  updateComposeChrome();

  document.getElementById('linkInput').value = card.link || '';
  selectedImageUrl = card.image || null;
  selectedImageName = card.imageName || '';
  selectedImageFocal = Object.assign({ x: 50, y: 50 }, card.imageFocal || {});
  setUploadPreview(selectedImageUrl);

  attachedFiles = (card.attachments || []).slice();
  renderAttachmentList();
  // keywordsOf, not card.keywords: an older stored card may hold duplicates or
  // untrimmed strings, and the editor should show what the card displays.
  composeKeywords = keywordsOf(card);
  document.getElementById('keywordInput').value = '';
  closeKeywordSuggestions();
  renderComposeKeywords();
  refreshImageThumb();

  updateSubmitGate(); // an existing card always has a title, but say so once
}

function enterEditMode(cardId) {
  const card = sharedCards.find((c) => c.id === cardId) || ALL_CARDS.find((c) => c.id === cardId);
  if (!card || !canEditCard(card)) return;
  editingCardId = cardId;

  // Close the detail first, then open Share — two surfaces can't both hold the
  // screen, and enterShareMode refuses outright while a detail is open.
  closeCard();
  setTimeout(() => {
    enterShareMode();
    // enterShareMode resets the form to empty, so the card's own values go in
    // after it, not before.
    prefillComposeFrom(card);
    applyEditModeLabels();
  }, CONFIG.MODE_SWAP_MS + 40);
}

/* The only visible difference between composing and editing is what the
   heading, the intro and the button say — the fields are the same fields.
   refreshShareText() writes the compose wording unconditionally, so this runs
   after it (including on a language switch made mid-edit). */
function applyEditModeLabels() {
  if (!editingCardId) return;
  const s = t();
  const setText = (id, value) => { const el = document.getElementById(id); if (el) el.textContent = value; };
  setText('submitBtnLabel', s.editSubmit);
}

// Writes the edited fields back onto the card already in the gallery, in place,
// so its position and everything attached to it survive the edit.
function commitCardEdit() {
  const id = editingCardId;
  editingCardId = null;
  if (!id) return;

  const body = readComposeFields();
  const title = composeTitle(body);

  const card = sharedCards.find((c) => c.id === id);
  if (!card) { commitSeedCardEdit(id, title, body); return; }

  card.type = selectedType;
  card.askedTo = selectedType === 'question' ? selectedAskedTo : undefined;
  card.link = selectedType === 'update' ? readComposeLink() : undefined;
  card.image = selectedImageUrl;
  card.imageName = selectedImageName;
  card.imageFocal = Object.assign({}, selectedImageFocal);
  card.attachments = attachedFiles.slice();
  card.keywords = composeKeywords.slice();
  card.sourceLang = currentLang;
  // The moment it last changed, so a reader can tell a correction from the
  // original — see renderEditedStamp.
  card.editedAt = nowStamp();
  card.text = Object.assign({ title, summary: composeSummary(title, body) }, body);

  if (writeSharedCards(sharedCards)) showToast(t().editSaved);
  else showToast(t().share.storageFailed);

  rebuildAllSurfaces();
}

// Same edit, stored as a patch over the seed instead of in place — see the
// note above SEED_EDITS_STORAGE_KEY.
function commitSeedCardEdit(id, title, body) {
  const original = ALL_CARDS.find((c) => c.id === id);
  if (!original) return;

  const patch = {
    type: selectedType,
    link: selectedType === 'update' ? readComposeLink() : undefined,
    image: selectedImageUrl,
    imageName: selectedImageName,
    imageFocal: Object.assign({}, selectedImageFocal),
    attachments: attachedFiles.slice(),
    keywords: composeKeywords.slice(),
    sourceLang: currentLang,
    editedAt: nowStamp(),
    text: Object.assign({ title, summary: composeSummary(title, body) }, body),
  };
  if (selectedType === 'question') patch.askedTo = selectedAskedTo;

  if (saveSeedEdit(id, patch)) showToast(t().editSaved);
  else showToast(t().share.storageFailed);

  rebuildAllSurfaces();
}

// The three floors all read from ALL_CARDS, so anything that changes a card
// has to rebuild all three or two of them quietly disagree with the third.
function rebuildAllSurfaces() {
  ALL_CARDS = buildAllCards();
  renderDiscover();
  renderBrowse();
  renderQuestions();
}

/* ---- hand the composed card to the gallery itself — no page, no reload ---- */
// (SHARED_CARDS_STORAGE_KEY is declared up in section 2b, alongside loadSharedCards())

/* An absolute timestamp, so "edited 4 minutes ago" can still be worked out
   after a reload. Stored as a number rather than a formatted string — the
   reader may be in a different language by the time they see it. */
function nowStamp() { return Date.now(); }

/* People type "figma.com/…" far more often than they type the scheme, and a
   link without one resolves against this page and 404s. http/https only —
   anything else in an href is a way to run something. */
function readComposeLink() {
  const raw = (document.getElementById('linkInput').value || '').trim();
  if (!raw) return '';
  if (/^https?:\/\//i.test(raw)) return raw;
  if (/^[a-z][a-z0-9+.-]*:/i.test(raw)) return ''; // some other scheme — drop it
  return 'https://' + raw;
}

/* The one-line summary shown on a card face. Built from the last field with
   anything in it, working backwards: the end of a piece of knowledge (what we
   learned, what others can borrow) says more on a poster than its opening
   problem statement does. */
function composeSummary(title, body) {
  if (selectedType === 'update') return truncateForSummary((body.note || title || '').trim(), 120);
  const keys = fieldsFor(selectedType);
  for (let i = keys.length - 1; i >= 0; i--) {
    const v = (body[keys[i]] || '').trim();
    if (v) return truncateForSummary(v, 100);
  }
  return truncateForSummary(title, 100);
}

function truncateForSummary(text, max) {
  const trimmed = text.trim();
  return trimmed.length > max ? trimmed.slice(0, max - 1).trim() + '…' : trimmed;
}

function buildSharedCardEntry() {
  const isOpenQ = selectedType === 'question';
  // Only the fields this type actually has — renderComposeFields built them,
  // so a project's "constraints" can't leak into a question.
  const body = readComposeFields();
  const title = composeTitle(body);
  return {
    id: 'shared-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8),
    studio: MY_STUDIO_KEY,
    type: selectedType,
    author: 'You',
    justNow: true,
    appliedBy: [],
    // A freshly shared card starts with no known lineage — connections form
    // later, the same way appliedBy would in a real service: someone else
    // hitting "we applied this too" (or explicitly linking their own new
    // post back to this one) is what creates a relatedTo/derivedFrom edge.
    relatedTo: [],
    derivedFrom: null,
    // A freshly posted Question is always awaiting an answer, and starts
    // its own conversation with just the opening post.
    status: isOpenQ ? 'open' : undefined,
    // Who it is addressed to. Questions aimed at your own studio sort to the
    // front of floor 3 — see sortQuestionsForMe.
    askedTo: isOpenQ ? selectedAskedTo : undefined,
    conversation: isOpenQ
      ? [{ author: 'You', studio: MY_STUDIO_KEY, justNow: true, text: (body.blocked || title) }]
      : undefined,
    // Not a real translation — see LANG_PENDING note near renderCardLangBadge.
    sourceLang: currentLang,
    image: selectedImageUrl,
    imageName: selectedImageName,
    imageFocal: Object.assign({}, selectedImageFocal),
    attachments: attachedFiles.slice(),
    keywords: composeKeywords.slice(),
    link: selectedType === 'update' ? readComposeLink() : undefined,
    text: Object.assign({ title, summary: composeSummary(title, body) }, body),
  };
}

// Returns true only if the list is genuinely in storage. On failure the
// previous list is back in place (see safeSetItem), so a half-applied write
// can't leave the reader with a card list they never had.
function writeSharedCards(list) {
  return safeSetItem(SHARED_CARDS_STORAGE_KEY, JSON.stringify(list)).ok;
}

// Images are downscaled on the way in (see resizeImageToDataUrl), so this
// should not normally have anything to do. It exists because localStorage has
// no reservation or eviction of its own: once the ~5MB origin budget is gone,
// setItem simply throws and — before this — the card silently failed to
// persist while still appearing in the session, so it vanished on reload with
// no explanation. Give ground in the order that costs the reader least:
// oldest cards first, then images, and say so out loud either way.
function saveSharedCard(entry) {
  let list = [];
  try {
    const parsed = JSON.parse(localStorage.getItem(SHARED_CARDS_STORAGE_KEY));
    if (Array.isArray(parsed)) list = parsed;
  } catch (err) { /* corrupt or missing — start fresh */ }
  list.unshift(entry);

  if (writeSharedCards(list)) {
    logStorageUsage('shared card saved');
    return true;
  }

  while (list.length > 1) {
    list.pop(); // drop the oldest shared card and try again
    if (writeSharedCards(list)) {
      showToast(t().share.storageTrimmed);
      return true;
    }
  }

  // Down to this one card and it still won't fit: keep the knowledge, lose
  // the picture. It stays visible for the rest of the session either way —
  // `sharedCards` in memory is what the gallery renders from.
  if (writeSharedCards(list.map((c) => Object.assign({}, c, { image: null, attachments: [] })))) {
    showToast(t().share.storageImageDropped);
    return true;
  }

  console.error('[Loom feed] could not persist the shared card: no room in localStorage');
  logStorageUsage('gave up on a card');
  showToast(t().share.storageFailed);
  return false;
}

// Queued rather than applied immediately: the gallery track is rebuilt while
// still hidden (mid-compose/weave), the entrance-stagger reveal in
// renderDiscover()/renderBrowse() would just silently finish off-screen.
// Draining this queue happens in exitShareMode(), right as Discover is
// about to become visible again, so the "welcome, you're woven in" entrance
// actually plays — and since a freshly shared card is always justNow (see
// daysAgoOf), it lands at the very front of Discover automatically.
let pendingSharedEntries = [];

function flushPendingSharedCards() {
  if (!pendingSharedEntries.length) return;
  // push order is oldest-shared-first; unshifting each in that order leaves
  // the most recently shared card truly first
  pendingSharedEntries.forEach((entry) => { sharedCards.unshift(entry); });
  pendingSharedEntries = [];
  ALL_CARDS = buildAllCards();
  renderDiscover();
  renderBrowse();
  renderQuestions();
}

function initSubmit() {
  document.getElementById('submitBtn').addEventListener('click', () => {
    if (document.getElementById('submitBtn').disabled) return;

    // An edit is a correction, not an arrival: it skips the weave moment and
    // drops straight back to where the card already lives.
    if (editingCardId) {
      commitCardEdit();
      exitShareMode();
      return;
    }

    const entry = buildSharedCardEntry();
    saveSharedCard(entry);
    pendingSharedEntries.push(entry);
    // TODO(backend): delete — see the Arrival simulation section.
    scheduleDemoReaction(entry.id);
    goToWeaveStep();
  });
}

/* ---- the weave — a small, light 2D network (not the full WebGL globe from
   loom_lobby.html, deliberately: this lives inline in the gallery's own
   footprint, so it stays a few dozen nodes and a plain canvas) ---- */
const MY_STUDIO = WEAVE_STUDIOS.find((s) => s.key === MY_STUDIO_KEY);
const NEW_NODE_CORE_RGB = hexToRgb(MY_STUDIO.color);        // "r, g, b" string, for gradients
const NEW_NODE_CORE_ARR = hexToRgbArray(MY_STUDIO.color);   // [r, g, b], for channel lerping
const NEW_NODE_FLASH_ARR = [255, 255, 255];                 // the white-hot spark at the moment of birth

let weaveCanvas, weaveCtx;
let canvasSize = { w: 0, h: 0 };
let clusterNodes = [];
let ambientNodes = [];
let clusterLinks = [];   // { a, b, color } — indices into clusterNodes
let ambientLinks = [];   // { a, b } — indices into ambientNodes
let connectionTargets = []; // clusterNodes indices the new node reaches out to
let connectStarts = [];  // ms-since-sequence-start each connection begins drawing, aligned to connectionTargets
let rippleMaxR = 0;      // px radius the ripple must travel to have touched every node on stage
let weaveStartTime = null;

function clamp01(v) { return Math.max(0, Math.min(1, v)); }
function lerp(a, b, tt) { return a + (b - a) * tt; }
function easeOutCubic(tt) { return 1 - Math.pow(1 - tt, 3); }
function easeOutBack(tt) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(tt - 1, 3) + c1 * Math.pow(tt - 1, 2);
}
// Inverse of easeOutCubic — given how far (0..1) a node sits between the new
// node and the ripple's max reach, returns how far (0..1) into the ripple's
// travel time the ring will have reached it. Lets close nodes light up almost
// immediately while far nodes wait, matching the ring's actual fast-start motion.
function invEaseCubic(x) { return 1 - Math.pow(1 - clamp01(x), 1 / 3); }
function pickRandomIndices(count, from, to, howMany) {
  const pool = [];
  for (let i = from; i < to; i++) pool.push(i);
  const picked = [];
  for (let i = 0; i < howMany && pool.length; i++) {
    picked.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  return picked;
}

function buildWeaveNodes() {
  clusterNodes = [];
  WEAVE_STUDIOS.forEach((studio) => {
    for (let i = 0; i < CONFIG.NODES_PER_CLUSTER; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 0.05 + Math.random() * 0.11;
      clusterNodes.push({
        rx: clamp01(studio.center.x + Math.cos(angle) * radius),
        ry: clamp01(studio.center.y + Math.sin(angle) * radius * 0.85),
        color: studio.color,
        seed: Math.random() * 1000,
        twinklePhase: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.55 + Math.random() * 0.5,
        r: 3.6 + Math.random() * 1.0,
      });
    }
  });

  ambientNodes = [];
  let attempts = 0;
  while (ambientNodes.length < CONFIG.AMBIENT_COUNT && attempts < CONFIG.AMBIENT_COUNT * 8) {
    attempts++;
    const rx = 0.05 + Math.random() * 0.90;
    const ry = 0.07 + Math.random() * 0.86;
    const d = Math.hypot(rx - CONFIG.NEW_NODE_POS.x, ry - CONFIG.NEW_NODE_POS.y);
    if (d < CONFIG.CENTER_EXCLUSION) continue;
    ambientNodes.push({
      rx, ry,
      seed: Math.random() * 1000,
      twinklePhase: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.45 + Math.random() * 0.45,
      r: 1.5 + Math.random() * 1.1,
    });
  }

  // Cluster mesh: each node links to two same-cluster neighbors (lobby-style).
  clusterLinks = [];
  WEAVE_STUDIOS.forEach((studio, si) => {
    const start = si * CONFIG.NODES_PER_CLUSTER;
    const n = CONFIG.NODES_PER_CLUSTER;
    for (let i = 0; i < n; i++) {
      [1, 2].forEach((step) => {
        clusterLinks.push({ a: start + i, b: start + ((i + step) % n), color: studio.color });
      });
    }
  });

  // Ambient mesh: each node links to its single nearest neighbor.
  ambientLinks = [];
  const linked = new Set();
  ambientNodes.forEach((node, i) => {
    let bestJ = -1, bestD = Infinity;
    ambientNodes.forEach((other, j) => {
      if (i === j) return;
      const d = Math.hypot(node.rx - other.rx, node.ry - other.ry);
      if (d < bestD) { bestD = d; bestJ = j; }
    });
    if (bestJ === -1) return;
    const key = i < bestJ ? i + '_' + bestJ : bestJ + '_' + i;
    if (linked.has(key)) return;
    linked.add(key);
    ambientLinks.push({ a: i, b: bestJ });
  });

  // The new node reaches into every studio cluster — the visual proof that
  // this single piece of knowledge now touches more than one team. Spreads
  // CONFIG.CONNECTION_COUNT as evenly as possible across however many
  // clusters WEAVE_STUDIOS actually has right now (rather than assuming a
  // fixed 3 studios), so disabling one doesn't leave this reaching for
  // cluster indices that no longer exist.
  connectionTargets = [];
  const clusterCount = WEAVE_STUDIOS.length;
  if (clusterCount > 0) {
    const perCluster = Math.floor(CONFIG.CONNECTION_COUNT / clusterCount);
    const remainder = CONFIG.CONNECTION_COUNT % clusterCount;
    for (let ci = 0; ci < clusterCount; ci++) {
      const want = perCluster + (ci < remainder ? 1 : 0);
      connectionTargets.push(...pickRandomIndices(0, ci * CONFIG.NODES_PER_CLUSTER, (ci + 1) * CONFIG.NODES_PER_CLUSTER, want));
    }
  }
}

function resizeWeaveCanvas() {
  const wrap = document.getElementById('weaveCanvasWrap');
  const rect = wrap.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvasSize.w = rect.width;
  canvasSize.h = rect.height;
  weaveCanvas.width = Math.max(1, Math.round(rect.width * dpr));
  weaveCanvas.height = Math.max(1, Math.round(rect.height * dpr));
  weaveCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function wpx(rx, ry) { return { x: rx * canvasSize.w, y: ry * canvasSize.h }; }

// Stamps every cluster/ambient node with a `revealAt` (ms since sequence
// start) — the moment the outward ripple actually reaches it. Nearer nodes
// get an earlier time, farther ones later, so the network appears to unfold
// outward from the new node rather than all snapping in at once.
function computeReveals() {
  const newPos = wpx(CONFIG.NEW_NODE_POS.x, CONFIG.NEW_NODE_POS.y);
  const all = clusterNodes.concat(ambientNodes);
  let maxDist = 0;
  all.forEach((node) => {
    const p = wpx(node.rx, node.ry);
    const d = Math.hypot(p.x - newPos.x, p.y - newPos.y);
    node._dist = d;
    if (d > maxDist) maxDist = d;
  });
  rippleMaxR = Math.max(1, maxDist * 1.04); // small margin so the farthest node isn't cut off mid-fade
  all.forEach((node) => {
    const ratio = clamp01(node._dist / rippleMaxR);
    node.revealAt = CONFIG.RIPPLE_START + invEaseCubic(ratio) * CONFIG.RIPPLE_TRAVEL_DUR;
  });
}

// Active ripple rings at this instant, as { radius, life } where life fades
// 1 -> 0 over each ring's travel time. Two of these overlap briefly to read
// as an echoing wave rather than a single hard-edged circle.
function activeRipples(elapsed) {
  const rings = [];
  if (elapsed === null) return rings;
  for (let i = 0; i < CONFIG.RIPPLE_RING_COUNT; i++) {
    const ringStart = CONFIG.RIPPLE_START + i * CONFIG.RIPPLE_RING_GAP;
    const rt = (elapsed - ringStart) / CONFIG.RIPPLE_TRAVEL_DUR;
    if (rt >= 0 && rt < 1.1) {
      rings.push({ radius: easeOutCubic(clamp01(rt)) * rippleMaxR, life: Math.max(0, 1 - rt) });
    }
  }
  return rings;
}

// How much a point at `dist` from the new node should flash right now, given
// the currently active rings — the visible "the wave just touched you" pulse.
function rippleBoostAt(rings, dist) {
  let boost = 0;
  rings.forEach((ring) => {
    const diff = Math.abs(dist - ring.radius);
    if (diff < CONFIG.RIPPLE_BAND) {
      const b = (1 - diff / CONFIG.RIPPLE_BAND) * CONFIG.RIPPLE_FLASH_STRENGTH * Math.min(1, ring.life + 0.3);
      if (b > boost) boost = b;
    }
  });
  return boost;
}

function driftOffset(node, now) {
  return {
    dx: Math.sin(now * 0.00035 + node.seed) * CONFIG.DRIFT_AMOUNT,
    dy: Math.cos(now * 0.0004 + node.seed * 1.7) * CONFIG.DRIFT_AMOUNT,
  };
}

function twinkle(node, now) {
  return 0.82 + 0.18 * Math.sin(now * 0.001 * node.twinkleSpeed + node.twinklePhase);
}

function drawLine(ax, ay, bx, by, color, alpha, width) {
  weaveCtx.strokeStyle = color;
  weaveCtx.globalAlpha = alpha;
  weaveCtx.lineWidth = width;
  weaveCtx.beginPath();
  weaveCtx.moveTo(ax, ay);
  weaveCtx.lineTo(bx, by);
  weaveCtx.stroke();
  weaveCtx.globalAlpha = 1;
}

function drawNodeDot(x, y, r, color, alpha) {
  weaveCtx.globalAlpha = alpha;
  weaveCtx.fillStyle = color;
  weaveCtx.beginPath();
  weaveCtx.arc(x, y, r, 0, Math.PI * 2);
  weaveCtx.fill();
  weaveCtx.globalAlpha = 1;
}

function drawGlow(x, y, r, rgb, alpha) {
  const grad = weaveCtx.createRadialGradient(x, y, 0, x, y, r);
  grad.addColorStop(0, `rgba(${rgb}, ${alpha})`);
  grad.addColorStop(1, `rgba(${rgb}, 0)`);
  weaveCtx.fillStyle = grad;
  weaveCtx.beginPath();
  weaveCtx.arc(x, y, r, 0, Math.PI * 2);
  weaveCtx.fill();
}

function renderWeaveFrame(now) {
  weaveCtx.clearRect(0, 0, canvasSize.w, canvasSize.h);

  const elapsed = weaveStartTime === null ? null : now - weaveStartTime;
  const newPos = wpx(CONFIG.NEW_NODE_POS.x, CONFIG.NEW_NODE_POS.y);
  const rings = activeRipples(elapsed);

  // ---- ambient links (only once both ends have been touched by the ripple) ----
  if (elapsed !== null) {
    ambientLinks.forEach((link) => {
      const a = ambientNodes[link.a], b = ambientNodes[link.b];
      const readyAt = Math.max(a.revealAt || Infinity, b.revealAt || Infinity);
      if (elapsed < readyAt) return;
      const fade = easeOutCubic(clamp01((elapsed - readyAt) / CONFIG.NODE_FADE_IN_DUR));
      const oa = driftOffset(a, now), ob = driftOffset(b, now);
      const pa = wpx(a.rx, a.ry), pb = wpx(b.rx, b.ry);
      drawLine(pa.x + oa.dx, pa.y + oa.dy, pb.x + ob.dx, pb.y + ob.dy, 'rgba(28,28,30,1)', 0.06 * fade, 1);
    });
  }

  // ---- cluster links (same fade-in-on-reveal treatment) ----
  if (elapsed !== null) {
    clusterLinks.forEach((link) => {
      const a = clusterNodes[link.a], b = clusterNodes[link.b];
      const readyAt = Math.max(a.revealAt || Infinity, b.revealAt || Infinity);
      if (elapsed < readyAt) return;
      const fade = easeOutCubic(clamp01((elapsed - readyAt) / CONFIG.NODE_FADE_IN_DUR));
      const oa = driftOffset(a, now), ob = driftOffset(b, now);
      const pa = wpx(a.rx, a.ry), pb = wpx(b.rx, b.ry);
      drawLine(pa.x + oa.dx, pa.y + oa.dy, pb.x + ob.dx, pb.y + ob.dy, link.color, 0.16 * fade, 1.1);
    });
  }

  // ---- new-node connections — each starts once its own target has been
  // reached by the ripple, so the three studio clusters light up in the
  // order the wave actually gets to them, not on a fixed clock ----
  if (elapsed !== null) {
    connectionTargets.forEach((targetIdx, i) => {
      const start = connectStarts[i];
      if (start === undefined || elapsed < start) return;
      const tt = clamp01((elapsed - start) / CONFIG.CONNECT_DUR);
      const eased = easeOutCubic(tt);
      const target = clusterNodes[targetIdx];
      const to = driftOffset(target, now);
      const tp = wpx(target.rx, target.ry);
      const endX = lerp(newPos.x, tp.x + to.dx, eased);
      const endY = lerp(newPos.y, tp.y + to.dy, eased);

      const grad = weaveCtx.createLinearGradient(newPos.x, newPos.y, endX, endY);
      grad.addColorStop(0, `rgba(${NEW_NODE_CORE_RGB}, 0.7)`);
      grad.addColorStop(1, target.color);
      weaveCtx.strokeStyle = grad;
      weaveCtx.globalAlpha = 0.18 + 0.5 * eased;
      weaveCtx.lineWidth = 1.7;
      weaveCtx.beginPath();
      weaveCtx.moveTo(newPos.x, newPos.y);
      weaveCtx.lineTo(endX, endY);
      weaveCtx.stroke();
      weaveCtx.globalAlpha = 1;

      // a bright bead riding the leading edge while the line is still drawing
      if (tt < 1) {
        drawGlow(endX, endY, 7, NEW_NODE_CORE_RGB, 0.55);
      }

      // brief acknowledgement glow at the target once the line arrives
      const sincePulse = elapsed - (start + CONFIG.CONNECT_DUR);
      if (sincePulse >= 0 && sincePulse < CONFIG.CONNECT_PULSE_MS) {
        const pulseT = 1 - sincePulse / CONFIG.CONNECT_PULSE_MS;
        drawGlow(tp.x + to.dx, tp.y + to.dy, target.r * 5 * pulseT, hexToRgb(target.color), 0.35 * pulseT);
      }
    });
  }

  // ---- ambient nodes — fade in as the ripple reaches each one, with an
  // extra flash right as the wavefront passes ----
  if (elapsed !== null) {
    ambientNodes.forEach((node) => {
      if (elapsed < (node.revealAt || Infinity)) return;
      const fade = easeOutCubic(clamp01((elapsed - node.revealAt) / CONFIG.NODE_FADE_IN_DUR));
      const o = driftOffset(node, now);
      const p = wpx(node.rx, node.ry);
      const dist = Math.hypot(p.x - newPos.x, p.y - newPos.y);
      const boost = rippleBoostAt(rings, dist);
      let r = node.r, alpha = 0.34 * twinkle(node, now) * fade;
      if (boost > 0) {
        r *= 1 + boost * 0.8;
        alpha = Math.min(1, alpha + boost);
      }
      drawNodeDot(p.x + o.dx, p.y + o.dy, r, 'rgba(28,28,30,0.9)', alpha);
    });
  }

  // ---- cluster nodes — same fade-in-on-reveal, plus a studio-colored glow
  // the instant the wave touches them ----
  if (elapsed !== null) {
    clusterNodes.forEach((node) => {
      if (elapsed < (node.revealAt || Infinity)) return;
      const fade = easeOutCubic(clamp01((elapsed - node.revealAt) / CONFIG.NODE_FADE_IN_DUR));
      const o = driftOffset(node, now);
      const p = wpx(node.rx, node.ry);
      const dist = Math.hypot(p.x - newPos.x, p.y - newPos.y);
      const boost = rippleBoostAt(rings, dist);
      let r = node.r, alpha = 0.9 * twinkle(node, now) * fade;
      if (boost > 0) {
        drawGlow(p.x + o.dx, p.y + o.dy, node.r * 4.5, hexToRgb(node.color), 0.4 * boost * fade);
        r *= 1 + boost * 0.7;
        alpha = Math.min(1, alpha + boost * 0.6);
      }
      drawNodeDot(p.x + o.dx, p.y + o.dy, r, node.color, alpha);
    });
  }

  // ---- the ripple rings themselves — soft concentric bands, colored with
  // the new node's own studio color so they read clearly on white, fading to
  // nothing as each one expands (an echo, not a single hard ring) ----
  rings.forEach((ring) => {
    if (ring.life <= 0.01 || ring.radius <= 0) return;
    const ringAlpha = 0.4 * ring.life;
    const grad = weaveCtx.createRadialGradient(newPos.x, newPos.y, Math.max(0, ring.radius - 20), newPos.x, newPos.y, ring.radius + 20);
    grad.addColorStop(0, `rgba(${NEW_NODE_CORE_RGB}, 0)`);
    grad.addColorStop(0.5, `rgba(${NEW_NODE_CORE_RGB}, ${ringAlpha})`);
    grad.addColorStop(1, `rgba(${NEW_NODE_CORE_RGB}, 0)`);
    weaveCtx.strokeStyle = grad;
    weaveCtx.lineWidth = 1.8;
    weaveCtx.beginPath();
    weaveCtx.arc(newPos.x, newPos.y, ring.radius, 0, Math.PI * 2);
    weaveCtx.stroke();
  });

  // ---- the new node itself: pop + glow in the studio's own color, settling
  // into a permanent, gentle breathing pulse once the sequence is done ----
  if (elapsed !== null && elapsed >= CONFIG.BIRTH_START) {
    const bt = clamp01((elapsed - CONFIG.BIRTH_START) / CONFIG.BIRTH_DUR);
    const pop = Math.max(0, easeOutBack(bt));
    const settleT = clamp01((elapsed - CONFIG.BIRTH_START) / CONFIG.BIRTH_SETTLE_DUR);
    const mixT = easeOutCubic(settleT);

    const r = CONFIG.NEW_NODE_RADIUS * Math.min(pop, 1.2);
    const selfBoost = rippleBoostAt(rings, 0); // the node also catches the flash of its own rings firing

    // breathing kicks in once the settle finishes and continues indefinitely
    const settleEnd = CONFIG.BIRTH_START + CONFIG.BIRTH_SETTLE_DUR;
    let breathe = 0;
    if (elapsed > settleEnd) {
      const since = elapsed - settleEnd;
      const breatheIn = clamp01(since / CONFIG.BREATHE_FADE_IN);
      breathe = breatheIn * (0.5 + 0.5 * Math.sin((since / CONFIG.BREATHE_PERIOD) * Math.PI * 2));
    }

    // core color: white-hot spark -> steady studio color (never dims to plain ink)
    const cr = Math.round(lerp(NEW_NODE_FLASH_ARR[0], NEW_NODE_CORE_ARR[0], mixT));
    const cg = Math.round(lerp(NEW_NODE_FLASH_ARR[1], NEW_NODE_CORE_ARR[1], mixT));
    const cb = Math.round(lerp(NEW_NODE_FLASH_ARR[2], NEW_NODE_CORE_ARR[2], mixT));
    const coreColor = `rgb(${cr}, ${cg}, ${cb})`;

    const glowAlpha = lerp(0.7, 0.24, mixT) + breathe * 0.16 + selfBoost * 0.3;
    drawGlow(newPos.x, newPos.y, r * (4 + selfBoost * 2.4 + breathe * 1.3), NEW_NODE_CORE_RGB, Math.min(1, glowAlpha * pop));
    drawNodeDot(newPos.x, newPos.y, r * (1 + breathe * 0.07), coreColor, Math.min(1, pop));
  }

  requestAnimationFrame(renderWeaveFrame);
}

function initWeaveCanvas() {
  weaveCanvas = document.getElementById('weaveCanvas');
  weaveCtx = weaveCanvas.getContext('2d');
  buildWeaveNodes();
  resizeWeaveCanvas();
  window.addEventListener('resize', resizeWeaveCanvas);
  requestAnimationFrame(renderWeaveFrame);
}

/* ---- orchestrate the moment: birth -> ripple -> connections -> confirmation ---- */
function startWeaveSequence() {
  buildWeaveNodes();  // fresh layout each time "Add to the weave" runs
  resizeWeaveCanvas();
  computeReveals();   // stamp every node with the moment the ripple actually reaches it

  // Each connection waits for its own target's reveal — nearer clusters
  // start reaching out before farther ones, following the wave itself.
  connectStarts = connectionTargets.map((targetIdx) => clusterNodes[targetIdx].revealAt + CONFIG.CONNECT_LAG);

  weaveStartTime = performance.now();

  const caption = document.getElementById('weaveCaption');
  const confirm = document.getElementById('weaveConfirm');
  confirm.classList.remove('is-visible');

  // caption appears just as the node is born, after the opening quiet beat
  setTimeout(() => caption.classList.add('is-visible'), CONFIG.BIRTH_START + 80);

  const lastConnectFinish = connectStarts.length
    ? Math.max(...connectStarts) + CONFIG.CONNECT_DUR
    : CONFIG.RIPPLE_START + CONFIG.RIPPLE_TRAVEL_DUR;
  const confirmDelay = Math.max(CONFIG.CONFIRM_MIN_DELAY, lastConnectFinish + CONFIG.CONFIRM_DELAY_AFTER_CONNECT);

  setTimeout(() => caption.classList.remove('is-visible'), confirmDelay - 250);
  setTimeout(() => {
    paintWeaveState();
    confirm.classList.add('is-visible');
  }, confirmDelay);
}

/* The state of the card that was just shared. It is always zero and zero at
   this point — the value is in saying so out loud, and in naming where the
   answer will show up, rather than leaving the reader to wonder whether
   anything is supposed to have happened yet. */
function paintWeaveState() {
  const s = t().share.weaveState;
  document.getElementById('weaveStateReactions').textContent = s.reactions(0);
  document.getElementById('weaveStateApplied').textContent = s.applied(0);
  document.getElementById('weaveStateNote').textContent = s.note;
}

/* The one control on this screen that does not work, and the only one that has
   to explain itself. Keyboard too: it is role="button" with a tabindex, so it is
   reachable, and something reachable that answers nothing is worse than one that
   is not reachable at all. */
function initCanvasField() {
  const field = document.getElementById('canvasField');
  if (!field) return;
  const explain = () => showToast(t().share.canvasComingSoon);
  field.addEventListener('click', explain);
  field.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); explain(); }
  });
}

function initShareAnother() {
  document.getElementById('shareAnotherBtn').addEventListener('click', () => {
    goToComposeStep();
  });
}

function initSeeFullWeave() {
  document.getElementById('seeFullWeaveBtn').addEventListener('click', () => {
    // Placeholder affordance only — a soft acknowledging pulse hints that

    const wrap = document.getElementById('weaveCanvasWrap');
    wrap.classList.add('is-pulsing');
    setTimeout(() => wrap.classList.remove('is-pulsing'), 380);
