    padding: 2px 8px 2px 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #ffffff;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease;
  }
  .emoji-chip:hover { border-color: var(--border-strong); }
  .emoji-chip.is-mine { border-color: var(--ink-dim); background: rgba(20, 20, 20, 0.045); }
  .emoji-glyph { font-size: 12px; line-height: 1.4; }
  .emoji-count { font-size: 10.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  .emoji-add { position: relative; }
  .emoji-add-btn {
    width: 21px;
    height: 21px;
    border: 1px dashed var(--border-strong);
    border-radius: 50%;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .emoji-add-btn svg { width: 11px; height: 11px; }
  /* stays out of the way until you go looking for it */
  .reaction-item:hover .emoji-add-btn,
  .reply-item:hover .emoji-add-btn,
  .body-emoji:hover .emoji-add-btn,
  .emoji-add.is-open .emoji-add-btn { opacity: 1; }
  .emoji-add-btn:hover { color: var(--ink); border-color: var(--ink-dim); }

  .emoji-picker {
    position: absolute;
    bottom: calc(100% + 7px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    z-index: 40;
    display: flex;
    gap: 2px;
    padding: 5px 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    box-shadow: 0 12px 30px -16px rgba(20, 20, 20, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .emoji-add.is-open .emoji-picker { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .emoji-option {
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 50%;
    background: transparent;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.16s ease, transform 0.16s ease;
  }
  .emoji-option:hover { background: rgba(20, 20, 20, 0.06); transform: scale(1.12); }

  /* the body's own row, under the knowledge rather than beside it */
  .body-emoji { margin: 26px 0 4px; }


  /* Below this both columns would be too narrow to read, so the response side
     goes under the body and the whole thing becomes one scroller again. */
  @media (max-width: 1080px) {
    .expanded-panes { grid-template-columns: minmax(0, 1fr); overflow-y: auto; }
    .expanded-pane { overflow: visible; }
    .expanded-pane-response {
      border-left: none;
      border-top: 1px solid var(--border);
      padding-top: clamp(22px, 3vh, 32px);
    }
    .expanded-pane-inner, .expanded-pane-response .expanded-pane-inner { max-width: 720px; }
  }

  /* Quieter than the original timestamp beside it: that a card was corrected
     is worth knowing, but it is not the headline. */
  .edited-stamp {
    font-size: 11.5px;
    font-style: italic;
    color: var(--ink-faint);
  }
  .edited-stamp::before { content: '· '; font-style: normal; }

  .expanded-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-bottom: 14px;
  }
  .expanded-meta .card-dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: none; }
  .expanded-meta .sep { opacity: 0.5; }

  .expanded-title {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 3vw, 44px);
    line-height: 1.18;
    letter-spacing: -0.02em;
    margin: 0 0 30px;
    color: var(--ink);
  }

  .expanded-section { margin-bottom: 19px; }
  .expanded-section .label {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--studio-color, #9aa3b8);
    margin-bottom: 7px;
  }
  /* Paragraph breaks the author typed are part of what they wrote. Everything
     here is set with textContent, so pre-wrap is the whole fix: newlines render
     and runs of spaces still collapse the way prose should. */
  .expanded-section p {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.65;
    color: rgba(28, 28, 30, 0.78);
    white-space: pre-wrap;
  }

  .expanded-footer {
    margin-top: 22px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  .applied-summary { font-size: 12.5px; color: var(--ink-dim); }

  /* One line under each label saying what kind of thing the block holds. The
     two blocks in this pane look alike and are not: one is talk, one is
     lineage, and the rule above the second one is the seam. */
  .section-caption {
    margin: -6px 0 13px;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--ink-faint);
  }
  .expanded-section-lineage {
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
  }

  /* ---------- lineage — what this card derived from, what derived from it,
     related ideas, and which studios applied it. A plain list, on purpose:
     a small radial graph was tried here and didn't earn its keep next to
     the bigger Discover cards elsewhere on this page — the lineage "moment"
     now lives there instead (see .card-lineage-hint), light and textual.
     This modal list is the one place it's spelled out in full. ---------- */
  .lineage-list-wrap { display: flex; flex-direction: column; gap: 9px; }
  .lineage-empty { margin: 0; font-size: 13px; line-height: 1.55; color: var(--ink-faint); font-style: italic; }
  .lineage-row { display: flex; align-items: baseline; gap: 9px; font-size: 13.5px; flex-wrap: wrap; }
  .lineage-row-studio { font-size: 11.5px; color: var(--ink-faint); }
  .lineage-row-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; align-self: center; }
  .lineage-row-relation {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .lineage-row-name { color: var(--ink); font-weight: 550; }

  .apply-btn {
    padding: 13px 24px;
    border-radius: 999px;
    border: 1.5px solid var(--studio-color, var(--ink));
    background: transparent;
    color: var(--studio-color, var(--ink));
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.3s ease, color 0.3s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease;
  }
  .apply-btn:hover { background: var(--studio-color, var(--ink)); color: #fff; transform: translateY(-1px); box-shadow: 0 10px 24px -14px rgba(20, 20, 20, 0.45); }
  .apply-btn:active { transform: scale(0.96); }
  .apply-btn.is-applied { background: var(--studio-color, var(--ink)); color: #fff; }

  /* ---------- the "we applied this too" flow ----------
     Three short questions, one at a time. A single form with all three on it
     would be a form; asked one at a time it stays a decision you can back out
     of, which is what Cancel and the backdrop are for. ---------- */
  .apply-flow {
    position: fixed;
    inset: 0;
    z-index: 520;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .apply-flow.is-open { display: flex; }
  .apply-flow-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(20, 20, 20, 0.42);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  .apply-flow-sheet {
    position: relative;
    display: flex;
    flex-direction: column;
    width: min(520px, 100%);
    max-height: min(640px, calc(100vh - 48px));
    border-radius: 20px;
    background: #ffffff;
    box-shadow: 0 40px 90px -30px rgba(20, 20, 20, 0.5);
    overflow: hidden;
  }
  .apply-flow-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 20px 18px 14px 22px;
  }
  .apply-flow-head-text { flex: 1 1 auto; min-width: 0; }
  .apply-flow-head h2 {
    margin: 0;
    font-family: 'Newsreader', serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--ink);
  }
  .apply-flow-source {
    margin: 5px 0 0;
    font-size: 12px;
    line-height: 1.45;
    color: var(--ink-faint);
  }
  .apply-flow-progress {
    padding: 0 22px 14px;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .apply-flow-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 0 22px 4px;
  }
  .apply-step { display: none; }
  .apply-step.is-active { display: block; }
  .apply-step-q {
    margin: 0 0 6px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
  }
  .apply-step-hint { margin: 0 0 14px; font-size: 12px; line-height: 1.5; color: var(--ink-faint); }

  .apply-target-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 10px; }
  .apply-option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease;
  }
  .apply-option:hover { border-color: var(--border-strong); }
  .apply-option.is-picked {
    border-color: var(--ink);
    background: rgba(20, 20, 20, 0.035);
  }
  .apply-option-dot { width: 7px; height: 7px; margin-top: 6px; border-radius: 50%; flex-shrink: 0; }
  .apply-option-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .apply-option-title { font-size: 13px; line-height: 1.4; font-weight: 550; color: var(--ink); }
  .apply-option-meta {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
  }
  .apply-empty { margin: 0 0 12px; font-size: 12.5px; color: var(--ink-faint); font-style: italic; }

  .apply-new-update {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 11px 13px;
    border: 1px dashed var(--border-strong);
    border-radius: 12px;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    font-weight: 550;
    color: var(--ink-dim);
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s ease, color 0.18s ease;
  }
  .apply-new-update:hover { border-color: var(--ink); color: var(--ink); }
  .apply-new-update.is-picked { border-style: solid; border-color: var(--ink); color: var(--ink); }
  .apply-new-update-plus { font-size: 15px; line-height: 1; }
  .apply-new-update-box { margin-top: 9px; }
  .apply-new-update-box textarea,
  #applyNoteInput {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
    resize: none;
  }
  .apply-new-update-box textarea:focus,
  #applyNoteInput:focus { outline: none; border-color: var(--ink); }

  .apply-relation-list { display: flex; flex-direction: column; gap: 7px; }

  .apply-summary {
    margin-top: 14px;
    padding: 12px 13px;
    border-radius: 12px;
    background: rgba(20, 20, 20, 0.035);
    font-size: 12px;
    line-height: 1.55;
    color: var(--ink-dim);
  }
  .apply-summary strong { font-weight: 600; color: var(--ink); }

  .apply-flow-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 22px 20px;
    border-top: 1px solid var(--border);
  }
  .apply-flow-foot-right { display: flex; align-items: center; gap: 8px; }
  .apply-flow-next {
    padding: 11px 20px;
    border-radius: 999px;
    border: none;
    background: var(--ink);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .apply-flow-next:hover:not(:disabled) { transform: translateY(-1px); }
  .apply-flow-next:disabled { opacity: 0.32; cursor: not-allowed; }

  .reveal-on-open {
    opacity: 0;
    transform: translateY(10px);
  }

  /* ---------- delete (own cards only) — tucked in a bottom corner,
     deliberately quiet (no red) so it never reads as the loudest thing on
     the card; a confirm step sits between the link and anything real ---------- */
  .expanded-delete-row {
    margin-top: 18px;
    padding-top: 4px;
    display: flex;
    justify-content: flex-end;
  }
  .delete-link {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 4px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: color 0.25s ease;
  }
  .delete-link:hover { color: var(--ink-dim); }
  .delete-link svg { width: 13px; height: 13px; }

  .delete-confirm { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  /* Edit borrows Delete's shape and sits beside it, but stays the neutral of
     the two: fixing what you wrote is ordinary, taking it back isn't. */
  .edit-link {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 13px 7px 11px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--ink-dim);
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .edit-link svg { width: 15px; height: 15px; }
  .edit-link:hover { color: var(--ink); border-color: var(--border-strong); background: rgba(20, 20, 20, 0.03); }
  .delete-confirm p { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--ink-dim); max-width: 320px; text-align: right; }
  .delete-confirm-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .btn-ghost-sm {
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--ink-dim);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }
  .btn-ghost-sm:hover { border-color: var(--ink); color: var(--ink); }
  .btn-ghost-sm:active { transform: scale(0.96); }

  .btn-delete-confirm {
    padding: 7px 14px;
    border-radius: 999px;
    border: none;
    background: var(--ink-dim);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .btn-delete-confirm:hover { background: var(--ink); transform: translateY(-1px); }
  .btn-delete-confirm:active { transform: translateY(0) scale(0.96); }

  /* ======================================================================
     Question detail — a two-pane layout that takes over the expanded-card
     shell (same FLIP open/close animation, same modal frame) instead of the
     normal problem/tried/result body: a live-feeling Conversation on the
     left, a "Conversation Brief" summary panel on the right. Uses a
     container query (not a viewport media query) so it responds to the
     modal's own width, not the browser window's. ---------- */
  .question-detail {
    display: none;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    container-type: inline-size;
    container-name: question-detail;
  }
  /* 66px, not 30: a question has no banner above it, so this header is the
     first thing under the fixed top-left hamburger and back arrow. */
  .question-detail-header { flex-shrink: 0; padding: 66px 40px 18px; border-bottom: 1px solid var(--border); }
  .question-detail-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-bottom: 12px;
  }
  .question-detail-meta .card-dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: none; }
  .question-detail-meta .sep { opacity: 0.5; }
  .question-detail-title {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 23px;
    line-height: 1.36;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--ink);
  }

  .qd-delete-btn {
    margin-left: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    border-radius: 8px;
    transition: color 0.25s ease, background 0.25s ease;
  }
  .qd-delete-btn:hover { color: var(--ink-dim); background: rgba(20, 20, 20, 0.05); }
  .qd-delete-btn svg { width: 14px; height: 14px; }

  .question-tabs { display: none; flex-shrink: 0; border-bottom: 1px solid var(--border); }
  .question-tab {
    flex: 1;
    padding: 13px;
    border: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 650;
    color: var(--ink-faint);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.25s ease, border-color 0.25s ease;
  }
  .question-tab.is-active { color: var(--ink); border-bottom-color: var(--ink); }

  .question-panes { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 340px; }
  .question-pane { min-height: 0; display: flex; flex-direction: column; }
  .question-pane-conversation { border-right: 1px solid var(--border); }

  .conversation-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .conversation-message { display: flex; flex-direction: column; gap: 5px; max-width: 82%; }
  .conversation-message.is-me { align-self: flex-end; align-items: flex-end; }
  .conversation-message-meta { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-faint); }
  .conversation-message-meta .card-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .conversation-message-author { font-weight: 650; color: var(--ink-dim); }
  .conversation-message-bubble {
    background: rgba(20, 20, 20, 0.045);
    border-radius: 14px;
    padding: 11px 15px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink);
  }
  .conversation-message.is-me .conversation-message-bubble { background: var(--ink); color: #ffffff; }
  .conversation-message.is-entering { opacity: 0; transform: translateY(8px); animation: conversationMessageIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  @keyframes conversationMessageIn { to { opacity: 1; transform: translateY(0); } }

  .conversation-input-row {
    flex-shrink: 0;
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  #conversationInput {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.25s ease;
  }
  #conversationInput:focus { border-color: var(--border-strong); }
  #conversationInput::placeholder { color: var(--ink-faint); }
  .conversation-send-btn {
    flex-shrink: 0;
    padding: 10px 18px;
    border-radius: 999px;
    border: none;
    background: var(--ink);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 650;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
  }
  .conversation-send-btn:hover { transform: translateY(-1px); }
  .conversation-send-btn:active { transform: translateY(0) scale(0.96); }

  .brief-header {
    flex-shrink: 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .brief-header-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .brief-ai-label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--studio-color, var(--ink-dim));
  }
  .brief-updated { font-size: 11px; color: var(--ink-faint); transition: opacity 0.2s ease; }

  .brief-body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 22px; transition: opacity 0.25s ease; }
  .brief-body.is-updating { opacity: 0.45; }
  .brief-section { margin-bottom: 18px; }
  .brief-section:last-child { margin-bottom: 0; }
  .brief-section .label {
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
    margin-bottom: 7px;
  }
  .brief-section p { margin: 0; font-size: 13px; line-height: 1.62; color: rgba(28, 28, 30, 0.8); }
  .brief-section ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.62; color: rgba(28, 28, 30, 0.8); }
  .brief-section li.is-new { animation: conversationMessageIn 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
  .brief-empty { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-faint); font-style: italic; }

  /* narrow modal: the brief collapses behind a tab instead of sitting
     side-by-side — a container query so this is about the MODAL's own
     width, not the browser window's. */
  /* 1080px, matching the knowledge detail's own stacking point — this was 720
     when the question detail was a modal sized to ~86% of the window, so the
     container only ever got that narrow on a small screen. Fullscreen, the
     container IS the window, and at 900px the brief was down to 340px of
     bulleted text beside a 560px conversation: two columns too narrow to be
     two columns. */
  @container question-detail (max-width: 1080px) {
    .question-tabs { display: flex; }
    .question-panes { grid-template-columns: 1fr; }
    .question-pane-conversation { border-right: none; }
    .question-pane { display: none; }
    .question-pane.is-active-tab { display: flex; }
  }

  /* ======================================================================
     Designers — who is weaving this, one studio per screen.

     Deliberately a roster and not a scoreboard: nothing on a card can be
     compared against the next card (photo, name, job title, how to reach them
     — that's all), nothing is ordered by output, no card says how much anyone
     has shared, and the two studios are never on screen together to be read
     side by side. See the DESIGNERS comment in the script for why this is a
     rule and not a style choice.

     The screen is sized to fill rather than to sit politely in the middle of
     itself: the roster IS the content here, so the cards take the height and
     the studio arrows go out to the edges of the viewport where there is room
     to make them obvious.
     ====================================================================== */
  .designers-viewport {
    position: relative;
    height: var(--floor-h);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    /* heading, card row and studio caption are one block, centred as a whole.
       sizeAllRosters() keeps that block inside the surface, which is what makes
       centring safe here rather than clipping the top. */
    justify-content: center;
    background: var(--bg);
  }

  /* ---------- heading ---------- */
  .designers-head {
    flex-shrink: 0;
    padding: 0 max(6vw, 28px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .designers-intro h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(38px, 4vw, 62px);
    line-height: 1.04;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin: 0 0 8px;
  }
  .designers-intro p {
    margin: 0;
    font-size: clamp(13.5px, 1.05vw, 16px);
    line-height: 1.5;
    color: var(--ink-dim);
  }

  /* ---------- big edge arrows ----------
     Pinned to the left and right edges of the viewport and vertically centred,
     well clear of the card row (see .designers-panel's side padding, which
     reserves the lane they sit in). No plate behind them: at this size a white
     disc would read as a button floating over the roster rather than as a
     direction to go in. */
  .studio-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    width: clamp(38px, 3.4vw, 54px);
    height: clamp(38px, 3.4vw, 54px);
    border: none;
    background: transparent;
    padding: 0;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.3s ease, transform 0.36s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
  }
  .studio-nav svg { width: 100%; height: 100%; }
  .studio-nav:focus { outline: none; }
  .studio-nav:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 12px; }
  .studio-nav-prev { left: clamp(20px, 2.6vw, 48px); }
  .studio-nav-next { right: clamp(20px, 2.6vw, 48px); }
  .studio-nav:hover { color: var(--ink); transform: translateY(-50%) scale(1.12); }
  .studio-nav-prev:hover { transform: translateY(-50%) scale(1.12) translateX(-3px); }
  .studio-nav-next:hover { transform: translateY(-50%) scale(1.12) translateX(3px); }
  .studio-nav:active { transform: translateY(-50%) scale(0.95); }
  /* one studio, nowhere to go — the arrows go away rather than sit there dead */
  .designers-viewport.is-single-studio .studio-nav { display: none; }
  /* and in edit mode: the Add tile is a fourth card-sized tile, and four of
     them plus an arrow lane on each side would squeeze the cards well below the
     size this screen is built around. So the arrows stand down and give the row
     the room. The trade is that you press Done before you can move to another
     studio — acceptable, because edit mode is an explicit, focused state on
     your own studio and the other studio isn't editable anyway. */
  .designers-viewport.is-editing .studio-nav { display: none; }

  /* ---------- the sliding stage ---------- */
  .designers-stage-wrap {
    position: relative; /* the edge arrows anchor to this, not the viewport */
    flex: 0 1 auto;
    min-height: 0;
    overflow: hidden;
    display: flex;
  }
  .designers-stage {
    display: flex;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    transition: transform 0.72s cubic-bezier(0.19, 1, 0.22, 1);
  }
  .designers-panel {
    flex: 0 0 100%;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    /* the side padding is the lane the edge arrows live in — a card must never
       end up underneath one */
    padding: clamp(14px, 2vh, 28px) clamp(84px, 7vw, 130px) clamp(16px, 2.2vh, 30px);
    transition: padding 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    /* A studio bigger than fits stays one fixed row and scrolls sideways; it
       never turns into an auto-flowing track. The bar itself is hidden: the
       panel's width and padding are both animated (sliding between studios,
       entering edit mode), and every frame where the content is a pixel wider
       than the box would otherwise flash a scrollbar across the screen. */
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior: contain;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .designers-panel::-webkit-scrollbar { width: 0; height: 0; display: none; }
  /* no arrow lane to leave clear once the arrows are gone */
  .designers-viewport.is-editing .designers-panel {
    padding-left: clamp(36px, 4vw, 84px);
    padding-right: clamp(36px, 4vw, 84px);
  }

  /* Fixed, not a flowing track: the whole studio is on screen at once, and the
     row takes as much height as the screen will give it.

     The height is written by sizeAllRosters() rather than declared here: a
     card's width follows from its height (aspect-ratio), so the row has to be
     sized against the *narrower* of the two constraints, and how many tiles are
     in it is only known at render time — turning edit mode on adds one. CSS
     can't see that count, so it can't do this arithmetic. */
  .designer-roster {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: clamp(16px, 1.6vw, 36px);
    height: 100%;
    margin: auto; /* keeps a short row centred once the panel can scroll */
    transition: height 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* ---------- the card, and its two faces ----------
     Hover turns the card over: the portrait on the front, how to reach the
     person on the back. The card itself carries no border or background — each
     face does — or the frame would sit in front of whichever face is turned
     away. Height-first: the card takes the row's height and derives its width
     from the 1:1.4 ratio, so a shorter window shrinks the whole row evenly
     instead of overflowing. */
  .designer-card {
    position: relative;
    height: 100%;
    aspect-ratio: 1 / 1.4;
    flex: 0 0 auto;
    perspective: 1400px;
    font-family: 'Inter', sans-serif;
    cursor: default;
    transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .designer-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.66s cubic-bezier(0.32, 1, 0.3, 1);
  }
  /* :focus-within so tabbing to a link on the back turns the card and keeps it
     turned — otherwise the thing you are focused on is facing away from you */
  .designer-card:hover .designer-card-inner,
  .designer-card:focus-within .designer-card-inner { transform: rotateY(180deg); }
  /* while a studio is arranging its roster the card is an object, not something
     to read: it stays face-up and the whole surface opens the editor */
  .designer-card.is-editing { cursor: pointer; }
  .designer-card.is-editing .designer-card-inner { transform: none; }

  .designer-face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    border-radius: 26px;
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transition: box-shadow 0.34s ease, border-color 0.3s ease;
  }
  .designer-card:hover .designer-face { box-shadow: var(--shadow-hover); border-color: var(--border-strong); }
  .designer-card.is-active .designer-face { border-color: var(--ink); }
  .designer-face-back { transform: rotateY(180deg); }

  /* A real photo when there is one, a studio-tinted initials panel when there
     isn't — identical box either way, so a studio filling in photos over time
     never reflows the roster.

     Absolutely filling the card, not a flex row above the label: centred in the
     *photo box* put the initials well above the card's real centre, because the
     box stopped where the name/role bar began. Filling the card also lets a
     real photo bleed behind that bar instead of being cut off square at it. */
  .designer-photo {
    position: absolute;
    inset: 0;
    border-radius: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(46px, 6vw, 104px);
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1;
    color: var(--studio-color, var(--ink));
    background: var(--studio-tint, rgba(20, 20, 20, 0.05));
    background-size: cover;
    background-position: center;
  }
  .designer-photo.has-photo { color: transparent; }

  .designer-card-text {
    position: relative; /* above the photo, which now fills the card */
    margin-top: auto;
    background: var(--surface);
    padding: clamp(16px, 2.2vh, 26px) clamp(18px, 1.7vw, 28px) clamp(18px, 2.4vh, 28px);
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }
  .designer-name {
    font-size: clamp(17px, 1.5vw, 25px);
    font-weight: 650;
    line-height: 1.2;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .designer-role {
    font-size: clamp(12.5px, 1vw, 16px);
    color: var(--ink-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- the back face ----------
     Everything here has to fit without scrolling. A card that grows a scrollbar
     the moment you hover it is a card that flinches, and the bar itself lands
     on top of the link text — the one thing you turned the card over to read.
     Five links is the ceiling (DESIGNER_LINK_KINDS), so the metrics below are
     sized against exactly that. */
  .designer-face-back {
    justify-content: flex-start;
    gap: clamp(9px, 1.4vh, 15px);
    padding: clamp(16px, 2.2vh, 28px) clamp(15px, 1.5vw, 24px);
    overflow: hidden;
  }
  .designer-back-head { flex-shrink: 0; min-width: 0; }
  .designer-back-head .designer-name { white-space: normal; font-size: clamp(15px, 1.3vw, 21px); }
  .designer-back-head .designer-role { margin-top: 3px; white-space: normal; font-size: clamp(11.5px, 0.9vw, 14px); }

  .designer-links {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-height: 0;
    overflow: hidden; /* no scrollbar, in either axis, ever */
    margin: 0 -6px;
    padding: 0 6px;
  }
  .designer-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: clamp(4px, 0.7vh, 7px) 8px;
    margin: 0 -8px;
    border-radius: 9px;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: clamp(10.5px, 0.82vw, 12.5px);
    line-height: 1.3;
    flex-shrink: 0;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .designer-link:hover { background: rgba(20, 20, 20, 0.05); color: var(--ink); }
  .designer-link-icon { flex-shrink: 0; display: flex; color: var(--studio-color, var(--ink-dim)); }
  .designer-link-icon svg { width: clamp(12px, 1vw, 15px); height: clamp(12px, 1vw, 15px); }
  .designer-link-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .designer-links-empty { margin: 0; font-size: 12px; line-height: 1.5; color: var(--ink-faint); }

  /* the only thing on this screen that navigates — deliberately a button you
     have to aim at, not the whole card (see buildDesignerCard) */
  .designer-see-work {
    flex-shrink: 0;
    margin-top: auto;
    padding: clamp(7px, 1.1vh, 11px) 14px;
    border-radius: 999px;
    border: 1.5px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: clamp(11px, 0.9vw, 12.5px);
    font-weight: 650;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .designer-see-work:hover { background: var(--ink); color: #fff; transform: translateY(-1px); }
  .designer-see-work:active { transform: translateY(0) scale(0.97); }

  /* the pencil only exists on your own studio, and only once edit mode is on —
     browsing another studio's people should look like reading, not like a form
     you happen to lack permission for */
  .designer-edit-btn {
    position: absolute;
    z-index: 2; /* above .designer-card-inner, which is a 3D context */
    top: 14px;
    right: 14px;
    width: clamp(34px, 2.8vw, 46px);
    height: clamp(34px, 2.8vw, 46px);
    border-radius: 50%;
    border: none;
    background: rgba(20, 20, 20, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.24s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), background 0.24s ease;
  }
  .designer-edit-btn svg { width: 44%; height: 44%; }
  .designer-card:hover .designer-edit-btn,
  .designer-edit-btn:focus-visible { opacity: 1; transform: scale(1); }
  .designer-edit-btn:hover { background: var(--ink); }

  /* the add tile matches a card's footprint exactly so turning edit mode on
     doesn't resize the row */
  .designer-add-card {
    height: 100%;
    aspect-ratio: 1 / 1.4;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 30px;
    border-radius: 26px;
    border: 1.5px dashed var(--border-strong);
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: clamp(13px, 1.1vw, 17px);
    font-weight: 650;
    color: var(--ink-dim);
    cursor: pointer;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease, transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .designer-add-card svg { width: clamp(32px, 3vw, 48px); height: clamp(32px, 3vw, 48px); }
  .designer-add-card:hover { border-color: var(--ink); color: var(--ink); background: rgba(20, 20, 20, 0.02); transform: translateY(-6px); }
  .designer-add-card:active { transform: translateY(-2px) scale(0.99); }

  .designer-roster-empty {
    font-size: 15px;
    color: var(--ink-faint);
    text-align: center;
    align-self: center;
  }

  /* ---------- the studio caption ----------
     Below the roster, not above it: you look at the people first, then read
     whose they are. It reads as a caption too — the studio's mark, its name in
     the serif at display size, and the "yours" note as a small-caps aside.
     Nothing is boxed. */
  .studio-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 2.4vw, 34px);
    padding: clamp(10px, 1.6vh, 20px) max(6vw, 28px) clamp(14px, 2.2vh, 28px);
  }
  .studio-pager-current {
    display: flex;
    align-items: baseline;
    gap: clamp(10px, 1vw, 16px);
    min-width: 0;
  }
  /* the studio's logo where a colour dot used to be — a real mark reads as
     identity in a way a coloured circle never quite does. buildStudioMark()
     falls back to that circle when there is no file for a studio. */
  .studio-pager-mark {
    align-self: center;
    flex-shrink: 0;
    width: clamp(24px, 2vw, 32px);
    height: clamp(24px, 2vw, 32px);
    border-radius: 50%;
    background-color: var(--studio-tint, rgba(20, 20, 20, 0.06));
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.45s ease;
  }
  .studio-mark-dot {
    width: 42%;
    height: 42%;
    border-radius: 50%;
    background: var(--studio-color, var(--ink-dim));
  }
  .studio-pager-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(26px, 2.4vw, 40px);
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--ink);
    white-space: nowrap;
  }
  /* the quiet "this one's yours" marker — the same signal the edit toggle
     depends on, said in words so it isn't only implied by a button appearing */
  .studio-pager-you {
    font-size: clamp(9.5px, 0.72vw, 11px);
    font-weight: 650;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--studio-color, var(--ink-dim));
    white-space: nowrap;
  }
  .studio-pager-you:empty { display: none; }

  .roster-edit-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 20px 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: clamp(11.5px, 0.9vw, 13px);
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .roster-edit-toggle svg { width: 14px; height: 14px; }
  .roster-edit-toggle:hover { border-color: var(--border-strong); color: var(--ink); background: rgba(20, 20, 20, 0.035); }
  .roster-edit-toggle:active { transform: scale(0.96); }
  .roster-edit-toggle.is-on { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* ---------- add / edit dialog ----------
     Two columns at this size: the photo is the biggest decision on this form,
     so it gets its own half rather than a thumbnail wedged above the fields. */
  .designer-editor { position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .designer-editor-scrim { position: absolute; inset: 0; background: rgba(20, 20, 20, 0.38); }
  .designer-editor-card {
    position: relative;
    width: min(900px, 100%);
    max-height: calc(var(--floor-h) - 48px);
    overflow-y: auto;
    padding: clamp(26px, 3.2vw, 44px);
    border-radius: 28px;
    background: var(--surface);
    box-shadow: var(--shadow-hover);
    display: flex;
    flex-direction: column;
    gap: clamp(20px, 2.4vh, 30px);
  }
  .designer-editor-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(26px, 2.6vw, 38px);
    line-height: 1.1;
    color: var(--ink);
    margin: 0;
  }

  .editor-body {
    display: flex;
    gap: clamp(24px, 3vw, 42px);
    align-items: stretch;
  }
  .editor-photo-col {
    flex: 0 0 auto;
    width: clamp(180px, 18vw, 260px);
    display: flex;
    flex-direction: column;
  }
  .editor-photo-zone {
    position: relative; /* anchors the drag hint */
    width: 100%;
    aspect-ratio: 1 / 1.32;
    border-radius: 20px;
    border: 1.5px dashed var(--border-strong);
    background: var(--studio-tint, rgba(20, 20, 20, 0.04));
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(38px, 4vw, 58px);
    font-weight: 600;
    line-height: 1;
    color: var(--studio-color, var(--ink-faint));
    cursor: pointer;
    transition: border-color 0.25s ease, background-color 0.25s ease;
  }
  .editor-photo-zone.is-dragover { border-color: var(--ink); background-color: rgba(20, 20, 20, 0.06); }
  .editor-photo-zone.has-photo { border-style: solid; border-color: var(--border); color: transparent; }

  /* the fields sit level with the middle of the photo rather than tracking its
     top edge, so the two columns read as one form and not as two stacks */
  .editor-form-col {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(16px, 2vh, 26px);
  }

  .editor-photo-label { font-size: 13px; font-weight: 650; color: var(--ink); margin-bottom: 9px; }
  .editor-photo-hint { margin: 11px 0 13px; font-size: 12.5px; line-height: 1.55; color: var(--ink-faint); }
  .editor-photo-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: auto; }
  .editor-photo-actions .btn-ghost-sm { padding: 9px 16px; font-size: 12.5px; }

  .editor-field-label { font-size: 13px; font-weight: 650; color: var(--ink); margin-bottom: 8px; }
  .editor-field input {
    width: 100%;
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid var(--border-strong);
    background: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 15.5px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.22s ease;
  }
  .editor-field input:focus { border-color: var(--ink); }
  .editor-field input::placeholder { color: var(--ink-faint); }

  .editor-links { display: flex; flex-direction: column; }
  .editor-links-grid { display: flex; flex-direction: column; gap: 8px; }
  .editor-link-row { display: flex; align-items: center; gap: 10px; }
  .editor-link-row-icon { flex-shrink: 0; display: flex; color: var(--ink-faint); }
  .editor-link-row-icon svg { width: 16px; height: 16px; }
  .editor-link-row input {
    flex: 1 1 auto;
    min-width: 0;
    padding: 10px 13px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.22s ease;
  }
  .editor-link-row input:focus { border-color: var(--ink); }
  .editor-link-row input::placeholder { color: var(--ink-faint); }

  .editor-actions { display: flex; align-items: center; gap: 12px; }
  .editor-actions-spacer { flex: 1 1 auto; }
  .editor-delete-link { padding: 0; font-size: 13px; }
  .editor-actions .btn-ghost-sm { padding: 12px 24px; font-size: 14px; }
  .editor-save { padding: 13px 32px; font-size: 14.5px; }
  .editor-save:disabled { opacity: 0.4; cursor: not-allowed; }
  .editor-delete-confirm {
    padding: 18px 20px;
    border-radius: 18px;
    background: rgba(20, 20, 20, 0.04);
  }
  .editor-delete-confirm p { margin: 0 0 13px; font-size: 13.5px; line-height: 1.55; color: var(--ink-dim); }

  /* ---------- focal-point drag ----------
     A roster tile is a tall 1:1.32 crop of whatever was uploaded, which puts a
     face off-centre far more often than not. Rather than a crop dialog, the
     photo is dragged inside the frame it will actually appear in. */
  .is-focal-draggable { cursor: grab; touch-action: none; }
  .is-focal-draggable.is-dragging-focal { cursor: grabbing; }
  .focal-hint {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.96);
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(15, 15, 12, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: rgba(255, 255, 255, 0.95);
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .focal-hint svg { width: 13px; height: 13px; }
  .is-focal-draggable:hover .focal-hint { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  /* out of the way while you are actually doing the thing it described */
  .is-focal-draggable.is-dragging-focal .focal-hint { opacity: 0; }

  /* ---------- the "you're looking at one person's knowledge" chip ----------
     Appears on the Browse and Questions floors once someone is picked in
     Designers, and is the only way that filter is ever visible — an invisible
     filter is how a page ends up quietly lying about how much it's showing. */
  .questions-header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .author-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px 5px 5px;
    border-radius: 999px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .author-chip:hover { transform: translateY(-1px); }
  .author-chip:active { transform: translateY(0) scale(0.97); }
  .author-chip-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    background: var(--studio-color, rgba(255, 255, 255, 0.2));
  }
  .author-chip-clear { font-size: 11px; opacity: 0.65; }

  /* ======================================================================
     Share mode — the gallery area (not a separate page) swaps into a
     writing surface, then a small in-place "weave" moment, then back.
     ====================================================================== */
  .feed-main, .share-viewport, .designers-viewport {
    transition: opacity 0.3s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .mode-fade-out { opacity: 0; transform: scale(0.98); pointer-events: none; }

  .share-viewport {
    position: relative;
    height: var(--floor-h);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  .share-viewport .step {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    opacity: 1;
    transform: translateY(0) scale(1);
    transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .share-viewport .step.is-out { opacity: 0; transform: translateY(-9px) scale(0.993); pointer-events: none; }
  .share-viewport .step.is-pre-in { opacity: 0; transform: translateY(9px) scale(0.993); }
  /* reverse direction (weave -> compose, via "Share another"): mirrors
     is-out/is-pre-in so going back reads as an undo, not a repeat */
  .share-viewport .step.is-out-reverse { opacity: 0; transform: translateY(9px) scale(0.993); pointer-events: none; }
  .share-viewport .step.is-pre-in-reverse { opacity: 0; transform: translateY(-9px) scale(0.993); }

  /* ---------- STEP 1 — compose ----------
     One screen, no scrolling. This used to be a single column in a scroller,
     which meant that by the time you were writing the last field, the title
     and the type you had picked were both off the top of the window — and
     there was nowhere to show you what you were actually making.

     Everything is sized off the viewport instead. The head and the footer take
     what they need, .compose-body takes the rest, and the textareas inside it
     share whatever that leaves. min-height on the textareas is the floor: they
     never get so short that a sentence is cut off, even if that means the
     window has to be a reasonable size. */
  .step-compose { display: flex; flex-direction: column; height: 100%; min-height: 0; }

  /* 64px of top padding, not 34: the hamburger and the back arrow are fixed at
     y=24 and this heading is the first thing under them. */
  .compose-head { flex-shrink: 0; padding: 64px max(4vw, 26px) 0; }
  .compose-head h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(28px, 3vw, 38px);
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .compose-head p { margin: 0; max-width: 620px; font-size: 13.5px; line-height: 1.6; color: var(--ink-dim); }
  /* a short window spends its height on the fields, not on the preamble */
  @media (max-height: 840px) {
    .compose-head { padding-top: 56px; }
    .compose-head p { display: none; }
  }

  .compose-body {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 67fr) minmax(320px, 33fr);
    gap: clamp(24px, 2.6vw, 44px);
    padding: 22px max(4vw, 26px) 0;
  }

  .compose-left { min-height: 0; display: flex; flex-direction: column; gap: 16px; }
  .compose-right { min-height: 0; display: flex; flex-direction: column; gap: 16px; }

  /* the per-type fields share the leftover height between them */
  /* The invariant here is: the page never scrolls, and a textarea is never
     shorter than 104px. Those two can conflict — four fields at their floor
     need more height than a 768px window has left after the heading, title,
     type picker and footer — so the field stack, and only the field stack,
     scrolls when it has to. The preview, the type picker and the submit button
     never move, which is the part that actually mattered: you always see what
     you are making and how to finish it.

     At a comfortable window size there is nothing to scroll and this is inert. */
  .compose-fields {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .compose-fields .field { flex: 1 1 auto; min-height: 0; }
  .compose-fields textarea {
    flex: 1 1 auto;
    min-height: clamp(104px, 12vh, 132px);
    resize: none;
  }

  .field-type .type-picker, .field-asked-to .asked-to-picker { margin-top: 2px; }

  /* ---------- who a question is addressed to ----------
     Everything here is asked of somebody, and "everyone" is a real answer
     rather than the absence of one — so it is a choice with a default, not a
     checkbox you can leave alone. */
  .asked-to-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .asked-to-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--ink-dim);
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .asked-to-pill:hover { border-color: var(--border-strong); color: var(--ink); }
  .asked-to-pill.is-active { background: var(--ink); border-color: var(--ink); color: #ffffff; }
  .asked-to-pill .card-dot { width: 7px; height: 7px; box-shadow: none; }

  /* ---------- the preview column ---------- */
  .preview-pane { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .preview-pane-head {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .preview-modes { display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: rgba(20, 20, 20, 0.05); }
  .preview-mode {
    padding: 4px 11px;
    border: none;
    border-radius: 999px;
    background: transparent;
    font-family: inherit;
    font-size: 11px;
    color: var(--ink-faint);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .preview-mode:hover { color: var(--ink-dim); }
  .preview-mode.is-active { background: #ffffff; color: var(--ink); box-shadow: 0 1px 3px rgba(20, 20, 20, 0.1); }

  /* ---------- banner mode ----------
     The floor-1 cover at preview size: wide, the title set as large as the
     frame allows, and the same scrim underneath it. Not a scaled screenshot —
     the same .card-media / .card-scrim / .card-content pieces, so what you see
     here is what floor 1 will do with it. */
  /* Top of the column, not floating in the middle of it. The banner is much
     shorter than the card, and centring it in the leftover height made the
     preview look like it had come loose from its own heading. */
  .preview-card-wrap.is-banner { align-items: flex-start; }
  .preview-card.is-banner {
    flex: 0 0 auto;
    width: 100%;
    aspect-ratio: 16 / 10;
    min-height: 0;
    align-self: flex-start;
  }
  .preview-card.is-banner .card-content { padding: 16px 18px 18px; }
  .preview-card.is-banner .card-title {
    font-size: clamp(15px, 2.1vw, 24px);
    line-height: 1.14;
    letter-spacing: -0.015em;
    /* the cover's title is the loudest thing on the screen; past four lines
       this preview would be nothing but type */
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .preview-card.is-banner .card-meta { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
  .preview-card.is-banner .preview-focus { display: none; }

  .preview-pane-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
  }
  .preview-card-wrap { flex: 1 1 auto; min-height: 0; display: flex; }

  /* Deliberately the same card-media / card-scrim / card-content pieces the
     real poster uses, at whatever size this column happens to be — so the
     preview cannot drift away from the thing it is previewing. */
  .preview-card {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface);
    box-shadow: var(--shadow-resting);
  }
  .preview-card .card-content {
    position: absolute;
    inset: auto 0 0 0;
    padding: 20px 20px 22px;
    z-index: 2;
  }
  .preview-card .card-meta { margin-bottom: 10px; font-size: 11.5px; }
  .preview-card .card-title {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 17px;
    line-height: 1.3;
    color: #ffffff;
  }
  .preview-card .card-title:empty::after {
    content: attr(data-placeholder);
    color: rgba(255, 255, 255, 0.45);
    font-weight: 500;
  }

  /* Only the field you are in right now. Showing the whole body would make
     this a second, smaller copy of the form you are already looking at; the
     point is to answer "how does what I am typing read on a card". */
  .preview-focus {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.22);
    transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .preview-focus.is-swapping { opacity: 0; transform: translateY(6px); }
  .preview-focus-label {
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.62);
    margin-bottom: 6px;
  }
  .preview-focus-text {
    margin: 0;
    font-size: 12.5px;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.9);
    /* the line breaks they typed are part of what they wrote */
    white-space: pre-wrap;
    /* the card is short; past a few lines this is a teaser, not the text */
    display: -webkit-box;
    -webkit-line-clamp: 7;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .preview-focus-text:empty::after {
    content: attr(data-placeholder);
    color: rgba(255, 255, 255, 0.42);
  }

  .preview-media { position: absolute; inset: 0; }
  .preview-media.has-image { cursor: grab; }
  .preview-media.is-dragging { cursor: grabbing; }
  .preview-drag-hint {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 3;
    display: none;
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(20, 20, 20, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-size: 10.5px;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.9);
    pointer-events: none;
  }
  .preview-card.has-image .preview-drag-hint { display: block; }

  /* ---------- image + attachments, side by side under the preview ----------
     Each takes only the height it needs. No thumbnail on the image side: the
     picture is already the entire background of the preview above it, and a
     second small copy of it would just be a second small copy of it. */
  .compose-attach-row {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding-bottom: 4px;
  }
  .compose-attach-col { min-width: 0; }
  .file-slot { display: flex; flex-direction: column; gap: 7px; }
  .file-slot-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 12px;
    border: 1.5px dashed var(--border-strong);
    border-radius: 12px;
    background: rgba(20, 20, 20, 0.015);
    font-family: inherit;
    font-size: 12px;
    color: var(--ink-faint);
    cursor: pointer;
    text-align: left;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }
  .file-slot-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .file-slot-btn:hover { border-color: var(--ink-dim); color: var(--ink-dim); background: rgba(20, 20, 20, 0.03); }
  .file-slot.is-dragover .file-slot-btn { border-color: var(--ink); background: rgba(20, 20, 20, 0.045); color: var(--ink-dim); }
  .file-slot-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #ffffff;
  }
  .file-slot-name {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-slot-remove {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .file-slot-remove svg { width: 13px; height: 13px; }
  .file-slot-remove:hover { background: rgba(20, 20, 20, 0.07); color: var(--ink); }

  /* the attachment list lives inside its slot now, so it has its own cap
     rather than pushing the footer off the screen */
  #attachmentZone .attachment-list { max-height: 108px; overflow-y: auto; margin-top: 0; }

  /* A four-field type needs about 530px for its boxes, and a 768px-tall window
     has about 440 to give once the heading, title, type picker and footer have
     taken theirs. Something has to give, and it is not the 104px floor — a
     textarea you cannot read two lines in is worse than a short scroll.

     So the field stack scrolls, and only the field stack. The preview, the type
     picker and the submit button stay where they are, which is the part that
     actually mattered about not scrolling: you never lose sight of what you are
     making or how to finish it. */
  /* a short window spends what it has on the fields */
  @media (max-height: 900px) {
    .compose-head h1 { font-size: clamp(24px, 2.4vw, 30px); }
    .compose-body { padding-top: 16px; }
  }

  /* Under this the two panes are too narrow to be two panes: the preview goes
     under the writing and the whole composer becomes one scroller again —
     which is the one case where scrolling beats clipping. */
  @media (max-width: 1080px) {
    .compose-body {
      grid-template-columns: minmax(0, 1fr);
      overflow-y: auto;
      padding-bottom: 20px;
    }
    .compose-fields .field { flex: 0 0 auto; }
    .preview-card { min-height: 340px; }
  }

  .field { display: flex; flex-direction: column; }
  .field-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .field-label .optional { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink-faint); opacity: 0.75; }

  .field-title input {
    width: 100%;
    border: none;
    border-bottom: 1.5px solid var(--border-strong);
    background: transparent;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 30px;
    padding: 4px 2px 14px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.3s ease;
  }
  .field-title input:focus { border-color: var(--ink); }
  .field-title input::placeholder { color: var(--ink-faint); font-weight: 500; }

  .type-picker { display: flex; gap: 10px; flex-wrap: wrap; }
  .type-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-dim);
    cursor: pointer;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .type-pill svg { width: 15px; height: 15px; }
  .type-pill:hover { border-color: var(--border-strong); color: var(--ink); transform: translateY(-1px); }
  .type-pill:active { transform: translateY(0) scale(0.97); }
  .type-pill.is-active { border-color: var(--ink); color: var(--ink); background: rgba(20, 20, 20, 0.05); }

  .share-viewport textarea {
    width: 100%;
    /* min-height and resize belong to .compose-fields textarea, which is where
       the per-field sizing is decided. They were here too, at equal
       specificity and later in the file, so they quietly won. */
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--ink);
    background: #ffffff;
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .share-viewport textarea:focus { border-color: var(--border-strong); box-shadow: 0 4px 16px -8px rgba(20, 20, 20, 0.12); }
  .share-viewport textarea::placeholder { color: var(--ink-faint); }

  .tag-input-wrap {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #ffffff;
    transition: border-color 0.3s ease;
  }
  .tag-input-wrap:focus-within { border-color: var(--border-strong); }
  .tag-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 500;
    padding: 5px 8px 5px 12px;
    border-radius: 999px;
    background: rgba(20, 20, 20, 0.05);
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .tag-chip button { border: none; background: transparent; color: inherit; cursor: pointer; font-size: 12px; line-height: 1; padding: 2px; opacity: 0.55; }
  .tag-chip button:hover { opacity: 1; }
  #tagInput {
    flex: 1;
    min-width: 140px;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 5px 4px;
    color: var(--ink);
  }
  #tagInput::placeholder { color: var(--ink-faint); }

  .upload-dropzone {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 22px 20px;
    border: 1.5px dashed var(--border-strong);
    border-radius: 16px;
    background: rgba(20, 20, 20, 0.015);
    color: var(--ink-faint);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.3s ease, background 0.3s ease, color 0.3s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .upload-dropzone:hover { border-color: var(--ink-dim); color: var(--ink-dim); background: rgba(20, 20, 20, 0.03); transform: translateY(-1px); }
  .upload-dropzone:focus-visible { outline: 2px solid var(--ink-dim); outline-offset: 2px; }
  .upload-dropzone svg { width: 22px; height: 22px; }
  /* actively dragging a file over the zone — a clearer highlight than :hover
     alone, so the drop target reads as "yes, here" while a file is over it */
  .upload-dropzone.is-dragover { border-color: var(--ink); background: rgba(20, 20, 20, 0.045); color: var(--ink-dim); }
  /* icon + hint text used to be direct flex children of .upload-dropzone
     (stacked in its flex column); wrapping them so the preview media could
     be a plain sibling means this wrapper needs the same column layout */
  .upload-dropzone-default { display: flex; flex-direction: column; align-items: center; gap: 8px; }

  /* item 7 fix — a `background-image` div instead of an <img object-fit>,
     matching the same technique every other image-bearing card in this app
     already uses (see .card-media.has-image): a plain <img> with
     object-fit inside a non-positioned ancestor was clipping inconsistently
     for some source images, which is what read as "upload turns blank". */
  .upload-preview-media { display: none; width: 100%; height: 170px; border-radius: 14px; background-size: cover; background-position: center; }
  .upload-dropzone.has-preview {
    padding: 0;
    border-style: solid;
    border-color: var(--border);
    overflow: hidden;
  }
  .upload-dropzone.has-preview:hover { border-color: var(--border-strong); }
  .upload-dropzone.has-preview .upload-dropzone-default { display: none; }
  .upload-dropzone.has-preview .upload-preview-media { display: block; }

  /* Replace/Remove — always-visible controls once an image is in, so the
     border/frame plus these two buttons keep the upload area unmistakable
     even when it's showing a photo rather than the empty dashed state. */
  .upload-preview-actions {
    position: absolute;
    right: 10px;
    bottom: 10px;
    z-index: 2;
    display: none;
    gap: 8px;
  }
  .upload-dropzone.has-preview .upload-preview-actions { display: flex; }
  .upload-action-btn {
    padding: 7px 13px;
    border-radius: 999px;
    border: none;
    background: rgba(15, 15, 12, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 11.5px;
    font-weight: 650;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .upload-action-btn:hover { background: rgba(15, 15, 12, 0.75); transform: translateY(-1px); }
  .upload-action-btn-remove:hover { background: #b91c1c; }

  /* ---------- attachments (item 8) — a second, separate dropzone: file
     name/icon/size in a plain list instead of a visual preview, since these
     are meant to be opened (a PDF, a doc), not looked at inline. ---------- */
  .attachment-dropzone { padding: 16px 20px; }
  .attachment-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .attachment-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
  }
  .attachment-item-icon {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(20, 20, 20, 0.06);
    color: var(--ink-dim);
  }
  .attachment-item-icon svg { width: 15px; height: 15px; }
  .attachment-item-info { flex: 1; min-width: 0; }
  .attachment-item-name {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .attachment-item-size { font-size: 11px; color: var(--ink-faint); }
  .attachment-item-remove {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    border-radius: 7px;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .attachment-item-remove:hover { color: var(--ink-dim); background: rgba(20, 20, 20, 0.06); }
  .attachment-item-remove svg { width: 13px; height: 13px; }

  /* ---------- Attachments as shown in a card's own detail view ---------- */
  .attachments-list-wrap { display: flex; flex-direction: column; gap: 8px; }
  .attachment-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .attachment-link:hover { border-color: var(--border-strong); background: rgba(20, 20, 20, 0.02); }
  .qd-attachments:not(:empty) { margin-top: 10px; }

  /* the extra right padding is the language switcher's lane: it is fixed in
     that corner on every screen, and the submit button was landing on it */
  /* the "what exists now" block on the completion screen */
  .weave-state {
    margin: 22px auto 26px;
    padding: 18px 22px;
    max-width: 420px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: rgba(20, 20, 20, 0.02);
    text-align: left;
  }
  .weave-state-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .weave-state-row + .weave-state-row { margin-top: 8px; }
  .weave-state-mark {
    flex-shrink: 0;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--border-strong);
  }
  .weave-state-note {
    margin: 14px 0 0;
    padding-top: 13px;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--ink-faint);
  }

  .compose-footer { flex-shrink: 0; padding: 14px max(6vw, 92px) 18px 14px; padding-left: max(4vw, 26px); border-top: 1px solid var(--border); background: var(--surface); }
  .compose-footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .compose-hint { font-size: 12.5px; color: var(--ink-faint); }

  /* ---------- shared buttons (compose + weave) ---------- */
  .btn-weave {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    border-radius: 999px;
    border: none;
    background: var(--ink);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 650;
    letter-spacing: 0.01em;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: 0 14px 30px -14px rgba(20, 20, 20, 0.4);
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease, opacity 0.3s ease;
  }
  .btn-weave:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -14px rgba(20, 20, 20, 0.45); }
  .btn-weave:active { transform: translateY(0) scale(0.97); }
  .btn-weave:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-weave svg { width: 14px; height: 14px; }

  .btn-ghost {
    padding: 12px 20px;
    border-radius: 999px;
    border: 1.5px solid var(--border-strong);
    background: transparent;
    color: var(--ink-dim);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .btn-ghost:hover { border-color: var(--ink); color: var(--ink); background: rgba(20, 20, 20, 0.03); transform: translateY(-1px); }
  .btn-ghost:active { transform: translateY(0) scale(0.97); }

  /* ---------- STEP 2/3 — the weave ---------- */
  .step-weave { padding: 0; }
  .weave-canvas-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 42%, rgba(55, 138, 221, 0.05), transparent 60%),
      radial-gradient(ellipse 55% 45% at 78% 30%, rgba(216, 90, 48, 0.04), transparent 60%),
      radial-gradient(ellipse 55% 45% at 30% 78%, rgba(29, 158, 117, 0.04), transparent 60%);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .weave-canvas-wrap.is-pulsing { transform: scale(1.015); }
  #weaveCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .weave-caption {
    position: absolute;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 16px;
    color: var(--ink-dim);
    opacity: 0;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .weave-caption.is-visible { opacity: 1; }
  .weave-confirm {
    flex-shrink: 0;
    text-align: center;
    padding: 24px max(6vw, 28px) 36px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .weave-confirm.is-visible { opacity: 1; transform: translateY(0); }
  .weave-confirm-inner { max-width: 560px; margin: 0 auto; }
  .weave-confirm h2 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 23px; letter-spacing: -0.005em; margin: 0 0 8px; color: var(--ink); }
  .weave-confirm p { margin: 0 0 20px; font-size: 13px; color: var(--ink-faint); }
  .weave-actions { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="menu-overlay" id="menuOverlay">
  <button type="button" class="menu-close" id="menuCloseBtn" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
  </button>
  <nav class="menu-list" id="menuList"></nav>
</div>

<div class="toast" id="toast"></div>

<!-- ---------- the fixed chrome ----------
     Everything here is pinned to the screen rather than to a floor, and all of
     it lives outside .app: .app takes a transform during the page-to-page
     hand-off, and a transformed ancestor turns position:fixed into
     position:absolute.

     There is no top bar. Every function one used to carry has a permanent home
     in a corner instead: navigation top-left, Share and the way out
     bottom-left, language bottom-right, this floor's own tools bottom-centre.
     A bar that appears on two of three floors to say "Loom" was costing the
     other floor 98px and telling nobody anything. -->

<!-- Top-right: the other half of the loop. Opposite the hamburger, above
     everything, on every screen — see renderNotificationIndicator. -->
<div class="notify-corner" id="notifyCorner">
  <div class="notify-toast" id="notifyToast" role="status">
    <span class="notify-toast-dot" id="notifyToastDot"></span>
    <span class="notify-toast-text" id="notifyToastText"></span>
  </div>
  <button type="button" class="icon-ghost notify-btn" id="notifyBtn" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 9a6 6 0 1 0-12 0c0 5-2 6.5-2 6.5h16S18 14 18 9"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/>
    </svg>
    <span class="notify-count" id="notifyCount"></span>
    <span class="notify-dots" id="notifyDots"></span>
  </button>
</div>

<aside class="for-you-panel" id="forYouPanel" aria-labelledby="forYouTitle">
  <div class="for-you-head">
    <h2 id="forYouTitle"></h2>
    <button type="button" class="for-you-mark-all" id="forYouMarkAll"></button>
    <button type="button" class="for-you-close" id="forYouCloseBtn" aria-label="Close">
