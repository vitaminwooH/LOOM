   while you were away stays grouped for the whole session. Stamping it on
   every open would mean the section emptied itself the moment you looked at
   it, which is the opposite of what it is for.

   TODO(backend): the server knows when a session last ended and can group by
   that rather than by whatever this browser last wrote. */
const LAST_VISIT_STORAGE_KEY = 'loom_last_visit';

// Captured before anything else writes to it — see initLastVisit.
let lastVisitAt = 0;
/* When this session began. Everything at or after it arrived while the reader
   was sitting here, which is the opposite of "while you were away" — see
   renderForYouList. */
let sessionStartedAt = 0;

function initLastVisit() {
  try {
    const raw = localStorage.getItem(LAST_VISIT_STORAGE_KEY);
    lastVisitAt = raw ? Number(raw) || 0 : 0;
  } catch (err) {
    lastVisitAt = 0;
  }
  sessionStartedAt = Date.now();
  safeSetItem(LAST_VISIT_STORAGE_KEY, String(sessionStartedAt));
}

/* ---------- the lineage strip ----------
   A chain of *writing*: what this piece came out of, and what came out of it.
   Every node is a card someone wrote — an Update, a Project, an Experiment, a
   Question. A studio is never a node.

   That distinction is the whole point. "This knowledge → DoubleU → Whow" looks
   like a lineage and is really an attendance list: a company is who wrote
   something, not a step in how an idea travelled. The step is the other piece
   of work, and if there is no other piece of work then nothing travelled yet
   and the strip should say so. Which studio and which person is metadata
   *inside* a node, next to its colour dot, where authorship belongs.

   Reactions are deliberately absent. "We'll try this" is a conversation, and a
   conversation is not a derivation — see the reactions block above, which is
   where that lives and stays.

   Laid out with flex, no pan, no zoom, no automatic layout; if it overflows it
   scrolls sideways, and that is the entire interaction model. */
const LINEAGE_RELATIONS = ['appliedFrom', 'inspiredBy', 'continuedFrom', 'builtOn', 'solvedThrough'];
const LINEAGE_DEFAULT_RELATION = 'continuedFrom';

// The relation a card claims about its own parent, or the neutral one. Seeded
// cards written before relations existed simply say "continued from".
function lineageRelationOf(card) {
  const r = card && card.derivedRelation;
  return LINEAGE_RELATIONS.indexOf(r) >= 0 ? r : LINEAGE_DEFAULT_RELATION;
}

function lineageParentOf(card) {
  if (!card || !card.derivedFrom) return null;
  const parent = cardById(card.derivedFrom);
  return parent && parent.id !== card.id ? parent : null;
}

function lineageChildrenOf(card) {
  return ALL_CARDS.filter((c) => c.derivedFrom === card.id && c.id !== card.id);
}

// How much further this branch goes. Used to pick which child continues the
// strip: a chain that carries on for two more steps is a better answer to
// "where did this go" than one that stops immediately.
function lineageBranchDepth(card, blocked) {
  const visited = new Set(blocked);
  const walk = (c) => {
    if (visited.has(c.id)) return 0;
    visited.add(c.id);
    let deepest = 0;
    lineageChildrenOf(c).forEach((kid) => { deepest = Math.max(deepest, 1 + walk(kid)); });
    return deepest;
  };
  return walk(card);
}

/* The chain around one card. Each entry carries the card and the relation of
   the edge that *precedes* it reading left to right, so the strip can be laid
   out as node, arrow-with-a-label, node without any of the callers knowing
   which direction they are walking. */
function lineageChain(data, maxEach, preferId) {
  const cap = maxEach || 2;
  const seen = new Set([data.id]);

  const before = [];
  let cursor = data;
  while (before.length < cap) {
    const parent = lineageParentOf(cursor);
    if (!parent || seen.has(parent.id)) break;
    seen.add(parent.id);
    // the edge parent → cursor is described by cursor's own relation
    before.unshift({ card: parent, relationAfter: lineageRelationOf(cursor) });
    cursor = parent;
  }

  const after = [];
  cursor = data;
  while (after.length < cap) {
    const kids = lineageChildrenOf(cursor).filter((c) => !seen.has(c.id));
    if (!kids.length) break;
    kids.sort((a, b) => lineageBranchDepth(b, seen) - lineageBranchDepth(a, seen));
    // A link you just made goes first whatever its depth. Pressing save and
    // watching the strip not change is indistinguishable from it not working.
    const next = kids.find((c) => c.id === preferId) || kids[0];
    seen.add(next.id);
    after.push({ card: next, relationBefore: lineageRelationOf(next) });
    cursor = next;
  }

  return { before, after };
}

/* Everything this card is connected to by an actual link, for the summary line
   underneath: the chain, plus any sibling branch or related idea the linear
   strip had no room for. Cards, never studios. */
function lineageConnectedCards(data) {
  const byId = new Map();
  const add = (card) => { if (card && card.id !== data.id) byId.set(card.id, card); };

  const { before, after } = lineageChain(data);
  before.forEach((n) => add(n.card));
  after.forEach((n) => add(n.card));
  connectedIndices(data).forEach((i) => add(ALL_CARDS[i]));

  return Array.from(byId.values());
}

function lineageSummaryText(data) {
  const works = lineageConnectedCards(data);
  const studios = new Set(works.map((c) => c.studio));
  return t().lineageSummary(works.length, studios.size);
}

/* One node: what kind of writing it is, what it says, and — as metadata, in
   small type — whose it is. */
function lineageNodeEl(card, isSelf, note) {
  const el = document.createElement(isSelf ? 'div' : 'button');
  if (!isSelf) el.type = 'button';
  el.className = 'lineage-node' + (isSelf ? ' is-self' : '');

  const studio = STUDIOS[card.studio];
  const color = studio ? studio.color : 'var(--ink)';
  el.style.setProperty('--node-studio', color);

  const type = document.createElement('span');
  type.className = 'lineage-node-type';
  type.textContent = t().types[card.type] || card.type;

  const title = document.createElement('span');
  title.className = 'lineage-node-title';
  title.textContent = truncateForSummary(cardText(card).title || '', 64);

  const meta = document.createElement('span');
  meta.className = 'lineage-node-meta';
  const dot = document.createElement('span');
  dot.className = 'lineage-node-dot';
  dot.style.background = color;
  meta.appendChild(dot);
  const who = document.createElement('span');
  who.textContent = (studio ? studio.name : '') + (card.author ? ' · ' + card.author : '');
  meta.appendChild(who);

  el.appendChild(type);
  el.appendChild(title);
  el.appendChild(meta);

  // What the studio that made this link says changed. Only on the node the
  // link belongs to, and only when they bothered to write one.
  if (note) {
    const n = document.createElement('span');
    n.className = 'lineage-node-note';
    n.textContent = note;
    el.appendChild(n);
  }

  if (isSelf) {
    const here = document.createElement('span');
    here.className = 'lineage-node-here';
    here.textContent = t().lineageStrip.thisOne;
    el.insertBefore(here, type);
  } else {
    el.addEventListener('click', () => openCardById(card.id));
  }
  return el;
}

function lineageArrowEl(relation) {
  const wrap = document.createElement('span');
  wrap.className = 'lineage-arrow';
  const label = document.createElement('span');
  label.className = 'lineage-arrow-label';
  const rel = t().lineageRelations[relation] || t().lineageRelations[LINEAGE_DEFAULT_RELATION];
  label.textContent = rel.forward;
  const glyph = document.createElement('span');
  glyph.className = 'lineage-arrow-glyph';
  glyph.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h14M13 6l6 6-6 6"/></svg>';
  wrap.appendChild(glyph);
  wrap.appendChild(label);
  return wrap;
}

function renderLineageStrip(data, preferId) {
  paintLineageStrip(document.getElementById('lineageStrip'), data, preferId);
}

// Same strip, any container — the resolved-question panel draws one too, and
// two copies of this drifting apart is exactly how a preview stops matching
// the thing it previews.
function paintLineageStrip(wrap, data, preferId) {
  if (!wrap) return;
  wrap.innerHTML = '';

  const { before, after } = lineageChain(data, 2, preferId);

  if (!before.length && !after.length) {
    const empty = document.createElement('p');
    empty.className = 'lineage-empty';
    empty.textContent = t().lineageStrip.empty;
    wrap.appendChild(empty);
    return;
  }

  before.forEach((n) => {
    wrap.appendChild(lineageNodeEl(n.card, false, ''));
    wrap.appendChild(lineageArrowEl(n.relationAfter));
  });
  wrap.appendChild(lineageNodeEl(data, true, data.derivedFrom ? data.derivedNote : ''));
  after.forEach((n) => {
    wrap.appendChild(lineageArrowEl(n.relationBefore));
    wrap.appendChild(lineageNodeEl(n.card, false, n.card.derivedNote || ''));
  });
}

function renderBodySections(wrap, data, text) {
  wrap.innerHTML = '';
  fieldsFor(data.type).forEach((key) => {
    const value = bodyValue(text, data.type, key);
    if (!value) return; // a heading with nothing under it is worse than no heading

    const section = document.createElement('div');
    section.className = 'expanded-section';

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = fieldStrings(data.type, key).label;

    const p = document.createElement('p');
    p.textContent = value;

    section.appendChild(label);
    section.appendChild(p);
    wrap.appendChild(section);
  });
  // (attachments render in #attachmentsSection via renderAttachmentsInto,
  //  which reads both the canvas-sync shape and the share-form shape)
}

function resetDeleteConfirm() {
  document.getElementById('deleteCardBtn').style.display = 'flex';
  document.getElementById('deleteConfirmBox').style.display = 'none';
}

/* ======================================================================
   8b. Question detail — the two-pane Conversation + Conversation Brief
   that takes over the expanded-card shell for Question-type cards. See
   populateExpanded for the branch that routes here.
   ====================================================================== */
let questionActiveTab = 'conversation'; // only visually matters once the narrow container-query layout kicks in

function switchQuestionTab(pane) {
  questionActiveTab = pane;
  document.querySelectorAll('.question-tab').forEach((b) => b.classList.toggle('is-active', b.dataset.pane === pane));
  document.getElementById('paneConversation').classList.toggle('is-active-tab', pane === 'conversation');
  document.getElementById('paneBrief').classList.toggle('is-active-tab', pane === 'brief');
}

function conversationMessageEl(msg) {
  const studio = STUDIOS[msg.studio];
  const color = studio ? studio.color : 'var(--ink)';
  const timeText = msg.justNow ? t().justNow : formatRelativeTime(currentLang, msg.timeValue, msg.timeUnit);
  const isMe = msg.author === myDisplayName();
  const el = document.createElement('div');
  el.className = 'conversation-message' + (isMe ? ' is-me' : '');
  el.style.setProperty('--speaker-color', color);
  // designerInitials, not a bespoke split: the same two letters this person
  // gets on the roster, so the two surfaces agree about who they are.
  el.innerHTML = `
    <span class="conversation-avatar"></span>
    <div class="conversation-message-body">
      <div class="conversation-message-meta">
        <span class="card-dot" style="background:${color}"></span>
        <span class="conversation-message-author"></span>
        <span class="sep">·</span>
        <span>${studio ? studio.name : ''}</span>
        <span class="sep">·</span>
        <span>${timeText}</span>
      </div>
      <div class="conversation-message-bubble"></div>
    </div>
  `;
  el.querySelector('.conversation-avatar').textContent = designerInitials(msg.author);
  el.querySelector('.conversation-message-author').textContent = msg.author;
  el.querySelector('.conversation-message-bubble').textContent = msg.text;
  return el;
}

function renderConversation(data) {
  const wrap = document.getElementById('conversationScroll');
  wrap.innerHTML = '';
  getConversationMessages(data).forEach((msg) => wrap.appendChild(conversationMessageEl(msg)));
  wrap.scrollTop = wrap.scrollHeight;
}

function renderBrief(data) {
  const brief = getConversationBrief(data);
  const body = document.getElementById('briefBody');
  const s = t().brief;

  /* No Confirm button. Asking a reader to sign off on a summary they did not
     write turns a convenience into a small piece of unpaid review work, and an
     unconfirmed brief then reads as untrustworthy rather than simply recent.
     The header says what it is and when it last changed; that is the whole
     claim being made. */
  document.getElementById('briefAiLabel').textContent = s.aiGenerated;
  document.getElementById('briefUpdated').textContent = s.lastUpdated(2); // sample-fixed — see the TODO on getConversationBrief

  if (!brief) {
    body.innerHTML = `<p class="brief-empty">${s.notEnoughYet}</p>`;
    return;
  }
  body.innerHTML = `
    <div class="brief-section"><div class="label">${s.currentIssue}</div><p>${brief.currentIssue}</p></div>
    <div class="brief-section"><div class="label">${s.keyIdeas}</div><ul>${brief.keyIdeas.map((x) => `<li>${x}</li>`).join('')}</ul></div>
    <div class="brief-section"><div class="label">${s.openPoints}</div><ul>${brief.openPoints.map((x) => `<li>${x}</li>`).join('')}</ul></div>
    <div class="brief-section"><div class="label">${s.nextAction}</div><p>${brief.nextAction}</p></div>
    <div class="brief-section"><div class="label">${s.status}</div><p>${statusBadgeHTML(data) || t().status[data.status] || ''}</p></div>
  `;
}

/* Questions have their own detail pane and no edit/delete row of their own, so
   the shared row is left hidden — and has to be left *empty* too. See the note
   in populateExpanded. */
function clearExpandedDeleteRow() {
  const row = document.getElementById('expandedDeleteRow');
  if (!row) return;
  row.style.display = 'none';
  row.dataset.cardId = '';
}

function populateQuestionDetail(data) {
  clearExpandedDeleteRow();
  const studio = STUDIOS[data.studio];
  document.getElementById('expandedCard').style.setProperty('--studio-color', studio.color);
  document.getElementById('qdDot').style.background = studio.color;
  document.getElementById('qdStudioName').textContent = studio.name;
  setAuthorSlot(document.getElementById('qdAuthor'), data.author);
  document.getElementById('qdTime').textContent = data.justNow ? t().justNow : formatRelativeTime(currentLang, data.timeValue, data.timeUnit);
  document.getElementById('qdStatusBadge').innerHTML = statusBadgeHTML(data);
  document.getElementById('qdTitle').textContent = cardText(data).title;
  renderLangPendingBadge(document.getElementById('qdLangBadge'), data);
  renderAttachmentsInto(document.getElementById('qdAttachmentsWrap'), data);

  const deleteBtn = document.getElementById('qdDeleteBtn');
  deleteBtn.style.display = data.isShared ? 'flex' : 'none';
  deleteBtn.dataset.cardId = data.isShared ? data.id : '';

  document.getElementById('qTabConversation').textContent = t().conversationUi.tabLabel;
  document.getElementById('qTabBrief').textContent = t().conversationUi.briefTabLabel;
  document.getElementById('conversationInput').placeholder = t().conversationUi.inputPlaceholder;
  document.getElementById('conversationSendBtn').textContent = t().conversationUi.sendButton;
  switchQuestionTab('conversation');

  renderResolvedNext(data);
  renderConversation(data);
  renderBrief(data);
}

/* ---- what follows an answer ----
   A resolved question is where knowledge quietly stops: somebody worked it
   out, and the working-out stays in a thread nobody rereads. Each of these
   turns the answer into something that lasts — a test, a link to the work it
   produced, or a look at what it already led to. */
function renderResolvedNext(data) {
  const wrap = document.getElementById('resolvedNext');
  if (!wrap) return;

  const show = data.status === 'resolved';
  wrap.style.display = show ? '' : 'none';
  document.getElementById('resolvedNextLineageWrap').style.display = 'none';
  if (!show) return;

  const s = t().resolvedNext;
  document.getElementById('resolvedNextLabel').textContent = s.label;
  document.getElementById('resolvedNextExperiment').textContent = s.experiment;
  document.getElementById('resolvedNextLink').textContent = s.linkProject;
  document.getElementById('resolvedNextLineage').textContent = s.lineage;
  wrap.dataset.cardId = data.id;
}

/* Share, opened on Experiment with the question already in the title. The
   point of the button is that the write-up starts from the question rather
   than from a blank form — retyping what you just read is the friction that
   stops the experiment being written at all. */
function startExperimentFromQuestion(card) {
  closeCard();
  setTimeout(() => {
    enterShareMode();
    setTimeout(() => {
      setComposeType('experiment');
      const title = document.getElementById('titleInput');
      if (title) { title.value = cardText(card).title || ''; title.focus(); }
      // The question's own "what's blocking us" is the best first draft of
      // "what we wanted to find out" there is going to be.
      const goal = document.getElementById('field_goal');
      if (goal && !goal.value) goal.value = bodyValue(cardText(card), 'question', 'blocked') || '';
      updateSubmitGate();
      refreshImageThumb();
    }, CONFIG.MODE_SWAP_MS + 60);
  }, CONFIG.MODE_SWAP_MS + 40);
}

function initResolvedNext() {
  const wrap = document.getElementById('resolvedNext');
  if (!wrap) return;
  const current = () => cardById(wrap.dataset.cardId);

  document.getElementById('resolvedNextExperiment').addEventListener('click', () => {
    const card = current();
    if (card) startExperimentFromQuestion(card);
  });

  // The same three questions the "we applied this too" button asks, with the
  // resolved question as the thing being applied — see openApplyFlow.
  document.getElementById('resolvedNextLink').addEventListener('click', () => {
    const card = current();
    if (card) openApplyFlow(card);
  });

  document.getElementById('resolvedNextLineage').addEventListener('click', function () {
    const card = current();
    if (!card) return;
    const box = document.getElementById('resolvedNextLineageWrap');
    const open = box.style.display === 'none';
    if (!open) {
      box.style.display = 'none';
      this.textContent = t().resolvedNext.lineage;
      return;
    }
    const chain = lineageChain(card);
    if (!chain.before.length && !chain.after.length) { showToast(t().resolvedNext.noLineage); return; }
    box.style.display = '';
    paintLineageStrip(box, card);
    this.textContent = t().resolvedNext.hideLineage;
  });
}

// Adding a reply on the left plays a brief fake "Summarizing…" moment, then
// the brief on the right gains one new line — there's no real AI behind
// this (see getConversationBrief/currentQuestionData), just a rough mime of
// what a live summary refresh would feel like.
function simulateSummaryUpdate() {
  const body = document.getElementById('briefBody');
  const updated = document.getElementById('briefUpdated');
  const s = t().brief;
  if (body.querySelector('.brief-empty')) return; // nothing to "refresh" without a real brief yet

  body.classList.add('is-updating');
  updated.textContent = s.summarizing;
  setTimeout(() => {
    body.classList.remove('is-updating');
    updated.textContent = s.lastUpdated(0);
    const keyIdeasList = body.querySelectorAll('.brief-section ul')[0];
    if (keyIdeasList) {
      const li = document.createElement('li');
      li.className = 'is-new';
      li.textContent = s.alsoNoted;
      keyIdeasList.appendChild(li);
    }
  }, 900);
}

function initQuestionDetail() {
  document.querySelectorAll('.question-tab').forEach((btn) => {
    btn.addEventListener('click', () => switchQuestionTab(btn.dataset.pane));
  });

  document.getElementById('conversationForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if (!currentQuestionData) return;
    const input = document.getElementById('conversationInput');
    const value = input.value.trim();
    if (!value) return;
    input.value = '';

    const msg = { author: myDisplayName(), studio: MY_STUDIO_KEY, justNow: true, text: value };
    // Kept only in memory for this open session (see sessionExtraMessages) —
    // a real backend would persist it; here it just needs to feel alive now.
    const id = currentQuestionData.id;
    if (!sessionExtraMessages[id]) sessionExtraMessages[id] = [];
    sessionExtraMessages[id].push(msg);

    const wrap = document.getElementById('conversationScroll');
    const el = conversationMessageEl(msg);
    el.classList.add('is-entering');
    wrap.appendChild(el);
    wrap.scrollTop = wrap.scrollHeight;

    simulateSummaryUpdate();
  });

  document.getElementById('qdDeleteBtn').addEventListener('click', function () {
    const id = this.dataset.cardId;
    if (!id) return;
    const card = ALL_CARDS.find((c) => c.id === id);
    const answers = card ? answerCountOf(card) : 0;
    const text = answers > 0 ? t().deleteConfirmWithAnswers(answers) : t().deleteConfirmText;
    if (window.confirm(text)) confirmDeleteCard(id);
  });
}

function setRevealVisible(visible) {
  const expandedCard = document.getElementById('expandedCard');
  const els = expandedCard.querySelectorAll('.reveal-on-open');
  els.forEach((el, i) => {
    if (visible) {
      el.style.transition = `opacity 0.4s ease ${0.2 + i * 0.02}s, transform 0.4s ease ${0.2 + i * 0.02}s`;
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    } else {
      el.style.transition = 'opacity 0.16s ease';
      el.style.opacity = '0';
      el.style.transform = 'translateY(10px)';
    }
  });
}

/* ---- opening a card is a screen change, not a popover ----
   This used to be a FLIP: the poster's bounding box was measured, the detail was
   snapped onto it, and top/left/width/height were animated out to a centred
   panel floating over a blurred feed. A floating panel reads as a preview of the
   knowledge rather than the knowledge itself, and it meant the two most
   substantial screens in the app — Share, and what somebody actually wrote —
   arrived in two unrelated ways.

   Both use one gesture now: the surface you were on fades and settles back, the
   new screen lifts in over the whole window. Same .mode-fade-out, same
   CONFIG.MODE_SWAP_MS hand-off point as enterShareMode, which this is
   deliberately a copy of. */
let detailReturnSurface = null;

function openCard(cardEl) {
  if (isCardExpanded) return;
  const index = Number(cardEl.dataset.index);
  const data = ALL_CARDS[index];
  if (!data) return;

  const expandedCard = document.getElementById('expandedCard');

  activeCardEl = cardEl;
  currentOpenIndex = index;
  isCardExpanded = true;
  pauseAutoScroll();
  // a card is a place you can be sent to, and Back is how you leave it
  syncUrlState({ push: true });

  populateExpanded(data, index);
  setRevealVisible(false);

  // Whichever surface we came from is the one we go back to — the feed
  // normally, the roster if a designer's shared work was opened from there.
  const leaving = activeSurfaceEl();
  detailReturnSurface = leaving;
  updateChrome(); // the takeover carries its own back arrow; floor tools stand down

  leaving.classList.add('mode-fade-out');
  setTimeout(() => {
    leaving.style.display = 'none';
    leaving.classList.remove('mode-fade-out');

    expandedCard.style.display = 'flex';
    // Each pane scrolls on its own, so each has to start at its own top.
    expandedCard.querySelectorAll('.expanded-pane, .qd-pane').forEach((p) => { p.scrollTop = 0; });
    void expandedCard.offsetWidth; // force reflow so .is-open actually transitions
    expandedCard.classList.add('is-open');
    setRevealVisible(true);
  }, CONFIG.MODE_SWAP_MS);
}

function closeCard() {
  if (!isCardExpanded) return;

  const expandedCard = document.getElementById('expandedCard');
  isCardExpanded = false;      // so the address describes what is underneath
  syncUrlState({ replace: true });
  isCardExpanded = true;       // the teardown below still needs the flag
  const returning = detailReturnSurface || document.getElementById('feedMain');

  setRevealVisible(false);
  expandedCard.classList.remove('is-open');

  setTimeout(() => {
    expandedCard.style.display = 'none';

    // designersViewport is a flex column, feedMain a plain block — restoring the
    // wrong one collapses the roster's centring.
    returning.style.display = returning.id === 'designersViewport' ? 'flex' : 'block';
    returning.classList.add('mode-fade-out'); // reused as "not yet visible"
    void returning.offsetWidth;
    returning.classList.remove('mode-fade-out');

    activeCardEl = null;
    currentOpenIndex = null;
    detailReturnSurface = null;
    isCardExpanded = false;
    updateChrome();
    scheduleResumeAutoScroll();
  }, CONFIG.MODE_SWAP_MS);
}

/* ======================================================================
   "We applied this too" — the three questions
   ----------------------------------------------------------------------
   The old button appended MY_STUDIO_KEY to a list and redrew the strip, which
   is where "…→ DoubleU → Whow" came from: a company name with nothing behind
   it, sitting in a chain of ideas. Applying something is not a fact about a
   company, it is an edge between two pieces of writing, and an edge needs a
   second endpoint. So the button asks for one.

   (a) where did you apply it — one of your studio's own Projects, Experiments
       or Updates, or a one-line Update written here and now, which is exactly
       what the Update type is for
   (b) what kind of connection — the five relations in LINEAGE_RELATIONS
   (c) what changed — optional, one line, for whoever reads the chain later

   Nothing is written until Save. Cancel, Escape and the backdrop all leave the
   data exactly as it was.

   TODO(backend): the edge belongs on the server, created by the account that
   made it, and the author of the source gets told. Here it is a field on the
   deriving card, persisted the same way any other edit to that card is.
   ====================================================================== */
const APPLY_FLOW_STEPS = 3;

let applyFlowState = null;

// Walking up from a card, so a link can never be offered that would make the
// chain point at itself.
function lineageAncestorIds(card) {
  const ids = new Set();
  let cursor = lineageParentOf(card);
  while (cursor && !ids.has(cursor.id)) {
    ids.add(cursor.id);
    cursor = lineageParentOf(cursor);
  }
  return ids;
}

/* What your studio could connect this to. Questions are left out — a question
   is something you asked, not somewhere you applied an idea — and so is
   anything that already derives from something else, because a card has one
   parent and quietly replacing it would delete a link somebody made. */
function applyFlowTargets(source) {
  const ancestors = lineageAncestorIds(source);
  return ALL_CARDS.filter((c) =>
    c.studio === MY_STUDIO_KEY &&
    c.id !== source.id &&
    c.type !== 'question' &&
    !c.derivedFrom &&
    !ancestors.has(c.id));
}

// Writes the edge onto the deriving card, wherever that card keeps its state.
function persistLineageLink(child, parentId, relation, note) {
  const patch = { derivedFrom: parentId, derivedRelation: relation, derivedNote: note || '' };

  if (child.isShared) {
    const stored = sharedCards.find((c) => c.id === child.id);
    if (!stored) return false;
    const previous = { derivedFrom: stored.derivedFrom, derivedRelation: stored.derivedRelation, derivedNote: stored.derivedNote };
    Object.assign(stored, patch);
    if (!writeSharedCards(sharedCards)) { Object.assign(stored, previous); return false; }
  } else {
    const merged = Object.assign({}, seedEditsMap()[child.id] || {}, patch);
    if (!saveSeedEdit(child.id, merged)) return false;
  }

  Object.assign(child, patch);
  return true;
}

// The one-line Update, made on the spot and linked in the same breath. Same
// shape as anything Share mode produces, so nothing downstream can tell them
// apart.
function buildQuickUpdateEntry(line, parentId, relation, note) {
  const text = line.trim();
  return {
    id: 'shared-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8),
    studio: MY_STUDIO_KEY,
    type: 'update',
    author: myDisplayName(),
    justNow: true,
    appliedBy: [],
    relatedTo: [],
    derivedFrom: parentId,
    derivedRelation: relation,
    derivedNote: note || '',
    sourceLang: currentLang,
    image: null,
    imageName: null,
    imageFocal: {},
    attachments: [],
    text: { title: truncateForSummary(text, 100), summary: truncateForSummary(text, 100), note: text },
  };
}

function isApplyFlowOpen() {
  return document.getElementById('applyFlow').classList.contains('is-open');
}

function openApplyFlow(source) {
  if (!source) return;
  applyFlowState = { sourceId: source.id, step: 1, targetId: '', newUpdate: false, newUpdateText: '', relation: '', note: '' };

  const s = t().applyFlow;
  document.getElementById('applyFlowTitle').textContent = s.title;
  document.getElementById('applyFlowSource').textContent = s.source(truncateForSummary(cardText(source).title || '', 70));
  document.getElementById('applyQ1').textContent = s.q1;
  document.getElementById('applyQ1Hint').textContent = s.q1Hint;
  document.getElementById('applyNewUpdateLabel').textContent = s.newUpdate;
  document.getElementById('applyNewUpdateInput').placeholder = s.newUpdatePlaceholder;
  document.getElementById('applyQ2').textContent = s.q2;
  document.getElementById('applyQ3').textContent = s.q3;
  document.getElementById('applyQ3Hint').textContent = s.q3Hint;
  document.getElementById('applyNoteInput').placeholder = s.notePlaceholder;
  document.getElementById('applyNoteInput').value = '';
  document.getElementById('applyNewUpdateInput').value = '';
  document.getElementById('applyNewUpdateBox').style.display = 'none';
  document.getElementById('applyFlowClose').setAttribute('aria-label', t().closeAria);

  renderApplyTargets(source);
  renderApplyRelations();
  renderApplyStep();

  document.getElementById('applyFlow').classList.add('is-open');
}

function closeApplyFlow() {
  document.getElementById('applyFlow').classList.remove('is-open');
  applyFlowState = null;
}

function renderApplyTargets(source) {
  const wrap = document.getElementById('applyTargetList');
  wrap.innerHTML = '';
  const targets = applyFlowTargets(source);

  if (!targets.length) {
    const empty = document.createElement('p');
    empty.className = 'apply-empty';
    empty.textContent = t().applyFlow.q1Empty;
    wrap.appendChild(empty);
    return;
  }

  targets.forEach((card) => {
    const studio = STUDIOS[card.studio];
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'apply-option';
    btn.dataset.cardId = card.id;
    btn.innerHTML = `<span class="apply-option-dot"></span>
      <span class="apply-option-text">
        <span class="apply-option-meta"></span>
        <span class="apply-option-title"></span>
      </span>`;
    btn.querySelector('.apply-option-dot').style.background = studio ? studio.color : 'var(--ink)';
    btn.querySelector('.apply-option-meta').textContent = t().types[card.type] || card.type;
    btn.querySelector('.apply-option-title').textContent = truncateForSummary(cardText(card).title || '', 80);
    btn.addEventListener('click', () => {
      applyFlowState.targetId = card.id;
      applyFlowState.newUpdate = false;
      document.getElementById('applyNewUpdateBox').style.display = 'none';
      renderApplyStep();
    });
    wrap.appendChild(btn);
  });
}

function renderApplyRelations() {
  const wrap = document.getElementById('applyRelationList');
  wrap.innerHTML = '';
  LINEAGE_RELATIONS.forEach((key) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'apply-option';
    btn.dataset.relation = key;
    btn.innerHTML = `<span class="apply-option-text"><span class="apply-option-title"></span></span>`;
    btn.querySelector('.apply-option-title').textContent = t().lineageRelations[key].back;
    btn.addEventListener('click', () => {
      applyFlowState.relation = key;
      renderApplyStep();
    });
    wrap.appendChild(btn);
  });
}

function applyFlowTargetLabel() {
  if (!applyFlowState) return '';
  if (applyFlowState.newUpdate) return truncateForSummary(applyFlowState.newUpdateText || '', 70);
  const card = cardById(applyFlowState.targetId);
  return card ? truncateForSummary(cardText(card).title || '', 70) : '';
}

function applyFlowCanAdvance() {
  if (!applyFlowState) return false;
  if (applyFlowState.step === 1) {
    if (applyFlowState.newUpdate) return !!applyFlowState.newUpdateText.trim();
    return !!cardById(applyFlowState.targetId);
  }
  if (applyFlowState.step === 2) return LINEAGE_RELATIONS.indexOf(applyFlowState.relation) >= 0;
  return true;
}

function renderApplyStep() {
  if (!applyFlowState) return;
  const s = t().applyFlow;
  const step = applyFlowState.step;

  document.querySelectorAll('.apply-step').forEach((el) => {
    el.classList.toggle('is-active', Number(el.dataset.step) === step);
  });
  document.getElementById('applyFlowProgress').textContent = s.step(step, APPLY_FLOW_STEPS);

  document.querySelectorAll('#applyTargetList .apply-option').forEach((el) => {
    el.classList.toggle('is-picked', !applyFlowState.newUpdate && el.dataset.cardId === applyFlowState.targetId);
  });
  document.getElementById('applyNewUpdateBtn').classList.toggle('is-picked', applyFlowState.newUpdate);
  document.querySelectorAll('#applyRelationList .apply-option').forEach((el) => {
    el.classList.toggle('is-picked', el.dataset.relation === applyFlowState.relation);
  });

  // What you are about to save, in the order it will read on the strip.
  if (step === APPLY_FLOW_STEPS) {
    const source = cardById(applyFlowState.sourceId);
    const rel = t().lineageRelations[applyFlowState.relation];
    const summary = document.getElementById('applySummary');
    summary.innerHTML = '';
    const line = document.createElement('span');
    line.textContent = `${source ? truncateForSummary(cardText(source).title || '', 48) : ''}  →  ${rel ? rel.forward : ''}  →  ${applyFlowTargetLabel()}`;
    summary.appendChild(line);
  }

  document.getElementById('applyFlowCancel').textContent = s.cancel;
  const back = document.getElementById('applyFlowBack');
  back.textContent = s.back;
  back.style.display = step > 1 ? '' : 'none';
  const next = document.getElementById('applyFlowNext');
  next.textContent = step === APPLY_FLOW_STEPS ? s.save : s.next;
  next.disabled = !applyFlowCanAdvance();
}

function commitApplyFlow() {
  if (!applyFlowState) return;
  const source = cardById(applyFlowState.sourceId);
  if (!source) { closeApplyFlow(); return; }

  const relation = applyFlowState.relation;
  const note = applyFlowState.note.trim();
  let ok = false;
  let linkedId = '';

  if (applyFlowState.newUpdate) {
    const entry = buildQuickUpdateEntry(applyFlowState.newUpdateText, source.id, relation, note);
    if (saveSharedCard(entry)) {
      sharedCards.unshift(entry);
      linkedId = entry.id;
      ok = true;
    }
  } else {
    const target = cardById(applyFlowState.targetId);
    if (target) {
      ok = persistLineageLink(target, source.id, relation, note);
      linkedId = target.id;
    }
  }

  if (!ok) { showToast(t().applyFlow.failed); return; }

  /* The studio-level "who picked this up" fact is still true and still drives
     the traces and the how-it-has-travelled line — it just no longer pretends
     to be a node in the lineage. */
  const list = source.appliedBy || (source.appliedBy = []);
  if (list.indexOf(MY_STUDIO_KEY) < 0) { list.push(MY_STUDIO_KEY); persistAppliedBy(source); }

  closeApplyFlow();

  // A new card shifts every index after it, and currentOpenIndex is an index.
  ALL_CARDS = buildAllCards();
  const fresh = cardById(source.id);
  const idx = findCardIndexById(source.id);
  if (idx >= 0) currentOpenIndex = idx;

  const shown = fresh || source;
  renderLineageStrip(shown, linkedId);
  renderLineageList(shown, linkedId);
  document.getElementById('appliedSummary').textContent = lineageSummaryText(shown);
  renderCardStatus(document.getElementById('cardStatusBlock'), shown);
  syncApplyButton(shown);

  renderDiscover();
  renderBrowse();
  renderQuestions();
  renderNowStrip();
  showToast(t().applyFlow.saved);
}

// Applied means "something of ours points at this", which is now a fact about
// cards rather than a flag on a button.
function hasMyLineageLink(card) {
  if (!card) return false;
  if ((card.appliedBy || []).indexOf(MY_STUDIO_KEY) >= 0) return true;
  return ALL_CARDS.some((c) => c.studio === MY_STUDIO_KEY && c.derivedFrom === card.id);
}

function syncApplyButton(card) {
  const btn = document.getElementById('applyBtn');
  if (!btn) return; // a guest session removed it at boot
  const applied = hasMyLineageLink(card);
  btn.classList.toggle('is-applied', applied);
  btn.textContent = applied ? t().applyButtonDone : t().applyButton;
}

function initApplyFlow() {
  document.getElementById('applyFlowClose').addEventListener('click', closeApplyFlow);
  document.getElementById('applyFlowCancel').addEventListener('click', closeApplyFlow);
  document.getElementById('applyFlowBackdrop').addEventListener('click', closeApplyFlow);

  document.getElementById('applyFlowBack').addEventListener('click', () => {
    if (!applyFlowState || applyFlowState.step === 1) return;
    applyFlowState.step -= 1;
    renderApplyStep();
  });

  document.getElementById('applyFlowNext').addEventListener('click', () => {
    if (!applyFlowState || !applyFlowCanAdvance()) return;
    if (applyFlowState.step < APPLY_FLOW_STEPS) {
      applyFlowState.step += 1;
      renderApplyStep();
      return;
    }
    commitApplyFlow();
  });

  document.getElementById('applyNewUpdateBtn').addEventListener('click', () => {
    if (!applyFlowState) return;
    applyFlowState.newUpdate = true;
    applyFlowState.targetId = '';
    document.getElementById('applyNewUpdateBox').style.display = '';
    renderApplyStep();
    document.getElementById('applyNewUpdateInput').focus();
  });

  document.getElementById('applyNewUpdateInput').addEventListener('input', function () {
    if (!applyFlowState) return;
    applyFlowState.newUpdateText = this.value;
    renderApplyStep();
  });

  document.getElementById('applyNoteInput').addEventListener('input', function () {
    if (!applyFlowState) return;
    applyFlowState.note = this.value;
  });

  // Escape closes this before it closes the card underneath — see the keydown
  // handler in initExpandCard, which checks isApplyFlowOpen() first.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isApplyFlowOpen()) { e.stopPropagation(); closeApplyFlow(); }
  }, true);
}

function initExpandCard() {
  document.getElementById('expandedClose').setAttribute('aria-label', t().closeAria);
  document.getElementById('expandedClose').addEventListener('click', closeCard);
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (isApplyFlowOpen()) return; // its own handler already took this
    if (isCardExpanded) closeCard();
    else if (isShareMode) exitShareMode();
    else if (isMenuOverlayOpen()) closeMenuOverlay();
  });

  /* The button no longer changes anything by itself. It opens the three
     questions, and the lineage only moves once those are answered and saved —
     see openApplyFlow / commitApplyFlow. */
  document.getElementById('applyBtn').addEventListener('click', () => {
    if (currentOpenIndex === null) return;
    const card = ALL_CARDS[currentOpenIndex];
    if (!card) return;
    openApplyFlow(card);
  });
}

/* ---- delete (own/shared cards only) — link -> confirm -> actual removal ---- */
function initDeleteCard() {
  document.getElementById('deleteCardLabel').textContent = t().deleteLink;
  document.getElementById('deleteConfirmText').textContent = t().deleteConfirmText;
  document.getElementById('deleteCancelBtn').textContent = t().deleteCancel;
  document.getElementById('deleteConfirmBtn').textContent = t().deleteConfirmButton;

  document.getElementById('editCardLabel').textContent = t().editLink;
  document.getElementById('editCardBtn').addEventListener('click', () => {
    const id = document.getElementById('expandedDeleteRow').dataset.cardId;
    if (id) enterEditMode(id);
  });

  document.getElementById('deleteCardBtn').addEventListener('click', () => {
    document.getElementById('deleteCardBtn').style.display = 'none';
    document.getElementById('deleteConfirmBox').style.display = 'flex';
    // Deleting a question takes the conversation under it with it, and the
    // people who answered are not the person deleting. Say how many, so it is
    // a decision rather than a surprise.
    const id = document.getElementById('expandedDeleteRow').dataset.cardId;
    const card = ALL_CARDS.find((c) => c.id === id);
    const answers = card ? answerCountOf(card) : 0;
    document.getElementById('deleteConfirmText').textContent =
      answers > 0 ? t().deleteConfirmWithAnswers(answers) : t().deleteConfirmText;
  });
  document.getElementById('deleteCancelBtn').addEventListener('click', resetDeleteConfirm);
  document.getElementById('deleteConfirmBtn').addEventListener('click', () => {
    const id = document.getElementById('expandedDeleteRow').dataset.cardId;
    if (!id) return;
    confirmDeleteCard(id);
  });
}

// Closes the modal first — its existing shrink-back-into-the-card animation
// — then lets that same card collapse out of wherever it's showing a beat
// later, so it reads as one continuous "this is leaving the network" motion
// instead of two unrelated animations firing at once.
function confirmDeleteCard(id) {
  closeCard();
  setTimeout(() => deleteSharedCardById(id), 600);
}

// A shared card can appear in *both* Discover and Browse at once (it's
// always justNow, so it's always in Discover's top slice too, until newer
// shares push it out) — every element tagged with this id, in either
// surface, fades together, then both surfaces are rebuilt from scratch so
// there's no manual re-indexing to get wrong across two separate DOM trees.
function deleteSharedCardById(id) {
  const els = Array.from(document.querySelectorAll(`[data-card-id="${id}"]`));

  const finish = () => {
    sharedCards = sharedCards.filter((c) => c.id !== id);
    // A deletion that doesn't reach storage is worse than a save that doesn't:
    // the card comes back on reload, and the reader has every reason to think
    // it's gone. Deleting frees room rather than needing it, so this failing at
    // all means storage is unavailable, not full — either way, say so.
    if (!writeSharedCards(sharedCards)) showToast(t().share.storageFailed);
    ALL_CARDS = buildAllCards();
    renderDiscover();
    renderBrowse();
    renderQuestions();
  };

  if (!els.length) { finish(); return; }

  els.forEach((el) => el.classList.add('is-hidden')); // the same smooth collapse the filters already use
  const finishedEls = new Set();
  let remaining = els.length;
  let done = false;
  const onEnd = (e) => {
    if (done) return;
    if (e.propertyName !== 'width' && e.propertyName !== 'opacity') return;
    if (finishedEls.has(e.currentTarget)) return;
    finishedEls.add(e.currentTarget);
    remaining--;
    if (remaining <= 0) { done = true; finish(); }
  };
  els.forEach((el) => el.addEventListener('transitionend', onEnd));
  setTimeout(() => { if (!done) { done = true; finish(); } }, 700); // safety net if transitionend never fires
}

/* ======================================================================
   Threads — the whole weave on one screen
   ----------------------------------------------------------------------
   Two layers of connection, drawn together because the point is that they are
   different:

     the keywords   — a node each, with a mark per piece of writing ringed
                      around it in its studio's colour. Blue and orange around
                      one word is this page's entire argument, made without a
                      sentence.
     the threads    — a curve between two keywords, from either evidence: they
                      were used on the same piece, or one piece came out of
                      another (derivedFrom) and they wore different words. A
                      thread whose evidence spans both studios is drawn heavier,
                      because that is the one thing the page exists to show.

   No ranking anywhere. A node's size follows how many pieces carry it, inside a
   range narrow enough that a busy keyword reads as busy and never as better —
   see THREAD_R_MIN/MAX. There is no sort, no score, no "top", and the story
   panel is ordered by time, which is the one ordering that is a fact.

   No pan and no zoom either, on purpose: at this size everything fits, and the
   value of a lookout is that it asks nothing of you. Eighty keywords is when
   that stops being true.
   ====================================================================== */
/* No isThreadsMode any more: Threads is floor 4, and "is it showing" is simply
   `currentFloor === FLOOR_THREADS`. A separate flag would be a second source of
   truth for the same question, and the two would disagree the first time
   something moved the stage without going through the old enter/exit pair. */
let threadsGraph = null;      // { nodes, links } — positions live on the nodes
let threadsRaf = null;
let threadsOpenKey = null;    // which keyword's story is showing
let threadsArrivalTimers = [];
let threadsDragNode = null;   // the word currently under the pointer, if held
let threadsDragMoved = false; // whether that hold has travelled far enough to be a drag
const THREAD_DRAG_SLOP_PX = 4; // under this it is a click, over it a drag

const THREAD_R_MIN = 34;       // how far a one-piece keyword's marks orbit
const THREAD_R_MAX = 50;       // and a busy one's. Deliberately close together.
/* Set in a serif at reading sizes, not chart sizes. The range is narrow on
   purpose: 21 to 29 is enough to feel a difference in activity and not enough
   to read as a hierarchy. */
const THREAD_LABEL_MIN = 21;
const THREAD_LABEL_MAX = 29;
const THREAD_DOT_R = 3.4;
/* The strip at the foot of floor 4 that the wordmark and its line sit in. Kept
   out of the map's own area — see .threads-svg, which subtracts the same. */
const THREAD_FOOTER_LANE = 58;
const THREAD_DRIFT_MIN_PX = 4;
const THREAD_DRIFT_MAX_PX = 9;

/* A stable number from a string. Every per-node constant that wants to look
   arbitrary — where it starts, how fast it breathes, which way it leans — is
   derived from this rather than from Math.random, so the map is laid out the
   same way on every open. A weave that rearranged itself each time you looked
   would be a decoration, not a map of anything. */
function threadHash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0) / 4294967295;
}

/* ---- the graph ----
   Built from ALL_CARDS every time the surface opens, so anything shared or
   edited in this session is already in it. */
function buildThreadsGraph() {
  const nodes = allKeywords().map((k) => ({
    key: k.key,
    label: k.label,
    cards: cardsWithKeyword(k.label),
    x: 0, y: 0, r: 0,
    seed: threadHash(k.key),
  }));
  const byKey = {};
  nodes.forEach((n) => { byKey[n.key] = n; });

  // radius by how much is under the word, on a curve that flattens fast
  const most = nodes.reduce((m, n) => Math.max(m, n.cards.length), 1);
  nodes.forEach((n) => {
    const t = most === 1 ? 0 : (n.cards.length - 1) / (most - 1);
    /* `ring` is how far out the marks orbit and how wide the bloom spreads —
       there is no circle drawn at it any more. */
    n.ring = THREAD_R_MIN + (THREAD_R_MAX - THREAD_R_MIN) * Math.sqrt(t);
    n.labelSize = THREAD_LABEL_MIN + (THREAD_LABEL_MAX - THREAD_LABEL_MIN) * Math.sqrt(t);
    n.labelLines = wrapNodeLabel(n.label);
    n.studios = nodeStudios(n);
  });

  const linkMap = {};
  const addLink = (aKey, bKey, kind, studios) => {
    if (!aKey || !bKey || aKey === bKey) return;
    if (!byKey[aKey] || !byKey[bKey]) return;
    const id = aKey < bKey ? aKey + '|' + bKey : bKey + '|' + aKey;
    if (!linkMap[id]) {
      linkMap[id] = { id, a: byKey[aKey], b: byKey[bKey], kinds: {}, studios: {}, weight: 0 };
    }
    const link = linkMap[id];
    link.kinds[kind] = true;
    link.weight += 1;
    studios.filter(Boolean).forEach((st) => { link.studios[st] = true; });
  };

  ALL_CARDS.forEach((card) => {
    const words = keywordsOf(card).map(keywordKey);
    // used together on one piece
    for (let i = 0; i < words.length; i++) {
      for (let j = i + 1; j < words.length; j++) addLink(words[i], words[j], 'shared', [card.studio]);
    }
    // one piece came out of another, and they wore different words
    if (card.derivedFrom) {
      const parent = ALL_CARDS.find((c) => c.id === card.derivedFrom);
      if (parent) {
        const pw = keywordsOf(parent).map(keywordKey);
        words.forEach((w) => pw.forEach((p) => addLink(w, p, 'relation', [card.studio, parent.studio])));
      }
    }
  });

  const links = Object.keys(linkMap).map((id) => {
    const l = linkMap[id];
    l.crossing = Object.keys(l.studios).filter(isStudioEnabled).length > 1;
    l.relation = !!l.kinds.relation;
    return l;
  });

  return { nodes: nodes, links: links };
}

/* ---- two lines rather than one that overruns ----
   Split at the space nearest the middle, so "Responsible gaming" breaks once
   and "Thread" never does. A keyword set at 26px in a serif is wide, and a
   single line of it crosses its neighbours. */
function wrapNodeLabel(label) {
  if (label.length <= 13 || label.indexOf(' ') < 0) return [label];
  const mid = label.length / 2;
  let best = -1;
  for (let i = 0; i < label.length; i++) {
    if (label[i] !== ' ') continue;
    if (best < 0 || Math.abs(i - mid) < Math.abs(best - mid)) best = i;
  }
  return best < 0 ? [label] : [label.slice(0, best), label.slice(best + 1)];
}

/* ---- whose keyword is this ----
   The studios with work under the word, most first. Drives the bloom behind it
   (one colour, or two blended) and the ends of every thread leaving it. */
function nodeStudios(node) {
  const count = {};
  node.cards.forEach((c) => {
    if (!isStudioEnabled(c.studio)) return;
    count[c.studio] = (count[c.studio] || 0) + 1;
  });
  return Object.keys(count).sort((a, b) => count[b] - count[a]);
}

function studioColor(key) {
  return (STUDIOS[key] && STUDIOS[key].color) || '#9a9a9a';
}

/* ---- where things go ----
   Rings by how connected a keyword is: the ones tied to the most others sit
   toward the middle, the ones tied to nothing rest calmly on the outside. Then
   a short relaxation opens up any pair whose words would collide.

   The first version was a golden-angle spiral with a link attraction, and it
   failed in both directions at once — everything with threads collapsed into a
   knot in the centre while the four keywords with none were pushed into the
   corners, so half the map was illegible and the rest was empty paper. Two
   things were wrong: the attraction's rest length was shorter than the
   repulsion floor, so linked nodes were pulled to a distance separation then
   had to fight every pass forever; and a spiral concentrates by construction.

   Rings fix the composition and separation fixes the collisions. Note this
   orders by *degree*, not by how many pieces a keyword carries: where a word
   sits says how entangled it is, never how good it is, and the sizes stay
   deliberately close together so nothing here reads as a ranking. */
function layoutThreads() {
  const stage = document.getElementById('threadsStage');
  const svg = document.getElementById('threadsSvg');
  if (!stage || !svg || !threadsGraph) return;

  /* Measured off the stage, which is a div and reports a reliable box, minus the
     footer's lane. Measuring the svg instead is what caused the feedback loop
     described in the .threads-svg rule — an svg's clientHeight is not dependable
     before it has a definite size, and its size was coming from the very viewBox
     this function writes. */
  const w = Math.max(360, stage.clientWidth);
  const h = Math.max(320, stage.clientHeight - THREAD_FOOTER_LANE);
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

  const nodes = threadsGraph.nodes;
  const links = threadsGraph.links;
  if (!nodes.length) return;

  /* Separation is a box, not a circle, and that is what keeps the words apart:
     a keyword is far wider than it is tall, so two side by side need much more
     room than two stacked. */
  nodes.forEach((n) => {
    const longest = n.labelLines.reduce((m, l) => Math.max(m, l.length), 0);
    /* Two footprints per word, because they answer different questions.
       half* is what must not overlap the next word — the type and the ring of
       marks. bleed is how far its bloom actually reaches, which is bigger than
       either and is what the edge clamp has to respect: sized off half* alone,
       "Art pipeline" sat legally inside the stage with its bloom cut off by the
       bottom of the window. */
    n.halfW = longest * n.labelSize * 0.29 + 30;
    n.halfH = n.labelSize * (n.labelLines.length > 1 ? 1.7 : 1.05) + n.ring + 16;
    n.bleed = n.ring * 2.0;
  });

  // The room the weave gets: centred, with a margin all round that the fit step
  // below normalises into rather than the simulation having to respect.
  /* A handful of words needs its own rules, measured off the real seven-node
     graph rather than guessed: one unlinked word (Character Animation) gets
     pushed outward by repulsion for the whole run — its equilibrium against
     the 0.012 centre pull is thousands of px away — while the six words tied
     by eleven links collapse into one dense blob. The fit step below then
     stretches that two-pole distribution so the EXTREMES touch the room's
     corners, which is precisely the isolate-in-one-corner / blob-in-the-other
     screen this replaces. So under a dozen words: a smaller room, the
     simulation clamped inside it (the isolate stops at the wall instead of
     flying), and NO stretch afterwards. Twelve words and up run the exact
     code they always did. */
  const SMALL_WEAVE = nodes.length < 12;
  const fill = SMALL_WEAVE ? Math.max(0.45, Math.sqrt(nodes.length / 12)) : 1;
  const cx = w / 2;
  const cy = h / 2;
  const rx = w * 0.435 * fill;
  const ry = h * 0.415 * fill;

  const deg = {};
  nodes.forEach((n) => { deg[n.key] = 0; });
  links.forEach((l) => { deg[l.a.key]++; deg[l.b.key]++; });

  /* Placement has to come from the graph, not from a pretty spiral.

     Two earlier attempts put the words down by rule and hoped a weak spring
     would pull the related ones together afterwards. Both failed the same way:
     "Slack pipeline" and "Thread" — the pair this whole page was built to show
     — landed at opposite ends of the page, and the thread between them became a
     40cm arc sweeping through six unrelated words. You cannot fix a placement
     that ignores the edges by adding a gentle force afterwards; the placement
     has to be made of the edges.

     So: a proper Fruchterman-Reingold pass. Every word pushes every other away,
     every thread pulls its two ends together, and the whole thing cools. It is
     twenty words and thirteen threads — this costs nothing and it is the only
     thing that actually puts a chain next to itself. Deterministic, because the
     starting ring and every tie-break comes from the keyword hash rather than
     from Math.random: the same weave has to be in the same shape every time it
     is opened, or it is decoration rather than a map. */
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  nodes.slice().sort((a, b) => a.seed - b.seed).forEach((n, i) => {
    const angle = i * GOLDEN;
    const rad = 0.35 + 0.5 * Math.sqrt(i / Math.max(1, nodes.length - 1));
    n.x = cx + Math.cos(angle) * rx * rad;
    n.y = cy + Math.sin(angle) * ry * rad;
  });

  // 0.72: at 0.62 the busiest four words in the middle settled close enough
  // that separation then had to shove them apart, which undid the structure.
  const k = Math.sqrt((rx * 2 * ry * 2) / nodes.length) * 0.72;
  let temp = Math.min(rx, ry) * 0.30;
  for (let iter = 0; iter < 420; iter++) {
    nodes.forEach((n) => { n.fx = 0; n.fy = 0; });
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d = Math.hypot(dx, dy);
        if (d < 0.01) { dx = (a.seed - 0.5) || 0.1; dy = (b.seed - 0.5) || 0.1; d = Math.hypot(dx, dy); }
        const rep = (k * k) / d;
        a.fx += (dx / d) * rep; a.fy += (dy / d) * rep;
        b.fx -= (dx / d) * rep; b.fy -= (dy / d) * rep;
      }
    }
    links.forEach((l) => {
      const dx = l.a.x - l.b.x, dy = l.a.y - l.b.y;
      const d = Math.hypot(dx, dy) || 0.01;
      const att = (d * d) / k;
      l.a.fx -= (dx / d) * att; l.a.fy -= (dy / d) * att;
      l.b.fx += (dx / d) * att; l.b.fy += (dy / d) * att;
    });
    // A whisper toward the middle. Without it the words with no thread at all
    // are pushed off the page by repulsion alone and never come back.
    nodes.forEach((n) => {
      n.fx += (cx - n.x) * 0.012;
      n.fy += (cy - n.y) * 0.012;
      const f = Math.hypot(n.fx, n.fy) || 0.01;
      const step = Math.min(f, temp);
      n.x += (n.fx / f) * step;
      n.y += (n.fy / f) * step;
      // Small weave: nobody leaves the room. Repulsion would carry an
      // unlinked word outward for all 420 iterations otherwise (measured:
      // its balance point is off the page entirely).
      if (SMALL_WEAVE) {
        const ddx = n.x - cx, ddy = n.y - cy;
        const fEllipse = Math.hypot(ddx / rx, ddy / ry);
        if (fEllipse > 1) {
          n.x = cx + ddx / fEllipse;
          n.y = cy + ddy / fEllipse;
        }
      }
    });
    temp *= 0.9885;
  }

  /* Fit what came out to the room. The simulation settles at whatever scale its
     own constants imply, which is never the size of this particular window, so
     the result is normalised into the rect rather than the constants being
     hand-tuned per screen. Axes are scaled separately so the weave fills a wide
     window, with the ratio capped so it is stretched rather than distorted. */
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  nodes.forEach((n) => {
    minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
    minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
  });
  const spanX = Math.max(1, maxX - minX);
  const spanY = Math.max(1, maxY - minY);
  /* Small weave: no stretch. The clamp above already kept everything in the
     (reduced) room, and scaling a two-pole distribution to touch the room's
     corners is what scattered seven words in the first place. Recentre the
     group as a whole and stop. */
  if (SMALL_WEAVE) {
    const shiftX = cx - (minX + spanX / 2);
    const shiftY = cy - (minY + spanY / 2);
    nodes.forEach((n) => {
      n.x += shiftX;
      n.y += shiftY;
      n.homeX = n.x; n.homeY = n.y;
    });
  } else {
  let scaleX = (rx * 2) / spanX;
  let scaleY = (ry * 2) / spanY;
  /* 1.7, not 1.35. The simulation settles into a roughly round cloud, and on a
     16:9 window a tight cap left a third of the page empty down both sides
     while the middle stayed crowded. Stretching the cloud to the shape of the
     room is what a designer would do with the same material; 1.7 is where it
     stops looking stretched and starts looking wrong. */
  const ratio = Math.max(scaleX, scaleY) / Math.min(scaleX, scaleY);
  if (ratio > 1.7) {
    if (scaleX > scaleY) scaleX = scaleY * 1.7;
    else scaleY = scaleX * 1.7;
  }
  nodes.forEach((n) => {
    n.x = cx + (n.x - (minX + spanX / 2)) * scaleX;
    n.y = cy + (n.y - (minY + spanY / 2)) * scaleY;
    n.homeX = n.x; n.homeY = n.y;
  });
  }

  /* Now the only thing left is type collision, which the simulation knows
     nothing about — it was placing points, and these are words. Separation is a
     box, not a circle: a keyword is far wider than it is tall, so two side by
     side need much more room than two stacked. A weak spring home keeps this
     from undoing the structure the simulation just found. */
  for (let pass = 0; pass < 220; pass++) {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const needX = a.halfW + b.halfW;
        const needY = a.halfH + b.halfH;
        const overX = needX - Math.abs(dx);
        const overY = needY - Math.abs(dy);
        if (overX <= 0 || overY <= 0) continue;
        if (overX / needX < overY / needY) {
          const push = (dx >= 0 ? 1 : -1) * overX * 0.26;
          a.x -= push; b.x += push;
        } else {
          const push = (dy >= 0 ? 1 : -1) * overY * 0.26;
          a.y -= push; b.y += push;
        }
      }
    }
    nodes.forEach((n) => {
      n.x += (n.homeX - n.x) * 0.04;
      n.y += (n.homeY - n.y) * 0.04;
      const edgeX = Math.max(n.halfW * 0.74, n.bleed * 0.62);
      const edgeY = Math.max(n.halfH * 0.88, n.bleed * 0.62);
      n.x = Math.max(edgeX, Math.min(w - edgeX, n.x));
      n.y = Math.max(edgeY, Math.min(h - edgeY, n.y));
    });
  }

  /* Drift. Two periods that do not divide into each other, so a node traces a
     slow open loop rather than a line, and every node is on its own clock. */
  nodes.forEach((n) => {
    const s2 = threadHash(n.key + '~');
    const s3 = threadHash(n.key + '^');
    n.driftA = THREAD_DRIFT_MIN_PX + (THREAD_DRIFT_MAX_PX - THREAD_DRIFT_MIN_PX) * n.seed;
    n.driftB = THREAD_DRIFT_MIN_PX + (THREAD_DRIFT_MAX_PX - THREAD_DRIFT_MIN_PX) * s2;
    n.periodX = 9000 + n.seed * 9000;
    n.periodY = 11000 + s2 * 9000;
    n.phaseX = s3 * Math.PI * 2;
    n.phaseY = n.seed * Math.PI * 2;
    n.dx = 0; n.dy = 0;
  });
}

/* ---- drawing ----
   Each node is three nested <g>: drift writes a transform attribute to the
   outer, the arrival transition animates the middle, and focus scales the
   inner. One transform each, so none of them can overwrite another. */
function renderThreads() {
  const svg = document.getElementById('threadsSvg');
  const linkLayer = document.getElementById('threadsLinkLayer');
  const nodeLayer = document.getElementById('threadsNodeLayer');
  const defs = document.getElementById('threadsDefs');
  const empty = document.getElementById('threadsEmpty');
  if (!svg) return;

  threadsArrivalTimers.forEach(clearTimeout);
  threadsArrivalTimers = [];
  linkLayer.innerHTML = '';
  nodeLayer.innerHTML = '';
  defs.innerHTML = '';
  svg.classList.remove('is-focusing');

  refreshThreadsHint();
  threadsGraph = buildThreadsGraph();
  const hasAny = threadsGraph.nodes.length > 0;
  empty.style.display = hasAny ? 'none' : '';
  svg.style.display = hasAny ? '' : 'none';
  if (!hasAny) return;

  layoutThreads();
  const NS = 'http://www.w3.org/2000/svg';
  const el = (name) => document.createElementNS(NS, name);

  /* One bloom gradient per studio, in objectBoundingBox units so every node
     reuses the same two definitions at whatever size it needs. */
  enabledStudioKeys().forEach((key) => {
    const g = el('radialGradient');
    g.setAttribute('id', 'thGlow-' + key);
    // Falls away sooner as well as fainter, so two blooms meeting read as two
    // colours overlapping rather than as a single new one.
    [[0, 0.28], [0.38, 0.12], [1, 0]].forEach(([off, op]) => {
      const stop = el('stop');
      stop.setAttribute('offset', off);
      stop.setAttribute('stop-color', studioColor(key));
      stop.setAttribute('stop-opacity', op);
      g.appendChild(stop);
    });
    defs.appendChild(g);
  });

  // one gradient per thread, in user space, endpoints refreshed every frame
  threadsGraph.links.forEach((l, i) => {
    const g = el('linearGradient');
    g.setAttribute('id', 'thLink-' + i);
    g.setAttribute('gradientUnits', 'userSpaceOnUse');
    /* The colours come from the thread's own evidence, not from each end's
       busiest studio. A thread whose evidence spans both studios runs from one
       studio's colour into the other's, which is the sentence this page is here
       to say — and reading the endpoints' primaries instead could give a
       genuinely crossing thread two identical ends, as the Slack pipeline to
       Thread thread did: both words are busiest at Whow, so the one thread on
       the page most worth seeing was drawn a flat orange. */
    const evidence = Object.keys(l.studios).filter(isStudioEnabled);
    const fromKey = evidence[0] || l.a.studios[0];
    const toKey = (l.crossing && evidence[1]) || evidence[0] || l.b.studios[0];
    const from = el('stop'); from.setAttribute('offset', '0');
    from.setAttribute('stop-color', studioColor(fromKey));
    const to = el('stop'); to.setAttribute('offset', '1');
    to.setAttribute('stop-color', studioColor(toKey));
    g.appendChild(from); g.appendChild(to);
    defs.appendChild(g);
    l.gradEl = g;

    const path = el('path');
    path.setAttribute('class', 'threads-link' + (l.crossing ? ' is-crossing' : ''));
    path.setAttribute('stroke', `url(#thLink-${i})`);
    l.el = path;
    linkLayer.appendChild(path);
  });

  threadsGraph.nodes.forEach((n) => {
    const outer = el('g');
    outer.setAttribute('class', 'threads-node');
    outer.dataset.key = n.key;
    const rise = el('g'); rise.setAttribute('class', 'threads-rise');
    const recede = el('g'); recede.setAttribute('class', 'threads-recede');

    /* Something to actually point at.

       Dropping the grey circle took the hit area with it: the label is
       pointer-events:none (so it never eats a click meant for a mark behind it)
       and so are the blooms, which left a keyword with no target but its own
       3px dots. Hover and click both silently stopped working — the map looked
       finished and did nothing.

       So: an invisible rectangle over the word, added first so the marks stay
       above it and keep their own tooltip and click. Sized off the type rather
       than the bloom, because two blooms are allowed to overlap and two targets
       are not. */
    const hit = el('rect');
    hit.setAttribute('class', 'threads-hit');
    hit.setAttribute('x', (-n.halfW * 0.72).toFixed(1));
    hit.setAttribute('y', (-n.halfH * 0.58).toFixed(1));
    hit.setAttribute('width', (n.halfW * 1.44).toFixed(1));
    hit.setAttribute('height', (n.halfH * 1.16).toFixed(1));
    hit.setAttribute('fill', 'transparent');
    recede.appendChild(hit);

    /* The bloom. One studio gets one circle of its colour; two get two,
       offset either side so they overlap through the middle — which is what
       makes "both studios are on this" a colour rather than a caption. */
    const studios = n.studios.length ? n.studios : [null];
    /* 2.0, not 2.5. At the wider spread four blooms in the crowded middle ran
       together into one pink-grey wash, which lost the very thing the colour is
       carrying — whose work is under each word. */
    const bloom = n.ring * 2.0;
    studios.slice(0, 2).forEach((key, i) => {
      const c = el('circle');
      c.setAttribute('class', 'threads-glow threads-glow-shape');
      c.setAttribute('r', bloom * (studios.length > 1 ? 0.82 : 1));
      c.setAttribute('cx', studios.length > 1 ? (i === 0 ? -bloom * 0.3 : bloom * 0.3) : 0);
      c.setAttribute('cy', 0);
      c.setAttribute('fill', key ? `url(#thGlow-${key})` : 'rgba(20,20,20,0.05)');
      c.setAttribute('opacity', 0.9);
      recede.appendChild(c);
    });

    // the marks, ringed around the word, each on its own soft halo
    n.cards.forEach((card, i) => {
      const a = (i / n.cards.length) * Math.PI * 2 + n.seed * Math.PI * 2;
      const orbit = n.ring;
      const cx = Math.cos(a) * orbit * 1.28;
      const cy = Math.sin(a) * orbit;
      const col = studioColor(card.studio);
      const halo = el('circle');
      halo.setAttribute('class', 'threads-dot-halo');
      halo.setAttribute('r', THREAD_DOT_R * 2.6);
      halo.setAttribute('cx', cx); halo.setAttribute('cy', cy);
      halo.setAttribute('fill', col);
      halo.setAttribute('opacity', 0.13);
      recede.appendChild(halo);
      const dot = el('circle');
      dot.setAttribute('class', 'threads-dot');
      dot.setAttribute('r', THREAD_DOT_R);
      dot.setAttribute('cx', cx); dot.setAttribute('cy', cy);
      dot.setAttribute('fill', col);
      dot.dataset.cardId = card.id;
      recede.appendChild(dot);
    });

    // the word itself
    const label = el('text');
    label.setAttribute('class', 'threads-node-label');
    label.setAttribute('font-size', n.labelSize.toFixed(2));
    const lead = n.labelSize * 0.98;
    const top = n.labelLines.length > 1 ? -lead * 0.5 + n.labelSize * 0.34 : n.labelSize * 0.34;
    n.labelLines.forEach((line, li) => {
      const span = el('tspan');
      span.setAttribute('x', 0);
      span.setAttribute('y', (top + li * lead).toFixed(1));
      span.textContent = line;
      label.appendChild(span);
    });
    recede.appendChild(label);

    const count = el('text');
    count.setAttribute('class', 'threads-node-count');
    count.setAttribute('y', (top + n.labelLines.length * lead + 4).toFixed(1));
    // the count is also the invitation — the arrow says it opens
    count.textContent = t().threads.nodeCount(n.cards.length) + ' \u2192';
    recede.appendChild(count);

    rise.appendChild(recede);
    outer.appendChild(rise);
    nodeLayer.appendChild(outer);
    n.el = outer;
    n.riseEl = rise;
  });

  positionThreads(performance.now());

  /* Arrival: the words rise on a stagger, then the threads are drawn between
     them, released left to right so it reads as weaving rather than as a map
     switching on. Each path starts fully dashed — invisible — and the offset is
     transitioned to zero. */
  threadsGraph.nodes.forEach((n, i) => {
    threadsArrivalTimers.push(setTimeout(() => n.riseEl.classList.add('is-in'), 120 + i * 62));
  });
  const wordsDone = 120 + threadsGraph.nodes.length * 62;
  const weaveOrder = threadsGraph.links.slice()
    .sort((a, b) => Math.min(a.a.x, a.b.x) - Math.min(b.a.x, b.b.x));
  weaveOrder.forEach((l, i) => {
    const len = l.el.getTotalLength() || 1;
    l.el.style.strokeDasharray = `${len} ${len}`;
    l.el.style.strokeDashoffset = len;
    threadsArrivalTimers.push(setTimeout(() => {
      l.el.classList.add('is-drawing');
      l.el.style.strokeDashoffset = '0';
      // Once it is woven the dashes come off entirely, so drift is never
      // redrawing a stale dash pattern for the rest of the session.
      threadsArrivalTimers.push(setTimeout(() => {
        l.el.classList.remove('is-drawing');
        l.el.style.strokeDasharray = '';
        l.el.style.strokeDashoffset = '';
      }, 1250));
    }, wordsDone * 0.45 + i * 78));
  });

  initThreadsInteraction();
  startThreadsDrift();
}

/* How far from a word's centre its threads should start.

   Not its ring: the ring is where the marks orbit, and the word is wider than
   that. This is the distance to the word's own bounding ellipse along the
   direction the thread leaves in, so a thread going sideways clears the whole
   label and one going straight up only has to clear a line of type. Ending at
   the centre instead drew every thread through the word it was joining — on
   "Slack pipeline" the result was indistinguishable from a strikethrough. */
function threadEdgeOffset(node, dx, dy) {
  const A = Math.max(node.halfW * 0.60, node.ring * 0.9);
  const B = Math.max(node.halfH * 0.66, node.ring * 0.8);
  const len = Math.hypot(dx, dy) || 1;
  const cos = dx / len, sin = dy / len;
  return (A * B) / Math.sqrt((B * cos) * (B * cos) + (A * sin) * (A * sin));
}

/* One frame: move every word by its own slow wander, then redraw the curves and
   re-aim their gradients so the threads follow rather than snap. */
function positionThreads(now) {
  if (!threadsGraph) return;
  threadsGraph.nodes.forEach((n) => {
    // A word being held sits exactly where the pointer put it. Its drift is not
    // paused so much as zeroed — the offset is what drifts, and while dragging
    // the offset is nothing, so x/y alone place it.
    if (n === threadsDragNode) { n.dx = 0; n.dy = 0; }
    else {
      n.dx = Math.sin((now / n.periodX) * Math.PI * 2 + n.phaseX) * n.driftA;
      n.dy = Math.cos((now / n.periodY) * Math.PI * 2 + n.phaseY) * n.driftB;
    }
    if (n.el) n.el.setAttribute('transform', `translate(${(n.x + n.dx).toFixed(2)}, ${(n.y + n.dy).toFixed(2)})`);
  });
  threadsGraph.links.forEach((l) => {
    const ax = l.a.x + l.a.dx, ay = l.a.y + l.a.dy;
    const bx = l.b.x + l.b.dx, by = l.b.y + l.b.dy;
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    /* Bowed perpendicular to itself, and always to the same side, so it sways
       with the words instead of snapping through straight. A thread between two
       keywords is not a vector; it is slack. */
    const nx = -(by - ay), ny = bx - ax;
    const len = Math.hypot(nx, ny) || 1;
    const bend = Math.min(34, len * 0.13) * (l.a.seed > 0.5 ? 1 : -1);
    const qx = mx + (nx / len) * bend;
    const qy = my + (ny / len) * bend;
    /* Trimmed along the curve's own tangents, not along the straight line
       between the words: the thread leaves toward its control point, so that is
       the direction it has to clear the label in. */
    const t0x = qx - ax, t0y = qy - ay;
    const t1x = bx - qx, t1y = by - qy;
    const off0 = threadEdgeOffset(l.a, t0x, t0y);
    const off1 = threadEdgeOffset(l.b, -t1x, -t1y);
    const d0 = Math.hypot(t0x, t0y) || 1;
    const d1 = Math.hypot(t1x, t1y) || 1;
    const sx = ax + (t0x / d0) * off0, sy = ay + (t0y / d0) * off0;
    const ex = bx - (t1x / d1) * off1, ey = by - (t1y / d1) * off1;
    if (l.el) l.el.setAttribute('d', `M ${sx.toFixed(1)} ${sy.toFixed(1)} Q ${qx.toFixed(1)} ${qy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`);
    if (l.gradEl) {
      l.gradEl.setAttribute('x1', sx.toFixed(1));
      l.gradEl.setAttribute('y1', sy.toFixed(1));
      l.gradEl.setAttribute('x2', ex.toFixed(1));
      l.gradEl.setAttribute('y2', ey.toFixed(1));
    }
  });
}

function startThreadsDrift() {
  stopThreadsDrift();
  const tick = (now) => {
    // Stops itself the moment the weave is not the floor being looked at.
    if (currentFloor !== FLOOR_THREADS) { threadsRaf = null; return; }
    positionThreads(now);
    threadsRaf = requestAnimationFrame(tick);
  };
  threadsRaf = requestAnimationFrame(tick);
}

function stopThreadsDrift() {
  if (threadsRaf) cancelAnimationFrame(threadsRaf);
  threadsRaf = null;
}

/* ---- what a hover is asking ----
   "What does this word touch?" — so the answer is the word, its own pieces, its
   threads, and the words at their far ends. Everything else steps back rather
   than vanishing, so the shape of the whole weave stays readable while one part
   of it is bright. */
function focusThreadsOn(key) {
  const svg = document.getElementById('threadsSvg');
  if (!svg || !threadsGraph) return;
  if (!key) {
    svg.classList.remove('is-focusing');
    svg.querySelectorAll('.is-lit').forEach((e) => e.classList.remove('is-lit'));
    return;
  }
  const lit = {};
  lit[key] = true;
  threadsGraph.links.forEach((l) => {
    const on = l.a.key === key || l.b.key === key;
    l.el.classList.toggle('is-lit', on);
    if (on) { lit[l.a.key] = true; lit[l.b.key] = true; }
  });
  threadsGraph.nodes.forEach((n) => n.el.classList.toggle('is-lit', !!lit[n.key]));
  svg.classList.add('is-focusing');
}

/* Screen pixels to the coordinates the map is drawn in. The SVG scales its
   viewBox to the stage, so a pointer delta is not a diagram delta. */
function threadsClientToView(clientX, clientY) {
  const svg = document.getElementById('threadsSvg');
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  if (!vb || !vb.width || !r.width) return { x: clientX, y: clientY };
  return { x: (clientX - r.left) * (vb.width / r.width), y: (clientY - r.top) * (vb.height / r.height) };
}

/* ---- moving a word by hand ----
   The map arranges itself, but where a word sits is also an opinion, and this
   lets the reader have one. Two details make it feel like picking something up
   rather than nudging a data point:

     while held, that word's drift is zeroed and its current drift offset is
     baked into its position, so it does not lurch by however far it happened to
     have wandered at the moment you grabbed it;

     on release its drift is re-phased to start from zero, so it eases away from
     exactly where you left it instead of snapping to wherever its sine wave had
     got to in the meantime.

   Only the grabbed word is pinned. Its threads and its marks follow because
   they are drawn from its position every frame anyway. */
function beginThreadsDrag(node, e) {
  threadsDragNode = node;
  threadsDragMoved = false;
  // bake in the wander so there is no jump on the first frame of the drag
  node.x += node.dx;
  node.y += node.dy;
  node.dx = 0; node.dy = 0;
  const at = threadsClientToView(e.clientX, e.clientY);
  node.grabDX = node.x - at.x;
  node.grabDY = node.y - at.y;
  node.grabClientX = e.clientX;
  node.grabClientY = e.clientY;
  document.getElementById('threadsSvg').classList.add('is-dragging');
}

function moveThreadsDrag(e) {
  const node = threadsDragNode;
  if (!node) return;
  if (!threadsDragMoved) {
    const travelled = Math.hypot(e.clientX - node.grabClientX, e.clientY - node.grabClientY);
    if (travelled < THREAD_DRAG_SLOP_PX) return; // still a click, as far as anyone knows
    threadsDragMoved = true;
  }
  const at = threadsClientToView(e.clientX, e.clientY);
  const svg = document.getElementById('threadsSvg');
  const vb = svg.viewBox.baseVal;
  // Kept on the page: a word dragged off the edge is a word you cannot get back
  // without reloading, since there is no pan.
  const edgeX = Math.max(node.halfW * 0.5, node.bleed * 0.45);
  const edgeY = Math.max(node.halfH * 0.6, node.bleed * 0.45);
  node.x = Math.max(edgeX, Math.min(vb.width - edgeX, at.x + node.grabDX));
  node.y = Math.max(edgeY, Math.min(vb.height - edgeY, at.y + node.grabDY));
  // so a later resize-relayout has somewhere honest to spring back toward
  node.homeX = node.x; node.homeY = node.y;
}

function endThreadsDrag() {
  const node = threadsDragNode;
  if (!node) return;
  threadsDragNode = null;
  document.getElementById('threadsSvg').classList.remove('is-dragging');
  /* Re-phase so the wander restarts at zero offset from where it was dropped.
     sin(2π·t/period + phase) = 0 and cos(...) = 0 at these phases. */
  const now = performance.now();
  node.phaseX = -(now / node.periodX) * Math.PI * 2;
  node.phaseY = Math.PI / 2 - (now / node.periodY) * Math.PI * 2;
  node.dx = 0; node.dy = 0;
}

function initThreadsInteraction() {
