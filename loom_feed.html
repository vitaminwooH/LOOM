  .poster-card.is-open-question .exchange-trace { color: var(--ink-faint); }
  .question-card .exchange-trace.is-linked:hover,
  .poster-card.is-open-question .exchange-trace.is-linked:hover { color: var(--ink); }

  /* floor 3's dock line — the one place a count belongs, because it is a
     count of things waiting on YOU rather than a count of your output. There
     is exactly one of these now; two lines saying different true things about
     the same list read as the app disagreeing with itself. */
  .questions-count.is-wanted { color: var(--ink); font-weight: 600; }

  /* The sentence at the top of floor 3, addressed to whoever is reading. */
  /* Sits with the cards rather than in the corner: the auto margin above it and
     the one below the grid make the pair one centred block, so a floor with
     three questions on it is a sentence and three cards, not a caption stranded
     at the top edge under the hamburger. */
  .questions-personal {
    margin: auto auto 34px;
    /* A measure, so a long sentence breaks into two balanced lines instead of
       running the width of the floor. 30ch, not 20: at 20 the longest of these
       sentences took three lines, and three lines of headline plus three cards
       overflowed a 720px-tall window. */
    max-width: 30ch;
    text-align: center;
    font-family: 'Newsreader', serif;
    /* This is the floor's headline — the one line that says why the cards below
       are worth your afternoon — and it was set at 25px, a caption's size. The
       floor holds three short cards and could not fill a tall window with them
       without padding them hollow; the honest way to use that space is to let
       the sentence be the size of its job, the way floor 1 lets its banner
       headline be. */
    font-size: clamp(24px, 2.2vw, 38px);
    font-weight: 400;
    line-height: 1.24;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-wrap: balance;
  }
  /* A short window has no spare height to give a headline. Scaling it by width
     alone meant a wide-but-short display (a 1440x800 laptop, a half-height
     browser) spent 120px of a 640px floor on one sentence. */
  @media (max-height: 840px) {
    .questions-personal { font-size: clamp(22px, 1.9vw, 30px); margin-bottom: 22px; }
  }
  .questions-personal:empty { display: none; }

  /* ---------- Share, in Update mode ----------
     Fewer things on screen, and the one box is bigger. The form should look
     like less work than the others, because it is. */
  /* A box the size of what it is asking for. The other types let their fields
     share the leftover height, which for a single one-line field meant a 540px
     void under one sentence — a form that looks like it wants an essay, which
     is the exact thing this type exists to avoid. */
  .step-compose.is-update .compose-fields { flex: 0 0 auto; }
  .step-compose.is-update .compose-fields .field { flex: 0 0 auto; }
  .step-compose.is-update .compose-fields textarea {
    flex: 0 0 auto;
    min-height: 92px;
    max-height: 130px;
  }
  .step-compose.is-update .compose-left { gap: 20px; }
  /* The whole form is a short cluster at the top and then it stops. The link
     was pushed to the bottom of the column, which left a void in the middle
     and made the last field look like something you had missed. */
  .step-compose.is-update .compose-left { justify-content: flex-start; }
  /* One line, a picture and somewhere to look. Attachments are a filing
     cabinet, and nobody attaches a PDF to a sentence — leaving the column
     there made the lightest type in the app look like the same form as the
     others with two boxes greyed out. */
  .step-compose.is-update .compose-attach-row { grid-template-columns: 1fr; }
  /* An Update is a line and maybe a link; a PDF attached to it is a different
     kind of post. */
  .step-compose.is-update .compose-attach-col-attachments { display: none; }

  /* ---------- "Add more context" ----------
     A Project asks four questions. Four empty boxes is a form you put off until
     you have time to do it properly, and most of what a studio learns never
     survives that wait. So the first box is the form and the rest are behind
     one line of text — still there, no longer in the way. */
  /* ---------- keywords, in the composer ----------
     The wrap is the input: chips and the caret share one bordered box, so it
     reads as one field you are filling rather than a list plus a text box. */
  .keyword-input-wrap {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .keyword-input-wrap:focus-within {
    border-color: var(--border-strong);
    box-shadow: 0 4px 16px -8px rgba(20, 20, 20, 0.12);
  }
  .keyword-input-wrap.is-full #keywordInput { display: none; }
  .keyword-chips { display: contents; }
  #keywordInput {
    flex: 1 1 120px;
    min-width: 120px;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 4px 2px;
    color: var(--ink);
  }
  #keywordInput::placeholder { color: var(--ink-faint); }

  /* A chip in the composer is editable — it carries its own remove button.
     The read-only chips on cards and details are .keyword-tag below. */
  .keyword-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 6px 4px 10px;
    border-radius: 999px;
    background: rgba(20, 20, 20, 0.055);
    color: var(--ink-dim);
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
  }
  .keyword-chip-remove {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: inherit;
    cursor: pointer;
    opacity: 0.5;
    padding: 0;
    transition: opacity 0.18s ease, background 0.18s ease;
  }
  .keyword-chip-remove:hover { opacity: 1; background: rgba(20, 20, 20, 0.09); }
  .keyword-chip-remove svg { width: 9px; height: 9px; }

  .keyword-suggestions {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    z-index: 30;
    max-height: 216px;
    overflow-y: auto;
    padding: 6px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
    box-shadow: 0 18px 44px -22px rgba(20, 20, 20, 0.3);
    display: none;
  }
  .keyword-suggestions.is-open { display: block; }
  .keyword-suggestion-head {
    padding: 5px 9px 6px;
    font-size: 10.5px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
  }
  .keyword-suggestion {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    padding: 8px 9px;
    border: none;
    border-radius: 8px;
    background: transparent;
    text-align: left;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
  }
  /* is-active, not :hover alone — the arrow keys move this and the pointer
     must not be the only way to see where you are */
  .keyword-suggestion:hover,
  .keyword-suggestion.is-active { background: rgba(20, 20, 20, 0.055); }
  .keyword-suggestion-count { font-size: 11px; color: var(--ink-faint); flex-shrink: 0; }
  .keyword-suggestion.is-new { color: var(--ink-dim); }
  .keyword-suggestion.is-new .keyword-suggestion-count { font-style: italic; }

  /* ---------- keywords, on a card and in a detail ----------
     Neutral on purpose. Every other mark on a card is studio-coloured because
     it says whose the work is; a keyword says the opposite — that the work is
     not only this studio's — so colouring it by studio would argue against the
     one thing it is for. */
  .keyword-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .keyword-tag {
    display: inline-flex;
    align-items: center;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid rgba(20, 20, 20, 0.1);
    background: rgba(20, 20, 20, 0.04);
    color: var(--ink-dim);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  /* On a poster/hero the tags sit on the dark scrim, not on paper. */
  .card-content .keyword-tag {
    border-color: rgba(255, 255, 255, 0.28);
    background: rgba(255, 255, 255, 0.14);
    color: rgba(255, 255, 255, 0.9);
  }
  .card-content .keyword-tags { margin-top: 9px; }
  .poster-card .keyword-tag { font-size: 10.5px; padding: 2px 8px; }
  .hero-slide .keyword-tag { font-size: clamp(11px, 0.85vw, 13px); padding: 4px 12px; }
  /* In a detail the tags are buttons: each one is a way into everything else
     under that word. */
  button.keyword-tag { cursor: pointer; transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease; }
  button.keyword-tag:hover { background: rgba(20, 20, 20, 0.09); border-color: rgba(20, 20, 20, 0.2); color: var(--ink); }
  .question-card .keyword-tags { margin-top: 12px; }

  /* ---------- same thread ---------- */
  .expanded-section-thread .keyword-tags { margin-bottom: 12px; }
  .same-thread-list { display: flex; flex-direction: column; gap: 2px; }
  .same-thread-item {
    display: flex;
    align-items: baseline;
    gap: 9px;
    width: 100%;
    padding: 8px 10px;
    margin: 0 -10px;
    border: none;
    border-radius: 10px;
    background: transparent;
    text-align: left;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .same-thread-item:hover { background: rgba(20, 20, 20, 0.045); }
  /* The dot is the only studio colour in the block — whose it is, at a glance,
     without the row itself being tinted. */
  .same-thread-dot {
    flex-shrink: 0;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    transform: translateY(-1px);
  }
  .same-thread-text { flex: 1 1 auto; min-width: 0; }
  /* display: block on both — they are <span>s in a <span>, so without it the
     title and the meta line flow into each other as inline text and the
     margin-top below does nothing. The rows read as one run-on line. */
  .same-thread-title {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--ink);
  }
  .same-thread-meta {
    display: block;
    margin-top: 2px;
    font-size: 11px;
    color: var(--ink-faint);
  }
  /* Which shared word put this row here — the block can be answering more than
     one keyword at once, so the row has to say which. */
  .same-thread-word { font-weight: 500; }

  /* ---------- suggested keywords ----------
     A quiet row under the hint. Chips rather than a dropdown, because this is an
     offer and not a menu: nothing has to be dismissed, and ignoring it costs
     nothing. */
  .keyword-suggest {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 9px;
  }
  .keyword-suggest-label { font-size: 11.5px; color: var(--ink-faint); }
  .keyword-suggest-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .keyword-suggest-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border: 1px dashed var(--border-strong);
    border-radius: 999px;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-dim);
    cursor: pointer;
    transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease;
  }
  /* dashed until taken, solid once it is a real chip — the border says "offered"
     rather than "applied" */
  .keyword-suggest-chip:hover {
    border-style: solid;
    border-color: var(--ink);
    color: var(--ink);
    background: rgba(20, 20, 20, 0.04);
  }
  .keyword-suggest-chip::before { content: '+'; opacity: 0.5; font-weight: 600; }

  .keyword-hint {
    margin: 7px 0 0;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--ink-faint);
  }

  .compose-more {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 2px;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-dim);
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .compose-more:hover { color: var(--ink); }
  .compose-more svg { width: 13px; height: 13px; transition: transform 0.25s ease; }
  .compose-more.is-open svg { transform: rotate(180deg); }
  .compose-extra-fields { display: none; flex-direction: column; gap: 16px; min-height: 0; }
  .compose-extra-fields.is-open { display: flex; flex: 1 1 auto; }
  /* With the extras folded away, the one visible box would inherit the whole
     leftover column — a 600px void under one sentence, which is the same "this
     form wants an essay" signal the split was meant to remove. Same fix the
     Update type already uses: a box the size of what it is asking for. */
  .compose-fields.has-hidden-extras { flex: 0 0 auto; justify-content: flex-start; }
  .compose-fields.has-hidden-extras > .field { flex: 0 0 auto; }
  .compose-fields.has-hidden-extras > .field textarea { flex: 0 0 auto; min-height: 132px; max-height: 190px; }

  .field-link input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.25s ease;
  }
  .field-link input:focus { border-color: var(--border-strong); }
  .field-link input::placeholder { color: var(--ink-faint); }

  /* a link on an Update's detail */
  .detail-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 18px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--ink-dim);
    text-decoration: none;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .detail-link:hover { border-color: var(--border-strong); color: var(--ink); }
  .detail-link svg { width: 14px; height: 14px; }

  /* ---------- since your last visit ---------- */
  .for-you-section-label {
    padding: 10px 14px 6px;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-faint);
  }
  /* There is no "nothing new since your last visit" line any more: the heading
     is only drawn when it has rows under it, so it cannot contradict them. */

  /* ======================================================================
     For you — the indicator, its arrival preview, and the panel
     ====================================================================== */
  .notify-corner {
    position: fixed;
    top: 22px;
    right: 24px;
    z-index: 320;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-direction: row-reverse; /* button on the right, toast unrolling leftward */
  }

  .notify-btn {
    position: relative;
    width: 30px;
    height: 30px;
    flex-shrink: 0;
  }
  .notify-btn svg { width: 21px; height: 21px; }

  /* The count sits on the mark rather than beside it, so the whole thing stays
     one small object in the corner. */
  .notify-count {
    position: absolute;
    top: -3px;
    right: -5px;
    min-width: 15px;
    height: 15px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--ink);
    color: #ffffff;
    font-size: 9.5px;
    font-weight: 700;
    line-height: 15px;
    text-align: center;
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 0.28s ease, transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .notify-btn.has-unread .notify-count { opacity: 1; transform: scale(1); }
  .notify-btn.on-dark .notify-count { background: #ffffff; color: var(--ink); }

  /* which studios it came from, before you open anything */
  .notify-dots {
    position: absolute;
    left: 50%;
    bottom: -7px;
    transform: translateX(-50%);
    display: flex;
    gap: 3px;
  }
  .notify-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    box-shadow: 0 0 0 1.5px var(--bg);
  }
  .notify-btn.on-dark .notify-dot { box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.45); }

  /* A breath, not a blink: 3.2s, and it only touches opacity on a halo ring —
     something flashing in the corner of a reading screen is a tax, and this has
     to be able to sit there unread for an hour without being annoying. */
  .notify-btn.has-unread::after {
    content: '';
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    opacity: 0;
    animation: notify-breathe 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes notify-breathe {
    0%, 100% { opacity: 0; transform: scale(0.86); }
    50% { opacity: 0.28; transform: scale(1); }
  }
  /* one brighter beat when something actually lands */
  .notify-btn.is-arriving { animation: notify-land 0.9s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes notify-land {
    0% { transform: scale(1); }
    28% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .notify-btn.has-unread::after { animation: none; opacity: 0.24; }
    .notify-btn.is-arriving { animation: none; }
  }

  /* The preview unrolls out of the indicator and folds back into it, so what
     you saw arrive is visibly what the count is now about. */
  .notify-toast {
    display: flex;
    align-items: center;
    gap: 9px;
    max-width: 0;
    padding: 0;
    border-radius: 999px;
    border: 1px solid transparent;
    background: var(--surface);
    box-shadow: 0 14px 34px -20px rgba(20, 20, 20, 0.4);
    white-space: nowrap;
    overflow: hidden;
    opacity: 0;
    cursor: pointer;
    transition: max-width 0.52s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease, padding 0.4s ease;
  }
  .notify-toast.is-open {
    /* wide enough for the whole sentence in all four languages — a preview
       that ends in "..." makes you open the panel to find out what it said,
       which is exactly the trip it exists to save */
    max-width: min(56vw, 620px);
    padding: 9px 16px 9px 13px;
    border-color: var(--border);
    opacity: 1;
  }
  .notify-toast-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .notify-toast-text {
    font-size: 12.5px;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- the panel ---------- */
  .for-you-panel {
    position: fixed;
    top: 62px;
    right: 24px;
    z-index: 330;
    width: min(400px, calc(100vw - 48px));
    max-height: min(560px, calc(100vh - 110px));
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface);
    box-shadow: 0 34px 80px -34px rgba(20, 20, 20, 0.42);
    opacity: 0;
    transform: translateY(-8px) scale(0.985);
    transform-origin: top right;
    pointer-events: none;
    transition: opacity 0.24s ease, transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .for-you-panel.is-open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

  .for-you-head {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 16px 12px 20px;
    border-bottom: 1px solid var(--border);
  }
  .for-you-head h2 {
    flex: 1;
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-size: 21px;
    font-weight: 600;
    color: var(--ink);
  }
  .for-you-mark-all {
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 11.5px;
    color: var(--ink-faint);
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .for-you-mark-all:hover { color: var(--ink); }
  .for-you-close {
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .for-you-close svg { width: 14px; height: 14px; }
  .for-you-close:hover { background: rgba(20, 20, 20, 0.06); color: var(--ink); }

  .for-you-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px; }

  .for-you-item {
    position: relative;
    display: flex;
    gap: 11px;
    width: 100%;
    padding: 12px 12px 12px 14px;
    border: none;
    border-radius: 13px;
    background: transparent;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .for-you-item:hover { background: rgba(20, 20, 20, 0.035); }
  /* unread: a short bar in the sending studio's colour, not a badge — the
     information is "this one is new and it came from there", and a coloured
     edge says both without adding a word */
  .for-you-mark {
    position: absolute;
    left: 4px;
    top: 15px;
    width: 3px;
    height: 20px;
    border-radius: 999px;
    background: var(--item-studio);
    opacity: 0;
    transition: opacity 0.24s ease;
  }
  .for-you-item.is-unread .for-you-mark { opacity: 1; }
  .for-you-item.is-unread .for-you-text { color: var(--ink); font-weight: 550; }

  .for-you-body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  /* One sentence per row, with the time inside it. The studio is already named
     mid-sentence, so the dot is the only other marker the row needs. */
  .for-you-text { font-size: 13px; line-height: 1.5; color: var(--ink-dim); }
  .for-you-dot {
    flex: 0 0 auto;
    width: 7px;
    height: 7px;
    margin-top: 5px;
    border-radius: 50%;
    background: var(--item-studio);
  }
  .for-you-time { color: var(--ink-faint); white-space: nowrap; }

  .for-you-empty { padding: 34px 22px 40px; text-align: center; }
  .for-you-empty-line { margin: 0 0 8px; font-size: 14px; color: var(--ink-dim); }
  .for-you-empty-sub { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-faint); }

  /* what has come back, on your own card's detail */
  .card-status .card-status-row {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12.5px;
    color: var(--ink-dim);
  }
  .card-status .card-status-row + .card-status-row { margin-top: 6px; }
  .card-status-mark {
    flex-shrink: 0;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border-strong);
  }
  /* and on the card face: dots only, no number — a number here would be a
     ranking of cards against each other */
  .card-came-back { display: inline-flex; gap: 4px; margin-top: 9px; }
  .card-came-back .card-dot { width: 7px; height: 7px; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.7); }

  /* ---------- the lineage strip ----------
     Work → work. Each box is a card someone wrote; the studio and the author
     are metadata inside it, next to a colour dot, never a box of their own.

     Stacked, not laid out sideways. This pane is ~430px wide and four nodes in
     a row is four nodes you have to scroll to read — a chain you can only see
     two links of is not a chain. Top to bottom it all fits, and the arrow
     between two nodes has room for the word that says how they are related,
     which is the part a bare "→" leaves out. */
  .lineage-strip {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    margin-bottom: 16px;
  }

  .lineage-node {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 10px 12px 11px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }
  .lineage-node:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: var(--shadow-resting); }
  /* the one you are reading: outlined in its own studio's colour, so the strip
     reads as a sentence with a subject rather than a row of equal boxes */
  .lineage-node.is-self {
    cursor: default;
    border-color: var(--node-studio);
    box-shadow: inset 0 0 0 1px var(--node-studio);
  }
  .lineage-node.is-self:hover { transform: none; box-shadow: inset 0 0 0 1px var(--node-studio); }

  .lineage-node-here {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--node-studio);
  }
  .lineage-node-type {
    align-self: flex-start;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(20, 20, 20, 0.055);
    font-size: 9px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-dim);
  }
  .lineage-node-title {
    font-size: 12.5px;
    line-height: 1.4;
    font-weight: 550;
    color: var(--ink);
  }
  .lineage-node-meta {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    color: var(--ink-faint);
  }
  .lineage-node-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .lineage-node-note {
    font-size: 10.5px;
    line-height: 1.45;
    color: var(--ink-faint);
    font-style: italic;
  }

  /* The arrow carries the relation, because "→" alone says two things are
     connected and nothing about how. */
  .lineage-arrow {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 0 6px 15px;
    color: var(--ink-faint);
  }
  .lineage-arrow-label {
    font-size: 9px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .lineage-arrow-glyph { display: flex; opacity: 0.5; }
  .lineage-arrow-glyph svg { width: 14px; height: 14px; transform: rotate(90deg); }

  /* ======================================================================
     Reactions, replies, emoji
     ====================================================================== */
  .reaction-pills { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
  .reaction-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px 7px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #ffffff;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink-dim);
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }
  .reaction-pill svg { width: 14px; height: 14px; flex-shrink: 0; }
  .reaction-pill:hover { border-color: var(--border-strong); color: var(--ink); transform: translateY(-1px); }
  .reaction-pill.is-mine { border-color: var(--ink); background: var(--ink); color: #ffffff; }

  .reaction-empty { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-faint); }

  .reaction-item {
    padding: 13px 0 14px;
    border-top: 1px solid var(--border);
  }
  .reaction-item:first-child { border-top: none; padding-top: 2px; }

  .reaction-item-head {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    font-size: 11.5px;
    color: var(--ink-faint);
  }
  .reaction-item-head .card-dot { width: 7px; height: 7px; box-shadow: none; }
  .reaction-author { font-weight: 650; color: var(--ink); font-size: 12.5px; }
  .reaction-studio { color: var(--ink-faint); }
  /* the kind, said in words rather than implied by an icon alone */
  .reaction-kind {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(20, 20, 20, 0.05);
    color: var(--ink-dim);
    font-size: 10.5px;
  }
  .reaction-kind svg { width: 11px; height: 11px; }
  .reaction-time { margin-left: auto; }

  .reaction-note {
    margin: 8px 0 0;
    font-size: 13px;
    line-height: 1.6;
    color: rgba(28, 28, 30, 0.8);
    white-space: pre-wrap;
  }

  /* the optional line, hidden until you ask for it */
  .reaction-note-editor { display: none; gap: 7px; margin-top: 9px; }
  .reaction-item.is-noting .reaction-note-editor { display: flex; }
  .reaction-item.is-noting .reaction-note-toggle { display: none; }
  .reaction-note-editor input {
    flex: 1;
    min-width: 0;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #ffffff;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--ink);
    outline: none;
  }
  .reaction-note-editor input:focus { border-color: var(--border-strong); }
  .reaction-note-save, .reply-send {
    flex-shrink: 0;
    padding: 7px 13px;
    border: none;
    border-radius: 10px;
    background: var(--ink);
    color: #ffffff;
    font-family: inherit;
    font-size: 11.5px;
    cursor: pointer;
  }
  .reaction-note-toggle {
    margin-top: 8px;
    padding: 0;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 11.5px;
    color: var(--ink-faint);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .reaction-note-toggle:hover { color: var(--ink); }

  /* ---------- replies: one level, and visibly one level ---------- */
  .reply-list { margin: 4px 0 0 13px; padding-left: 12px; border-left: 1.5px solid var(--border); }
  .reply-item { padding: 9px 0 2px; }
  .reply-head {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--ink-faint);
  }
  .reply-head .card-dot { width: 6px; height: 6px; box-shadow: none; }
  .reply-author { font-weight: 650; color: var(--ink); font-size: 11.5px; }
  .reply-time { margin-left: auto; }
  .reply-text { margin: 5px 0 0; font-size: 12.5px; line-height: 1.55; color: rgba(28, 28, 30, 0.78); white-space: pre-wrap; }

  .reply-form { display: flex; gap: 7px; margin: 9px 0 0 25px; }
  .reply-form input {
    flex: 1;
    min-width: 0;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #ffffff;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--ink);
    outline: none;
  }
  .reply-form input:focus { border-color: var(--border-strong); }
  .reply-form input::placeholder { color: var(--ink-faint); }

  /* ---------- emoji: the lightest layer, and it stays light ----------
     The count is in the body size and the body colour. Bold, coloured or large
     would turn a row of small agreements into a scoreboard, which is the thing
     this app does not do. */
  .emoji-row { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .emoji-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px 2px 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #ffffff;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease;
  }
  .emoji-chip:hover { border-color: var(--border-strong); }
  .emoji-chip.is-mine { border-color: var(--ink-dim); background: rgba(20, 20, 20, 0.045); }
  .emoji-glyph { font-size: 12px; line-height: 1.4; }
  .emoji-count { font-size: 10.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  .emoji-add { position: relative; }
  .emoji-add-btn {
    width: 21px;
    height: 21px;
    border: 1px dashed var(--border-strong);
    border-radius: 50%;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .emoji-add-btn svg { width: 11px; height: 11px; }
  /* stays out of the way until you go looking for it */
  .reaction-item:hover .emoji-add-btn,
  .reply-item:hover .emoji-add-btn,
  .body-emoji:hover .emoji-add-btn,
  .emoji-add.is-open .emoji-add-btn { opacity: 1; }
  .emoji-add-btn:hover { color: var(--ink); border-color: var(--ink-dim); }

  .emoji-picker {
    position: absolute;
    bottom: calc(100% + 7px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    z-index: 40;
    display: flex;
    gap: 2px;
    padding: 5px 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    box-shadow: 0 12px 30px -16px rgba(20, 20, 20, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .emoji-add.is-open .emoji-picker { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .emoji-option {
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 50%;
    background: transparent;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.16s ease, transform 0.16s ease;
  }
  .emoji-option:hover { background: rgba(20, 20, 20, 0.06); transform: scale(1.12); }

  /* the body's own row, under the knowledge rather than beside it */
  .body-emoji { margin: 26px 0 4px; }


  /* Below this both columns would be too narrow to read, so the response side
     goes under the body and the whole thing becomes one scroller again. */
  @media (max-width: 1080px) {
    .expanded-panes { grid-template-columns: minmax(0, 1fr); overflow-y: auto; }
    .expanded-pane { overflow: visible; }
    .expanded-pane-response {
      border-left: none;
      border-top: 1px solid var(--border);
      padding-top: clamp(22px, 3vh, 32px);
    }
    .expanded-pane-inner, .expanded-pane-response .expanded-pane-inner { max-width: 720px; }
  }

  /* Quieter than the original timestamp beside it: that a card was corrected
     is worth knowing, but it is not the headline. */
  .edited-stamp {
    font-size: 11.5px;
    font-style: italic;
    color: var(--ink-faint);
  }
  .edited-stamp::before { content: '· '; font-style: normal; }

  .expanded-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-bottom: 14px;
  }
  .expanded-meta .card-dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: none; }
  .expanded-meta .sep { opacity: 0.5; }

  .expanded-title {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 3vw, 44px);
    line-height: 1.18;
    letter-spacing: -0.02em;
    margin: 0 0 30px;
    color: var(--ink);
  }

  .expanded-section { margin-bottom: 19px; }
  .expanded-section .label {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--studio-color, #9aa3b8);
    margin-bottom: 7px;
  }
  /* Paragraph breaks the author typed are part of what they wrote. Everything
     here is set with textContent, so pre-wrap is the whole fix: newlines render
     and runs of spaces still collapse the way prose should. */
  .expanded-section p {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.65;
    color: rgba(28, 28, 30, 0.78);
    white-space: pre-wrap;
  }

  .expanded-footer {
    margin-top: 22px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  .applied-summary { font-size: 12.5px; color: var(--ink-dim); }

  /* One line under each label saying what kind of thing the block holds. The
     two blocks in this pane look alike and are not: one is talk, one is
     lineage, and the rule above the second one is the seam. */
  .section-caption {
    margin: -6px 0 13px;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--ink-faint);
  }
  .expanded-section-lineage {
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
  }

  /* ---------- lineage — what this card derived from, what derived from it,
     related ideas, and which studios applied it. A plain list, on purpose:
     a small radial graph was tried here and didn't earn its keep next to
     the bigger Discover cards elsewhere on this page — the lineage "moment"
     now lives there instead (see .card-lineage-hint), light and textual.
     This modal list is the one place it's spelled out in full. ---------- */
  .lineage-list-wrap { display: flex; flex-direction: column; gap: 9px; }
  .lineage-empty { margin: 0; font-size: 13px; line-height: 1.55; color: var(--ink-faint); font-style: italic; }
  .lineage-row { display: flex; align-items: baseline; gap: 9px; font-size: 13.5px; flex-wrap: wrap; }
  .lineage-row-studio { font-size: 11.5px; color: var(--ink-faint); }
  .lineage-row-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; align-self: center; }
  .lineage-row-relation {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .lineage-row-name { color: var(--ink); font-weight: 550; }

  .apply-btn {
    padding: 13px 24px;
    border-radius: 999px;
    border: 1.5px solid var(--studio-color, var(--ink));
    background: transparent;
    color: var(--studio-color, var(--ink));
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.3s ease, color 0.3s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease;
  }
  .apply-btn:hover { background: var(--studio-color, var(--ink)); color: #fff; transform: translateY(-1px); box-shadow: 0 10px 24px -14px rgba(20, 20, 20, 0.45); }
  .apply-btn:active { transform: scale(0.96); }
  .apply-btn.is-applied { background: var(--studio-color, var(--ink)); color: #fff; }

  /* ---------- the "we applied this too" flow ----------
     Three short questions, one at a time. A single form with all three on it
     would be a form; asked one at a time it stays a decision you can back out
     of, which is what Cancel and the backdrop are for. ---------- */
  .apply-flow {
    position: fixed;
    inset: 0;
    z-index: 520;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .apply-flow.is-open { display: flex; }
  .apply-flow-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(20, 20, 20, 0.42);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  .apply-flow-sheet {
    position: relative;
    display: flex;
    flex-direction: column;
    width: min(520px, 100%);
    max-height: min(640px, calc(100vh - 48px));
    border-radius: 20px;
    background: #ffffff;
    box-shadow: 0 40px 90px -30px rgba(20, 20, 20, 0.5);
    overflow: hidden;
  }
  .apply-flow-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 20px 18px 14px 22px;
  }
  .apply-flow-head-text { flex: 1 1 auto; min-width: 0; }
  .apply-flow-head h2 {
    margin: 0;
    font-family: 'Newsreader', serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--ink);
  }
  .apply-flow-source {
    margin: 5px 0 0;
    font-size: 12px;
    line-height: 1.45;
    color: var(--ink-faint);
  }
  .apply-flow-progress {
    padding: 0 22px 14px;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .apply-flow-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 0 22px 4px;
  }
  .apply-step { display: none; }
  .apply-step.is-active { display: block; }
  .apply-step-q {
    margin: 0 0 6px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
  }
  .apply-step-hint { margin: 0 0 14px; font-size: 12px; line-height: 1.5; color: var(--ink-faint); }

  .apply-target-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 10px; }
  .apply-option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s ease, background 0.18s ease;
  }
  .apply-option:hover { border-color: var(--border-strong); }
  .apply-option.is-picked {
    border-color: var(--ink);
    background: rgba(20, 20, 20, 0.035);
  }
  .apply-option-dot { width: 7px; height: 7px; margin-top: 6px; border-radius: 50%; flex-shrink: 0; }
  .apply-option-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .apply-option-title { font-size: 13px; line-height: 1.4; font-weight: 550; color: var(--ink); }
  .apply-option-meta {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
  }
  .apply-empty { margin: 0 0 12px; font-size: 12.5px; color: var(--ink-faint); font-style: italic; }

  .apply-new-update {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 11px 13px;
    border: 1px dashed var(--border-strong);
    border-radius: 12px;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    font-weight: 550;
    color: var(--ink-dim);
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s ease, color 0.18s ease;
  }
  .apply-new-update:hover { border-color: var(--ink); color: var(--ink); }
  .apply-new-update.is-picked { border-style: solid; border-color: var(--ink); color: var(--ink); }
  .apply-new-update-plus { font-size: 15px; line-height: 1; }
  .apply-new-update-box { margin-top: 9px; }
  .apply-new-update-box textarea,
  #applyNoteInput {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
    resize: none;
  }
  .apply-new-update-box textarea:focus,
  #applyNoteInput:focus { outline: none; border-color: var(--ink); }

  .apply-relation-list { display: flex; flex-direction: column; gap: 7px; }

  .apply-summary {
    margin-top: 14px;
    padding: 12px 13px;
    border-radius: 12px;
    background: rgba(20, 20, 20, 0.035);
    font-size: 12px;
    line-height: 1.55;
    color: var(--ink-dim);
  }
  .apply-summary strong { font-weight: 600; color: var(--ink); }

  .apply-flow-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 22px 20px;
    border-top: 1px solid var(--border);
  }
  .apply-flow-foot-right { display: flex; align-items: center; gap: 8px; }
  .apply-flow-next {
    padding: 11px 20px;
    border-radius: 999px;
    border: none;
    background: var(--ink);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .apply-flow-next:hover:not(:disabled) { transform: translateY(-1px); }
  .apply-flow-next:disabled { opacity: 0.32; cursor: not-allowed; }

  .reveal-on-open {
    opacity: 0;
    transform: translateY(10px);
  }

  /* ---------- delete (own cards only) — tucked in a bottom corner,
     deliberately quiet (no red) so it never reads as the loudest thing on
     the card; a confirm step sits between the link and anything real ---------- */
  .expanded-delete-row {
    margin-top: 18px;
    padding-top: 4px;
    display: flex;
    justify-content: flex-end;
  }
  .delete-link {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 4px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: color 0.25s ease;
  }
  .delete-link:hover { color: var(--ink-dim); }
  .delete-link svg { width: 13px; height: 13px; }

  .delete-confirm { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  /* Edit borrows Delete's shape and sits beside it, but stays the neutral of
     the two: fixing what you wrote is ordinary, taking it back isn't. */
  .edit-link {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 13px 7px 11px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--ink-dim);
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .edit-link svg { width: 15px; height: 15px; }
  .edit-link:hover { color: var(--ink); border-color: var(--border-strong); background: rgba(20, 20, 20, 0.03); }
  .delete-confirm p { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--ink-dim); max-width: 320px; text-align: right; }
  .delete-confirm-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .btn-ghost-sm {
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--ink-dim);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }
  .btn-ghost-sm:hover { border-color: var(--ink); color: var(--ink); }
  .btn-ghost-sm:active { transform: scale(0.96); }

  .btn-delete-confirm {
    padding: 7px 14px;
    border-radius: 999px;
    border: none;
    background: var(--ink-dim);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .btn-delete-confirm:hover { background: var(--ink); transform: translateY(-1px); }
  .btn-delete-confirm:active { transform: translateY(0) scale(0.96); }

  /* ======================================================================
     Question detail — a two-pane layout that takes over the expanded-card
     shell (same FLIP open/close animation, same modal frame) instead of the
     normal problem/tried/result body: a live-feeling Conversation on the
     left, a "Conversation Brief" summary panel on the right. Uses a
     container query (not a viewport media query) so it responds to the
     modal's own width, not the browser window's. ---------- */
  .question-detail {
    display: none;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    container-type: inline-size;
    container-name: question-detail;
  }
  /* 66px, not 30: a question has no banner above it, so this header is the
     first thing under the fixed top-left hamburger and back arrow. */
  .question-detail-header { flex-shrink: 0; padding: 66px 40px 18px; border-bottom: 1px solid var(--border); }

  /* ---------- what follows a resolved question ---------- */
  /* A column, not one wrapping row: the lineage panel below is much taller than
     a button, and asking flex-wrap to keep the two apart is a bet that depends
     on how wide the panel happens to be. */
  .resolved-next {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .resolved-next-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; }
  .resolved-next-label {
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .resolved-next-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .resolved-next-btn {
    padding: 8px 15px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background: #ffffff;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-dim);
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }
  .resolved-next-btn:hover { border-color: var(--ink); color: var(--ink); transform: translateY(-1px); }
  .resolved-next-lineage { align-self: stretch; max-width: 560px; }
  .question-detail-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-bottom: 12px;
  }
  .question-detail-meta .card-dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: none; }
  .question-detail-meta .sep { opacity: 0.5; }
  .question-detail-title {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 23px;
    line-height: 1.36;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--ink);
  }

  .qd-delete-btn {
    margin-left: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    border-radius: 8px;
    transition: color 0.25s ease, background 0.25s ease;
  }
  .qd-delete-btn:hover { color: var(--ink-dim); background: rgba(20, 20, 20, 0.05); }
  .qd-delete-btn svg { width: 14px; height: 14px; }

  .question-tabs { display: none; flex-shrink: 0; border-bottom: 1px solid var(--border); }
  .question-tab {
    flex: 1;
    padding: 13px;
    border: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 650;
    color: var(--ink-faint);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.25s ease, border-color 0.25s ease;
  }
  .question-tab.is-active { color: var(--ink); border-bottom-color: var(--ink); }

  .question-panes { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 340px; }
  .question-pane { min-height: 0; display: flex; flex-direction: column; }
  .question-pane-conversation { border-right: 1px solid var(--border); }

  .conversation-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  /* ---------- one turn in the conversation ----------
     This pane is wide, and a column of near-identical grey boxes running its
     full width has no rhythm: you cannot tell at a glance where one person
     stops and the next starts, or how many people are even in it. Three cheap
     fixes, no new colours — an initials disc in the speaker's studio colour, a
     line length short of the pane, and the meta row hung off the disc so the
     eye has a left edge to run down. */
  .conversation-message { display: flex; gap: 10px; max-width: 66%; }
  .conversation-message.is-me { align-self: flex-end; flex-direction: row-reverse; }
  .conversation-message-body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .conversation-message.is-me .conversation-message-body { align-items: flex-end; }
  .conversation-avatar {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    margin-top: 18px; /* sits beside the bubble, not beside the name above it */
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--speaker-color, var(--ink));
    color: #ffffff;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .conversation-message-meta { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-faint); }
  .conversation-message-meta .card-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .conversation-message-author { font-weight: 650; color: var(--ink-dim); }
  .conversation-message-bubble {
    background: rgba(20, 20, 20, 0.045);
    border-radius: 14px;
    padding: 11px 15px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink);
  }
  .conversation-message.is-me .conversation-message-bubble { background: var(--ink); color: #ffffff; }
  .conversation-message.is-entering { opacity: 0; transform: translateY(8px); animation: conversationMessageIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  @keyframes conversationMessageIn { to { opacity: 1; transform: translateY(0); } }

  .conversation-input-row {
    flex-shrink: 0;
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  #conversationInput {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.25s ease;
  }
  #conversationInput:focus { border-color: var(--border-strong); }
  #conversationInput::placeholder { color: var(--ink-faint); }
  .conversation-send-btn {
    flex-shrink: 0;
    padding: 10px 18px;
    border-radius: 999px;
    border: none;
    background: var(--ink);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 650;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
  }
  .conversation-send-btn:hover { transform: translateY(-1px); }
  .conversation-send-btn:active { transform: translateY(0) scale(0.96); }

  .brief-header {
    flex-shrink: 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .brief-header-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .brief-ai-label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--studio-color, var(--ink-dim));
  }
  .brief-updated { font-size: 11px; color: var(--ink-faint); transition: opacity 0.2s ease; }

  .brief-body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 22px; transition: opacity 0.25s ease; }
  .brief-body.is-updating { opacity: 0.45; }
  .brief-section { margin-bottom: 18px; }
  .brief-section:last-child { margin-bottom: 0; }
  .brief-section .label {
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
    margin-bottom: 7px;
  }
  .brief-section p { margin: 0; font-size: 13px; line-height: 1.62; color: rgba(28, 28, 30, 0.8); }
  .brief-section ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.62; color: rgba(28, 28, 30, 0.8); }
  .brief-section li.is-new { animation: conversationMessageIn 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
  .brief-empty { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-faint); font-style: italic; }

  /* narrow modal: the brief collapses behind a tab instead of sitting
     side-by-side — a container query so this is about the MODAL's own
     width, not the browser window's. */
  /* 1080px, matching the knowledge detail's own stacking point — this was 720
     when the question detail was a modal sized to ~86% of the window, so the
     container only ever got that narrow on a small screen. Fullscreen, the
     container IS the window, and at 900px the brief was down to 340px of
     bulleted text beside a 560px conversation: two columns too narrow to be
     two columns. */
  @container question-detail (max-width: 1080px) {
    .question-tabs { display: flex; }
    .question-panes { grid-template-columns: 1fr; }
    .question-pane-conversation { border-right: none; }
    .question-pane { display: none; }
    .question-pane.is-active-tab { display: flex; }
  }

  /* ======================================================================
     Threads — the whole weave on one white screen.

     Same world as the feed, not the lobby: the lobby's dark sky is the place
     you choose a studio from, and this is a page about the work itself. So it
     is paper, and the only colour on it is the two studio colours.

     SVG rather than canvas. Twenty nodes and fifty marks is nowhere near
     needing a canvas, and in SVG the hover states are CSS, the labels are real
     text at real weights, and a node is a DOM node you can put a listener on.
     ====================================================================== */
  /* A floor, not a surface: height and overflow come from the shared floor rule
     above, and all this adds is the column the head and the map sit in. It was
     `position: fixed; inset: 0` when it was reached from the menu; inside the
     stage that would have pinned it to the viewport and left it behind while the
     other floors slid. */
  .threads-section {
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* The heading is given room and then gets out of the way: this page is one
     image, and a title competing with it would make it a slide. */
  .threads-head {
    flex: 0 0 auto;
    /* Less top room than the surface version had: arriving here by wheel means
       floor 3 has just left upward, and the eye is already at the top of the
       screen rather than needing to be walked down to it. */
    padding: clamp(34px, 4.6vh, 62px) 56px clamp(2px, 0.8vh, 12px);
    text-align: center;
  }
  .threads-head h1 {
    margin: 0;
    /* Cormorant Garamond, not Newsreader: Cormorant is the serif this build
       actually loads, and it is the voice floor 3's questions are set in. */
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(36px, 3.6vw, 58px);
    font-weight: 600;
    letter-spacing: -0.005em;
    line-height: 1.05;
    color: var(--ink);
  }
  .threads-head p {
    margin: clamp(8px, 1.2vh, 15px) 0 0;
    font-size: clamp(12.5px, 0.95vw, 14.5px);
    letter-spacing: 0.015em;
    color: var(--ink-faint);
  }

  .threads-stage { position: relative; flex: 1 1 auto; min-height: 0; }

  /* ---------- floor 4's footer ----------
     The wordmark, and the one line that says what the weave above it is. Fixed
     like the other chrome rather than in the floor's flow: the map wants every
     pixel of the stage, and a footer inside it would take a band out of the
     middle of the composition. Only shown on floor 4 (see updateChrome). */
  .threads-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .threads-footer.is-visible { opacity: 1; transform: none; }
  .threads-footer-line {
    margin: 0;
    font-size: 12.5px;
    letter-spacing: 0.015em;
    color: var(--ink-faint);
  }
  .threads-footer-mark {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: rgba(28, 28, 30, 0.22);
  }
  /* Width and height are stated outright, and that matters more than it looks.

     An <svg> with no width/height attributes takes its intrinsic size from its
     viewBox aspect ratio. Sizing it with `top: 0; bottom: 58px` instead left the
     height indefinite, so it derived one — and since layoutThreads writes the
     viewBox from the measured box, the two fed each other: a first measurement
     of zero clamped the viewBox to the 360x320 minimum, the svg then sized
     itself to 1600x1422 from that ratio, and half the weave was laid out below
     the floor.

     The 58px is the footer's lane, kept in step with THREAD_FOOTER_LANE in the
     script. */
  .threads-svg {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: calc(100% - 58px);
    overflow: visible;
  }

  /* ---------- one thread ----------
     Thicker than a hairline and coloured along its length, because the page is
     about weaving and a 1px grey line is a diagram. Each thread carries a
     gradient from the studio colour at one end to the studio colour at the
     other (see linkGradientFor), so a thread between the two studios is
     literally blue running into orange — the page's argument drawn rather than
     annotated. */
  .threads-link {
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    opacity: 0.5;
    transition: opacity 0.42s ease, stroke-width 0.42s ease;
  }
  /* Between the studios rather than inside one: the reason the page exists, so
     it is the one thing drawn at full strength. */
  .threads-link.is-crossing { stroke-width: 2.7; opacity: 0.92; }

  /* ---------- one keyword ----------
     The word IS the node. No plate, no ring, no chip — a circle with a label
     hanging off it was the single thing that made this read as a chart. What
     sits behind the word is a bloom of the colour of whoever is working on it,
     and nothing else. */
  .threads-node { cursor: pointer; }
  .threads-glow { pointer-events: none; }
  /* transparent fill still receives events; `visible` would not be enough on a
     shape with no paint */
  .threads-hit { pointer-events: all; }
  /* grab/grabbing on the word itself, and no text selection mid-drag — dragging
     across a page of type otherwise highlights half of it */
  .threads-node { cursor: grab; }
  .threads-svg.is-dragging { cursor: grabbing; user-select: none; }
  .threads-svg.is-dragging .threads-node { cursor: grabbing; }
  /* the held word loses the arrival/focus easing so it tracks the pointer
     exactly rather than lagging behind it */
  .threads-svg.is-dragging .threads-recede { transition: opacity 0.42s ease; }
  .threads-node-label {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    fill: var(--ink);
    text-anchor: middle;
    pointer-events: none;
    /* Size is set per node in buildThreadsGraph, across a range narrow enough
       that a busy keyword reads as busy and never as senior. */
  }
  .threads-node-count {
    font-family: 'Inter', sans-serif;
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    fill: var(--ink-faint);
    text-anchor: middle;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.34s ease;
  }
  .threads-node:hover .threads-node-count,
  .threads-node.is-open .threads-node-count { opacity: 1; }
  /* The bloom breathes a little under the pointer — the only hover flourish on
     the page, and it is the same gesture the whole map is already making. */
  .threads-glow-shape { transition: opacity 0.42s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
  .threads-node:hover .threads-glow-shape,
  .threads-node.is-open .threads-glow-shape { opacity: 1; transform: scale(1.09); }

  /* ---------- one piece of writing ----------
     A mark per card, ringed around the word in its studio's colour, each with
     its own soft halo so the ring reads as light rather than as tick marks. */
  .threads-dot { cursor: pointer; transition: r 0.3s ease; }
  .threads-dot-halo { pointer-events: none; }
  .threads-node:hover .threads-dot { r: 4.4; }

  /* ---------- focus ----------
     Hovering a word asks "what does this touch?", so everything that is not an
     answer steps back — dimmer and very slightly smaller, which reads as depth
     rather than as being switched off. Three nested groups, one transform each:
     drift writes to the outer, arrival to the middle, this to the inner, and
     none of them can overwrite another. */
  .threads-recede { transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.42s ease; }
  .threads-svg.is-focusing .threads-node:not(.is-lit) .threads-recede { opacity: 0.17; transform: scale(0.93); }
  .threads-svg.is-focusing .threads-link:not(.is-lit) { opacity: 0.08; }
  .threads-svg.is-focusing .threads-link.is-lit { opacity: 1; }

  /* ---------- arrival ----------
     The words rise on a stagger, then the threads are drawn between them left
     to right — a dashoffset the length of each path, released in order of where
     the thread starts. It should read as weaving, not as a map loading. */
  .threads-rise { opacity: 0; transform: translateY(16px) scale(0.93); }
  .threads-rise.is-in {
    opacity: 1;
    transform: none;
    transition: opacity 0.7s ease, transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .threads-link.is-drawing { transition: stroke-dashoffset 1.15s cubic-bezier(0.33, 0, 0.2, 1); }
  @media (prefers-reduced-motion: reduce) {
    .threads-rise { opacity: 1; transform: none; }
    .threads-link { stroke-dasharray: none !important; stroke-dashoffset: 0 !important; }
  }

  .threads-tip {
    position: absolute;
    z-index: 4;
    max-width: 300px;
    padding: 7px 11px;
    border-radius: 9px;
    background: rgba(20, 20, 20, 0.92);
    color: #fff;
    font-size: 11.5px;
    line-height: 1.4;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -100%);
    transition: opacity 0.18s ease;
  }
  .threads-tip.is-on { opacity: 1; }
  .threads-tip-studio { opacity: 0.62; }

  .threads-empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 0 40px;
  }
  .threads-empty-line {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(19px, 1.9vw, 27px);
    color: var(--ink);
  }
  .threads-empty-sub { margin: 0; font-size: 13px; color: var(--ink-faint); max-width: 34ch; }

  /* ---------- the story of one keyword ---------- */
  .threads-story {
    position: absolute;
    /* against the floor now, not the window — the floor is the positioned
       ancestor, so this rides with it as the stage translates */
    top: 0;
    right: 0;
    bottom: 0;
    width: min(410px, 34vw);
    z-index: 5;
    display: flex;
    flex-direction: column;
    /* The notification bell is fixed chrome on every surface and sits exactly
       where this panel's own close button wanted to be. Starting the head below
       it is cheaper than moving a control that is in the same place everywhere
       else in the app — and the extra air suits the serif anyway. */
    padding: clamp(64px, 8vh, 84px) clamp(24px, 2.2vw, 34px) 26px;
    border-left: 1px solid var(--border);
    background: rgba(252, 251, 248, 0.95);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transform: translateX(100%);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.36s ease;
  }
  .threads-story.is-open { transform: none; opacity: 1; pointer-events: auto; }

  .threads-story-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  .threads-story-word {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(24px, 2.2vw, 33px);
    font-weight: 600;
    line-height: 1.14;
    letter-spacing: -0.005em;
    color: var(--ink);
  }
  .threads-story-meta { margin-top: 5px; font-size: 11.5px; color: var(--ink-faint); }
  .threads-story-close {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .threads-story-close:hover { background: rgba(20, 20, 20, 0.06); color: var(--ink); }
  .threads-story-close svg { width: 13px; height: 13px; }
  .threads-story-lead {
    margin: 16px 0 4px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
  }
  .threads-story-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    margin: 0 -10px;
    padding: 8px 10px 0;
    display: flex;
    flex-direction: column;
  }
  /* The rail is the thread, drawn down the left of the list: the panel is a
     chain in time, and the numbered order is the whole point of it. */
  .threads-story-item {
    position: relative;
    display: block;
    width: 100%;
    /* the rail runs the height of the list, so the rows sit tighter than they
       would as separate cards — this is one chain, not five entries */
    text-align: left;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 11px 10px 13px 26px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    transition: background 0.2s ease;
  }
  .threads-story-item:hover { background: rgba(20, 20, 20, 0.045); }
  .threads-story-item::before {
    content: '';
    position: absolute;
    left: 9px;
    top: 17px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--item-studio, var(--ink));
  }
  /* every item but the last carries the line down to the next */
  .threads-story-item::after {
    content: '';
    position: absolute;
    left: 12px;
    top: 26px;
    bottom: -2px;
    width: 1px;
    background: rgba(20, 20, 20, 0.13);
  }
  .threads-story-item:last-child::after { display: none; }
  .threads-story-title { font-size: 13.5px; font-weight: 550; line-height: 1.4; color: var(--ink); letter-spacing: -0.002em; }
  .threads-story-sub { margin-top: 3px; font-size: 11px; color: var(--ink-faint); }
  /* The author's own line, in the serif the rest of their writing is set in —
     it is a quotation inside a list, and the switch of voice is what says so. */
  .threads-story-line {
    margin-top: 6px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    line-height: 1.45;
    color: var(--ink-dim);
  }
  /* A relation the author declared, as opposed to the shared word that put the
     row in this list at all. Worth marking because it is the stronger claim. */
  .threads-story-rel {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(20, 20, 20, 0.055);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
  }

  @media (max-width: 900px) {
    /* the panel becomes a sheet across the foot rather than a column */
    .threads-story {
      top: auto;
      width: auto;
      left: 0;
      right: 0;
      max-height: 58%;
      border-left: none;
      border-top: 1px solid var(--border);
      transform: translateY(100%);
    }
  }

  /* ======================================================================
     Designers — who is weaving this, one studio per screen.

     Deliberately a roster and not a scoreboard: nothing on a card can be
     compared against the next card (photo, name, job title, how to reach them
     — that's all), nothing is ordered by output, no card says how much anyone
     has shared, and the two studios are never on screen together to be read
     side by side. See the DESIGNERS comment in the script for why this is a
     rule and not a style choice.

     The screen is sized to fill rather than to sit politely in the middle of
     itself: the roster IS the content here, so the cards take the height and
     the studio arrows go out to the edges of the viewport where there is room
     to make them obvious.
     ====================================================================== */
  .designers-viewport {
    position: relative;
    height: var(--floor-h);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    /* heading, card row and studio caption are one block, centred as a whole.
       sizeAllRosters() keeps that block inside the surface, which is what makes
       centring safe here rather than clipping the top. */
    justify-content: center;
    background: var(--bg);
  }

  /* ---------- heading ---------- */
  .designers-head {
    flex-shrink: 0;
    padding: 0 max(6vw, 28px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .designers-intro h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(38px, 4vw, 62px);
    line-height: 1.04;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin: 0 0 8px;
  }
  .designers-intro p {
    margin: 0;
    font-size: clamp(13.5px, 1.05vw, 16px);
    line-height: 1.5;
    color: var(--ink-dim);
  }

  /* ---------- big edge arrows ----------
     Pinned to the left and right edges of the viewport and vertically centred,
     well clear of the card row (see .designers-panel's side padding, which
     reserves the lane they sit in). No plate behind them: at this size a white
     disc would read as a button floating over the roster rather than as a
     direction to go in. */
  .studio-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    width: clamp(38px, 3.4vw, 54px);
    height: clamp(38px, 3.4vw, 54px);
    border: none;
    background: transparent;
    padding: 0;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.3s ease, transform 0.36s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
  }
  .studio-nav svg { width: 100%; height: 100%; }
  .studio-nav:focus { outline: none; }
  .studio-nav:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 12px; }
  .studio-nav-prev { left: clamp(20px, 2.6vw, 48px); }
  .studio-nav-next { right: clamp(20px, 2.6vw, 48px); }
  .studio-nav:hover { color: var(--ink); transform: translateY(-50%) scale(1.12); }
  .studio-nav-prev:hover { transform: translateY(-50%) scale(1.12) translateX(-3px); }
  .studio-nav-next:hover { transform: translateY(-50%) scale(1.12) translateX(3px); }
  .studio-nav:active { transform: translateY(-50%) scale(0.95); }
  /* one studio, nowhere to go — the arrows go away rather than sit there dead */
  .designers-viewport.is-single-studio .studio-nav { display: none; }
  /* and in edit mode: the Add tile is a fourth card-sized tile, and four of
     them plus an arrow lane on each side would squeeze the cards well below the
     size this screen is built around. So the arrows stand down and give the row
     the room. The trade is that you press Done before you can move to another
     studio — acceptable, because edit mode is an explicit, focused state on
     your own studio and the other studio isn't editable anyway. */
  .designers-viewport.is-editing .studio-nav { display: none; }

  /* ---------- the sliding stage ---------- */
  .designers-stage-wrap {
    position: relative; /* the edge arrows anchor to this, not the viewport */
    flex: 0 1 auto;
    min-height: 0;
    overflow: hidden;
    display: flex;
  }
  .designers-stage {
    display: flex;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    transition: transform 0.72s cubic-bezier(0.19, 1, 0.22, 1);
  }
  .designers-panel {
    flex: 0 0 100%;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    /* the side padding is the lane the edge arrows live in — a card must never
       end up underneath one */
    padding: clamp(14px, 2vh, 28px) clamp(84px, 7vw, 130px) clamp(16px, 2.2vh, 30px);
    transition: padding 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    /* A studio bigger than fits stays one fixed row and scrolls sideways; it
       never turns into an auto-flowing track. The bar itself is hidden: the
       panel's width and padding are both animated (sliding between studios,
       entering edit mode), and every frame where the content is a pixel wider
       than the box would otherwise flash a scrollbar across the screen. */
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior: contain;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .designers-panel::-webkit-scrollbar { width: 0; height: 0; display: none; }
  /* no arrow lane to leave clear once the arrows are gone */
  .designers-viewport.is-editing .designers-panel {
    padding-left: clamp(36px, 4vw, 84px);
    padding-right: clamp(36px, 4vw, 84px);
  }

  /* Fixed, not a flowing track: the whole studio is on screen at once, and the
     row takes as much height as the screen will give it.

     The height is written by sizeAllRosters() rather than declared here: a
     card's width follows from its height (aspect-ratio), so the row has to be
     sized against the *narrower* of the two constraints, and how many tiles are
     in it is only known at render time — turning edit mode on adds one. CSS
     can't see that count, so it can't do this arithmetic. */
  .designer-roster {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: clamp(16px, 1.6vw, 36px);
    height: 100%;
    margin: auto; /* keeps a short row centred once the panel can scroll */
    transition: height 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Three cards need ~590px at their readable floor (ROSTER_MIN_H) and a phone
     gives the row about 220 — so on a narrow screen it overflows, and centred
     overflow puts the first and last card off opposite edges of the screen with
     no way to get to either. Scrolling the row is the smallest honest fix: the
     cards stay legible and nothing is unreachable. Left-aligned because a centred
     flex row's left overflow cannot be scrolled to.

     Swiping the row sideways does not fight the studio swipe, which is vertical
     only — see the touchmove axis lock in the Designers wiring. */
  @media (max-width: 820px) {
    .designer-roster {
      justify-content: flex-start;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }
    .designer-roster::-webkit-scrollbar { display: none; }
    .designers-panel { padding-left: 22px; padding-right: 22px; }
  }

  /* ---------- the card, and its two faces ----------
     Hover turns the card over: the portrait on the front, how to reach the
     person on the back. The card itself carries no border or background — each
     face does — or the frame would sit in front of whichever face is turned
     away. Height-first: the card takes the row's height and derives its width
     from the 1:1.4 ratio, so a shorter window shrinks the whole row evenly
     instead of overflowing. */
  .designer-card {
    position: relative;
    height: 100%;
    aspect-ratio: 1 / 1.4;
    flex: 0 0 auto;
    perspective: 1400px;
    font-family: 'Inter', sans-serif;
    cursor: default;
    transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .designer-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.66s cubic-bezier(0.32, 1, 0.3, 1);
  }
  /* :focus-within so tabbing to a link on the back turns the card and keeps it
     turned — otherwise the thing you are focused on is facing away from you */
  .designer-card:hover .designer-card-inner,
  .designer-card:focus-within .designer-card-inner { transform: rotateY(180deg); }
  /* And on a touch screen, where there is no hover at all: without this the back
     of every card — the role, what they are working on, what they can help with,
     what they last shared, how to reach them — was simply unreachable on a phone.
     A tap sets this; see the coarse-pointer branch in buildDesignerCard. */
  .designer-card.is-flipped .designer-card-inner { transform: rotateY(180deg); }
  /* while a studio is arranging its roster the card is an object, not something
     to read: it stays face-up and the whole surface opens the editor */
  .designer-card.is-editing { cursor: pointer; }
  .designer-card.is-editing .designer-card-inner { transform: none; }

  .designer-face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    border-radius: 26px;
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
