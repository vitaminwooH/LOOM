            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT — where it went. Tinted a shade off the left so the two are
         legibly different kinds of thing without a wall down the middle. -->
    <div class="expanded-pane expanded-pane-response" id="expandedResponsePane">
      <div class="expanded-pane-inner">
        <!-- Above the lineage on purpose: a reaction is the small thing a
             reader can give back immediately, and applying it is the large
             thing that may follow. -->
        <!-- only on your own cards: on someone else's this would be a
             scoreboard of their work -->
        <div class="expanded-section card-status reveal-on-open" id="cardStatusBlock" style="display:none;"></div>

        <!-- WHAT CAME BACK — talk. Reactions and their replies never draw a
             line in the lineage below: someone saying "we'll try this" is a
             conversation, and only a piece of writing that actually came out
             of this one is a link. The caption on each block says which of the
             two you are looking at, and the rule below separates them. -->
        <div class="expanded-section reveal-on-open">
          <div class="label" id="labelReactions"></div>
          <p class="section-caption" id="captionReactions"></p>
          <!-- one click each; the note is a second, optional step -->
          <div class="reaction-pills" id="reactionPills"></div>
          <div class="reaction-list" id="reactionList"></div>
        </div>

        <!-- SAME THREAD — the loose layer. Above the lineage because it is the
             weaker claim of the two: these share a word, the ones below came out
             of each other. Hidden entirely when this card has no keyword, or
             when nothing else uses one of them. -->
        <div class="expanded-section expanded-section-thread reveal-on-open" id="sameThreadSection" style="display:none;">
          <div class="label" id="labelSameThread"></div>
          <p class="section-caption" id="captionSameThread"></p>
          <div class="keyword-tags" id="detailKeywords"></div>
          <div class="same-thread-list" id="sameThreadList"></div>
        </div>

        <!-- WHERE IT SPREAD — work. Content to content, never company to
             company; see renderLineageStrip. -->
        <div class="expanded-section expanded-section-lineage reveal-on-open">
          <div class="label" id="labelApplied"></div>
          <p class="section-caption" id="captionLineage"></p>
          <div class="lineage-strip" id="lineageStrip"></div>
          <div class="lineage-list-wrap" id="lineageListWrap"></div>
        </div>

        <div class="expanded-footer reveal-on-open">
          <div class="applied-summary" id="appliedSummary"></div>
          <button class="apply-btn" id="applyBtn"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ---------- Question detail: a two-pane layout instead of the normal
       problem/tried/result body — left is the conversation itself, right
       is a (fake, sample-only) AI-generated summary a person confirms. ---------- -->
  <div class="question-detail" id="questionDetail" style="display:none;">
    <div class="question-detail-header reveal-on-open">
      <div class="question-detail-meta">
        <span class="card-dot" id="qdDot"></span>
        <span id="qdStudioName"></span>
        <span class="sep">·</span>
        <span id="qdAuthor"></span>
        <span class="sep">·</span>
        <span id="qdTime"></span>
        <span id="qdStatusBadge"></span>
        <span id="qdLangBadge" class="lang-pending-badge" style="display:none;"></span>
        <button type="button" class="qd-delete-btn" id="qdDeleteBtn" style="display:none;" aria-label="Delete">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-.8 12.1a1 1 0 0 1-1 .9H8.8a1 1 0 0 1-1-.9L7 7"/>

        </button>
      </div>
      <h2 class="question-detail-title" id="qdTitle"></h2>
      <div class="attachments-list-wrap qd-attachments" id="qdAttachmentsWrap"></div>

      <!-- Only once it is resolved. An answered question with nothing to do
           next is where knowledge stops: somebody worked it out, and the
           working-out stays in a thread nobody rereads. These are the three
           things that actually follow from an answer. See renderResolvedNext. -->
      <div class="resolved-next" id="resolvedNext" style="display:none;">
        <div class="resolved-next-row">
          <span class="resolved-next-label" id="resolvedNextLabel"></span>
          <div class="resolved-next-actions">
            <button type="button" class="resolved-next-btn" id="resolvedNextExperiment"></button>
            <button type="button" class="resolved-next-btn" id="resolvedNextLink"></button>
            <button type="button" class="resolved-next-btn" id="resolvedNextLineage"></button>
          </div>
        </div>
        <div class="resolved-next-lineage" id="resolvedNextLineageWrap" style="display:none;"></div>

    </div>

    <div class="question-tabs" id="questionTabs">

    </div>

    <div class="question-panes">
      <div class="question-pane question-pane-conversation is-active-tab" id="paneConversation">

/* ======================================================================
   0. Config

const CONFIG = {
  RESUME_DELAY_MS: 900,         // delay before hero autoplay resumes after hover/modal/share mode

  //  detail is a whole screen now, so its size is the viewport and the CSS owns
  //  it — see .expanded-card and openCard.)
  LANG_FADE_MS: 220,            // fade duration when switching languages
  HERO_ROTATE_MS: 5000,         // discover hero: time on each slide before auto-advancing

  BROWSE_SCROLL_SPEED: 26,      // browse poster row: autoplay drift speed, px/sec

  // ---- floor-to-floor motion (see section 6c) ----
  // 920ms: long enough for a hard launch and a genuinely long settle to
  // read as a scene change rather than a slide, short enough that a second
  // wheel tick never feels blocked.
  FEED_SNAP_DURATION_MS: 920,
  // Both y control points sit past 1, which is what actually buys the
  // overshoot — with y2 pinned at 1 a cubic bezier can only ever clear the
  // landing point by a fraction of a percent. This curve covers ~59% of the
  // distance in the first 10% of the time, peaks ~4.3% past the target
  // around the halfway mark, then spends the whole back half easing back
  // into it. Evaluated in JS by makeCubicBezier.
  FEED_SNAP_EASE: [0.16, 1.3, 0.35, 1.03],

  // ---- share mode (in-page compose -> weave -> confirm) ----
  MODE_SWAP_MS: 260,            // gallery <-> share-viewport crossfade

  STEP_TRANSITION_MS: 550,        // full compose-out duration (matches the .step CSS transition)
  STEP_TRANSITION_OVERLAP_MS: 210, // the weave starts rising in this far into the compose fade-out — a true crossfade, not a hard cut

  NODES_PER_CLUSTER: 6,
  AMBIENT_COUNT: 46,
  CENTER_EXCLUSION: 0.1,     // keep this radius (relative) clear for the new node to be born into

  NEW_NODE_POS: { x: 0.5, y: 0.46 },
  NEW_NODE_RADIUS: 6.4,
  CONNECTION_COUNT: 5,

  REST_DUR: 400,             // 1. a quiet beat — nothing but the background before anything appears

  BIRTH_START: 400,          // 2. the new node is born alone, no ripple and no links yet

  BIRTH_SETTLE_DUR: 480,     // how long the pop takes to settle into its resting size

  RIPPLE_START: 650,         // 3. the ripple leaves the new node; nodes light up as it washes over them

  CONFIRM_MIN_DELAY: 3200,   // never resolve faster than this, even if a random layout is compact

  BREATHE_PERIOD: 2600,      // 5. idle breathing cycle once the sequence has settled — runs forever
  BREATHE_FADE_IN: 700,

/* The chosen language outlives the tab. Without this every reload dropped a
   German or Korean reader back into English, which is the one thing a
   four-language prototype must not do while being demonstrated.

   Read before first paint (it decides what every render below emits) and
   written by setLanguage. An earlier build stored this under `loom_lang`, so
   that value is adopted once and the old key retired. */
const LANGUAGE_STORAGE_KEY = 'loom_language';
const LEGACY_LANGUAGE_STORAGE_KEY = 'loom_lang';

function readStoredLanguage() {
  let stored = null;
  try {
    stored = localStorage.getItem(LANGUAGE_STORAGE_KEY);
    if (!stored) {
      const legacy = localStorage.getItem(LEGACY_LANGUAGE_STORAGE_KEY);
      if (legacy && TRANSLATIONS[legacy]) {
        stored = legacy;
        localStorage.setItem(LANGUAGE_STORAGE_KEY, legacy);
        localStorage.removeItem(LEGACY_LANGUAGE_STORAGE_KEY);
      }
    }
  } catch (err) { /* storage blocked — fall through to the default */ }
  // Validated, not trusted: a hand-edited or retired code must not leave t()
  // reading properties off undefined.
  return stored && TRANSLATIONS[stored] ? stored : 'en';
}

let currentLang = readStoredLanguage();
function t() { return TRANSLATIONS[currentLang].ui; }
function ct(index) { return TRANSLATIONS[currentLang].cards[index]; }

// Relative-time phrasing differs enough across languages (word order,
// pluralization rules) that each gets its own small formatter instead of
// forcing everything through one interpolation pattern.
const TIME_UNIT_FORMS = {
  en: { minute: ['minute', 'minutes'], hour: ['hour', 'hours'], day: ['day', 'days'], week: ['week', 'weeks'], month: ['month', 'months'] },
  de: { minute: ['Minute', 'Minuten'], hour: ['Stunde', 'Stunden'], day: ['Tag', 'Tagen'], week: ['Woche', 'Wochen'], month: ['Monat', 'Monaten'] },
};
// minute/hour joined the list when edits started carrying a timestamp — a
// card's age is measured in days, but a correction made while you are looking
// at it is not.
const TIME_UNIT_WORDS_KO = { minute: '분', hour: '시간', day: '일', week: '주', month: '개월' };
const TIME_UNIT_WORDS_TR = { minute: 'dakika', hour: 'saat', day: 'gün', week: 'hafta', month: 'ay' };

function formatRelativeTime(lang, value, unit) {
  if (lang === 'ko') return `${value}${TIME_UNIT_WORDS_KO[unit]} 전`;
  if (lang === 'tr') return `${value} ${TIME_UNIT_WORDS_TR[unit]} önce`;
  if (lang === 'de') {
    const forms = TIME_UNIT_FORMS.de[unit];
    return `vor ${value} ${value === 1 ? forms[0] : forms[1]}`;
  }
  const forms = TIME_UNIT_FORMS.en[unit];
  return `${value} ${value === 1 ? forms[0] : forms[1]} ago`;
}

/* ======================================================================
   2. Data — change this array to change the cards. Studio/type/area/author
      /time/appliedBy never change with language; translatable copy lives
      in TRANSLATIONS[lang].cards at the same index.
   ====================================================================== */
// `enabled: false` keeps a studio's config, sample cards, and weave cluster
// in the code (so turning it back on later is a one-line flip) while
// removing every trace of it from the screen — same pattern as the
// `enabled` flag on loom_lobby.html's STUDIOS array. Paxie's collaboration
// isn't confirmed yet, so it stays off here too.
const STUDIOS = {
  // `logo` is probed before it is used (see buildStudioMark) — a studio with no
  // file on disk falls back to its colour dot rather than a broken tile.
  doubleu: { name: 'DoubleU', color: '#378ADD', enabled: true, logo: 'assets/doubleu-logo.png' },
  whow: { name: 'Whow', color: '#D85A30', enabled: true, logo: 'assets/whow-logo.png' },
  paxie: { name: 'Paxie', color: '#1D9E75', enabled: false },
};

// The studios that actually exist in this build, in declaration order.
// Paxie is in STUDIOS but disabled, and three places were each writing their
// own filter over Object.keys to leave it out.
function enabledStudioKeys() {
  return Object.keys(STUDIOS).filter(isStudioEnabled);
}

function isStudioEnabled(key) {
  return !!(STUDIOS[key] && STUDIOS[key].enabled);
}

// Applied-by lists are authored alongside disabled studios too (e.g. a
// DoubleU card that Paxie also applied) — filter those mentions out at
// display time rather than hand-editing every appliedBy array.
function visibleAppliedBy(data) {
  return data.appliedBy.filter(isStudioEnabled);
}

/* Which studio "you" are, for this session: whichever button you pressed in
   loom_lobby.html, which writes it here on the way out. Drives the author on
   anything you share, and in Designers both the studio shown first and which
   roster you're allowed to edit.

   TODO(auth): in a real service this comes from the signed-in account, and
   the edit permission is enforced server-side. localStorage is user-writable,
   so it can stand in for "who am I" in a prototype but could never be the
   basis for an authorisation decision. */
/* ======================================================================
   Section 2a — persistence
   ----------------------------------------------------------------------
   TODO(backend): localStorage is the wrong home for any of this and is only
   standing in while this is a prototype. It is per-browser (so "the studio's
   roster" is really "the roster on this one machine"), per-origin (~5MB total,
   shared with everything else this page stores), synchronous, and trivially
   editable by the reader — none of which a knowledge base for several studios
   can live with. A real Loom keeps cards, rosters and attachments in a server
   database, with the author's identity checked server-side rather than read
   out of `loom_current_studio`, and uploads in object storage rather than
   base64 in a string. Every function below is written so that swapping in
   `await api.put(...)` touches this section and nothing else.

   What it does in the meantime: never leave storage half-written. setItem is
   atomic per key, but "the write threw" and "the write worked" are not the
   only two outcomes — Safari's private mode throws on any write at all, and a
   quota failure part-way through a multi-key update would leave two keys
   disagreeing. So every write snapshots the previous value, writes, reads
   back what actually landed, and restores the snapshot if it doesn't match.
   ====================================================================== */

// Roughly how much of the origin budget is in use. UTF-16 in memory, so two
// bytes per code unit is the honest estimate; the browsers that report a real
// number don't agree with each other anyway. Diagnostics only — nothing
// branches on it.
function storageUsageBytes() {
  let units = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      units += k.length + (localStorage.getItem(k) || '').length;
    }
  } catch (err) { return -1; }
  return units * 2;
}

const STORAGE_BUDGET_BYTES = 5 * 1024 * 1024; // what browsers converge on

function logStorageUsage(label) {
  const used = storageUsageBytes();
  if (used < 0) { console.warn('[Loom storage] usage unavailable (storage is blocked)'); return; }
  const pct = (used / STORAGE_BUDGET_BYTES) * 100;
  const detail = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      detail.push(k + ' ' + Math.round(((localStorage.getItem(k) || '').length * 2) / 1024) + 'KB');
    }
  } catch (err) { /* enumerating is best-effort */ }
  const line = '[Loom storage] ' + (label || 'usage') + ': '
    + Math.round(used / 1024) + 'KB of ~' + Math.round(STORAGE_BUDGET_BYTES / 1024) + 'KB'
    + ' (' + pct.toFixed(1) + '%) — ' + (detail.join(', ') || 'empty');
  if (pct > 80) console.warn(line + '  ← running out of room');
  else console.log(line);
}

/* The one write. Returns { ok, quota, err }:
     ok    — the value is in storage and reads back byte-identical
     quota — it failed specifically because there is no room, which is the one
             failure the caller can do something about (drop an image, trim
             older entries) rather than just report */
function safeSetItem(key, value) {
  let previous = null;
  try {
    previous = localStorage.getItem(key);
  } catch (err) {
    // Reading threw, so storage is unavailable outright (blocked cookies,
    // private mode). Nothing to roll back to and nothing will land.
    console.error('[Loom storage] storage is unavailable:', err);
    return { ok: false, quota: false, err: err };
  }

  const restore = () => {
    try {
      if (previous === null) localStorage.removeItem(key);
      else localStorage.setItem(key, previous);
    } catch (err) {
      console.error('[Loom storage] rollback of "' + key + '" failed:', err);
    }
  };

  try {
    localStorage.setItem(key, value);
  } catch (err) {
    restore();
    // Chrome/Safari/Firefox all name it differently; code 22 is the DOMException
    // constant, and Firefox's own name is the third case.
    const quota = err && (err.name === 'QuotaExceededError'
      || err.name === 'NS_ERROR_DOM_QUOTA_REACHED'
      || err.code === 22);
    if (quota) console.warn('[Loom storage] no room for "' + key + '" (' + Math.round(value.length * 2 / 1024) + 'KB)');
    else console.error('[Loom storage] write to "' + key + '" failed:', err);
    logStorageUsage('after a failed write');
    return { ok: false, quota: !!quota, err: err };
  }

  // A write can "succeed" and still not be there — some browsers accept the
  // call and drop the value once the budget is gone.
  let landed = null;
  try { landed = localStorage.getItem(key); } catch (err) { /* fall through */ }
  if (landed !== value) {
    console.error('[Loom storage] "' + key + '" did not read back as written — rolling back');
    restore();
    return { ok: false, quota: true, err: null };
  }

  return { ok: true, quota: false, err: null };
}

const CURRENT_STUDIO_STORAGE_KEY = 'loom_current_studio';

function readCurrentStudioKey() {
  let stored = null;
  try {
    stored = localStorage.getItem(CURRENT_STUDIO_STORAGE_KEY);
  } catch (err) { /* storage blocked — fall through to the default */ }
  // Validated, not trusted: a stale or hand-edited value for a studio that's
  // been switched off (see STUDIOS.enabled) must not leave the page pointing
  // at a studio it won't render.
  if (stored && isStudioEnabled(stored)) return stored;
  return Object.keys(STUDIOS).find(isStudioEnabled) || 'doubleu';
}

const MY_STUDIO_KEY = readCurrentStudioKey();

// Share mode's small in-page "weave" network reuses STUDIOS above, plus a
// cluster center per studio for laying out its nodes.
const WEAVE_CLUSTER_CENTERS = {
  doubleu: { x: 0.24, y: 0.32 },
  whow: { x: 0.76, y: 0.30 },
  paxie: { x: 0.50, y: 0.80 },
};
const WEAVE_STUDIOS = Object.keys(STUDIOS)
  .filter(isStudioEnabled)
  .map((key) => ({
    key,
    color: STUDIOS[key].color,
    center: WEAVE_CLUSTER_CENTERS[key],
  }));

/* Five places to go, in the order somebody actually wants them: write
   something, read everything, see what's unanswered, see who's here.

   This used to be the type filter (All / Projects / Experiments) wearing a
   menu's clothes, which answered a question nobody opens a menu to ask — and
   it meant two of the six items didn't navigate anywhere, they just re-filtered
   the floor you were already on. Filtering by type belongs to floor 2, where
   the posters are, and it still lives in that floor's own dock.

   Tools has no destination yet and says so in place rather than looking
   identical to the four that work. */
/* Four floors, and the order is an argument: everything happening now, then the
   work that held up, then the questions still open, then what all of it adds up
   to. Threads is last because it is the closing line, and you get there by
   carrying on downward rather than by leaving the feed to look at it. */
const FLOOR_COUNT = 4;
// Named because the menu's sub-items go to floor 2 without being floor 2's own
// entry in MENU_ITEMS, so the number would otherwise be written twice.
const FLOOR_BROWSE = 1;
const FLOOR_THREADS = 3;

const MENU_ITEMS = [
  // "New knowledge" is the newest knowledge — the cover on floor 1 — not the
  // form for writing some. Writing is the pencil in the bottom-left corner,
  // which is on every screen; a menu item that opened a composer under a name
  // that reads as a destination sent people somewhere they had not asked to go.
  { key: 'newest', tier: 0 },
  /* Knowledge is the whole floor; its two sub-items are the same floor with the
     type filter already set. They are declared here rather than as items of
     their own because they are not destinations — see renderMenuOverlay. */
  { key: 'browse', tier: FLOOR_BROWSE, subItems: [
    { key: 'projects', filter: 'project' },
    { key: 'experiments', filter: 'experiment' },
  ] },
  { key: 'question', tier: 2 },
  { key: 'threads', tier: FLOOR_THREADS },
  { key: 'designers', designers: true },
  { key: 'tools', comingSoon: true },
];

/* ======================================================================
   2a. Designers — the people behind the cards, one studio at a time.

   The point is "who is making this", nothing more. There is no score, no
   ranking, no sorting by output and no leaderboard here, and there must
   never be one: head office does not evaluate or rank the studios, and a
   people page that quietly orders everyone by contribution count is exactly
   the same thing wearing a friendlier hat. A card carries a photo, a name
   and a job title — nothing that can be compared against the next card.

   Each studio owns its own list and edits it itself (see canEditRoster).
   `name` doubles as the join key back into a card's `author` field, which is
   what the click-through filter uses.

   Two shapes of role live side by side, the same way card copy does:
   `roleKey` on the seeded entries looks up a translated label, while `role`
   on anything a studio typed is free text kept exactly as written (there's
   no machine translation in this prototype). renderDesigners prefers `role`.
   ====================================================================== */
/* `links` is how to reach a person, and every one of the five kinds is
   optional — a card back renders only what someone actually filled in, so a
   roster where nobody has a Behance never shows an empty Behance row.
   `photoPos` is the focal point of their portrait as {x, y} percentages; see
   makeFocalDraggable for why a face is so rarely in the middle of a 1:1.4 crop. */
/* `workingOn` and `canHelp` are free text and always in the language they were
   typed in — same rule as `role` (see the note above). They come before the
   contact details everywhere they appear: a job title and an email address tell
   you who somebody is, and neither tells you whether it is worth writing to
   them this week, which is the only question anyone opens a roster with. */
/* ======================================================================
   Naming things in assets/
   ----------------------------------------------------------------------
   Lower case, hyphen separated, no spaces. minwoo-heo.jpg, never
   "Minwoo Heo.png".

   Local development is served off a case-insensitive filesystem (NTFS/APFS) and
   GitHub Pages is not, so `assets/Minwoo Heo.png` resolves locally and 404s in
   production — the failure mode that costs the most, because the machine you
   test on is the one that cannot show it to you. Spaces then have to be
   percent-encoded in every reference, and one written raw works in some
   browsers and not others.

   Photographs are JPEG, not PNG: these are camera images with no transparency,
   and the same picture is roughly a tenth of the size. Long edge 1500px is
   enough for the roster card on a 2x display, which is 667x934 css at its
   largest.
   ====================================================================== */
/* ======================================================================
   The four real people come first, then the seeded ones
   ----------------------------------------------------------------------
   These four are in code, with their pictures committed to assets/, because a
   roster that only exists in localStorage is a roster only the person who typed
   it can see. Everything added through the in-app editor is written to
   loom_designers_v1 on one machine and one browser profile — so the faces that
   had been curated locally were, correctly and invisibly, absent from the
   deployed site for everybody else. Anything that should be there for a visitor
   on their first load has to be here instead.

   Only what is verifiable is filled in. Names are the ones on the files;
   Minwoo Heo and Bengt Ott are placed by their own cards (x1/x3 are DoubleU's,
   x2 is Whow's). Roles, what they are working on, what they can help with and
   their contact details are left empty on purpose: those are facts about real
   colleagues, and a plausible guess about a real person is just a wrong answer
   that looks right. They render as absent rather than as blanks — see
   buildDesignerCard, where every one of those fields is guarded — and the back
   of the card still fills itself in from the network, because
   mostRecentCardBy(name) finds the work they have actually shared.

   ASSUMPTION, worth correcting if wrong: Sua Song is placed with DoubleU and
   Felix Heitmann with Whow. Neither authors a card, so unlike the other two
   there is nothing in the data that says which studio they belong to.

   Three to a studio: the two real people, then the one seeded card that shows
   what a filled-in one looks like.

   Editing any of them in the app still works exactly as before, and still wins:
   loadDesigners() returns the stored list whole when there is one. Which also
   means a browser that has edited the roster before will not see this list until
   loom_designers_v1 is cleared.
   ====================================================================== */
const DEFAULT_DESIGNERS = [
  // photoPos: the face, as percentages. A portrait is 4:5 and the card crop is
  // 1:1.4, so the default centre would cut this one off at the chin.
  { id: 'du-minwoo', studio: 'doubleu', name: 'Minwoo Heo', roleKey: '', photo: 'assets/minwoo-heo.jpg', photoPos: { x: 53, y: 20 },
    workingOn: '', canHelp: '', links: {} },
  { id: 'du-sua', studio: 'doubleu', name: 'Sua Song', roleKey: '', photo: 'assets/sua-song.jpg', photoPos: { x: 50, y: 45 },
    workingOn: '', canHelp: '', links: {} },
  { id: 'wh-bengt', studio: 'whow', name: 'Bengt Ott', roleKey: '', photo: 'assets/bengt-ott.jpg', photoPos: { x: 50, y: 35 },
    workingOn: '', canHelp: '', links: {} },
  { id: 'wh-felix', studio: 'whow', name: 'Felix Heitmann', roleKey: '', photo: 'assets/felix-heitmann.jpg', photoPos: { x: 55, y: 33 },
    workingOn: '', canHelp: '', links: {} },

  /* One seeded person per studio, kept deliberately.

     Three a side, not five and three: a card's width follows from its height
     (aspect-ratio 1/1.4), so how many tiles are in the row is what decides how
     big any of them can be — see sizeAllRosters, where the width bound beats the
     65%-of-viewport ceiling the moment there are more than three. Five tiles is
     why the cards had quietly become small. Three is the number at which the
     ceiling wins and the row fills the screen.

     These two stay rather than being dropped with the other four because a
     roster of nothing but the real four would have no filled-in card left to
     read: the real people have no role, no contact details and nothing typed
     about what they are working on, on purpose (see the note above), so a
     visitor would see four names and four photographs and would never learn what
     the back of a card is for. Lena Fischer and Minji Yoon are what the finished
     thing looks like. Both are also card authors, so their backs fill in from
     the network as well.

     The four whose entries are gone — Doyoon Kim, Haeun Lee, Jonas Weber, Mira
     Keller — still author sample cards, and nothing breaks: an author is matched
     to a roster entry only to colour the filter chip, which already falls back

function persistDesigners() {
  if (safeSetItem(DESIGNERS_STORAGE_KEY, JSON.stringify(designerRoster)).ok) {
    logStorageUsage('designer roster saved');

/* ======================================================================
   Keywords — the loose layer
   ----------------------------------------------------------------------
   A keyword is a word two people happened to use for the same concern. That is
   the whole mechanism, and its looseness is the point: relatedTo/derivedFrom
   require somebody to declare a link, and most work that belongs together
   never gets that far. Sharing a word costs nothing and still puts two studios
   on the same page.

   There is deliberately no master list to maintain. Every keyword that exists
   is one somebody typed onto a card (see allKeywords), so the vocabulary is
   whatever the studios actually use rather than whatever a taxonomy predicted
   they would need.

   Case: compared folded, displayed as first written. "Slack pipeline" and
   "slack pipeline" are one keyword, and the spelling the reader sees is the
   one the first person to use it chose — not the last, which would mean a
   keyword quietly changing shape under everyone who had already used it.
   ====================================================================== */
const MAX_KEYWORDS_PER_CARD = 3;

// The comparison key. Also collapses runs of whitespace, so "Slack  pipeline"
// typed with a stray space is not a second keyword.
function keywordKey(word) {
  return String(word == null ? '' : word).trim().replace(/\s+/g, ' ').toLowerCase();
}

// What a keyword looks like on screen: trimmed, inner whitespace collapsed,
// and otherwise exactly as it was typed.
function keywordLabel(word) {
  return String(word == null ? '' : word).trim().replace(/\s+/g, ' ');
}

function keywordsOf(card) {
  if (!card || !Array.isArray(card.keywords)) return [];
  const seen = {};
  const out = [];
  card.keywords.forEach((raw) => {
    const key = keywordKey(raw);
    if (!key || seen[key]) return;
    seen[key] = true;
    out.push(keywordLabel(raw));
  });
  return out.slice(0, MAX_KEYWORDS_PER_CARD);
}

/* Every keyword in use, with the spelling of whichever card used it first.
   Oldest card first, so "first" means first in time rather than first in
   whatever order the surfaces happen to render.

   Built on demand rather than cached: a card can be shared, edited or deleted
   at any moment, and a stale vocabulary is worse than a recomputed one — this
   is twenty-odd cards, not twenty thousand. */
function allKeywords() {
  const byKey = {};
  // daysAgoOf is smaller for newer cards, so descending is oldest first.
  const order = ALL_CARDS.slice().sort((a, b) => daysAgoOf(b) - daysAgoOf(a));
  order.forEach((card) => {
    keywordsOf(card).forEach((label) => {
      const key = keywordKey(label);
      if (!byKey[key]) byKey[key] = { key: key, label: label, count: 0 };
      byKey[key].count += 1;
    });
  });
  return Object.keys(byKey)
    .map((k) => byKey[k])
    .sort((a, b) => b.count - a.count || a.label.localeCompare(b.label));
}

// The agreed spelling for a keyword typed any which way, so a card saved with
// "slack pipeline" still displays as "Slack pipeline".
function canonicalKeyword(word) {
  const key = keywordKey(word);
  if (!key) return '';
  const found = allKeywords().find((k) => k.key === key);
  return found ? found.label : keywordLabel(word);
}

function cardHasKeyword(card, word) {
  const key = keywordKey(word);
  if (!key) return false;
  return keywordsOf(card).some((k) => keywordKey(k) === key);
}

/* Other pieces of writing that share a keyword with this one, newest first.
   Not "related": nobody said these belong together, they just used the same
   word — which is a weaker claim, and an honest one. */
function sameThreadCards(card, limit) {
  if (!card) return [];
  const keys = keywordsOf(card).map(keywordKey);
  if (!keys.length) return [];
  return ALL_CARDS
    .filter((c) => c.id !== card.id && keywordsOf(c).some((k) => keys.indexOf(keywordKey(k)) > -1))
    .sort((a, b) => daysAgoOf(a) - daysAgoOf(b))
    .slice(0, limit || 4);
}

function cardsWithKeyword(word) {
  const key = keywordKey(word);
  if (!key) return [];
  return ALL_CARDS.filter((c) => keywordsOf(c).some((k) => keywordKey(k) === key));
}

/* Read-only chips for a card surface. Plain spans — a poster card is already
   one big click target and a button inside it would fight that. The detail
   builds interactive ones of its own (see renderDetailKeywords). */
function keywordTagsHTML(card) {
  const words = keywordsOf(card);
  if (!words.length) return '';
  return '<div class="keyword-tags">'
    + words.map((w) => `<span class="keyword-tag">${escapeHtml(w)}</span>`).join('')
    + '</div>';
}

function fieldsFor(type) {
  return FIELD_SETS[type] || FIELD_SETS.project;
}

// The text of one field on one card, whichever era the card comes from.
function bodyValue(text, type, key) {
  if (!text) return '';
  if (typeof text[key] === 'string' && text[key].length) return text[key];
  const legacy = (LEGACY_FIELD_MAP[type] || {})[key];
  return (legacy && text[legacy]) || '';
}

function fieldStrings(type, key) {
  const set = t().fields[type] || t().fields.project;
  return set[key] || { label: key, placeholder: '' };
}

     TODO(content): no cover either, so this one keeps the studio-tinted gradient
     for now — which is a perfectly good visual and not a placeholder to
     apologise for. When doubleu-pipeline-update.pdf lands, render its page 1 the
     same way as the two above (see the note there) to
     assets/doubleu-pipeline-update-cover.png and set `image` plus the same
     imageFocal. */
  { id: 'x3', keywords: ['Slack pipeline', 'Thread'], studio: 'doubleu', type: 'project', author: 'Minwoo Heo', justNow: true, timeValue: 0, timeUnit: 'day', appliedBy: [], image: null, relatedTo: [], derivedFrom: 'x2', derivedRelation: 'continuedFrom', derivedNote: 'Whow\u2019s typed-input and QA-gate ideas came back into our own pipeline.',
    attachments: [{ name: 'doubleu-pipeline-update.pdf', path: 'assets/doubleu-pipeline-update.pdf' }] },

/* ======================================================================
   2b. Cards shared through share mode (see section 9) — persisted to
   localStorage so they survive a reload, read once here at load and
   stitched onto the front of the gallery. Their title/problem/tried/result
   stay exactly as the author typed them (there's no translation for
   user-generated text in this prototype), so they carry their own `text`
   object instead of looking one up from TRANSLATIONS.
   ====================================================================== */
const SHARED_CARDS_STORAGE_KEY = 'loom_shared_cards_v1';

function loadSharedCards() {
  try {
    const raw = localStorage.getItem(SHARED_CARDS_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (err) {
    console.error('[Loom feed] could not read shared cards from localStorage:', err);
    return [];
  }
}

// `let`, not `const`: sharing a new card while already on this page (see
// share mode below) prepends to this in memory too, so the gallery can show
// it immediately without a reload — localStorage is what makes it survive
// a reload, not what the live UI reads from moment to moment.
let sharedCards = loadSharedCards();

// The list every render/filter function actually works from: newest shared
// knowledge first, then the seed CARDS. `staticIndex` lets static entries
// still look their copy up in TRANSLATIONS[lang] as the language changes;
// shared entries carry their own fixed `text` instead.
/* ======================================================================
   Edits to seed cards
   ----------------------------------------------------------------------
   CARDS is a constant and its copy lives in TRANSLATIONS, four times over.
   Rather than move all of that into storage, an edit to a seed card is stored
   as an overlay keyed by the card's id and merged in at build time. The seed
   stays exactly what a browser with empty storage sees, and "reset it" is
   still one line in the console.

   Only your own studio's cards. Not a security boundary — anything in this
   file is editable by anyone who opens devtools — but the same rule the
   Designers roster uses, so the app is at least consistent about whose things
   are whose.

   TODO(backend): a real service checks the signed-in account against the
   card's studio server-side, and there is no such thing as a "seed" card —
   they are all just rows.
   ====================================================================== */
const SEED_EDITS_STORAGE_KEY = 'loom_seed_edits_v1';

function loadSeedEdits() {
  try {
    const parsed = JSON.parse(localStorage.getItem(SEED_EDITS_STORAGE_KEY));
    if (parsed && typeof parsed === 'object') return parsed;
  } catch (err) {
    console.error('[Loom feed] could not read seed edits:', err);
  }
  return {};
}

/* Declared here, immediately above buildAllCards, and not further down with the
   rest of the edit code: ALL_CARDS is built during script evaluation and
   buildAllCards reaches straight into this map. A `let` declared below that
   point is still in its temporal dead zone when it is read, which is a
   ReferenceError rather than an undefined. */
let seedEdits = loadSeedEdits();
function seedEditsMap() { return seedEdits; }

/* Whether the reader is allowed to edit a card at all.

   Shared cards: yes, they wrote them this session.
   Seed cards: only their own studio's — "남의 것엔 안 보임" reads as other
   studios', and a studio's own back catalogue is theirs to correct. */
function canEditCard(data) {
  if (!data) return false;
  if (data.isShared) return true;
  return data.studio === MY_STUDIO_KEY;
}

// A seed card's edit is a patch, not a replacement: only the keys the author
// actually changed are stored, so a seed card that later gains a field in the
// source picks it up instead of being frozen at whatever was saved.
function applySeedEdit(card) {
  const patch = seedEditsMap()[card.id];
  if (!patch) return card;
  return Object.assign({}, card, patch, {
    text: Object.assign({}, card.text, patch.text || {}),
  });
}

function saveSeedEdit(id, patch) {
  const map = seedEditsMap();
  const previous = map[id];
  map[id] = patch;
  if (safeSetItem(SEED_EDITS_STORAGE_KEY, JSON.stringify(map)).ok) {
    logStorageUsage('seed edit saved');
    return true;
  }
  // safeSetItem restored storage; put memory back in step with it.
  if (previous === undefined) delete map[id];
  else map[id] = previous;
  return false;
}

function buildAllCards() {
  return [
    ...sharedCards.map((c) => ({ ...c, isShared: true })),
    // The seed card's own translated copy is folded in here so an edit has
    // something to patch — before this, `text` only existed on shared cards and
    // was looked up per-language at render time (see cardText).
    ...CARDS.map((c, i) => applySeedEdit({ ...c, isShared: false, staticIndex: i, text: ct(i) })),
  ].filter((c) => isStudioEnabled(c.studio));
}
let ALL_CARDS = buildAllCards();

// A shared card's `text` is always exactly what its author typed, in
// whatever language they typed it in — there's no machine translation here.
// A real service would call a translation API right here (keyed off
// `entry.sourceLang` vs. the viewer's `currentLang`) and cache the result
// per target language; until then, renderLangPendingBadge() is what tells
// the reader they're looking at the original text, not a translation.
/* Both kinds of card carry their own `text` now (buildAllCards folds the
   translated seed copy in), so this is a straight read — but a seed card that
   has NOT been edited must still follow the language switcher, and its stored
   text was captured in whatever language was active when ALL_CARDS was built.
   Falling back to ct() for those keeps the switcher working. */
function cardText(entry) {
  if (entry.isShared) return entry.text;
  if (seedEditsMap()[entry.id]) return entry.text; // an edit is in one language on purpose
  return ct(entry.staticIndex);
}

/* "Original (<language>) · Auto-translation pending", shown whenever a card's
   original language differs from the one being read in.

   TODO(translation): there is no machine translation here and this label is
   the honest version of that. A real implementation sends the card's fields to
   a translation API on save (not on read — translating on every language
   switch would mean paying for the same sentence repeatedly and getting
   slightly different wording each time), stores the result per language
   alongside `sourceLang`, and shows this badge only while that request is
   still outstanding. Until then the reader gets the author's own words, which
   is better than a silent gap.

   Seed cards are pre-translated in TRANSLATIONS, so this only applies to what
   somebody actually wrote — including an edited seed card, whose new text
   exists only in the language it was typed in. */
function langPendingText(data) {
  const authored = data.isShared || !!seedEditsMap()[data.id];
  if (!authored || !data.sourceLang || data.sourceLang === currentLang) return '';
  const lang = LANGUAGES.find((l) => l.code === data.sourceLang);
  return t().originalPending(lang ? lang.label : data.sourceLang);
}
function langPendingBadgeHTML(data) {
  const txt = langPendingText(data);
  return txt ? `<span class="lang-pending-badge">${txt}</span>` : '';
}
function renderLangPendingBadge(el, data) {
  if (!el) return;
  const txt = langPendingText(data);
  el.textContent = txt;
  el.style.display = txt ? '' : 'none';
}

/* ======================================================================
   2c. Cross-card connections — relatedTo/derivedFrom drive both the hover
   highlight in the gallery and the mini lineage graph in the expanded
   modal (see populateExpanded). Resolved against ALL_CARDS (not CARDS) so
   shared cards can participate too, and resolved bidirectionally so a
   relatedTo/derivedFrom pair only ever needs to be declared on one side.
   ====================================================================== */
function findCardIndexById(id) {
  return ALL_CARDS.findIndex((c) => c.id === id);
}

// Every card this one is connected to, regardless of relation type — this
// is what the gallery hover effect lights up. Returns ALL_CARDS indices.
function connectedIndices(data) {
  const ids = new Set();
  (data.relatedTo || []).forEach((id) => ids.add(id));
  if (data.derivedFrom) ids.add(data.derivedFrom);
  ALL_CARDS.forEach((c) => {
    if (c.id === data.id) return;
    if (c.derivedFrom === data.id) ids.add(c.id);
    if ((c.relatedTo || []).includes(data.id)) ids.add(c.id);
  });
  ids.delete(data.id);
  const indices = [];
  ids.forEach((id) => {
    const idx = findCardIndexById(id);
    if (idx !== -1) indices.push(idx);
  });
  return indices;
}

/* The full spell-it-out list under the strip: every card this one links to and
   why (derivedFrom / derivedInto / related), including the branches the linear
   strip has no room for.

   Cards only. `appliedBy` used to add studio-shaped nodes here, which made a
   company look like a step in the lineage; it is a fact about who picked
   something up, and it belongs to the "how it has travelled" line and the
   exchange traces, not to a chain of works. */
function buildLineageNodes(data) {
  const nodes = [];
  const seen = new Set([data.id]);

  const addCardNode = (id, relation) => {
    if (seen.has(id)) return;
    const idx = findCardIndexById(id);
    if (idx === -1) return;
    seen.add(id);
    const c = ALL_CARDS[idx];
    nodes.push({
      kind: 'card',
      id,
      index: idx,
      title: cardText(c).title,
      studioName: STUDIOS[c.studio] ? STUDIOS[c.studio].name : '',
      color: STUDIOS[c.studio] ? STUDIOS[c.studio].color : 'var(--ink)',
      relation,
    });
  };

  if (data.derivedFrom) addCardNode(data.derivedFrom, 'derivedFrom');
  ALL_CARDS.forEach((c) => { if (c.derivedFrom === data.id) addCardNode(c.id, 'derivedInto'); });
  (data.relatedTo || []).forEach((id) => addCardNode(id, 'related'));
  ALL_CARDS.forEach((c) => { if ((c.relatedTo || []).includes(data.id)) addCardNode(c.id, 'related'); });

  return nodes;
}

/* ======================================================================
   2d. Discover ranking — "newest first" across studios, so freshly shared
   knowledge (always justNow) floats to the very front and the rest sorts by
   how long ago it was posted. Same underlying ALL_CARDS as Browse below;
   Discover is a curated top slice of it, not a separate pool.
   ====================================================================== */
const DISCOVER_COUNT = 6;
const TIME_UNIT_DAYS = { day: 1, week: 7, month: 30 };

function daysAgoOf(data) {
  return data.justNow ? -1 : data.timeValue * (TIME_UNIT_DAYS[data.timeUnit] || 1);
}

// The banner is finished knowledge only; what is in flight is the strip below
// it (see renderNowStrip).
function computeDiscoverIndices() {
  return ALL_CARDS
    .map((c, i) => i)
    .filter((i) => !isUpdate(ALL_CARDS[i]))
    .sort((a, b) => daysAgoOf(ALL_CARDS[a]) - daysAgoOf(ALL_CARDS[b]))
    .slice(0, DISCOVER_COUNT);
}

// The one light textual trace of lineage a Discover card carries — just
// "derived from {studio}" when there's a clear ancestor, nothing forced
// otherwise. The full breakdown (related ideas, who applied it, etc.) is
// what the modal's lineage list is for.
function lineageHintFor(data) {
  if (!data.derivedFrom) return '';
  const idx = findCardIndexById(data.derivedFrom);
  if (idx === -1) return '';
  // The work it came out of, not the company that wrote that work — same rule
  // the lineage strip follows. "Came from DoubleU" is an attribution; "came
  // from this particular piece" is a lineage.
  const origin = ALL_CARDS[idx];
  const title = truncateForSummary(cardText(origin).title || '', 44);
  if (!title) return '';
  return `${t().lineage.derivedFrom} “${title}”`;
}

function isOpenQuestion(data) {
  return data.type === 'question';
}

// Open/Discussing/Resolved — only Questions carry this at all.
function statusBadgeHTML(data) {
  if (!isOpenQuestion(data) || !data.status) return '';
  return `<span class="status-badge status-${data.status}">${t().status[data.status]}</span>`;
}

// Replies typed into this session's Conversation pane (see initQuestionDetail) —
// kept separate from the seed data entirely, keyed by card id, so appending
// one never has to fight with how static cards zip structure against
// per-language text (see getConversationMessages just below).
const sessionExtraMessages = {};

// The thread behind a Question — structural data (who/when) lives on the
// card itself (language-independent, like everywhere else in this file);
// only the message text is looked up per-language. Shared (user-authored)
// cards carry their own embedded text instead, same as their other fields.
// Static Questions with no curated thread (see CARDS) get a synthesized
// single opening post from the card's own author/problem fields, so every
// Question always has *something* to show in its Conversation pane.
function getConversationMessages(data) {
  let base;
  if (data.isShared) {
    base = data.conversation || [];
  } else {
    const text = cardText(data);
    base = (data.conversation && text.conversation)
      ? data.conversation.map((msg, i) => ({ ...msg, text: text.conversation[i] }))
      : [{ author: data.author, studio: data.studio, timeValue: data.timeValue, timeUnit: data.timeUnit, justNow: data.justNow, text: text.problem }];
  }
  return base.concat(sessionExtraMessages[data.id] || []);
}

// null means "not enough discussion yet" — the brief panel shows a plain
// placeholder instead of forcing a summary out of a single opening post.
function getConversationBrief(data) {
  if (data.isShared) return null;
  return cardText(data).brief || null;
}

/* ======================================================================
   3. Utilities
   ====================================================================== */
function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// Used by the share-mode weave canvas, which paints with raw "r, g, b"
// strings/arrays instead of CSS colors.
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return `${parseInt(h.substring(0, 2), 16)}, ${parseInt(h.substring(2, 4), 16)}, ${parseInt(h.substring(4, 6), 16)}`;
}
function hexToRgbArray(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4), 16), parseInt(h.substring(4, 6), 16)];
}

// Placeholder art for cards with no image — layered studio-colored light
// blooms (a bright one near the top, a soft warm one low-right, plus a faint
// wash) rather than one flat gradient. Paired in CSS with a fixed grain
// texture (--card-noise) via background-blend-mode, so an empty card still
// reads as a designed visual instead of a placeholder.
// Returns exactly 4 comma-separated gradient layers — no trailing solid
// color. Used two ways: as `--card-bloom` inside a `background-image` list
// (which only accepts <image> values, so a plain color there would make the
// whole declaration invalid), and inline via the full `background` shorthand
// for the card's flip-back face, where callers append their own ", #fff".
function mediaGradient(color) {
  return `radial-gradient(circle at 22% 16%, ${hexToRgba(color, 0.42)}, transparent 50%), ` +
         `radial-gradient(circle at 86% 30%, ${hexToRgba(color, 0.18)}, transparent 55%), ` +
         `radial-gradient(circle at 65% 96%, rgba(255, 255, 255, 0.6), transparent 52%), ` +
         `linear-gradient(165deg, ${hexToRgba(color, 0.22)}, transparent 85%)`;
}

// Applies either a real image (fills the card, small corner badge for the
// type icon) or the gradient/noise fallback (big centered icon) to a
// `.card-media`/`.expanded-media` element. Images are verified to actually
// load before switching — a broken/missing path silently keeps the fallback
// visual instead of showing a blank box, so dropping files into assets/
// later "just works" without any code change.
/* `opts` carries the document treatment: { fit: 'contain', bg: '#1e2760' } from
   a card's imageFit/imageBg. Passed as one object rather than two more
   positional arguments, since every caller has the card in hand anyway. */
function applyCardMedia(mediaEl, imagePath, color, focal, opts) {
  // Set before the probe resolves: background-position is harmless on the
  // gradient fallback, and setting it here means it is already right on the
  // frame the image first paints.
  mediaEl.style.backgroundPosition = focal ? focalPointCss(focal) : '';
  mediaEl.style.setProperty('--card-bloom', mediaGradient(color));
  mediaEl.classList.remove('has-image');
  mediaEl.classList.remove('is-doc');
  mediaEl.style.removeProperty('background-color');
  mediaEl.style.removeProperty('--card-img');
  if (!imagePath) return;
  const doc = opts && opts.fit === 'contain';
  const probe = new Image();
  probe.onload = () => {
    mediaEl.style.setProperty('--card-img', `url("${imagePath}")`);
    // The CSSOM refuses absurdly long custom-property values outright, and it
    // does it silently — setProperty neither throws nor warns, the property
    // just isn't there afterwards. An un-resized phone photo as a data: URL
    // used to hit that limit, and because `has-image` also switches the
    // gradient fallback off, the card rendered as a blank white box. Uploads
    // are downscaled now (see resizeImageToDataUrl), but read the value back
    // before committing regardless: no image is a fallback, no visual is a bug.
    if (!mediaEl.style.getPropertyValue('--card-img')) {
      mediaEl.style.removeProperty('--card-img');
      return;
    }
    if (doc) {
      mediaEl.classList.add('is-doc');
      // The letterbox is the page's own edge colour, so the fit reads as a
      // mounted page rather than as an image that failed to fill its box.
      if (opts.bg) mediaEl.style.backgroundColor = opts.bg;
      // `contain` puts the page where background-position says, and the CSS
      // above wants that decision, not a focal point meant for a crop.
      mediaEl.style.removeProperty('background-position');
    }
    mediaEl.classList.add('has-image');
  };
  probe.onerror = () => { /* file not there yet — keep the fallback gradient */ };
  probe.src = imagePath;
}

function safeInit(label, fn) {
  try {
    fn();
  } catch (err) {
    console.error('[Loom feed] "' + label + '" failed to initialize:', err);
  }
}

/* ======================================================================
   4. Center overlay menu (Projects/Experiments/Questions/Tools) + topbar
      studio chips + language switcher
   ====================================================================== */
// Both of these are Browse-only (see applyBrowseFilters) — Discover always
// shows its newest-first top slice regardless of filter/search state.
let selectedStudio = 'all';
let selectedTypeFilter = 'all'; // distinct from share mode's `selectedType` (the compose form's chosen type)
let searchQuery = '';
// Set by picking someone in Designers; matches a card's `author` field. Like
// the two above it's Browse + Questions only — Discover stays "what's newest
// across everyone", which is the one thing it's for.
let selectedAuthor = null;
/* Set by clicking a keyword in a detail. Browse + Questions only, like the two
   above — Discover stays "what is newest across everyone", which is the one
   thing it is for. */
let selectedKeyword = null;
let isDesignersMode = false;

// Stagger timing for the menu items — open reads as a deliberate, weighty
// reveal (top to bottom, generous per-item delay); close is the same motion
// undone quickly and in reverse (bottom to top), like a stack unwinding.
/* Doors and sub-items alike. Both animate the same two properties from the same
   resting state, so one query in document order staggers the column top to
   bottom without caring which kind of row each one is. */
const MENU_STAGGER_SELECTOR = '.menu-item, .menu-subitem';

const MENU_OPEN_STAGGER_MS = 50;
const MENU_OPEN_DUR_MS = 440;
const MENU_OPEN_EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';
// 18ms x 5 items = the last one starts 72ms in and finishes at ~292ms, which
// keeps the whole reverse inside the 200-300ms it is specced at. At 26 it ran
// to ~350ms — still fast, but the tail was doing nothing for the last 50.
const MENU_CLOSE_STAGGER_MS = 18;
const MENU_CLOSE_DUR_MS = 220;
const MENU_CLOSE_EASE = 'cubic-bezier(0.5, 0, 0.85, 0.35)';

/* Every menu row lands on a floor the same way, and the surfaces are the reason
   it takes more than goToFloor: Share, Designers and an open card each hold the
   screen in front of the feed, and moving a feed nobody can see is how you end
   up on the wrong floor when the surface finally closes. `before` runs with the
   floor still hidden, which is where a filter change belongs — applied by the
   time the floor is looked at, rather than visibly rearranging itself after. */
function menuGoToFloor(tier, before) {
  const go = () => { if (before) before(); goToFloor(tier); };
  if (isShareMode) { exitShareMode(); setTimeout(go, CONFIG.MODE_SWAP_MS + 60); return; }
  if (isDesignersMode) { exitDesignersMode(go); return; }
  if (isCardExpanded) { closeCard(); setTimeout(go, CONFIG.MODE_SWAP_MS + 60); return; }
  go();
}

/* The type filter, set from anywhere. The dropdown on floor 2 used to own this
   inline; the menu's sub-items set the same state before the floor is even
   shown, so both now go through here and neither can forget one of the four
   things that have to happen. */
function setBrowseTypeFilter(key) {
  selectedTypeFilter = key;
  document.querySelectorAll('.type-filter-menu-item')
    .forEach((el) => el.classList.toggle('is-active', el.dataset.value === key));
  updateTypeFilterButtonUI();
  applyBrowseFilters();
}

/* Which of the two ways into Knowledge is the one currently in force. Only ever
   marks a sub-item when floor 2 is actually the floor being held: the filter
   survives leaving the floor, but "Projects" lit up while you are looking at
   Threads would be describing somewhere you are not. */
function refreshMenuSubItems() {
  const onBrowse = !isShareMode && !isDesignersMode && currentFloor === FLOOR_BROWSE;
  document.querySelectorAll('.menu-subitem').forEach((el) => {
    el.classList.toggle('is-active', onBrowse && el.dataset.filter === selectedTypeFilter);
  });
}

function renderMenuOverlay() {
  const list = document.getElementById('menuList');

  MENU_ITEMS.forEach((item) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'menu-item';
    btn.dataset.kind = item.comingSoon ? 'pending' : 'nav';
    btn.dataset.value = item.key;

    const label = document.createElement('span');
    label.className = 'menu-item-label';
    btn.appendChild(label);
    if (item.comingSoon) {
      const aside = document.createElement('span');
      aside.className = 'menu-item-aside';
      btn.appendChild(aside);
    }
    // What is actually behind the word, shown on hover — see refreshMenuLabels.
    const desc = document.createElement('span');
    desc.className = 'menu-item-desc';
    btn.appendChild(desc);

    btn.addEventListener('click', () => {
      closeMenuOverlay();
      if (item.comingSoon) { showToast(t().toolsComingSoon); return; }
      // Designers is a surface, and only one surface can hold the screen — the
      // menu's close animation has to finish before the next one starts.
      /* enterDesignersMode now takes Threads down itself, so this needs no
         special case for it — which is the point of having one teardown. */
      if (item.designers) { setTimeout(enterDesignersMode, MENU_CLOSE_DUR_MS); return; }

      // Knowledge means all of it: arriving through the door itself shouldn't
      // land you on a floor still filtered down by a choice made minutes ago —
      // and now also not by its own sub-item from the last visit.
      menuGoToFloor(item.tier, item.key === 'browse' ? () => setBrowseTypeFilter('all') : null);
    });

    list.appendChild(btn);

    /* The sub-items go in as siblings of the door they belong to, not children
       of it: a button inside a button is not a thing, and the stagger walks the
       column in document order, so being the next rows down is what makes them
       arrive on the beat after Knowledge. */
    if (item.subItems) {
      const row = document.createElement('div');
      row.className = 'menu-subrow';
      item.subItems.forEach((sub) => {
        const subBtn = document.createElement('button');
        subBtn.type = 'button';
        subBtn.className = 'menu-subitem';
        subBtn.dataset.value = sub.key;
        subBtn.dataset.filter = sub.filter;
        subBtn.addEventListener('click', () => {
          closeMenuOverlay();
          menuGoToFloor(item.tier, () => setBrowseTypeFilter(sub.filter));
        });
        row.appendChild(subBtn);
      });
      list.appendChild(row);
    }
  });

  refreshMenuLabels();

  document.getElementById('menuToggleBtn').addEventListener('click', openMenuOverlay);
  document.getElementById('menuCloseBtn').addEventListener('click', closeMenuOverlay);
  // Only a direct hit on the backdrop itself closes it — clicks that bubble
  // up from a menu item or the close button have already handled themselves.
  document.getElementById('menuOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'menuOverlay') closeMenuOverlay();
  });
}

function refreshMenuLabels() {
  document.querySelectorAll('.menu-item').forEach((btn) => {
    // textContent on the label span, not the button — the button also holds the
    // "Coming soon" aside, which writing to the button would wipe out.
    btn.querySelector('.menu-item-label').textContent = t().menu[btn.dataset.value];
    const aside = btn.querySelector('.menu-item-aside');
    if (aside) aside.textContent = t().menuToolsAside;
    const desc = btn.querySelector('.menu-item-desc');
    if (desc) desc.textContent = (t().menuDesc || {})[btn.dataset.value] || '';
  });
  // Same table as the doors — these are menu words, not filter words, so they
  // are plural ("Projects") where the dropdown's are singular ("Project").
  document.querySelectorAll('.menu-subitem').forEach((btn) => {
    btn.textContent = t().menu[btn.dataset.value] || '';
  });
  refreshMenuSubItems();
}

// A brief, dismiss-itself pill for actions with no real destination yet
// (see MENU_ITEMS' `tools` entry) — reuses the same "quiet, non-blocking
// feedback" role a real toast/snackbar plays, just scoped to this one case.
let toastTimer = null;
function showToast(message) {
  const toast = document.getElementById('toast');
  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.classList.add('is-visible');
  toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2200);
}

function isMenuOverlayOpen() {
  return document.getElementById('menuOverlay').classList.contains('is-open');
}

function openMenuOverlay() {
  const overlay = document.getElementById('menuOverlay');
  if (overlay.classList.contains('is-open')) return;
  pauseAutoScroll();
  /* Read the mark here rather than writing it whenever the filter changes.
     setBrowseTypeFilter runs *before* goToFloor — deliberately, so the floor is
     already filtered the first time it is seen — which means currentFloor is
     still the old floor at that moment and "am I on floor 2" answers no. And
     leaving floor 2 afterwards has nothing to do with the filter, so no filter
     event would ever clear a mark left behind on another floor. Both problems go
     away by asking the question at the only moment the answer is visible. */
  refreshMenuSubItems();
  const items = Array.from(overlay.querySelectorAll(MENU_STAGGER_SELECTOR));
  items.forEach((el, i) => {
    el.style.transitionDelay = (i * MENU_OPEN_STAGGER_MS) + 'ms';
    el.style.transitionDuration = MENU_OPEN_DUR_MS + 'ms';
    el.style.transitionTimingFunction = MENU_OPEN_EASE;
  });
  overlay.classList.add('is-open');
  document.getElementById('menuToggleBtn').setAttribute('aria-expanded', 'true');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      items.forEach((el) => el.classList.add('is-visible'));
    });
  });
}

function closeMenuOverlay() {
  const overlay = document.getElementById('menuOverlay');
  if (!overlay.classList.contains('is-open')) return;
  const items = Array.from(overlay.querySelectorAll(MENU_STAGGER_SELECTOR));
  const n = items.length;
  items.forEach((el, i) => {
    el.style.transitionDelay = ((n - 1 - i) * MENU_CLOSE_STAGGER_MS) + 'ms';
    el.style.transitionDuration = MENU_CLOSE_DUR_MS + 'ms';
    el.style.transitionTimingFunction = MENU_CLOSE_EASE;
    el.classList.remove('is-visible');
  });
  overlay.classList.remove('is-open');
  document.getElementById('menuToggleBtn').setAttribute('aria-expanded', 'false');
  scheduleResumeAutoScroll();
}

function renderStudioChips() {
  const wrap = document.getElementById('studioFilter');
  // Idempotent, because it is no longer called only once at startup:
  // openKeywordFilter re-renders the dock when it resets the other filters, and
  // appending on a second call put two full sets of studio chips side by side.
  wrap.innerHTML = '';
  const items = [
    { key: 'all', name: t().filterAll, color: null },
    ...Object.entries(STUDIOS).filter(([, s]) => s.enabled).map(([key, s]) => ({ key, name: s.name, color: s.color })),
  ];
  items.forEach((item) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'studio-chip' + (item.key === 'all' ? ' is-active' : '');
    btn.dataset.kind = 'studio';
    btn.dataset.value = item.key;
    if (item.color) {
      btn.style.setProperty('--chip-color', item.color);
      btn.style.setProperty('--chip-color-bg', hexToRgba(item.color, 0.12));
    }
    const dot = item.color ? `<span class="chip-dot" style="background:${item.color}"></span>` : '';
    btn.innerHTML = `${dot}<span class="chip-label">${item.name}</span>`;
    btn.addEventListener('click', () => {
      selectedStudio = item.key;
      document.querySelectorAll('[data-kind="studio"]').forEach((b) => b.classList.toggle('is-active', b.dataset.value === selectedStudio));
      applyBrowseFilters();
    });
    wrap.appendChild(btn);
  });
}

// One dropdown button instead of a row of chips — studio is the filter
// people reach for constantly (so it stays a visible chip group), type is
// reached for occasionally, so it folds away and only surfaces as a filled
// pill once something other than "All" is actually picked (see
// updateTypeFilterButtonUI/.has-active-filter). Mirrors the language
// switcher's open/close/outside-click/Escape pattern (see renderLanguageSwitcher).
function renderTypeFilterDropdown() {
  const dropdown = document.getElementById('typeFilterDropdown');
  const btn = document.getElementById('typeFilterBtn');
  const menu = document.getElementById('typeFilterMenu');

  // Browse (tier 2) only ever holds finished knowledge — project/experiment —
  // Questions live in their own tier now, so there's no "Question" entry here.
  const items = [
    { key: 'all', label: t().filterAll, icon: null },
    { key: 'project', label: t().types.project, icon: ICONS.project },
    { key: 'experiment', label: t().types.experiment, icon: ICONS.experiment },
  ];

  items.forEach((item) => {
    const menuItem = document.createElement('button');
    menuItem.type = 'button';
    menuItem.className = 'type-filter-menu-item' + (item.key === selectedTypeFilter ? ' is-active' : '');
    menuItem.dataset.kind = 'type';
    menuItem.dataset.value = item.key;
    menuItem.innerHTML = `<span class="type-filter-menu-icon">${item.icon || FILTER_ICON}</span><span class="type-filter-menu-label">${item.label}</span>`;
    menuItem.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdown.classList.remove('is-open');
      // setBrowseTypeFilter does the other four things, and keeps the menu's own
      // two sub-items in step with a choice made down here.
      setBrowseTypeFilter(item.key);
    });
    menu.appendChild(menuItem);
  });

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdown.classList.toggle('is-open');
  });
  document.addEventListener('click', () => dropdown.classList.remove('is-open'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') dropdown.classList.remove('is-open'); });

  updateTypeFilterButtonUI();
}

function updateTypeFilterButtonUI() {
  const dropdown = document.getElementById('typeFilterDropdown');
  const isAll = selectedTypeFilter === 'all';
  document.getElementById('typeFilterBtnIcon').innerHTML = isAll ? FILTER_ICON : ICONS[selectedTypeFilter];
  document.getElementById('typeFilterBtnLabel').textContent = isAll ? t().typeFilterLabel : t().types[selectedTypeFilter];
  dropdown.classList.toggle('has-active-filter', !isAll);
}

function renderLanguageSwitcher() {
  const switcher = document.getElementById('langSwitcher');
  const btn = document.getElementById('langBtn');
  const menu = document.getElementById('langMenu');

  LANGUAGES.forEach((lang) => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'lang-menu-item' + (lang.code === currentLang ? ' is-active' : '');
    item.dataset.lang = lang.code;
    item.textContent = lang.label;
    item.addEventListener('click', () => {
      switcher.classList.remove('is-open');
      setLanguage(lang.code);
    });
    menu.appendChild(item);
  });

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    switcher.classList.toggle('is-open');
  });
  document.addEventListener('click', () => switcher.classList.remove('is-open'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') switcher.classList.remove('is-open'); });

  // The corner mark has to agree with `currentLang` from the first frame. It
  // used to be left at the "EN" in the markup, which was right only because
  // the page always started in English — now that the language is restored
  // from storage, a German session would render entirely in German under a
  // button still claiming EN.
  updateLanguageButtonUI();
}

function updateLanguageButtonUI() {
  const lang = LANGUAGES.find((l) => l.code === currentLang);
  // .short, not .label — this is a 34px corner mark, not a menu row.
  document.getElementById('langBtnLabel').textContent = lang.short;
  document.querySelectorAll('.lang-menu-item').forEach((el) => {
    el.classList.toggle('is-active', el.dataset.lang === currentLang);
  });
}

// Language switch: fade the text-bearing regions out, swap every string in
// place, then fade back in. Layout/positions never move, so this stays cheap
// and smooth regardless of how much text length changes between languages.
function setLanguage(lang) {
  if (lang === currentLang || !TRANSLATIONS[lang]) return;

  const fadeEls = [
    document.getElementById('heroSlides'),
    document.getElementById('browseGrid'),
    document.getElementById('menuList'),
    document.getElementById('searchInput'),
  ];
  if (isCardExpanded) fadeEls.push(document.querySelector('.expanded-body-scroll'));
  if (isShareMode) fadeEls.push(document.getElementById('shareViewport'));
  if (isDesignersMode) fadeEls.push(document.getElementById('designersViewport'));
  if (currentFloor === FLOOR_THREADS) fadeEls.push(document.getElementById('threadsSection'));

  fadeEls.forEach((el) => { if (el) el.style.opacity = '0'; });

  setTimeout(() => {
    currentLang = lang;
    // Not via safeSetItem's read-back check: a language that fails to persist
    // is a preference lost on reload, not corrupt state, and it must never
    // stop the switch itself from happening.
    try { localStorage.setItem(LANGUAGE_STORAGE_KEY, lang); } catch (err) { /* preference only */ }
    refreshAllText();
    fadeEls.forEach((el) => { if (el) el.style.opacity = '1'; });
  }, CONFIG.LANG_FADE_MS);
}

function refreshAllText() {
  const strings = t();

  document.getElementById('searchInput').placeholder = strings.searchPlaceholder;

  refreshMenuLabels();

  document.querySelectorAll('.studio-chip[data-value="all"] .chip-label').forEach((el) => { el.textContent = strings.filterAll; });
  document.querySelectorAll('.type-filter-menu-item').forEach((btn) => {
    const label = btn.querySelector('.type-filter-menu-label');
    if (label) label.textContent = btn.dataset.value === 'all' ? strings.filterAll : strings.types[btn.dataset.value];
  });
  updateTypeFilterButtonUI();

  // (no per-floor headings any more — the menu names every floor, and floor 1
  //  carries nothing but its image and its title)
  document.getElementById('browseEmpty').textContent = strings.browseEmptyText;
  document.getElementById('questionsEmpty').textContent = strings.questionsEmptyText;

  refreshCornerDockText();

  updateLanguageButtonUI();
  // The bell carries its count in an aria-label (it has no visible text), and
  // that label is written by renderNotificationIndicator — which nothing here
  // was calling, so a screen reader kept hearing "For you — 5 new" in English
  // no matter which language the page had been switched to.
  renderNotificationIndicator();
  renderDiscover();
  renderBrowse();
  renderQuestions();
  renderDesigners();
  refreshThreadsText();
  refreshDesignerEditorText();
  renderAuthorFilterChip();
  renderKeywordFilterChip();
  refreshShareText();

  const closeBtn = document.getElementById('expandedClose');
  closeBtn.setAttribute('aria-label', strings.closeAria);
  const applyBtn = document.getElementById('applyBtn');
  applyBtn.textContent = applyBtn.classList.contains('is-applied') ? strings.applyButtonDone : strings.applyButton;
  document.getElementById('deleteCardLabel').textContent = strings.deleteLink;
  document.getElementById('editCardLabel').textContent = strings.editLink;
  document.getElementById('deleteConfirmText').textContent = strings.deleteConfirmText;
  document.getElementById('deleteCancelBtn').textContent = strings.deleteCancel;
  document.getElementById('deleteConfirmBtn').textContent = strings.deleteConfirmButton;

  if (isCardExpanded && currentOpenIndex !== null) {
    populateExpanded(ALL_CARDS[currentOpenIndex], currentOpenIndex);
  }
}

/* ======================================================================
   5. Card rendering — two distinct surfaces sharing the same ALL_CARDS data.

   Discover: one full-width hero banner, autoplaying through a curated top
   slice (computeDiscoverIndices) — always "what's newest", full stop, with
   no filters and no scrolling of its own (see initHeroControls below).

   Browse: every card, small and dense, filtered/searched independently.
   ====================================================================== */
/* ---------- the cover's title ----------
   Each word is wrapped in a .hero-word mask around a plain span (the thing that
   moves), so the letters emerge from behind an edge rather than fading in
   place. The CSS holds the closed state and .is-active on the slide releases
   it, so a slide coming back round replays for free. 70ms sits in the middle
   of the 60-80ms the motion is specced at. textContent on the inner span,
   never innerHTML — a card title is user copy. */
const HERO_WORD_STAGGER_MS = 70;

function renderHeroTitle(el, title) {
  el.innerHTML = '';
  String(title).split(/\s+/).filter(Boolean).forEach((word, i) => {
    const mask = document.createElement('span');
    mask.className = 'hero-word';
    const inner = document.createElement('span');
    inner.textContent = word;
    inner.style.transitionDelay = (i * HERO_WORD_STAGGER_MS) + 'ms';
    mask.appendChild(inner);
    el.appendChild(mask);
    el.appendChild(document.createTextNode(' '));
  });
}

/* The title is meant to take roughly a third of the screen — which is a height
   target, and a font-size can't hit a height target on its own: the same 116px
   runs to two lines for one card and five for the next. So the CSS clamp is
   only the ceiling, and this steps it down until the block actually fits. Cheap
   enough to run per slide (five of them, once per render and once per resize)
   and it beats guessing a size that suits every title. */
const HERO_TITLE_MAX_H = 0.38;  // share of the banner the title may occupy
const HERO_TITLE_MIN_PX = 30;

function fitHeroTitle(titleEl) {
  const hero = document.getElementById('discoverHero');
  if (!hero || !hero.clientHeight || !titleEl) return;
  const maxH = hero.clientHeight * HERO_TITLE_MAX_H;

  titleEl.style.fontSize = ''; // back to the CSS ceiling, so a resize can grow it again
  let size = parseFloat(getComputedStyle(titleEl).fontSize);
  let guard = 0;
  while (titleEl.scrollHeight > maxH && size > HERO_TITLE_MIN_PX && guard++ < 30) {
    size *= 0.93;
    titleEl.style.fontSize = size + 'px';
  }
}

function fitAllHeroTitles() {
  document.querySelectorAll('#heroSlides .card-title').forEach(fitHeroTitle);
}

/* Re-arms the cover: strips .is-active, forces the closed frame to paint, then
   puts it back — which restarts both the word stagger and the Ken Burns push.
   Called when you land back on floor 1, so returning to the cover is an arrival
   rather than a resume.

   .is-replaying kills the transitions for exactly one frame. Without it,
   dropping .is-active starts a *delayed* transition back to closed, the words
   have not moved yet when .is-active returns, and there is nothing to replay. */
function replayHeroIntro() {
  const slide = document.querySelector('#heroSlides .hero-slide.is-active');
  if (!slide) return;
  slide.classList.add('is-replaying');
  slide.classList.remove('is-active');
  void slide.offsetWidth;
  slide.classList.remove('is-replaying');
  void slide.offsetWidth;
  slide.classList.add('is-active');
}

let heroIndices = [];
let heroIndex = 0;
let heroTimer = null;

function renderDiscover() {
  heroIndices = computeDiscoverIndices();
  heroIndex = 0;

  const slidesWrap = document.getElementById('heroSlides');
  slidesWrap.innerHTML = '';

  heroIndices.forEach((index, i) => {
    const data = ALL_CARDS[index];
    const studio = STUDIOS[data.studio];
    const text = cardText(data);
    const timeText = data.justNow ? t().justNow : formatRelativeTime(currentLang, data.timeValue, data.timeUnit);
    const hint = lineageHintFor(data);
    const openQ = isOpenQuestion(data);

    // .is-active is deliberately NOT set here — an element inserted already in
    // its finished state has nothing to transition from, so the first cover
    // would simply appear. It is added on the next frame instead (below).
    const slide = document.createElement('div');
    slide.className = 'hero-slide' + (openQ ? ' is-open-question' : '');
    slide.dataset.index = String(index);
    slide.dataset.studio = data.studio;
    slide.dataset.cardId = data.id;
    slide.innerHTML = `
      <div class="card-media">
        <span class="card-media-icon" style="color:${studio.color}">${ICONS[data.type]}</span>
        <span class="card-media-badge">${ICONS[data.type]}</span>
      </div>
      <div class="card-scrim"></div>
      <div class="card-content">
        <div class="card-meta">
          <span class="card-dot" style="background:${studio.color}"></span>
          <span class="card-studio">${studio.name}</span>
          <!-- in the caption line, not the top-right corner: that corner is
               reserved for the For-you badge, and "DoubleU · 3 days ago" is one
               thought rather than two things at opposite ends of the screen -->
          <span class="card-discover-badges">
            ${data.justNow ? `<span class="card-new-badge">${t().newBadge}</span>` : ''}
            <span class="card-time-badge">${timeText}</span>
          </span>
          ${statusBadgeHTML(data)}
          <span class="card-type">${t().types[data.type]}</span>
        </div>
        <div class="card-title"></div>
        <!-- Only the trace, and only when there is one.
             The keyword chips and the two lineage hint lines that used to be
             here are still on the poster card and in the detail, and that is
             where they belong: a card is read among a dozen others, so it has
             to say what it is about. A cover is not being compared to anything.
             It had a 79px title and then three rows of 12px labels underneath
             repeating in small type what the title had just said in large, and
             the hint line was a quotation cut mid-word — "Came from 'Self-serve
             social asset generator on n8n —...'" — which is not a fact anybody
             can use. The Lineage strip and the detail view both tell that story
             properly. This line stays because it is the one thing the title
             genuinely cannot carry: that the work came from the other studio. -->
        ${exchangeTraceHTML(data)}
      </div>
    `;
    renderHeroTitle(slide.querySelector('.card-title'), text.title);
    applyHeroTone(slide, data);
