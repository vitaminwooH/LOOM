   The bottom corners used to go white for the whole of floor 1, on the
   assumption that floor 1 always means "over the banner's dark scrim". A
   Question cover has no scrim — it is paper-toned top to bottom — so the marks
   turned white on a near-white background and vanished.

   So tone is per REGION of the current screen rather than per floor, and on a
   cover with a photo it is measured from the photo itself. */
const TONE_LIGHT = 'light'; // light background -> dark marks
const TONE_DARK = 'dark';   // dark background -> light marks

const LIGHT_SURFACE_TONE = { topLeft: TONE_LIGHT, topRight: TONE_LIGHT, mid: TONE_LIGHT, bottom: TONE_LIGHT };

// Sampled tones, keyed by image URL. Measuring is cheap but not free, and the
// cover rotates every five seconds through the same handful of images.
const imageToneCache = new Map();

/* Average luminance of one horizontal band of an image AS RENDERED — cover
   scaling and the author's focal point included, because that crop is what the
   marks are actually sitting on. Rec. 709 coefficients: green carries most of
   perceived brightness, and a flat RGB mean calls a saturated blue much lighter
   than it looks.

   `aspect` is the display box's width/height. Cached per image+shape, since the
   cover rotates every five seconds through the same handful of pictures. */
function measureImageTone(url, aspect, focal) {
  const fx = focal && typeof focal.x === 'number' ? focal.x : 50;
  const fy = focal && typeof focal.y === 'number' ? focal.y : 50;
  const key = url + '|' + aspect.toFixed(2) + '|' + fx + ',' + fy;
  if (imageToneCache.has(key)) return Promise.resolve(imageToneCache.get(key));

  return new Promise((resolve) => {
    const done = (tone) => { imageToneCache.set(key, tone); resolve(tone); };
    const img = new Image();

    img.onload = () => {
      try {
        const W = 48;
        const H = Math.max(8, Math.round(W / Math.max(0.2, aspect)));
        const canvas = document.createElement('canvas');
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // The same maths the browser does for background-size: cover plus
        // background-position — scale to fill, then slide by the focal point.
        const iw = img.naturalWidth || 1;
        const ih = img.naturalHeight || 1;
        const scale = Math.max(W / iw, H / ih);
        const dw = iw * scale;
        const dh = ih * scale;
        ctx.drawImage(img, -(dw - W) * (fx / 100), -(dh - H) * (fy / 100), dw, dh);

        const px = ctx.getImageData(0, 0, W, H).data;

        /* Mean luminance of a rectangle, in fractions of the frame. Rectangles
           rather than full-width bands, because the two top marks are in
           opposite corners and a busy photograph averages to something neither
           of them is sitting on — a bright sky on the left and a dark building
           on the right reads as "mid" and picks the wrong colour for both. */
        const areaLuma = (x0f, y0f, x1f, y1f) => {
          const x0 = Math.max(0, Math.floor(x0f * W)), x1 = Math.min(W, Math.ceil(x1f * W));
          const y0 = Math.max(0, Math.floor(y0f * H)), y1 = Math.min(H, Math.ceil(y1f * H));
          let sum = 0, n = 0;
          for (let y = y0; y < Math.max(y0 + 1, y1); y++) {
            for (let x = x0; x < Math.max(x0 + 1, x1); x++) {
              const i = (y * W + x) * 4;
              sum += (0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]) / 255;
              n++;
            }
          }
          return n ? sum / n : 1;
        };

        // 0.55: the marks carry a two-tone halo (see .icon-ghost), so a dark
        // mark survives a mid background better than a light one does. Bias
        // towards dark rather than sitting exactly on the fence.
        const toneOf = (luma) => (luma > 0.55 ? TONE_LIGHT : TONE_DARK);
        done({
          // the actual corners the two top marks occupy, ~26-96px into a
          // 1600px-wide banner and 24-50px down
          topLeft: toneOf(areaLuma(0, 0, 0.09, 0.075)),
          topRight: toneOf(areaLuma(0.91, 0, 1, 0.075)),
          mid: toneOf(areaLuma(0, 0.42, 1, 0.58)),
          bottom: TONE_DARK,
        });
      } catch (err) {
        // getImageData throws on a tainted canvas (a cross-origin image with no
        // CORS headers). Everything here is same-origin or a data: URL, but a
        // wrong guess beats a broken screen.
        console.warn('[Loom feed] could not measure image tone:', err);
        done(LIGHT_SURFACE_TONE);
      }
    };

    img.onerror = () => done(LIGHT_SURFACE_TONE);
    img.src = url;
  });
}


/* The detail's banner is a 22vh strip across the top, and the hamburger and
   the bell sit inside it — a different shape from the cover, so it is measured
   separately rather than assumed light. Nothing else on that screen is dark, so
   only the top band matters. */
let detailTone = TONE_LIGHT;

function applyDetailTone(data) {
  detailTone = TONE_LIGHT;
  if (!data || !data.image || isOpenQuestion(data)) { updateChrome(); return; }
  const media = document.getElementById('expandedMedia');
  const r = media ? media.getBoundingClientRect() : null;
  const aspect = r && r.height ? r.width / r.height : 7;
  measureImageTone(data.image, aspect, data.imageFocal).then((tone) => {
    // The detail's banner is one wide strip and both marks sit in it; the
    // darker of the two corners wins, so neither can be the one that vanishes.
    detailTone = (tone.topLeft === TONE_DARK || tone.topRight === TONE_DARK) ? TONE_DARK : TONE_LIGHT;
    if (isCardExpanded) updateChrome();
  });
  updateChrome();
}

/* The tone of the cover currently showing. Synchronous, because updateChrome
   runs on every floor tween — a slide whose photo has not been measured yet
   carries the type's default until the measurement lands and re-runs this. */
function heroToneNow() {
  /* Falls back to the first slide, not to a light surface. Nothing is .is-active
     for the first two frames after renderHero — the closed state has to paint
     before it can be released — and updateChrome() runs inside that gap. The old
     fallback answered "light, top to bottom" for it, which stuck: the only thing
     that re-runs updateChrome afterwards is a floor tween, a slide change, or a
     photo measurement landing, and a cover with no photograph has no measurement
     to land. So the very first cover of the session kept a light-surface tone
     over its own dark scrim, and the two bare lines in the Update strip were ink
     on near-black — 1.13:1, which is invisible. Every slide's dataset is filled
     by applyHeroTone before it is ever appended, so the first one can answer
     this whether or not it has been activated yet. */
  const slide = document.querySelector('#heroSlides .hero-slide.is-active')
    || document.querySelector('#heroSlides .hero-slide');
  if (!slide) return LIGHT_SURFACE_TONE;
  return {
    topLeft: slide.dataset.toneTopLeft || TONE_LIGHT,
    topRight: slide.dataset.toneTopRight || TONE_LIGHT,
    mid: slide.dataset.toneMid || TONE_LIGHT,
    // Every cover except a Question has the dark scrim across its lower third,
    // whatever the photo is doing up top.
    bottom: slide.dataset.toneBottom || TONE_DARK,
  };
}

/* Measures one slide and stores the answer on the element. The defaults are
   what the design guarantees without looking at any pixels:
     - a Question cover is paper, top to bottom
     - a cover with no photo is the studio gradient: light at the top, and the
       scrim takes the bottom
   Only a real photograph needs measuring. */
function applyHeroTone(slide, data) {
  const openQ = isOpenQuestion(data);
  slide.dataset.toneTopLeft = TONE_LIGHT;
  slide.dataset.toneTopRight = TONE_LIGHT;
  slide.dataset.toneMid = TONE_LIGHT;
  slide.dataset.toneBottom = openQ ? TONE_LIGHT : TONE_DARK;
  if (openQ || !data.image) return;

  // The cover fills the window, so its shape is the window's.
  measureImageTone(data.image, window.innerWidth / Math.max(1, window.innerHeight), data.imageFocal).then((tone) => {
    slide.dataset.toneTopLeft = tone.topLeft;
    slide.dataset.toneTopRight = tone.topRight;
    slide.dataset.toneMid = tone.mid;
    slide.dataset.toneBottom = TONE_DARK;
    if (slide.classList.contains('is-active')) updateChrome();
  });
}

function setTone(el, tone) {
  if (!el) return;
  const dark = tone === TONE_DARK;
  el.classList.toggle('on-dark', dark);
  el.querySelectorAll('.icon-ghost').forEach((b) => b.classList.toggle('on-dark', dark));
}

function updateChrome() {
  const onFeed = !isShareMode && !isDesignersMode && !isCardExpanded;
  const onCover = onFeed && currentFloor === 0;

  // ---- per-floor: the tools that belong to one floor ----
  const dock = document.getElementById('floorDock');
  if (dock) {
    // onFeed, not just "currentFloor > 0" — the floor number does not change
    // when Designers takes the screen, so a dock keyed only on the floor
    // followed the roster in and sat on top of it.
    /* The dock belongs to floors 2 and 3 — floor 1 is the cover and floor 4 is
       the lookout, and neither has tools. Without the upper bound the search box
       and the studio chips followed the weave down onto it. */
    const onToolFloor = onFeed && currentFloor > 0 && currentFloor < FLOOR_THREADS;
    dock.classList.toggle('is-visible', onToolFloor);
    document.getElementById('dockBrowse').classList.toggle('is-active', onFeed && currentFloor === 1);
    document.getElementById('dockQuestions').classList.toggle('is-active', onFeed && currentFloor === 2);

    const brand = document.getElementById('brandFooter');
    if (brand) brand.classList.toggle('is-visible', onToolFloor);

    // floor 4 carries its own wordmark, with the line the plain one has not got
    const threadsFoot = document.getElementById('threadsFooter');
    if (threadsFoot) threadsFoot.classList.toggle('is-visible', onFeed && currentFloor === FLOOR_THREADS);
  }

  // the cover's own arrows are part of floor 1 and nothing else
  const hero = document.getElementById('discoverHero');
  if (hero) hero.classList.toggle('is-chrome-hidden', !onCover);

  // ---- always: how you get anywhere ----
  let tone = LIGHT_SURFACE_TONE;
  if (onCover) tone = heroToneNow();
  // a detail's banner runs under the two top marks and can be any photograph
  else if (isCardExpanded) tone = { topLeft: detailTone, topRight: detailTone, mid: TONE_LIGHT, bottom: TONE_LIGHT };
  // each top mark takes the colour of its own corner
  setTone(document.getElementById('menuToggleBtn'), tone.topLeft);
  setTone(document.getElementById('notifyBtn'), tone.topRight);
  setTone(document.getElementById('cornerDock'), tone.bottom);
  setTone(document.getElementById('langBtn'), tone.bottom);
  // the cover's dots and the Update strip live in that same bottom band
  const dots = document.getElementById('heroDots');
  if (dots) dots.classList.toggle('on-light', tone.bottom === TONE_LIGHT);
  const discover = document.querySelector('.discover-section');
  if (discover) discover.classList.toggle('on-light', tone.bottom === TONE_LIGHT);
  document.querySelectorAll('.hero-arrow').forEach((a) => setTone(a, tone.mid));
}


/* ======================================================================
   7. Hero autoplay pause/resume — shared by initHeroControls (hover),
   openCard/closeCard (modal open), and enterShareMode/exitShareMode (share
   mode), so the hero never advances a slide out from under any of them.
   ====================================================================== */
let resumeTimer = null;
let isCardExpanded = false;

function pauseAutoScroll() {
  if (resumeTimer) clearTimeout(resumeTimer);
  stopHeroAutoplay();
}
function scheduleResumeAutoScroll() {
  if (resumeTimer) clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => {
    if (!isCardExpanded && !isShareMode) startHeroAutoplay();
  }, CONFIG.RESUME_DELAY_MS);
}

/* ======================================================================
   8. Card expand / collapse (FLIP: animates the real position and size)
   ====================================================================== */
let activeCardEl = null;
let currentOpenIndex = null;
let currentQuestionData = null; // the card currently shown in the Question detail two-pane, if any

// "Where it spread" — a plain list of this card's connections (derivedFrom/
// derivedInto/relatedTo/appliedBy). A small radial graph lived here before;
// it didn't earn its keep once the bigger Discover cards became the star of
// the page (see .card-lineage-hint there instead) — this is the "spell it
// all out" detail view, deliberately just text and a color dot.
/* Where an applied-by change is written depends on which kind of card it is:
   a shared card keeps its own copy, a seed card gets a patch over the seed.
   Both already have a home — this just picks the right one. */
function persistAppliedBy(card) {
  if (card.isShared) {
    const stored = sharedCards.find((c) => c.id === card.id);
    if (stored) { stored.appliedBy = card.appliedBy.slice(); writeSharedCards(sharedCards); }
    return;
  }
  const patch = Object.assign({}, seedEditsMap()[card.id] || {}, { appliedBy: card.appliedBy.slice() });
  saveSeedEdit(card.id, patch);
}

/* The rows under the strip are what the strip could not show: a sibling
   branch, a related idea. Anything already drawn as a node above would just be
   the same fact twice, so it is filtered out here — and when nothing is left,
   nothing is drawn, because the strip has already said whether this is
   connected to anything at all. */
function renderLineageList(data, preferId) {
  const wrap = document.getElementById('lineageListWrap');
  wrap.innerHTML = '';

  const chain = lineageChain(data, 2, preferId);
  const inStrip = new Set(chain.before.concat(chain.after).map((n) => n.card.id));
  const nodes = buildLineageNodes(data).filter((n) => !inStrip.has(n.id));
  if (!nodes.length) return;

  nodes.forEach((node) => {
    const row = document.createElement('div');
    row.className = 'lineage-row';
    row.innerHTML = `<span class="lineage-row-dot"></span>` +
      `<span class="lineage-row-relation"></span>` +
      `<span class="lineage-row-name"></span>` +
      `<span class="lineage-row-studio"></span>`;
    row.querySelector('.lineage-row-dot').style.background = node.color;
    row.querySelector('.lineage-row-relation').textContent = t().lineage[node.relation] || '';
    row.querySelector('.lineage-row-name').textContent = truncateForSummary(node.title || '', 64);
    row.querySelector('.lineage-row-studio').textContent = node.studioName;
    wrap.appendChild(row);
  });
}

function populateExpanded(data, index) {
  const studio = STUDIOS[data.studio];
  const text = cardText(data);
  const expandedCard = document.getElementById('expandedCard');
  const expandedMedia = document.getElementById('expandedMedia');
  const panes = document.getElementById('expandedPanes');
  const questionDetail = document.getElementById('questionDetail');
  const openQ = isOpenQuestion(data);

  expandedCard.classList.toggle('is-open-question', openQ);

  if (openQ) {
    currentQuestionData = data;
    expandedMedia.style.display = 'none';
    panes.style.display = 'none';
    questionDetail.style.display = 'flex';
    applyDetailTone(data); // no banner on a question — plain light
    populateQuestionDetail(data);
    return;
  }

  currentQuestionData = null;
  expandedMedia.style.display = '';
  panes.style.display = '';
  questionDetail.style.display = 'none';

  const resolved = data.status === 'resolved' && !!text.result;
  expandedMedia.classList.toggle('is-open-question', false);
  expandedCard.style.setProperty('--studio-color', studio.color);
  expandedMedia.innerHTML = `<span class="card-media-icon" style="color:${studio.color}">${ICONS[data.type]}</span><span class="card-media-badge">${ICONS[data.type]}</span>`;
  applyCardMedia(expandedMedia, data.image, studio.color, data.imageFocal, { fit: data.imageFit, bg: data.imageBg });

  document.getElementById('expandedDot').style.background = studio.color;
  document.getElementById('expandedStudioName').textContent = studio.name;
  document.getElementById('expandedAuthor').textContent = data.author;
  document.getElementById('expandedTime').textContent = data.justNow ? t().justNow : formatRelativeTime(currentLang, data.timeValue, data.timeUnit);
  renderEditedStamp(document.getElementById('expandedEdited'), data);
  document.getElementById('expandedStatusBadge').innerHTML = statusBadgeHTML(data);
  document.getElementById('expandedTitle').textContent = text.title;
  renderBodySections(document.getElementById('expandedBodySections'), data, text);

  // Updates can carry somewhere to look. rel=noopener because target=_blank
  // otherwise hands the opened page a live handle on this one.
  const linkEl = document.getElementById('detailLink');
  if (data.link) {
    linkEl.href = data.link;
    document.getElementById('detailLinkLabel').textContent = t().openLink;
    linkEl.style.display = '';
  } else {
    linkEl.style.display = 'none';
  }
  applyDetailTone(data);
  renderCardStatus(document.getElementById('cardStatusBlock'), data);
  document.getElementById('labelReactions').textContent = t().reactions.label;
  document.getElementById('captionReactions').textContent = t().reactionsCaption;
  renderReactionArea(data.id);
  document.getElementById('labelApplied').textContent = t().appliedLabel;
  document.getElementById('captionLineage').textContent = t().lineageCaption;
  document.getElementById('appliedSummary').textContent = lineageSummaryText(data);
  renderSameThreadSection(data);
  renderLineageStrip(data);
  renderLineageList(data);
  renderLangPendingBadge(document.getElementById('expandedLangBadge'), data);

  const hasAttachments = !!(data.attachments && data.attachments.length);
  document.getElementById('attachmentsSection').style.display = hasAttachments ? '' : 'none';
  if (hasAttachments) {
    document.getElementById('labelAttachments').textContent = t().share.attachmentsLabel;
    renderAttachmentsInto(document.getElementById('expandedAttachmentsWrap'), data);
  }

  syncApplyButton(data);

  // Delete is only ever offered on cards this session itself shared
  // (author "You"). There's no login in this prototype, so `isShared` is
  // the stand-in for "mine" — a real backend would check the signed-in
  // user (or their studio) against the card's author, server-side, rather
  // than trust a flag the client could flip.
  /* Edit is offered on anything this studio owns, including its own seed
     cards. Delete is not: removing a card the whole network may have applied
     is a different weight of action from fixing a sentence in it, and only
     something written this session can be taken back. */
  /* The id goes on the row unconditionally — `data.id` when the row is shown,
     empty when it is not. It used to be set only in populateExpanded, which a
     Question detail never reaches (it takes the other branch, see
     openQuestionDetail), so opening your own Project and then a Question left
     the row hidden but still tagged with the Project's id. Nothing could reach
     the buttons while it was hidden, so nothing broke — but "the row still
     names the last card you looked at" is the kind of state that turns into an
     edit landing on the wrong card the first time a question gets an edit
     button. */
  const deleteRow = document.getElementById('expandedDeleteRow');
  resetDeleteConfirm();
  const editable = canEditCard(data);
  deleteRow.style.display = editable ? 'flex' : 'none';
  deleteRow.dataset.cardId = editable ? data.id : '';
  document.getElementById('deleteCardBtn').style.display = data.isShared ? 'flex' : 'none';
}

/* The detail's chips, and the loose thread under them. One function because
   they are one block on screen and share the same "is there anything here at
   all?" question — a keyword nobody else has used is still worth showing (it is
   what this work is about), but it earns no list under it. */
function renderSameThreadSection(data) {
  const section = document.getElementById('sameThreadSection');
  const tagWrap = document.getElementById('detailKeywords');
  const list = document.getElementById('sameThreadList');
  if (!section) return;

  const words = keywordsOf(data);
  if (!words.length) { section.style.display = 'none'; return; }
  section.style.display = '';

  document.getElementById('labelSameThread').textContent = t().sameThread.label;
  document.getElementById('captionSameThread').textContent = t().sameThread.caption;

  // Chips first: a button each, because from a detail a keyword is a door.
  tagWrap.innerHTML = '';
  words.forEach((word) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'keyword-tag';
    btn.textContent = word;
    btn.dataset.keyword = word;
    btn.addEventListener('click', () => openKeywordFilter(word));
    tagWrap.appendChild(btn);
  });

  const others = sameThreadCards(data, 4);
  list.innerHTML = '';
  others.forEach((card) => {
    const studio = STUDIOS[card.studio];
    const shared = keywordsOf(card).find((k) => words.some((w) => keywordKey(w) === keywordKey(k)));
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'same-thread-item';
    row.innerHTML = `
      <span class="same-thread-dot" style="background:${studio ? studio.color : 'var(--ink)'}"></span>
      <span class="same-thread-text">
        <span class="same-thread-title"></span>
        <span class="same-thread-meta"></span>
      </span>
    `;
    row.querySelector('.same-thread-title').textContent = truncateForSummary(cardText(card).title || '', 68);
    const meta = row.querySelector('.same-thread-meta');
    const when = card.justNow ? t().justNow : formatRelativeTime(currentLang, card.timeValue, card.timeUnit);
    meta.textContent = (studio ? studio.name : '') + ' · ' + when + ' · ';
    const word = document.createElement('span');
    word.className = 'same-thread-word';
    word.textContent = shared || '';
    meta.appendChild(word);
    row.addEventListener('click', () => openCardById(card.id));
    list.appendChild(row);
  });
}

/* One card's body, as the headings its own type asks for. textContent on the
   paragraph (never innerHTML — this is somebody's prose), and the CSS carries
   white-space: pre-wrap so the line breaks they typed survive. */
/* ======================================================================
   Reactions, replies and emoji
   ----------------------------------------------------------------------
   A reaction is a small message, not a vote. The previous version stored which
   studios had picked each of three kinds, which can answer "how many" and
   nothing else — and "how many" is a score, which is the one thing this app
   does not do (see the note above DESIGNERS: contribution visible, competition
   not).

   So each reaction carries who left it, which of the three things they meant,
   an optional line of their own, and when. They are listed, never counted, and
   anyone can answer one. Replies go exactly one level deep: a reaction with
   three answers under it is a conversation, and a reaction with a reply to a
   reply to a reply is a forum, which is a different product.

   Emoji sit underneath all of that as the lightest layer there is — for when
   even "same problem here" is more than you mean. Deliberately small, with the
   names on hover rather than a number in bold: five people quietly agreeing is
   information, and "🔥 5" is a leaderboard.

   TODO(backend): all of this is per-browser localStorage keyed by studio. A
   real service records the authenticated account, server-side, and pushes the
   resulting notification to the author rather than writing it locally (see
   pushNotification).
   ====================================================================== */
/* Most of this file builds DOM with textContent, which needs no escaping. The
   few templates below interpolate a person's name into innerHTML, and names
   come off the Designers roster — which anyone can type into. Constant strings
   (studio names, the inline SVGs) are safe; anything a reader authored is not. */
function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const REACTION_KINDS = ['tryThis', 'sameProblem', 'question'];

const REACTION_ICONS = {
  tryThis: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19.5 7"/></svg>',
  sameProblem: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M15.5 20a4.6 4.6 0 0 1 5.5-4.5"/></svg>',
  question: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 9a2.9 2.9 0 1 1 3.8 2.8c-.8.3-1.3 1-1.3 1.9v.6"/><circle cx="11.8" cy="18" r="0.9" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="9"/></svg>',
};

// Small, and five of them. More would be a picker, and a picker is a decision.
const EMOJI_SET = ['\u2764\uFE0F', '\uD83D\uDC4D', '\uD83D\uDC40', '\uD83D\uDD25', '\u2753'];

const REACTIONS_STORAGE_KEY = 'loom_reactions_v2';

/* Seeded so the app does not open on an empty column — the same job the sample
   conversations do. Ages are minutes-ago offsets rather than absolute stamps,
   so a demo opened next week still reads as "yesterday" instead of as a
   fixed date in the past. */
const SEED_REACTIONS = [
  { id: 'rx-1', cardId: 'c1', kind: 'sameProblem', author: 'Bengt Larsson', studio: 'whow', minsAgo: 60 * 26,
    note: 'We saw the same drop-off before the paywall. Ours was closer to 88% but the shape is identical.',
    emoji: { '\uD83D\uDC40': ['doubleu'] },
    replies: [
      { id: 'rp-1', author: 'Doyoon Kim', studio: 'doubleu', minsAgo: 60 * 25,
        text: 'Good to know it is not just us. Did the near-miss moment move it for you?', emoji: {} },
      { id: 'rp-2', author: 'Bengt Larsson', studio: 'whow', minsAgo: 60 * 24,
        text: 'Trying it this sprint — will report back either way.', emoji: { '\u2764\uFE0F': ['doubleu'] } },
    ] },
  { id: 'rx-2', cardId: 'c1', kind: 'tryThis', author: 'Mira Keller', studio: 'whow', minsAgo: 60 * 9,
    note: '', emoji: {}, replies: [] },
  { id: 'rx-3', cardId: 'c2', kind: 'question', author: 'Haeun Lee', studio: 'doubleu', minsAgo: 60 * 40,
    note: 'Did 7x7 hold up for players past week two, or only in the first sessions?',
    emoji: { '\u2753': ['whow'] }, replies: [] },
  { id: 'rx-4', cardId: 'c5', kind: 'tryThis', author: 'Jiho Baek', studio: 'doubleu', minsAgo: 60 * 70,
    note: 'Lifting the three-day teaser wholesale for our autumn event.', emoji: {}, replies: [] },
];

// Emoji left on a card's body itself, keyed by card id. A separate, lighter
// layer from the three reactions — for when even "same problem here" is more
// than you mean.
const SEED_BODY_EMOJI = {
  c1: { '\uD83D\uDD25': ['whow'] },
  c9: { '\uD83D\uDC4D': ['doubleu'], '\uD83D\uDC40': ['whow'] },
};

function seedReactionState() {
  const now = Date.now();
  const stamp = (mins) => now - mins * 60 * 1000;
  return {
    reactions: SEED_REACTIONS.map((r) => ({
      id: r.id, cardId: r.cardId, kind: r.kind, author: r.author, studio: r.studio,
      note: r.note, at: stamp(r.minsAgo),
      emoji: JSON.parse(JSON.stringify(r.emoji || {})),
      replies: (r.replies || []).map((p) => ({
        id: p.id, author: p.author, studio: p.studio, text: p.text, at: stamp(p.minsAgo),
        emoji: JSON.parse(JSON.stringify(p.emoji || {})),
      })),
    })),
    bodyEmoji: JSON.parse(JSON.stringify(SEED_BODY_EMOJI)),
  };
}

function loadReactionState() {
  try {
    const parsed = JSON.parse(localStorage.getItem(REACTIONS_STORAGE_KEY));
    if (parsed && Array.isArray(parsed.reactions)) return parsed;
  } catch (err) {
    console.error('[Loom feed] could not read reactions:', err);
  }
  return seedReactionState();
}

let reactionState = loadReactionState();

function persistReactions() {
  if (safeSetItem(REACTIONS_STORAGE_KEY, JSON.stringify(reactionState)).ok) return true;
  showToast(t().share.storageFailed);
  return false;
}

function reactionsOn(cardId) {
  return reactionState.reactions
    .filter((r) => r.cardId === cardId && isStudioEnabled(r.studio))
    .sort((a, b) => a.at - b.at);
}

function findReaction(id) {
  return reactionState.reactions.find((r) => r.id === id);
}

// A short id that does not need Date.now to be unique on its own — two
// reactions left in the same millisecond would otherwise collide.
let localIdSeq = 0;
function localId(prefix) {
  return prefix + '-' + Date.now().toString(36) + '-' + (localIdSeq++).toString(36);
}

/* Leaving a reaction. `note` is optional and usually empty: the whole point of
   the three kinds is that agreeing costs one click. Returns the new reaction so
   the caller can tell the author about it. */
function addReaction(cardId, kind, note) {
  const entry = {
    id: localId('rx'),
    cardId, kind,
    author: myDisplayName(),
    studio: MY_STUDIO_KEY,
    note: (note || '').trim(),
    at: Date.now(),
    emoji: {},
    replies: [],
  };
  reactionState.reactions.push(entry);
  if (!persistReactions()) {
    reactionState.reactions.pop();
    return null;
  }
  return entry;
}

function removeReaction(id) {
  const at = reactionState.reactions.findIndex((r) => r.id === id);
  if (at < 0) return false;
  const [removed] = reactionState.reactions.splice(at, 1);
  if (!persistReactions()) {
    reactionState.reactions.splice(at, 0, removed);
    return false;
  }
  return true;
}

// Your own reaction of a given kind on a card, if you have left one — the
// pills are a toggle, so this is what tells them which state to be in.
function myReactionOn(cardId, kind) {
  return reactionState.reactions.find((r) =>
    r.cardId === cardId && r.kind === kind && r.studio === MY_STUDIO_KEY && r.author === myDisplayName());
}

function addReply(reactionId, text) {
  const reaction = findReaction(reactionId);
  if (!reaction) return null;
  const reply = {
    id: localId('rp'),
    author: myDisplayName(),
    studio: MY_STUDIO_KEY,
    text: text.trim(),
    at: Date.now(),
    emoji: {},
  };
  reaction.replies.push(reply);
  if (!persistReactions()) {
    reaction.replies.pop();
    return null;
  }
  return reply;
}

/* Emoji live on three kinds of thing — a card's body, a reaction, a reply — so
   the toggle takes the map rather than an id, and every caller passes whichever
   map it owns. Values are studio keys; the tooltip turns them into names. */
function toggleEmojiIn(map, emoji) {
  const list = map[emoji] || (map[emoji] = []);
  const at = list.indexOf(MY_STUDIO_KEY);
  if (at > -1) list.splice(at, 1);
  else list.push(MY_STUDIO_KEY);
  if (!list.length) delete map[emoji];
  return persistReactions();
}

function bodyEmojiFor(cardId) {
  if (!reactionState.bodyEmoji) reactionState.bodyEmoji = {};
  return reactionState.bodyEmoji[cardId] || (reactionState.bodyEmoji[cardId] = {});
}

/* The reader's own name. There is no login, so it is the first person on their
   own studio's roster — which at least makes "You" read as a person to anyone
   being shown this, rather than as a placeholder.
   TODO(auth): the signed-in account's display name. */
/* Any author name on its way to the screen goes through here. A reaction or
   reply written by an older build can be missing `author` entirely, and
   escapeHtml(undefined) renders the literal text "undefined" — which is how a
   tooltip ends up reading "undefined, Minwoo Heo". Same principle as
   sanitizeStoredNotification: never render a row you cannot phrase. */
function displayNameOr(name) {
  const clean = typeof name === 'string' ? name.trim() : '';
  return clean || t().reactions.someone;
}

function myDisplayName() {
  const mine = designerRoster.find((d) => d.studio === MY_STUDIO_KEY);
  return (mine && mine.name) || 'You';
}

function isMine(entry) {
  return entry.studio === MY_STUDIO_KEY && entry.author === myDisplayName();
}

/* ---------- the three pills ----------
   Leaving one is a single click. The note is a second, optional step that only
   appears once you have clicked — asking for a sentence up front is how you
   get no reactions at all. */
function renderReactionPills(wrap, cardId, onChange) {
  wrap.innerHTML = '';

  REACTION_KINDS.forEach((kind) => {
    const mine = myReactionOn(cardId, kind);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'reaction-pill' + (mine ? ' is-mine' : '');
    btn.dataset.kind = kind;
    btn.setAttribute('aria-pressed', mine ? 'true' : 'false');
    btn.innerHTML = REACTION_ICONS[kind];

    const label = document.createElement('span');
    label.textContent = t().reactions.kinds[kind];
    btn.appendChild(label);

    btn.addEventListener('click', () => {
      if (mine) {
        if (removeReaction(mine.id)) onChange();
        return;
      }
      const entry = addReaction(cardId, kind);
      if (!entry) return;
      notifyAuthorOfReaction(cardId, entry);
      onChange();
      // The note box opens on the reaction you just left, focused, so adding a
      // line is a continuation rather than a separate decision.
      openNoteEditor(entry.id);
    });

    wrap.appendChild(btn);
  });
}

/* ---------- who reacted, and what they said ----------
   A list, never a count. "Bengt at Whow hit the same thing and left a line
   about it" is the reason to come back; "3" is not. */
function renderReactionList(wrap, cardId, onChange) {
  wrap.innerHTML = '';
  const list = reactionsOn(cardId);

  if (!list.length) {
    const empty = document.createElement('p');
    empty.className = 'reaction-empty';
    empty.textContent = t().reactions.emptyList;
    wrap.appendChild(empty);
    return;
  }

  list.forEach((r) => wrap.appendChild(reactionItemEl(r, onChange)));
}

function reactionItemEl(r, onChange) {
  const studio = STUDIOS[r.studio];
  const item = document.createElement('div');
  item.className = 'reaction-item';
  item.dataset.reactionId = r.id;

  // --- who, what kind, when ---
  const head = document.createElement('div');
  head.className = 'reaction-item-head';
  head.innerHTML = `
    <span class="card-dot" style="background:${studio.color}"></span>
    <span class="reaction-author">${escapeHtml(displayNameOr(r.author))}</span>
    <span class="reaction-studio">${studio.name}</span>
    <span class="reaction-kind">${REACTION_ICONS[r.kind]}${t().reactions.kinds[r.kind]}</span>
    <span class="reaction-time">${relativeFromStamp(r.at)}</span>
  `;
  item.appendChild(head);

  // --- their own line, if they left one ---
  if (r.note) {
    const note = document.createElement('p');
    note.className = 'reaction-note';
    note.textContent = r.note;
    item.appendChild(note);
  }

  // --- the note editor, for your own reaction ---
  if (isMine(r)) {
    const editor = document.createElement('form');
    editor.className = 'reaction-note-editor';
    editor.dataset.for = r.id;
    const input = document.createElement('input');
    input.type = 'text';
    input.value = r.note || '';
    input.placeholder = t().reactions.notePlaceholder;
    const save = document.createElement('button');
    save.type = 'submit';
    save.className = 'reaction-note-save';
    save.textContent = t().reactions.noteSave;
    editor.appendChild(input);
    editor.appendChild(save);
    editor.addEventListener('submit', (e) => {
      e.preventDefault();
      r.note = input.value.trim();
      if (persistReactions()) onChange();
    });
    item.appendChild(editor);

    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'reaction-note-toggle';
    toggle.textContent = r.note ? t().reactions.noteEdit : t().reactions.noteAdd;
    toggle.addEventListener('click', () => openNoteEditor(r.id));
    item.appendChild(toggle);
  }

  item.appendChild(emojiRowEl(r.emoji, onChange));

  // --- replies, one level deep ---
  const replies = document.createElement('div');
  replies.className = 'reply-list';
  (r.replies || []).forEach((p) => replies.appendChild(replyEl(p, onChange)));
  item.appendChild(replies);

  const form = document.createElement('form');
  form.className = 'reply-form';
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = t().reactions.replyPlaceholder;
  const send = document.createElement('button');
  send.type = 'submit';
  send.className = 'reply-send';
  send.textContent = t().reactions.replySend;
  form.appendChild(input);
  form.appendChild(send);
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const value = input.value.trim();
    if (!value) return;
    const reply = addReply(r.id, value);
    if (!reply) return;
    notifyOfReply(r, reply);
    onChange();
  });
  item.appendChild(form);

  return item;
}

function replyEl(p, onChange) {
  const studio = STUDIOS[p.studio];
  const el = document.createElement('div');
  el.className = 'reply-item';
  el.innerHTML = `
    <div class="reply-head">
      <span class="card-dot" style="background:${studio.color}"></span>
      <span class="reply-author">${escapeHtml(displayNameOr(p.author))}</span>
      <span class="reply-studio">${studio.name}</span>
      <span class="reply-time">${relativeFromStamp(p.at)}</span>
    </div>
    <p class="reply-text"></p>
  `;
  el.querySelector('.reply-text').textContent = p.text;
  el.appendChild(emojiRowEl(p.emoji, onChange));
  return el;
}

/* ---------- emoji ----------
   Small on purpose. The count is there because a row of five identical hearts
   would be worse, but it is set in the body size, not bold and not coloured —
   who reacted is the tooltip, and that is the part worth reading. */
function emojiRowEl(map, onChange) {
  const row = document.createElement('div');
  row.className = 'emoji-row';

  EMOJI_SET.forEach((emoji) => {
    const who = (map[emoji] || []).filter(isStudioEnabled);
    const mine = who.indexOf(MY_STUDIO_KEY) > -1;
    // Only the ones already used are shown at rest; the rest live behind the +
    // so a fresh reaction is not five grey buttons.
    if (!who.length) return;

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'emoji-chip' + (mine ? ' is-mine' : '');
    // Names only for keys that really are studios. `who` is already filtered,
    // but a map written by an older build could hold a person's name where a
    // studio key belongs — omit those rather than title="undefined".
    btn.title = who.map((k) => (STUDIOS[k] || {}).name).filter(Boolean).join(', ');
    btn.innerHTML = `<span class="emoji-glyph">${emoji}</span><span class="emoji-count">${who.length}</span>`;
    btn.addEventListener('click', () => { if (toggleEmojiIn(map, emoji)) onChange(); });
    row.appendChild(btn);
  });

  const add = document.createElement('div');
  add.className = 'emoji-add';
  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'emoji-add-btn';
  addBtn.setAttribute('aria-label', t().reactions.emojiAdd);
  addBtn.title = t().reactions.emojiAdd;
  addBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>';
  const picker = document.createElement('div');
  picker.className = 'emoji-picker';
  EMOJI_SET.forEach((emoji) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'emoji-option';
    b.textContent = emoji;
    b.addEventListener('click', () => { if (toggleEmojiIn(map, emoji)) onChange(); });
    picker.appendChild(b);
  });
  add.appendChild(addBtn);
  add.appendChild(picker);
  addBtn.addEventListener('click', () => add.classList.toggle('is-open'));
  row.appendChild(add);

  return row;
}

// Opens (and focuses) the note field on one reaction. Called right after you
// leave one, and from its own "add a line" button.
function openNoteEditor(reactionId) {
  const item = document.querySelector(`.reaction-item[data-reaction-id="${reactionId}"]`);
  if (!item) return;
  item.classList.add('is-noting');
  const input = item.querySelector('.reaction-note-editor input');
  if (input) input.focus();
}

// The reaction column, redrawn as one piece — the pills reflect what is in the
// list and the list reflects the pills, so they are never rendered apart.
function renderReactionArea(cardId) {
  const redraw = () => renderReactionArea(cardId);
  renderReactionPills(document.getElementById('reactionPills'), cardId, redraw);
  renderReactionList(document.getElementById('reactionList'), cardId, redraw);
  const bodyRow = document.getElementById('bodyEmojiRow');
  if (bodyRow) {
    bodyRow.innerHTML = '';
    bodyRow.appendChild(emojiRowEl(bodyEmojiFor(cardId), redraw));
  }
}

/* ======================================================================
   For you — what came back
   ----------------------------------------------------------------------
   Three things are worth telling somebody about, and they are all about their
   own work: a studio applied what you wrote, someone reacted to or answered
   it, or a question was addressed to your studio. Nothing else earns an
   interruption — "12 new cards this week" is a metric, not news.

   Phrasing is a person doing something, never a count: "Bengt at Whow left a
   question on your reward flow", not "1 new reaction". The count on the
   indicator exists so you know whether to look; the panel is where the actual
   information is.

   TODO(backend): every notification here is written locally by whichever
   action caused it, because there is one browser and no server. A real service
   emits these from the write path on the server and delivers them over a
   socket or a poll to the *author's* session — nothing on the reader's machine
   should be able to invent a notification for someone else. The shape below is
   deliberately what such an event would carry, so swapping in a feed of them
   touches loadNotifications and nothing else.
   ====================================================================== */
const NOTIFICATIONS_STORAGE_KEY = 'loom_notifications_v1';

// 'applied'  — a studio took your knowledge and used it
// 'reaction' — someone left one of the three reactions on your card
// 'reply'    — someone answered a reaction in a thread you are part of
// 'asked'    — a question was addressed to your studio
const NOTIFICATION_KINDS = ['applied', 'reaction', 'reply', 'asked'];

/* Keyed by who you signed in as, because every one of these is a sentence
   about *your* studio's work. The old single list was written from DoubleU's
   chair — Whow people acting on DoubleU cards — so signing in as Whow was told
   that Whow had reacted to Whow's own work, about cards Whow does not own.
   Each set therefore names cards that studio actually wrote, and actors from a
   different studio. notificationView enforces the same rule at render time, so
   a wrong row can never reach the panel even if this table drifts. */
const SEED_NOTIFICATIONS_BY_STUDIO = {
  doubleu: [
    { id: 'nt-du-1', kind: 'reaction', cardId: 'c1', actor: 'Bengt Larsson', studio: 'whow',
      detail: 'sameProblem', minsAgo: 60 * 26, read: false },
    { id: 'nt-du-2', kind: 'reaction', cardId: 'c13', actor: 'Lena Fischer', studio: 'whow',
      detail: 'tryThis', minsAgo: 60 * 14, read: false },
    { id: 'nt-du-3', kind: 'applied', cardId: 'c1', actor: 'Mira Keller', studio: 'whow',
      detail: '', minsAgo: 60 * 9, read: false },
    { id: 'nt-du-4', kind: 'asked', cardId: 'c14', actor: 'Tobias Lang', studio: 'whow',
      detail: '', minsAgo: 60 * 4, read: false },
    { id: 'nt-du-5', kind: 'reply', cardId: 'c10', actor: 'Jonas Weber', studio: 'whow',
      detail: '', minsAgo: 60 * 3, read: false },
  ],
  whow: [
    { id: 'nt-wh-1', kind: 'reaction', cardId: 'c5', actor: 'Doyoon Kim', studio: 'doubleu',
      detail: 'sameProblem', minsAgo: 60 * 22, read: false },
    { id: 'nt-wh-2', kind: 'reaction', cardId: 'c11', actor: 'Minji Yoon', studio: 'doubleu',
      detail: 'tryThis', minsAgo: 60 * 13, read: false },
    { id: 'nt-wh-3', kind: 'applied', cardId: 'c5', actor: 'Jiho Baek', studio: 'doubleu',
      detail: '', minsAgo: 60 * 8, read: false },
    { id: 'nt-wh-4', kind: 'asked', cardId: 'c10', actor: 'Soomin Jang', studio: 'doubleu',
      detail: '', minsAgo: 60 * 5, read: false },
    { id: 'nt-wh-5', kind: 'reply', cardId: 'c14', actor: 'Haeun Lee', studio: 'doubleu',
      detail: '', minsAgo: 60 * 2, read: false },
  ],
};

function seedNotifications() {
  const now = Date.now();
  const set = SEED_NOTIFICATIONS_BY_STUDIO[MY_STUDIO_KEY] || [];
  return set.map((n) => Object.assign({}, n, { at: now - n.minsAgo * 60 * 1000 }));
}

/* Anything read back out of storage was written by an older build, by a hand
   in devtools, or by this one — and only the last of those can be trusted. A
   row that has lost its actor, its studio or its timestamp cannot be turned
   into a sentence, so it is dropped here rather than rendered as "undefined at
   undefined, NaN days ago". */
function sanitizeStoredNotification(raw) {
  if (!raw || typeof raw !== 'object') return null;
  if (NOTIFICATION_KINDS.indexOf(raw.kind) < 0) return null;
  if (typeof raw.cardId !== 'string' || !raw.cardId) return null;
  if (typeof raw.actor !== 'string' || !raw.actor.trim()) return null;
  if (!STUDIOS[raw.studio]) return null;
  const at = Number(raw.at);
  if (!isFinite(at) || at <= 0) return null;
  return {
    id: typeof raw.id === 'string' && raw.id ? raw.id : localId('nt'),
    kind: raw.kind,
    cardId: raw.cardId,
    actor: raw.actor.trim(),
    studio: raw.studio,
    detail: typeof raw.detail === 'string' ? raw.detail : '',
    at,
    read: !!raw.read,
  };
}

function loadNotifications() {
  try {
    const parsed = JSON.parse(localStorage.getItem(NOTIFICATIONS_STORAGE_KEY));
    if (Array.isArray(parsed)) return parsed.map(sanitizeStoredNotification).filter(Boolean);
  } catch (err) {
    console.error('[Loom feed] could not read notifications:', err);
  }
  return seedNotifications();
}

let notifications = loadNotifications();

function persistNotifications() {
  return safeSetItem(NOTIFICATIONS_STORAGE_KEY, JSON.stringify(notifications)).ok;
}

/* ---- one row, or nothing ----
   A notification is six things: who, which studio they are in, what they did,
   which piece of writing they did it to, when, and somewhere to go when it is
   clicked. Miss any one of them and there is no sentence to write, so this
   returns null and the row is never built. The alternative — rendering the
   parts that survived — is how "undefined left "" on your """ reaches a screen.

   The card doubles as the destination: no card, no row, which also handles a
   notification about something that has since been deleted. */
function notificationView(n) {
  if (!n || typeof n !== 'object') return null;
  if (NOTIFICATION_KINDS.indexOf(n.kind) < 0) return null;

  const actor = typeof n.actor === 'string' ? n.actor.trim() : '';
  if (!actor) return null;

  const studio = STUDIOS[n.studio];
  if (!studio || !isStudioEnabled(n.studio)) return null;

  const card = cardById(n.cardId);
  if (!card) return null;

  /* Two rules the panel's whole premise rests on, enforced here so no seed
     table, stored row or future write path can break them:
       - it is about your own work. The one exception is 'asked', where the
         point is a question pointed at your studio rather than a card you wrote.
       - it did not come from your own studio. Being told your colleague
         reacted to your colleague's card is noise, and phrasing it as "on your
         work" makes it wrong as well as noisy. */
  const relevant = n.kind === 'asked' ? askedToMe(card) : isMyCard(card);
  if (!relevant) return null;
  if (n.studio === MY_STUDIO_KEY) return null;

  const title = truncateForSummary(cardText(card).title || '', 46);
  if (!title) return null;

  const at = Number(n.at);
  const s = t().forYou.lines;
  let text = '';

  if (n.kind === 'reaction') {
    // Which of the three it was is the verb of the sentence. Without it there
    // is no sentence, only a name and a card.
    const kindLabel = t().reactions.kinds[n.detail];
    if (!kindLabel) return null;
    text = s.reaction(actor, studio.name, kindLabel, title);
  } else if (n.kind === 'reply') {
    // "replied to your question" on a question, "replied in the thread"
    // anywhere else — same event, and only one of those is true at a time.
    text = (isOpenQuestion(card) ? s.replyToQuestion : s.reply)(actor, studio.name, title);
  } else {
    text = s[n.kind](actor, studio.name, title);
  }
  if (!text) return null;

  return {
    id: n.id,
    read: !!n.read,
    studioKey: n.studio,
    studio,
    cardId: card.id,
    text,
    when: relativeFromStamp(at),
    at: isFinite(at) ? at : 0,
  };
}

// Newest first — this is a "what happened while I was away" list, not a log.
// Everything downstream reads these views, never the raw rows, so the count in
// the corner and the rows in the panel can never disagree about how many there
// are.
function renderableNotifications() {
  return notifications.map(notificationView).filter(Boolean).sort((a, b) => b.at - a.at);
}

function unreadNotifications() {
  return renderableNotifications().filter((v) => !v.read);
}

/* Adds one and announces it. `silent` skips the toast for anything generated
   during page setup, so opening the app does not fire three toasts at once for
   things that happened yesterday. */
function pushNotification(entry, opts) {
  const options = opts || {};
  // Same gate as storage: a row that cannot become a sentence is not worth
  // keeping, and refusing it here means the panel never has to cope with one.
  const full = sanitizeStoredNotification(Object.assign({ id: localId('nt'), at: Date.now(), read: false }, entry));
  if (!full) return null;
  notifications.push(full);
  if (!persistNotifications()) {
    notifications.pop();
    return null;
  }
  renderNotificationIndicator();
  if (!options.silent) showNotificationToast(full);
  return full;
}

function markNotificationRead(id) {
  const n = notifications.find((x) => x.id === id);
  if (!n || n.read) return;
  n.read = true;
  persistNotifications();
  renderNotificationIndicator();
}

function markAllNotificationsRead() {
  let changed = false;
  notifications.forEach((n) => { if (!n.read) { n.read = true; changed = true; } });
  if (changed) { persistNotifications(); renderNotificationIndicator(); }
}

/* ---- who gets told ----
   Only ever the author, and never yourself. Reacting to your own card is a
   perfectly reasonable thing to do (a correction, a note to the next reader)
   and it should not ping you about it. */
function cardById(id) {
  return ALL_CARDS.find((c) => c.id === id);
}

function isMyCard(card) {
  return !!card && card.studio === MY_STUDIO_KEY;
}

function notifyAuthorOfReaction(cardId, reaction) {
  const card = cardById(cardId);
  // Your own card, somebody else's reaction. Reacting to your own work is a
  // reasonable thing to do — a correction, a note for the next reader — and it
  // should not ping you about it.
  if (!isMyCard(card) || isMine(reaction)) return;
  pushNotification({ kind: 'reaction', cardId, actor: reaction.author, studio: reaction.studio, detail: reaction.kind });
}

/* A reply reaches whoever's reaction it answers. Three people it must never
   reach: yourself (you just typed it), the replier when they are the reaction's
   author too (they are talking to themselves), and anyone when the reaction is
   your own — you are already looking at the thread.

   Locally that means this almost never fires, because every action in this
   browser is yours. That is correct: inbound events are what the arrival
   simulation stands in for, and in a real service the server decides who gets
   told. A client that can notify itself about its own typing is a bug you
   only notice when a toast tells you what you just did. */
function notifyOfReply(reaction, reply) {
  if (isMine(reply)) return;
  if (isMine(reaction) || reply.author === reaction.author) return;
  pushNotification({ kind: 'reply', cardId: reaction.cardId, actor: reply.author, studio: reply.studio, detail: '' });
}

/* ---------- the indicator ----------
   Top-right, opposite the hamburger, on every screen. It carries a count so
   you know whether to look, and a dot per studio the news came from so you
   know roughly what it is before you open anything. The dots are the useful
   part: "something from Whow" is a different thought from "something from
   DoubleU", and it costs no reading to tell them apart. */
function renderNotificationIndicator() {
  const btn = document.getElementById('notifyBtn');
  if (!btn) return;

  const unread = unreadNotifications();
  const countEl = document.getElementById('notifyCount');
  const dotsEl = document.getElementById('notifyDots');

  countEl.textContent = unread.length ? String(unread.length) : '';
  btn.classList.toggle('has-unread', unread.length > 0);
  btn.setAttribute('aria-label', unread.length ? t().forYou.ariaUnread(unread.length) : t().forYou.aria);

  // One dot per studio with something waiting, in a stable order so the row
  // does not reshuffle every time something arrives.
  dotsEl.innerHTML = '';
  const studios = enabledStudioKeys().filter((k) => unread.some((n) => n.studioKey === k));
  studios.forEach((k) => {
    const dot = document.createElement('span');
    dot.className = 'notify-dot';
    dot.style.background = STUDIOS[k].color;
    dot.title = STUDIOS[k].name;
    dotsEl.appendChild(dot);
  });
}

/* The arrival preview. Expands sideways out of the indicator for a few seconds
   with one readable line, then folds back into it — so the thing you saw
   arrive is visibly the thing the count is now about. Deliberately not a
   separate corner toast, which would leave you hunting for what changed. */
let notifyToastTimer = null;
function showNotificationToast(n) {
  const toast = document.getElementById('notifyToast');
  if (!toast) return;

  // Nothing to preview if the event cannot be phrased — the count still moves,
  // which is the honest amount of noise to make about it.
  const view = notificationView(n);
  if (!view) return;

  const studio = view.studio;
  toast.style.setProperty('--notify-studio', studio.color);
  document.getElementById('notifyToastDot').style.background = studio.color;
  document.getElementById('notifyToastText').textContent = view.text;

  clearTimeout(notifyToastTimer);
  toast.classList.add('is-open');
  // 4.5s: long enough to read a sentence in any of the four languages without
  // sitting on the screen long enough to become furniture.
  notifyToastTimer = setTimeout(() => toast.classList.remove('is-open'), 4500);

  const btn = document.getElementById('notifyBtn');
  btn.classList.remove('is-arriving');
  void btn.offsetWidth; // restart the flash if two land close together
  btn.classList.add('is-arriving');
  setTimeout(() => btn.classList.remove('is-arriving'), 900);
}

/* ---------- the panel ---------- */
function isForYouOpen() {
  return document.getElementById('forYouPanel').classList.contains('is-open');
}

function openForYou() {
  const panel = document.getElementById('forYouPanel');
  if (panel.classList.contains('is-open')) return;
  renderForYouList();
  panel.classList.add('is-open');
  document.getElementById('notifyBtn').setAttribute('aria-expanded', 'true');
  document.getElementById('notifyToast').classList.remove('is-open');
}

function closeForYou() {
  document.getElementById('forYouPanel').classList.remove('is-open');
  document.getElementById('notifyBtn').setAttribute('aria-expanded', 'false');
}

function renderForYouList() {
  const list = document.getElementById('forYouList');
  const items = renderableNotifications();
  list.innerHTML = '';

  document.getElementById('forYouTitle').textContent = t().forYou.title;
  const markAll = document.getElementById('forYouMarkAll');
  markAll.textContent = t().forYou.markAll;
  markAll.style.display = items.some((n) => !n.read) ? '' : 'none';

  // Empty means empty. This is the only place the panel is allowed to say
  // nothing has happened, so it can never say that above a list of things that
  // happened — which is what the "Since your last visit" branch used to do.
  if (!items.length) {
    const empty = document.createElement('div');
    empty.className = 'for-you-empty';
    empty.innerHTML = `<p class="for-you-empty-line"></p><p class="for-you-empty-sub"></p>`;
    empty.querySelector('.for-you-empty-line').textContent = t().forYou.emptyTitle;
    empty.querySelector('.for-you-empty-sub').textContent = t().forYou.emptyBody;
    list.appendChild(empty);
    return;
  }

  const sectionLabel = (text) => {
    const label = document.createElement('div');
    label.className = 'for-you-section-label';
    label.textContent = text;
    list.appendChild(label);
  };

  /* What happened while you were away, above everything else — but only when
     there is something to put under the heading. A heading with nothing under
     it is a claim, and it was contradicting the rows below it. */
  // Split the one list rather than building a second one: two independent
  // queries would be two sets of objects, and "is this row in the other list"
  // would silently always be false.
  /* Three bands, and the middle one is the only one that gets to claim you
     were away for it:
       arrived — at or after this session began. It landed in front of you (a
                 reaction to something you just shared, see the arrival
                 simulation), so filing it under "while you were away" is a
                 plain falsehood. It needs no heading: it is the newest thing
                 in a newest-first list, and the toast already announced it.
       since   — after your last visit but before this session started. The one
                 band the heading is true of.
       rest    — everything older. */
  const arrived = items.filter((n) => sessionStartedAt && n.at >= sessionStartedAt);
  const since = lastVisitAt
    ? items.filter((n) => n.at > lastVisitAt && arrived.indexOf(n) < 0)
    : [];
  const rest = items.filter((n) => arrived.indexOf(n) < 0 && since.indexOf(n) < 0);

  arrived.forEach((n) => list.appendChild(forYouItemEl(n)));

  if (since.length) {
    sectionLabel(t().sinceLastVisit.title);
    since.forEach((n) => list.appendChild(forYouItemEl(n)));
    if (rest.length) sectionLabel(t().forYou.earlier);
  }

  rest.forEach((n) => list.appendChild(forYouItemEl(n)));
}

// Takes a view, never a raw notification: everything it needs has already been
// proved to exist by notificationView.
function forYouItemEl(view) {
  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'for-you-item' + (view.read ? '' : ' is-unread');
  row.style.setProperty('--item-studio', view.studio.color);

  row.innerHTML = `
    <span class="for-you-mark"></span>
    <span class="for-you-dot"></span>
    <span class="for-you-body">
      <span class="for-you-text"><span class="for-you-sentence"></span><span class="for-you-time"></span></span>
    </span>
  `;
  row.querySelector('.for-you-dot').style.background = view.studio.color;
  row.querySelector('.for-you-sentence').textContent = view.text;
  row.querySelector('.for-you-time').textContent = ' · ' + view.when;

  row.addEventListener('click', () => {
    markNotificationRead(view.id);
    closeForYou();
    openCardById(view.cardId);
  });

  return row;
}

// Opening the thing a notification is about, from wherever you happen to be.
function openCardById(cardId) {
  const index = ALL_CARDS.findIndex((c) => c.id === cardId);
  if (index < 0) { showToast(t().forYou.gone); return; }

  const go = () => {
    // Any element carrying this card will do — openCard reads the index off it
    // and every surface tags its cards with both.
    const el = document.querySelector(`[data-card-id="${cardId}"]`);
    if (el) { openCard(el); return; }
    // Not currently rendered (filtered out, or on a floor that has not been
    // built) — hand openCard a detached stand-in carrying the same index.
    const stub = document.createElement('div');
    stub.dataset.index = String(index);
    stub.dataset.cardId = cardId;
    openCard(stub);
  };

  if (isShareMode) { exitShareMode(); setTimeout(go, CONFIG.MODE_SWAP_MS + 60); return; }
  if (isDesignersMode) { exitDesignersMode(); setTimeout(go, CONFIG.MODE_SWAP_MS + 60); return; }
  if (isCardExpanded) { closeCard(); setTimeout(go, CONFIG.MODE_SWAP_MS + 60); return; }
  go();
}

function initForYou() {
  document.getElementById('notifyBtn').addEventListener('click', () => {
    if (isForYouOpen()) closeForYou();
    else openForYou();
  });
  document.getElementById('forYouCloseBtn').addEventListener('click', closeForYou);
  document.getElementById('forYouMarkAll').addEventListener('click', () => {
    markAllNotificationsRead();
    renderForYouList();
  });

  // The toast is the notification: clicking it opens the panel it came from.
  document.getElementById('notifyToast').addEventListener('click', openForYou);

  document.addEventListener('click', (e) => {
    if (!isForYouOpen()) return;
    if (e.target.closest('#forYouPanel') || e.target.closest('#notifyBtn')) return;
    closeForYou();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isForYouOpen()) closeForYou();
  });

  renderNotificationIndicator();
}

/* "Edited 4 minutes ago", from the absolute stamp written at save time. Absent
   entirely on a card nobody has changed — an "edited: never" line is noise. */
function renderEditedStamp(el, data) {
  if (!el) return;
  if (!data.editedAt) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.textContent = t().editedAt(relativeFromStamp(data.editedAt));
}

// Minutes/hours/days since an absolute timestamp, in the reader's language.
// Reuses formatRelativeTime so an edit, a reaction and a card's age are all
// phrased the same way.
function relativeFromStamp(stamp) {
  // A missing or unreadable stamp is the one case where being vague is the
  // honest answer. Arithmetic on it produces NaN, and "NaN days ago" tells the
  // reader nothing except that something broke.
  const ms = Number(stamp);
  if (!isFinite(ms) || ms <= 0) return t().recently;
  const secs = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (secs < 60) return t().justNowInline;
  const mins = Math.round(secs / 60);
  if (mins < 60) return formatRelativeTime(currentLang, mins, 'minute');
  const hours = Math.round(mins / 60);
  if (hours < 24) return formatRelativeTime(currentLang, hours, 'hour');
  return formatRelativeTime(currentLang, Math.round(hours / 24), 'day');
}

/* How many replies would go with a question if it were deleted — the opening
   post is the question itself, so it does not count as an answer. */
function answerCountOf(data) {
  if (!isOpenQuestion(data)) return 0;
  // getConversationMessages, not data.conversation: replies posted in this
  // session live in sessionExtraMessages until there is a backend, and a
  // warning that ignores the three answers you can see on screen is worse
  // than no warning.
  return Math.max(0, getConversationMessages(data).length - 1);
}

/* ---------- what has come back, on your own cards ----------
   Only on your own: on somebody else's this would be a scoreboard of their
   work, which is exactly what this app does not do. On yours it is the reason
   to open the app again — "did anything happen to the thing I wrote". */
function cardStatusLine(card) {
  const s = t().cardStatus;
  const reactions = reactionsOn(card.id);
  const appliedNames = visibleAppliedBy(card).map((k) => STUDIOS[k].name);
  return { reactions: s.reactions(reactions.length), applied: s.applied(appliedNames), any: reactions.length > 0 || appliedNames.length > 0 };
}

function renderCardStatus(el, card) {
  if (!el) return;
  if (!isMyCard(card)) { el.style.display = 'none'; return; }
  const line = cardStatusLine(card);
  el.style.display = '';
  el.innerHTML = '';

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = t().cardStatus.label;
  el.appendChild(label);

  [line.reactions, line.applied].forEach((text) => {
    const row = document.createElement('div');
    row.className = 'card-status-row';
    row.innerHTML = '<span class="card-status-mark"></span>';
    const span = document.createElement('span');
    span.textContent = text;
    row.appendChild(span);
    el.appendChild(row);
  });
}

/* A small mark on your own cards in the feed, so "something came back" is
   visible without opening anything. A dot per studio that reacted or applied
   — no number, because a number on a wall of cards is a ranking. */
function ownCardStatusHTML(card) {
  if (!isMyCard(card)) return '';
  const studios = new Set();
  reactionsOn(card.id).forEach((r) => studios.add(r.studio));
  visibleAppliedBy(card).forEach((k) => studios.add(k));
  studios.delete(MY_STUDIO_KEY);
  if (!studios.size) return '';
  const dots = [...studios].map((k) =>
    `<span class="card-dot" style="background:${STUDIOS[k].color}" title="${STUDIOS[k].name}"></span>`).join('');
  return `<span class="card-came-back" title="${escapeHtml(t().cardStatus.label)}">${dots}</span>`;
}

/* ======================================================================
   Arrival simulation
   ----------------------------------------------------------------------
   TODO(backend): DELETE THIS WHOLE SECTION when there is a server.

   Everything below fakes the other side of the conversation. With one browser
   and no backend, sharing something produces silence forever, which makes the
   loop impossible to see or to demo — and the loop is the point of the
   feature. So a short while after you share, one of the other studios reacts,
   the way one plausibly would.

   In a real service this is a server event: the write path records the
   reaction, the server emits a notification to the author's session, and the
   client's job is only to render what arrives. Nothing here should survive
   that change — the only piece worth keeping is pushNotification, which is
   already shaped like the event a socket would deliver.
   ====================================================================== */
const DEMO_REPLY_DELAY_MS = 24000; // ~25s: long enough to have moved on, short enough to still be watching

const DEMO_REACTORS = [
  { author: 'Bengt Larsson', studio: 'whow', kind: 'sameProblem',
    note: 'We ran into the same thing last quarter — reading this saved us a week of guessing.' },
  { author: 'Mira Keller', studio: 'whow', kind: 'tryThis',
    note: 'Taking this into our next sprint. Will tell you how it lands.' },
  { author: 'Jonas Weber', studio: 'whow', kind: 'question',
    note: 'How long did you leave it running before you trusted the numbers?' },
];

let demoReactorIndex = 0;
const demoTimers = [];

function scheduleDemoReaction(cardId) {
  demoTimers.push(setTimeout(() => deliverDemoReaction(cardId), DEMO_REPLY_DELAY_MS));
}

/* The hidden trigger, for demoing without waiting: Shift+D lands the next
   arrival immediately against the most recent thing you shared. */
function initDemoTrigger() {
  document.addEventListener('keydown', (e) => {
    if (!e.shiftKey || e.key !== 'D') return;
    if (e.target.matches('input, textarea')) return; // typing a capital D is not a command
    const target = sharedCards[0] || ALL_CARDS.find(isMyCard);
    if (!target) return;
    e.preventDefault();
    deliverDemoReaction(target.id);
  });
}

/* One studio reacting, the way one plausibly would. scheduleDemoReaction is
   this on a timer; the trigger above is this immediately. */
function deliverDemoReaction(cardId) {
  if (!cardById(cardId)) return; // deleted while we waited

  const who = DEMO_REACTORS[demoReactorIndex % DEMO_REACTORS.length];
  demoReactorIndex += 1;

  const entry = {
    id: localId('rx'), cardId, kind: who.kind, author: who.author, studio: who.studio,
    note: who.note, at: Date.now(), emoji: {}, replies: [],
  };
  reactionState.reactions.push(entry);
  if (!persistReactions()) { reactionState.reactions.pop(); return; }

  pushNotification({ kind: 'reaction', cardId, actor: entry.author, studio: entry.studio, detail: entry.kind });

  // If the reader happens to be looking at that very card, show it landing
  // rather than making them close and reopen.
  if (isCardExpanded && currentOpenIndex !== null) {
    const open = ALL_CARDS[currentOpenIndex];
    if (open && open.id === cardId) renderReactionArea(cardId);
  }
  renderDiscover();
  renderBrowse();
}

/* ======================================================================
   Now — the Update strip and whose turn it is
   ----------------------------------------------------------------------
   The banner stays exactly what it was: one piece of finished knowledge, big
   and clean. Under it, a thin line of what everybody is *currently* doing.

   The two together are the point of calling this floor Now. A banner alone
   says "here is something somebody finished", which is admirable and slightly
   intimidating. A line of half-finished sentences underneath says the place is
   inhabited, and that posting one of your own is normal rather than a
   performance.

   The prompt names whoever posted last on purpose. "Whow just posted, what is
   DoubleU up to?" is a specific person having said something specific; "Share
   an update!" is a poster on a wall. The moment right after reading somebody
   else's is the moment you might write one.
   ====================================================================== */
const UPDATE_STRIP_MAX = 8;

function updateCards() {
  return ALL_CARDS
    .filter(isUpdate)
    .sort((a, b) => daysAgoOf(a) - daysAgoOf(b))
    .slice(0, UPDATE_STRIP_MAX);
}

function renderNowStrip() {
  const strip = document.getElementById('nowStripRow');
  if (!strip) return;
  const items = updateCards();

  strip.innerHTML = '';
  items.forEach((card) => {
    const studio = STUDIOS[card.studio];
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'now-item';
    el.dataset.cardId = card.id;
    el.dataset.index = String(ALL_CARDS.indexOf(card));

    const line = cardText(card).summary || cardText(card).title || '';
    el.innerHTML = `
      <span class="card-dot" style="background:${studio.color}"></span>
      <span class="now-item-text"></span>
      <span class="now-item-time">${card.justNow ? t().justNowInline : formatRelativeTime(currentLang, card.timeValue, card.timeUnit)}</span>
    `;
    el.querySelector('.now-item-text').textContent = line;
    el.addEventListener('click', () => openCard(el));
    strip.appendChild(el);
  });

  const empty = document.getElementById('nowStripEmpty');
  empty.textContent = t().nowStrip.empty;
  empty.style.display = items.length ? 'none' : '';

  renderYourTurn(items);
}

/* Whose turn it is. Names the most recent poster who is not you — being told
   "you posted, what are you up to?" is the app talking to itself. */
function renderYourTurn(items) {
  const line = document.getElementById('yourTurnLine');
  const latestOther = items.find((c) => c.studio !== MY_STUDIO_KEY);
  line.textContent = latestOther
    ? t().nowStrip.yourTurnWith(STUDIOS[latestOther.studio].name)
    // a function, not a string: it names your studio, and STUDIOS does not
    // exist yet when TRANSLATIONS is evaluated
    : t().nowStrip.yourTurnFirst();
  document.getElementById('yourTurnCta').textContent = t().nowStrip.cta;
}

function initNowStrip() {
  // Straight into Share with Update already chosen, caret in the box. Asking
  // someone who has just decided to post a line to first pick a type out of
  // four, then find the field, is exactly the friction this type exists to
  // remove — so from here there is no type step at all.
  document.getElementById('yourTurnCta').addEventListener('click', () => {
    enterShareMode();
    setTimeout(() => {
      setComposeType('update');
      const note = document.getElementById('field_note');
      if (note) note.focus();
    }, CONFIG.MODE_SWAP_MS + 60);
  });
}

/* ======================================================================
   Exchange traces
   ----------------------------------------------------------------------
   One plain line per card saying what came of it. Not views, not likes, not a
   count of anything you could be top of — what somebody else *got* out of it,
   which is the only argument for posting that survives contact with a busy
   week.

   A card nothing has happened to gets no line at all. An explicit "0 replies"
   is a worse thing to publish than silence: it makes the empty state the
   loudest thing on the card, and it makes the author's next post feel like a
   gamble.
   ====================================================================== */
/* Returns { text, cardId } — the cardId is set only when the trace is about one
   named piece of writing, which is the case worth making clickable. "Whow
   picked this up" is a fact you cannot follow; "Picked up in 'A 3-day teaser…'
   by Whow" is a door, and the door is the point of saying it at all. */
function exchangeTraceInfo(card) {
  if (!card) return null;
  const s = t().trace;
  const plain = (text) => (text ? { text, cardId: '' } : null);

  // ---- questions: the conversation is the whole story ----
  if (isOpenQuestion(card)) {
    const answers = answerCountOf(card);
    if (card.status === 'resolved' && answers) return plain(s.resolvedWith(answers));
    if (askedToMe(card)) return plain(s.needsView(STUDIOS[MY_STUDIO_KEY].name));
    if (answers) {
      // whichever studio has answered most — a name reads better than a total
      const counts = {};
      getConversationMessages(card).slice(1).forEach((m) => {
        if (m.studio) counts[m.studio] = (counts[m.studio] || 0) + 1;
      });
      const top = Object.keys(counts).filter(isStudioEnabled)
        .sort((a, b) => counts[b] - counts[a])[0];
      if (top) return plain(s.answeredBy(STUDIOS[top].name, counts[top]));
    }
    return null;
  }

  // ---- knowledge: where it went, in order of how much it says ----
  const applied = visibleAppliedBy(card).filter((k) => k !== MY_STUDIO_KEY);
  const derived = ALL_CARDS.filter((c) => c.derivedFrom === card.id);
  const reactions = reactionsOn(card.id).filter((r) => r.studio !== card.studio);
  const testing = reactions.find((r) => r.kind === 'tryThis');
  const same = reactions.find((r) => r.kind === 'sameProblem');

  // One piece of work built on this one gets named and linked; several is a
  // count, because five titles in a caption line is not a caption line.
  if (derived.length === 1) {
    const child = derived[0];
    const childStudio = STUDIOS[child.studio];
    return {
      text: s.pickedUpIn(truncateForSummary(cardText(child).title || '', 40), childStudio ? childStudio.name : ''),
      cardId: child.id,
    };
  }
  if (derived.length > 1) return plain(s.usedIn(derived.length));
  if (applied.length > 1) return plain(s.usedIn(applied.length));
  if (applied.length === 1) return plain(s.pickedUpBy(STUDIOS[applied[0]].name));
  if (testing) return plain(s.testing(STUDIOS[testing.studio].name));
  if (same) return plain(s.sameProblem(STUDIOS[same.studio].name));
  return null;
}

// Kept for anything that only wants the sentence.
function exchangeTrace(card) {
  const info = exchangeTraceInfo(card);
  return info ? info.text : '';
}

/* A linked trace is a button, not a div, and it carries the destination on a
   data attribute — every surface that renders cards already has a delegated
   click handler on the card itself, so the trace stops propagation there (see
   initExchangeTraceLinks) rather than each surface wiring its own. */
function exchangeTraceHTML(card) {
  const info = exchangeTraceInfo(card);
  if (!info) return '';
  if (!info.cardId) return `<div class="exchange-trace">${escapeHtml(info.text)}</div>`;
  return `<button type="button" class="exchange-trace is-linked" data-trace-to="${escapeHtml(info.cardId)}">` +
    `${escapeHtml(info.text)}<span class="exchange-trace-arrow">→</span></button>`;
}

/* One listener for every surface. Capture phase, because the card underneath
   opens on click and the trace is a different destination — without stopping
   it here the trace would open the card it is printed on. */
function initExchangeTraceLinks() {
  document.addEventListener('click', (e) => {
    const trace = e.target.closest('.exchange-trace.is-linked');
    if (!trace) return;
    e.preventDefault();
    e.stopPropagation();
    openCardById(trace.dataset.traceTo);
  }, true);
}

/* ======================================================================
   Questions that want your studio
   ====================================================================== */
function questionsNeedingMe() {
  return ALL_CARDS.filter((c) => isOpenQuestion(c) && c.status !== 'resolved' && askedToMe(c));
}

/* ---- the one dock line ----
   There were two: "Nothing is waiting on you right now" and "2 questions
   waiting on an answer", side by side. Both true — one is about you, one is
   about the list — and together they read as the app contradicting itself.
   Whichever is the more useful thing to say goes in the single slot, and
   "something is waiting on you" always wins that. */
function renderQuestionsDockLine(waitingCount) {
  const el = document.getElementById('questionsCount');
  if (!el) return;
  const mine = questionsNeedingMe().length;
  el.textContent = mine ? t().needsYou.count(mine) : t().questionsCount(waitingCount);
  el.classList.toggle('is-wanted', mine > 0);
}

/* ---- the sentence at the top of the floor ----
   Addressed to the studio reading it, and specific about why they are being
   shown a list at all. "Questions studios are figuring out right now" is a
   caption on a noticeboard; this says whether any of it is theirs. */
function renderQuestionsPersonal(waitingCount) {
  const el = document.getElementById('questionsPersonal');
  if (!el) return;
  const s = t().questionsPersonal;
  const mine = questionsNeedingMe();

  if (mine.length) {
    // Name the studio doing the asking when there is only one of them; with
    // several, naming one of them would be wrong about the others.
    const askers = Array.from(new Set(mine.map((c) => c.studio)));
    el.textContent = askers.length === 1
      ? s.asked(STUDIOS[askers[0]] ? STUDIOS[askers[0]].name : '', mine.length)
      : s.askedMixed(askers.length);
    return;
  }
  el.textContent = waitingCount ? s.canHelp(waitingCount) : s.none;
}

/* Why this particular card might be yours to answer. "Asked to DoubleU" is
   already its own badge; this is the softer version — a conversation with
   people in it is a different invitation from an unanswered question. */
function questionActivityHint(data) {
  const messages = getConversationMessages(data).slice(1);
  if (!messages.length) return data.status === 'resolved' ? '' : t().questionHint.noAnswers;
