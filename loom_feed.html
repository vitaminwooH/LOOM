    <div class="question-card-footer">
      <button type="button" class="question-answer-btn" data-action="answer">
        ${t().answerButton}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  `;
  card.addEventListener('click', () => openCard(card));
  return card;
}

function renderQuestions() {
  const grid = document.getElementById('questionsGrid');
  grid.innerHTML = '';

  const indices = questionIndices();
  indices.forEach((index) => grid.appendChild(buildQuestionCard(ALL_CARDS[index], index)));

  /* One or two questions is not a half-empty page, it is a short list — and
     it should look composed rather than unfinished. The class narrows the
     room the grid stands in (see .questions-grid.is-sparse); at three the
     floor is full enough to use its whole width. */
  grid.classList.toggle('is-sparse', indices.length > 0 && indices.length < 3);

  // "waiting" means nothing has come back — not merely "not closed"
  const waitingCount = indices.filter((i) => questionState(ALL_CARDS[i]) === 'open').length;
  renderQuestionsDockLine(waitingCount);
  renderQuestionsPersonal(waitingCount);
  document.getElementById('questionsEmpty').style.display = indices.length > 0 ? 'none' : 'block';
  grid.style.display = indices.length > 0 ? '' : 'none';

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.querySelectorAll('#questionsGrid .question-card.is-pre-reveal').forEach((el, i) => {
        setTimeout(() => el.classList.remove('is-pre-reveal'), Math.min(i, 14) * 35);
      });
    });
  });
}

/* ======================================================================
   5c. Designers — the roster surface: one studio on screen at a time, the
   arrows to move between them, and each studio editing its own list.

   Read the DESIGNERS comment in section 2a before changing anything here:
   there is no ranking in this screen and there must not be one. Everyone
   gets the same card at the same size in the authored order, a card says
   only photo / name / job title, and the two studios never share a screen.
   ====================================================================== */
const DESIGNER_PENCIL_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14.5 6.5l3 3"/></svg>`;
const DESIGNER_PLUS_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`;
// four-way move arrows — the hint on a draggable photo
const FOCAL_MOVE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 3v18M3 12h18"/><path d="M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5"/>
  <path d="M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg>`;

function designerInitials(name) {
  return (name || '')
    .split(/\s+/)
    .filter(Boolean)
    .slice(0, 2)
    .map((part) => part[0].toUpperCase())
    .join('') || '·';
}

// A studio's own typed job title wins over the seeded, translatable one —
// there's no machine translation for what someone wrote (same rule as card
// copy, see cardText).
function designerRole(person) {
  if (person.role) return person.role;
  const roles = t().designers.roles;
  return roles[person.roleKey] || person.roleKey || '';
}

function rosterStudioKeys() {
  const keys = Object.keys(STUDIOS).filter(isStudioEnabled);
  // Your own studio always opens first — you came in through its door.
  return keys.slice().sort((a, b) => (a === MY_STUDIO_KEY ? -1 : b === MY_STUDIO_KEY ? 1 : 0));
}

function designersOf(studioKey) {
  return designerRoster.filter((d) => d.studio === studioKey);
}

// The newest thing this person put into the network, for the back of their
// card. `name` is the join key between the roster and a card's author (see the
// DESIGNERS note) — there is no id on either side to match on. `author` is the
// knowledge's owner (shared_by), so a card someone else typed in for this
// person is still theirs here.
function mostRecentCardBy(name) {
  if (!name) return null;
  return ALL_CARDS
    .filter((c) => c.author === name)
    .sort((a, b) => daysAgoOf(a) - daysAgoOf(b))[0] || null;
}

let rosterStudioIndex = 0;
let rosterEditMode = false;

function currentRosterStudio() {
  const keys = rosterStudioKeys();
  return keys[Math.min(rosterStudioIndex, keys.length - 1)];
}

/* ---------- focal point ----------
   Every portrait here is a `background-size: cover` fill of a tall 1:1.32 box,
   so whatever doesn't fit gets cropped, and the crop is centred by default.
   That is wrong roughly as often as it is right — a face in the upper third of
   a photo, a subject off to one side. Rather than a crop dialog, the photo is
   dragged inside the frame it will actually appear in, and the resulting
   {x, y} percentage pair rides along with it onto the card. */
const DEFAULT_FOCAL = { x: 50, y: 50 };

function normalizeFocal(pos) {
  if (!pos || typeof pos.x !== 'number' || typeof pos.y !== 'number') return Object.assign({}, DEFAULT_FOCAL);
  return { x: Math.max(0, Math.min(100, pos.x)), y: Math.max(0, Math.min(100, pos.y)) };
}

function focalPointCss(pos) {
  const p = normalizeFocal(pos);
  return p.x + '% ' + p.y + '%';
}

/* Turns an element into a drag surface for a focal point. Pointer Events (not
   mouse events) so a trackpad, a mouse and a touch screen all take the same
   path, with capture so the drag survives the pointer leaving the frame —
   which it will, constantly, on a box this size.

   The mapping is 1:1 with the frame, not with the image: dragging all the way
   across sweeps the full 0–100% range. The true overflow depends on the photo's
   aspect ratio, which would have to be measured per image for a "physically
   correct" ratio — and the correct-feeling result is the one where a small
   nudge is a small nudge regardless of what was uploaded. */
function makeFocalDraggable(el, getPos, onChange) {
  if (!el || el.dataset.focalBound === '1') return;
  el.dataset.focalBound = '1';

  let dragging = false;
  let moved = false;
  let startX = 0, startY = 0, startPos = null, rect = null;

  el.addEventListener('pointerdown', (e) => {
    if (!el.classList.contains('is-focal-draggable')) return;
    if (e.button !== undefined && e.button !== 0) return;
    dragging = true;
    moved = false;
    startX = e.clientX;
    startY = e.clientY;
    startPos = normalizeFocal(getPos());
    rect = el.getBoundingClientRect();
    el.classList.add('is-dragging-focal');
    el.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  el.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    // Dragging the picture right reveals more of its left edge, and
    // background-position counts from the left — so the percentage falls as the
    // pointer rises. Inverting this gives a control that fights the hand.
    const dx = ((e.clientX - startX) / Math.max(1, rect.width)) * 100;
    const dy = ((e.clientY - startY) / Math.max(1, rect.height)) * 100;
    if (Math.abs(e.clientX - startX) > 3 || Math.abs(e.clientY - startY) > 3) moved = true;
    onChange(normalizeFocal({ x: startPos.x - dx, y: startPos.y - dy }));
  });

  const end = (e) => {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('is-dragging-focal');
    if (e && e.pointerId !== undefined && el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
    // A drag ends with a click on the same element. This one is also a button
    // that opens a file picker, so letting it through would pop the picker
    // every time you finish nudging the photo.
    if (moved) {
      el.dataset.focalJustDragged = '1';
      setTimeout(() => { delete el.dataset.focalJustDragged; }, 0);
    }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/* ---------- one card, two faces ----------
   Front: the portrait, with the name and role on a bar across the foot.
   Back: how to reach them, and the one control on this screen that navigates.

   The card is not itself a link. Clicking a face does nothing — you have to aim
   at "See what they shared". A whole-card click meant every attempt to read
   somebody's email address was a navigation away from the roster. */
function buildDesignerCard(person, studio) {
  const editable = rosterEditMode && canEditRoster(person.studio);

  const card = document.createElement('div');
  card.className = 'designer-card' + (selectedAuthor === person.name ? ' is-active' : '') + (editable ? ' is-editing' : '');
  card.dataset.designerId = person.id;
  if (editable) initDesignerDrag(card, person); // reorder by drag, edit mode only
  card.style.setProperty('--studio-color', studio.color);
  card.style.setProperty('--studio-tint', hexToRgba(studio.color, 0.12));

  const inner = document.createElement('div');
  inner.className = 'designer-card-inner';

  // ---- front ----
  const front = document.createElement('div');
  front.className = 'designer-face designer-face-front';

  const photo = document.createElement('div');
  photo.className = 'designer-photo' + (person.photo ? ' has-photo' : '');
  photo.textContent = designerInitials(person.name);
  if (person.photo) {
    photo.style.backgroundImage = `url("${person.photo}")`;
    photo.style.backgroundPosition = focalPointCss(person.photoPos);
  }

  const text = document.createElement('div');
  text.className = 'designer-card-text';
  const nameEl = document.createElement('div');
  nameEl.className = 'designer-name';
  nameEl.textContent = person.name;
  const roleEl = document.createElement('div');
  roleEl.className = 'designer-role';
  roleEl.textContent = designerRole(person);
  text.appendChild(nameEl);
  text.appendChild(roleEl);

  /* One more line, and the most useful one on the front: a job title says what
     somebody is called, this says what they are in the middle of. */
  if ((person.workingOn || '').trim()) {
    const now = document.createElement('div');
    now.className = 'designer-now';
    now.textContent = person.workingOn.trim();
    text.appendChild(now);
  }

  front.appendChild(photo);
  front.appendChild(text);

  // ---- back ----
  /* Reordered. This used to be a contact card: name, role, then five rows of
     links filling everything left. Contact details are the last thing you need
     and the first thing that was shown — you write to somebody *because* of
     what they are working on, so that goes on top and the addresses go under
     it, quietly, where they are still one glance away. */
  const back = document.createElement('div');
  back.className = 'designer-face designer-face-back';

  const backHead = document.createElement('div');
  backHead.className = 'designer-back-head';
  const backName = document.createElement('div');
  backName.className = 'designer-name';
  backName.textContent = person.name;
  const backRole = document.createElement('div');
  backRole.className = 'designer-role';
  backRole.textContent = designerRole(person);
  backHead.appendChild(backName);
  backHead.appendChild(backRole);
  back.appendChild(backHead);

  const strings = t().designers;
  const factBlock = (labelText, valueText) => {
    if (!valueText) return;
    const block = document.createElement('div');
    block.className = 'designer-fact';
    const label = document.createElement('div');
    label.className = 'designer-fact-label';
    label.textContent = labelText;
    const value = document.createElement('div');
    value.className = 'designer-fact-value';
    value.textContent = valueText;
    block.appendChild(label);
    block.appendChild(value);
    back.appendChild(block);
  };

  factBlock(strings.workingOnLabel, (person.workingOn || '').trim());
  factBlock(strings.canHelpLabel, (person.canHelp || '').trim());

  // What they last put into the network — the third reason to write to them,
  // and the only one the app can answer by itself.
  const recent = mostRecentCardBy(person.name);
  factBlock(strings.recentlySharedLabel,
    recent ? truncateForSummary(cardText(recent).title || '', 64) : strings.noRecentlyShared);

  const entries = designerLinkEntries(person);
  if (entries.length) {
    const contactLabel = document.createElement('div');
    contactLabel.className = 'designer-fact-label designer-contact-label';
    contactLabel.textContent = strings.contactLabel;
    back.appendChild(contactLabel);

    const list = document.createElement('div');
    list.className = 'designer-links';
    entries.forEach((entry) => {
      const a = document.createElement('a');
      a.className = 'designer-link';
      a.href = designerLinkHref(entry.kind, entry.value);
      if (entry.kind !== 'email') { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      a.innerHTML = `<span class="designer-link-icon">${entry.icon}</span><span class="designer-link-text"></span>`;
      // textContent: an address someone typed is not markup
      a.querySelector('.designer-link-text').textContent = designerLinkText(entry.kind, entry.value);
      a.title = entry.value;
      list.appendChild(a);
    });
    back.appendChild(list);
  }

  const seeBtn = document.createElement('button');
  seeBtn.type = 'button';
  seeBtn.className = 'designer-see-work';
  seeBtn.textContent = t().designers.seeTheirKnowledge;
  seeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    focusDesigner(person);
  });
  back.appendChild(seeBtn);

  inner.appendChild(front);
  inner.appendChild(back);
  card.appendChild(inner);

  if (editable) {
    const editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'designer-edit-btn';
    editBtn.innerHTML = DESIGNER_PENCIL_ICON;
    editBtn.setAttribute('aria-label', t().designers.editPerson(person.name));
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openDesignerEditor(person);
    });
    card.appendChild(editBtn);
    // In edit mode the card is an object you're arranging, not something to
    // read — the whole surface opens the editor and it never flips.
    card.addEventListener('click', () => openDesignerEditor(person));
  }

  /* Touch has no hover, so the flip needs a gesture of its own. Only on coarse
     pointers: a mouse already turns the card by arriving, and a click handler
     there would give it a card that turns back the moment the pointer leaves and
     needs pressing twice to stay.

     Taps that land on something with its own job — the "see their work" button, a
     contact link — are left alone. Turning the card away from under a finger that
     just pressed a link is the one thing worse than not turning it at all. */
  if (!editable && window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
    card.addEventListener('click', (e) => {
      if (e.target.closest('a, button')) return;
      const wasFlipped = card.classList.contains('is-flipped');
      // one at a time: two cards facing away at once reads as a rendering fault
      document.querySelectorAll('.designer-card.is-flipped').forEach((c) => c.classList.remove('is-flipped'));
      card.classList.toggle('is-flipped', !wasFlipped);
    });
  }

  return card;
}

/* ---------- sizing the row ----------
   A card's width follows from its height (aspect-ratio: 1/1.4), so the row has
   to be sized against whichever of the two constraints bites first: the height
   the surface can spare, or the width the panel can spare once every tile and
   the gaps between them are counted. How many tiles there are is only known at
   render time — turning edit mode on adds one — which is why this is script and
   not CSS. */
const ROSTER_CARD_RATIO = 1.4;   // height / width
const ROSTER_MIN_H = 260;
const ROSTER_MAX_VH = 0.65;      // "60–65% of the viewport" — the top of that

function sizeAllRosters(animate) {
  const viewport = document.getElementById('designersViewport');
  const head = viewport.querySelector('.designers-head');
  if (!viewport.clientHeight || !head) return;
  // The studio caption sits below the cards, so it is a second fixed block
  // competing for the same height — miss it and the row is sized as if it owned
  // everything under the heading, and the caption gets pushed off screen.
  const caption = viewport.querySelector('.studio-bar');
  const chromeH = head.offsetHeight + (caption ? caption.offsetHeight : 0);

  document.querySelectorAll('#designersStage .designers-panel').forEach((panel) => {
    const roster = panel.querySelector('.designer-roster');
    if (!roster) return;
    const tiles = roster.querySelectorAll('.designer-card, .designer-add-card').length;
    // A hidden surface (display:none) measures as zero — leave the last good
    // height in place and let enterDesignersMode re-run this once it's shown.
    if (!tiles || !panel.clientWidth) return;

    const panelStyle = getComputedStyle(panel);
    const availW = panel.clientWidth - parseFloat(panelStyle.paddingLeft) - parseFloat(panelStyle.paddingRight);
    const availH = viewport.clientHeight - chromeH
      - parseFloat(panelStyle.paddingTop) - parseFloat(panelStyle.paddingBottom);
    const gap = parseFloat(getComputedStyle(roster).columnGap) || 0;

    const widthBound = ((availW - gap * (tiles - 1)) / tiles) * ROSTER_CARD_RATIO;
    const height = Math.max(ROSTER_MIN_H, Math.min(availH, widthBound, window.innerHeight * ROSTER_MAX_VH));

    if (!animate) {
      roster.style.transition = 'none';
      roster.style.height = Math.floor(height) + 'px';
      void roster.offsetHeight; // land it before re-arming the transition
      roster.style.transition = '';
    } else {
      roster.style.height = Math.floor(height) + 'px';
    }
  });
}

function renderDesigners() {
  const strings = t().designers;
  const stage = document.getElementById('designersStage');
  const viewport = document.getElementById('designersViewport');
  const keys = rosterStudioKeys();
  if (rosterStudioIndex > keys.length - 1) rosterStudioIndex = 0;

  document.getElementById('designersHeading').textContent = strings.heading;
  document.getElementById('designersIntro').textContent = strings.intro;
  document.getElementById('designersCloseBtn').setAttribute('aria-label', strings.closeAria);
  document.getElementById('studioPrevBtn').setAttribute('aria-label', strings.prevStudio);
  document.getElementById('studioNextBtn').setAttribute('aria-label', strings.nextStudio);
  viewport.classList.toggle('is-single-studio', keys.length < 2);
  viewport.classList.toggle('is-editing', rosterEditMode);

  stage.innerHTML = '';
  keys.forEach((studioKey) => {
    const studio = STUDIOS[studioKey];
    const panel = document.createElement('div');
    panel.className = 'designers-panel';
    panel.dataset.studio = studioKey;

    const roster = document.createElement('div');
    roster.className = 'designer-roster';

    const people = designersOf(studioKey);
    people.forEach((person) => roster.appendChild(buildDesignerCard(person, studio)));

    if (!people.length && !(rosterEditMode && canEditRoster(studioKey))) {
      const empty = document.createElement('p');
      empty.className = 'designer-roster-empty';
      empty.textContent = strings.emptyRoster;
      roster.appendChild(empty);
    }

    // Nothing editable is rendered at all on someone else's studio — not
    // disabled, not hidden: absent.
    if (rosterEditMode && canEditRoster(studioKey)) {
      const add = document.createElement('button');
      add.type = 'button';
      add.className = 'designer-add-card';
      add.innerHTML = `${DESIGNER_PLUS_ICON}<span>${strings.addDesigner}</span>`;
      add.addEventListener('click', () => openDesignerEditor(null));
      roster.appendChild(add);
    }

    panel.appendChild(roster);
    stage.appendChild(panel);
  });

  applyRosterStudio(false);
  sizeAllRosters(false);
}

// Paints the caption for whichever studio is on screen and slides the stage to
// it. `animate` is false on a full re-render so rebuilding the roster (an edit,
// a language switch) doesn't replay the slide.
function applyRosterStudio(animate) {
  const studioKey = currentRosterStudio();
  const studio = STUDIOS[studioKey];
  const strings = t().designers;

  const stage = document.getElementById('designersStage');
  stage.style.transition = animate ? '' : 'none';
  // -100% per studio, not -100/n%: a percentage translate resolves against the
  // element's own border box, and the stage's box is one panel wide (the panels
  // are `flex: 0 0 100%` and overflow it) — so one panel *is* 100%.
  stage.style.transform = `translate3d(${-rosterStudioIndex * 100}%, 0, 0)`;
  if (!animate) {
    void stage.offsetWidth; // land the jump before re-arming the transition
    stage.style.transition = '';
  }

  buildStudioMark(document.getElementById('studioPagerMark'), studio);
  document.getElementById('studioPagerName').textContent = studio.name;
  document.getElementById('studioPagerYou').textContent = canEditRoster(studioKey) ? strings.yourStudio : '';
  const current = document.querySelector('.studio-pager-current');
  current.style.setProperty('--studio-tint', hexToRgba(studio.color, 0.1));
  current.style.setProperty('--studio-color', studio.color);

  // Edit only exists on your own studio. Someone else's roster is something you
  // read; it shouldn't even show a control you can't use.
  const toggle = document.getElementById('rosterEditToggle');
  const editable = canEditRoster(studioKey);
  toggle.style.display = editable ? '' : 'none';
  toggle.classList.toggle('is-on', editable && rosterEditMode);
  document.getElementById('rosterEditLabel').textContent = rosterEditMode ? strings.editDone : strings.edit;
}

/* The studio's logo, or a coloured dot when there isn't one on disk. Probed the
   same way card art is (see applyCardMedia): the dot is painted first and the
   image only replaces it once it has actually loaded, so a studio added without
   a logo file degrades instead of showing a broken tile. */
function buildStudioMark(el, studio) {
  if (!el) return;
  el.style.setProperty('--studio-color', studio.color);
  el.style.setProperty('--studio-tint', hexToRgba(studio.color, 0.12));
  el.style.backgroundImage = '';
  el.innerHTML = '<span class="studio-mark-dot"></span>';
  if (!studio.logo) return;
  const probe = new Image();
  probe.onload = () => {
    el.style.backgroundImage = `url("${studio.logo}")`;
    el.innerHTML = '';
  };
  probe.onerror = () => { /* no file for this studio — the dot stays */ };
  probe.src = studio.logo;
}

/* True while the stage is sliding. Set here rather than read off the element,
   because a transitionend on a transform that is also being re-triggered is not
   something to build a lock out of. */
let rosterSlideAnimating = false;
let rosterSlideTimer = null;
const ROSTER_SLIDE_MS = 720; // matches .designers-stage's transition duration

function goToRosterStudio(index) {
  const keys = rosterStudioKeys();
  // A single studio has nowhere to go; wrapping would slide back to itself.
  if (keys.length < 2) return;
  const next = ((index % keys.length) + keys.length) % keys.length;
  if (next === rosterStudioIndex) return;
  rosterStudioIndex = next;

  rosterSlideAnimating = true;
  clearTimeout(rosterSlideTimer);
  rosterSlideTimer = setTimeout(() => { rosterSlideAnimating = false; }, ROSTER_SLIDE_MS);

  // Leaving your own studio drops you out of edit mode — otherwise you'd arrive
  // somewhere you can't edit with the toggle still reading "on".
  if (rosterEditMode && !canEditRoster(currentRosterStudio())) {
    rosterEditMode = false;
    renderDesigners();
    applyRosterStudio(true);
    return;
  }
  applyRosterStudio(true);
}

function toggleRosterEditMode() {
  rosterEditMode = !rosterEditMode;
  renderDesigners();
  sizeAllRosters(true); // the Add tile changes the tile count, so the row resizes
}

/* ---- add / edit one person ---------------------------------------------
   Photos are downscaled to a card-sized thumbnail before anything stores
   them: a roster of full-resolution portraits would exhaust the origin's
   localStorage budget within a few people, and an oversized data: URL also
   gets silently refused as a CSS background value (the same trap the card
   art hit — see applyCardMedia). */
const DESIGNER_PHOTO_MAX_DIM = 480;
const DESIGNER_PHOTO_QUALITY = 0.8;

let editingDesignerId = null;   // null while adding
let editorPhotoUrl = null;
// The focal point of the photo being edited — see makeFocalDraggable.
let editorPhotoPos = Object.assign({}, DEFAULT_FOCAL);

// One row per link kind, created from DESIGNER_LINK_KINDS rather than written
// out in the markup — a new kind then needs no HTML and no save-path change.
function renderEditorLinkRows() {
  const grid = document.getElementById('editorLinksGrid');
  if (!grid || grid.childElementCount) return; // built once; values are set per open
  DESIGNER_LINK_KINDS.forEach((kind) => {
    const row = document.createElement('div');
    row.className = 'editor-link-row';
    row.innerHTML = `<span class="editor-link-row-icon">${kind.icon}</span>`;
    const input = document.createElement('input');
    input.type = kind.key === 'email' ? 'email' : 'url';
    input.id = 'editorLink_' + kind.key;
    input.autocomplete = 'off';
    row.appendChild(input);
    grid.appendChild(row);
  });
}

function readEditorLinks() {
  const out = {};
  DESIGNER_LINK_KINDS.forEach((kind) => {
    const el = document.getElementById('editorLink_' + kind.key);
    const value = el ? el.value.trim() : '';
    if (value) out[kind.key] = value; // blanks are dropped, not stored empty
  });
  return out;
}

function fillEditorLinks(person) {
  const links = (person && person.links) || {};
  DESIGNER_LINK_KINDS.forEach((kind) => {
    const el = document.getElementById('editorLink_' + kind.key);
    if (el) el.value = links[kind.key] || '';
  });
}

function openDesignerEditor(person) {
  const studioKey = currentRosterStudio();
  if (!canEditRoster(studioKey)) return; // belt and braces; the UI never offers it
  const strings = t().designers;

  editingDesignerId = person ? person.id : null;
  editorPhotoUrl = person ? (person.photo || null) : null;
  editorPhotoPos = normalizeFocal(person && person.photoPos);

  document.getElementById('designerEditorTitle').textContent = person ? strings.editTitle : strings.addTitle;
  document.getElementById('editorNameInput').value = person ? person.name : '';
  document.getElementById('editorRoleInput').value = person ? designerRole(person) : '';
  document.getElementById('editorWorkingOnInput').value = person ? (person.workingOn || '') : '';
  document.getElementById('editorCanHelpInput').value = person ? (person.canHelp || '') : '';
  document.getElementById('editorDeleteBtn').style.display = person ? '' : 'none';
  document.getElementById('editorDeleteConfirm').style.display = 'none';
  renderEditorLinkRows();
  fillEditorLinks(person);

  const zone = document.getElementById('editorPhotoZone');
  zone.style.setProperty('--studio-color', STUDIOS[studioKey].color);
  zone.style.setProperty('--studio-tint', hexToRgba(STUDIOS[studioKey].color, 0.12));

  refreshEditorPhoto();
  refreshEditorSaveState();
  document.getElementById('designerEditor').style.display = 'flex';
  document.getElementById('editorNameInput').focus();
}

function closeDesignerEditor() {
  document.getElementById('designerEditor').style.display = 'none';
  editingDesignerId = null;
  editorPhotoUrl = null;
  editorPhotoPos = Object.assign({}, DEFAULT_FOCAL);
}

function refreshEditorPhoto() {
  const zone = document.getElementById('editorPhotoZone');
  const fallback = document.getElementById('editorPhotoFallback');
  const removeBtn = document.getElementById('editorPhotoRemoveBtn');
  fallback.textContent = designerInitials(document.getElementById('editorNameInput').value);
  if (editorPhotoUrl) {
    zone.style.backgroundImage = `url("${editorPhotoUrl}")`;
    zone.style.backgroundPosition = focalPointCss(editorPhotoPos);
    zone.classList.add('has-photo');
    zone.classList.add('is-focal-draggable');
    removeBtn.style.display = '';
  } else {
    zone.style.backgroundImage = '';
    zone.style.backgroundPosition = '';
    zone.classList.remove('has-photo');
    zone.classList.remove('is-focal-draggable');
    removeBtn.style.display = 'none';
  }
  // the hint only makes sense once there is a photo under it
  const hint = document.getElementById('editorPhotoDragHint');
  if (hint) hint.style.display = editorPhotoUrl ? '' : 'none';
}

function refreshEditorSaveState() {
  const name = document.getElementById('editorNameInput').value.trim();
  const role = document.getElementById('editorRoleInput').value.trim();
  document.getElementById('editorSaveBtn').disabled = !name || !role;
}

function handleDesignerPhotoFile(file) {
  if (!file || !file.type || !file.type.startsWith('image/')) return;
  resizeImageToDataUrl(file, DESIGNER_PHOTO_MAX_DIM, DESIGNER_PHOTO_QUALITY)
    .then((dataUrl) => {
      editorPhotoUrl = dataUrl;
      editorPhotoPos = Object.assign({}, DEFAULT_FOCAL); // new photo, new crop
      refreshEditorPhoto();
    })
    .catch((err) => {
      console.error('[Loom feed] could not process the designer photo:', err);
      showToast(t().share.imageFailed);
    });
}

function saveDesignerFromEditor() {
  const name = document.getElementById('editorNameInput').value.trim();
  const role = document.getElementById('editorRoleInput').value.trim();
  if (!name || !role) return;
  const workingOn = document.getElementById('editorWorkingOnInput').value.trim();
  const canHelp = document.getElementById('editorCanHelpInput').value.trim();
  const studioKey = currentRosterStudio();
  if (!canEditRoster(studioKey)) return;

  let person;
  if (editingDesignerId) {
    person = designerRoster.find((d) => d.id === editingDesignerId);
    if (person) {
      person.name = name;
      // Typed over a seeded designer: the free-text role replaces the
      // translatable key outright, or the old label would come back on the
      // next language switch and quietly undo the edit.
      person.role = role;
      delete person.roleKey;
      person.workingOn = workingOn;
      person.canHelp = canHelp;
      person.photo = editorPhotoUrl;
      person.photoPos = editorPhotoUrl ? Object.assign({}, editorPhotoPos) : null;
      person.links = readEditorLinks();
    }
  } else {
    person = {
      id: 'designer-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7),
      studio: studioKey,
      name,
      role,
      workingOn,
      canHelp,
      photo: editorPhotoUrl,
      photoPos: editorPhotoUrl ? Object.assign({}, editorPhotoPos) : null,
      links: readEditorLinks(),
    };
    designerRoster.push(person);
  }

  closeDesignerEditor();
  renderDesigners();
  // DB first; persistDesigners() happens inside only as the failure fallback
  if (person) attemptRemoteRosterSave(person);
}

function deleteDesignerFromEditor() {
  if (!editingDesignerId) return;
  const person = designerRoster.find((d) => d.id === editingDesignerId);
  if (!person || !canEditRoster(person.studio)) return;
  // Someone removed from the roster keeps whatever they shared — the cards
  // are the studio's knowledge, not that person's entry in a directory.
  if (selectedAuthor === person.name) setAuthorFilter(null);
  designerRoster = designerRoster.filter((d) => d.id !== editingDesignerId);
  closeDesignerEditor();
  renderDesigners();
  // DB first (on_roster=false — the person row itself stays, cards reference
  // it); persistDesigners() happens inside only as the failure fallback
  attemptRemoteRosterRemove(person);
}

function refreshDesignerEditorText() {
  const strings = t().designers;
  document.getElementById('editorPhotoLabel').textContent = strings.photoLabel;
  document.getElementById('editorPhotoHint').textContent = strings.photoHint;
  document.getElementById('editorPhotoPickBtn').textContent = strings.photoPick;
  document.getElementById('editorPhotoRemoveBtn').textContent = strings.photoRemove;
  document.getElementById('editorNameLabel').textContent = strings.nameLabel;
  document.getElementById('editorNameInput').placeholder = strings.namePlaceholder;
  document.getElementById('editorRoleLabel').textContent = strings.roleLabel;
  document.getElementById('editorRoleInput').placeholder = strings.rolePlaceholder;
  document.getElementById('editorWorkingOnLabel').textContent = strings.workingOnLabel;
  document.getElementById('editorWorkingOnInput').placeholder = strings.workingOnPlaceholder;
  document.getElementById('editorCanHelpLabel').textContent = strings.canHelpLabel;
  document.getElementById('editorCanHelpInput').placeholder = strings.canHelpPlaceholder;
  const linksLabel = document.getElementById('editorLinksLabel');
  if (linksLabel) linksLabel.textContent = strings.linksLabel;
  renderEditorLinkRows();
  DESIGNER_LINK_KINDS.forEach((kind) => {
    const el = document.getElementById('editorLink_' + kind.key);
    if (el) el.placeholder = strings.linkPlaceholders[kind.key] || '';
  });
  const dragHint = document.getElementById('editorPhotoDragHint');
  if (dragHint) {
    dragHint.innerHTML = FOCAL_MOVE_ICON + '<span></span>';
    dragHint.querySelector('span').textContent = strings.photoDragHint;
  }
  document.getElementById('editorCancelBtn').textContent = strings.cancel;
  document.getElementById('editorSaveLabel').textContent = strings.save;
  document.getElementById('editorDeleteLabel').textContent = strings.deletePerson;
  document.getElementById('editorDeleteCancelBtn').textContent = strings.deleteCancel;
  document.getElementById('editorDeleteConfirmBtn').textContent = strings.deleteConfirmButton;
  document.getElementById('editorDeleteConfirmText').textContent = strings.deleteConfirmText;
}

/* ---- the per-person filter handed back to the feed ---- */

// Paints (or hides) both copies of the "showing one person's knowledge" chip
// — one on Browse, one on Questions, since either floor can be the one you
// land on and neither should look unfiltered while it isn't.
function renderAuthorFilterChip() {
  const person = selectedAuthor ? designerRoster.find((d) => d.name === selectedAuthor) : null;
  [['authorChipBrowse', 'authorChipBrowseAvatar', 'authorChipBrowseLabel'],
   ['authorChipQuestions', 'authorChipQuestionsAvatar', 'authorChipQuestionsLabel']].forEach(([chipId, avatarId, labelId]) => {
    const chip = document.getElementById(chipId);
    if (!chip) return;
    if (!selectedAuthor) { chip.style.display = 'none'; return; }
    chip.style.display = '';
    chip.style.setProperty('--studio-color', person ? STUDIOS[person.studio].color : 'rgba(255,255,255,0.2)');
    document.getElementById(avatarId).textContent = designerInitials(selectedAuthor);
    document.getElementById(labelId).textContent = t().designers.viewing(selectedAuthor);
    chip.title = t().designers.clearFilter;
  });
}

/* Clicking a keyword in a detail closes the detail and drops you onto floor 2
   filtered to that word — the same move picking a person in Designers makes
   (see focusDesigner). A list inside the detail would have been less work, but
   it would also have been a dead end: floor 2 is where reading several pieces
   next to each other already works. */
function openKeywordFilter(word) {
  const label = canonicalKeyword(word);
  if (!label) return;
  selectedKeyword = label;
  // A keyword and a person are two different questions; asking both at once
  // mostly returns nothing and reads as a bug.
  selectedAuthor = null;
  selectedStudio = 'all';
  selectedTypeFilter = 'all';
  searchQuery = '';
  const search = document.getElementById('searchInput');
  if (search) search.value = '';
  renderStudioChips();
  updateTypeFilterButtonUI();
  renderAuthorFilterChip();
  renderKeywordFilterChip();
  applyBrowseFilters();
  renderQuestions();
  if (isCardExpanded) closeCard();
  setTimeout(() => goToFloor(1), CONFIG.MODE_SWAP_MS + 40);
}

function clearKeywordFilter() {
  selectedKeyword = null;
  renderKeywordFilterChip();
  applyBrowseFilters();
  renderQuestions();
}

function renderKeywordFilterChip() {
  ['keywordChipBrowse', 'keywordChipQuestions'].forEach((chipId) => {
    const chip = document.getElementById(chipId);
    if (!chip) return;
    if (!selectedKeyword) { chip.style.display = 'none'; return; }
    chip.style.display = '';
    chip.querySelector('.keyword-filter-label').textContent = t().keywordFilter.showing(selectedKeyword);
    chip.title = t().keywordFilter.clear;
  });
}

function setAuthorFilter(name) {
  selectedAuthor = name;
  renderAuthorFilterChip();
  applyBrowseFilters();
  renderQuestions();
}

// Picking a person closes the roster and drops you onto Browse already
// filtered to their work — the whole point of the screen is "and here's what
// they've put in", so it shouldn't need a second click to get there.
function focusDesigner(person) {
  setAuthorFilter(person.name);
  exitDesignersMode(() => goToFloor(1));
}

function initDesigners() {
  renderDesigners();
  refreshDesignerEditorText();

  document.getElementById('designersCloseBtn').addEventListener('click', () => exitDesignersMode());
  document.getElementById('studioPrevBtn').addEventListener('click', () => goToRosterStudio(rosterStudioIndex - 1));
  document.getElementById('studioNextBtn').addEventListener('click', () => goToRosterStudio(rosterStudioIndex + 1));
  ['keywordChipBrowse', 'keywordChipQuestions'].forEach((id) => {
    const chip = document.getElementById(id);
    if (chip) chip.addEventListener('click', clearKeywordFilter);
  });
  document.getElementById('rosterEditToggle').addEventListener('click', toggleRosterEditMode);
  window.addEventListener('resize', () => sizeAllRosters(false));

  /* Wheel down = next studio, wheel up = previous. The rest of this app moves
     between screens on the wheel (see initFeedWheelSnap), so arriving here and
     finding the wheel dead reads as the page having stopped responding. The
     motion is goToRosterStudio's own — the same 0.72s ease the arrows use — and
     input during it is swallowed, so a fast trackpad flick still travels
     exactly one studio rather than stacking up.

     preventDefault stops the surface itself from scrolling, which is also what
     keeps a scrollbar from appearing mid-transition. */
  /* The same gesture with a finger, and the same three guards: not while the
     editor is open over it (the editor scrolls itself), not mid-slide, and only
     while this surface actually holds the screen. Vertical, matching the wheel it
     mirrors — the panels are arranged horizontally but the movement between them
     has always been "one notch further on", not "drag the row". */
  const rosterTouch = { x: 0, y: 0, tracking: false, decided: false, vertical: false };
  const viewport = document.getElementById('designersViewport');

  viewport.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { rosterTouch.tracking = false; return; }
    if (e.target.closest && e.target.closest('.designer-editor')) { rosterTouch.tracking = false; return; }
    rosterTouch.x = e.touches[0].clientX;
    rosterTouch.y = e.touches[0].clientY;
    rosterTouch.tracking = true;
    rosterTouch.decided = false;
    rosterTouch.vertical = false;
  }, { passive: true });

  viewport.addEventListener('touchmove', (e) => {
    if (!rosterTouch.tracking || !isDesignersMode || e.touches.length !== 1) return;
    const dy = e.touches[0].clientY - rosterTouch.y;
    const dx = e.touches[0].clientX - rosterTouch.x;
    if (!rosterTouch.decided) {
      if (Math.abs(dx) < SWIPE_AXIS_LOCK_PX && Math.abs(dy) < SWIPE_AXIS_LOCK_PX) return;
      rosterTouch.decided = true;
      rosterTouch.vertical = Math.abs(dy) > Math.abs(dx);
    }
    if (rosterTouch.vertical && e.cancelable) e.preventDefault();
  }, { passive: false });

  viewport.addEventListener('touchend', (e) => {
    if (!rosterTouch.tracking) return;
    rosterTouch.tracking = false;
    if (!isDesignersMode || !rosterTouch.decided || !rosterTouch.vertical) return;
    if (rosterSlideAnimating) return;
    const t = (e.changedTouches && e.changedTouches[0]) || null;
    if (!t) return;
    const dy = t.clientY - rosterTouch.y;
    if (Math.abs(dy) < SWIPE_MIN_PX) return;
    goToRosterStudio(rosterStudioIndex + (dy < 0 ? 1 : -1));
  }, { passive: true });

  viewport.addEventListener('touchcancel', () => { rosterTouch.tracking = false; }, { passive: true });

  viewport.addEventListener('wheel', (e) => {
    if (!isDesignersMode) return;
    if (e.target.closest && e.target.closest('.designer-editor')) return; // the editor scrolls itself
    if (e.deltaY === 0) return;
    e.preventDefault();
    if (rosterSlideAnimating) return;
    goToRosterStudio(rosterStudioIndex + (e.deltaY > 0 ? 1 : -1));
  }, { passive: false });

  ['authorChipBrowse', 'authorChipQuestions'].forEach((id) => {
    const chip = document.getElementById(id);
    if (chip) chip.addEventListener('click', () => setAuthorFilter(null));
  });

  // ---- editor wiring ----
  const zone = document.getElementById('editorPhotoZone');
  const fileInput = document.getElementById('editorPhotoInput');
  zone.addEventListener('click', () => {
    if (zone.dataset.focalJustDragged) return; // that click was the end of a drag
    fileInput.click();
  });
  zone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });
  // once a photo is in, the tile is also the crop control
  makeFocalDraggable(
    zone,
    () => editorPhotoPos,
    (pos) => {
      editorPhotoPos = pos;
      zone.style.backgroundPosition = focalPointCss(pos);
    }
  );
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('is-dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('is-dragover'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('is-dragover');
    handleDesignerPhotoFile(e.dataTransfer.files && e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    handleDesignerPhotoFile(fileInput.files && fileInput.files[0]);
    fileInput.value = ''; // so re-picking the same file still fires 'change'
  });
  document.getElementById('editorPhotoPickBtn').addEventListener('click', () => fileInput.click());
  document.getElementById('editorPhotoRemoveBtn').addEventListener('click', () => {
    editorPhotoUrl = null;
    editorPhotoPos = Object.assign({}, DEFAULT_FOCAL);
    refreshEditorPhoto();
  });

  document.getElementById('editorNameInput').addEventListener('input', () => {
    refreshEditorPhoto(); // the initials fallback tracks what's being typed
    refreshEditorSaveState();
  });
  document.getElementById('editorRoleInput').addEventListener('input', refreshEditorSaveState);

  document.getElementById('editorCancelBtn').addEventListener('click', closeDesignerEditor);
  document.getElementById('designerEditorScrim').addEventListener('click', closeDesignerEditor);
  document.getElementById('editorSaveBtn').addEventListener('click', saveDesignerFromEditor);

  document.getElementById('editorDeleteBtn').addEventListener('click', () => {
    const person = designerRoster.find((d) => d.id === editingDesignerId);
    document.getElementById('editorDeleteConfirmText').textContent = t().designers.deleteConfirmText;
    document.getElementById('editorDeleteConfirm').style.display = person ? '' : 'none';
  });
  document.getElementById('editorDeleteCancelBtn').addEventListener('click', () => {
    document.getElementById('editorDeleteConfirm').style.display = 'none';
  });
  document.getElementById('editorDeleteConfirmBtn').addEventListener('click', deleteDesignerFromEditor);

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (document.getElementById('designerEditor').style.display !== 'none') {
      e.stopPropagation(); // don't also close the roster behind it
      closeDesignerEditor();
    }
  }, true);
}

function initSearch() {
  const input = document.getElementById('searchInput');
  input.placeholder = t().searchPlaceholder;
  input.addEventListener('input', (e) => {
    searchQuery = e.target.value;
    applyBrowseFilters();
  });
}

/* ======================================================================
   6b. Browse poster row — a slow continuous drift to the left, draggable
   by pointer, paused on hover (and whenever a modal/share mode has focus).
   The track holds two identical copies of the card set back-to-back (see
   renderBrowse) so wrapping the scroll position by exactly one half-width
   is always visually seamless — an infinite flow with no reset jump and no
   bounce at the ends, at any scroll position, even mid-drag.
   ====================================================================== */
let browseX = 0;            // current translateX of the track, in px (moves negative)
let browseHalfWidth = 0;    // width of one copy of the card set
let browseHovering = false;
let browseDragging = false;
let browseDragStartClientX = 0;
let browseDragStartX = 0;
let browseDragMoved = false;
let browseLastTs = null;

function recomputeBrowseHalfWidth() {
  const track = document.getElementById('browseGrid');
  if (!track) return;
  browseHalfWidth = track.scrollWidth / 2;
}

function browseTick(ts) {
  requestAnimationFrame(browseTick);
  if (browseLastTs == null) browseLastTs = ts;
  const dt = ts - browseLastTs;
  browseLastTs = ts;

  if (!browseDragging && !browseHovering && !isCardExpanded && !isShareMode) {
    browseX -= (CONFIG.BROWSE_SCROLL_SPEED * dt) / 1000;
  }

  // Wrapping by exactly one half-width is a no-op visually (the two halves
  // are identical), so it's safe to do every frame, drag or no drag. Kept
  // in (-browseHalfWidth, 0] — negative because the track drifts leftward.
  if (browseHalfWidth > 0) {
    const n = ((browseX % browseHalfWidth) + browseHalfWidth) % browseHalfWidth;
    browseX = n - browseHalfWidth;
  }

  const track = document.getElementById('browseGrid');
  if (track) track.style.transform = `translateX(${browseX}px)`;
}

function initBrowseScroll() {
  const wrap = document.getElementById('browseTrackWrap');
  recomputeBrowseHalfWidth();

  wrap.addEventListener('mouseenter', () => { browseHovering = true; });
  wrap.addEventListener('mouseleave', () => { browseHovering = false; });

  // Deliberately no setPointerCapture here: capturing the pointer on `wrap`
  // also redirects the resulting synthetic `click` event's target to `wrap`
  // itself (not whatever card is underneath), which silently breaks
  // click-to-open for every card. Tracking the drag with plain window-level
  // move/up listeners avoids that entirely.
  const onPointerMove = (e) => {
    if (!browseDragging) return;
    const dx = e.clientX - browseDragStartClientX;
    if (Math.abs(dx) > 4) browseDragMoved = true;
    browseX = browseDragStartX + dx;
  };
  const onPointerUp = () => {
    if (!browseDragging) return;
    browseDragging = false;
    wrap.classList.remove('is-dragging');
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    window.removeEventListener('pointercancel', onPointerUp);
  };
  wrap.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    browseDragging = true;
    browseDragMoved = false;
    browseDragStartClientX = e.clientX;
    browseDragStartX = browseX;
    wrap.classList.add('is-dragging');
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
  });
  // A drag that actually moved the row shouldn't also open the card the
  // pointer happened to land on — swallow that one click in the capture
  // phase, before it ever reaches the card's own listener.
  wrap.addEventListener('click', (e) => {
    if (browseDragMoved) { e.stopPropagation(); e.preventDefault(); }
  }, true);

  window.addEventListener('resize', recomputeBrowseHalfWidth);

  requestAnimationFrame(browseTick);
}

/* ======================================================================
   6c. Floor-to-floor motion — the feed is three floors (0 Discover,
   1 Browse, 2 Questions), each exactly one viewport tall, and one wheel
   tick always travels exactly one floor.

   It's a transform on a stage, not scrollTop on a scroller, for two reasons
   this used to get wrong:
     - scrollTop clamps at 0 and at scrollHeight, so the tween's overshoot
       was silently erased at both ends of the page;
     - a floor taller than the viewport left native scrolling to cover the
       remainder, which is why 2 -> 3 used to need several wheel ticks before
       it would commit. Every floor is now pinned to --floor-h, and overflow
       inside a floor is that floor's own business (see .floor-scroll).

   Extra wheel input arriving mid-tween is swallowed, so overlapping gestures
   (a fast trackpad flick, several mouse-wheel clicks in a row) can't stack:
   the first tick commits to a destination and the tween finishes there.
   ====================================================================== */
/* The floor plan itself — FLOOR_COUNT and FLOOR_THREADS — is declared up beside
   MENU_ITEMS, which is the first thing to need it. */
let feedSnapAnimating = false;
let currentFloor = 0;
let feedStageOffset = 0; // px the stage is currently translated *up* by

// A real CSS cubic-bezier(x1,y1,x2,y2) timing function, evaluated in JS
// (Newton-Raphson on the x-curve, standard bezier-easing approach) so the
// stage transform — which has to be driven frame by frame, since each floor
// change is its own distance — rides the exact same curve a
// `transition-timing-function` would use. Letting the y control points go
// past 1 (see CONFIG.FEED_SNAP_EASE) is what gives the curve its
// overshoot-then-settle landing.
function makeCubicBezier(x1, y1, x2, y2) {
  const a = (p1, p2) => 1.0 - 3.0 * p2 + 3.0 * p1;
  const b = (p1, p2) => 3.0 * p2 - 6.0 * p1;
  const c = (p1) => 3.0 * p1;
  const calc = (t, p1, p2) => ((a(p1, p2) * t + b(p1, p2)) * t + c(p1)) * t;
  const slope = (t, p1, p2) => 3.0 * a(p1, p2) * t * t + 2.0 * b(p1, p2) * t + c(p1);
  function tForX(x) {
    let t = x;
    for (let i = 0; i < 8; i++) {
      const sl = slope(t, x1, x2);
      if (Math.abs(sl) < 1e-6) break;
      t -= (calc(t, x1, x2) - x) / sl;
    }
    return Math.max(0, Math.min(1, t));
  }
  // The *output* is deliberately not clamped — the whole point of y1/y2 > 1
  // is a value that briefly exceeds 1. Only the endpoints are pinned.
  return (x) => (x <= 0 ? 0 : x >= 1 ? 1 : calc(tForX(x), y1, y2));
}
const feedSnapEase = makeCubicBezier.apply(null, CONFIG.FEED_SNAP_EASE);

function floorHeight() {
  const feedMain = document.getElementById('feedMain');
  // A floor is exactly the viewport now (--floor-h), so the fallback for a
  // not-yet-laid-out #feedMain is the viewport, not the viewport minus a bar
  // that no longer exists.
  return (feedMain && feedMain.clientHeight) || Math.max(1, window.innerHeight);
}

/* ---- the nebula behind the floors -------------------------------------------
   The lobby's motif, brought inside and quietened: points of light with
   threads between the near ones. Drawn ONCE into an SVG at boot — no canvas,
   no animation loop, nothing running while you read — and moved only when
   the stage moves, at a fraction of its speed, which is what makes the
   floors feel like they are in front of something.

   Deterministic: positions come from a hash of the index, so the field is
   the same on every load. A layout that reshuffled itself each visit would
   be decoration; this is meant to read as a place.

   How loud any of it is lives in :root (--nebula-*); how much of it there is
   lives here. */
/* What is behind each floor, in one table.

   `paper` is that floor's ground colour; `nebula` is how much of the shared
   field it keeps (0 turns it off entirely). Threads is the reason this table
   exists: its own weave of words and threads is the floor's subject, and a
   second constellation behind it read as noise in front of the map. So that
   floor takes flat paper and nothing else. The cover has no use for either —
   its banner fills the window. */
const FLOOR_BACKDROP = [
  { paper: 'var(--paper-cover)',     nebula: 0 },   // 0 — the banner
  { paper: 'var(--paper-browse)',    nebula: 1 },   // 1 — Knowledge
  { paper: 'var(--paper-questions)', nebula: 1 },   // 2 — Open questions
  { paper: 'var(--paper-threads)',   nebula: 0 },   // 3 — the weave
];

const NEBULA_DOTS = 46;         // across 240vh of field — sparse on purpose
const NEBULA_LINK_DIST = 15;    // % of the field's width; beyond this, no thread
const NEBULA_LINK_MAX = 3;      // threads per point, so it never becomes a mesh
const NEBULA_PARALLAX = 0.35;   // fraction of the stage's travel

function nebulaRandom(i, salt) {
  return threadHash('nebula-' + i + '-' + salt);
}

function buildNebula() {
  const layer = document.getElementById('nebulaLayer');
  if (!layer) return;

  /* The field is drawn in the layer's OWN pixel proportions, not in an
     arbitrary box stretched to fit: a viewBox of the wrong aspect with
     preserveAspectRatio="none" turns every point into an oval and every
     thread into a lie about its length. Recomputed on resize below. */
  const w = layer.clientWidth || window.innerWidth;
  const h = layer.clientHeight || Math.round(window.innerHeight * 2.4);
  const vbW = 100;
  const vbH = (h / w) * vbW;

  /* A jittered grid, not a scatter. Pure randomness clumps — the first pass
     put a diagonal streak through an otherwise empty field — and an even
     grid reads as a pattern. Cells keep the spacing honest; the jitter
     inside each one keeps it from looking ruled. */
  const cols = Math.max(3, Math.round(Math.sqrt(NEBULA_DOTS * (vbW / vbH))));
  const rows = Math.max(3, Math.round(NEBULA_DOTS / cols));
  const cellW = vbW / cols;
  const cellH = vbH / rows;

  const pts = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      // a few cells stay empty, or the field becomes wallpaper
      if (nebulaRandom(i, 'skip') < 0.18) continue;
      pts.push({
        x: (c + 0.15 + nebulaRandom(i, 'x') * 0.7) * cellW,
        y: (r + 0.15 + nebulaRandom(i, 'y') * 0.7) * cellH,
        r: 0.16 + nebulaRandom(i, 'r') * 0.3,
        o: 0.35 + nebulaRandom(i, 'o') * 0.65,
      });
    }
  }

  // threads only between near neighbours, capped, so it stays a constellation
  const linkDist = Math.max(cellW, cellH) * 1.35;
  const threads = [];
  pts.forEach((a, i) => {
    pts.slice(i + 1)
      .map((b) => ({ b, d: Math.hypot(a.x - b.x, a.y - b.y) }))
      .filter((n) => n.d < linkDist)
      .sort((n, m) => n.d - m.d)
      .slice(0, NEBULA_LINK_MAX)
      .forEach((n) => threads.push({ a, b: n.b, o: 1 - n.d / linkDist }));
  });

  const parts = [`<svg viewBox="0 0 ${vbW} ${vbH.toFixed(1)}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">`];
  threads.forEach((t) => {
    parts.push(`<line x1="${t.a.x.toFixed(2)}" y1="${t.a.y.toFixed(2)}" ` +
      `x2="${t.b.x.toFixed(2)}" y2="${t.b.y.toFixed(2)}" ` +
      `stroke="var(--nebula-thread)" stroke-width="0.07" opacity="${(t.o * 0.85).toFixed(2)}"/>`);
  });
  pts.forEach((p) => {
    parts.push(`<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" ` +
      `r="${p.r.toFixed(2)}" fill="var(--nebula-dot)" opacity="${p.o.toFixed(2)}"/>`);
  });
  parts.push('</svg>');
  layer.innerHTML = parts.join('');
  moveNebula(feedStageOffset);
}

/* Redrawn on resize, because the proportions above are baked in at build
   time. Debounced: a window drag would otherwise rebuild it sixty times a
   second for something nobody is looking at directly. */
let nebulaResizeTimer = null;
function initNebulaResize() {
  window.addEventListener('resize', () => {
    clearTimeout(nebulaResizeTimer);
    nebulaResizeTimer = setTimeout(buildNebula, 220);
  });
}

function moveNebula(px) {
  const layer = document.getElementById('nebulaLayer');
  if (layer) layer.style.transform = 'translate3d(0, ' + (-px * NEBULA_PARALLAX) + 'px, 0)';
  // the colour bands travel with the floors, not behind them
  const paper = document.getElementById('floorPaper');
  if (paper) paper.style.transform = 'translate3d(0, ' + (-px) + 'px, 0)';
}

// one band per floor, in floor order
function buildFloorPaper() {
  const paper = document.getElementById('floorPaper');
  if (!paper) return;
  paper.innerHTML = FLOOR_BACKDROP
    .map((f) => `<div class="floor-paper-band" style="background:${f.paper}"></div>`)
    .join('');
  applyFloorBackdrop();
}

/* The field is only on the floors that want it. Called whenever the floor
   changes; the fade is CSS, so arriving at Threads dims it out rather than
   snapping it off mid-slide. */
function applyFloorBackdrop() {
  const layer = document.getElementById('nebulaLayer');
  if (!layer) return;
  const conf = FLOOR_BACKDROP[currentFloor] || FLOOR_BACKDROP[0];
  layer.style.opacity = String(cssNumber('--nebula-opacity', 0.5) * conf.nebula);
}

function setStageOffset(px) {
  feedStageOffset = px;
  const stage = document.getElementById('feedStage');
  if (stage) stage.style.transform = 'translate3d(0, ' + (-px) + 'px, 0)';
  // the field trails the floors — see NEBULA_PARALLAX
  moveNebula(px);
}

/* ---- the "scene change" arrival reveal ----
   Pre-set the arriving floor's heading/explainer/controls/cards to a faded,
   dropped-down state, force a reflow so that's actually the frame that
   paints, then release them on a stagger a beat after the tween launches —
   so the floor doesn't slide past, it assembles itself as it lands. */
const REVEAL_START_MS = 100;        // into the tween before anything is released
const REVEAL_EXPLAINER_MS = 60;
const REVEAL_CONTROLS_MS = 110;
const REVEAL_CARDS_MS = 165;
const REVEAL_CARD_STAGGER_MS = 52;
const REVEAL_CARD_STAGGER_CAP = 8;  // past this many, the rest land together

function floorRevealParts(floor) {
  /* Floor 4 reveals itself: renderThreads plays the words' stagger and then
     draws the threads between them, which is a longer and more particular
     arrival than the generic card stagger this function hands back. */
  if (floor === FLOOR_THREADS) {
    return { heading: null, explainer: null, controls: null, cards: [] };
  }
  if (floor === 2) {
    return {
      heading: null,
      explainer: null,
      controls: document.getElementById('questionsCount'),
      cards: Array.from(document.querySelectorAll('#questionsGrid .question-card:not(.is-hidden)')),
    };
  }
  if (floor === 1) {
    return {
      heading: null,
      explainer: null,
      controls: null,
      cards: Array.from(document.querySelectorAll('#browseGrid .poster-card:not(.is-hidden)')),
    };
  }
  // Floor 1 has no heading, explainer or controls left to reveal — the cover
  // replays its own arrival instead (see playArrivalReveal).
  return { heading: null, explainer: null, controls: null, cards: [] };
}

let revealTimers = [];
function playArrivalReveal(floor) {
  revealTimers.forEach(clearTimeout);
  revealTimers = [];

  // Floor 1's arrival is the cover's own word-stagger + Ken Burns, replayed
  // from the top, rather than the cards ladder the other two use.
  if (floor === 0) {
    revealTimers.push(setTimeout(replayHeroIntro, REVEAL_START_MS));
    return;
  }

  const parts = floorRevealParts(floor);
  const all = [parts.heading, parts.explainer, parts.controls].concat(parts.cards).filter(Boolean);
  if (!all.length) return;

  all.forEach((el) => el.classList.add('is-pre-reveal'));
  void document.body.offsetWidth; // force reflow so the "pre" frame actually paints first

  const release = (el, delay) => {
    if (!el) return;
    revealTimers.push(setTimeout(() => el.classList.remove('is-pre-reveal'), REVEAL_START_MS + delay));
  };
  release(parts.heading, 0);
  release(parts.explainer, REVEAL_EXPLAINER_MS);
  release(parts.controls, REVEAL_CONTROLS_MS);
  parts.cards.forEach((el, i) => {
    release(el, REVEAL_CARDS_MS + Math.min(i, REVEAL_CARD_STAGGER_CAP) * REVEAL_CARD_STAGGER_MS);
  });
}

// The single entry point for changing floors — the wheel, the center menu,
// the Designers filter and coming back out of share mode all go through here.
/* The map is built on arrival and stopped on departure.

   It cannot be built once up front: layoutThreads measures the stage, and while
   floor 4 is off-screen that measurement is still valid (the stage has real
   height) — but the arrival motion is the point of building it late. Playing the
   stagger and the thread-draw while the floor is three screens below would mean
   arriving at a map that had already assembled itself in private.

   Leaving stops the drift loop, because a requestAnimationFrame running against
   an off-screen floor is work nobody can see. */
function enterThreadsFloor() {
  renderThreads();
}

function leaveThreadsFloor() {
  stopThreadsDrift();
  threadsArrivalTimers.forEach(clearTimeout);
  threadsArrivalTimers = [];
  closeThreadStory();
}

function goToFloor(floor, options) {
  const opts = options || {};
  const target = Math.max(0, Math.min(FLOOR_COUNT - 1, floor));
  const endPx = target * floorHeight();

  /* Floor 4 is built when it is arrived at and stopped when it is left, on both
     paths out of here. Kept as one helper called from two places rather than
     duplicated, because "did we just arrive at the weave" has to be answered
     before currentFloor is overwritten. */
  const wasThreads = currentFloor === FLOOR_THREADS;
  const arriving = target === FLOOR_THREADS;

  if (opts.instant) {
    feedSnapAnimating = false;
    currentFloor = target;
    if (arriving) enterThreadsFloor();
    else if (wasThreads) leaveThreadsFloor();
    setStageOffset(endPx);
    updateChrome();
    applyFloorBackdrop();
    syncUrlState({ replace: true });
    return;
  }
  if (feedSnapAnimating) return;

  currentFloor = target;
  /* Built as the tween starts, not when it lands: the words' stagger is timed to
     overlap the last part of the slide, so the floor assembles as it arrives
     rather than after it has stopped. */
  if (arriving) enterThreadsFloor();
  else if (wasThreads) leaveThreadsFloor();
  updateChrome();
  applyFloorBackdrop();
  syncUrlState({ replace: true });
  const startPx = feedStageOffset;
  const distance = endPx - startPx;

  // Already standing on it (e.g. a menu pick for the current floor): still
  // play the reveal, so it reads as "you arrived somewhere" either way.
  if (Math.abs(distance) < 1) {
    setStageOffset(endPx);
    playArrivalReveal(target);
    return;
  }

  feedSnapAnimating = true;
  playArrivalReveal(target);

  const duration = CONFIG.FEED_SNAP_DURATION_MS;
  const startTime = performance.now();

  function step(now) {
    const p = Math.min(1, (now - startTime) / duration);
    // hard launch, then a long settle that briefly passes the landing point
    // and eases back into it (feedSnapEase returns > 1 mid-flight)
    setStageOffset(startPx + distance * feedSnapEase(p));
    if (p < 1) {
      requestAnimationFrame(step);
    } else {
      setStageOffset(endPx); // land exactly, never a sub-pixel short
      feedSnapAnimating = false;
    }
  }
  requestAnimationFrame(step);
}

// True while `el` still has somewhere to go in the wheel's direction. A floor
// with its own overflow (Questions, when there are a lot of them) consumes
// the wheel until it reaches its own edge, and only then hands back over to
// the floor-to-floor snap.
function innerScrollHasRoom(el, deltaY) {
  const max = el.scrollHeight - el.clientHeight;
  if (max <= 1) return false;
  return deltaY > 0 ? el.scrollTop < max - 1 : el.scrollTop > 1;
}

/* ---- the same gesture with a finger ----
   Floor-to-floor movement was wheel-only, and the page is a transform-driven
   stage inside overflow:hidden — so on a phone there was nothing to scroll and
   nothing listening, and the feed simply could not be moved at all.

   Every guard the wheel handler applies is applied here too, and deliberately
   from the same helpers: feedNavBlocked() is shared by both, so the two inputs
   cannot drift apart, and innerScrollHasRoom() is reused so a Questions floor or
   a Threads story list still consumes the gesture until it reaches its own edge.

   Where this differs from the wheel is what it does when it declines. The wheel
   handler calls preventDefault() while blocked, because a mouse has nothing else
   it wanted to do. A finger does: inside an expanded card, the Share form or a
   scrolling region, the browser's own scrolling is the correct behaviour and must
   not be touched. So when this handler is not going to move a floor it returns
   without preventDefault, and native scrolling happens exactly as it would have
   if none of this existed. */
const SWIPE_MIN_PX = 50;        // below this it is a tap or a twitch, not a swipe
const SWIPE_AXIS_LOCK_PX = 8;   // movement needed before the axis can be called

/* Shared with the wheel handler, so "when does the feed refuse to move" has one
   answer. A word being dragged on floor 4 pins the floor: without this a drag
   would carry the floor out from under the word being moved. */
/* Everything that pins the floors. A surface over the feed (a card, the share
   form, Designers, the Thread panel) owns the gesture while it is up: what
   scrolls is the surface's own scroller, natively, and the stage underneath
   does not move — so closing the surface lands exactly where you left. */
function feedNavBlocked() {
  return isCardExpanded || isShareMode || isDesignersMode || isThreadViewMode || feedSnapAnimating || !!threadsDragNode;
}

/* One vertical swipe = one floor, in the direction the content moves: dragging
   the page up pulls the next floor into view, which is `deltaY > 0` in wheel
   terms. Returns the equivalent wheel delta sign so innerScrollHasRoom can be
   asked the same question either input arrives by. */
function initFeedTouchSnap() {
  let startX = 0, startY = 0;
  let tracking = false, axisDecided = false, isVertical = false;
  let inner = null;

  document.addEventListener('touchstart', (e) => {
    // Two fingers is a pinch or a zoom; neither is a floor change.
    if (e.touches.length !== 1) { tracking = false; return; }
    const t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    tracking = true;
    axisDecided = false;
    isVertical = false;
    /* .threads-story-list is a scroller that is not a .floor-scroll — it lives in
       a panel over floor 4 — so it is named here for the same reason the wheel
       handler names it. Captured at touchstart: which region a gesture belongs to
       is decided by where it began, not by whatever ends up under the finger. */
    inner = e.target.closest ? e.target.closest('.floor-scroll, .threads-story-list') : null;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!tracking || e.touches.length !== 1) return;
    if (feedNavBlocked()) return;   // no preventDefault: let it scroll
    const t = e.touches[0];
    const dy = t.clientY - startY;
    const dx = t.clientX - startX;

    if (!axisDecided) {
      if (Math.abs(dx) < SWIPE_AXIS_LOCK_PX && Math.abs(dy) < SWIPE_AXIS_LOCK_PX) return;
      axisDecided = true;
      /* Strictly greater, so a diagonal resolves to horizontal and the poster
         row's own drag keeps it. The row is the one place where both axes mean
         something. */
      isVertical = Math.abs(dy) > Math.abs(dx);
    }
    if (!isVertical) return;

    if (inner && innerScrollHasRoom(inner, -dy)) return;  // its own scroll first

    /* Only now, and only if the browser will still listen: once a pan has been
       handed to the compositor (a `touch-action: pan-y` region, say) touchmove
       stops being cancelable, and calling preventDefault would log a console
       error and change nothing. Suppresses rubber-banding at the ends of the
       stage rather than being required for the movement itself. */
    if (e.cancelable) e.preventDefault();
  }, { passive: false });

  const finish = (e) => {
    if (!tracking) return;
    tracking = false;
    if (!axisDecided || !isVertical) return;
    if (feedNavBlocked()) return;
    const t = (e.changedTouches && e.changedTouches[0]) || null;
    if (!t) return;
    const dy = t.clientY - startY;
    if (Math.abs(dy) < SWIPE_MIN_PX) return;   // a tap, or too small to mean it
    if (inner && innerScrollHasRoom(inner, -dy)) return;
    const next = currentFloor + (dy < 0 ? 1 : -1);
    if (next < 0 || next > FLOOR_COUNT - 1) return;
    goToFloor(next);
  };
  document.addEventListener('touchend', finish, { passive: true });
  document.addEventListener('touchcancel', () => { tracking = false; }, { passive: true });
}

function initFeedWheelSnap() {
  /* On the document, not on #feedMain: anything fixed floating over the feed
     would otherwise swallow a tick that happened to land on it, and the page
     simply wouldn't move until you moved the pointer somewhere else. */
  document.addEventListener('wheel', (e) => {
    /* A surface over the feed owns the wheel: its own scroller takes it
       natively (each one is overflow:auto with overscroll-behavior:contain, so
       reaching its end does not chain out), and a tick on the dimmed backdrop
       around it does nothing — the floors stay put until the surface closes.
       The Thread panel was missing from this list: a wheel inside it fell
       through to a floor change behind the panel. */
    if (isCardExpanded || isShareMode || isDesignersMode || isThreadViewMode) return;
    if (e.deltaY === 0) return;
    /* A word being dragged on floor 4 pins the floor. Without this a trackpad
       two-finger drag — which is a pointer drag and a wheel gesture at the same
       time — would carry the floor out from under the word being moved, and the
       drag would finish somewhere nobody asked for.

       Kept as two explicit checks rather than feedNavBlocked() because the wheel
       swallows the event in these two cases and merely ignores it in the four
       above — a distinction the shared helper cannot carry. The touch handler
       declines all six the same way; see initFeedTouchSnap. */
    if (threadsDragNode) { e.preventDefault(); return; }
    if (feedSnapAnimating) { e.preventDefault(); return; }

    /* .threads-story-list is a scroller that is not a .floor-scroll — it lives in
       a panel over floor 4 — so it has to be named here or a long chain would be
       unreadable: the wheel would leave the floor instead of scrolling the list. */
    const inner = e.target.closest ? e.target.closest('.floor-scroll, .threads-story-list') : null;
    if (inner && innerScrollHasRoom(inner, e.deltaY)) return; // the floor scrolls itself first

    e.preventDefault();
    const next = currentFloor + (e.deltaY > 0 ? 1 : -1);
    if (next < 0 || next > FLOOR_COUNT - 1) return;
    goToFloor(next);
  }, { passive: false });

  /* The address bar retracting is not a window resize on every mobile browser,
     but it does change --floor-h (100dvh) and therefore every floor's height —
     which would leave the stage parked between floors, since its offset is in
     pixels committed at the last navigation. visualViewport reports it where
     `resize` does not.

     Deliberately re-derived rather than tweened: this is a correction to a
     measurement, not a journey, and animating it would read as the page drifting
     on its own. Skipped mid-tween, which will land on the right number anyway
     because goToFloor recomputes the endpoint from floorHeight() on arrival. */
  const realign = () => {
    if (feedSnapAnimating) return;
    setStageOffset(currentFloor * floorHeight());
  };
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', realign);
  }
  /* Orientation lands a frame or two after the event, so the height read on the
     event itself is still the old one. */
  window.addEventListener('orientationchange', () => {
    setTimeout(() => { realign(); sizeAllRosters(false); fitAllHeroTitles(); }, 120);
  });

  // The stage is positioned in pixels, so a resized window would otherwise
  // leave it parked between floors — re-derive it from the floor we're on.
  window.addEventListener('resize', () => {
    fitAllHeroTitles(); // the cover title is sized against the banner, not the font
    // A different window shape crops the photo differently, which can change
    // what is behind the corners.
    document.querySelectorAll('#heroSlides .hero-slide').forEach((slide, i) => {
      const data = ALL_CARDS[heroIndices[i]];
      if (data) applyHeroTone(slide, data);
    });
    if (feedSnapAnimating) return;
    setStageOffset(currentFloor * floorHeight());
  });
}

/* ---- what chrome the current screen gets ----
   The floor dock and the wordmark: only the two lower feed floors. Floor 1 is
   the cover and carries nothing but the image and the knowledge; the full-screen
   surfaces (Share, Designers, a detail) are takeovers with their own back
   button.

   And the corner marks: they have no plate behind them, so on floor 1 they sit
   directly on the banner's dark scrim and have to invert. Everywhere else the
   page is white and they don't. */
/* ======================================================================
   Chrome
   ----------------------------------------------------------------------
   Two kinds of fixed element, and confusing them is what put floor 2's search
   box on top of the Designers roster:

   ALWAYS — on every floor and every full-screen surface. The hamburger
   (top-left), the notification bell (top-right), Share and the way out
   (bottom-left), the language switcher (bottom-right). These are how you get
   anywhere, so they cannot depend on where you are.

   PER-FLOOR — the tools that belong to one floor and are meaningless off it.
   Floor 2's search and studio filters; floor 3's waiting-questions count; the
   Loom wordmark that keeps them company. These are part of the floor, not part
   of the app, and they leave with it.

   Anything that changes which of those is true has to call updateChrome():
   a floor change, and every enter/exit of Share, Designers and a detail.
   ====================================================================== */

/* ---- what colour a mark should be ----
   The bottom corners used to go white for the whole of floor 1, on the
   assumption that floor 1 always means "over the banner's dark scrim". A
   Question cover has no scrim — it is paper-toned top to bottom — so the marks
   turned white on a near-white background and vanished.

   So tone is per REGION of the current screen rather than per floor, and on a
   cover with a photo it is measured from the photo itself. */
const TONE_LIGHT = 'light'; // light background -> dark marks
const TONE_DARK = 'dark';   // dark background -> light marks

const LIGHT_SURFACE_TONE = { topLeft: TONE_LIGHT, topRight: TONE_LIGHT, mid: TONE_LIGHT, bottom: TONE_LIGHT };

// Sampled tones, keyed by image URL. Measuring is cheap but not free, and the
// cover rotates every five seconds through the same handful of images.
const imageToneCache = new Map();

/* Average luminance of one horizontal band of an image AS RENDERED — cover
   scaling and the author's focal point included, because that crop is what the
   marks are actually sitting on. Rec. 709 coefficients: green carries most of
   perceived brightness, and a flat RGB mean calls a saturated blue much lighter
   than it looks.

   `aspect` is the display box's width/height. Cached per image+shape, since the
   cover rotates every five seconds through the same handful of pictures. */
function measureImageTone(url, aspect, focal) {
  const fx = focal && typeof focal.x === 'number' ? focal.x : 50;
  const fy = focal && typeof focal.y === 'number' ? focal.y : 50;
  const key = url + '|' + aspect.toFixed(2) + '|' + fx + ',' + fy;
  if (imageToneCache.has(key)) return Promise.resolve(imageToneCache.get(key));

  return new Promise((resolve) => {
    const done = (tone) => { imageToneCache.set(key, tone); resolve(tone); };
    const img = new Image();

    img.onload = () => {
      try {
        const W = 48;
        const H = Math.max(8, Math.round(W / Math.max(0.2, aspect)));
        const canvas = document.createElement('canvas');
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // The same maths the browser does for background-size: cover plus
        // background-position — scale to fill, then slide by the focal point.
        const iw = img.naturalWidth || 1;
        const ih = img.naturalHeight || 1;
        const scale = Math.max(W / iw, H / ih);
        const dw = iw * scale;
        const dh = ih * scale;
        ctx.drawImage(img, -(dw - W) * (fx / 100), -(dh - H) * (fy / 100), dw, dh);

        const px = ctx.getImageData(0, 0, W, H).data;

        /* Mean luminance of a rectangle, in fractions of the frame. Rectangles
           rather than full-width bands, because the two top marks are in
           opposite corners and a busy photograph averages to something neither
           of them is sitting on — a bright sky on the left and a dark building
           on the right reads as "mid" and picks the wrong colour for both. */
        const areaLuma = (x0f, y0f, x1f, y1f) => {
          const x0 = Math.max(0, Math.floor(x0f * W)), x1 = Math.min(W, Math.ceil(x1f * W));
          const y0 = Math.max(0, Math.floor(y0f * H)), y1 = Math.min(H, Math.ceil(y1f * H));
          let sum = 0, n = 0;
          for (let y = y0; y < Math.max(y0 + 1, y1); y++) {
            for (let x = x0; x < Math.max(x0 + 1, x1); x++) {
              const i = (y * W + x) * 4;
              sum += (0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]) / 255;
              n++;
            }
          }
          return n ? sum / n : 1;
        };

        // 0.55: the marks carry a two-tone halo (see .icon-ghost), so a dark
        // mark survives a mid background better than a light one does. Bias
        // towards dark rather than sitting exactly on the fence.
        const toneOf = (luma) => (luma > 0.55 ? TONE_LIGHT : TONE_DARK);
        done({
          // the actual corners the two top marks occupy, ~26-96px into a
          // 1600px-wide banner and 24-50px down
          topLeft: toneOf(areaLuma(0, 0, 0.09, 0.075)),
          topRight: toneOf(areaLuma(0.91, 0, 1, 0.075)),
          mid: toneOf(areaLuma(0, 0.42, 1, 0.58)),
          bottom: TONE_DARK,
        });
      } catch (err) {
        // getImageData throws on a tainted canvas (a cross-origin image with no
        // CORS headers). Everything here is same-origin or a data: URL, but a
        // wrong guess beats a broken screen.
        console.warn('[Loom feed] could not measure image tone:', err);
        done(LIGHT_SURFACE_TONE);
      }
    };

    img.onerror = () => done(LIGHT_SURFACE_TONE);
    img.src = url;
  });
}


/* The detail's banner is a 22vh strip across the top, and the hamburger and
   the bell sit inside it — a different shape from the cover, so it is measured
