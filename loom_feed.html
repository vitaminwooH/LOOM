    cursor: pointer;
    border-radius: 8px;
    transition: color 0.25s ease, background 0.25s ease;
  }
  .qd-delete-btn:hover { color: var(--ink-dim); background: rgba(20, 20, 20, 0.05); }
  .qd-delete-btn svg { width: 14px; height: 14px; }

  .question-tabs { display: none; flex-shrink: 0; border-bottom: 1px solid var(--border); }
  .question-tab {
    flex: 1;
    padding: 13px;
    border: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 650;
    color: var(--ink-faint);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.25s ease, border-color 0.25s ease;
  }
  .question-tab.is-active { color: var(--ink); border-bottom-color: var(--ink); }

  .question-panes { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 340px; }
  .question-pane { min-height: 0; display: flex; flex-direction: column; }
  .question-pane-conversation { border-right: 1px solid var(--border); }

  .conversation-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .conversation-message { display: flex; flex-direction: column; gap: 5px; max-width: 82%; }
  .conversation-message.is-me { align-self: flex-end; align-items: flex-end; }
  .conversation-message-meta { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-faint); }
  .conversation-message-meta .card-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .conversation-message-author { font-weight: 650; color: var(--ink-dim); }
  .conversation-message-bubble {
    background: rgba(20, 20, 20, 0.045);
    border-radius: 14px;
    padding: 11px 15px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink);
  }
  .conversation-message.is-me .conversation-message-bubble { background: var(--ink); color: #ffffff; }
  .conversation-message.is-entering { opacity: 0; transform: translateY(8px); animation: conversationMessageIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  @keyframes conversationMessageIn { to { opacity: 1; transform: translateY(0); } }

  .conversation-input-row {
    flex-shrink: 0;
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  #conversationInput {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.25s ease;
  }
  #conversationInput:focus { border-color: var(--border-strong); }
  #conversationInput::placeholder { color: var(--ink-faint); }
  .conversation-send-btn {
    flex-shrink: 0;
    padding: 10px 18px;
    border-radius: 999px;
    border: none;
    background: var(--ink);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 650;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
  }
  .conversation-send-btn:hover { transform: translateY(-1px); }
  .conversation-send-btn:active { transform: translateY(0) scale(0.96); }

  .brief-header {
    flex-shrink: 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .brief-header-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .brief-ai-label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--studio-color, var(--ink-dim));
  }
  .brief-updated { font-size: 11px; color: var(--ink-faint); transition: opacity 0.2s ease; }
  .brief-confirm-btn {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--border-strong);
    background: transparent;
    color: var(--ink-dim);
    font-family: 'Inter', sans-serif;
    font-size: 11.5px;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  }
  .brief-confirm-btn:hover { border-color: var(--ink); color: var(--ink); }
  .brief-confirm-btn.is-confirmed { background: var(--ink); border-color: var(--ink); color: #ffffff; }

  .brief-body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 22px; transition: opacity 0.25s ease; }
  .brief-body.is-updating { opacity: 0.45; }
  .brief-section { margin-bottom: 18px; }
  .brief-section:last-child { margin-bottom: 0; }
  .brief-section .label {
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
    margin-bottom: 7px;
  }
  .brief-section p { margin: 0; font-size: 13px; line-height: 1.62; color: rgba(28, 28, 30, 0.8); }
  .brief-section ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.62; color: rgba(28, 28, 30, 0.8); }
  .brief-section li.is-new { animation: conversationMessageIn 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
  .brief-empty { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-faint); font-style: italic; }

  /* narrow modal: the brief collapses behind a tab instead of sitting
     side-by-side — a container query so this is about the MODAL's own
     width, not the browser window's. */
  @container question-detail (max-width: 720px) {
    .question-tabs { display: flex; }
    .question-panes { grid-template-columns: 1fr; }
    .question-pane-conversation { border-right: none; }
    .question-pane { display: none; }
    .question-pane.is-active-tab { display: flex; }
  }

  /* ======================================================================
     Designers — who is weaving this, one studio per screen.

     Deliberately a roster and not a scoreboard: nothing on a card can be
     compared against the next card (photo, name, job title, how to reach them
     — that's all), nothing is ordered by output, no card says how much anyone
     has shared, and the two studios are never on screen together to be read
     side by side. See the DESIGNERS comment in the script for why this is a
     rule and not a style choice.

     The screen is sized to fill rather than to sit politely in the middle of
     itself: the roster IS the content here, so the cards take the height and
     the studio arrows go out to the edges of the viewport where there is room
     to make them obvious.
     ====================================================================== */
  .designers-viewport {
    position: relative;
    height: var(--floor-h);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    /* heading, card row and studio caption are one block, centred as a whole.
       sizeAllRosters() keeps that block inside the surface, which is what makes
       centring safe here rather than clipping the top. */
    justify-content: center;
    background: var(--bg);
  }
  .designers-close { top: 22px; right: 26px; }

  /* ---------- heading ---------- */
  .designers-head {
    flex-shrink: 0;
    padding: 0 max(6vw, 28px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .designers-intro h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(38px, 4vw, 62px);
    line-height: 1.04;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin: 0 0 8px;
  }
  .designers-intro p {
    margin: 0;
    font-size: clamp(13.5px, 1.05vw, 16px);
    line-height: 1.5;
    color: var(--ink-dim);
  }

  /* ---------- big edge arrows ----------
     Pinned to the left and right edges of the viewport and vertically centred,
     well clear of the card row (see .designers-panel's side padding, which
     reserves the lane they sit in). No plate behind them: at this size a white
     disc would read as a button floating over the roster rather than as a
     direction to go in. */
  .studio-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    width: clamp(38px, 3.4vw, 54px);
    height: clamp(38px, 3.4vw, 54px);
    border: none;
    background: transparent;
    padding: 0;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.3s ease, transform 0.36s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
  }
  .studio-nav svg { width: 100%; height: 100%; }
  .studio-nav-prev { left: clamp(20px, 2.6vw, 48px); }
  .studio-nav-next { right: clamp(20px, 2.6vw, 48px); }
  .studio-nav:hover { color: var(--ink); transform: translateY(-50%) scale(1.12); }
  .studio-nav-prev:hover { transform: translateY(-50%) scale(1.12) translateX(-3px); }
  .studio-nav-next:hover { transform: translateY(-50%) scale(1.12) translateX(3px); }
  .studio-nav:active { transform: translateY(-50%) scale(0.95); }
  /* one studio, nowhere to go — the arrows go away rather than sit there dead */
  .designers-viewport.is-single-studio .studio-nav { display: none; }
  /* and in edit mode: the Add tile is a fourth card-sized tile, and four of
     them plus an arrow lane on each side would squeeze the cards well below the
     size this screen is built around. So the arrows stand down and give the row
     the room. The trade is that you press Done before you can move to another
     studio — acceptable, because edit mode is an explicit, focused state on
     your own studio and the other studio isn't editable anyway. */
  .designers-viewport.is-editing .studio-nav { display: none; }

  /* ---------- the sliding stage ---------- */
  .designers-stage-wrap {
    position: relative; /* the edge arrows anchor to this, not the viewport */
    flex: 0 1 auto;
    min-height: 0;
    overflow: hidden;
    display: flex;
  }
  .designers-stage {
    display: flex;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    transition: transform 0.72s cubic-bezier(0.19, 1, 0.22, 1);
  }
  .designers-panel {
    flex: 0 0 100%;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    /* the side padding is the lane the edge arrows live in — a card must never
       end up underneath one */
    padding: clamp(14px, 2vh, 28px) clamp(84px, 7vw, 130px) clamp(16px, 2.2vh, 30px);
    transition: padding 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    /* A studio bigger than fits stays one fixed row and scrolls sideways; it
       never turns into an auto-flowing track. The bar itself is hidden: the
       panel's width and padding are both animated (sliding between studios,
       entering edit mode), and every frame where the content is a pixel wider
       than the box would otherwise flash a scrollbar across the screen. */
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior: contain;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .designers-panel::-webkit-scrollbar { width: 0; height: 0; display: none; }
  /* no arrow lane to leave clear once the arrows are gone */
  .designers-viewport.is-editing .designers-panel {
    padding-left: clamp(36px, 4vw, 84px);
    padding-right: clamp(36px, 4vw, 84px);
  }

  /* Fixed, not a flowing track: the whole studio is on screen at once, and the
     row takes as much height as the screen will give it.

     The height is written by sizeAllRosters() rather than declared here: a
     card's width follows from its height (aspect-ratio), so the row has to be
     sized against the *narrower* of the two constraints, and how many tiles are
     in it is only known at render time — turning edit mode on adds one. CSS
     can't see that count, so it can't do this arithmetic. */
  .designer-roster {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: clamp(16px, 1.6vw, 36px);
    height: 100%;
    margin: auto; /* keeps a short row centred once the panel can scroll */
    transition: height 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* ---------- the card, and its two faces ----------
     Hover turns the card over: the portrait on the front, how to reach the
     person on the back. The card itself carries no border or background — each
     face does — or the frame would sit in front of whichever face is turned
     away. Height-first: the card takes the row's height and derives its width
     from the 1:1.4 ratio, so a shorter window shrinks the whole row evenly
     instead of overflowing. */
  .designer-card {
    position: relative;
    height: 100%;
    aspect-ratio: 1 / 1.4;
    flex: 0 0 auto;
    perspective: 1400px;
    font-family: 'Inter', sans-serif;
    cursor: default;
    transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .designer-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.66s cubic-bezier(0.32, 1, 0.3, 1);
  }
  /* :focus-within so tabbing to a link on the back turns the card and keeps it
     turned — otherwise the thing you are focused on is facing away from you */
  .designer-card:hover .designer-card-inner,
  .designer-card:focus-within .designer-card-inner { transform: rotateY(180deg); }
  /* while a studio is arranging its roster the card is an object, not something
     to read: it stays face-up and the whole surface opens the editor */
  .designer-card.is-editing { cursor: pointer; }
  .designer-card.is-editing .designer-card-inner { transform: none; }

  .designer-face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    border-radius: 26px;
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transition: box-shadow 0.34s ease, border-color 0.3s ease;
  }
  .designer-card:hover .designer-face { box-shadow: var(--shadow-hover); border-color: var(--border-strong); }
  .designer-card.is-active .designer-face { border-color: var(--ink); }
  .designer-face-back { transform: rotateY(180deg); }

  /* A real photo when there is one, a studio-tinted initials panel when there
     isn't — identical box either way, so a studio filling in photos over time
     never reflows the roster.

     Absolutely filling the card, not a flex row above the label: centred in the
     *photo box* put the initials well above the card's real centre, because the
     box stopped where the name/role bar began. Filling the card also lets a
     real photo bleed behind that bar instead of being cut off square at it. */
  .designer-photo {
    position: absolute;
    inset: 0;
    border-radius: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(46px, 6vw, 104px);
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1;
    color: var(--studio-color, var(--ink));
    background: var(--studio-tint, rgba(20, 20, 20, 0.05));
    background-size: cover;
    background-position: center;
  }
  .designer-photo.has-photo { color: transparent; }

  .designer-card-text {
    position: relative; /* above the photo, which now fills the card */
    margin-top: auto;
    background: var(--surface);
    padding: clamp(16px, 2.2vh, 26px) clamp(18px, 1.7vw, 28px) clamp(18px, 2.4vh, 28px);
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }
  .designer-name {
    font-size: clamp(17px, 1.5vw, 25px);
    font-weight: 650;
    line-height: 1.2;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .designer-role {
    font-size: clamp(12.5px, 1vw, 16px);
    color: var(--ink-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- the back face ----------
     Everything here has to fit without scrolling. A card that grows a scrollbar
     the moment you hover it is a card that flinches, and the bar itself lands
     on top of the link text — the one thing you turned the card over to read.
     Five links is the ceiling (DESIGNER_LINK_KINDS), so the metrics below are
     sized against exactly that. */
  .designer-face-back {
    justify-content: flex-start;
    gap: clamp(9px, 1.4vh, 15px);
    padding: clamp(16px, 2.2vh, 28px) clamp(15px, 1.5vw, 24px);
    overflow: hidden;
  }
  .designer-back-head { flex-shrink: 0; min-width: 0; }
  .designer-back-head .designer-name { white-space: normal; font-size: clamp(15px, 1.3vw, 21px); }
  .designer-back-head .designer-role { margin-top: 3px; white-space: normal; font-size: clamp(11.5px, 0.9vw, 14px); }

  .designer-links {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-height: 0;
    overflow: hidden; /* no scrollbar, in either axis, ever */
    margin: 0 -6px;
    padding: 0 6px;
  }
  .designer-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: clamp(4px, 0.7vh, 7px) 8px;
    margin: 0 -8px;
    border-radius: 9px;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: clamp(10.5px, 0.82vw, 12.5px);
    line-height: 1.3;
    flex-shrink: 0;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .designer-link:hover { background: rgba(20, 20, 20, 0.05); color: var(--ink); }
  .designer-link-icon { flex-shrink: 0; display: flex; color: var(--studio-color, var(--ink-dim)); }
  .designer-link-icon svg { width: clamp(12px, 1vw, 15px); height: clamp(12px, 1vw, 15px); }
  .designer-link-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .designer-links-empty { margin: 0; font-size: 12px; line-height: 1.5; color: var(--ink-faint); }

  /* the only thing on this screen that navigates — deliberately a button you
     have to aim at, not the whole card (see buildDesignerCard) */
  .designer-see-work {
    flex-shrink: 0;
    margin-top: auto;
    padding: clamp(7px, 1.1vh, 11px) 14px;
    border-radius: 999px;
    border: 1.5px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: clamp(11px, 0.9vw, 12.5px);
    font-weight: 650;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .designer-see-work:hover { background: var(--ink); color: #fff; transform: translateY(-1px); }
  .designer-see-work:active { transform: translateY(0) scale(0.97); }

  /* the pencil only exists on your own studio, and only once edit mode is on —
     browsing another studio's people should look like reading, not like a form
     you happen to lack permission for */
  .designer-edit-btn {
    position: absolute;
    z-index: 2; /* above .designer-card-inner, which is a 3D context */
    top: 14px;
    right: 14px;
    width: clamp(34px, 2.8vw, 46px);
    height: clamp(34px, 2.8vw, 46px);
    border-radius: 50%;
    border: none;
    background: rgba(20, 20, 20, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.24s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), background 0.24s ease;
  }
  .designer-edit-btn svg { width: 44%; height: 44%; }
  .designer-card:hover .designer-edit-btn,
  .designer-edit-btn:focus-visible { opacity: 1; transform: scale(1); }
  .designer-edit-btn:hover { background: var(--ink); }

  /* the add tile matches a card's footprint exactly so turning edit mode on
     doesn't resize the row */
  .designer-add-card {
    height: 100%;
    aspect-ratio: 1 / 1.4;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 30px;
    border-radius: 26px;
    border: 1.5px dashed var(--border-strong);
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: clamp(13px, 1.1vw, 17px);
    font-weight: 650;
    color: var(--ink-dim);
    cursor: pointer;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease, transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .designer-add-card svg { width: clamp(32px, 3vw, 48px); height: clamp(32px, 3vw, 48px); }
  .designer-add-card:hover { border-color: var(--ink); color: var(--ink); background: rgba(20, 20, 20, 0.02); transform: translateY(-6px); }
  .designer-add-card:active { transform: translateY(-2px) scale(0.99); }

  .designer-roster-empty {
    font-size: 15px;
    color: var(--ink-faint);
    text-align: center;
    align-self: center;
  }

  /* ---------- the studio caption ----------
     Below the roster, not above it: you look at the people first, then read
     whose they are. It reads as a caption too — the studio's mark, its name in
     the serif at display size, and the "yours" note as a small-caps aside.
     Nothing is boxed. */
  .studio-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 2.4vw, 34px);
    padding: clamp(10px, 1.6vh, 20px) max(6vw, 28px) clamp(14px, 2.2vh, 28px);
  }
  .studio-pager-current {
    display: flex;
    align-items: baseline;
    gap: clamp(10px, 1vw, 16px);
    min-width: 0;
  }
  /* the studio's logo where a colour dot used to be — a real mark reads as
     identity in a way a coloured circle never quite does. buildStudioMark()
     falls back to that circle when there is no file for a studio. */
  .studio-pager-mark {
    align-self: center;
    flex-shrink: 0;
    width: clamp(24px, 2vw, 32px);
    height: clamp(24px, 2vw, 32px);
    border-radius: 50%;
    background-color: var(--studio-tint, rgba(20, 20, 20, 0.06));
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.45s ease;
  }
  .studio-mark-dot {
    width: 42%;
    height: 42%;
    border-radius: 50%;
    background: var(--studio-color, var(--ink-dim));
  }
  .studio-pager-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(26px, 2.4vw, 40px);
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--ink);
    white-space: nowrap;
  }
  /* the quiet "this one's yours" marker — the same signal the edit toggle
     depends on, said in words so it isn't only implied by a button appearing */
  .studio-pager-you {
    font-size: clamp(9.5px, 0.72vw, 11px);
    font-weight: 650;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--studio-color, var(--ink-dim));
    white-space: nowrap;
  }
  .studio-pager-you:empty { display: none; }

  .roster-edit-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 20px 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: clamp(11.5px, 0.9vw, 13px);
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .roster-edit-toggle svg { width: 14px; height: 14px; }
  .roster-edit-toggle:hover { border-color: var(--border-strong); color: var(--ink); background: rgba(20, 20, 20, 0.035); }
  .roster-edit-toggle:active { transform: scale(0.96); }
  .roster-edit-toggle.is-on { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* ---------- add / edit dialog ----------
     Two columns at this size: the photo is the biggest decision on this form,
     so it gets its own half rather than a thumbnail wedged above the fields. */
  .designer-editor { position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .designer-editor-scrim { position: absolute; inset: 0; background: rgba(20, 20, 20, 0.38); }
  .designer-editor-card {
    position: relative;
    width: min(900px, 100%);
    max-height: calc(var(--floor-h) - 48px);
    overflow-y: auto;
    padding: clamp(26px, 3.2vw, 44px);
    border-radius: 28px;
    background: var(--surface);
    box-shadow: var(--shadow-hover);
    display: flex;
    flex-direction: column;
    gap: clamp(20px, 2.4vh, 30px);
  }
  .designer-editor-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(26px, 2.6vw, 38px);
    line-height: 1.1;
    color: var(--ink);
    margin: 0;
  }

  .editor-body {
    display: flex;
    gap: clamp(24px, 3vw, 42px);
    align-items: stretch;
  }
  .editor-photo-col {
    flex: 0 0 auto;
    width: clamp(180px, 18vw, 260px);
    display: flex;
    flex-direction: column;
  }
  .editor-photo-zone {
    position: relative; /* anchors the drag hint */
    width: 100%;
    aspect-ratio: 1 / 1.32;
    border-radius: 20px;
    border: 1.5px dashed var(--border-strong);
    background: var(--studio-tint, rgba(20, 20, 20, 0.04));
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(38px, 4vw, 58px);
    font-weight: 600;
    line-height: 1;
    color: var(--studio-color, var(--ink-faint));
    cursor: pointer;
    transition: border-color 0.25s ease, background-color 0.25s ease;
  }
  .editor-photo-zone.is-dragover { border-color: var(--ink); background-color: rgba(20, 20, 20, 0.06); }
  .editor-photo-zone.has-photo { border-style: solid; border-color: var(--border); color: transparent; }

  /* the fields sit level with the middle of the photo rather than tracking its
     top edge, so the two columns read as one form and not as two stacks */
  .editor-form-col {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(16px, 2vh, 26px);
  }

  .editor-photo-label { font-size: 13px; font-weight: 650; color: var(--ink); margin-bottom: 9px; }
  .editor-photo-hint { margin: 11px 0 13px; font-size: 12.5px; line-height: 1.55; color: var(--ink-faint); }
  .editor-photo-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: auto; }
  .editor-photo-actions .btn-ghost-sm { padding: 9px 16px; font-size: 12.5px; }

  .editor-field-label { font-size: 13px; font-weight: 650; color: var(--ink); margin-bottom: 8px; }
  .editor-field input {
    width: 100%;
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid var(--border-strong);
    background: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 15.5px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.22s ease;
  }
  .editor-field input:focus { border-color: var(--ink); }
  .editor-field input::placeholder { color: var(--ink-faint); }

  .editor-links { display: flex; flex-direction: column; }
  .editor-links-grid { display: flex; flex-direction: column; gap: 8px; }
  .editor-link-row { display: flex; align-items: center; gap: 10px; }
  .editor-link-row-icon { flex-shrink: 0; display: flex; color: var(--ink-faint); }
  .editor-link-row-icon svg { width: 16px; height: 16px; }
  .editor-link-row input {
    flex: 1 1 auto;
    min-width: 0;
    padding: 10px 13px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.22s ease;
  }
  .editor-link-row input:focus { border-color: var(--ink); }
  .editor-link-row input::placeholder { color: var(--ink-faint); }

  .editor-actions { display: flex; align-items: center; gap: 12px; }
  .editor-actions-spacer { flex: 1 1 auto; }
  .editor-delete-link { padding: 0; font-size: 13px; }
  .editor-actions .btn-ghost-sm { padding: 12px 24px; font-size: 14px; }
  .editor-save { padding: 13px 32px; font-size: 14.5px; }
  .editor-save:disabled { opacity: 0.4; cursor: not-allowed; }
  .editor-delete-confirm {
    padding: 18px 20px;
    border-radius: 18px;
    background: rgba(20, 20, 20, 0.04);
  }
  .editor-delete-confirm p { margin: 0 0 13px; font-size: 13.5px; line-height: 1.55; color: var(--ink-dim); }

  /* ---------- focal-point drag ----------
     A roster tile is a tall 1:1.32 crop of whatever was uploaded, which puts a
     face off-centre far more often than not. Rather than a crop dialog, the
     photo is dragged inside the frame it will actually appear in. */
  .is-focal-draggable { cursor: grab; touch-action: none; }
  .is-focal-draggable.is-dragging-focal { cursor: grabbing; }
  .focal-hint {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.96);
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(15, 15, 12, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: rgba(255, 255, 255, 0.95);
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .focal-hint svg { width: 13px; height: 13px; }
  .is-focal-draggable:hover .focal-hint { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  /* out of the way while you are actually doing the thing it described */
  .is-focal-draggable.is-dragging-focal .focal-hint { opacity: 0; }

  /* ---------- the "you're looking at one person's knowledge" chip ----------
     Appears on the Browse and Questions floors once someone is picked in
     Designers, and is the only way that filter is ever visible — an invisible
     filter is how a page ends up quietly lying about how much it's showing. */
  .questions-header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .author-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px 5px 5px;
    border-radius: 999px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .author-chip:hover { transform: translateY(-1px); }
  .author-chip:active { transform: translateY(0) scale(0.97); }
  .author-chip-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    background: var(--studio-color, rgba(255, 255, 255, 0.2));
  }
  .author-chip-clear { font-size: 11px; opacity: 0.65; }

  /* ======================================================================
     Share mode — the gallery area (not a separate page) swaps into a
     writing surface, then a small in-place "weave" moment, then back.
     ====================================================================== */
  .feed-main, .share-viewport, .designers-viewport {
    transition: opacity 0.3s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .mode-fade-out { opacity: 0; transform: scale(0.98); pointer-events: none; }

  .share-viewport {
    position: relative;
    height: calc(100vh - 98px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  .share-viewport .step {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    opacity: 1;
    transform: translateY(0) scale(1);
    transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .share-viewport .step.is-out { opacity: 0; transform: translateY(-9px) scale(0.993); pointer-events: none; }
  .share-viewport .step.is-pre-in { opacity: 0; transform: translateY(9px) scale(0.993); }
  /* reverse direction (weave -> compose, via "Share another"): mirrors
     is-out/is-pre-in so going back reads as an undo, not a repeat */
  .share-viewport .step.is-out-reverse { opacity: 0; transform: translateY(9px) scale(0.993); pointer-events: none; }
  .share-viewport .step.is-pre-in-reverse { opacity: 0; transform: translateY(-9px) scale(0.993); }

  /* ---------- STEP 1 — compose ---------- */
  .compose-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 48px max(6vw, 28px) 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .compose-inner { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 24px; }

  .compose-intro h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 40px;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
    color: var(--ink);
  }
  .compose-intro p { margin: 0; max-width: 540px; font-size: 14.5px; line-height: 1.72; color: var(--ink-dim); }

  .field { display: flex; flex-direction: column; }
  .field-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .field-label .optional { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink-faint); opacity: 0.75; }

  .field-title input {
    width: 100%;
    border: none;
    border-bottom: 1.5px solid var(--border-strong);
    background: transparent;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 30px;
    padding: 4px 2px 14px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.3s ease;
  }
  .field-title input:focus { border-color: var(--ink); }
  .field-title input::placeholder { color: var(--ink-faint); font-weight: 500; }

  .type-picker { display: flex; gap: 10px; flex-wrap: wrap; }
  .type-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-dim);
    cursor: pointer;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .type-pill svg { width: 15px; height: 15px; }
  .type-pill:hover { border-color: var(--border-strong); color: var(--ink); transform: translateY(-1px); }
  .type-pill:active { transform: translateY(0) scale(0.97); }
  .type-pill.is-active { border-color: var(--ink); color: var(--ink); background: rgba(20, 20, 20, 0.05); }

  .share-viewport textarea {
    width: 100%;
    min-height: 80px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--ink);
    background: #ffffff;
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .share-viewport textarea:focus { border-color: var(--border-strong); box-shadow: 0 4px 16px -8px rgba(20, 20, 20, 0.12); }
  .share-viewport textarea::placeholder { color: var(--ink-faint); }

  .tag-input-wrap {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #ffffff;
    transition: border-color 0.3s ease;
  }
  .tag-input-wrap:focus-within { border-color: var(--border-strong); }
  .tag-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 500;
    padding: 5px 8px 5px 12px;
    border-radius: 999px;
    background: rgba(20, 20, 20, 0.05);
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .tag-chip button { border: none; background: transparent; color: inherit; cursor: pointer; font-size: 12px; line-height: 1; padding: 2px; opacity: 0.55; }
  .tag-chip button:hover { opacity: 1; }
  #tagInput {
    flex: 1;
    min-width: 140px;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    padding: 5px 4px;
    color: var(--ink);
  }
  #tagInput::placeholder { color: var(--ink-faint); }

  .upload-dropzone {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 22px 20px;
    border: 1.5px dashed var(--border-strong);
    border-radius: 16px;
    background: rgba(20, 20, 20, 0.015);
    color: var(--ink-faint);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.3s ease, background 0.3s ease, color 0.3s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .upload-dropzone:hover { border-color: var(--ink-dim); color: var(--ink-dim); background: rgba(20, 20, 20, 0.03); transform: translateY(-1px); }
  .upload-dropzone:focus-visible { outline: 2px solid var(--ink-dim); outline-offset: 2px; }
  .upload-dropzone svg { width: 22px; height: 22px; }
  /* actively dragging a file over the zone — a clearer highlight than :hover
     alone, so the drop target reads as "yes, here" while a file is over it */
  .upload-dropzone.is-dragover { border-color: var(--ink); background: rgba(20, 20, 20, 0.045); color: var(--ink-dim); }
  /* icon + hint text used to be direct flex children of .upload-dropzone
     (stacked in its flex column); wrapping them so the preview media could
     be a plain sibling means this wrapper needs the same column layout */
  .upload-dropzone-default { display: flex; flex-direction: column; align-items: center; gap: 8px; }

  /* item 7 fix — a `background-image` div instead of an <img object-fit>,
     matching the same technique every other image-bearing card in this app
     already uses (see .card-media.has-image): a plain <img> with
     object-fit inside a non-positioned ancestor was clipping inconsistently
     for some source images, which is what read as "upload turns blank". */
  .upload-preview-media { display: none; width: 100%; height: 170px; border-radius: 14px; background-size: cover; background-position: center; }
  .upload-dropzone.has-preview {
    padding: 0;
    border-style: solid;
    border-color: var(--border);
    overflow: hidden;
  }
  .upload-dropzone.has-preview:hover { border-color: var(--border-strong); }
  .upload-dropzone.has-preview .upload-dropzone-default { display: none; }
  .upload-dropzone.has-preview .upload-preview-media { display: block; }

  /* Replace/Remove — always-visible controls once an image is in, so the
     border/frame plus these two buttons keep the upload area unmistakable
     even when it's showing a photo rather than the empty dashed state. */
  .upload-preview-actions {
    position: absolute;
    right: 10px;
    bottom: 10px;
    z-index: 2;
    display: none;
    gap: 8px;
  }
  .upload-dropzone.has-preview .upload-preview-actions { display: flex; }
  .upload-action-btn {
    padding: 7px 13px;
    border-radius: 999px;
    border: none;
    background: rgba(15, 15, 12, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 11.5px;
    font-weight: 650;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .upload-action-btn:hover { background: rgba(15, 15, 12, 0.75); transform: translateY(-1px); }
  .upload-action-btn-remove:hover { background: #b91c1c; }

  /* ---------- attachments (item 8) — a second, separate dropzone: file
     name/icon/size in a plain list instead of a visual preview, since these
     are meant to be opened (a PDF, a doc), not looked at inline. ---------- */
  .attachment-dropzone { padding: 16px 20px; }
  .attachment-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .attachment-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
  }
  .attachment-item-icon {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(20, 20, 20, 0.06);
    color: var(--ink-dim);
  }
  .attachment-item-icon svg { width: 15px; height: 15px; }
  .attachment-item-info { flex: 1; min-width: 0; }
  .attachment-item-name {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .attachment-item-size { font-size: 11px; color: var(--ink-faint); }
  .attachment-item-remove {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    border-radius: 7px;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .attachment-item-remove:hover { color: var(--ink-dim); background: rgba(20, 20, 20, 0.06); }
  .attachment-item-remove svg { width: 13px; height: 13px; }

  /* ---------- Attachments as shown in a card's own detail view ---------- */
  .attachments-list-wrap { display: flex; flex-direction: column; gap: 8px; }
  .attachment-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .attachment-link:hover { border-color: var(--border-strong); background: rgba(20, 20, 20, 0.02); }
  .qd-attachments:not(:empty) { margin-top: 10px; }

  .compose-footer { flex-shrink: 0; padding: 18px max(6vw, 28px) 22px; border-top: 1px solid var(--border); background: var(--surface); }
  .compose-footer-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .compose-hint { font-size: 12.5px; color: var(--ink-faint); }

  /* ---------- shared buttons (compose + weave) ---------- */
  .btn-weave {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    border-radius: 999px;
    border: none;
    background: var(--ink);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 650;
    letter-spacing: 0.01em;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: 0 14px 30px -14px rgba(20, 20, 20, 0.4);
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease, opacity 0.3s ease;
  }
  .btn-weave:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -14px rgba(20, 20, 20, 0.45); }
  .btn-weave:active { transform: translateY(0) scale(0.97); }
  .btn-weave:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-weave svg { width: 14px; height: 14px; }

  .btn-ghost {
    padding: 12px 20px;
    border-radius: 999px;
    border: 1.5px solid var(--border-strong);
    background: transparent;
    color: var(--ink-dim);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .btn-ghost:hover { border-color: var(--ink); color: var(--ink); background: rgba(20, 20, 20, 0.03); transform: translateY(-1px); }
  .btn-ghost:active { transform: translateY(0) scale(0.97); }

  /* ---------- STEP 2/3 — the weave ---------- */
  .step-weave { padding: 0; }
  .weave-canvas-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 42%, rgba(55, 138, 221, 0.05), transparent 60%),
      radial-gradient(ellipse 55% 45% at 78% 30%, rgba(216, 90, 48, 0.04), transparent 60%),
      radial-gradient(ellipse 55% 45% at 30% 78%, rgba(29, 158, 117, 0.04), transparent 60%);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .weave-canvas-wrap.is-pulsing { transform: scale(1.015); }
  #weaveCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .weave-caption {
    position: absolute;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 16px;
    color: var(--ink-dim);
    opacity: 0;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .weave-caption.is-visible { opacity: 1; }
  .weave-confirm {
    flex-shrink: 0;
    text-align: center;
    padding: 24px max(6vw, 28px) 36px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .weave-confirm.is-visible { opacity: 1; transform: translateY(0); }
  .weave-confirm-inner { max-width: 560px; margin: 0 auto; }
  .weave-confirm h2 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 23px; letter-spacing: -0.005em; margin: 0 0 8px; color: var(--ink); }
  .weave-confirm p { margin: 0 0 20px; font-size: 13px; color: var(--ink-faint); }
  .weave-actions { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="sidebar-footer" id="sidebarFooter">
  <a class="sidebar-item" id="backToLobbyBtn" href="loom_lobby.html">
    <span class="sidebar-item-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6.5" r="1.8" fill="currentColor" stroke="none"/>
        <circle cx="18" cy="7.5" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="9.5" cy="17.5" r="1.6" fill="currentColor" stroke="none"/>
        <circle cx="18" cy="17" r="1.3" fill="currentColor" stroke="none"/>
        <path d="M6 6.5L9.5 17.5M6 6.5L18 7.5M9.5 17.5L18 17M18 7.5L18 17"/>
      </svg>
    </span>
    <span class="sidebar-item-label" id="backToLobbyLabel"></span>
  </a>
</div>

<div class="menu-overlay" id="menuOverlay">
  <button type="button" class="menu-close" id="menuCloseBtn" aria-label="Close">✕</button>
  <nav class="menu-list" id="menuList"></nav>
</div>

<div class="toast" id="toast"></div>

<div class="app is-transitioning" id="app">
  <header class="topbar">
    <button type="button" class="hamburger-btn" id="menuToggleBtn" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand-mini">Loom</div>
    <div class="topbar-right" id="topbarRight">
      <div class="lang-switcher" id="langSwitcher">
        <button class="lang-btn" id="langBtn" type="button">
          <span id="langBtnLabel">English</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="lang-menu" id="langMenu"></div>
      </div>
      <button type="button" class="share-btn" id="shareKnowledgeBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span id="shareBtnLabel"></span>
      </button>
    </div>
  </header>

  <main class="feed-main" id="feedMain">
   <!-- The three floors stacked in one transform-driven stage — see the
        .feed-stage CSS and goToFloor() for why this isn't a scroll container. -->
   <div class="feed-stage" id="feedStage">
    <!-- ---------- Discover: one full-width banner, newest-first, autoplaying
         through the same top-N slice — "other studios just shared this" is
         the first thing feed shows, and it fills the whole top of the page ---------- -->
    <section class="discover-section">
      <div class="discover-header">
        <h2 class="discover-heading" id="discoverHeading"></h2>
        <p class="discover-sub" id="discoverSub"></p>
      </div>
      <div class="discover-hero" id="discoverHero">
        <div class="hero-slides" id="heroSlides"></div>
        <button type="button" class="hero-arrow hero-arrow-prev" id="heroPrevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button type="button" class="hero-arrow hero-arrow-next" id="heroNextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <div class="hero-dots" id="heroDots"></div>
      </div>
    </section>

    <!-- ---------- Browse (tier 2): finished, testable knowledge only —
         Project/Experiment. Questions live one tier down instead, so this
         row never mixes "done" work with "still open" work. ---------- -->
    <section class="browse-section">
      <div class="browse-header">
        <div>
          <h3 class="browse-heading" id="browseHeading"></h3>
          <p class="browse-sub" id="browseSub"></p>
        </div>
        <div class="browse-controls" id="browseControls">
          <!-- only present while a person is picked in Designers -->
          <button type="button" class="author-chip" id="authorChipBrowse" style="display:none;">
            <span class="author-chip-avatar" id="authorChipBrowseAvatar"></span>
            <span class="author-chip-label" id="authorChipBrowseLabel"></span>
            <span class="author-chip-clear">✕</span>
          </button>
          <div class="search-wrap">
            <input id="searchInput" type="text" autocomplete="off" />
          </div>
          <div class="filter-divider"></div>
          <div class="studio-filter" id="studioFilter"></div>
          <div class="type-filter-dropdown" id="typeFilterDropdown">
            <button type="button" class="type-filter-btn" id="typeFilterBtn">
              <span class="type-filter-btn-icon" id="typeFilterBtnIcon"></span>
              <span id="typeFilterBtnLabel"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="type-filter-menu" id="typeFilterMenu"></div>
          </div>
        </div>
      </div>
      <div class="browse-track-wrap" id="browseTrackWrap">
        <div class="browse-track" id="browseGrid"></div>
      </div>
      <p class="browse-empty" id="browseEmpty" style="display:none;"></p>
    </section>

    <!-- ---------- Questions (tier 3): what studios are actively stuck on
         right now, pulled out into its own tier on purpose — nothing here
         is finished, so it reads differently on sight, not just by label. ---------- -->
    <section class="questions-section">
      <div class="questions-header">
        <div>
          <h3 class="questions-heading" id="questionsHeading"></h3>
          <p class="questions-sub" id="questionsSub"></p>
        </div>
        <div class="questions-header-right">
          <button type="button" class="author-chip" id="authorChipQuestions" style="display:none;">
            <span class="author-chip-avatar" id="authorChipQuestionsAvatar"></span>
            <span class="author-chip-label" id="authorChipQuestionsLabel"></span>
            <span class="author-chip-clear">✕</span>
          </button>
          <div class="questions-count" id="questionsCount"></div>
        </div>
      </div>
      <!-- the only floor whose content can genuinely run long: it scrolls
           inside itself rather than making the floor taller than a viewport -->
      <div class="floor-scroll questions-scroll" id="questionsScroll">
        <div class="questions-grid" id="questionsGrid"></div>
        <p class="questions-empty" id="questionsEmpty" style="display:none;"></p>
      </div>
    </section>
   </div>
  </main>

  <!-- ---------- Designers: who is actually weaving this, grouped by studio.
       A sibling surface of the feed rather than a fourth floor — it isn't
       knowledge, it's the people behind it, and it shouldn't sit in the same
       vertical sequence as the three knowledge tiers. ---------- -->
  <section class="designers-viewport" id="designersViewport" style="display:none;">
    <button class="expanded-close designers-close" id="designersCloseBtn" aria-label="Close">✕</button>

    <div class="designers-head">
      <div class="designers-intro">
        <h1 id="designersHeading"></h1>
        <p id="designersIntro"></p>
      </div>
    </div>

    <div class="designers-stage-wrap">
      <!-- One studio on screen at a time; the arrows are the only way across,
           so it never reads as two rosters side by side to be compared. They
           live inside the stage rather than the whole surface so "vertically
           centred" means centred on the card row, not on a viewport whose top
           half is taken up by the heading. -->
      <button type="button" class="studio-nav studio-nav-prev" id="studioPrevBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button type="button" class="studio-nav studio-nav-next" id="studioNextBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>

      <div class="designers-stage" id="designersStage"></div>
    </div>

    <!-- The studio caption sits under the faces it names, not above them: you
         look at the people first, then read whose they are. -->
    <div class="studio-bar">
      <div class="studio-pager-current">
        <span class="studio-pager-mark" id="studioPagerMark"></span>
        <span class="studio-pager-name" id="studioPagerName"></span>
        <span class="studio-pager-you" id="studioPagerYou"></span>
      </div>
      <!-- only rendered visible on your own studio (see canEditRoster) -->
      <button type="button" class="roster-edit-toggle" id="rosterEditToggle" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20h4l10.5-10.5a2 2 0 0 0-2.8-2.8L5 17.2z"/><path d="M13.5 6.5l4 4"/>
        </svg>
        <span id="rosterEditLabel"></span>
      </button>
    </div>

    <!-- ---------- add / edit one person ---------- -->
    <div class="designer-editor" id="designerEditor" style="display:none;">
      <div class="designer-editor-scrim" id="designerEditorScrim"></div>
      <div class="designer-editor-card" role="dialog" aria-modal="true">
        <h3 id="designerEditorTitle"></h3>

        <!-- two columns: the photo is the biggest decision on this form, so it
             gets its own half instead of a thumbnail wedged above the fields -->
        <div class="editor-body">
          <div class="editor-photo-col">
            <div class="editor-photo-label" id="editorPhotoLabel"></div>
            <!-- doubles as the crop control once a photo is in — see
                 refreshEditorPhoto, which adds .is-focal-draggable -->
            <div class="editor-photo-zone" id="editorPhotoZone" role="button" tabindex="0">
              <span class="editor-photo-fallback" id="editorPhotoFallback"></span>
              <span class="focal-hint" id="editorPhotoDragHint" style="display:none;"></span>
            </div>
            <p class="editor-photo-hint" id="editorPhotoHint"></p>
            <div class="editor-photo-actions">
              <button type="button" class="btn-ghost-sm" id="editorPhotoPickBtn"></button>
              <button type="button" class="btn-ghost-sm" id="editorPhotoRemoveBtn" style="display:none;"></button>
            </div>
          </div>

          <div class="editor-form-col">
            <div class="editor-field">
              <div class="editor-field-label" id="editorNameLabel"></div>
              <input type="text" id="editorNameInput" autocomplete="off" />
            </div>
            <div class="editor-field">
              <div class="editor-field-label" id="editorRoleLabel"></div>
              <input type="text" id="editorRoleInput" autocomplete="off" />
            </div>

            <!-- Populated from DESIGNER_LINK_KINDS so adding a kind needs no
                 markup change. Every one is optional; blanks are simply never
                 rendered on the card back. -->
            <div class="editor-links">
              <div class="editor-field-label" id="editorLinksLabel"></div>
              <div class="editor-links-grid" id="editorLinksGrid"></div>
            </div>
          </div>
        </div>
        <input type="file" id="editorPhotoInput" accept="image/*" style="display:none;" />

        <div class="editor-actions">
          <button type="button" class="delete-link editor-delete-link" id="editorDeleteBtn" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-.8 12.1a1 1 0 0 1-1 .9H8.8a1 1 0 0 1-1-.9L7 7"/>
            </svg>
            <span id="editorDeleteLabel"></span>
          </button>
          <span class="editor-actions-spacer"></span>
          <button type="button" class="btn-ghost-sm" id="editorCancelBtn"></button>
          <button type="button" class="btn-weave editor-save" id="editorSaveBtn"><span id="editorSaveLabel"></span></button>
        </div>

        <div class="editor-delete-confirm" id="editorDeleteConfirm" style="display:none;">
          <p id="editorDeleteConfirmText"></p>
          <div class="delete-confirm-actions">
            <button type="button" class="btn-ghost-sm" id="editorDeleteCancelBtn"></button>
            <button type="button" class="btn-delete-confirm" id="editorDeleteConfirmBtn"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="share-viewport" id="shareViewport" style="display:none;">
    <button class="expanded-close" id="shareCloseBtn" aria-label="Close">✕</button>

    <div class="step step-compose" id="stepCompose">
      <div class="compose-scroll">
        <div class="compose-inner">
          <div class="compose-intro">
            <h1 id="composeHeading"></h1>
            <p id="composeIntro"></p>
          </div>

          <div class="field field-title">
            <input id="titleInput" type="text" autocomplete="off" />
          </div>

      { title: 'Eine Belohnung vor dem Bezahlbildschirm steigerte die Slot-Conversion um 12 Prozentpunkte', summary: 'Ein winziger Belohnungsmoment vor der Kaufwand veränderte alles.', problem: '92% der neuen Spieler öffneten in ihrer ersten Sitzung nie den Zahlungsbildschirm.', tried: 'Wir bauten in den ersten drei Spins einen Beinahe-Gewinn ein und zeigten direkt nach dem Tutorial ein Banner für einen 3-fachen Erstkaufbonus.', result: 'Die Zahlungs-Conversion in der ersten Sitzung stieg um 12 Prozentpunkte, mit anhaltend besserer Retention. Zu aufdringliche Bonus-Texte wirkten sich jedoch negativ aus — die Abwanderung stieg wieder leicht an.' },
      { title: 'Spielfeldgröße im Merge-Game getestet: Ist 6x6 wirklich optimal?', summary: 'Ein größeres Feld bedeutet nicht automatisch mehr Spaß.', problem: 'Wir gingen davon aus, dass ein größeres Spielfeld einfach längere Sitzungen bedeutet — ohne das je zu testen.', tried: 'Wir liefen 6x6, 7x7 und 8x8 zwei Wochen lang parallel als A/B/C-Kohorten und maßen Sitzungsdauer, Abwanderung und Löschzeit.', result: 'Bei Sitzungsdauer wie Zufriedenheit gewann 7x7. 8x8 ging nach hinten los — die Ermüdung erhöhte den frühen Abbruch.' },
      { title: 'Suche Studio für gemeinsamen Test von Cross-Promo-Bannern', summary: 'Wir brauchen ein Partnerstudio, um das richtig zu testen.', problem: 'Unsere eigene Spielerbasis ist zu klein, um den Cross-Promo-Effekt statistisch belastbar zu bestätigen.', tried: 'Wir verlinkten zunächst drei unserer eigenen Titel gegenseitig, um eine interne Klickrate als Basis zu ermitteln.', result: 'Wir erreichten intern eine Basis-CTR von 1,8%. Jetzt möchten wir echte studioübergreifende Platzierungen mit einem Partner testen.' },
      { title: 'Zeitpunkt von Push-Benachrichtigungen vs. Rückkehrrate', summary: 'Wann du fragst, zählt genauso viel wie was du sendest.', problem: 'Wir haben den Versandzeitpunkt geraten, statt ihn zu testen.', tried: 'Dieselbe Kohorte wurde vier Wochen lang in Pendel-, Mittags- und Abendfenster für den Versand aufgeteilt.', result: 'Abendliche Sendungen (20-21 Uhr) gewannen klar bei der Rückkehrrate. Push-Nachrichten zur Pendelzeit erhöhten sogar die Abmeldungen von Benachrichtigungen.' },
      { title: 'Ein 3-tägiger Teaser schlägt einen Event-Start ohne Vorlauf', summary: 'Vorfreude ist ein Feature, keine Verzögerung.', problem: 'Live-Events ohne Vorankündigung zu starten führte zu schwacher Teilnahme am ersten Tag.', tried: 'Wir begannen drei Tage vor Event-Start mit „Demnächst"-Bannern inklusive Belohnungsvorschau.', result: 'Die Teilnahme am ersten Tag stieg merklich. Zu früh angeteasert, entsteht allerdings eine eigene Ermüdung.' },
      { title: 'Den Tutorial-Skip-Button verzögern statt verstecken', summary: 'Gib Spielern die Wahl — nur nicht sofort.', problem: 'Den Skip-Button ganz zu entfernen erhöhte den frühen Abbruch.', tried: 'Wir behielten den Button, verzögerten sein Erscheinen aber bis Schritt zwei, statt ihn sofort zu zeigen.', result: 'Der Abbruch sank und auch Beschwerden erfahrener Spieler nahmen ab. Wahlfreiheit zu bieten, ohne sie vorzuziehen, war wichtiger als erwartet.' },
      { title: 'Der tägliche Login-Kalender: Schwung statt Serien', summary: 'Für tägliche Gewohnheiten schlägt Schwung Bestrafung.', problem: 'Das Zurücksetzen der Serie bestrafte Spieler so hart, dass viele nach nur einem verpassten Tag ganz aufhörten, sich einzuloggen.', tried: 'Wir fügten ein einmaliges „Gnaden"-Token hinzu, das einen verpassten Tag schützt, und stellten den Kalender auf kumulativen Fortschritt statt auf einen strikten Serienzähler um.', result: 'Die 30-Tage-Aktivrate verbesserte sich, und Support-Anfragen zum Thema „verlorene Serie" verschwanden fast vollständig.' },
      { title: 'Verändert eine sichtbare Fortschrittsleiste die Merge-Sitzungsdauer?', summary: 'Eine flüssige Leiste zählt mehr als die Leiste selbst.', problem: 'Wir wussten nicht, ob das Anzeigen des Baufortschritts Spieler wirklich länger bei der Stange hielt.', tried: 'Wir testeten zwei Wochen lang eine dauerhaft sichtbare Fortschrittsleiste gegen gar keine Anzeige.', result: 'Die Fortschrittsleisten-Gruppe spielte merklich längere Sitzungen — aber nur, wenn sie sich flüssig füllte. Eine ruckelnde Animation schadete mehr, als keine Anzeige zu haben.' },
      { title: 'Test der Belohnungs-Reveal-Geschwindigkeit in Casual-Puzzle-Leveln', summary: 'Schneller ist bei der Zufriedenheit nicht immer schlechter.', problem: 'Belohnungsanimationen fühlten sich an, als würden sie den Kern-Loop verlangsamen, aber wir hatten es nie gemessen.', tried: 'Wir verglichen ein 0,6-Sekunden-Reveal mit einer 1,4-Sekunden-Version über abgeglichene Kohorten hinweg.', result: 'Das schnellere Reveal erhöhte die Level pro Sitzung, ohne dass die gefühlte Belohnungszufriedenheit in Umfragen sank.' },
      { title: 'Suche Partner zum Benchmarking von Responsible-Gaming-UX-Mustern', summary: 'Ein unterstützender Ton braucht einen gemeinsamen Vergleichsmaßstab.', problem: 'Unsere Ausgabenlimit- und Cool-down-Hinweise sollen unterstützend statt strafend wirken, aber wir haben nur eigene Daten zum Vergleich.', tried: 'Wir dokumentierten unsere aktuellen Hinweistexte, deren Timing und Opt-in-Raten als Ausgangsbasis.', result: 'Die Basis-Opt-in-Rate liegt bei 34%. Wir suchen andere Studios, die Ansätze vergleichen und teilen möchten, was Spielerfrust wirklich reduziert.',

let currentLang = 'en';
function t() { return TRANSLATIONS[currentLang].ui; }
function ct(index) { return TRANSLATIONS[currentLang].cards[index]; }

// Relative-time phrasing differs enough across languages (word order,
// pluralization rules) that each gets its own small formatter instead of
// forcing everything through one interpolation pattern.
const TIME_UNIT_FORMS = {
  en: { day: ['day', 'days'], week: ['week', 'weeks'], month: ['month', 'months'] },
  de: { day: ['Tag', 'Tagen'], week: ['Woche', 'Wochen'], month: ['Monat', 'Monaten'] },
};
const TIME_UNIT_WORDS_KO = { day: '일', week: '주', month: '개월' };
const TIME_UNIT_WORDS_TR = { day: 'gün', week: 'hafta', month: 'ay' };

function formatRelativeTime(lang, value, unit) {
  if (lang === 'ko') return `${value}${TIME_UNIT_WORDS_KO[unit]} 전`;
  if (lang === 'tr') return `${value} ${TIME_UNIT_WORDS_TR[unit]} önce`;
  if (lang === 'de') {
    const forms = TIME_UNIT_FORMS.de[unit];
    return `vor ${value} ${value === 1 ? forms[0] : forms[1]}`;
  }
  const forms = TIME_UNIT_FORMS.en[unit];
  return `${value} ${value === 1 ? forms[0] : forms[1]} ago`;
}

   2. Data — change this array to change the cards. Studio/type/area/author
      /time/appliedBy never change with language; translatable copy lives
      in TRANSLATIONS[lang].cards at the same index.

// `enabled: false` keeps a studio's config, sample cards, and weave cluster
// in the code (so turning it back on later is a one-line flip) while
// removing every trace of it from the screen — same pattern as the
// `enabled` flag on loom_lobby.html's STUDIOS array. Paxie's collaboration
// isn't confirmed yet, so it stays off here too.
const STUDIOS = {
  // `logo` is probed before it is used (see buildStudioMark) — a studio with no
  // file on disk falls back to its colour dot rather than a broken tile.
  doubleu: { name: 'DoubleU', color: '#378ADD', enabled: true, logo: 'assets/doubleu-logo.png' },
  whow: { name: 'Whow', color: '#D85A30', enabled: true, logo: 'assets/whow-logo.png' },
  paxie: { name: 'Paxie', color: '#1D9E75', enabled: false },
};

function isStudioEnabled(key) {
  return !!(STUDIOS[key] && STUDIOS[key].enabled);
}

// Applied-by lists are authored alongside disabled studios too (e.g. a
// DoubleU card that Paxie also applied) — filter those mentions out at
// display time rather than hand-editing every appliedBy array.
function visibleAppliedBy(data) {
  return data.appliedBy.filter(isStudioEnabled);
}

/* Which studio "you" are, for this session: whichever button you pressed in
   loom_lobby.html, which writes it here on the way out. Drives the author on
   anything you share, and in Designers both the studio shown first and which
   roster you're allowed to edit.

   TODO(auth): in a real service this comes from the signed-in account, and
   the edit permission is enforced server-side. localStorage is user-writable,
   so it can stand in for "who am I" in a prototype but could never be the
   basis for an authorisation decision. */
const CURRENT_STUDIO_STORAGE_KEY = 'loom_current_studio';

function readCurrentStudioKey() {
  let stored = null;
  try {
    stored = localStorage.getItem(CURRENT_STUDIO_STORAGE_KEY);
  } catch (err) { /* storage blocked — fall through to the default */ }
  // Validated, not trusted: a stale or hand-edited value for a studio that's
  // been switched off (see STUDIOS.enabled) must not leave the page pointing
  // at a studio it won't render.
  if (stored && isStudioEnabled(stored)) return stored;
  return Object.keys(STUDIOS).find(isStudioEnabled) || 'doubleu';
}

const MY_STUDIO_KEY = readCurrentStudioKey();

function designerLinkHref(kind, value) {
  if (kind === 'email') return 'mailto:' + value;
  return /^https?:\/\//i.test(value) ? value : 'https://' + value;
}

// The address for an email, otherwise the bare host+path — so a pasted
// "https://behance.net/x" doesn't shout its protocol on the card.
function designerLinkText(kind, value) {
  if (kind === 'email') return value;
  return value.replace(/^https?:\/\//i, '').replace(/\/$/, '');
}

function designerLinkEntries(person) {
  const links = (person && person.links) || {};
  return DESIGNER_LINK_KINDS
    .map((k) => ({ kind: k.key, icon: k.icon, value: (links[k.key] || '').trim() }))
    .filter((entry) => entry.value);
}

const DESIGNERS_STORAGE_KEY = 'loom_designers_v1';

// Once a studio has edited anything, the stored list is the whole truth for
// every studio — not a patch on top of the seed. Otherwise deleting a seeded
// designer would resurrect them on the next load.
function loadDesigners() {
  try {
    const parsed = JSON.parse(localStorage.getItem(DESIGNERS_STORAGE_KEY));
    if (Array.isArray(parsed)) return parsed;
  } catch (err) {
    console.error('[Loom feed] could not read the designer roster from localStorage:', err);
  }
  return DEFAULT_DESIGNERS.map((d) => Object.assign({}, d));
}

let designerRoster = loadDesigners();

function persistDesigners() {
  try {
    localStorage.setItem(DESIGNERS_STORAGE_KEY, JSON.stringify(designerRoster));
    return true;
  } catch (err) {
    // Photos are downscaled hard on the way in (see DESIGNER_PHOTO_MAX_DIM),
    // so this should not happen — but a full origin budget must be said out
    // loud rather than leaving an edit that quietly won't survive a reload.
    console.error('[Loom feed] could not persist the designer roster:', err);
    showToast(t().designers.saveFailed);
    return false;
  }
}

// A studio's roster is that studio's own to edit. The check is here rather
// than sprinkled through the UI so there's one place to point a real
// permission at later.
// TODO(auth): server-side authorisation on the signed-in account. A
// client-side comparison decides what to *show*, never what's allowed.
function canEditRoster(studioKey) {
  return studioKey === MY_STUDIO_KEY;
}
