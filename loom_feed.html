  .conversation-message-body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .conversation-message.is-me .conversation-message-body { align-items: flex-end; }
  .conversation-avatar {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    margin-top: 18px; /* sits beside the bubble, not beside the name above it */
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--speaker-color, var(--ink));
    color: #ffffff;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .conversation-message-meta { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-faint); }
  .conversation-message-meta .card-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .conversation-message-author { font-weight: 650; color: var(--ink-dim); }
  .conversation-message-bubble {
    background: rgba(20, 20, 20, 0.045);
    border-radius: 14px;
    padding: 11px 15px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink);
  }
  .conversation-message.is-me .conversation-message-bubble { background: var(--ink); color: #ffffff; }
  .conversation-message.is-entering { opacity: 0; transform: translateY(8px); animation: conversationMessageIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  @keyframes conversationMessageIn { to { opacity: 1; transform: translateY(0); } }

  .conversation-input-row {
    flex-shrink: 0;
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  #conversationInput {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.25s ease;
  }
  #conversationInput:focus { border-color: var(--border-strong); }
  #conversationInput::placeholder { color: var(--ink-faint); }
  .conversation-send-btn {
    flex-shrink: 0;
    padding: 10px 18px;
    border-radius: 999px;
    border: none;
    background: var(--ink);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 650;
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
  }
  .conversation-send-btn:hover { transform: translateY(-1px); }
  .conversation-send-btn:active { transform: translateY(0) scale(0.96); }

  .brief-header {
    flex-shrink: 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .brief-header-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .brief-ai-label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--studio-color, var(--ink-dim));
  }
  .brief-updated { font-size: 11px; color: var(--ink-faint); transition: opacity 0.2s ease; }

  .brief-body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 22px; transition: opacity 0.25s ease; }
  .brief-body.is-updating { opacity: 0.45; }
  .brief-section { margin-bottom: 18px; }
  .brief-section:last-child { margin-bottom: 0; }
  .brief-section .label {
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
    margin-bottom: 7px;
  }
  .brief-section p { margin: 0; font-size: 13px; line-height: 1.62; color: rgba(28, 28, 30, 0.8); }
  .brief-section ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.62; color: rgba(28, 28, 30, 0.8); }
  .brief-section li.is-new { animation: conversationMessageIn 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
  .brief-empty { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-faint); font-style: italic; }

  /* narrow modal: the brief collapses behind a tab instead of sitting
     side-by-side — a container query so this is about the MODAL's own
     width, not the browser window's. */
  /* 1080px, matching the knowledge detail's own stacking point — this was 720
     when the question detail was a modal sized to ~86% of the window, so the
     container only ever got that narrow on a small screen. Fullscreen, the
     container IS the window, and at 900px the brief was down to 340px of
     bulleted text beside a 560px conversation: two columns too narrow to be
     two columns. */
  @container question-detail (max-width: 1080px) {
    .question-tabs { display: flex; }
    .question-panes { grid-template-columns: 1fr; }
    .question-pane-conversation { border-right: none; }
    .question-pane { display: none; }
    .question-pane.is-active-tab { display: flex; }
  }

  /* ======================================================================
     Threads — the whole weave on one white screen.

     Same world as the feed, not the lobby: the lobby's dark sky is the place
     you choose a studio from, and this is a page about the work itself. So it
     is paper, and the only colour on it is the two studio colours.

     SVG rather than canvas. Twenty nodes and fifty marks is nowhere near
     needing a canvas, and in SVG the hover states are CSS, the labels are real
     text at real weights, and a node is a DOM node you can put a listener on.
     ====================================================================== */
  /* A floor, not a surface: height and overflow come from the shared floor rule
     above, and all this adds is the column the head and the map sit in. It was
     `position: fixed; inset: 0` when it was reached from the menu; inside the
     stage that would have pinned it to the viewport and left it behind while the
     other floors slid. */
  .threads-section {
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* The heading is given room and then gets out of the way: this page is one
     image, and a title competing with it would make it a slide. */
  .threads-head {
    flex: 0 0 auto;
    /* Less top room than the surface version had: arriving here by wheel means
       floor 3 has just left upward, and the eye is already at the top of the
       screen rather than needing to be walked down to it. */
    padding: clamp(34px, 4.6vh, 62px) 56px clamp(2px, 0.8vh, 12px);
    text-align: center;
  }
  .threads-head h1 {
    margin: 0;
    /* Cormorant Garamond, not Newsreader: Cormorant is the serif this build
       actually loads, and it is the voice floor 3's questions are set in. */
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(36px, 3.6vw, 58px);
    font-weight: 600;
    letter-spacing: -0.005em;
    line-height: 1.05;
    color: var(--ink);
  }
  .threads-head p {
    margin: clamp(8px, 1.2vh, 15px) 0 0;
    font-size: clamp(12.5px, 0.95vw, 14.5px);
    letter-spacing: 0.015em;
    color: var(--ink-faint);
  }

  .threads-stage { position: relative; flex: 1 1 auto; min-height: 0; }

  /* ---------- floor 4's footer ----------
     The wordmark, and the one line that says what the weave above it is. Fixed
     like the other chrome rather than in the floor's flow: the map wants every
     pixel of the stage, and a footer inside it would take a band out of the
     middle of the composition. Only shown on floor 4 (see updateChrome). */
  .threads-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .threads-footer.is-visible { opacity: 1; transform: none; }
  .threads-footer-line {
    margin: 0;
    font-size: 12.5px;
    letter-spacing: 0.015em;
    color: var(--ink-faint);
  }
  /* .threads-footer-mark's type lives in the shared wordmark rule next to
     .brand-footer (top of the stylesheet) — one voice, on purpose. */
  /* Width and height are stated outright, and that matters more than it looks.

     An <svg> with no width/height attributes takes its intrinsic size from its
     viewBox aspect ratio. Sizing it with `top: 0; bottom: 58px` instead left the
     height indefinite, so it derived one — and since layoutThreads writes the
     viewBox from the measured box, the two fed each other: a first measurement
     of zero clamped the viewBox to the 360x320 minimum, the svg then sized
     itself to 1600x1422 from that ratio, and half the weave was laid out below
     the floor.

     The 58px is the footer's lane, kept in step with THREAD_FOOTER_LANE in the
     script. */
  .threads-svg {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: calc(100% - 58px);
    overflow: visible;
  }

  /* ---------- one thread ----------
     Thicker than a hairline and coloured along its length, because the page is
     about weaving and a 1px grey line is a diagram. Each thread carries a
     gradient from the studio colour at one end to the studio colour at the
     other (see linkGradientFor), so a thread between the two studios is
     literally blue running into orange — the page's argument drawn rather than
     annotated. */
  .threads-link {
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    opacity: 0.5;
    transition: opacity 0.42s ease, stroke-width 0.42s ease;
  }
  /* Between the studios rather than inside one: the reason the page exists, so
     it is the one thing drawn at full strength. */
  .threads-link.is-crossing { stroke-width: 2.7; opacity: 0.92; }

  /* the one line that says the words are doors — shown until the reader has
     opened one, then never again (see markThreadsHintSeen) */
  .threads-hint {
    margin: 10px 0 0;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
    text-align: center;
  }

  /* ---------- one keyword ----------
     The word IS the node. No plate, no ring, no chip — a circle with a label
     hanging off it was the single thing that made this read as a chart. What
     sits behind the word is a bloom of the colour of whoever is working on it,
     and nothing else. */
  .threads-node { cursor: pointer; }
  .threads-glow { pointer-events: none; }
  /* transparent fill still receives events; `visible` would not be enough on a
     shape with no paint */
  .threads-hit { pointer-events: all; }
  /* pointer, not grab: a word is first of all a door to its thread, and the
     pointer is the one cursor everybody reads as "this opens". Dragging still
     works — the cursor switches to grabbing the moment a word is actually
     held (see .is-dragging below). No text selection mid-drag either way. */
  .threads-node { cursor: pointer; }
  .threads-svg.is-dragging { cursor: grabbing; user-select: none; }
  .threads-svg.is-dragging .threads-node { cursor: grabbing; }
  /* the held word loses the arrival/focus easing so it tracks the pointer
     exactly rather than lagging behind it */
  .threads-svg.is-dragging .threads-recede { transition: opacity 0.42s ease; }
  .threads-node-label {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    fill: var(--ink);
    text-anchor: middle;
    pointer-events: none;
    /* Size is set per node in buildThreadsGraph, across a range narrow enough
       that a busy keyword reads as busy and never as senior. */
  }
  .threads-node-count {
    font-family: 'Inter', sans-serif;
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    fill: var(--ink-faint);
    text-anchor: middle;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.34s ease;
  }
  .threads-node:hover .threads-node-count,
  .threads-node.is-open .threads-node-count { opacity: 1; }
  /* The bloom breathes a little under the pointer — the only hover flourish on
     the page, and it is the same gesture the whole map is already making. */
  .threads-glow-shape { transition: opacity 0.42s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
  .threads-node:hover .threads-glow-shape,
  .threads-node.is-open .threads-glow-shape { opacity: 1; transform: scale(1.09); }
  /* and the word itself steps forward — enough to say "press me", small
     enough that the map does not wobble as the pointer crosses it */
  .threads-node:hover .threads-recede { transform: scale(1.05); }

  /* ---------- one piece of writing ----------
     A mark per card, ringed around the word in its studio's colour, each with
     its own soft halo so the ring reads as light rather than as tick marks. */
  .threads-dot { cursor: pointer; transition: r 0.3s ease; }
  .threads-dot-halo { pointer-events: none; }
  .threads-node:hover .threads-dot { r: 4.4; }

  /* ---------- focus ----------
     Hovering a word asks "what does this touch?", so everything that is not an
     answer steps back — dimmer and very slightly smaller, which reads as depth
     rather than as being switched off. Three nested groups, one transform each:
     drift writes to the outer, arrival to the middle, this to the inner, and
     none of them can overwrite another. */
  .threads-recede { transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.42s ease; }
  .threads-svg.is-focusing .threads-node:not(.is-lit) .threads-recede { opacity: 0.17; transform: scale(0.93); }
  .threads-svg.is-focusing .threads-link:not(.is-lit) { opacity: 0.08; }
  .threads-svg.is-focusing .threads-link.is-lit { opacity: 1; }

  /* ---------- arrival ----------
     The words rise on a stagger, then the threads are drawn between them left
     to right — a dashoffset the length of each path, released in order of where
     the thread starts. It should read as weaving, not as a map loading. */
  .threads-rise { opacity: 0; transform: translateY(16px) scale(0.93); }
  .threads-rise.is-in {
    opacity: 1;
    transform: none;
    transition: opacity 0.7s ease, transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .threads-link.is-drawing { transition: stroke-dashoffset 1.15s cubic-bezier(0.33, 0, 0.2, 1); }
  @media (prefers-reduced-motion: reduce) {
    .threads-rise { opacity: 1; transform: none; }
    .threads-link { stroke-dasharray: none !important; stroke-dashoffset: 0 !important; }
  }

  .threads-tip {
    position: absolute;
    z-index: 4;
    max-width: 300px;
    padding: 7px 11px;
    border-radius: 9px;
    background: rgba(20, 20, 20, 0.92);
    color: #fff;
    font-size: 11.5px;
    line-height: 1.4;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -100%);
    transition: opacity 0.18s ease;
  }
  .threads-tip.is-on { opacity: 1; }
  .threads-tip-studio { opacity: 0.62; }

  .threads-empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 0 40px;
  }
  .threads-empty-line {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(19px, 1.9vw, 27px);
    color: var(--ink);
  }
  .threads-empty-sub { margin: 0; font-size: 13px; color: var(--ink-faint); max-width: 34ch; }

  /* ---------- the story of one keyword ---------- */
  .threads-story {
    position: absolute;
    /* against the floor now, not the window — the floor is the positioned
       ancestor, so this rides with it as the stage translates */
    top: 0;
    right: 0;
    bottom: 0;
    width: min(410px, 34vw);
    z-index: 5;
    display: flex;
    flex-direction: column;
    /* The notification bell is fixed chrome on every surface and sits exactly
       where this panel's own close button wanted to be. Starting the head below
       it is cheaper than moving a control that is in the same place everywhere
       else in the app — and the extra air suits the serif anyway. */
    padding: clamp(64px, 8vh, 84px) clamp(24px, 2.2vw, 34px) 26px;
    border-left: 1px solid var(--border);
    background: rgba(252, 251, 248, 0.95);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transform: translateX(100%);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.36s ease;
  }
  .threads-story.is-open { transform: none; opacity: 1; pointer-events: auto; }

  .threads-story-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  .threads-story-word {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(24px, 2.2vw, 33px);
    font-weight: 600;
    line-height: 1.14;
    letter-spacing: -0.005em;
    color: var(--ink);
  }
  .threads-story-meta { margin-top: 5px; font-size: 11.5px; color: var(--ink-faint); }
  .threads-story-close {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .threads-story-close:hover { background: rgba(20, 20, 20, 0.06); color: var(--ink); }
  .threads-story-close svg { width: 13px; height: 13px; }
  .threads-story-lead {
    margin: 16px 0 4px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
  }
  .threads-story-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    margin: 0 -10px;
    padding: 8px 10px 0;
    display: flex;
    flex-direction: column;
  }
  /* The rail is the thread, drawn down the left of the list: the panel is a
     chain in time, and the numbered order is the whole point of it. */
  .threads-story-item {
    position: relative;
    display: block;
    width: 100%;
    /* the rail runs the height of the list, so the rows sit tighter than they
       would as separate cards — this is one chain, not five entries */
    text-align: left;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 11px 10px 13px 26px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    transition: background 0.2s ease;
  }
  .threads-story-item:hover { background: rgba(20, 20, 20, 0.045); }
  .threads-story-item::before {
    content: '';
    position: absolute;
    left: 9px;
    top: 17px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--item-studio, var(--ink));
  }
  /* every item but the last carries the line down to the next */
  .threads-story-item::after {
    content: '';
    position: absolute;
    left: 12px;
    top: 26px;
    bottom: -2px;
    width: 1px;
    background: rgba(20, 20, 20, 0.13);
  }
  .threads-story-item:last-child::after { display: none; }
  .threads-story-title { font-size: 13.5px; font-weight: 550; line-height: 1.4; color: var(--ink); letter-spacing: -0.002em; }
  .threads-story-sub { margin-top: 3px; font-size: 11px; color: var(--ink-faint); }
  /* The author's own line, in the serif the rest of their writing is set in —
     it is a quotation inside a list, and the switch of voice is what says so. */
  .threads-story-line {
    margin-top: 6px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    line-height: 1.45;
    color: var(--ink-dim);
  }
  /* A relation the author declared, as opposed to the shared word that put the
     row in this list at all. Worth marking because it is the stronger claim. */
  .threads-story-rel {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(20, 20, 20, 0.055);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
  }

  @media (max-width: 900px) {
    /* the panel becomes a sheet across the foot rather than a column */
    .threads-story {
      top: auto;
      width: auto;
      left: 0;
      right: 0;
      max-height: 58%;
      border-left: none;
      border-top: 1px solid var(--border);
      transform: translateY(100%);
    }
  }

  /* ======================================================================
     Designers — who is weaving this, one studio per screen.

     Deliberately a roster and not a scoreboard: nothing on a card can be
     compared against the next card (photo, name, job title, how to reach them
     — that's all), nothing is ordered by output, no card says how much anyone
     has shared, and the two studios are never on screen together to be read
     side by side. See the DESIGNERS comment in the script for why this is a
     rule and not a style choice.

     The screen is sized to fill rather than to sit politely in the middle of
     itself: the roster IS the content here, so the cards take the height and
     the studio arrows go out to the edges of the viewport where there is room
     to make them obvious.
     ====================================================================== */
  /* ================= Thread view =================
     A column, not a grid. The point of the screen is that one subject reads
     as one conversation, and a grid of cards is the opposite of that — it
     asks the eye to compare rather than to follow. So: one measure, items
     separated by rule and rhythm, type carrying the difference between an
     update and a project instead of a container doing it.

     Tuning lives here: --thread-measure is the reading width, and the rest
     follows from it. */
  .thread-view {
    --thread-measure: 620px;
    /* how far the weave steps back while the panel is up */
    --thread-dim: rgba(250, 248, 244, 0.55);
    --thread-blur: 5px;
    position: fixed;
    inset: 0;
    /* under the expanded card (100): opening a piece from the panel puts the
       card on top, and closing it lands back on the panel */
    z-index: 90;
    display: none;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 4vh, 40px) 16px;
  }
  .thread-backdrop {
    position: absolute;
    inset: 0;
    background: var(--thread-dim);
    -webkit-backdrop-filter: blur(var(--thread-blur));
    backdrop-filter: blur(var(--thread-blur));
    opacity: 0;
    transition: opacity 0.24s ease;
  }
  .thread-view.is-open .thread-backdrop { opacity: 1; }
  /* The panel. It GROWS OUT OF the word that was clicked — transform-origin
     is set to the node's screen position by openThreadView — so the thread
     visibly comes from its place on the map rather than arriving from
     nowhere. */
  .thread-panel {
    position: relative;
    width: min(760px, 94vw);
    height: min(84vh, 900px);
    border-radius: 22px;
    background: var(--paper-browse);
    border: 0.5px solid var(--border);
    box-shadow: 0 48px 110px -32px rgba(20, 20, 20, 0.4);
    overflow: hidden;
    transform: scale(0.55);
    opacity: 0;
    transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
  }
  .thread-view.is-open .thread-panel { transform: scale(1); opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .thread-panel { transition: opacity 0.2s ease; transform: none; }
    .thread-backdrop { transition: none; }
  }
  .thread-close {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 2;
  }
  .thread-view-scroll {
    height: 100%;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: clamp(44px, 6vh, 64px) 28px 72px;
  }
  .thread-head,
  .thread-composer,
  .thread-flow,
  .thread-people {
    width: min(var(--thread-measure), 100%);
    margin-inline: auto;
  }

  .thread-title {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(34px, 4.4vw, 56px);
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  /* one line, and only what is actually known — see threadMetaLine */
  .thread-meta {
    margin: 12px 0 0;
    font-size: 13px;
    letter-spacing: 0.01em;
    color: var(--ink-dim);
  }

  .thread-composer { margin-top: clamp(26px, 4vh, 42px); }
  .thread-composer input {
    width: 100%;
    padding: 15px 20px;
    border-radius: 14px;
    border: 1px solid var(--border-strong);
    background: rgba(255, 255, 255, 0.72);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink);
  }
  .thread-composer input::placeholder { color: var(--ink-faint); }
  .thread-composer input:disabled { cursor: default; }

  .thread-flow { margin-top: clamp(28px, 4.5vh, 46px); }
  /* an item is a block of text with a label, not a card */
  .thread-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-top: 1px solid var(--border);
    padding: 22px 0 24px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .thread-item:hover { background: rgba(255, 255, 255, 0.5); }
  .thread-item-top {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  /* the format, as a word in front of the line rather than a section it
     lives in */
  .thread-kind {
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--item-studio, var(--ink-dim));
  }
  .thread-who {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--ink-dim);
  }
  .thread-when {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--ink-faint);
    margin-left: auto;
  }
  .thread-item-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(19px, 2vw, 24px);
    font-weight: 600;
    line-height: 1.3;
    color: var(--ink);
  }
  .thread-item-body {
    margin: 8px 0 0;
    font-size: 14px;
    line-height: 1.62;
    color: rgba(28, 28, 30, 0.74);
  }
  /* a project brings its cover, small: enough to recognise the deck, not
     enough to become the item */
  .thread-item-with-cover { display: flex; gap: 18px; align-items: flex-start; }
  .thread-cover {
    flex: 0 0 auto;
    width: 132px;
    height: 84px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background-color: #fff;
    background-size: cover;
    background-position: center;
  }
  .thread-cover.is-doc { background-size: contain; background-repeat: no-repeat; }
  .thread-item-text { min-width: 0; }

  /* where this came from, under the item it belongs to — not a section of
     its own, because lineage is a property of a piece of work */
  .thread-rel {
    display: block;
    margin-top: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--ink-faint);
  }

  /* a question's walk-through: asked / learned / decided. The labels are
     small and step aside; the content is the row. */
  .thread-qa { margin-top: 10px; display: grid; gap: 9px; }
  .thread-qa-row { display: grid; grid-template-columns: 74px 1fr; gap: 12px; align-items: baseline; }
  .thread-qa-label {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
    padding-top: 2px;
  }
  .thread-qa-value {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.6;
    color: rgba(28, 28, 30, 0.74);
  }

  /* answers hang off their question */
  .thread-answers {
    margin: 12px 0 0 18px;
    padding-left: 16px;
    border-left: 2px solid var(--border-strong);
  }
  .thread-answer {
    padding: 8px 0;
    font-size: 13.5px;
    line-height: 1.58;
    color: rgba(28, 28, 30, 0.7);
  }
  .thread-answer-who {
    font-family: 'Inter', sans-serif;
    font-size: 11.5px;
    color: var(--ink-faint);
    margin-right: 7px;
  }

  /* only rendered when two or more people are actually in this thread */
  .thread-people {
    margin-top: clamp(34px, 5vh, 56px);
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }
  .thread-people[hidden] { display: none; }
  .thread-people-label {
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-right: 4px;
  }
  .thread-person {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px 5px 6px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.6);
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    color: var(--ink);
  }
  .thread-person-dot { width: 7px; height: 7px; border-radius: 50%; margin-left: 5px; }

  .designers-viewport {
    position: relative;
    height: var(--floor-h);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    /* heading, card row and studio caption are one block, centred as a whole.
       sizeAllRosters() keeps that block inside the surface, which is what makes
       centring safe here rather than clipping the top. */
    justify-content: center;
    background: var(--bg);
  }

  /* ---------- heading ---------- */
  .designers-head {
    flex-shrink: 0;
    padding: 0 max(6vw, 28px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .designers-intro h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(38px, 4vw, 62px);
    line-height: 1.04;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin: 0 0 8px;
  }
  .designers-intro p {
    margin: 0;
    font-size: clamp(13.5px, 1.05vw, 16px);
    line-height: 1.5;
    color: var(--ink-dim);
  }

  /* ---------- big edge arrows ----------
     Pinned to the left and right edges of the viewport and vertically centred,
     well clear of the card row (see .designers-panel's side padding, which
     reserves the lane they sit in). No plate behind them: at this size a white
     disc would read as a button floating over the roster rather than as a
     direction to go in. */
  .studio-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    width: clamp(38px, 3.4vw, 54px);
    height: clamp(38px, 3.4vw, 54px);
    border: none;
    background: transparent;
    padding: 0;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 0.3s ease, transform 0.36s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
  }
  .studio-nav svg { width: 100%; height: 100%; }
  .studio-nav:focus { outline: none; }
  .studio-nav:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 12px; }
  .studio-nav-prev { left: clamp(20px, 2.6vw, 48px); }
  .studio-nav-next { right: clamp(20px, 2.6vw, 48px); }
  .studio-nav:hover { color: var(--ink); transform: translateY(-50%) scale(1.12); }
  .studio-nav-prev:hover { transform: translateY(-50%) scale(1.12) translateX(-3px); }
  .studio-nav-next:hover { transform: translateY(-50%) scale(1.12) translateX(3px); }
  .studio-nav:active { transform: translateY(-50%) scale(0.95); }
  /* one studio, nowhere to go — the arrows go away rather than sit there dead */
  .designers-viewport.is-single-studio .studio-nav { display: none; }
  /* and in edit mode: the Add tile is a fourth card-sized tile, and four of
     them plus an arrow lane on each side would squeeze the cards well below the
     size this screen is built around. So the arrows stand down and give the row
     the room. The trade is that you press Done before you can move to another
     studio — acceptable, because edit mode is an explicit, focused state on
     your own studio and the other studio isn't editable anyway. */
  .designers-viewport.is-editing .studio-nav { display: none; }

  /* ---------- the sliding stage ---------- */
  .designers-stage-wrap {
    position: relative; /* the edge arrows anchor to this, not the viewport */
    flex: 0 1 auto;
    min-height: 0;
    overflow: hidden;
    display: flex;
  }
  .designers-stage {
    display: flex;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    transition: transform 0.72s cubic-bezier(0.19, 1, 0.22, 1);
  }
  .designers-panel {
    flex: 0 0 100%;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    /* the side padding is the lane the edge arrows live in — a card must never
       end up underneath one */
    padding: clamp(14px, 2vh, 28px) clamp(84px, 7vw, 130px) clamp(16px, 2.2vh, 30px);
    transition: padding 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    /* A studio bigger than fits stays one fixed row and scrolls sideways; it
       never turns into an auto-flowing track. The bar itself is hidden: the
       panel's width and padding are both animated (sliding between studios,
       entering edit mode), and every frame where the content is a pixel wider
       than the box would otherwise flash a scrollbar across the screen. */
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior: contain;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .designers-panel::-webkit-scrollbar { width: 0; height: 0; display: none; }
  /* no arrow lane to leave clear once the arrows are gone */
  .designers-viewport.is-editing .designers-panel {
    padding-left: clamp(36px, 4vw, 84px);
    padding-right: clamp(36px, 4vw, 84px);
  }

  /* Fixed, not a flowing track: the whole studio is on screen at once, and the
     row takes as much height as the screen will give it.

     The height is written by sizeAllRosters() rather than declared here: a
     card's width follows from its height (aspect-ratio), so the row has to be
     sized against the *narrower* of the two constraints, and how many tiles are
     in it is only known at render time — turning edit mode on adds one. CSS
     can't see that count, so it can't do this arithmetic. */
  .designer-roster {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: clamp(16px, 1.6vw, 36px);
    height: 100%;
    margin: auto; /* keeps a short row centred once the panel can scroll */
    transition: height 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Three cards need ~590px at their readable floor (ROSTER_MIN_H) and a phone
     gives the row about 220 — so on a narrow screen it overflows, and centred
     overflow puts the first and last card off opposite edges of the screen with
     no way to get to either. Scrolling the row is the smallest honest fix: the
     cards stay legible and nothing is unreachable. Left-aligned because a centred
     flex row's left overflow cannot be scrolled to.

     Swiping the row sideways does not fight the studio swipe, which is vertical
     only — see the touchmove axis lock in the Designers wiring. */
  @media (max-width: 820px) {
    .designer-roster {
      justify-content: flex-start;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }
    .designer-roster::-webkit-scrollbar { display: none; }
    .designers-panel { padding-left: 22px; padding-right: 22px; }
  }

  /* ---------- the card, and its two faces ----------
     Hover turns the card over: the portrait on the front, how to reach the
     person on the back. The card itself carries no border or background — each
     face does — or the frame would sit in front of whichever face is turned
     away. Height-first: the card takes the row's height and derives its width
     from the 1:1.4 ratio, so a shorter window shrinks the whole row evenly
     instead of overflowing. */
  .designer-card {
    position: relative;
    height: 100%;
    aspect-ratio: 1 / 1.4;
    flex: 0 0 auto;
    perspective: 1400px;
    font-family: 'Inter', sans-serif;
    cursor: default;
    transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .designer-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.66s cubic-bezier(0.32, 1, 0.3, 1);
  }
  /* :focus-within so tabbing to a link on the back turns the card and keeps it
     turned — otherwise the thing you are focused on is facing away from you */
  .designer-card:hover .designer-card-inner,
  .designer-card:focus-within .designer-card-inner { transform: rotateY(180deg); }
  /* And on a touch screen, where there is no hover at all: without this the back
     of every card — the role, what they are working on, what they can help with,
     what they last shared, how to reach them — was simply unreachable on a phone.
     A tap sets this; see the coarse-pointer branch in buildDesignerCard. */
  .designer-card.is-flipped .designer-card-inner { transform: rotateY(180deg); }
  /* while a studio is arranging its roster the card is an object, not something
     to read: it stays face-up and the whole surface opens the editor */
  .designer-card.is-editing { cursor: grab; }
  .designer-card.is-editing .designer-card-inner { transform: none; }
  /* ---------- reordering (edit mode, mouse drag) ----------
     The motion constants live in ONE place: ROSTER_DRAG_ANIM_MS / _EASE /
     _SCALE in the drag JS, which writes --roster-drag-ms / --roster-drag-ease
     here at startup. The card in hand follows the pointer raw (its transform
     is set with NO transition — the hand comes first); everything else
     slides: siblings FLIP between slots, the lift shadow is an ::after whose
     opacity fades in and out (transform/opacity only, no layout, no painted
     box-shadow animation on the card itself). */
  .designer-card.is-dragging,
  .designer-card.is-settling {
    cursor: grabbing;
    z-index: 6;
  }
  .designer-card.is-dragging { opacity: 0.94; }
  .designer-card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 26px; /* the face's own radius */
    box-shadow: 0 20px 48px rgba(20, 20, 20, 0.24);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--roster-drag-ms, 220ms) var(--roster-drag-ease, ease-out);
  }
  .designer-card.is-dragging::after { opacity: 1; }
  body.is-roster-dragging { cursor: grabbing; user-select: none; }

  .designer-face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    border-radius: 26px;
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transition: box-shadow 0.34s ease, border-color 0.3s ease;
  }
  .designer-card:hover .designer-face { box-shadow: var(--shadow-hover); border-color: var(--border-strong); }
  .designer-card.is-active .designer-face { border-color: var(--ink); }
  .designer-face-back { transform: rotateY(180deg); }

  /* A real photo when there is one, a studio-tinted initials panel when there
     isn't — identical box either way, so a studio filling in photos over time
     never reflows the roster.

     Absolutely filling the card, not a flex row above the label: centred in the
     *photo box* put the initials well above the card's real centre, because the
     box stopped where the name/role bar began. Filling the card also lets a
     real photo bleed behind that bar instead of being cut off square at it. */
  .designer-photo {
    position: absolute;
    inset: 0;
    border-radius: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(46px, 6vw, 104px);
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1;
    color: var(--studio-color, var(--ink));
    background: var(--studio-tint, rgba(20, 20, 20, 0.05));
    background-size: cover;
    background-position: center;
  }
  .designer-photo.has-photo { color: transparent; }

  .designer-card-text {
    position: relative; /* above the photo, which now fills the card */
    margin-top: auto;
    background: var(--surface);
    padding: clamp(16px, 2.2vh, 26px) clamp(18px, 1.7vw, 28px) clamp(18px, 2.4vh, 28px);
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }
  /* Two lines rather than an ellipsis. Truncating a person's name at 25px on a
     card that is mostly empty space is the one place clipping is least
     defensible — "A Person With A Remarkably Long N…" is not their name. The
     clamp still stops a pathological entry from pushing the role off the card. */
  .designer-name {
    font-size: clamp(17px, 1.5vw, 25px);
    font-weight: 650;
    line-height: 1.2;
    color: var(--ink);
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .designer-role {
    font-size: clamp(12.5px, 1vw, 16px);
    color: var(--ink-dim);
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* What they are in the middle of, on the front, under the role. Marked with
     the studio's colour so it reads as current rather than as a second title. */
  .designer-now {
    margin-top: 2px;
    padding-left: 9px;
    border-left: 2px solid var(--studio-color, var(--ink-faint));
    font-size: clamp(11px, 0.85vw, 13px);
    line-height: 1.35;
    color: var(--ink-faint);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ---------- the back face ----------
     Everything here has to fit without scrolling. A card that grows a scrollbar
     the moment you hover it is a card that flinches, and the bar itself lands
     on top of the link text — the one thing you turned the card over to read.
     Five links is the ceiling (DESIGNER_LINK_KINDS), so the metrics below are
     sized against exactly that. */
  .designer-face-back {
    justify-content: flex-start;
    gap: clamp(9px, 1.4vh, 15px);
    padding: clamp(16px, 2.2vh, 28px) clamp(15px, 1.5vw, 24px);
    overflow: hidden;
  }
  .designer-back-head { flex-shrink: 0; min-width: 0; }
  .designer-back-head .designer-name { white-space: normal; font-size: clamp(15px, 1.3vw, 21px); }
  .designer-back-head .designer-role { margin-top: 3px; white-space: normal; font-size: clamp(11.5px, 0.9vw, 14px); }

  /* Working on / Can help with / Recently shared — the three reasons to write
     to somebody, above the addresses you would write to. */
  .designer-fact { flex-shrink: 0; min-width: 0; }
  .designer-fact-label {
    font-size: clamp(8.5px, 0.62vw, 9.5px);
    letter-spacing: 0.13em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-faint);
    margin-bottom: 3px;
  }
  .designer-fact-value {
    font-size: clamp(11px, 0.85vw, 13px);
    line-height: 1.4;
    color: var(--ink);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* The contact block is now the tail of the card, so it gets a rule above it
     rather than a heading competing with the three that matter. */
  .designer-contact-label {
    flex-shrink: 0;
    margin-top: auto;
    padding-top: clamp(8px, 1.2vh, 12px);
    border-top: 1px solid var(--border);
  }

  .designer-links {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-height: 0;
    overflow: hidden; /* no scrollbar, in either axis, ever */
    margin: 0 -6px;
    padding: 0 6px;
  }
  .designer-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: clamp(4px, 0.7vh, 7px) 8px;
    margin: 0 -8px;
    border-radius: 9px;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: clamp(10.5px, 0.82vw, 12.5px);
    line-height: 1.3;
    flex-shrink: 0;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .designer-link:hover { background: rgba(20, 20, 20, 0.05); color: var(--ink); }
  .designer-link-icon { flex-shrink: 0; display: flex; color: var(--studio-color, var(--ink-dim)); }
  .designer-link-icon svg { width: clamp(12px, 1vw, 15px); height: clamp(12px, 1vw, 15px); }
  .designer-link-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* the only thing on this screen that navigates — deliberately a button you
     have to aim at, not the whole card (see buildDesignerCard) */
  .designer-see-work {
    flex-shrink: 0;
    margin-top: auto;
    padding: clamp(7px, 1.1vh, 11px) 14px;
    border-radius: 999px;
    border: 1.5px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: clamp(11px, 0.9vw, 12.5px);
    font-weight: 650;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .designer-see-work:hover { background: var(--ink); color: #fff; transform: translateY(-1px); }
  .designer-see-work:active { transform: translateY(0) scale(0.97); }

  /* the pencil only exists on your own studio, and only once edit mode is on —
     browsing another studio's people should look like reading, not like a form
     you happen to lack permission for */
  .designer-edit-btn {
    position: absolute;
    z-index: 2; /* above .designer-card-inner, which is a 3D context */
    top: 14px;
    right: 14px;
    width: clamp(34px, 2.8vw, 46px);
    height: clamp(34px, 2.8vw, 46px);
    border-radius: 50%;
    border: none;
    background: rgba(20, 20, 20, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.24s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), background 0.24s ease;
  }
  .designer-edit-btn svg { width: 44%; height: 44%; }
  .designer-card:hover .designer-edit-btn,
  .designer-edit-btn:focus-visible { opacity: 1; transform: scale(1); }
  .designer-edit-btn:hover { background: var(--ink); }

  /* the add tile matches a card's footprint exactly so turning edit mode on
     doesn't resize the row */
  .designer-add-card {
    height: 100%;
    aspect-ratio: 1 / 1.4;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 30px;
    border-radius: 26px;
    border: 1.5px dashed var(--border-strong);
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: clamp(13px, 1.1vw, 17px);
    font-weight: 650;
    color: var(--ink-dim);
    cursor: pointer;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease, transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .designer-add-card svg { width: clamp(32px, 3vw, 48px); height: clamp(32px, 3vw, 48px); }
  .designer-add-card:hover { border-color: var(--ink); color: var(--ink); background: rgba(20, 20, 20, 0.02); transform: translateY(-6px); }
  .designer-add-card:active { transform: translateY(-2px) scale(0.99); }

  .designer-roster-empty {
    font-size: 15px;
    color: var(--ink-faint);
    text-align: center;
    align-self: center;
  }

  /* ---------- the studio caption ----------
     Below the roster, not above it: you look at the people first, then read
     whose they are. It reads as a caption too — the studio's mark, its name in
     the serif at display size, and the "yours" note as a small-caps aside.
     Nothing is boxed. */
  .studio-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 2.4vw, 34px);
    padding: clamp(10px, 1.6vh, 20px) max(6vw, 28px) clamp(14px, 2.2vh, 28px);
  }
  .studio-pager-current {
    display: flex;
    align-items: baseline;
    gap: clamp(10px, 1vw, 16px);
    min-width: 0;
  }
  /* the studio's logo where a colour dot used to be — a real mark reads as
     identity in a way a coloured circle never quite does. buildStudioMark()
     falls back to that circle when there is no file for a studio. */
  .studio-pager-mark {
    align-self: center;
    flex-shrink: 0;
    width: clamp(24px, 2vw, 32px);
    height: clamp(24px, 2vw, 32px);
    border-radius: 50%;
    background-color: var(--studio-tint, rgba(20, 20, 20, 0.06));
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.45s ease;
  }
  .studio-mark-dot {
    width: 42%;
    height: 42%;
    border-radius: 50%;
    background: var(--studio-color, var(--ink-dim));
  }
  .studio-pager-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(26px, 2.4vw, 40px);
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--ink);
    white-space: nowrap;
  }
  /* the quiet "this one's yours" marker — the same signal the edit toggle
     depends on, said in words so it isn't only implied by a button appearing */
  .studio-pager-you {
    font-size: clamp(9.5px, 0.72vw, 11px);
    font-weight: 650;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--studio-color, var(--ink-dim));
    white-space: nowrap;
  }
  .studio-pager-you:empty { display: none; }

  .roster-edit-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 20px 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: clamp(11.5px, 0.9vw, 13px);
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .roster-edit-toggle svg { width: 14px; height: 14px; }
  .roster-edit-toggle:hover { border-color: var(--border-strong); color: var(--ink); background: rgba(20, 20, 20, 0.035); }
  .roster-edit-toggle:active { transform: scale(0.96); }
  .roster-edit-toggle.is-on { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* ---------- add / edit dialog ----------
     Two columns at this size: the photo is the biggest decision on this form,
     so it gets its own half rather than a thumbnail wedged above the fields. */
  .designer-editor { position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .designer-editor-scrim { position: absolute; inset: 0; background: rgba(20, 20, 20, 0.38); }
  .designer-editor-card {
    position: relative;
    width: min(900px, 100%);
    max-height: calc(var(--floor-h) - 48px);
    overflow-y: auto;
    padding: clamp(26px, 3.2vw, 44px);
    border-radius: 28px;
    background: var(--surface);
    box-shadow: var(--shadow-hover);
    display: flex;
    flex-direction: column;
    gap: clamp(20px, 2.4vh, 30px);
  }
  .designer-editor-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(26px, 2.6vw, 38px);
    line-height: 1.1;
    color: var(--ink);
    margin: 0;
  }

  .editor-body {
    display: flex;
    gap: clamp(24px, 3vw, 42px);
    align-items: stretch;
  }
  .editor-photo-col {
    flex: 0 0 auto;
    width: clamp(180px, 18vw, 260px);
    display: flex;
    flex-direction: column;
  }
  .editor-photo-zone {
    position: relative; /* anchors the drag hint */
    width: 100%;
    aspect-ratio: 1 / 1.32;
    border-radius: 20px;
    border: 1.5px dashed var(--border-strong);
    background: var(--studio-tint, rgba(20, 20, 20, 0.04));
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(38px, 4vw, 58px);
    font-weight: 600;
    line-height: 1;
    color: var(--studio-color, var(--ink-faint));
    cursor: pointer;
    transition: border-color 0.25s ease, background-color 0.25s ease;
  }
  .editor-photo-zone.is-dragover { border-color: var(--ink); background-color: rgba(20, 20, 20, 0.06); }
  .editor-photo-zone.has-photo { border-style: solid; border-color: var(--border); color: transparent; }

  /* the fields sit level with the middle of the photo rather than tracking its
     top edge, so the two columns read as one form and not as two stacks */
  .editor-form-col {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(16px, 2vh, 26px);
  }

  .editor-photo-label { font-size: 13px; font-weight: 650; color: var(--ink); margin-bottom: 9px; }
  .editor-photo-hint { margin: 11px 0 13px; font-size: 12.5px; line-height: 1.55; color: var(--ink-faint); }
  .editor-photo-actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: auto; }
  .editor-photo-actions .btn-ghost-sm { padding: 9px 16px; font-size: 12.5px; }

  .editor-field-label { font-size: 13px; font-weight: 650; color: var(--ink); margin-bottom: 8px; }
  .editor-field input {
    width: 100%;
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid var(--border-strong);
    background: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 15.5px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.22s ease;
  }
  .editor-field input:focus { border-color: var(--ink); }
  .editor-field input::placeholder { color: var(--ink-faint); }

  .editor-links { display: flex; flex-direction: column; }
  .editor-links-grid { display: flex; flex-direction: column; gap: 8px; }
  .editor-link-row { display: flex; align-items: center; gap: 10px; }
  .editor-link-row-icon { flex-shrink: 0; display: flex; color: var(--ink-faint); }
  .editor-link-row-icon svg { width: 16px; height: 16px; }
  .editor-link-row input {
    flex: 1 1 auto;
    min-width: 0;
    padding: 10px 13px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.22s ease;
  }
  .editor-link-row input:focus { border-color: var(--ink); }
  .editor-link-row input::placeholder { color: var(--ink-faint); }

  .editor-actions { display: flex; align-items: center; gap: 12px; }
  .editor-actions-spacer { flex: 1 1 auto; }
  .editor-delete-link { padding: 0; font-size: 13px; }
  .editor-actions .btn-ghost-sm { padding: 12px 24px; font-size: 14px; }
  .editor-save { padding: 13px 32px; font-size: 14.5px; }
  .editor-save:disabled { opacity: 0.4; cursor: not-allowed; }
  .editor-delete-confirm {
    padding: 18px 20px;
    border-radius: 18px;
    background: rgba(20, 20, 20, 0.04);
  }
  .editor-delete-confirm p { margin: 0 0 13px; font-size: 13.5px; line-height: 1.55; color: var(--ink-dim); }

  /* ---------- focal-point drag ----------
     A roster tile is a tall 1:1.32 crop of whatever was uploaded, which puts a
     face off-centre far more often than not. Rather than a crop dialog, the
     photo is dragged inside the frame it will actually appear in. */
  .is-focal-draggable { cursor: grab; touch-action: none; }
  .is-focal-draggable.is-dragging-focal { cursor: grabbing; }
  .focal-hint {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.96);
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(15, 15, 12, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: rgba(255, 255, 255, 0.95);
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .focal-hint svg { width: 13px; height: 13px; }
  .is-focal-draggable:hover .focal-hint { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  /* out of the way while you are actually doing the thing it described */
  .is-focal-draggable.is-dragging-focal .focal-hint { opacity: 0; }

  /* ---------- the "you're looking at one person's knowledge" chip ----------
     Appears on the Browse and Questions floors once someone is picked in
     Designers, and is the only way that filter is ever visible — an invisible
     filter is how a page ends up quietly lying about how much it's showing. */
  .author-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px 5px 5px;
    border-radius: 999px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .author-chip:hover { transform: translateY(-1px); }
  .author-chip:active { transform: translateY(0) scale(0.97); }
  .author-chip-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    background: var(--studio-color, rgba(255, 255, 255, 0.2));
  }
  .author-chip-clear { font-size: 11px; opacity: 0.65; }
  /* No avatar, so the label carries the left padding the avatar used to. */
  .keyword-filter-chip { padding-left: 13px; }
  .keyword-filter-label { font-size: 12px; font-weight: 500; }

  /* ======================================================================
     Share mode — the gallery area (not a separate page) swaps into a
     writing surface, then a small in-place "weave" moment, then back.
     ====================================================================== */
  .feed-main, .share-viewport, .designers-viewport {
    transition: opacity 0.3s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .mode-fade-out { opacity: 0; transform: scale(0.98); pointer-events: none; }

  .share-viewport {
    position: relative;
    height: var(--floor-h);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  .share-viewport .step {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    opacity: 1;
    transform: translateY(0) scale(1);
    transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .share-viewport .step.is-out { opacity: 0; transform: translateY(-9px) scale(0.993); pointer-events: none; }
  .share-viewport .step.is-pre-in { opacity: 0; transform: translateY(9px) scale(0.993); }
  /* reverse direction (weave -> compose, via "Share another"): mirrors
     is-out/is-pre-in so going back reads as an undo, not a repeat */
  .share-viewport .step.is-out-reverse { opacity: 0; transform: translateY(9px) scale(0.993); pointer-events: none; }
  .share-viewport .step.is-pre-in-reverse { opacity: 0; transform: translateY(-9px) scale(0.993); }

  /* ---------- STEP 1 — compose ----------
     One screen, no scrolling. This used to be a single column in a scroller,
     which meant that by the time you were writing the last field, the title
     and the type you had picked were both off the top of the window — and
     there was nowhere to show you what you were actually making.

     Everything is sized off the viewport instead. The head and the footer take
     what they need, .compose-body takes the rest, and the textareas inside it
     share whatever that leaves. min-height on the textareas is the floor: they
     never get so short that a sentence is cut off, even if that means the
     window has to be a reasonable size. */
  .step-compose { display: flex; flex-direction: column; height: 100%; min-height: 0; }

  /* 64px of top padding, not 34: the hamburger and the back arrow are fixed at
     y=24 and this heading is the first thing under them. */
  .compose-head { flex-shrink: 0; padding: 64px max(4vw, 26px) 0; }
  .compose-head h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(28px, 3vw, 38px);
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .compose-head p { margin: 0; max-width: 620px; font-size: 13.5px; line-height: 1.6; color: var(--ink-dim); }
  /* a short window spends its height on the fields, not on the preamble */
  @media (max-height: 840px) {
    .compose-head { padding-top: 56px; }
    .compose-head p { display: none; }
  }

  /* 78/22, not 67/33, and a narrower right column: with the preview gone the
     right-hand side is two file pickers, which need a column not a panel. The
     rest goes to the writing, and the generous top padding is the breathing
     room the deleted heading used to occupy — space, rather than a label
     restating what the form obviously is. */
  .compose-body {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 78fr) minmax(248px, 22fr);
    gap: clamp(28px, 3.4vw, 56px);
    padding: clamp(30px, 4.4vh, 58px) max(5vw, 30px) 0;
  }

  .compose-left { min-height: 0; display: flex; flex-direction: column; gap: 16px; }
  .compose-right { min-height: 0; display: flex; flex-direction: column; gap: 16px; }

  /* the per-type fields share the leftover height between them */
  /* The invariant here is: the page never scrolls, and a textarea is never
     shorter than 104px. Those two can conflict — four fields at their floor
     need more height than a 768px window has left after the heading, title,
     type picker and footer — so the field stack, and only the field stack,
     scrolls when it has to. The preview, the type picker and the submit button
     never move, which is the part that actually mattered: you always see what
     you are making and how to finish it.

     At a comfortable window size there is nothing to scroll and this is inert. */
  .compose-fields {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  /* flex: 0 0 auto, and this is the fix for the overlap.

     It was `1 1 auto` with `min-height: 0`, which is the standard incantation
     for a scrollable flex child — and this is not one. With four fields open,
     each wanting a label plus a 132px box, the column asked for more height than
     the pane had; `min-height: 0` let every field shrink below its own contents;
     and a .field has no overflow of its own, so the label and box inside simply
     painted outside it, over the field above. That is what put "WHAT WE'D DO
     DIFFERENTLY" across somebody's third line of text.

     Refusing to shrink pushes the excess onto .compose-fields, which already
     has overflow-y: auto and is the thing that should be scrolling. The
     collapsed state (.has-hidden-extras) and Update mode already said 0 0 auto
     for the same reason; this only ever went wrong once the extra fields were
     open, which is exactly when there is the most to read. */
  .compose-fields .field { flex: 0 0 auto; min-height: 0; }
  .compose-fields textarea {
    flex: 1 1 auto;
    min-height: clamp(104px, 12vh, 132px);
    resize: none;
  }

  .field-type .type-picker, .field-asked-to .asked-to-picker { margin-top: 2px; }

  /* ---------- who a question is addressed to ----------
     Everything here is asked of somebody, and "everyone" is a real answer
     rather than the absence of one — so it is a choice with a default, not a
     checkbox you can leave alone. */
  .asked-to-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .asked-to-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--ink-dim);
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .asked-to-pill:hover { border-color: var(--border-strong); color: var(--ink); }
  .asked-to-pill.is-active { background: var(--ink); border-color: var(--ink); color: #ffffff; }
  .asked-to-pill .card-dot { width: 7px; height: 7px; box-shadow: none; }

  /* ---------- the preview column ---------- */
  /* ---------- the image thumbnail ----------
     All that is left of the live preview: the picture, at a size worth looking
     at, with the framing drag on it. Sized 16:9 because that is the shape floor
     1's banner gives it, and the crop the drag is choosing is mostly about
     which part survives the tall poster card. */
  .image-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: rgba(20, 20, 20, 0.04);
    cursor: pointer;
  }
  .image-thumb-media { position: absolute; inset: 0; }
  .image-thumb-media.has-image-draggable { cursor: grab; }
  .image-thumb-media.is-dragging { cursor: grabbing; }
  /* Says what the drag is for, and gets out of the way while it is happening. */
  .image-thumb-hint {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 7px;
    text-align: center;
    font-size: 10.5px;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.22s ease;
  }
  .image-thumb:hover .image-thumb-hint { opacity: 1; }
  .image-thumb-media.is-dragging ~ .image-thumb-hint { opacity: 0; }
  .file-slot.is-dropping { outline: 2px dashed var(--ink); outline-offset: 3px; border-radius: 12px; }

  /* Reads as a field that exists but is not open yet: the same dashed edge the
     two pickers above it use, at rest, with no hover state and no cursor. The
     "coming soon" note next to the label is what carries the explanation — the
     placeholder is long, and a long placeholder in a disabled box is read once
     and then ignored. */
  /* The wrapper is the target; the input inside it is scenery. pointer-events
     off on the input as well as disabled, so the wrapper gets the click even
     where a browser would have let the input swallow it. */
  .canvas-field { position: relative; cursor: pointer; }
  .canvas-field .canvas-input { pointer-events: none; }
  .canvas-field:hover .canvas-input { border-color: var(--ink-faint); }
  .canvas-field:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 12px; }

  .canvas-input {
    width: 100%;
    /* room on the right for the badge, which is inside the box */
    padding: 11px 90px 11px 14px;
    border: 1px dashed var(--border-strong);
    border-radius: 12px;
    background: transparent;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--ink-dim);
    cursor: pointer;
  }

  /* Small, upper case, and on the field it describes. Not the studio accent and
     not a warning colour: it is a note about timing, not a state to be fixed. */
  .canvas-badge {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(20, 20, 20, 0.07);
    font-family: 'Inter', sans-serif;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--ink-faint);
    pointer-events: none;
  }
  .canvas-input::placeholder { color: var(--ink-faint); }
  .canvas-hint {
    margin: 7px 0 0;
    font-size: 11.5px;
    line-height: 1.45;
    color: var(--ink-faint);
  }
  .canvas-input:disabled { opacity: 1; } /* Safari greys disabled text to unreadable */

  /* Stacked, not side by side: the column is half the width it was, and two
     dashed buttons squeezed next to each other read as one broken control. */
  .compose-attach-row {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(18px, 2.4vh, 28px);
    padding-bottom: 4px;
  }
  .compose-attach-col { min-width: 0; }
  .file-slot { display: flex; flex-direction: column; gap: 7px; }
  .file-slot-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 12px;
    border: 1.5px dashed var(--border-strong);
    border-radius: 12px;
    background: rgba(20, 20, 20, 0.015);
    font-family: inherit;
    font-size: 12px;
    color: var(--ink-faint);
    cursor: pointer;
    text-align: left;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }
  .file-slot-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .file-slot-btn:hover { border-color: var(--ink-dim); color: var(--ink-dim); background: rgba(20, 20, 20, 0.03); }
  .file-slot.is-dragover .file-slot-btn { border-color: var(--ink); background: rgba(20, 20, 20, 0.045); color: var(--ink-dim); }
  .file-slot-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #ffffff;
  }
  .file-slot-name {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-slot-remove {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .file-slot-remove svg { width: 13px; height: 13px; }
  .file-slot-remove:hover { background: rgba(20, 20, 20, 0.07); color: var(--ink); }

  /* the attachment list lives inside its slot now, so it has its own cap
     rather than pushing the footer off the screen */
  #attachmentZone .attachment-list { max-height: 108px; overflow-y: auto; margin-top: 0; }

  /* A four-field type needs about 530px for its boxes, and a 768px-tall window
     has about 440 to give once the heading, title, type picker and footer have
     taken theirs. Something has to give, and it is not the 104px floor — a
     textarea you cannot read two lines in is worse than a short scroll.

     So the field stack scrolls, and only the field stack. The preview, the type
     picker and the submit button stay where they are, which is the part that
     actually mattered about not scrolling: you never lose sight of what you are
     making or how to finish it. */
  /* a short window spends what it has on the fields */
  @media (max-height: 900px) {
    .compose-head h1 { font-size: clamp(24px, 2.4vw, 30px); }
    .compose-body { padding-top: 16px; }
  }

  /* Under this the two panes are too narrow to be two panes: the preview goes
     under the writing and the whole composer becomes one scroller again —
     which is the one case where scrolling beats clipping. */
  @media (max-width: 1080px) {
    .compose-body {
      grid-template-columns: minmax(0, 1fr);
      overflow-y: auto;
      padding-bottom: 20px;
    }
    .compose-fields .field { flex: 0 0 auto; }
  }

  .field { display: flex; flex-direction: column; }
  .field-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 650;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .field-label .optional { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink-faint); opacity: 0.75; }

  .field-title input {
    width: 100%;
    border: none;
    border-bottom: 1.5px solid var(--border-strong);
    background: transparent;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 30px;
    padding: 4px 2px 14px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.3s ease;
  }
  .field-title input:focus { border-color: var(--ink); }
  .field-title input::placeholder { color: var(--ink-faint); font-weight: 500; }

  .type-picker { display: flex; gap: 10px; flex-wrap: wrap; }
  .type-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-dim);
    cursor: pointer;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .type-pill svg { width: 15px; height: 15px; }
  .type-pill:hover { border-color: var(--border-strong); color: var(--ink); transform: translateY(-1px); }
  .type-pill:active { transform: translateY(0) scale(0.97); }
  .type-pill.is-active { border-color: var(--ink); color: var(--ink); background: rgba(20, 20, 20, 0.05); }

  .share-viewport textarea {
    width: 100%;
    /* min-height and resize belong to .compose-fields textarea, which is where
       the per-field sizing is decided. They were here too, at equal
       specificity and later in the file, so they quietly won. */
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--ink);
    background: #ffffff;
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .share-viewport textarea:focus { border-color: var(--border-strong); box-shadow: 0 4px 16px -8px rgba(20, 20, 20, 0.12); }
  .share-viewport textarea::placeholder { color: var(--ink-faint); }

  /* ---------- attachments (item 8) — a second, separate dropzone: file
     name/icon/size in a plain list instead of a visual preview, since these
     are meant to be opened (a PDF, a doc), not looked at inline. ---------- */
  .attachment-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  /* not a link, so it should not look like one */
  .attachment-link.is-unavailable { cursor: default; opacity: 0.6; }
  .attachment-link.is-unavailable:hover { border-color: var(--border); background: transparent; }
  .attachment-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #ffffff;
  }
  .attachment-item-icon {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(20, 20, 20, 0.06);
    color: var(--ink-dim);
  }
  .attachment-item-icon svg { width: 15px; height: 15px; }
  .attachment-item-info { flex: 1; min-width: 0; }
  .attachment-item-name {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .attachment-item-size { font-size: 11px; color: var(--ink-faint); }
  .attachment-item-remove {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    border-radius: 7px;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .attachment-item-remove:hover { color: var(--ink-dim); background: rgba(20, 20, 20, 0.06); }
  .attachment-item-remove svg { width: 13px; height: 13px; }

  /* ---------- Attachments as shown in a card's own detail view ---------- */
  .attachments-list-wrap { display: flex; flex-direction: column; gap: 8px; }
  .attachment-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .attachment-link:hover { border-color: var(--border-strong); background: rgba(20, 20, 20, 0.02); }
  .qd-attachments:not(:empty) { margin-top: 10px; }

  /* the extra right padding is the language switcher's lane: it is fixed in
     that corner on every screen, and the submit button was landing on it */
  /* the "what exists now" block on the completion screen */
  .weave-state {
    margin: 22px auto 26px;
    padding: 18px 22px;
    max-width: 420px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: rgba(20, 20, 20, 0.02);
    text-align: left;
  }
  .weave-state-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .weave-state-row + .weave-state-row { margin-top: 8px; }
  .weave-state-mark {
    flex-shrink: 0;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--border-strong);
  }
  .weave-state-note {
    margin: 14px 0 0;
    padding-top: 13px;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--ink-faint);
  }

  .compose-footer { flex-shrink: 0; padding: 14px max(6vw, 92px) 18px 14px; padding-left: max(4vw, 26px); border-top: 1px solid var(--border); background: var(--surface); }
  .compose-footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .compose-hint { font-size: 12.5px; color: var(--ink-faint); }

  /* ---------- shared buttons (compose + weave) ---------- */
  .btn-weave {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    border-radius: 999px;
    border: none;
    background: var(--ink);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 650;
    letter-spacing: 0.01em;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: 0 14px 30px -14px rgba(20, 20, 20, 0.4);
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease, opacity 0.3s ease;
  }
  .btn-weave:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -14px rgba(20, 20, 20, 0.45); }
  .btn-weave:active { transform: translateY(0) scale(0.97); }
  .btn-weave:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-weave svg { width: 14px; height: 14px; }

  .btn-ghost {
    padding: 12px 20px;
    border-radius: 999px;
    border: 1.5px solid var(--border-strong);
    background: transparent;
    color: var(--ink-dim);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease, transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .btn-ghost:hover { border-color: var(--ink); color: var(--ink); background: rgba(20, 20, 20, 0.03); transform: translateY(-1px); }
  .btn-ghost:active { transform: translateY(0) scale(0.97); }

  /* ---------- STEP 2/3 — the weave ---------- */
  .step-weave { padding: 0; }
  .weave-canvas-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 42%, rgba(55, 138, 221, 0.05), transparent 60%),
      radial-gradient(ellipse 55% 45% at 78% 30%, rgba(216, 90, 48, 0.04), transparent 60%),
      radial-gradient(ellipse 55% 45% at 30% 78%, rgba(29, 158, 117, 0.04), transparent 60%);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .weave-canvas-wrap.is-pulsing { transform: scale(1.015); }
  #weaveCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .weave-caption {
    position: absolute;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 16px;
