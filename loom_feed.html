  weaveCtx.fillStyle = grad;
  weaveCtx.beginPath();
  weaveCtx.arc(x, y, r, 0, Math.PI * 2);
  weaveCtx.fill();
}

function renderWeaveFrame(now) {
  weaveCtx.clearRect(0, 0, canvasSize.w, canvasSize.h);

  const elapsed = weaveStartTime === null ? null : now - weaveStartTime;
  const newPos = wpx(CONFIG.NEW_NODE_POS.x, CONFIG.NEW_NODE_POS.y);
  const rings = activeRipples(elapsed);

  // ---- ambient links (only once both ends have been touched by the ripple) ----
  if (elapsed !== null) {
    ambientLinks.forEach((link) => {
      const a = ambientNodes[link.a], b = ambientNodes[link.b];
      const readyAt = Math.max(a.revealAt || Infinity, b.revealAt || Infinity);
      if (elapsed < readyAt) return;
      const fade = easeOutCubic(clamp01((elapsed - readyAt) / CONFIG.NODE_FADE_IN_DUR));
      const oa = driftOffset(a, now), ob = driftOffset(b, now);
      const pa = wpx(a.rx, a.ry), pb = wpx(b.rx, b.ry);
      drawLine(pa.x + oa.dx, pa.y + oa.dy, pb.x + ob.dx, pb.y + ob.dy, 'rgba(28,28,30,1)', 0.06 * fade, 1);
    });
  }

  // ---- cluster links (same fade-in-on-reveal treatment) ----
  if (elapsed !== null) {
    clusterLinks.forEach((link) => {
      const a = clusterNodes[link.a], b = clusterNodes[link.b];
      const readyAt = Math.max(a.revealAt || Infinity, b.revealAt || Infinity);
      if (elapsed < readyAt) return;
      const fade = easeOutCubic(clamp01((elapsed - readyAt) / CONFIG.NODE_FADE_IN_DUR));
      const oa = driftOffset(a, now), ob = driftOffset(b, now);
      const pa = wpx(a.rx, a.ry), pb = wpx(b.rx, b.ry);
      drawLine(pa.x + oa.dx, pa.y + oa.dy, pb.x + ob.dx, pb.y + ob.dy, link.color, 0.16 * fade, 1.1);
    });
  }

  // ---- new-node connections — each starts once its own target has been
  // reached by the ripple, so the three studio clusters light up in the
  // order the wave actually gets to them, not on a fixed clock ----
  if (elapsed !== null) {
    connectionTargets.forEach((targetIdx, i) => {
      const start = connectStarts[i];
      if (start === undefined || elapsed < start) return;
      const tt = clamp01((elapsed - start) / CONFIG.CONNECT_DUR);
      const eased = easeOutCubic(tt);
      const target = clusterNodes[targetIdx];
      const to = driftOffset(target, now);
      const tp = wpx(target.rx, target.ry);
      const endX = lerp(newPos.x, tp.x + to.dx, eased);
      const endY = lerp(newPos.y, tp.y + to.dy, eased);

      const grad = weaveCtx.createLinearGradient(newPos.x, newPos.y, endX, endY);
      grad.addColorStop(0, `rgba(${NEW_NODE_CORE_RGB}, 0.7)`);
      grad.addColorStop(1, target.color);
      weaveCtx.strokeStyle = grad;
      weaveCtx.globalAlpha = 0.18 + 0.5 * eased;
      weaveCtx.lineWidth = 1.7;
      weaveCtx.beginPath();
      weaveCtx.moveTo(newPos.x, newPos.y);
      weaveCtx.lineTo(endX, endY);
      weaveCtx.stroke();
      weaveCtx.globalAlpha = 1;

      // a bright bead riding the leading edge while the line is still drawing
      if (tt < 1) {
        drawGlow(endX, endY, 7, NEW_NODE_CORE_RGB, 0.55);
      }

      // brief acknowledgement glow at the target once the line arrives
      const sincePulse = elapsed - (start + CONFIG.CONNECT_DUR);
      if (sincePulse >= 0 && sincePulse < CONFIG.CONNECT_PULSE_MS) {
        const pulseT = 1 - sincePulse / CONFIG.CONNECT_PULSE_MS;
        drawGlow(tp.x + to.dx, tp.y + to.dy, target.r * 5 * pulseT, hexToRgb(target.color), 0.35 * pulseT);
      }
    });
  }

  // ---- ambient nodes — fade in as the ripple reaches each one, with an
  // extra flash right as the wavefront passes ----
  if (elapsed !== null) {
    ambientNodes.forEach((node) => {
      if (elapsed < (node.revealAt || Infinity)) return;
      const fade = easeOutCubic(clamp01((elapsed - node.revealAt) / CONFIG.NODE_FADE_IN_DUR));
      const o = driftOffset(node, now);
      const p = wpx(node.rx, node.ry);
      const dist = Math.hypot(p.x - newPos.x, p.y - newPos.y);
      const boost = rippleBoostAt(rings, dist);
      let r = node.r, alpha = 0.34 * twinkle(node, now) * fade;
      if (boost > 0) {
        r *= 1 + boost * 0.8;
        alpha = Math.min(1, alpha + boost);
      }
      drawNodeDot(p.x + o.dx, p.y + o.dy, r, 'rgba(28,28,30,0.9)', alpha);
    });
  }

  // ---- cluster nodes — same fade-in-on-reveal, plus a studio-colored glow
  // the instant the wave touches them ----
  if (elapsed !== null) {
    clusterNodes.forEach((node) => {
      if (elapsed < (node.revealAt || Infinity)) return;
      const fade = easeOutCubic(clamp01((elapsed - node.revealAt) / CONFIG.NODE_FADE_IN_DUR));
      const o = driftOffset(node, now);
      const p = wpx(node.rx, node.ry);
      const dist = Math.hypot(p.x - newPos.x, p.y - newPos.y);
      const boost = rippleBoostAt(rings, dist);
      let r = node.r, alpha = 0.9 * twinkle(node, now) * fade;
      if (boost > 0) {
        drawGlow(p.x + o.dx, p.y + o.dy, node.r * 4.5, hexToRgb(node.color), 0.4 * boost * fade);
        r *= 1 + boost * 0.7;
        alpha = Math.min(1, alpha + boost * 0.6);
      }
      drawNodeDot(p.x + o.dx, p.y + o.dy, r, node.color, alpha);
    });
  }

  // ---- the ripple rings themselves — soft concentric bands, colored with
  // the new node's own studio color so they read clearly on white, fading to
  // nothing as each one expands (an echo, not a single hard ring) ----
  rings.forEach((ring) => {
    if (ring.life <= 0.01 || ring.radius <= 0) return;
    const ringAlpha = 0.4 * ring.life;
    const grad = weaveCtx.createRadialGradient(newPos.x, newPos.y, Math.max(0, ring.radius - 20), newPos.x, newPos.y, ring.radius + 20);
    grad.addColorStop(0, `rgba(${NEW_NODE_CORE_RGB}, 0)`);
    grad.addColorStop(0.5, `rgba(${NEW_NODE_CORE_RGB}, ${ringAlpha})`);
    grad.addColorStop(1, `rgba(${NEW_NODE_CORE_RGB}, 0)`);
    weaveCtx.strokeStyle = grad;
    weaveCtx.lineWidth = 1.8;
    weaveCtx.beginPath();
    weaveCtx.arc(newPos.x, newPos.y, ring.radius, 0, Math.PI * 2);
    weaveCtx.stroke();
  });

  // ---- the new node itself: pop + glow in the studio's own color, settling
  // into a permanent, gentle breathing pulse once the sequence is done ----
  if (elapsed !== null && elapsed >= CONFIG.BIRTH_START) {
    const bt = clamp01((elapsed - CONFIG.BIRTH_START) / CONFIG.BIRTH_DUR);
    const pop = Math.max(0, easeOutBack(bt));
    const settleT = clamp01((elapsed - CONFIG.BIRTH_START) / CONFIG.BIRTH_SETTLE_DUR);
    const mixT = easeOutCubic(settleT);

    const r = CONFIG.NEW_NODE_RADIUS * Math.min(pop, 1.2);
    const selfBoost = rippleBoostAt(rings, 0); // the node also catches the flash of its own rings firing

    // breathing kicks in once the settle finishes and continues indefinitely
    const settleEnd = CONFIG.BIRTH_START + CONFIG.BIRTH_SETTLE_DUR;
    let breathe = 0;
    if (elapsed > settleEnd) {
      const since = elapsed - settleEnd;
      const breatheIn = clamp01(since / CONFIG.BREATHE_FADE_IN);
      breathe = breatheIn * (0.5 + 0.5 * Math.sin((since / CONFIG.BREATHE_PERIOD) * Math.PI * 2));
    }

    // core color: white-hot spark -> steady studio color (never dims to plain ink)
    const cr = Math.round(lerp(NEW_NODE_FLASH_ARR[0], NEW_NODE_CORE_ARR[0], mixT));
    const cg = Math.round(lerp(NEW_NODE_FLASH_ARR[1], NEW_NODE_CORE_ARR[1], mixT));
    const cb = Math.round(lerp(NEW_NODE_FLASH_ARR[2], NEW_NODE_CORE_ARR[2], mixT));
    const coreColor = `rgb(${cr}, ${cg}, ${cb})`;

    const glowAlpha = lerp(0.7, 0.24, mixT) + breathe * 0.16 + selfBoost * 0.3;
    drawGlow(newPos.x, newPos.y, r * (4 + selfBoost * 2.4 + breathe * 1.3), NEW_NODE_CORE_RGB, Math.min(1, glowAlpha * pop));
    drawNodeDot(newPos.x, newPos.y, r * (1 + breathe * 0.07), coreColor, Math.min(1, pop));
  }

  requestAnimationFrame(renderWeaveFrame);
}

function initWeaveCanvas() {
  weaveCanvas = document.getElementById('weaveCanvas');
  weaveCtx = weaveCanvas.getContext('2d');
  buildWeaveNodes();
  resizeWeaveCanvas();
  window.addEventListener('resize', resizeWeaveCanvas);
  requestAnimationFrame(renderWeaveFrame);
}

/* ---- orchestrate the moment: birth -> ripple -> connections -> confirmation ---- */
function startWeaveSequence() {
  buildWeaveNodes();  // fresh layout each time "Add to the weave" runs
  resizeWeaveCanvas();
  computeReveals();   // stamp every node with the moment the ripple actually reaches it

  // Each connection waits for its own target's reveal — nearer clusters
  // start reaching out before farther ones, following the wave itself.
  connectStarts = connectionTargets.map((targetIdx) => clusterNodes[targetIdx].revealAt + CONFIG.CONNECT_LAG);

  weaveStartTime = performance.now();

  const caption = document.getElementById('weaveCaption');
  const confirm = document.getElementById('weaveConfirm');
  confirm.classList.remove('is-visible');

  // caption appears just as the node is born, after the opening quiet beat
  setTimeout(() => caption.classList.add('is-visible'), CONFIG.BIRTH_START + 80);

  const lastConnectFinish = connectStarts.length
    ? Math.max(...connectStarts) + CONFIG.CONNECT_DUR
    : CONFIG.RIPPLE_START + CONFIG.RIPPLE_TRAVEL_DUR;
  const confirmDelay = Math.max(CONFIG.CONFIRM_MIN_DELAY, lastConnectFinish + CONFIG.CONFIRM_DELAY_AFTER_CONNECT);

  setTimeout(() => caption.classList.remove('is-visible'), confirmDelay - 250);
  setTimeout(() => {
    paintWeaveState();
    confirm.classList.add('is-visible');
  }, confirmDelay);
}

/* The state of the card that was just shared. It is always zero and zero at
   this point — the value is in saying so out loud, and in naming where the
   answer will show up, rather than leaving the reader to wonder whether
   anything is supposed to have happened yet. */
function paintWeaveState() {
  const s = t().share.weaveState;
  document.getElementById('weaveStateReactions').textContent = s.reactions(0);
  document.getElementById('weaveStateApplied').textContent = s.applied(0);
  document.getElementById('weaveStateNote').textContent = s.note;

/* The one control on this screen that does not work, and the only one that has

/* ---- Designers surface <-> the feed ----
   Same crossfade+scale swap share mode uses (.mode-fade-out), for the same
   reason: these are alternate surfaces occupying the gallery's real estate,
   not separate pages, so the topbar and the language switcher never blink. */
function activeSurfaceEl() {
  if (isDesignersMode) return document.getElementById('designersViewport');
  return document.getElementById('feedMain');
}

/* Whichever full-screen surface is holding the screen, torn down without its
   own exit animation — for the case where something else is about to fade in
   over the top of it and playing two transitions would just be slower.

   This exists because every "go somewhere else" path had grown its own list of
   surfaces to check, and Threads was simply missing from two of them: the menu's
   Designers branch called enterDesignersMode, whose guard refuses to run while
   Threads is up, so pressing Designers from the map did nothing at all. One
   function that knows the set is the only way that stays fixed. */
/* ======================================================================
   Thread view — one subject, everything under it, in the order it happened
   ----------------------------------------------------------------------
   A PROBE. The question it exists to answer: does gathering a topic show
   the exchange between two studios better than sorting the same material
   into Questions / Updates / Projects? Everything here is real — the cards
   that already carry the keyword — because a screen that only works with
   invented material has answered nothing.

   Deliberately unfinished in two places: the composer does not save
   anything yet (what happens when somebody writes here is the next
   question, and answering it now would prejudge this one), and the weave's
   old side panel is still in the file. One constant decides which of the
   two a click opens, so the probe is one line from being reverted.
   ====================================================================== */
const THREAD_SCREEN_ON_NODE_CLICK = true;
const THREAD_PEOPLE_MIN = 2;   // below this, the People row is not shown

let isThreadViewMode = false;
let threadViewKey = null;      // the keyword's canonical label

function threadViewCards(label) {
  // newest first — this reads as a conversation, and the last thing said
  // belongs at the top
  return cardsWithKeyword(label).slice().sort((a, b) => daysAgoOf(a) - daysAgoOf(b));
}

/* The header's one line, assembled only from what is actually known. No
   zeroes, no "1 person", no empty brackets: a thread with two items should
   say two true things and stop. */
function threadMetaLine(cards) {
  const strings = t().threadView;
  const bits = [];

  const studios = [...new Set(cards.map((c) => c.studio))].filter(isStudioEnabled);
  if (studios.length > 1) bits.push(studios.map((s) => STUDIOS[s].name).join(' + '));
  else if (studios.length === 1) {
    /* One studio so far: say which, and who opened it — but never dress it
       up as an exchange. "DoubleU + Whow" is a claim about two studios and
       must not appear until both are actually here. */
    bits.push(STUDIOS[studios[0]].name);
    const first = cards[cards.length - 1];
    if (first && first.author) bits.push(strings.startedBy(first.author));
  }

  const people = threadViewPeople(cards);
  if (people.length >= THREAD_PEOPLE_MIN) bits.push(strings.peopleCount(people.length));
  if (cards.length > 1) bits.push(strings.pieceCount(cards.length));
  return bits.join(' · ');
}

// everyone who put something into this thread, in first-seen order
function threadViewPeople(cards) {
  const seen = new Map();
  cards.slice().reverse().forEach((c) => {
    const name = (c.author || '').trim();
    if (name && !seen.has(name)) seen.set(name, c.studio);
  });
  return [...seen].map(([name, studio]) => ({ name, studio }));
}

/* The one line that tells a first-time reader the words are doors. Shown
   until they have opened one — after that it is knowledge, not signage. */
const THREADS_HINT_SEEN_KEY = 'loom_thread_hint_seen_v1';

function threadsHintSeen() {
  try { return localStorage.getItem(THREADS_HINT_SEEN_KEY) === '1'; } catch (err) { return false; }
}

function markThreadsHintSeen() {
  try { localStorage.setItem(THREADS_HINT_SEEN_KEY, '1'); } catch (err) { /* shown again next time — harmless */ }
  const hint = document.getElementById('threadsHint');
  if (hint) hint.style.display = 'none';
}

function refreshThreadsHint() {
  const hint = document.getElementById('threadsHint');
  if (!hint) return;
  hint.textContent = t().threads.clickHint;
  hint.style.display = threadsHintSeen() ? 'none' : '';
}

let threadCloseTimer = null;

/* `origin` is the clicked node's screen position, when there is one: the
   panel scales up FROM that point, so the thread visibly comes out of its
   place on the map. A cold link has no point to come from and grows from
   its own centre instead. */
function openThreadView(label, origin) {
  const word = canonicalKeyword(label) || label;
  const cards = threadViewCards(word);
  // a thread with nothing in it is not a place — the weave should not have
  // offered it, and if it somehow does, nothing opens
  if (!cards.length) return;

  /* The weave is the panel's backdrop now, not a surface being replaced —
     so the feed STAYS. Designers (if that is where we were) steps aside,
     and a link followed from another floor is walked to the weave first,
     instantly, so closing the panel lands somewhere that makes sense. */
  const leaving = teardownActiveSurface();
  if (leaving) {
    leaving.style.display = 'none';
    document.getElementById('feedMain').style.display = 'block';
  }
  if (currentFloor !== FLOOR_THREADS) goToFloor(FLOOR_THREADS, { instant: true });

  threadViewKey = word;
  isThreadViewMode = true;
  pauseAutoScroll();
  markThreadsHintSeen();

  clearTimeout(threadCloseTimer);
  const view = document.getElementById('threadView');
  const panel = document.getElementById('threadPanel');
  view.style.display = 'flex';
  document.getElementById('threadViewScroll').scrollTop = 0;
  renderThreadView();

  const rect = panel.getBoundingClientRect();
  panel.style.transformOrigin = origin
    ? (origin.x - rect.left).toFixed(0) + 'px ' + (origin.y - rect.top).toFixed(0) + 'px'
    : '50% 50%';
  // start closed on the frame that paints, then release the transition
  view.classList.remove('is-open');
  void view.offsetWidth;
  view.classList.add('is-open');

  updateChrome();
  syncUrlState({ push: true });
}

function closeThreadView() {
  if (!isThreadViewMode) return;
  isThreadViewMode = false;
  threadViewKey = null;
  const view = document.getElementById('threadView');
  // the same transitions, run backwards; display goes once they are done
  view.classList.remove('is-open');
  clearTimeout(threadCloseTimer);
  threadCloseTimer = setTimeout(() => {
    if (!isThreadViewMode) view.style.display = 'none';
  }, 260);
  updateChrome();
  syncUrlState({ replace: true });
}

function renderThreadView() {
  if (!threadViewKey) return;
  const strings = t().threadView;
  const cards = threadViewCards(threadViewKey);
  if (!cards.length) { closeThreadView(); return; }

  document.getElementById('threadTitle').textContent = threadViewKey;
  document.getElementById('threadMeta').textContent = threadMetaLine(cards);
  document.getElementById('threadComposer').placeholder = strings.composer;
  document.getElementById('threadViewClose').setAttribute('aria-label', t().closeAria);

  const flow = document.getElementById('threadFlow');
  flow.innerHTML = '';
  cards.forEach((card) => flow.appendChild(threadItemEl(card)));

  const people = threadViewPeople(cards);
  const peopleWrap = document.getElementById('threadPeople');
  peopleWrap.hidden = people.length < THREAD_PEOPLE_MIN;
  peopleWrap.innerHTML = '';
  if (!peopleWrap.hidden) {
    const label = document.createElement('span');
    label.className = 'thread-people-label';
    label.textContent = strings.people;
    peopleWrap.appendChild(label);
    people.forEach((p) => {
      const chip = document.createElement('span');
      chip.className = 'thread-person';
      const dot = document.createElement('span');
      dot.className = 'thread-person-dot';
      dot.style.background = (STUDIOS[p.studio] || {}).color || 'var(--ink)';
      chip.appendChild(dot);
      chip.appendChild(document.createTextNode(p.name));
      peopleWrap.appendChild(chip);
    });
  }
}

/* One item. The format is a word at the front of the line, not a container:
   an update is one line, a project brings a small cover and a couple of
   sentences, a question carries whatever came back underneath it. */
function threadItemEl(card) {
  const text = cardText(card);
  const studio = STUDIOS[card.studio];
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'thread-item';
  el.style.setProperty('--item-studio', studio ? studio.color : 'var(--ink)');

  const top = document.createElement('div');
  top.className = 'thread-item-top';
  const kind = document.createElement('span');
  kind.className = 'thread-kind';
  kind.textContent = t().types[card.type] || card.type;
  const who = document.createElement('span');
  who.className = 'thread-who';
  who.textContent = [studio ? studio.name : '', card.author].filter(Boolean).join(' · ');
  const when = document.createElement('span');
  when.className = 'thread-when';
  when.textContent = card.justNow ? t().justNow
    : formatRelativeTime(currentLang, card.timeValue, card.timeUnit);
  top.appendChild(kind);
  top.appendChild(who);
  top.appendChild(when);
  el.appendChild(top);

  const textWrap = document.createElement('div');
  textWrap.className = 'thread-item-text';
  const title = document.createElement('div');
  title.className = 'thread-item-title';
  title.textContent = text.title || '';
  textWrap.appendChild(title);

  /* A question is not summarised — it is walked through: what was asked,
     what came back, what was decided. Three small labels, each row only if
     the card actually says that thing; a question with no outcome yet shows
     one row and no empty promises. Everything else keeps its one line. */
  if (card.type === 'question') {
    const qs = t().threadView;
    const rows = [
      { label: qs.qaAsked, value: bodyValue(text, 'question', 'blocked') || text.summary || '' },
      { label: qs.qaLearned, value: text.learned || text.result || bodyValue(text, 'question', 'triedSoFar') },
      { label: qs.qaNext, value: bodyValue(text, 'question', 'next') },
    ].filter((r) => r.value);
    if (rows.length) {
      const qa = document.createElement('div');
      qa.className = 'thread-qa';
      rows.forEach((r) => {
        const row = document.createElement('div');
        row.className = 'thread-qa-row';
        const label = document.createElement('span');
        label.className = 'thread-qa-label';
        label.textContent = r.label;
        const val = document.createElement('p');
        val.className = 'thread-qa-value';
        val.textContent = truncateForSummary(r.value, 220);
        row.appendChild(label);
        row.appendChild(val);
        qa.appendChild(row);
      });
      textWrap.appendChild(qa);
    }
  } else {
    // an update says its one thing; anything longer shows its opening
    const line = isUpdate(card)
      ? (text.note || text.summary || '')
      : (text.summary || '');
    if (line) {
      const p = document.createElement('p');
      p.className = 'thread-item-body';
      p.textContent = truncateForSummary(line, isUpdate(card) ? 200 : 150);
      textWrap.appendChild(p);
    }
  }

  if (card.image) {
    const row = document.createElement('div');
    row.className = 'thread-item-with-cover';
    const cover = document.createElement('div');
    cover.className = 'thread-cover' + (card.imageFit === 'contain' ? ' is-doc' : '');
    cover.style.backgroundImage = `url("${card.image}")`;
    if (card.imageBg) cover.style.backgroundColor = card.imageBg;
    row.appendChild(cover);
    row.appendChild(textWrap);
    el.appendChild(row);
  } else {
    el.appendChild(textWrap);
  }

  // where it came from, as a footnote to the item rather than a section
  if (card.derivedFrom && card.derivedRelation) {
    const parent = cardById(card.derivedFrom);
    const words = t().lineageRelations[card.derivedRelation];
    const rel = document.createElement('span');
    rel.className = 'thread-rel';
    rel.textContent = ((words && words.back) || card.derivedRelation)
      + (parent ? ' — ' + truncateForSummary(cardText(parent).title || '', 60) : '');
    el.appendChild(rel);
  }

  /* What came back. A question's thread is the conversation on it; anything
     else shows the pieces that were built out of it, which is the same
     relationship seen from the other end. */
  const answers = [];
  if (isOpenQuestion(card)) {
    getConversationMessages(card).slice(1).forEach((m) => {
      if (m.text) answers.push({ who: m.author, text: m.text });
    });
  } else {
    /* Pieces built out of this one — but only those that are NOT in this
       thread already. A card that sits three rows above as its own item
       does not also belong underneath this one; the first version printed
       both and the same sentence appeared twice on one screen. */
    const inThread = new Set(threadViewCards(threadViewKey).map((c) => c.id));
    ALL_CARDS
      .filter((c) => c.derivedFrom === card.id && !inThread.has(c.id))
      .forEach((child) => {
        answers.push({ who: child.author, text: cardText(child).title || '' });
      });
  }
  if (answers.length) {
    const wrap = document.createElement('div');
    wrap.className = 'thread-answers';
    answers.slice(0, 4).forEach((a) => {
      const row = document.createElement('div');
      row.className = 'thread-answer';
      const name = document.createElement('span');
      name.className = 'thread-answer-who';
      name.textContent = a.who || '';
      row.appendChild(name);
      row.appendChild(document.createTextNode(truncateForSummary(a.text, 130)));
      wrap.appendChild(row);
    });
    el.appendChild(wrap);
  }

  el.addEventListener('click', () => openCardById(card.id));
  return el;
}

function initThreadView() {
  document.getElementById('threadViewClose').addEventListener('click', closeThreadView);
  document.getElementById('threadBackdrop').addEventListener('click', closeThreadView);
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !isThreadViewMode) return;
    // a card opened from the panel sits above it — Escape peels that first
    if (isCardExpanded) return;
    closeThreadView();
  });
}

function teardownActiveSurface() {
  // Threads is not in here any more: it is a floor, so it is underneath a
  // surface rather than competing with one.
  if (isThreadViewMode) {
    isThreadViewMode = false;
    threadViewKey = null;
    return document.getElementById('threadView');
  }
  if (isDesignersMode) {
    isDesignersMode = false;
    return document.getElementById('designersViewport');
  }
  return null;
}

function enterDesignersMode() {
  if (isDesignersMode || isShareMode || isCardExpanded) return;

  // First open fetches the shared roster (no-op afterwards); the floor shows
  // whatever it has now and re-renders when the remote list lands.
  initRemoteRoster();

  /* Threads may be what is on screen. It used to be in the guard above, which
     meant pressing Designers from the map silently did nothing; taking the map
     down here instead makes the roster reachable from wherever you are. The
     feed is put back first because the swap below fades `gallery` out, and it
     has to be the thing actually showing.

     Before the flag is set: teardownActiveSurface reads the mode flags to decide
     what is showing, so setting ours first would make it tear down this very
     surface and clear the flag we had just set. */
  const leaving = teardownActiveSurface();
  if (leaving) {
    leaving.style.display = 'none';
    document.getElementById('feedMain').style.display = 'block';
  }

  isDesignersMode = true;
  pauseAutoScroll();
  // a surface you can be linked to, and Back is how you leave it
  syncUrlState({ push: true });

  const gallery = document.getElementById('feedMain');
  const designers = document.getElementById('designersViewport');

  // Always reopen on your own studio with edit mode off — the roster is a
  // "who's here" screen first; you opt into editing it each time.
  rosterStudioIndex = 0;
  rosterEditMode = false;
  closeDesignerEditor();
  renderDesigners();

  updateChrome(); // floor 2's search box does not belong on the roster

  gallery.classList.add('mode-fade-out');
  setTimeout(() => {
    gallery.style.display = 'none';
    gallery.classList.remove('mode-fade-out');
    designers.style.display = 'flex';
    sizeAllRosters(false); // renderDesigners ran while hidden, so it measured zero
    designers.classList.add('mode-fade-out'); // reuse as this element's own "not yet visible" state
    void designers.offsetWidth;               // force reflow so the fade-in actually transitions
    designers.classList.remove('mode-fade-out');
  }, CONFIG.MODE_SWAP_MS);
}

// `onShown` runs once the feed is back on screen — that's when a floor change
// is worth animating (see focusDesigner), not while it's still faded out.
function exitDesignersMode(onShown) {
  if (!isDesignersMode) return;
  isDesignersMode = false;
  updateChrome(); // and back it comes with the floor it belongs to
  syncUrlState({ replace: true });

  const gallery = document.getElementById('feedMain');
  const designers = document.getElementById('designersViewport');

  designers.classList.add('mode-fade-out');
  setTimeout(() => {
    designers.style.display = 'none';
    designers.classList.remove('mode-fade-out');

    gallery.style.display = 'block';
    gallery.classList.add('mode-fade-out');
    void gallery.offsetWidth;
    gallery.classList.remove('mode-fade-out');
    if (onShown) onShown();
  }, CONFIG.MODE_SWAP_MS);

  scheduleResumeAutoScroll();
}

// Swaps the gallery <-> the share surface with a short crossfade+scale (see
// .mode-fade-out), always starting share mode from a clean compose step no
// matter how the previous visit ended.
function enterShareMode() {
  if (isShareMode || isCardExpanded) return;
  isShareMode = true;
  pauseAutoScroll();

  // Share can be reached straight from the Designers roster, so fade out
  // whichever surface is actually showing — and make sure the feed, not the
  // roster, is what's underneath when share mode closes again.
  const leaving = activeSurfaceEl();
  // Designers or Threads: either can be the thing on screen when the pencil is
  // pressed, and both leave the same way.
  if (teardownActiveSurface()) {
    document.getElementById('feedMain').style.display = 'block';
  }

  // The back-to-lobby pill is fixed in the corner independent of the gallery/
  // share-viewport swap below — hide it explicitly so a stray click while
  // composing can't discard the moment by leaving the app entirely.
  document.getElementById('cornerDock').classList.add('is-hidden-in-share');
  updateChrome();

  const gallery = leaving;
  const share = document.getElementById('shareViewport');
  const compose = document.getElementById('stepCompose');
  const weave = document.getElementById('stepWeave');

  resetComposeForm();
  resetWeaveVisual();
  weave.style.display = 'none';
  TRANSITION_CLASSES.forEach((c) => { compose.classList.remove(c); weave.classList.remove(c); });
  compose.style.display = 'flex';

  gallery.classList.add('mode-fade-out');
  setTimeout(() => {
    gallery.style.display = 'none';
    gallery.classList.remove('mode-fade-out');
    share.style.display = 'flex';
    // resetComposeForm() above already tried this, but #shareViewport was
    // still display:none at that point — a scrollTop write on an element
    // with no layout box (display:none, self or ancestor) is a silent
    // no-op, so it has to happen again now that it's actually visible.
    const composeScroll = document.querySelector('#stepCompose .compose-scroll');
    if (composeScroll) composeScroll.scrollTop = 0;
    share.classList.add('mode-fade-out'); // reuse as this element's own "not yet visible" state
    void share.offsetWidth; // force reflow before clearing it, so the fade-in actually transitions
    share.classList.remove('mode-fade-out');
  }, CONFIG.MODE_SWAP_MS);
}

function exitShareMode() {
  if (!isShareMode) return;
  isShareMode = false;
  // Also the abandon path: leaving without saving drops the edit, so the next
  // visit to Share is a blank compose form rather than somebody's old card.
  editingCardId = null;

  document.getElementById('cornerDock').classList.remove('is-hidden-in-share');
  updateChrome();

  const gallery = document.getElementById('feedMain');
  const share = document.getElementById('shareViewport');

  share.classList.add('mode-fade-out');
  setTimeout(() => {
    share.style.display = 'none';
    share.classList.remove('mode-fade-out');

    flushPendingSharedCards();

    gallery.style.display = 'block';
    gallery.classList.add('mode-fade-out');
    void gallery.offsetWidth;
    gallery.classList.remove('mode-fade-out');
    // resurface the top floor, where the hero (and a newly shared card's
    // slide within it — renderDiscover() inside flushPendingSharedCards already
    // reset heroIndex to 0) lives
    goToFloor(0, { instant: true });
  }, CONFIG.MODE_SWAP_MS);

  scheduleResumeAutoScroll();
}

function initShareMode() {
  refreshShareText();
  // The only way into Share: the fixed bottom-left pencil. From a detail screen
  // it has to close that first; enterShareMode refuses while one is open.
  document.getElementById('cornerShareBtn').addEventListener('click', () => {
    if (isCardExpanded) { closeCard(); setTimeout(enterShareMode, CONFIG.MODE_SWAP_MS + 40); }
    else enterShareMode();
  });
  document.getElementById('shareCloseBtn').addEventListener('click', exitShareMode);
  document.getElementById('doneBtn').addEventListener('click', exitShareMode);
}

/* ======================================================================
   10. Page-to-page transitions — a shared veil + soft recede, used when
   actually leaving this document (loom_lobby.html); share mode above stays
   entirely in-page and never touches this.
   ====================================================================== */
function initPageTransitions() {
  const veil = document.getElementById('pageVeil');
  const appEl = document.getElementById('app');

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      veil.classList.add('is-hidden');
      appEl.classList.remove('is-transitioning');
    });
  });

  document.querySelectorAll('a[href$=".html"]').forEach((a) => {
    if (a.target === '_blank') return;
    a.addEventListener('click', (e) => {
      if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
      const href = a.getAttribute('href');
      if (!href) return;
      e.preventDefault();
      veil.classList.remove('is-hidden');
      appEl.classList.add('is-transitioning');
      setTimeout(() => { window.location.href = href; }, 420);
    });
  });
}

// Guest mode strips the write ENTRY POINTS out of the DOM before anything
// can show them: the share pencil and the Apply button (edit/delete links
// and the roster Edit toggle never render — canEditCard/canEditRoster say
// no). The server refusing writes is a separate, unconditional layer.
safeInit('guest mode', () => {
  if (!isGuestSession()) return;
  const pencil = document.getElementById('cornerShareBtn');
  if (pencil) pencil.remove();
  const apply = document.getElementById('applyBtn');
  if (apply) apply.remove();
});

// swap (if the DB has rows) is a quiet rebuild, not a race with first paint.

// Designers floor must not open on a false "nobody here yet"
safeInit('remote roster', initRemoteRoster);

safeInit('auth session', initAuthSession);
