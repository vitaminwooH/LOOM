/* ======================================================================
   2b. Cards shared through share mode (see section 9) — persisted to
   localStorage so they survive a reload, read once here at load and
   stitched onto the front of the gallery. Their title/problem/tried/result
   stay exactly as the author typed them (there's no translation for
   user-generated text in this prototype), so they carry their own `text`
   object instead of looking one up from TRANSLATIONS.
   ====================================================================== */
const SHARED_CARDS_STORAGE_KEY = 'loom_shared_cards_v1';

function loadSharedCards() {
  try {
    const raw = localStorage.getItem(SHARED_CARDS_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (err) {
    console.error('[Loom feed] could not read shared cards from localStorage:', err);
    return [];
  }
}

// `let`, not `const`: sharing a new card while already on this page (see
// share mode below) prepends to this in memory too, so the gallery can show
// it immediately without a reload — localStorage is what makes it survive
// a reload, not what the live UI reads from moment to moment.
let sharedCards = loadSharedCards();

// The list every render/filter function actually works from: newest shared
// knowledge first, then the seed CARDS. `staticIndex` lets static entries
// still look their copy up in TRANSLATIONS[lang] as the language changes;
// shared entries carry their own fixed `text` instead.
function buildAllCards() {
  return [
    ...sharedCards.map((c) => ({ ...c, isShared: true })),
    ...CARDS.map((c, i) => ({ ...c, isShared: false, staticIndex: i })),
  ].filter((c) => isStudioEnabled(c.studio));
}
let ALL_CARDS = buildAllCards();

// A shared card's `text` is always exactly what its author typed, in
// whatever language they typed it in — there's no machine translation here.
// A real service would call a translation API right here (keyed off
// `entry.sourceLang` vs. the viewer's `currentLang`) and cache the result
// per target language; until then, renderLangPendingBadge() is what tells
// the reader they're looking at the original text, not a translation.
function cardText(entry) {
  return entry.isShared ? entry.text : ct(entry.staticIndex);
}

// item 9 — "Original (<language>) · Auto-translation pending", shown
// whenever a shared card's original language differs from the UI's current
// language. Static seed cards are always pre-translated (see TRANSLATIONS),
// so this only ever applies to what someone actually wrote in this session.
function langPendingText(data) {
  if (!data.isShared || !data.sourceLang || data.sourceLang === currentLang) return '';
  const lang = LANGUAGES.find((l) => l.code === data.sourceLang);
  return t().originalPending(lang ? lang.label : data.sourceLang);
}
function langPendingBadgeHTML(data) {
  const txt = langPendingText(data);
  return txt ? `<span class="lang-pending-badge">${txt}</span>` : '';
}
function renderLangPendingBadge(el, data) {
  if (!el) return;
  const txt = langPendingText(data);
  el.textContent = txt;
  el.style.display = txt ? '' : 'none';
}

/* ======================================================================
   2c. Cross-card connections — relatedTo/derivedFrom drive both the hover
   highlight in the gallery and the mini lineage graph in the expanded
   modal (see populateExpanded). Resolved against ALL_CARDS (not CARDS) so
   shared cards can participate too, and resolved bidirectionally so a
   relatedTo/derivedFrom pair only ever needs to be declared on one side.
   ====================================================================== */
function findCardIndexById(id) {
  return ALL_CARDS.findIndex((c) => c.id === id);
}

// Every card this one is connected to, regardless of relation type — this
// is what the gallery hover effect lights up. Returns ALL_CARDS indices.
function connectedIndices(data) {
  const ids = new Set();
  (data.relatedTo || []).forEach((id) => ids.add(id));
  if (data.derivedFrom) ids.add(data.derivedFrom);
  ALL_CARDS.forEach((c) => {
    if (c.id === data.id) return;
    if (c.derivedFrom === data.id) ids.add(c.id);
    if ((c.relatedTo || []).includes(data.id)) ids.add(c.id);
  });
  ids.delete(data.id);
  const indices = [];
  ids.forEach((id) => {
    const idx = findCardIndexById(id);
    if (idx !== -1) indices.push(idx);
  });
  return indices;
}

// The richer, relation-aware version used to draw the lineage graph: each
// entry keeps *why* it's connected (derivedFrom/derivedInto/related), plus
// separate studio-level "applied it" nodes — appliedBy has no specific card
// to point at, so it can only ever produce a studio node, not a card one.
function buildLineageNodes(data) {
  const nodes = [];
  const seen = new Set([data.id]);

  const addCardNode = (id, relation) => {
    if (seen.has(id)) return;
    const idx = findCardIndexById(id);
    if (idx === -1) return;
    seen.add(id);
    const c = ALL_CARDS[idx];
    nodes.push({
      kind: 'card',
      id,
      index: idx,
      title: cardText(c).title,
      color: STUDIOS[c.studio].color,
      relation,
    });
  };

  if (data.derivedFrom) addCardNode(data.derivedFrom, 'derivedFrom');
  ALL_CARDS.forEach((c) => { if (c.derivedFrom === data.id) addCardNode(c.id, 'derivedInto'); });
  (data.relatedTo || []).forEach((id) => addCardNode(id, 'related'));
  ALL_CARDS.forEach((c) => { if ((c.relatedTo || []).includes(data.id)) addCardNode(c.id, 'related'); });

  visibleAppliedBy(data).forEach((studioKey) => {
    nodes.push({ kind: 'studio', studioKey, name: STUDIOS[studioKey].name, color: STUDIOS[studioKey].color, relation: 'appliedBy' });
  });

  return nodes;
}

/* ======================================================================
   2d. Discover ranking — "newest first" across studios, so freshly shared
   knowledge (always justNow) floats to the very front and the rest sorts by
   how long ago it was posted. Same underlying ALL_CARDS as Browse below;
   Discover is a curated top slice of it, not a separate pool.
   ====================================================================== */
const DISCOVER_COUNT = 6;
const TIME_UNIT_DAYS = { day: 1, week: 7, month: 30 };

function daysAgoOf(data) {
  return data.justNow ? -1 : data.timeValue * (TIME_UNIT_DAYS[data.timeUnit] || 1);
}

function computeDiscoverIndices() {
  return ALL_CARDS
    .map((c, i) => i)
    .sort((a, b) => daysAgoOf(ALL_CARDS[a]) - daysAgoOf(ALL_CARDS[b]))
    .slice(0, DISCOVER_COUNT);
}

// The one light textual trace of lineage a Discover card carries — just
// "derived from {studio}" when there's a clear ancestor, nothing forced
// otherwise. The full breakdown (related ideas, who applied it, etc.) is
// what the modal's lineage list is for.
function lineageHintFor(data) {
  if (!data.derivedFrom) return '';
  const idx = findCardIndexById(data.derivedFrom);
  if (idx === -1) return '';
  const originStudio = STUDIOS[ALL_CARDS[idx].studio];
  return `${t().lineage.derivedFrom} ${originStudio.name}`;
}

function isOpenQuestion(data) {
  return data.type === 'question';
}

// Open/Discussing/Resolved — only Questions carry this at all.
function statusBadgeHTML(data) {
  if (!isOpenQuestion(data) || !data.status) return '';
  return `<span class="status-badge status-${data.status}">${t().status[data.status]}</span>`;
}

// Replies typed into this session's Conversation pane (see initQuestionDetail) —
// kept separate from the seed data entirely, keyed by card id, so appending
// one never has to fight with how static cards zip structure against
// per-language text (see getConversationMessages just below).
const sessionExtraMessages = {};

// The thread behind a Question — structural data (who/when) lives on the
// card itself (language-independent, like everywhere else in this file);
// only the message text is looked up per-language. Shared (user-authored)
// cards carry their own embedded text instead, same as their other fields.
// Static Questions with no curated thread (see CARDS) get a synthesized
// single opening post from the card's own author/problem fields, so every
// Question always has *something* to show in its Conversation pane.
function getConversationMessages(data) {
  let base;
  if (data.isShared) {
    base = data.conversation || [];
  } else {
    const text = cardText(data);
    base = (data.conversation && text.conversation)
      ? data.conversation.map((msg, i) => ({ ...msg, text: text.conversation[i] }))
      : [{ author: data.author, studio: data.studio, timeValue: data.timeValue, timeUnit: data.timeUnit, justNow: data.justNow, text: text.problem }];
  }
  return base.concat(sessionExtraMessages[data.id] || []);
}

// null means "not enough discussion yet" — the brief panel shows a plain
// placeholder instead of forcing a summary out of a single opening post.
function getConversationBrief(data) {
  if (data.isShared) return null;
  return cardText(data).brief || null;
}

/* ======================================================================
   3. Utilities
   ====================================================================== */
function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// Used by the share-mode weave canvas, which paints with raw "r, g, b"
// strings/arrays instead of CSS colors.
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return `${parseInt(h.substring(0, 2), 16)}, ${parseInt(h.substring(2, 4), 16)}, ${parseInt(h.substring(4, 6), 16)}`;
}
function hexToRgbArray(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4), 16), parseInt(h.substring(4, 6), 16)];
}

// Placeholder art for cards with no image — layered studio-colored light
// blooms (a bright one near the top, a soft warm one low-right, plus a faint
// wash) rather than one flat gradient. Paired in CSS with a fixed grain
// texture (--card-noise) via background-blend-mode, so an empty card still
// reads as a designed visual instead of a placeholder.
// Returns exactly 4 comma-separated gradient layers — no trailing solid
// color. Used two ways: as `--card-bloom` inside a `background-image` list
// (which only accepts <image> values, so a plain color there would make the
// whole declaration invalid), and inline via the full `background` shorthand
// for the card's flip-back face, where callers append their own ", #fff".
function mediaGradient(color) {
  return `radial-gradient(circle at 22% 16%, ${hexToRgba(color, 0.42)}, transparent 50%), ` +
         `radial-gradient(circle at 86% 30%, ${hexToRgba(color, 0.18)}, transparent 55%), ` +
         `radial-gradient(circle at 65% 96%, rgba(255, 255, 255, 0.6), transparent 52%), ` +
         `linear-gradient(165deg, ${hexToRgba(color, 0.22)}, transparent 85%)`;
}

// Applies either a real image (fills the card, small corner badge for the
// type icon) or the gradient/noise fallback (big centered icon) to a
// `.card-media`/`.expanded-media` element. Images are verified to actually
// load before switching — a broken/missing path silently keeps the fallback
// visual instead of showing a blank box, so dropping files into assets/
// later "just works" without any code change.
function applyCardMedia(mediaEl, imagePath, color) {
  mediaEl.style.setProperty('--card-bloom', mediaGradient(color));
  mediaEl.classList.remove('has-image');
  mediaEl.style.removeProperty('--card-img');
  if (!imagePath) return;
  const probe = new Image();
  probe.onload = () => {
    mediaEl.style.setProperty('--card-img', `url("${imagePath}")`);
    // The CSSOM refuses absurdly long custom-property values outright, and it
    // does it silently — setProperty neither throws nor warns, the property
    // just isn't there afterwards. An un-resized phone photo as a data: URL
    // used to hit that limit, and because `has-image` also switches the
    // gradient fallback off, the card rendered as a blank white box. Uploads
    // are downscaled now (see resizeImageToDataUrl), but read the value back
    // before committing regardless: no image is a fallback, no visual is a bug.
    if (!mediaEl.style.getPropertyValue('--card-img')) {
      mediaEl.style.removeProperty('--card-img');
      return;
    }
    mediaEl.classList.add('has-image');
  };
  probe.onerror = () => { /* file not there yet — keep the fallback gradient */ };
  probe.src = imagePath;
}

function safeInit(label, fn) {
  try {
    fn();
  } catch (err) {
    console.error('[Loom feed] "' + label + '" failed to initialize:', err);
  }
}

/* ======================================================================
   4. Center overlay menu (Projects/Experiments/Questions/Tools) + topbar
      studio chips + language switcher
   ====================================================================== */
// Both of these are Browse-only (see applyBrowseFilters) — Discover always
// shows its newest-first top slice regardless of filter/search state.
let selectedStudio = 'all';
let selectedTypeFilter = 'all'; // distinct from share mode's `selectedType` (the compose form's chosen type)
let searchQuery = '';
// Set by picking someone in Designers; matches a card's `author` field. Like
// the two above it's Browse + Questions only — Discover stays "what's newest
// across everyone", which is the one thing it's for.
let selectedAuthor = null;
let isDesignersMode = false;

// Stagger timing for the menu items — open reads as a deliberate, weighty
// reveal (top to bottom, generous per-item delay); close is the same motion
// undone quickly and in reverse (bottom to top), like a stack unwinding.
const MENU_OPEN_STAGGER_MS = 50;
const MENU_OPEN_DUR_MS = 440;
const MENU_OPEN_EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';
const MENU_CLOSE_STAGGER_MS = 26;
const MENU_CLOSE_DUR_MS = 220;
const MENU_CLOSE_EASE = 'cubic-bezier(0.5, 0, 0.85, 0.35)';

// Updates which menu item reads as "active" — only the type-filter items
// (All/Projects/Experiments) actually persist as a filter state; Questions
// and Tools are one-shot navigation/actions, never "active".
function updateMenuActiveState() {
  document.querySelectorAll('.menu-item[data-kind="filter"]').forEach((b) => {
    const isAll = b.dataset.value === 'all';
    b.classList.toggle('is-active', isAll ? selectedTypeFilter === 'all' : b.dataset.value === selectedTypeFilter);
  });
}

function renderMenuOverlay() {
  const list = document.getElementById('menuList');

  MENU_ITEMS.forEach((item) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'menu-item' + (item.key === 'all' ? ' is-active' : '');
    btn.dataset.value = item.key;

    if (item.comingSoon) {
      btn.addEventListener('click', () => {
        showToast(t().toolsComingSoon);
        closeMenuOverlay();
      });
    } else if (item.designers) {
      btn.dataset.kind = 'nav';
      btn.addEventListener('click', () => {
        closeMenuOverlay();
        enterDesignersMode();
      });
    } else if (item.key === 'question') {
      btn.dataset.kind = 'nav';
      btn.addEventListener('click', () => {
        closeMenuOverlay();
        goToFloor(item.tier);
      });
    } else {
      btn.dataset.kind = 'filter';
      btn.addEventListener('click', () => {
        selectedTypeFilter = item.key === 'all' ? 'all' : item.filterType;
        updateMenuActiveState();
        updateTypeFilterButtonUI();
        applyBrowseFilters();
        closeMenuOverlay();
        goToFloor(item.tier || 1);
      });
    }
    list.appendChild(btn);
  });

  refreshMenuLabels();

  document.getElementById('menuToggleBtn').addEventListener('click', openMenuOverlay);
  document.getElementById('menuCloseBtn').addEventListener('click', closeMenuOverlay);
  // Only a direct hit on the backdrop itself closes it — clicks that bubble
  // up from a menu item or the close button have already handled themselves.
  document.getElementById('menuOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'menuOverlay') closeMenuOverlay();
  });
}

function refreshMenuLabels() {
  document.querySelectorAll('.menu-item').forEach((btn) => {
    btn.textContent = t().menu[btn.dataset.value];
  });
}

// A brief, dismiss-itself pill for actions with no real destination yet
// (see MENU_ITEMS' `tools` entry) — reuses the same "quiet, non-blocking
// feedback" role a real toast/snackbar plays, just scoped to this one case.
let toastTimer = null;
function showToast(message) {
  const toast = document.getElementById('toast');
  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.classList.add('is-visible');
  toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2200);
}

function isMenuOverlayOpen() {
  return document.getElementById('menuOverlay').classList.contains('is-open');
}

function openMenuOverlay() {
  const overlay = document.getElementById('menuOverlay');
  if (overlay.classList.contains('is-open')) return;
  pauseAutoScroll();
  const items = Array.from(overlay.querySelectorAll('.menu-item'));
  items.forEach((el, i) => {
    el.style.transitionDelay = (i * MENU_OPEN_STAGGER_MS) + 'ms';
    el.style.transitionDuration = MENU_OPEN_DUR_MS + 'ms';
    el.style.transitionTimingFunction = MENU_OPEN_EASE;
  });
  overlay.classList.add('is-open');
  document.getElementById('menuToggleBtn').setAttribute('aria-expanded', 'true');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      items.forEach((el) => el.classList.add('is-visible'));
    });
  });
}

function closeMenuOverlay() {
  const overlay = document.getElementById('menuOverlay');
  if (!overlay.classList.contains('is-open')) return;
  const items = Array.from(overlay.querySelectorAll('.menu-item'));
  const n = items.length;
  items.forEach((el, i) => {
    el.style.transitionDelay = ((n - 1 - i) * MENU_CLOSE_STAGGER_MS) + 'ms';
    el.style.transitionDuration = MENU_CLOSE_DUR_MS + 'ms';
    el.style.transitionTimingFunction = MENU_CLOSE_EASE;
    el.classList.remove('is-visible');
  });
  overlay.classList.remove('is-open');
  document.getElementById('menuToggleBtn').setAttribute('aria-expanded', 'false');
  scheduleResumeAutoScroll();
}

function renderStudioChips() {
  const wrap = document.getElementById('studioFilter');
  const items = [
    { key: 'all', name: t().filterAll, color: null },
    ...Object.entries(STUDIOS).filter(([, s]) => s.enabled).map(([key, s]) => ({ key, name: s.name, color: s.color })),
  ];
  items.forEach((item) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'studio-chip' + (item.key === 'all' ? ' is-active' : '');
    btn.dataset.kind = 'studio';
    btn.dataset.value = item.key;
    if (item.color) {
      btn.style.setProperty('--chip-color', item.color);
      btn.style.setProperty('--chip-color-bg', hexToRgba(item.color, 0.12));
    }
    const dot = item.color ? `<span class="chip-dot" style="background:${item.color}"></span>` : '';
    btn.innerHTML = `${dot}<span class="chip-label">${item.name}</span>`;
    btn.addEventListener('click', () => {
      selectedStudio = item.key;
      document.querySelectorAll('[data-kind="studio"]').forEach((b) => b.classList.toggle('is-active', b.dataset.value === selectedStudio));
      applyBrowseFilters();
    });
    wrap.appendChild(btn);
  });
}

// One dropdown button instead of a row of chips — studio is the filter
// people reach for constantly (so it stays a visible chip group), type is
// reached for occasionally, so it folds away and only surfaces as a filled
// pill once something other than "All" is actually picked (see
// updateTypeFilterButtonUI/.has-active-filter). Mirrors the language
// switcher's open/close/outside-click/Escape pattern (see renderLanguageSwitcher).
function renderTypeFilterDropdown() {
  const dropdown = document.getElementById('typeFilterDropdown');
  const btn = document.getElementById('typeFilterBtn');
  const menu = document.getElementById('typeFilterMenu');

  // Browse (tier 2) only ever holds finished knowledge — project/experiment —
  // Questions live in their own tier now, so there's no "Question" entry here.
  const items = [
    { key: 'all', label: t().filterAll, icon: null },
    { key: 'project', label: t().types.project, icon: ICONS.project },
    { key: 'experiment', label: t().types.experiment, icon: ICONS.experiment },
  ];

  items.forEach((item) => {
    const menuItem = document.createElement('button');
    menuItem.type = 'button';
    menuItem.className = 'type-filter-menu-item' + (item.key === selectedTypeFilter ? ' is-active' : '');
    menuItem.dataset.kind = 'type';
    menuItem.dataset.value = item.key;
    menuItem.innerHTML = `<span class="type-filter-menu-icon">${item.icon || FILTER_ICON}</span><span class="type-filter-menu-label">${item.label}</span>`;
    menuItem.addEventListener('click', (e) => {
      e.stopPropagation();
      selectedTypeFilter = item.key;
      dropdown.classList.remove('is-open');
      document.querySelectorAll('.type-filter-menu-item').forEach((el) => el.classList.toggle('is-active', el.dataset.value === selectedTypeFilter));
      updateTypeFilterButtonUI();
      updateMenuActiveState();
      applyBrowseFilters();
    });
    menu.appendChild(menuItem);
  });

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdown.classList.toggle('is-open');
  });
  document.addEventListener('click', () => dropdown.classList.remove('is-open'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') dropdown.classList.remove('is-open'); });

  updateTypeFilterButtonUI();
}

function updateTypeFilterButtonUI() {
  const dropdown = document.getElementById('typeFilterDropdown');
  const isAll = selectedTypeFilter === 'all';
  document.getElementById('typeFilterBtnIcon').innerHTML = isAll ? FILTER_ICON : ICONS[selectedTypeFilter];
  document.getElementById('typeFilterBtnLabel').textContent = isAll ? t().typeFilterLabel : t().types[selectedTypeFilter];
  dropdown.classList.toggle('has-active-filter', !isAll);
}

function renderLanguageSwitcher() {
  const switcher = document.getElementById('langSwitcher');
  const btn = document.getElementById('langBtn');
  const menu = document.getElementById('langMenu');

  LANGUAGES.forEach((lang) => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'lang-menu-item' + (lang.code === currentLang ? ' is-active' : '');
    item.dataset.lang = lang.code;
    item.textContent = lang.label;
    item.addEventListener('click', () => {
      switcher.classList.remove('is-open');
      setLanguage(lang.code);
    });
    menu.appendChild(item);
  });

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    switcher.classList.toggle('is-open');
  });
  document.addEventListener('click', () => switcher.classList.remove('is-open'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') switcher.classList.remove('is-open'); });
}

function updateLanguageButtonUI() {
  document.getElementById('langBtnLabel').textContent = LANGUAGES.find((l) => l.code === currentLang).label;
  document.querySelectorAll('.lang-menu-item').forEach((el) => {
    el.classList.toggle('is-active', el.dataset.lang === currentLang);
  });
}

// Language switch: fade the text-bearing regions out, swap every string in
// place, then fade back in. Layout/positions never move, so this stays cheap
// and smooth regardless of how much text length changes between languages.
function setLanguage(lang) {
  if (lang === currentLang || !TRANSLATIONS[lang]) return;

  const fadeEls = [
    document.getElementById('heroSlides'),
    document.getElementById('browseGrid'),
    document.getElementById('menuList'),
    document.getElementById('topbarRight'),
    document.getElementById('searchInput'),
  ];
  if (isCardExpanded) fadeEls.push(document.querySelector('.expanded-body-scroll'));
  if (isShareMode) fadeEls.push(document.getElementById('shareViewport'));
  if (isDesignersMode) fadeEls.push(document.getElementById('designersViewport'));

  fadeEls.forEach((el) => { if (el) el.style.opacity = '0'; });

  setTimeout(() => {
    currentLang = lang;
    refreshAllText();
    fadeEls.forEach((el) => { if (el) el.style.opacity = '1'; });
  }, CONFIG.LANG_FADE_MS);
}

function refreshAllText() {
  const strings = t();

  document.getElementById('searchInput').placeholder = strings.searchPlaceholder;

  refreshMenuLabels();

  document.querySelectorAll('.studio-chip[data-value="all"] .chip-label').forEach((el) => { el.textContent = strings.filterAll; });
  document.querySelectorAll('.type-filter-menu-item').forEach((btn) => {
    const label = btn.querySelector('.type-filter-menu-label');
    if (label) label.textContent = btn.dataset.value === 'all' ? strings.filterAll : strings.types[btn.dataset.value];
  });
  updateTypeFilterButtonUI();

  document.getElementById('discoverHeading').textContent = strings.discoverHeading;
  document.getElementById('discoverSub').textContent = strings.discoverSub;
  document.getElementById('browseHeading').textContent = strings.browseHeading;
  document.getElementById('browseSub').textContent = strings.browseSub;
  document.getElementById('questionsHeading').textContent = strings.questionsHeading;
  document.getElementById('questionsSub').textContent = strings.questionsSub;
  document.getElementById('browseEmpty').textContent = strings.browseEmptyText;
  document.getElementById('questionsEmpty').textContent = strings.questionsEmptyText;

  document.getElementById('shareBtnLabel').textContent = strings.shareButton;
  const backLink = document.getElementById('backToLobbyBtn');
  backLink.setAttribute('aria-label', strings.backToNetwork);
  backLink.title = strings.backToNetwork;
  document.getElementById('backToLobbyLabel').textContent = strings.backToNetwork;

  updateLanguageButtonUI();
  renderDiscover();
  renderBrowse();
  renderQuestions();
  renderDesigners();
  refreshDesignerEditorText();
  renderAuthorFilterChip();
  refreshShareText();

  const closeBtn = document.getElementById('expandedClose');
  closeBtn.setAttribute('aria-label', strings.closeAria);
  const applyBtn = document.getElementById('applyBtn');
  applyBtn.textContent = applyBtn.classList.contains('is-applied') ? strings.applyButtonDone : strings.applyButton;
  document.getElementById('deleteCardLabel').textContent = strings.deleteLink;
  document.getElementById('deleteConfirmText').textContent = strings.deleteConfirmText;
  document.getElementById('deleteCancelBtn').textContent = strings.deleteCancel;
  document.getElementById('deleteConfirmBtn').textContent = strings.deleteConfirmButton;

  if (isCardExpanded && currentOpenIndex !== null) {
    populateExpanded(ALL_CARDS[currentOpenIndex], currentOpenIndex);
  }
}

/* ======================================================================
   5. Card rendering — two distinct surfaces sharing the same ALL_CARDS data.

   Discover: one full-width hero banner, autoplaying through a curated top
   slice (computeDiscoverIndices) — always "what's newest", full stop, with
   no filters and no scrolling of its own (see initHeroControls below).

   Browse: every card, small and dense, filtered/searched independently.
   ====================================================================== */
let heroIndices = [];
let heroIndex = 0;
let heroTimer = null;

function renderDiscover() {
  heroIndices = computeDiscoverIndices();
  heroIndex = 0;

  const slidesWrap = document.getElementById('heroSlides');
  slidesWrap.innerHTML = '';

  heroIndices.forEach((index, i) => {
    const data = ALL_CARDS[index];
    const studio = STUDIOS[data.studio];
    const text = cardText(data);
    const timeText = data.justNow ? t().justNow : formatRelativeTime(currentLang, data.timeValue, data.timeUnit);
    const hint = lineageHintFor(data);
    const openQ = isOpenQuestion(data);

    const slide = document.createElement('div');
    slide.className = 'hero-slide' + (i === 0 ? ' is-active' : '') + (openQ ? ' is-open-question' : '');
    slide.dataset.index = String(index);
    slide.dataset.studio = data.studio;
    slide.dataset.cardId = data.id;
    slide.innerHTML = `
      <div class="card-media">
        <span class="card-media-icon" style="color:${studio.color}">${ICONS[data.type]}</span>
        <span class="card-media-badge">${ICONS[data.type]}</span>
      </div>
      <div class="card-discover-badges">
        ${data.justNow ? `<span class="card-new-badge">${t().newBadge}</span>` : ''}
        <span class="card-time-badge">${timeText}</span>
      </div>
      <div class="card-scrim"></div>
      <div class="card-content">
        <div class="card-meta">
          <span class="card-dot" style="background:${studio.color}"></span>
          <span class="card-studio">${studio.name}</span>
          ${statusBadgeHTML(data)}
          <span class="card-type">${t().types[data.type]}</span>
        </div>
        <div class="card-title">${text.title}</div>
        ${hint ? `<div class="card-lineage-hint">↳ ${hint}</div>` : ''}
        ${langPendingText(data) ? `<div class="card-lineage-hint">${langPendingText(data)}</div>` : ''}
      </div>
    `;
    slide.addEventListener('click', () => openCard(slide));
    slidesWrap.appendChild(slide);
    applyCardMedia(slide.querySelector('.card-media'), data.image, studio.color);
  });

  renderHeroDots();
  startHeroAutoplay();
}

function renderHeroDots() {
  const dotsWrap = document.getElementById('heroDots');
  dotsWrap.innerHTML = '';
  heroIndices.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.type = 'button';
    dot.className = 'hero-dot' + (i === 0 ? ' is-active' : '');
    dot.setAttribute('aria-label', String(i + 1));
    dot.addEventListener('click', (e) => {
      e.stopPropagation();
      goToHeroSlide(i);
    });
    dotsWrap.appendChild(dot);
  });
}

// Jumps straight to a slide (dot click, arrow click, or the next tick of the
// autoplay timer) — no scrolling involved, just swap which slide carries
// .is-active so the CSS opacity transition crossfades between the two.
function goToHeroSlide(i) {
  if (!heroIndices.length) return;
  const n = heroIndices.length;
  heroIndex = ((i % n) + n) % n;
  document.querySelectorAll('#heroSlides .hero-slide').forEach((el, idx) => {
    el.classList.toggle('is-active', idx === heroIndex);
  });
  document.querySelectorAll('#heroDots .hero-dot').forEach((el, idx) => {
    el.classList.toggle('is-active', idx === heroIndex);
  });
}

function startHeroAutoplay() {
  stopHeroAutoplay();
  if (heroIndices.length <= 1) return;
  heroTimer = setInterval(() => goToHeroSlide(heroIndex + 1), CONFIG.HERO_ROTATE_MS);
}

function stopHeroAutoplay() {
  if (heroTimer) { clearInterval(heroTimer); heroTimer = null; }
}

// Arrows navigate on click; autoplay pauses while the pointer is anywhere
// over the hero (matches CONFIG.RESUME_DELAY_MS via pauseAutoScroll/
// scheduleResumeAutoScroll, the same pair openCard/exitShareMode already use).
function initHeroControls() {
  const hero = document.getElementById('discoverHero');
  hero.addEventListener('mouseenter', pauseAutoScroll);
  hero.addEventListener('mouseleave', scheduleResumeAutoScroll);
  document.getElementById('heroPrevBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    goToHeroSlide(heroIndex - 1);
  });
  document.getElementById('heroNextBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    goToHeroSlide(heroIndex + 1);
  });
}

// One poster card's DOM — reuses the exact card-media/card-scrim/card-content
// pieces the Discover hero is built from (see renderDiscover), just at the
// smaller base size those classes were originally sized for; the hero-slide
// overrides are what scale them up, not the other way around.
function buildPosterCard(data, index) {
  const studio = STUDIOS[data.studio];
  const text = cardText(data);
  const timeText = data.justNow ? t().justNow : formatRelativeTime(currentLang, data.timeValue, data.timeUnit);
  const hint = lineageHintFor(data);

  const card = document.createElement('div');
  card.className = 'poster-card is-pre-reveal';
  card.dataset.index = String(index);
  card.dataset.studio = data.studio;
  card.dataset.cardId = data.id;
  card.innerHTML = `
    <div class="card-media">
      <span class="card-media-icon" style="color:${studio.color}">${ICONS[data.type]}</span>
      <span class="card-media-badge">${ICONS[data.type]}</span>
    </div>
    <div class="card-discover-badges">
      ${data.justNow ? `<span class="card-new-badge">${t().newBadge}</span>` : ''}
      <span class="card-time-badge">${timeText}</span>
    </div>
    <div class="card-scrim"></div>
    <div class="card-content">
      <div class="card-meta">
        <span class="card-dot" style="background:${studio.color}"></span>
        <span class="card-studio">${studio.name}</span>
        <span class="card-type">${t().types[data.type]}</span>
      </div>
      <div class="card-title">${text.title}</div>
      ${hint ? `<div class="card-lineage-hint">↳ ${hint}</div>` : ''}
      ${langPendingText(data) ? `<div class="card-lineage-hint">${langPendingText(data)}</div>` : ''}
    </div>
  `;
  card.addEventListener('click', () => openCard(card));
  applyCardMedia(card.querySelector('.card-media'), data.image, studio.color);
  return card;
}

// Browse (tier 2) is finished knowledge only — Questions have their own
// tier now (see renderQuestions) and never appear here.
function browseIndices() {
  return ALL_CARDS.map((_, i) => i).filter((i) => !isOpenQuestion(ALL_CARDS[i]));
}

// The track holds the card set twice back-to-back — two identical halves —
// so the auto-scroll/drag loop in initBrowseScroll can wrap the translateX
// by exactly one half-width at any moment with zero visible seam, giving a
// genuinely infinite flow instead of a hard reset or a bounce at the ends.
function renderBrowse() {
  const grid = document.getElementById('browseGrid');
  grid.innerHTML = '';

  const indices = browseIndices();
  const frag = document.createDocumentFragment();
  for (let copy = 0; copy < 2; copy++) {
    indices.forEach((index) => frag.appendChild(buildPosterCard(ALL_CARDS[index], index)));
  }
  grid.appendChild(frag);

  applyBrowseFilters();

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.querySelectorAll('#browseGrid .poster-card.is-pre-reveal').forEach((el, i) => {
        setTimeout(() => el.classList.remove('is-pre-reveal'), Math.min(i % indices.length, 14) * 35);
      });
    });
  });
}

/* ======================================================================
   6. Search + studio/type filters — Browse only (see .poster-card);
      Discover is intentionally untouched by any of this.
   ====================================================================== */
function applyBrowseFilters() {
  const q = searchQuery.trim().toLowerCase();
  let visibleCount = 0;
  document.querySelectorAll('#browseGrid .poster-card').forEach((el) => {
    const index = Number(el.dataset.index);
    const data = ALL_CARDS[index];
    const text = cardText(data);
    const matchesStudio = selectedStudio === 'all' || data.studio === selectedStudio;
    const matchesType = selectedTypeFilter === 'all' || data.type === selectedTypeFilter;
    const matchesSearch = !q || text.title.toLowerCase().includes(q) || text.problem.toLowerCase().includes(q);
    const matchesAuthor = !selectedAuthor || data.author === selectedAuthor;
    const visible = matchesStudio && matchesType && matchesSearch && matchesAuthor;
    el.classList.toggle('is-hidden', !visible);
    if (visible) visibleCount++;
  });
  document.getElementById('browseEmpty').style.display = visibleCount > 0 ? 'none' : 'block';
  // recompute now (most filter changes need no transition to settle) and
  // again once any is-hidden width/margin transition has finished, so the
  // loop's wrap point stays true to the row's actual current width throughout.
  recomputeBrowseHalfWidth();
  setTimeout(recomputeBrowseHalfWidth, 400);
}

/* ======================================================================
   5b. Questions (tier 3) — every question-type card, newest first, laid
   out in a plain wrapping grid rather than the Browse poster track: these
   are meant to be read and answered, not skimmed like a gallery.
   ====================================================================== */
function questionIndices() {
  return ALL_CARDS
    .map((_, i) => i)
    .filter((i) => isOpenQuestion(ALL_CARDS[i]))
    .filter((i) => !selectedAuthor || ALL_CARDS[i].author === selectedAuthor)
    .sort((a, b) => daysAgoOf(ALL_CARDS[a]) - daysAgoOf(ALL_CARDS[b]));
}

function buildQuestionCard(data, index) {

function renderQuestions() {

/* ======================================================================
   5c. Designers — the roster surface: one studio on screen at a time, the
   arrows to move between them, and each studio editing its own list.

   Read the DESIGNERS comment in section 2a before changing anything here:
   there is no ranking in this screen and there must not be one. Everyone
   gets the same card at the same size in the authored order, a card says
   only photo / name / job title, and the two studios never share a screen.
   ====================================================================== */
const DESIGNER_PENCIL_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14.5 6.5l3 3"/></svg>`;
const DESIGNER_PLUS_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`;
// four-way move arrows — the hint on a draggable photo
const FOCAL_MOVE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 3v18M3 12h18"/><path d="M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5"/>
  <path d="M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg>`;

function designerInitials(name) {
  return (name || '')
    .split(/\s+/)
    .filter(Boolean)
    .slice(0, 2)
    .map((part) => part[0].toUpperCase())
    .join('') || '·';
}

// A studio's own typed job title wins over the seeded, translatable one —
// there's no machine translation for what someone wrote (same rule as card
// copy, see cardText).
function designerRole(person) {
  if (person.role) return person.role;
  const roles = t().designers.roles;
  return roles[person.roleKey] || person.roleKey || '';
}

function rosterStudioKeys() {
  const keys = Object.keys(STUDIOS).filter(isStudioEnabled);
  // Your own studio always opens first — you came in through its door.
  return keys.slice().sort((a, b) => (a === MY_STUDIO_KEY ? -1 : b === MY_STUDIO_KEY ? 1 : 0));
}

function designersOf(studioKey) {
  return designerRoster.filter((d) => d.studio === studioKey);
}

let rosterStudioIndex = 0;
let rosterEditMode = false;

function currentRosterStudio() {
  const keys = rosterStudioKeys();
  return keys[Math.min(rosterStudioIndex, keys.length - 1)];
}

/* ---------- focal point ----------
   Every portrait here is a `background-size: cover` fill of a tall 1:1.32 box,
   so whatever doesn't fit gets cropped, and the crop is centred by default.
   That is wrong roughly as often as it is right — a face in the upper third of
   a photo, a subject off to one side. Rather than a crop dialog, the photo is
   dragged inside the frame it will actually appear in, and the resulting
   {x, y} percentage pair rides along with it onto the card. */
const DEFAULT_FOCAL = { x: 50, y: 50 };

function normalizeFocal(pos) {
  if (!pos || typeof pos.x !== 'number' || typeof pos.y !== 'number') return Object.assign({}, DEFAULT_FOCAL);
  return { x: Math.max(0, Math.min(100, pos.x)), y: Math.max(0, Math.min(100, pos.y)) };
}

function focalPointCss(pos) {
  const p = normalizeFocal(pos);
  return p.x + '% ' + p.y + '%';
}

/* Turns an element into a drag surface for a focal point. Pointer Events (not
   mouse events) so a trackpad, a mouse and a touch screen all take the same
   path, with capture so the drag survives the pointer leaving the frame —
   which it will, constantly, on a box this size.

   The mapping is 1:1 with the frame, not with the image: dragging all the way
   across sweeps the full 0–100% range. The true overflow depends on the photo's
   aspect ratio, which would have to be measured per image for a "physically
   correct" ratio — and the correct-feeling result is the one where a small
   nudge is a small nudge regardless of what was uploaded. */
function makeFocalDraggable(el, getPos, onChange) {
  if (!el || el.dataset.focalBound === '1') return;
  el.dataset.focalBound = '1';

  let dragging = false;
  let moved = false;
  let startX = 0, startY = 0, startPos = null, rect = null;

  el.addEventListener('pointerdown', (e) => {
    if (!el.classList.contains('is-focal-draggable')) return;
    if (e.button !== undefined && e.button !== 0) return;
    dragging = true;
    moved = false;
    startX = e.clientX;
    startY = e.clientY;
    startPos = normalizeFocal(getPos());
    rect = el.getBoundingClientRect();
    el.classList.add('is-dragging-focal');
    el.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  el.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    // Dragging the picture right reveals more of its left edge, and
    // background-position counts from the left — so the percentage falls as the
    // pointer rises. Inverting this gives a control that fights the hand.
    const dx = ((e.clientX - startX) / Math.max(1, rect.width)) * 100;
    const dy = ((e.clientY - startY) / Math.max(1, rect.height)) * 100;
    if (Math.abs(e.clientX - startX) > 3 || Math.abs(e.clientY - startY) > 3) moved = true;
    onChange(normalizeFocal({ x: startPos.x - dx, y: startPos.y - dy }));
  });

  const end = (e) => {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('is-dragging-focal');
    if (e && e.pointerId !== undefined && el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
    // A drag ends with a click on the same element. This one is also a button
    // that opens a file picker, so letting it through would pop the picker
    // every time you finish nudging the photo.
    if (moved) {
      el.dataset.focalJustDragged = '1';
      setTimeout(() => { delete el.dataset.focalJustDragged; }, 0);
    }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/* ---------- one card, two faces ----------
   Front: the portrait, with the name and role on a bar across the foot.
   Back: how to reach them, and the one control on this screen that navigates.

   The card is not itself a link. Clicking a face does nothing — you have to aim
   at "See what they shared". A whole-card click meant every attempt to read
   somebody's email address was a navigation away from the roster. */
function buildDesignerCard(person, studio) {
  const editable = rosterEditMode && canEditRoster(person.studio);

  const card = document.createElement('div');
  card.className = 'designer-card' + (selectedAuthor === person.name ? ' is-active' : '') + (editable ? ' is-editing' : '');
  card.dataset.designerId = person.id;
  card.style.setProperty('--studio-color', studio.color);
  card.style.setProperty('--studio-tint', hexToRgba(studio.color, 0.12));

  const inner = document.createElement('div');
  inner.className = 'designer-card-inner';

  // ---- front ----
  const front = document.createElement('div');
  front.className = 'designer-face designer-face-front';

  const photo = document.createElement('div');
  photo.className = 'designer-photo' + (person.photo ? ' has-photo' : '');
  photo.textContent = designerInitials(person.name);
  if (person.photo) {
    photo.style.backgroundImage = `url("${person.photo}")`;
    photo.style.backgroundPosition = focalPointCss(person.photoPos);
  }

  const text = document.createElement('div');
  text.className = 'designer-card-text';
  const nameEl = document.createElement('div');
  nameEl.className = 'designer-name';
  nameEl.textContent = person.name;
  const roleEl = document.createElement('div');
  roleEl.className = 'designer-role';
  roleEl.textContent = designerRole(person);
  text.appendChild(nameEl);
  text.appendChild(roleEl);

  front.appendChild(photo);
  front.appendChild(text);

  // ---- back ----
  const back = document.createElement('div');
  back.className = 'designer-face designer-face-back';

  const backHead = document.createElement('div');
  backHead.className = 'designer-back-head';
  const backName = document.createElement('div');
  backName.className = 'designer-name';
  backName.textContent = person.name;
  const backRole = document.createElement('div');
  backRole.className = 'designer-role';
  backRole.textContent = designerRole(person);
  backHead.appendChild(backName);
  backHead.appendChild(backRole);
  back.appendChild(backHead);

  const entries = designerLinkEntries(person);
  if (entries.length) {
    const list = document.createElement('div');
    list.className = 'designer-links';
    entries.forEach((entry) => {
      const a = document.createElement('a');
      a.className = 'designer-link';
      a.href = designerLinkHref(entry.kind, entry.value);
      if (entry.kind !== 'email') { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      a.innerHTML = `<span class="designer-link-icon">${entry.icon}</span><span class="designer-link-text"></span>`;
      // textContent: an address someone typed is not markup
      a.querySelector('.designer-link-text').textContent = designerLinkText(entry.kind, entry.value);
      a.title = entry.value;
      list.appendChild(a);
    });
    back.appendChild(list);
  } else {
    const none = document.createElement('p');
    none.className = 'designer-links-empty';
    none.textContent = t().designers.noLinks;
    back.appendChild(none);
  }

  const seeBtn = document.createElement('button');
  seeBtn.type = 'button';
  seeBtn.className = 'designer-see-work';
  seeBtn.textContent = t().designers.seeTheirKnowledge;
  seeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    focusDesigner(person);
  });
  back.appendChild(seeBtn);

  inner.appendChild(front);
  inner.appendChild(back);
  card.appendChild(inner);

  if (editable) {
    const editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'designer-edit-btn';
    editBtn.innerHTML = DESIGNER_PENCIL_ICON;
    editBtn.setAttribute('aria-label', t().designers.editPerson(person.name));
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openDesignerEditor(person);
    });
    card.appendChild(editBtn);
    // In edit mode the card is an object you're arranging, not something to
    // read — the whole surface opens the editor and it never flips.
    card.addEventListener('click', () => openDesignerEditor(person));
  }

  return card;
}

/* ---------- sizing the row ----------
   A card's width follows from its height (aspect-ratio: 1/1.4), so the row has
   to be sized against whichever of the two constraints bites first: the height
   the surface can spare, or the width the panel can spare once every tile and
   the gaps between them are counted. How many tiles there are is only known at
   render time — turning edit mode on adds one — which is why this is script and
   not CSS. */
const ROSTER_CARD_RATIO = 1.4;   // height / width
const ROSTER_MIN_H = 260;
const ROSTER_MAX_VH = 0.65;      // "60–65% of the viewport" — the top of that

function sizeAllRosters(animate) {
  const viewport = document.getElementById('designersViewport');
  const head = viewport.querySelector('.designers-head');
  if (!viewport.clientHeight || !head) return;
  // The studio caption sits below the cards, so it is a second fixed block
  // competing for the same height — miss it and the row is sized as if it owned
  // everything under the heading, and the caption gets pushed off screen.
  const caption = viewport.querySelector('.studio-bar');
  const chromeH = head.offsetHeight + (caption ? caption.offsetHeight : 0);

  document.querySelectorAll('#designersStage .designers-panel').forEach((panel) => {
    const roster = panel.querySelector('.designer-roster');
    if (!roster) return;
    const tiles = roster.querySelectorAll('.designer-card, .designer-add-card').length;
    // A hidden surface (display:none) measures as zero — leave the last good
    // height in place and let enterDesignersMode re-run this once it's shown.
    if (!tiles || !panel.clientWidth) return;

    const panelStyle = getComputedStyle(panel);
    const availW = panel.clientWidth - parseFloat(panelStyle.paddingLeft) - parseFloat(panelStyle.paddingRight);
    const availH = viewport.clientHeight - chromeH
      - parseFloat(panelStyle.paddingTop) - parseFloat(panelStyle.paddingBottom);
    const gap = parseFloat(getComputedStyle(roster).columnGap) || 0;

    const widthBound = ((availW - gap * (tiles - 1)) / tiles) * ROSTER_CARD_RATIO;
    const height = Math.max(ROSTER_MIN_H, Math.min(availH, widthBound, window.innerHeight * ROSTER_MAX_VH));

    if (!animate) {
      roster.style.transition = 'none';
      roster.style.height = Math.floor(height) + 'px';
      void roster.offsetHeight; // land it before re-arming the transition
      roster.style.transition = '';
    } else {
      roster.style.height = Math.floor(height) + 'px';
    }
  });
}

function renderDesigners() {
  const strings = t().designers;
  const stage = document.getElementById('designersStage');
  const viewport = document.getElementById('designersViewport');
  const keys = rosterStudioKeys();
  if (rosterStudioIndex > keys.length - 1) rosterStudioIndex = 0;

  document.getElementById('designersHeading').textContent = strings.heading;
  document.getElementById('designersIntro').textContent = strings.intro;
  document.getElementById('designersCloseBtn').setAttribute('aria-label', strings.closeAria);
  document.getElementById('studioPrevBtn').setAttribute('aria-label', strings.prevStudio);
  document.getElementById('studioNextBtn').setAttribute('aria-label', strings.nextStudio);
  viewport.classList.toggle('is-single-studio', keys.length < 2);
  viewport.classList.toggle('is-editing', rosterEditMode);

  stage.innerHTML = '';
  keys.forEach((studioKey) => {
    const studio = STUDIOS[studioKey];
    const panel = document.createElement('div');
    panel.className = 'designers-panel';
    panel.dataset.studio = studioKey;

    const roster = document.createElement('div');
    roster.className = 'designer-roster';

    const people = designersOf(studioKey);
    people.forEach((person) => roster.appendChild(buildDesignerCard(person, studio)));

    if (!people.length && !(rosterEditMode && canEditRoster(studioKey))) {
      const empty = document.createElement('p');
      empty.className = 'designer-roster-empty';
      empty.textContent = strings.emptyRoster;
      roster.appendChild(empty);
    }

    // Nothing editable is rendered at all on someone else's studio — not
    // disabled, not hidden: absent.
    if (rosterEditMode && canEditRoster(studioKey)) {
      const add = document.createElement('button');
      add.type = 'button';
      add.className = 'designer-add-card';
      add.innerHTML = `${DESIGNER_PLUS_ICON}<span>${strings.addDesigner}</span>`;
      add.addEventListener('click', () => openDesignerEditor(null));
      roster.appendChild(add);
    }

    panel.appendChild(roster);
    stage.appendChild(panel);
  });

  applyRosterStudio(false);
  sizeAllRosters(false);
}

// Paints the caption for whichever studio is on screen and slides the stage to
// it. `animate` is false on a full re-render so rebuilding the roster (an edit,
// a language switch) doesn't replay the slide.
function applyRosterStudio(animate) {
  const studioKey = currentRosterStudio();
  const studio = STUDIOS[studioKey];
  const strings = t().designers;

  const stage = document.getElementById('designersStage');
  stage.style.transition = animate ? '' : 'none';
  // -100% per studio, not -100/n%: a percentage translate resolves against the
  // element's own border box, and the stage's box is one panel wide (the panels
  // are `flex: 0 0 100%` and overflow it) — so one panel *is* 100%.
  stage.style.transform = `translate3d(${-rosterStudioIndex * 100}%, 0, 0)`;
  if (!animate) {
    void stage.offsetWidth; // land the jump before re-arming the transition
    stage.style.transition = '';
  }

  buildStudioMark(document.getElementById('studioPagerMark'), studio);
  document.getElementById('studioPagerName').textContent = studio.name;
  document.getElementById('studioPagerYou').textContent = canEditRoster(studioKey) ? strings.yourStudio : '';
  const current = document.querySelector('.studio-pager-current');
  current.style.setProperty('--studio-tint', hexToRgba(studio.color, 0.1));
  current.style.setProperty('--studio-color', studio.color);

  // Edit only exists on your own studio. Someone else's roster is something you
  // read; it shouldn't even show a control you can't use.
  const toggle = document.getElementById('rosterEditToggle');
  const editable = canEditRoster(studioKey);
  toggle.style.display = editable ? '' : 'none';
  toggle.classList.toggle('is-on', editable && rosterEditMode);
  document.getElementById('rosterEditLabel').textContent = rosterEditMode ? strings.editDone : strings.edit;
}

/* The studio's logo, or a coloured dot when there isn't one on disk. Probed the
   same way card art is (see applyCardMedia): the dot is painted first and the
   image only replaces it once it has actually loaded, so a studio added without
   a logo file degrades instead of showing a broken tile. */
function buildStudioMark(el, studio) {
  if (!el) return;
  el.style.setProperty('--studio-color', studio.color);
  el.style.setProperty('--studio-tint', hexToRgba(studio.color, 0.12));
  el.style.backgroundImage = '';
  el.innerHTML = '<span class="studio-mark-dot"></span>';
  if (!studio.logo) return;
  const probe = new Image();
  probe.onload = () => {
    el.style.backgroundImage = `url("${studio.logo}")`;
    el.innerHTML = '';
  };
  probe.onerror = () => { /* no file for this studio — the dot stays */ };
  probe.src = studio.logo;
}

/* True while the stage is sliding. Set here rather than read off the element,
   because a transitionend on a transform that is also being re-triggered is not
   something to build a lock out of. */
let rosterSlideAnimating = false;
let rosterSlideTimer = null;
const ROSTER_SLIDE_MS = 720; // matches .designers-stage's transition duration

function goToRosterStudio(index) {
  const keys = rosterStudioKeys();
  // A single studio has nowhere to go; wrapping would slide back to itself.
  if (keys.length < 2) return;
  const next = ((index % keys.length) + keys.length) % keys.length;
  if (next === rosterStudioIndex) return;
  rosterStudioIndex = next;

  rosterSlideAnimating = true;
  clearTimeout(rosterSlideTimer);
  rosterSlideTimer = setTimeout(() => { rosterSlideAnimating = false; }, ROSTER_SLIDE_MS);

  // Leaving your own studio drops you out of edit mode — otherwise you'd arrive
  // somewhere you can't edit with the toggle still reading "on".
  if (rosterEditMode && !canEditRoster(currentRosterStudio())) {
    rosterEditMode = false;
    renderDesigners();
    applyRosterStudio(true);
    return;
  }
  applyRosterStudio(true);
}

function toggleRosterEditMode() {
  rosterEditMode = !rosterEditMode;
  renderDesigners();
  sizeAllRosters(true); // the Add tile changes the tile count, so the row resizes
}

/* ---- add / edit one person ---------------------------------------------
   Photos are downscaled to a card-sized thumbnail before anything stores
   them: a roster of full-resolution portraits would exhaust the origin's
   localStorage budget within a few people, and an oversized data: URL also
   gets silently refused as a CSS background value (the same trap the card
   art hit — see applyCardMedia). */
const DESIGNER_PHOTO_MAX_DIM = 480;
const DESIGNER_PHOTO_QUALITY = 0.8;

let editingDesignerId = null;   // null while adding
let editorPhotoUrl = null;
// The focal point of the photo being edited — see makeFocalDraggable.
let editorPhotoPos = Object.assign({}, DEFAULT_FOCAL);

// One row per link kind, created from DESIGNER_LINK_KINDS rather than written
// out in the markup — a new kind then needs no HTML and no save-path change.
function renderEditorLinkRows() {
  const grid = document.getElementById('editorLinksGrid');
  if (!grid || grid.childElementCount) return; // built once; values are set per open
  DESIGNER_LINK_KINDS.forEach((kind) => {
    const row = document.createElement('div');
    row.className = 'editor-link-row';
    row.innerHTML = `<span class="editor-link-row-icon">${kind.icon}</span>`;
    const input = document.createElement('input');
    input.type = kind.key === 'email' ? 'email' : 'url';
    input.id = 'editorLink_' + kind.key;
    input.autocomplete = 'off';
    row.appendChild(input);
    grid.appendChild(row);
  });
}

function readEditorLinks() {
  const out = {};
  DESIGNER_LINK_KINDS.forEach((kind) => {
    const el = document.getElementById('editorLink_' + kind.key);
    const value = el ? el.value.trim() : '';
    if (value) out[kind.key] = value; // blanks are dropped, not stored empty
  });
  return out;
}

function fillEditorLinks(person) {
  const links = (person && person.links) || {};
  DESIGNER_LINK_KINDS.forEach((kind) => {
    const el = document.getElementById('editorLink_' + kind.key);
    if (el) el.value = links[kind.key] || '';
  });
}

function openDesignerEditor(person) {
  const studioKey = currentRosterStudio();
  if (!canEditRoster(studioKey)) return; // belt and braces; the UI never offers it
  const strings = t().designers;

  editingDesignerId = person ? person.id : null;
  editorPhotoUrl = person ? (person.photo || null) : null;
  editorPhotoPos = normalizeFocal(person && person.photoPos);

  document.getElementById('designerEditorTitle').textContent = person ? strings.editTitle : strings.addTitle;
  document.getElementById('editorNameInput').value = person ? person.name : '';
  document.getElementById('editorRoleInput').value = person ? designerRole(person) : '';
  document.getElementById('editorDeleteBtn').style.display = person ? '' : 'none';
  document.getElementById('editorDeleteConfirm').style.display = 'none';
  renderEditorLinkRows();
  fillEditorLinks(person);

  const zone = document.getElementById('editorPhotoZone');
  zone.style.setProperty('--studio-color', STUDIOS[studioKey].color);
  zone.style.setProperty('--studio-tint', hexToRgba(STUDIOS[studioKey].color, 0.12));

  refreshEditorPhoto();
  refreshEditorSaveState();
  document.getElementById('designerEditor').style.display = 'flex';
  document.getElementById('editorNameInput').focus();
}

function closeDesignerEditor() {
  document.getElementById('designerEditor').style.display = 'none';
  editingDesignerId = null;
  editorPhotoUrl = null;
  editorPhotoPos = Object.assign({}, DEFAULT_FOCAL);
}

function refreshEditorPhoto() {
  const zone = document.getElementById('editorPhotoZone');
  const fallback = document.getElementById('editorPhotoFallback');
  const removeBtn = document.getElementById('editorPhotoRemoveBtn');
  fallback.textContent = designerInitials(document.getElementById('editorNameInput').value);
  if (editorPhotoUrl) {
    zone.style.backgroundImage = `url("${editorPhotoUrl}")`;
    zone.style.backgroundPosition = focalPointCss(editorPhotoPos);
    zone.classList.add('has-photo');
    zone.classList.add('is-focal-draggable');
    removeBtn.style.display = '';
  } else {
    zone.style.backgroundImage = '';
    zone.style.backgroundPosition = '';
    zone.classList.remove('has-photo');
    zone.classList.remove('is-focal-draggable');
    removeBtn.style.display = 'none';
  }
  // the hint only makes sense once there is a photo under it
  const hint = document.getElementById('editorPhotoDragHint');
  if (hint) hint.style.display = editorPhotoUrl ? '' : 'none';
}

function refreshEditorSaveState() {
  const name = document.getElementById('editorNameInput').value.trim();
  const role = document.getElementById('editorRoleInput').value.trim();
  document.getElementById('editorSaveBtn').disabled = !name || !role;
}

function handleDesignerPhotoFile(file) {
  if (!file || !file.type || !file.type.startsWith('image/')) return;
  resizeImageToDataUrl(file, DESIGNER_PHOTO_MAX_DIM, DESIGNER_PHOTO_QUALITY)
    .then((dataUrl) => {
      editorPhotoUrl = dataUrl;
      editorPhotoPos = Object.assign({}, DEFAULT_FOCAL); // new photo, new crop
      refreshEditorPhoto();
    })
    .catch((err) => {
      console.error('[Loom feed] could not process the designer photo:', err);
      showToast(t().share.imageFailed);
    });
}

function saveDesignerFromEditor() {
  const name = document.getElementById('editorNameInput').value.trim();
  const role = document.getElementById('editorRoleInput').value.trim();
  if (!name || !role) return;
  const studioKey = currentRosterStudio();
  if (!canEditRoster(studioKey)) return;

  if (editingDesignerId) {
    const person = designerRoster.find((d) => d.id === editingDesignerId);
    if (person) {
      person.name = name;
      // Typed over a seeded designer: the free-text role replaces the
      // translatable key outright, or the old label would come back on the
      // next language switch and quietly undo the edit.
      person.role = role;
      delete person.roleKey;
      person.photo = editorPhotoUrl;
      person.photoPos = editorPhotoUrl ? Object.assign({}, editorPhotoPos) : null;
      person.links = readEditorLinks();
    }
  } else {
    designerRoster.push({
      id: 'designer-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7),
      studio: studioKey,
      name,
      role,
      photo: editorPhotoUrl,
      photoPos: editorPhotoUrl ? Object.assign({}, editorPhotoPos) : null,
      links: readEditorLinks(),
    });
  }

  persistDesigners();
  closeDesignerEditor();
  renderDesigners();
}

function deleteDesignerFromEditor() {
  if (!editingDesignerId) return;
  const person = designerRoster.find((d) => d.id === editingDesignerId);
  if (!person || !canEditRoster(person.studio)) return;
  // Someone removed from the roster keeps whatever they shared — the cards
  // are the studio's knowledge, not that person's entry in a directory.
  if (selectedAuthor === person.name) setAuthorFilter(null);
  designerRoster = designerRoster.filter((d) => d.id !== editingDesignerId);
  persistDesigners();
  closeDesignerEditor();
  renderDesigners();
}

function refreshDesignerEditorText() {
  const strings = t().designers;
  document.getElementById('editorPhotoLabel').textContent = strings.photoLabel;
  document.getElementById('editorPhotoHint').textContent = strings.photoHint;
  document.getElementById('editorPhotoPickBtn').textContent = strings.photoPick;
  document.getElementById('editorPhotoRemoveBtn').textContent = strings.photoRemove;
  document.getElementById('editorNameLabel').textContent = strings.nameLabel;
  document.getElementById('editorNameInput').placeholder = strings.namePlaceholder;
  document.getElementById('editorRoleLabel').textContent = strings.roleLabel;
  document.getElementById('editorRoleInput').placeholder = strings.rolePlaceholder;
  const linksLabel = document.getElementById('editorLinksLabel');
  if (linksLabel) linksLabel.textContent = strings.linksLabel;
  renderEditorLinkRows();
  DESIGNER_LINK_KINDS.forEach((kind) => {
    const el = document.getElementById('editorLink_' + kind.key);
    if (el) el.placeholder = strings.linkPlaceholders[kind.key] || '';
  });
  const dragHint = document.getElementById('editorPhotoDragHint');
  if (dragHint) {
    dragHint.innerHTML = FOCAL_MOVE_ICON + '<span></span>';
    dragHint.querySelector('span').textContent = strings.photoDragHint;
  }
  document.getElementById('editorCancelBtn').textContent = strings.cancel;
  document.getElementById('editorSaveLabel').textContent = strings.save;
  document.getElementById('editorDeleteLabel').textContent = strings.deletePerson;
  document.getElementById('editorDeleteCancelBtn').textContent = strings.deleteCancel;
  document.getElementById('editorDeleteConfirmBtn').textContent = strings.deleteConfirmButton;
  document.getElementById('editorDeleteConfirmText').textContent = strings.deleteConfirmText;
}

/* ---- the per-person filter handed back to the feed ---- */

// Paints (or hides) both copies of the "showing one person's knowledge" chip
// — one on Browse, one on Questions, since either floor can be the one you
// land on and neither should look unfiltered while it isn't.
function renderAuthorFilterChip() {
  const person = selectedAuthor ? designerRoster.find((d) => d.name === selectedAuthor) : null;
  [['authorChipBrowse', 'authorChipBrowseAvatar', 'authorChipBrowseLabel'],
   ['authorChipQuestions', 'authorChipQuestionsAvatar', 'authorChipQuestionsLabel']].forEach(([chipId, avatarId, labelId]) => {
    const chip = document.getElementById(chipId);
    if (!chip) return;
    if (!selectedAuthor) { chip.style.display = 'none'; return; }
    chip.style.display = '';
    chip.style.setProperty('--studio-color', person ? STUDIOS[person.studio].color : 'rgba(255,255,255,0.2)');
    document.getElementById(avatarId).textContent = designerInitials(selectedAuthor);
    document.getElementById(labelId).textContent = t().designers.viewing(selectedAuthor);
    chip.title = t().designers.clearFilter;
  });
}

function setAuthorFilter(name) {
  selectedAuthor = name;
  renderAuthorFilterChip();
  applyBrowseFilters();
  renderQuestions();
}

// Picking a person closes the roster and drops you onto Browse already
// filtered to their work — the whole point of the screen is "and here's what
// they've put in", so it shouldn't need a second click to get there.
function focusDesigner(person) {
  setAuthorFilter(person.name);
  exitDesignersMode(() => goToFloor(1));
}

function initDesigners() {
  renderDesigners();
  refreshDesignerEditorText();

  document.getElementById('designersCloseBtn').addEventListener('click', () => exitDesignersMode());
  document.getElementById('studioPrevBtn').addEventListener('click', () => goToRosterStudio(rosterStudioIndex - 1));
  document.getElementById('studioNextBtn').addEventListener('click', () => goToRosterStudio(rosterStudioIndex + 1));
  document.getElementById('rosterEditToggle').addEventListener('click', toggleRosterEditMode);
  window.addEventListener('resize', () => sizeAllRosters(false));

  /* Wheel down = next studio, wheel up = previous. The rest of this app moves
     between screens on the wheel (see initFeedWheelSnap), so arriving here and
     finding the wheel dead reads as the page having stopped responding. The
     motion is goToRosterStudio's own — the same 0.72s ease the arrows use — and
     input during it is swallowed, so a fast trackpad flick still travels
     exactly one studio rather than stacking up.

     preventDefault stops the surface itself from scrolling, which is also what
     keeps a scrollbar from appearing mid-transition. */
  const viewport = document.getElementById('designersViewport');
  viewport.addEventListener('wheel', (e) => {
    if (!isDesignersMode) return;
    if (e.target.closest && e.target.closest('.designer-editor')) return; // the editor scrolls itself
    if (e.deltaY === 0) return;
    e.preventDefault();
    if (rosterSlideAnimating) return;
    goToRosterStudio(rosterStudioIndex + (e.deltaY > 0 ? 1 : -1));
  }, { passive: false });

  ['authorChipBrowse', 'authorChipQuestions'].forEach((id) => {
    const chip = document.getElementById(id);
    if (chip) chip.addEventListener('click', () => setAuthorFilter(null));
  });

  // ---- editor wiring ----
  const zone = document.getElementById('editorPhotoZone');
  const fileInput = document.getElementById('editorPhotoInput');
  zone.addEventListener('click', () => {
    if (zone.dataset.focalJustDragged) return; // that click was the end of a drag
    fileInput.click();
  });
  zone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });
  // once a photo is in, the tile is also the crop control
  makeFocalDraggable(
    zone,
    () => editorPhotoPos,
    (pos) => {
      editorPhotoPos = pos;
      zone.style.backgroundPosition = focalPointCss(pos);
    }
  );
  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('is-dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('is-dragover'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('is-dragover');
    handleDesignerPhotoFile(e.dataTransfer.files && e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    handleDesignerPhotoFile(fileInput.files && fileInput.files[0]);
    fileInput.value = ''; // so re-picking the same file still fires 'change'
  });
  document.getElementById('editorPhotoPickBtn').addEventListener('click', () => fileInput.click());
  document.getElementById('editorPhotoRemoveBtn').addEventListener('click', () => {
    editorPhotoUrl = null;
    editorPhotoPos = Object.assign({}, DEFAULT_FOCAL);
    refreshEditorPhoto();
  });

  document.getElementById('editorNameInput').addEventListener('input', () => {
    refreshEditorPhoto(); // the initials fallback tracks what's being typed
