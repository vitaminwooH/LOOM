/* ======================================================================
   6b. Browse poster row — a slow continuous drift to the left, draggable
   by pointer, paused on hover (and whenever a modal/share mode has focus).
   The track holds two identical copies of the card set back-to-back (see
   renderBrowse) so wrapping the scroll position by exactly one half-width
   is always visually seamless — an infinite flow with no reset jump and no
   bounce at the ends, at any scroll position, even mid-drag.
   ====================================================================== */
let browseX = 0;            // current translateX of the track, in px (moves negative)
let browseHalfWidth = 0;    // width of one copy of the card set
let browseHovering = false;
let browseDragging = false;
let browseDragStartClientX = 0;
let browseDragStartX = 0;
let browseDragMoved = false;
let browseLastTs = null;

function recomputeBrowseHalfWidth() {
  const track = document.getElementById('browseGrid');
  if (!track) return;
  browseHalfWidth = track.scrollWidth / 2;
}

function browseTick(ts) {
  requestAnimationFrame(browseTick);
  if (browseLastTs == null) browseLastTs = ts;
  const dt = ts - browseLastTs;
  browseLastTs = ts;

  if (!browseDragging && !browseHovering && !isCardExpanded && !isShareMode) {
    browseX -= (CONFIG.BROWSE_SCROLL_SPEED * dt) / 1000;
  }

  // Wrapping by exactly one half-width is a no-op visually (the two halves
  // are identical), so it's safe to do every frame, drag or no drag. Kept
  // in (-browseHalfWidth, 0] — negative because the track drifts leftward.
  if (browseHalfWidth > 0) {
    const n = ((browseX % browseHalfWidth) + browseHalfWidth) % browseHalfWidth;
    browseX = n - browseHalfWidth;
  }

  const track = document.getElementById('browseGrid');
  if (track) track.style.transform = `translateX(${browseX}px)`;
}

function initBrowseScroll() {
  const wrap = document.getElementById('browseTrackWrap');
  recomputeBrowseHalfWidth();

  wrap.addEventListener('mouseenter', () => { browseHovering = true; });
  wrap.addEventListener('mouseleave', () => { browseHovering = false; });

  // Deliberately no setPointerCapture here: capturing the pointer on `wrap`
  // also redirects the resulting synthetic `click` event's target to `wrap`
  // itself (not whatever card is underneath), which silently breaks
  // click-to-open for every card. Tracking the drag with plain window-level
  // move/up listeners avoids that entirely.
  const onPointerMove = (e) => {
    if (!browseDragging) return;
    const dx = e.clientX - browseDragStartClientX;
    if (Math.abs(dx) > 4) browseDragMoved = true;
    browseX = browseDragStartX + dx;
  };
  const onPointerUp = () => {
    if (!browseDragging) return;
    browseDragging = false;
    wrap.classList.remove('is-dragging');
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    window.removeEventListener('pointercancel', onPointerUp);
  };
  wrap.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    browseDragging = true;
    browseDragMoved = false;
    browseDragStartClientX = e.clientX;
    browseDragStartX = browseX;
    wrap.classList.add('is-dragging');
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
  });
  // A drag that actually moved the row shouldn't also open the card the
  // pointer happened to land on — swallow that one click in the capture
  // phase, before it ever reaches the card's own listener.
  wrap.addEventListener('click', (e) => {
    if (browseDragMoved) { e.stopPropagation(); e.preventDefault(); }
  }, true);

  window.addEventListener('resize', recomputeBrowseHalfWidth);

  requestAnimationFrame(browseTick);
}

/* ======================================================================
   6c. Floor-to-floor motion — the feed is three floors (0 Discover,
   1 Browse, 2 Questions), each exactly one viewport tall, and one wheel
   tick always travels exactly one floor.

   It's a transform on a stage, not scrollTop on a scroller, for two reasons
   this used to get wrong:
     - scrollTop clamps at 0 and at scrollHeight, so the tween's overshoot
       was silently erased at both ends of the page;
     - a floor taller than the viewport left native scrolling to cover the
       remainder, which is why 2 -> 3 used to need several wheel ticks before
       it would commit. Every floor is now pinned to --floor-h, and overflow
       inside a floor is that floor's own business (see .floor-scroll).

   Extra wheel input arriving mid-tween is swallowed, so overlapping gestures
   (a fast trackpad flick, several mouse-wheel clicks in a row) can't stack:
   the first tick commits to a destination and the tween finishes there.
   ====================================================================== */
const FLOOR_COUNT = 3;
let feedSnapAnimating = false;
let currentFloor = 0;
let feedStageOffset = 0; // px the stage is currently translated *up* by

// A real CSS cubic-bezier(x1,y1,x2,y2) timing function, evaluated in JS
// (Newton-Raphson on the x-curve, standard bezier-easing approach) so the
// stage transform — which has to be driven frame by frame, since each floor
// change is its own distance — rides the exact same curve a
// `transition-timing-function` would use. Letting the y control points go
// past 1 (see CONFIG.FEED_SNAP_EASE) is what gives the curve its
// overshoot-then-settle landing.
function makeCubicBezier(x1, y1, x2, y2) {
  const a = (p1, p2) => 1.0 - 3.0 * p2 + 3.0 * p1;
  const b = (p1, p2) => 3.0 * p2 - 6.0 * p1;
  const c = (p1) => 3.0 * p1;
  const calc = (t, p1, p2) => ((a(p1, p2) * t + b(p1, p2)) * t + c(p1)) * t;
  const slope = (t, p1, p2) => 3.0 * a(p1, p2) * t * t + 2.0 * b(p1, p2) * t + c(p1);
  function tForX(x) {
    let t = x;
    for (let i = 0; i < 8; i++) {
      const sl = slope(t, x1, x2);
      if (Math.abs(sl) < 1e-6) break;
      t -= (calc(t, x1, x2) - x) / sl;
    }
    return Math.max(0, Math.min(1, t));
  }
  // The *output* is deliberately not clamped — the whole point of y1/y2 > 1
  // is a value that briefly exceeds 1. Only the endpoints are pinned.
  return (x) => (x <= 0 ? 0 : x >= 1 ? 1 : calc(tForX(x), y1, y2));
}
const feedSnapEase = makeCubicBezier.apply(null, CONFIG.FEED_SNAP_EASE);

function floorHeight() {
  const feedMain = document.getElementById('feedMain');
  return (feedMain && feedMain.clientHeight) || Math.max(1, window.innerHeight - 98);
}

function setStageOffset(px) {
  feedStageOffset = px;
  const stage = document.getElementById('feedStage');
  if (stage) stage.style.transform = 'translate3d(0, ' + (-px) + 'px, 0)';
}

/* ---- the "scene change" arrival reveal ----
   Pre-set the arriving floor's heading/explainer/controls/cards to a faded,
   dropped-down state, force a reflow so that's actually the frame that
   paints, then release them on a stagger a beat after the tween launches —
   so the floor doesn't slide past, it assembles itself as it lands. */
const REVEAL_START_MS = 100;        // into the tween before anything is released
const REVEAL_EXPLAINER_MS = 60;
const REVEAL_CONTROLS_MS = 110;
const REVEAL_CARDS_MS = 165;
const REVEAL_CARD_STAGGER_MS = 52;
const REVEAL_CARD_STAGGER_CAP = 8;  // past this many, the rest land together

function floorRevealParts(floor) {
  if (floor === 2) {
    return {
      heading: document.getElementById('questionsHeading'),
      explainer: document.getElementById('questionsSub'),
      controls: document.getElementById('questionsCount'),
      cards: Array.from(document.querySelectorAll('#questionsGrid .question-card:not(.is-hidden)')),
    };
  }
  if (floor === 1) {
    return {
      heading: document.getElementById('browseHeading'),
      explainer: document.getElementById('browseSub'),
      controls: document.getElementById('browseControls'),
      cards: Array.from(document.querySelectorAll('#browseGrid .poster-card:not(.is-hidden)')),
    };
  }
  return {
    heading: document.getElementById('discoverHeading'),
    explainer: document.getElementById('discoverSub'),
    controls: null,
    cards: Array.from(document.querySelectorAll('.hero-slide.is-active .card-content')),
  };
}

let revealTimers = [];
function playArrivalReveal(floor) {
  revealTimers.forEach(clearTimeout);
  revealTimers = [];

  const parts = floorRevealParts(floor);
  const all = [parts.heading, parts.explainer, parts.controls].concat(parts.cards).filter(Boolean);
  if (!all.length) return;

  all.forEach((el) => el.classList.add('is-pre-reveal'));
  void document.body.offsetWidth; // force reflow so the "pre" frame actually paints first

  const release = (el, delay) => {
    if (!el) return;
    revealTimers.push(setTimeout(() => el.classList.remove('is-pre-reveal'), REVEAL_START_MS + delay));
  };
  release(parts.heading, 0);
  release(parts.explainer, REVEAL_EXPLAINER_MS);
  release(parts.controls, REVEAL_CONTROLS_MS);
  parts.cards.forEach((el, i) => {
    release(el, REVEAL_CARDS_MS + Math.min(i, REVEAL_CARD_STAGGER_CAP) * REVEAL_CARD_STAGGER_MS);
  });
}

// The single entry point for changing floors — the wheel, the center menu,
// the Designers filter and coming back out of share mode all go through here.
function goToFloor(floor, options) {
  const opts = options || {};
  const target = Math.max(0, Math.min(FLOOR_COUNT - 1, floor));
  const endPx = target * floorHeight();

  if (opts.instant) {
    feedSnapAnimating = false;
    currentFloor = target;
    setStageOffset(endPx);
    return;
  }
  if (feedSnapAnimating) return;

  currentFloor = target;
  const startPx = feedStageOffset;
  const distance = endPx - startPx;

  // Already standing on it (e.g. a menu pick for the current floor): still
  // play the reveal, so it reads as "you arrived somewhere" either way.
  if (Math.abs(distance) < 1) {
    setStageOffset(endPx);
    playArrivalReveal(target);
    return;
  }

  feedSnapAnimating = true;
  playArrivalReveal(target);

  const duration = CONFIG.FEED_SNAP_DURATION_MS;
  const startTime = performance.now();

  function step(now) {
    const p = Math.min(1, (now - startTime) / duration);
    // hard launch, then a long settle that briefly passes the landing point
    // and eases back into it (feedSnapEase returns > 1 mid-flight)
    setStageOffset(startPx + distance * feedSnapEase(p));
    if (p < 1) {
      requestAnimationFrame(step);
    } else {
      setStageOffset(endPx); // land exactly, never a sub-pixel short
      feedSnapAnimating = false;
    }
  }
  requestAnimationFrame(step);
}

// True while `el` still has somewhere to go in the wheel's direction. A floor
// with its own overflow (Questions, when there are a lot of them) consumes
// the wheel until it reaches its own edge, and only then hands back over to
// the floor-to-floor snap.
function innerScrollHasRoom(el, deltaY) {
  const max = el.scrollHeight - el.clientHeight;
  if (max <= 1) return false;
  return deltaY > 0 ? el.scrollTop < max - 1 : el.scrollTop > 1;
}

function initFeedWheelSnap() {
  const feedMain = document.getElementById('feedMain');

  feedMain.addEventListener('wheel', (e) => {
    if (isCardExpanded || isShareMode) return;
    if (e.deltaY === 0) return;
    if (feedSnapAnimating) { e.preventDefault(); return; }

    const inner = e.target.closest ? e.target.closest('.floor-scroll') : null;
    if (inner && innerScrollHasRoom(inner, e.deltaY)) return; // the floor scrolls itself first

    e.preventDefault();
    const next = currentFloor + (e.deltaY > 0 ? 1 : -1);
    if (next < 0 || next > FLOOR_COUNT - 1) return;
    goToFloor(next);
  }, { passive: false });

  // The stage is positioned in pixels, so a resized window would otherwise
  // leave it parked between floors — re-derive it from the floor we're on.
  window.addEventListener('resize', () => {
    if (feedSnapAnimating) return;
    setStageOffset(currentFloor * floorHeight());
  });
}

// "Where it spread" — a plain list of this card's connections (derivedFrom/

function renderLineageList(data) {
  const wrap = document.getElementById('lineageListWrap');
  wrap.innerHTML = '';

  if (nodes.length === 0) {
    const empty = document.createElement('p');
    empty.className = 'lineage-empty';
    empty.textContent = t().lineage.empty;
    wrap.appendChild(empty);
    return;
  }

  nodes.forEach((node) => {
    const row = document.createElement('div');
    row.className = 'lineage-row';
    const relationLabel = node.kind === 'studio' ? t().lineage.appliedBy : t().lineage[node.relation];
    const nameLabel = node.kind === 'studio' ? node.name : truncateForSummary(node.title, 64);
    row.innerHTML = `<span class="lineage-row-dot" style="background:${node.color}"></span>` +
      `<span class="lineage-row-relation">${relationLabel}</span>` +
      `<span class="lineage-row-name">${nameLabel}</span>`;
    wrap.appendChild(row);
  });
}

// Adding a reply on the left plays a brief fake "Summarizing…" moment, then
// the brief on the right gains one new line — there's no real AI behind
// this (see getConversationBrief/currentQuestionData), just a rough mime of
// what a live summary refresh would feel like.
function simulateSummaryUpdate() {
  const body = document.getElementById('briefBody');
  const updated = document.getElementById('briefUpdated');
  const s = t().brief;
  if (body.querySelector('.brief-empty')) return; // nothing to "refresh" without a real brief yet

  body.classList.add('is-updating');
  updated.textContent = s.summarizing;
  setTimeout(() => {

function setRevealVisible(visible) {
  const expandedCard = document.getElementById('expandedCard');
  const els = expandedCard.querySelectorAll('.reveal-on-open');
  els.forEach((el, i) => {
    if (visible) {
      el.style.transition = `opacity 0.4s ease ${0.2 + i * 0.02}s, transform 0.4s ease ${0.2 + i * 0.02}s`;
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    } else {
      el.style.transition = 'opacity 0.16s ease';
      el.style.opacity = '0';
      el.style.transform = 'translateY(10px)';
    }
  });
}

function openCard(cardEl) {
  if (isCardExpanded) return;
  const index = Number(cardEl.dataset.index);
  const data = ALL_CARDS[index];
  if (!data) return;

  const appEl = document.getElementById('app');
  const scrim = document.getElementById('scrim');
  const expandedCard = document.getElementById('expandedCard');
  const expandedMedia = document.getElementById('expandedMedia');

  activeCardEl = cardEl;
  currentOpenIndex = index;
  isCardExpanded = true;
  pauseAutoScroll();

  populateExpanded(data, index);

  const firstRect = cardEl.getBoundingClientRect();

  // Fixed to a generous share of the viewport (tall, small top/bottom
  // margins only) rather than measured from content — the point is a roomy
  // modal with a small image teaser, not one sized to whatever text happens
  // to be in it. Questions get a wider, taller frame — there's a two-pane
  // conversation to fit, not a single column of text.
  const openQ = isOpenQuestion(data);
  const finalWidth = openQ
    ? Math.min(CONFIG.QUESTION_WIDTH_MAX, window.innerWidth * CONFIG.QUESTION_WIDTH_RATIO)
    : Math.min(CONFIG.EXPANDED_WIDTH_MAX, window.innerWidth * CONFIG.EXPANDED_WIDTH_RATIO);
  const finalHeight = window.innerHeight * (openQ ? CONFIG.QUESTION_HEIGHT_RATIO : CONFIG.EXPANDED_HEIGHT_RATIO);
  const finalLeft = (window.innerWidth - finalWidth) / 2;
  const finalTop = (window.innerHeight - finalHeight) / 2;

  expandedCard.style.transition = 'none';
  expandedCard.style.display = 'flex';
  expandedCard.style.visibility = 'hidden';
  expandedMedia.style.transition = 'none';
  expandedMedia.style.height = CONFIG.EXPANDED_MEDIA_HEIGHT + 'px';

  // Snap to the clicked card's exact position/size first, with no transition —
  // the whole card IS the image now, so the hero starts at the card's full height.
  // (This also works correctly if the card was mid-flip or showing its back face,
  // since firstRect comes from the static outer .card box, not its rotated child.)
  expandedCard.style.top = firstRect.top + 'px';
  expandedCard.style.left = firstRect.left + 'px';
  expandedCard.style.width = firstRect.width + 'px';
  expandedCard.style.height = firstRect.height + 'px';
  expandedCard.style.borderRadius = '20px';
  expandedMedia.style.height = firstRect.height + 'px';
  setRevealVisible(false);
  expandedCard.style.visibility = 'visible';

  cardEl.classList.add('is-source-hidden');
  scrim.classList.add('is-visible');
  appEl.classList.add('is-receded');

  void expandedCard.offsetWidth; // force reflow

  requestAnimationFrame(() => {
    expandedCard.style.transition = '';
    expandedMedia.style.transition = 'height 0.55s cubic-bezier(0.22, 1, 0.36, 1)';
    expandedCard.style.top = finalTop + 'px';
    expandedCard.style.left = finalLeft + 'px';
    expandedCard.style.width = finalWidth + 'px';
    expandedCard.style.height = finalHeight + 'px';
    expandedCard.style.borderRadius = '26px';
    expandedMedia.style.height = CONFIG.EXPANDED_MEDIA_HEIGHT + 'px';
    setRevealVisible(true);
  });
}

function closeCard() {
  if (!isCardExpanded || !activeCardEl) return;
  const cardEl = activeCardEl;

  const appEl = document.getElementById('app');
  const scrim = document.getElementById('scrim');
  const expandedCard = document.getElementById('expandedCard');
  const expandedMedia = document.getElementById('expandedMedia');

  const firstRect = cardEl.getBoundingClientRect();

  setRevealVisible(false);
  scrim.classList.remove('is-visible');
  appEl.classList.remove('is-receded');

  expandedMedia.style.transition = 'height 0.55s cubic-bezier(0.22, 1, 0.36, 1)';
  expandedCard.style.top = firstRect.top + 'px';
  expandedCard.style.left = firstRect.left + 'px';
  expandedCard.style.width = firstRect.width + 'px';
  expandedCard.style.height = firstRect.height + 'px';
  expandedCard.style.borderRadius = '20px';
  expandedMedia.style.height = firstRect.height + 'px';

  const onDone = (e) => {
    if (e && e.propertyName !== 'width') return;
    expandedCard.removeEventListener('transitionend', onDone);
    expandedCard.style.display = 'none';
    cardEl.classList.remove('is-source-hidden');
    activeCardEl = null;
    currentOpenIndex = null;
    isCardExpanded = false;
    scheduleResumeAutoScroll();
  };
  expandedCard.addEventListener('transitionend', onDone);
}

function initExpandCard() {
  document.getElementById('expandedClose').setAttribute('aria-label', t().closeAria);
  document.getElementById('expandedClose').addEventListener('click', closeCard);
  document.getElementById('scrim').addEventListener('click', closeCard);

// Closes the modal first — its existing shrink-back-into-the-card animation
// — then lets that same card collapse out of wherever it's showing a beat
// later, so it reads as one continuous "this is leaving the network" motion
// instead of two unrelated animations firing at once.
function confirmDeleteCard(id) {
  closeCard();
  setTimeout(() => deleteSharedCardById(id), 600);
}

// A shared card can appear in *both* Discover and Browse at once (it's
// always justNow, so it's always in Discover's top slice too, until newer
// shares push it out) — every element tagged with this id, in either
// surface, fades together, then both surfaces are rebuilt from scratch so
// there's no manual re-indexing to get wrong across two separate DOM trees.
function deleteSharedCardById(id) {
  const els = Array.from(document.querySelectorAll(`[data-card-id="${id}"]`));

  const finish = () => {
    sharedCards = sharedCards.filter((c) => c.id !== id);
    try {
      localStorage.setItem(SHARED_CARDS_STORAGE_KEY, JSON.stringify(sharedCards));
    } catch (err) {
      console.error('[Loom feed] could not persist card deletion:', err);
    }
    ALL_CARDS = buildAllCards();
    renderDiscover();
    renderBrowse();
    renderQuestions();
  };

  if (!els.length) { finish(); return; }

  els.forEach((el) => el.classList.add('is-hidden')); // the same smooth collapse the filters already use
  const finishedEls = new Set();
  let remaining = els.length;
  let done = false;
  const onEnd = (e) => {
    if (done) return;
    if (e.propertyName !== 'width' && e.propertyName !== 'opacity') return;
    if (finishedEls.has(e.currentTarget)) return;
    finishedEls.add(e.currentTarget);
    remaining--;
    if (remaining <= 0) { done = true; finish(); }
  };
  els.forEach((el) => el.addEventListener('transitionend', onEnd));
  setTimeout(() => { if (!done) { done = true; finish(); } }, 700); // safety net if transitionend never fires
}

// The composed card's image, if any — a data: URL (not a blob: object URL)
// specifically so it survives JSON.stringify into localStorage and still
// resolves after a page reload; blob URLs are only valid for the document
// that created them. No real upload happens anywhere — this is the whole
// pipeline for a prototype with no backend.
let selectedImageUrl = null;

function setUploadPreview(url) {
  const zone = document.getElementById('uploadZone');
  const media = document.getElementById('uploadPreviewMedia');
  if (url) {
    media.style.backgroundImage = `url("${url}")`;
    zone.classList.add('has-preview');
  } else {
    media.style.backgroundImage = '';
    zone.classList.remove('has-preview');
  }
}

/* Downscale before anything else touches the file. Two hard limits make this
   mandatory rather than an optimisation, and a straight FileReader data: URL
   of a real photo blows through both:
     - localStorage tops out around 5MB per origin, so an unresized upload
       either fails to persist or evicts everything else that was there;
     - the CSSOM silently drops custom-property values past a certain length,
       which is what left cards rendering as blank white boxes (the card art
       is a `--card-img` background, see applyCardMedia).
   1400px on the long edge is well past what a poster card or the hero banner
   can actually show, and JPEG at 0.82 puts a typical photo around 200-350KB. */
const IMAGE_MAX_DIM = 1400;
const IMAGE_JPEG_QUALITY = 0.82;
const IMAGE_SECOND_PASS_BYTES = 600000; // still heavy after pass one -> re-encode harder
const IMAGE_SECOND_PASS_QUALITY = 0.6;

// maxDim/quality are per-caller: a card's hero art and a roster thumbnail
// have very different budgets (see DESIGNER_PHOTO_MAX_DIM).
function resizeImageToDataUrl(file, maxDim, quality) {
  const limit = maxDim || IMAGE_MAX_DIM;
  const q = quality || IMAGE_JPEG_QUALITY;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('could not read the file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('could not decode the image'));
      img.onload = () => {
        const longest = Math.max(img.naturalWidth, img.naturalHeight) || 1;
        const scale = Math.min(1, limit / longest);
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        // JPEG has no alpha channel — flatten onto white first, or a
        // transparent PNG comes back with a black background.
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);

        let out = canvas.toDataURL('image/jpeg', q);
        if (out.length > IMAGE_SECOND_PASS_BYTES) {
          out = canvas.toDataURL('image/jpeg', IMAGE_SECOND_PASS_QUALITY);
        }
        resolve(out);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function handleImageFile(file) {
  if (!file || !file.type || !file.type.startsWith('image/')) return;
  resizeImageToDataUrl(file).then((dataUrl) => {
    selectedImageUrl = dataUrl;
    setUploadPreview(selectedImageUrl);
  }).catch((err) => {
    // A failed read/decode (corrupt file, unsupported format) shouldn't leave
    // the zone stuck looking however it happened to look mid-attempt.
    console.error('[Loom feed] could not process the image:', err);
    selectedImageUrl = null;
    setUploadPreview(null);
    showToast(t().share.imageFailed);
  });
}

function initUploadStub() {
  const zone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('imageFileInput');

  // Clicking anywhere on the zone opens the native file picker — except a
  // click on the Replace/Remove row, which handles itself (see below). The
  // zone is a plain div (not a <button>) precisely so it can contain those
  // two real buttons without nesting interactive elements.
  zone.addEventListener('click', (e) => {
    if (e.target.closest('.upload-preview-actions')) return;
    fileInput.click();
  });
  zone.addEventListener('keydown', (e) => {
    if (e.target !== zone) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });

  fileInput.addEventListener('change', () => {
    handleImageFile(fileInput.files && fileInput.files[0]);
    fileInput.value = ''; // so choosing the same file again still fires 'change'
  });

  zone.addEventListener('dragover', (e) => {
    e.preventDefault(); // required for 'drop' to fire at all
    zone.classList.add('is-dragover');
  });
  zone.addEventListener('dragleave', () => zone.classList.remove('is-dragover'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('is-dragover');
    handleImageFile(e.dataTransfer.files && e.dataTransfer.files[0]);
  });

  document.getElementById('uploadReplaceBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    fileInput.click();
  });
  document.getElementById('uploadRemoveBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    selectedImageUrl = null;
    setUploadPreview(null);
  });
}

/* ======================================================================
   9b. Attachments (item 8) — separate from the image, mainly for PDFs. No
   real server upload in this prototype: each file is read as a data: URL
   (same reasoning as selectedImageUrl above) so "open in browser" and
   surviving a reload both just work with zero backend.
   ====================================================================== */
let attachedFiles = []; // [{ name, size, dataUrl }]

function formatFileSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
}

const ATTACHMENT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l4 4v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M15 3v4h4"/></svg>`;
const ATTACHMENT_REMOVE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;

function renderAttachmentList() {
  const wrap = document.getElementById('attachmentList');
  wrap.innerHTML = '';
  attachedFiles.forEach((file, index) => {
    const row = document.createElement('div');
    row.className = 'attachment-item';
    row.innerHTML = `
      <span class="attachment-item-icon">${ATTACHMENT_ICON}</span>
      <span class="attachment-item-info">
        <div class="attachment-item-name">${file.name}</div>
        <div class="attachment-item-size">${formatFileSize(file.size)}</div>
      </span>
      <button type="button" class="attachment-item-remove" aria-label="Remove">${ATTACHMENT_REMOVE_ICON}</button>
    `;
    row.querySelector('.attachment-item-remove').addEventListener('click', () => {
      attachedFiles.splice(index, 1);
      renderAttachmentList();
    });
    wrap.appendChild(row);
  });
}

function handleAttachmentFiles(fileList) {
  Array.from(fileList || []).forEach((file) => {
    const reader = new FileReader();
    reader.onload = () => {
      attachedFiles.push({ name: file.name, size: file.size, dataUrl: reader.result });
      renderAttachmentList();
    };
    reader.readAsDataURL(file);
  });
}

function initAttachmentUpload() {
  const zone = document.getElementById('attachmentZone');
  const fileInput = document.getElementById('attachmentFileInput');

  zone.addEventListener('click', () => fileInput.click());
  zone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });

  fileInput.addEventListener('change', () => {
    handleAttachmentFiles(fileInput.files);
    fileInput.value = '';
  });

  zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('is-dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('is-dragover'));
  zone.addEventListener('drop', (e) => {
    e.preventDefault();
    zone.classList.remove('is-dragover');
    handleAttachmentFiles(e.dataTransfer.files);
  });
}

// A card's own attachments, shown in its detail view (normal or Question) as
// plain openable links — "open in browser" via the data: URL, no server
// involved, same reasoning as everywhere else images/files are handled here.
function renderAttachmentsInto(wrapEl, data) {
  wrapEl.innerHTML = '';
  (data.attachments || []).forEach((file) => {
    const a = document.createElement('a');
    a.className = 'attachment-link';
    a.href = file.dataUrl;
    a.target = '_blank';
    a.rel = 'noopener';
    a.download = file.name;
    a.innerHTML = `
      <span class="attachment-item-icon">${ATTACHMENT_ICON}</span>
      <span class="attachment-item-info">
        <div class="attachment-item-name">${file.name}</div>
        <div class="attachment-item-size">${formatFileSize(file.size)}</div>
      </span>
    `;
    wrapEl.appendChild(a);

}

function initSubmitGate() {
  const titleInput = document.getElementById('titleInput');
  const submitBtn = document.getElementById('submitBtn');
  titleInput.addEventListener('input', () => {
    submitBtn.disabled = titleInput.value.trim().length === 0;

/* ---- STEP 1 <-> STEP 2/3, in place, no reload ---- */
const TRANSITION_CLASSES = ['is-out', 'is-pre-in', 'is-out-reverse', 'is-pre-in-reverse'];
let transitionToken = 0;

// A crossfade, not a hard swap, in either direction: `fromEl` stays stacked
// on top while it fades and lifts away, and `toEl` begins rising in
// underneath partway through that same motion. `reverse` mirrors the lift
// direction so going back reads as an undo of going forward, not a repeat.
function transitionStep(fromEl, toEl, { reverse = false, onOverlap } = {}) {
  const myToken = ++transitionToken;
  const outClass = reverse ? 'is-out-reverse' : 'is-out';
  const preInClass = reverse ? 'is-pre-in-reverse' : 'is-pre-in';

  TRANSITION_CLASSES.forEach((c) => { fromEl.classList.remove(c); toEl.classList.remove(c); });

  fromEl.style.zIndex = '2';
  toEl.style.zIndex = '1';
  toEl.style.display = 'flex';
  toEl.classList.add(preInClass);
  void toEl.offsetWidth; // force reflow before the next class change transitions

  fromEl.classList.add(outClass);

  setTimeout(() => {
    if (transitionToken !== myToken) return; // superseded by a newer transition — do nothing
    toEl.classList.remove(preInClass);
    if (onOverlap) onOverlap();
  }, CONFIG.STEP_TRANSITION_OVERLAP_MS);

  setTimeout(() => {
    if (transitionToken !== myToken) return; // superseded by a newer transition — do nothing
    fromEl.style.display = 'none';
    fromEl.classList.remove(outClass);
    fromEl.style.zIndex = '';
    toEl.style.zIndex = '';
  }, CONFIG.STEP_TRANSITION_MS);
}

function goToWeaveStep() {
  const compose = document.getElementById('stepCompose');
  const weave = document.getElementById('stepWeave');
  resetWeaveVisual();
  transitionStep(compose, weave, { onOverlap: startWeaveSequence });
}

function resetWeaveVisual() {
  weaveStartTime = null;
  document.getElementById('weaveCaption').classList.remove('is-visible');
  document.getElementById('weaveConfirm').classList.remove('is-visible');
}

function goToComposeStep() {
  const compose = document.getElementById('stepCompose');
  const weave = document.getElementById('stepWeave');
  resetComposeForm();
  transitionStep(weave, compose, { reverse: true });
}

function resetComposeForm() {
  const titleInput = document.getElementById('titleInput');
  const submitBtn = document.getElementById('submitBtn');
  const tagWrap = document.getElementById('tagWrap');

  titleInput.value = '';
  document.getElementById('problemInput').value = '';
  document.getElementById('triedInput').value = '';
  document.getElementById('resultInput').value = '';

  tags.length = 0;
  tagWrap.querySelectorAll('.tag-chip').forEach((chip) => chip.remove());

  selectedType = 'project';
  document.querySelectorAll('#typePicker .type-pill').forEach((btn) => {
    btn.classList.toggle('is-active', btn.dataset.type === selectedType);
  });
  updateComposeFieldsForType();

  submitBtn.disabled = true;

  selectedImageUrl = null;
  setUploadPreview(null);

  attachedFiles = [];
  renderAttachmentList();

  // Compose is a persistent, hidden-not-recreated element (see enterShareMode/
  // goToComposeStep, both of which call this) — without resetting scrollTop
  // here, reopening after having scrolled down mid-form would resume wherever
  // it was left instead of starting clean from the top.
  const composeScroll = document.querySelector('#stepCompose .compose-scroll');
  if (composeScroll) composeScroll.scrollTop = 0;
}

/* ---- hand the composed card to the gallery itself — no page, no reload ---- */
// (SHARED_CARDS_STORAGE_KEY is declared up in section 2b, alongside loadSharedCards())

function truncateForSummary(text, max) {
  const trimmed = text.trim();
  return trimmed.length > max ? trimmed.slice(0, max - 1).trim() + '…' : trimmed;
}

function buildSharedCardEntry() {
  const isOpenQ = selectedType === 'question';
  const title = document.getElementById('titleInput').value.trim();
  const problem = document.getElementById('problemInput').value.trim();
  const tried = document.getElementById('triedInput').value.trim();
  // The result field is hidden (and irrelevant) for a Question — there's no
  // result yet, that's the whole point — so its stale value never ships.
  const result = isOpenQ ? '' : document.getElementById('resultInput').value.trim();
  const summarySource = result || tried || problem || title;
  return {
    id: 'shared-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8),
    studio: MY_STUDIO_KEY,
    type: selectedType,
    author: 'You',
    justNow: true,
    appliedBy: [],
    // A freshly shared card starts with no known lineage — connections form
    // later, the same way appliedBy would in a real service: someone else
    // hitting "we applied this too" (or explicitly linking their own new
    // post back to this one) is what creates a relatedTo/derivedFrom edge.
    relatedTo: [],
    derivedFrom: null,
    // A freshly posted Question is always awaiting an answer, and starts
    // its own conversation with just the opening post.
    status: isOpenQ ? 'open' : undefined,
    conversation: isOpenQ ? [{ author: 'You', studio: MY_STUDIO_KEY, justNow: true, text: problem || title }] : undefined,
    // Not a real translation — see LANG_PENDING note near renderCardLangBadge.
    sourceLang: currentLang,
    image: selectedImageUrl,
    attachments: attachedFiles.slice(),
    text: { title, summary: truncateForSummary(summarySource, 100), problem, tried, result },
  };
}

function writeSharedCards(list) {
  try {
    localStorage.setItem(SHARED_CARDS_STORAGE_KEY, JSON.stringify(list));
    return true;
  } catch (err) {
    return false; // realistically QuotaExceededError — the caller decides what to give up
  }
}

// Images are downscaled on the way in (see resizeImageToDataUrl), so this
// should not normally have anything to do. It exists because localStorage has
// no reservation or eviction of its own: once the ~5MB origin budget is gone,
// setItem simply throws and — before this — the card silently failed to
// persist while still appearing in the session, so it vanished on reload with
// no explanation. Give ground in the order that costs the reader least:
// oldest cards first, then images, and say so out loud either way.
function saveSharedCard(entry) {
  let list = [];
  try {
    const parsed = JSON.parse(localStorage.getItem(SHARED_CARDS_STORAGE_KEY));
    if (Array.isArray(parsed)) list = parsed;
  } catch (err) { /* corrupt or missing — start fresh */ }
  list.unshift(entry);

  if (writeSharedCards(list)) return true;

  while (list.length > 1) {
    list.pop(); // drop the oldest shared card and try again
    if (writeSharedCards(list)) {
      showToast(t().share.storageTrimmed);
      return true;
    }
  }

  // Down to this one card and it still won't fit: keep the knowledge, lose
  // the picture. It stays visible for the rest of the session either way —
  // `sharedCards` in memory is what the gallery renders from.
  if (writeSharedCards(list.map((c) => Object.assign({}, c, { image: null, attachments: [] })))) {
    showToast(t().share.storageImageDropped);
    return true;
  }

  console.error('[Loom feed] could not persist the shared card: no room in localStorage');
  showToast(t().share.storageFailed);
  return false;
}

// Queued rather than applied immediately: the gallery track is rebuilt while
// still hidden (mid-compose/weave), the entrance-stagger reveal in
// renderDiscover()/renderBrowse() would just silently finish off-screen.
// Draining this queue happens in exitShareMode(), right as Discover is
// about to become visible again, so the "welcome, you're woven in" entrance
// actually plays — and since a freshly shared card is always justNow (see
// daysAgoOf), it lands at the very front of Discover automatically.
let pendingSharedEntries = [];

function flushPendingSharedCards() {
  if (!pendingSharedEntries.length) return;
  // push order is oldest-shared-first; unshifting each in that order leaves
  // the most recently shared card truly first
  pendingSharedEntries.forEach((entry) => { sharedCards.unshift(entry); });
  pendingSharedEntries = [];
  ALL_CARDS = buildAllCards();
  renderDiscover();
  renderBrowse();
  renderQuestions();
}

function initSubmit() {
  document.getElementById('submitBtn').addEventListener('click', () => {
    if (document.getElementById('submitBtn').disabled) return;
    const entry = buildSharedCardEntry();
    saveSharedCard(entry);
    pendingSharedEntries.push(entry);
    goToWeaveStep();
  });
}

/* ---- the weave — a small, light 2D network (not the full WebGL globe from
   loom_lobby.html, deliberately: this lives inline in the gallery's own
   footprint, so it stays a few dozen nodes and a plain canvas) ---- */
const MY_STUDIO = WEAVE_STUDIOS.find((s) => s.key === MY_STUDIO_KEY);
const NEW_NODE_CORE_RGB = hexToRgb(MY_STUDIO.color);        // "r, g, b" string, for gradients
const NEW_NODE_CORE_ARR = hexToRgbArray(MY_STUDIO.color);   // [r, g, b], for channel lerping
const NEW_NODE_FLASH_ARR = [255, 255, 255];                 // the white-hot spark at the moment of birth

let weaveCanvas, weaveCtx;
let canvasSize = { w: 0, h: 0 };
let clusterNodes = [];
let ambientNodes = [];
let clusterLinks = [];   // { a, b, color } — indices into clusterNodes
let ambientLinks = [];   // { a, b } — indices into ambientNodes
let connectionTargets = []; // clusterNodes indices the new node reaches out to
let connectStarts = [];  // ms-since-sequence-start each connection begins drawing, aligned to connectionTargets
let rippleMaxR = 0;      // px radius the ripple must travel to have touched every node on stage
let weaveStartTime = null;

function clamp01(v) { return Math.max(0, Math.min(1, v)); }
function lerp(a, b, tt) { return a + (b - a) * tt; }
function easeOutCubic(tt) { return 1 - Math.pow(1 - tt, 3); }
function easeOutBack(tt) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(tt - 1, 3) + c1 * Math.pow(tt - 1, 2);
}
// Inverse of easeOutCubic — given how far (0..1) a node sits between the new
// node and the ripple's max reach, returns how far (0..1) into the ripple's
// travel time the ring will have reached it. Lets close nodes light up almost
// immediately while far nodes wait, matching the ring's actual fast-start motion.
function invEaseCubic(x) { return 1 - Math.pow(1 - clamp01(x), 1 / 3); }
function pickRandomIndices(count, from, to, howMany) {
  const pool = [];
  for (let i = from; i < to; i++) pool.push(i);
  const picked = [];
  for (let i = 0; i < howMany && pool.length; i++) {
    picked.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  return picked;
}

function buildWeaveNodes() {
  clusterNodes = [];
  WEAVE_STUDIOS.forEach((studio) => {
    for (let i = 0; i < CONFIG.NODES_PER_CLUSTER; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 0.05 + Math.random() * 0.11;
      clusterNodes.push({
        rx: clamp01(studio.center.x + Math.cos(angle) * radius),
        ry: clamp01(studio.center.y + Math.sin(angle) * radius * 0.85),
        color: studio.color,
        seed: Math.random() * 1000,
        twinklePhase: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.55 + Math.random() * 0.5,
        r: 3.6 + Math.random() * 1.0,
      });
    }
  });

  ambientNodes = [];
  let attempts = 0;
  while (ambientNodes.length < CONFIG.AMBIENT_COUNT && attempts < CONFIG.AMBIENT_COUNT * 8) {
    attempts++;
    const rx = 0.05 + Math.random() * 0.90;
    const ry = 0.07 + Math.random() * 0.86;
    const d = Math.hypot(rx - CONFIG.NEW_NODE_POS.x, ry - CONFIG.NEW_NODE_POS.y);
    if (d < CONFIG.CENTER_EXCLUSION) continue;
    ambientNodes.push({
      rx, ry,
      seed: Math.random() * 1000,
      twinklePhase: Math.random() * Math.PI * 2,
      twinkleSpeed: 0.45 + Math.random() * 0.45,
      r: 1.5 + Math.random() * 1.1,
    });
  }

  // Cluster mesh: each node links to two same-cluster neighbors (lobby-style).
  clusterLinks = [];
  WEAVE_STUDIOS.forEach((studio, si) => {
    const start = si * CONFIG.NODES_PER_CLUSTER;
    const n = CONFIG.NODES_PER_CLUSTER;
    for (let i = 0; i < n; i++) {
      [1, 2].forEach((step) => {
        clusterLinks.push({ a: start + i, b: start + ((i + step) % n), color: studio.color });
      });
    }
  });

  // Ambient mesh: each node links to its single nearest neighbor.
  ambientLinks = [];
  const linked = new Set();
  ambientNodes.forEach((node, i) => {
    let bestJ = -1, bestD = Infinity;
    ambientNodes.forEach((other, j) => {
      if (i === j) return;
      const d = Math.hypot(node.rx - other.rx, node.ry - other.ry);
      if (d < bestD) { bestD = d; bestJ = j; }
    });
    if (bestJ === -1) return;
    const key = i < bestJ ? i + '_' + bestJ : bestJ + '_' + i;
    if (linked.has(key)) return;
    linked.add(key);
    ambientLinks.push({ a: i, b: bestJ });
  });

  // The new node reaches into every studio cluster — the visual proof that
  // this single piece of knowledge now touches more than one team. Spreads
  // CONFIG.CONNECTION_COUNT as evenly as possible across however many
  // clusters WEAVE_STUDIOS actually has right now (rather than assuming a
  // fixed 3 studios), so disabling one doesn't leave this reaching for
  // cluster indices that no longer exist.
  connectionTargets = [];
  const clusterCount = WEAVE_STUDIOS.length;
  if (clusterCount > 0) {
    const perCluster = Math.floor(CONFIG.CONNECTION_COUNT / clusterCount);
    const remainder = CONFIG.CONNECTION_COUNT % clusterCount;
    for (let ci = 0; ci < clusterCount; ci++) {
      const want = perCluster + (ci < remainder ? 1 : 0);
      connectionTargets.push(...pickRandomIndices(0, ci * CONFIG.NODES_PER_CLUSTER, (ci + 1) * CONFIG.NODES_PER_CLUSTER, want));
    }
  }
}

function resizeWeaveCanvas() {
  const wrap = document.getElementById('weaveCanvasWrap');
  const rect = wrap.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvasSize.w = rect.width;
  canvasSize.h = rect.height;
  weaveCanvas.width = Math.max(1, Math.round(rect.width * dpr));
  weaveCanvas.height = Math.max(1, Math.round(rect.height * dpr));
  weaveCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function wpx(rx, ry) { return { x: rx * canvasSize.w, y: ry * canvasSize.h }; }

// Stamps every cluster/ambient node with a `revealAt` (ms since sequence
// start) — the moment the outward ripple actually reaches it. Nearer nodes
// get an earlier time, farther ones later, so the network appears to unfold
// outward from the new node rather than all snapping in at once.
function computeReveals() {
  const newPos = wpx(CONFIG.NEW_NODE_POS.x, CONFIG.NEW_NODE_POS.y);
  const all = clusterNodes.concat(ambientNodes);
  let maxDist = 0;
  all.forEach((node) => {
    const p = wpx(node.rx, node.ry);
    const d = Math.hypot(p.x - newPos.x, p.y - newPos.y);
    node._dist = d;
    if (d > maxDist) maxDist = d;
  });
  rippleMaxR = Math.max(1, maxDist * 1.04); // small margin so the farthest node isn't cut off mid-fade
  all.forEach((node) => {
    const ratio = clamp01(node._dist / rippleMaxR);
    node.revealAt = CONFIG.RIPPLE_START + invEaseCubic(ratio) * CONFIG.RIPPLE_TRAVEL_DUR;
  });
}

// Active ripple rings at this instant, as { radius, life } where life fades
// 1 -> 0 over each ring's travel time. Two of these overlap briefly to read
// as an echoing wave rather than a single hard-edged circle.
function activeRipples(elapsed) {
  const rings = [];
  if (elapsed === null) return rings;
  for (let i = 0; i < CONFIG.RIPPLE_RING_COUNT; i++) {
    const ringStart = CONFIG.RIPPLE_START + i * CONFIG.RIPPLE_RING_GAP;
    const rt = (elapsed - ringStart) / CONFIG.RIPPLE_TRAVEL_DUR;
    if (rt >= 0 && rt < 1.1) {
      rings.push({ radius: easeOutCubic(clamp01(rt)) * rippleMaxR, life: Math.max(0, 1 - rt) });
    }
  }
  return rings;
}

// How much a point at `dist` from the new node should flash right now, given
// the currently active rings — the visible "the wave just touched you" pulse.
function rippleBoostAt(rings, dist) {
  let boost = 0;
  rings.forEach((ring) => {
    const diff = Math.abs(dist - ring.radius);
    if (diff < CONFIG.RIPPLE_BAND) {
      const b = (1 - diff / CONFIG.RIPPLE_BAND) * CONFIG.RIPPLE_FLASH_STRENGTH * Math.min(1, ring.life + 0.3);
      if (b > boost) boost = b;
    }
  });
  return boost;
}

function driftOffset(node, now) {
  return {
    dx: Math.sin(now * 0.00035 + node.seed) * CONFIG.DRIFT_AMOUNT,
    dy: Math.cos(now * 0.0004 + node.seed * 1.7) * CONFIG.DRIFT_AMOUNT,
  };
}

function twinkle(node, now) {
  return 0.82 + 0.18 * Math.sin(now * 0.001 * node.twinkleSpeed + node.twinklePhase);
}

function drawLine(ax, ay, bx, by, color, alpha, width) {
  weaveCtx.strokeStyle = color;
  weaveCtx.globalAlpha = alpha;
  weaveCtx.lineWidth = width;
  weaveCtx.beginPath();
  weaveCtx.moveTo(ax, ay);
  weaveCtx.lineTo(bx, by);
  weaveCtx.stroke();
  weaveCtx.globalAlpha = 1;
}

function drawNodeDot(x, y, r, color, alpha) {
  weaveCtx.globalAlpha = alpha;
  weaveCtx.fillStyle = color;
  weaveCtx.beginPath();
  weaveCtx.arc(x, y, r, 0, Math.PI * 2);
  weaveCtx.fill();
  weaveCtx.globalAlpha = 1;
}

function drawGlow(x, y, r, rgb, alpha) {
  const grad = weaveCtx.createRadialGradient(x, y, 0, x, y, r);
  grad.addColorStop(0, `rgba(${rgb}, ${alpha})`);
  grad.addColorStop(1, `rgba(${rgb}, 0)`);
  weaveCtx.fillStyle = grad;
  weaveCtx.beginPath();
  weaveCtx.arc(x, y, r, 0, Math.PI * 2);
  weaveCtx.fill();
}

function renderWeaveFrame(now) {
  weaveCtx.clearRect(0, 0, canvasSize.w, canvasSize.h);

  const elapsed = weaveStartTime === null ? null : now - weaveStartTime;
  const newPos = wpx(CONFIG.NEW_NODE_POS.x, CONFIG.NEW_NODE_POS.y);
  const rings = activeRipples(elapsed);

  // ---- ambient links (only once both ends have been touched by the ripple) ----
  if (elapsed !== null) {
    ambientLinks.forEach((link) => {
      const a = ambientNodes[link.a], b = ambientNodes[link.b];
      const readyAt = Math.max(a.revealAt || Infinity, b.revealAt || Infinity);
      if (elapsed < readyAt) return;
      const fade = easeOutCubic(clamp01((elapsed - readyAt) / CONFIG.NODE_FADE_IN_DUR));
      const oa = driftOffset(a, now), ob = driftOffset(b, now);
      const pa = wpx(a.rx, a.ry), pb = wpx(b.rx, b.ry);
      drawLine(pa.x + oa.dx, pa.y + oa.dy, pb.x + ob.dx, pb.y + ob.dy, 'rgba(28,28,30,1)', 0.06 * fade, 1);
    });
  }

  // ---- cluster links (same fade-in-on-reveal treatment) ----
  if (elapsed !== null) {
    clusterLinks.forEach((link) => {
      const a = clusterNodes[link.a], b = clusterNodes[link.b];
      const readyAt = Math.max(a.revealAt || Infinity, b.revealAt || Infinity);
      if (elapsed < readyAt) return;
      const fade = easeOutCubic(clamp01((elapsed - readyAt) / CONFIG.NODE_FADE_IN_DUR));
      const oa = driftOffset(a, now), ob = driftOffset(b, now);
      const pa = wpx(a.rx, a.ry), pb = wpx(b.rx, b.ry);
      drawLine(pa.x + oa.dx, pa.y + oa.dy, pb.x + ob.dx, pb.y + ob.dy, link.color, 0.16 * fade, 1.1);
    });
  }

  // ---- new-node connections — each starts once its own target has been
  // reached by the ripple, so the three studio clusters light up in the
  // order the wave actually gets to them, not on a fixed clock ----
  if (elapsed !== null) {
    connectionTargets.forEach((targetIdx, i) => {
      const start = connectStarts[i];
      if (start === undefined || elapsed < start) return;
      const tt = clamp01((elapsed - start) / CONFIG.CONNECT_DUR);
      const eased = easeOutCubic(tt);
      const target = clusterNodes[targetIdx];
      const to = driftOffset(target, now);
      const tp = wpx(target.rx, target.ry);
      const endX = lerp(newPos.x, tp.x + to.dx, eased);
      const endY = lerp(newPos.y, tp.y + to.dy, eased);

      const grad = weaveCtx.createLinearGradient(newPos.x, newPos.y, endX, endY);
      grad.addColorStop(0, `rgba(${NEW_NODE_CORE_RGB}, 0.7)`);
      grad.addColorStop(1, target.color);
      weaveCtx.strokeStyle = grad;
      weaveCtx.globalAlpha = 0.18 + 0.5 * eased;
      weaveCtx.lineWidth = 1.7;
      weaveCtx.beginPath();
      weaveCtx.moveTo(newPos.x, newPos.y);
      weaveCtx.lineTo(endX, endY);
      weaveCtx.stroke();
      weaveCtx.globalAlpha = 1;

      // a bright bead riding the leading edge while the line is still drawing
      if (tt < 1) {
        drawGlow(endX, endY, 7, NEW_NODE_CORE_RGB, 0.55);
      }

      // brief acknowledgement glow at the target once the line arrives
      const sincePulse = elapsed - (start + CONFIG.CONNECT_DUR);
      if (sincePulse >= 0 && sincePulse < CONFIG.CONNECT_PULSE_MS) {
        const pulseT = 1 - sincePulse / CONFIG.CONNECT_PULSE_MS;
        drawGlow(tp.x + to.dx, tp.y + to.dy, target.r * 5 * pulseT, hexToRgb(target.color), 0.35 * pulseT);
      }
    });
  }

  // ---- ambient nodes — fade in as the ripple reaches each one, with an
  // extra flash right as the wavefront passes ----
  if (elapsed !== null) {
    ambientNodes.forEach((node) => {
      if (elapsed < (node.revealAt || Infinity)) return;
      const fade = easeOutCubic(clamp01((elapsed - node.revealAt) / CONFIG.NODE_FADE_IN_DUR));
      const o = driftOffset(node, now);
      const p = wpx(node.rx, node.ry);
      const dist = Math.hypot(p.x - newPos.x, p.y - newPos.y);
      const boost = rippleBoostAt(rings, dist);
      let r = node.r, alpha = 0.34 * twinkle(node, now) * fade;
      if (boost > 0) {
        r *= 1 + boost * 0.8;
        alpha = Math.min(1, alpha + boost);
      }
      drawNodeDot(p.x + o.dx, p.y + o.dy, r, 'rgba(28,28,30,0.9)', alpha);
    });
  }

  // ---- cluster nodes — same fade-in-on-reveal, plus a studio-colored glow
  // the instant the wave touches them ----
  if (elapsed !== null) {
    clusterNodes.forEach((node) => {
      if (elapsed < (node.revealAt || Infinity)) return;
      const fade = easeOutCubic(clamp01((elapsed - node.revealAt) / CONFIG.NODE_FADE_IN_DUR));
      const o = driftOffset(node, now);
      const p = wpx(node.rx, node.ry);
      const dist = Math.hypot(p.x - newPos.x, p.y - newPos.y);
      const boost = rippleBoostAt(rings, dist);
      let r = node.r, alpha = 0.9 * twinkle(node, now) * fade;
      if (boost > 0) {
        drawGlow(p.x + o.dx, p.y + o.dy, node.r * 4.5, hexToRgb(node.color), 0.4 * boost * fade);
        r *= 1 + boost * 0.7;
        alpha = Math.min(1, alpha + boost * 0.6);
      }
      drawNodeDot(p.x + o.dx, p.y + o.dy, r, node.color, alpha);
    });
  }

  // ---- the ripple rings themselves — soft concentric bands, colored with
  // the new node's own studio color so they read clearly on white, fading to
  // nothing as each one expands (an echo, not a single hard ring) ----
  rings.forEach((ring) => {
    if (ring.life <= 0.01 || ring.radius <= 0) return;
    const ringAlpha = 0.4 * ring.life;
    const grad = weaveCtx.createRadialGradient(newPos.x, newPos.y, Math.max(0, ring.radius - 20), newPos.x, newPos.y, ring.radius + 20);
    grad.addColorStop(0, `rgba(${NEW_NODE_CORE_RGB}, 0)`);
    grad.addColorStop(0.5, `rgba(${NEW_NODE_CORE_RGB}, ${ringAlpha})`);
    grad.addColorStop(1, `rgba(${NEW_NODE_CORE_RGB}, 0)`);
    weaveCtx.strokeStyle = grad;
    weaveCtx.lineWidth = 1.8;
    weaveCtx.beginPath();
    weaveCtx.arc(newPos.x, newPos.y, ring.radius, 0, Math.PI * 2);
    weaveCtx.stroke();
  });

  // ---- the new node itself: pop + glow in the studio's own color, settling
  // into a permanent, gentle breathing pulse once the sequence is done ----
  if (elapsed !== null && elapsed >= CONFIG.BIRTH_START) {
    const bt = clamp01((elapsed - CONFIG.BIRTH_START) / CONFIG.BIRTH_DUR);
    const pop = Math.max(0, easeOutBack(bt));
    const settleT = clamp01((elapsed - CONFIG.BIRTH_START) / CONFIG.BIRTH_SETTLE_DUR);
    const mixT = easeOutCubic(settleT);

    const r = CONFIG.NEW_NODE_RADIUS * Math.min(pop, 1.2);
    const selfBoost = rippleBoostAt(rings, 0); // the node also catches the flash of its own rings firing

    // breathing kicks in once the settle finishes and continues indefinitely
    const settleEnd = CONFIG.BIRTH_START + CONFIG.BIRTH_SETTLE_DUR;
    let breathe = 0;
    if (elapsed > settleEnd) {
      const since = elapsed - settleEnd;
      const breatheIn = clamp01(since / CONFIG.BREATHE_FADE_IN);
      breathe = breatheIn * (0.5 + 0.5 * Math.sin((since / CONFIG.BREATHE_PERIOD) * Math.PI * 2));
    }

    // core color: white-hot spark -> steady studio color (never dims to plain ink)
    const cr = Math.round(lerp(NEW_NODE_FLASH_ARR[0], NEW_NODE_CORE_ARR[0], mixT));
    const cg = Math.round(lerp(NEW_NODE_FLASH_ARR[1], NEW_NODE_CORE_ARR[1], mixT));
    const cb = Math.round(lerp(NEW_NODE_FLASH_ARR[2], NEW_NODE_CORE_ARR[2], mixT));
    const coreColor = `rgb(${cr}, ${cg}, ${cb})`;

    const glowAlpha = lerp(0.7, 0.24, mixT) + breathe * 0.16 + selfBoost * 0.3;
    drawGlow(newPos.x, newPos.y, r * (4 + selfBoost * 2.4 + breathe * 1.3), NEW_NODE_CORE_RGB, Math.min(1, glowAlpha * pop));
    drawNodeDot(newPos.x, newPos.y, r * (1 + breathe * 0.07), coreColor, Math.min(1, pop));
  }

  requestAnimationFrame(renderWeaveFrame);
}

function initWeaveCanvas() {
  weaveCanvas = document.getElementById('weaveCanvas');
  weaveCtx = weaveCanvas.getContext('2d');
  buildWeaveNodes();
  resizeWeaveCanvas();
  window.addEventListener('resize', resizeWeaveCanvas);
  requestAnimationFrame(renderWeaveFrame);
}

/* ---- orchestrate the moment: birth -> ripple -> connections -> confirmation ---- */
function startWeaveSequence() {
  buildWeaveNodes();  // fresh layout each time "Add to the weave" runs
  resizeWeaveCanvas();
  computeReveals();   // stamp every node with the moment the ripple actually reaches it

  // Each connection waits for its own target's reveal — nearer clusters
  // start reaching out before farther ones, following the wave itself.
  connectStarts = connectionTargets.map((targetIdx) => clusterNodes[targetIdx].revealAt + CONFIG.CONNECT_LAG);

  weaveStartTime = performance.now();

  const caption = document.getElementById('weaveCaption');
  const confirm = document.getElementById('weaveConfirm');
  confirm.classList.remove('is-visible');

  // caption appears just as the node is born, after the opening quiet beat
  setTimeout(() => caption.classList.add('is-visible'), CONFIG.BIRTH_START + 80);

  const lastConnectFinish = connectStarts.length
    ? Math.max(...connectStarts) + CONFIG.CONNECT_DUR
    : CONFIG.RIPPLE_START + CONFIG.RIPPLE_TRAVEL_DUR;
  const confirmDelay = Math.max(CONFIG.CONFIRM_MIN_DELAY, lastConnectFinish + CONFIG.CONFIRM_DELAY_AFTER_CONNECT);

  setTimeout(() => caption.classList.remove('is-visible'), confirmDelay - 250);
  setTimeout(() => confirm.classList.add('is-visible'), confirmDelay);
}

/* ---- Designers surface <-> the feed ----
   Same crossfade+scale swap share mode uses (.mode-fade-out), for the same
   reason: these are alternate surfaces occupying the gallery's real estate,
   not separate pages, so the topbar and the language switcher never blink. */
function activeSurfaceEl() {
  return document.getElementById(isDesignersMode ? 'designersViewport' : 'feedMain');
}

function enterDesignersMode() {
  if (isDesignersMode || isShareMode || isCardExpanded) return;
  isDesignersMode = true;
  pauseAutoScroll();

  const gallery = document.getElementById('feedMain');
  const designers = document.getElementById('designersViewport');

  // Always reopen on your own studio with edit mode off — the roster is a
  // "who's here" screen first; you opt into editing it each time.
  rosterStudioIndex = 0;
  rosterEditMode = false;
  closeDesignerEditor();
  renderDesigners();

  gallery.classList.add('mode-fade-out');
  setTimeout(() => {
    gallery.style.display = 'none';
    gallery.classList.remove('mode-fade-out');
    designers.style.display = 'flex';
    sizeAllRosters(false); // renderDesigners ran while hidden, so it measured zero
    designers.classList.add('mode-fade-out'); // reuse as this element's own "not yet visible" state
    void designers.offsetWidth;               // force reflow so the fade-in actually transitions
    designers.classList.remove('mode-fade-out');
  }, CONFIG.MODE_SWAP_MS);
}

// `onShown` runs once the feed is back on screen — that's when a floor change
// is worth animating (see focusDesigner), not while it's still faded out.
function exitDesignersMode(onShown) {
  if (!isDesignersMode) return;
  isDesignersMode = false;

  const gallery = document.getElementById('feedMain');
  const designers = document.getElementById('designersViewport');

  designers.classList.add('mode-fade-out');
  setTimeout(() => {
    designers.style.display = 'none';
    designers.classList.remove('mode-fade-out');

    gallery.style.display = 'block';
    gallery.classList.add('mode-fade-out');
    void gallery.offsetWidth;
    gallery.classList.remove('mode-fade-out');
    if (onShown) onShown();
  }, CONFIG.MODE_SWAP_MS);

  scheduleResumeAutoScroll();
}

// Swaps the gallery <-> the share surface with a short crossfade+scale (see
// .mode-fade-out), always starting share mode from a clean compose step no
// matter how the previous visit ended.
function enterShareMode() {
  if (isShareMode || isCardExpanded) return;
  isShareMode = true;
  pauseAutoScroll();

  // Share can be reached straight from the Designers roster, so fade out
  // whichever surface is actually showing — and make sure the feed, not the
  // roster, is what's underneath when share mode closes again.
  const leaving = activeSurfaceEl();
  if (isDesignersMode) {
    isDesignersMode = false;
    document.getElementById('feedMain').style.display = 'block';
  }

  // The back-to-lobby pill is fixed in the corner independent of the gallery/
  // share-viewport swap below — hide it explicitly so a stray click while
  // composing can't discard the moment by leaving the app entirely.
  document.getElementById('sidebarFooter').classList.add('is-hidden-in-share');

  const gallery = leaving;
  const share = document.getElementById('shareViewport');
  const compose = document.getElementById('stepCompose');
  const weave = document.getElementById('stepWeave');

  resetComposeForm();
  resetWeaveVisual();
  weave.style.display = 'none';
  TRANSITION_CLASSES.forEach((c) => { compose.classList.remove(c); weave.classList.remove(c); });
  compose.style.display = 'flex';

  gallery.classList.add('mode-fade-out');
  setTimeout(() => {
    gallery.style.display = 'none';
    gallery.classList.remove('mode-fade-out');
    share.style.display = 'flex';
    // resetComposeForm() above already tried this, but #shareViewport was
    // still display:none at that point — a scrollTop write on an element
    // with no layout box (display:none, self or ancestor) is a silent
    // no-op, so it has to happen again now that it's actually visible.
    const composeScroll = document.querySelector('#stepCompose .compose-scroll');
    if (composeScroll) composeScroll.scrollTop = 0;
    share.classList.add('mode-fade-out'); // reuse as this element's own "not yet visible" state
    void share.offsetWidth; // force reflow before clearing it, so the fade-in actually transitions
    share.classList.remove('mode-fade-out');
  }, CONFIG.MODE_SWAP_MS);
}

function exitShareMode() {
  if (!isShareMode) return;
  isShareMode = false;

  document.getElementById('sidebarFooter').classList.remove('is-hidden-in-share');

  const gallery = document.getElementById('feedMain');
  const share = document.getElementById('shareViewport');

  share.classList.add('mode-fade-out');
  setTimeout(() => {
    share.style.display = 'none';
    share.classList.remove('mode-fade-out');

    flushPendingSharedCards();

    gallery.style.display = 'block';
    gallery.classList.add('mode-fade-out');
    void gallery.offsetWidth;
    gallery.classList.remove('mode-fade-out');
    // resurface the top floor, where the hero (and a newly shared card's
    // slide within it — renderDiscover() inside flushPendingSharedCards already
    // reset heroIndex to 0) lives
    goToFloor(0, { instant: true });
  }, CONFIG.MODE_SWAP_MS);

  scheduleResumeAutoScroll();
}

function initShareMode() {
  refreshShareText();
  document.getElementById('shareKnowledgeBtn').addEventListener('click', enterShareMode);
  document.getElementById('shareCloseBtn').addEventListener('click', exitShareMode);
  document.getElementById('doneBtn').addEventListener('click', exitShareMode);
}

/* ======================================================================
   10. Page-to-page transitions — a shared veil + soft recede, used when
   actually leaving this document (loom_lobby.html); share mode above stays
   entirely in-page and never touches this.
   ====================================================================== */
function initPageTransitions() {
  const veil = document.getElementById('pageVeil');
  const appEl = document.getElementById('app');

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      veil.classList.add('is-hidden');
      appEl.classList.remove('is-transitioning');
    });
  });

  document.querySelectorAll('a[href$=".html"]').forEach((a) => {
    if (a.target === '_blank') return;
    a.addEventListener('click', (e) => {
      if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
      const href = a.getAttribute('href');
      if (!href) return;
      e.preventDefault();
      veil.classList.remove('is-hidden');
      appEl.classList.add('is-transitioning');
      setTimeout(() => { window.location.href = href; }, 420);
    });
  });
}
